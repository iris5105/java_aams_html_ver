<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAMS 자산관리</title>
    <!-- Google Fonts Pretendard & Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js for Dual Axis Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Tabulator Data Grid (Light Theme) -->
    <link rel="stylesheet" th:href="@{/css/tabulator.min.css}" href="/css/tabulator.min.css">
    <script th:src="@{/js/tabulator.min.js}" src="/js/tabulator.min.js"></script>
    <!-- Unified Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
    <!-- Common & Specialized JavaScript Modules -->
    <script th:src="@{/js/common.js}" src="/js/common.js"></script>
    <script th:src="@{/js/f_dddwctl.js}" src="/js/f_dddwctl.js"></script>
    <script th:src="@{/js/tab_manager.js}" src="/js/tab_manager.js"></script>
    <script th:src="@{/js/filter.js}" src="/js/filter.js"></script>
    <script th:src="@{/js/aams_calendar.js}" src="/js/aams_calendar.js"></script>
    <script th:src="@{/js/home_chart.js}" src="/js/home_chart.js"></script>
    <script th:src="@{/js/home_data.js}" src="/js/home_data.js"></script>
</head>
<body>

    <!-- 1. Top Navigation Bar (Common Fragment) -->
    <header th:replace="~{fragments/menu/header :: topHeader}"></header>

    <!-- App Body (Sidebar + 6 Panels) -->
    <div class="app-body">

        <!-- 2. Left Menu Tree Sidebar (Common Fragment) -->
        <aside th:replace="~{fragments/menu/sidebar :: leftSidebar}"></aside>

        <!-- 3. Workspace Tabbed MDI Container -->
        <main class="workspace mdi-workspace">
            
            <!-- Tab Navigation Bar (Max 10 Tabs) -->
            <div class="tab-bar-container" id="tabBarContainer">
                <div class="tab-bar" id="tabBar">
                    <!-- Dynamic Tabs loaded via TabManager -->
                </div>
                <div class="tab-bar-actions">
                    <button class="btn-close-all" id="btnCloseAllTabs" onclick="tabManager.closeAllTabs()" title="열려있는 모든 탭 닫기" style="display: none;">
                        <i class="fa-solid fa-rectangle-xmark"></i> 모두 닫기
                    </button>
                </div>
            </div>

            <!-- Main Default Workspace Home View (Shown ONLY when 0 tabs open) -->
            <div class="home-workspace-pane" id="homeWorkspacePane" style="display: block;">
                <div class="workspace-grid-6">
                        <!-- Card 1 (Top-Left): 공모기본정보 (dw_4 / d_home04) -->
                        <section class="pb-panel">
                <div class="panel-header">
                    <span class="panel-title"><i class="fa-solid fa-square-poll-vertical panel-title-badge"></i> 공모기본정보</span>
                    <div class="panel-actions">
                        <button class="panel-btn" title="새로고침" onclick="loadPublicStocks()"><i class="fa-solid fa-rotate"></i></button>
                    </div>
                </div>
                <div class="panel-body">
                    <div id="grid-public-stocks" class="tabulator-dw-grid"></div>
                </div>
            </section>

            <!-- Card 2 (Top-Middle): 수요예측참여내역(최근1개월) (dw_5 / d_home05) -->
            <section class="pb-panel">
                <div class="panel-header">
                    <span class="panel-title"><i class="fa-solid fa-chart-line panel-title-badge"></i> 수요예측참여내역(최근1개월)</span>
                    <div class="panel-actions">
                        <button class="panel-btn" onclick="loadSubscriptions()"><i class="fa-solid fa-rotate"></i></button>
                    </div>
                </div>
                <div class="panel-body">
                    <div id="grid-subscriptions" class="tabulator-dw-grid"></div>
                </div>
            </section>

            <!-- Card 3 (Top-Right): 시스템 개발 및 수정의뢰 현황 (dw_6 / d_home06) -->
            <section class="pb-panel">
                <div class="panel-header">
                    <span class="panel-title"><i class="fa-solid fa-code-branch panel-title-badge"></i> 시스템 개발 및 수정의뢰 현황</span>
                    <div class="panel-actions">
                        <button class="panel-btn" onclick="loadProposals()"><i class="fa-solid fa-rotate"></i></button>
                    </div>
                </div>
                <div class="panel-body">
                    <div id="grid-proposals" class="tabulator-dw-grid"></div>
                </div>
            </section>

            <!-- Card 4 (Bottom-Left): 당일거래현황 (dw_1 / d_home01) -->
            <section class="pb-panel">
                <div class="panel-header">
                    <span class="panel-title"><i class="fa-solid fa-list-check panel-title-badge"></i> 당일거래현황</span>
                    <div class="panel-actions">
                        <button class="panel-btn" onclick="loadDayTr()"><i class="fa-solid fa-rotate"></i></button>
                    </div>
                </div>
                <div class="panel-body">
                    <div id="grid-daytr" class="tabulator-dw-grid"></div>
                </div>
            </section>

            <!-- Card 5 (Bottom-Middle): 당월결산계좌LIST | 당월이자(만기) (dw_2 / dw_3) -->
            <section class="pb-panel">
                <div class="panel-tabs">
                    <div class="panel-tab-item active" onclick="switchSubTab('gyulTab', this)">당월결산계좌LIST</div>
                    <div class="panel-tab-item" onclick="switchSubTab('rateTab', this)">당월이자(만기)</div>
                </div>
                <div class="panel-body">
                    <!-- Tab 1: dw_2 -->
                    <div id="gyulTab" style="height: 100%;">
                        <div id="grid-gyul" class="tabulator-dw-grid"></div>
                    </div>
                    <!-- Tab 2: dw_3 -->
                    <div id="rateTab" style="display:none; height: 100%;">
                        <div id="grid-rate" class="tabulator-dw-grid"></div>
                    </div>
                </div>
            </section>

                        <!-- Card 6 (Bottom-Right) -->
                        <section class="pb-panel">
                            <div class="panel-header">
                                <span class="panel-title"><i class="fa-solid fa-chart-column panel-title-badge"></i> 순자산 및 계좌현황</span>
                                <div class="panel-actions">
                                    <button class="panel-btn" title="차트 형태 설정 (관리자)" th:if="${adminYn == 'Y'}" onclick="openChartConfigModal()"><i class="fa-solid fa-gear"></i></button>
                                    <button class="panel-btn" title="새로고침" onclick="loadDualChart()"><i class="fa-solid fa-rotate"></i></button>
                                </div>
                            </div>
                            <div class="panel-body">
                                <div class="chart-box" style="position: relative; display: flex; flex-direction: column; height: 100%;">
                                    <!-- Top Y-Axis Headers Header Bar matching DW style -->
                                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 2px 4px 4px 4px; font-size: 11px; font-weight: bold; color: #334155;">
                                        <span style="background-color: #f1f5f9; padding: 1px 8px; border-radius: 2px; color: #1e293b;">순자산(억)</span>
                                        <span style="background-color: #f1f5f9; padding: 1px 8px; border-radius: 2px; color: #1e293b;">계좌수</span>
                                    </div>
                                    <div style="position: relative; flex: 1; min-height: 0;">
                                        <canvas id="dualChart"></canvas>
                                        <div id="dualChartNoData" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; align-items: center; justify-content: center; color: #94a3b8; font-size: 13px; pointer-events: none;">데이터 없음</div>
                                    </div>
                                </div>
                            </div>
                        </section>

                    </div> <!-- End workspace-grid-6 -->
            </div> <!-- End homeWorkspacePane -->

            <!-- Tab Content Container for Dynamic Open Tab Views -->
            <div class="tab-content-container" id="tabContentContainer" style="display: none;">
            </div>

        </main>
    </div>

    <!-- Page Initialization Script -->
    <script th:inline="javascript">
        window.currentCorpGr = /*[[${corpGr}]]*/ '';

        document.addEventListener("DOMContentLoaded", function() {
            initDualChart();
            loadDualChart();

            // Initial API fetch for all 6 sections
            loadPublicStocks();
            loadSubscriptions();
            loadProposals();
            loadDayTr();
            loadGyulAccounts();
            loadRateChanges();
        });
    </script>

    <!-- Company Switch Modal Window (Common Fragment) -->
    <div th:replace="~{fragments/modal/company_modal :: companyModal}"></div>

    <!-- Chart Configuration Modal Window (Admin Only Fragment) -->
    <div th:replace="~{fragments/modal/chart_modal :: chartConfigModal}"></div>

    <!-- Access Token Extension Modal Window Fragment -->
    <div th:replace="~{fragments/modal/token_modal :: tokenExtendModal}"></div>
</body>
</html>

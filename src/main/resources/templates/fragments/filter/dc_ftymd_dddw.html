<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- From-To Date + 1 DDDW Filter (dc_ftymd_dddw) -->
    <div th:fragment="filter" class="filter-bar filter-dc-ftymd-dddw">
        <div class="filter-item">
            <label for="filterFYmd" th:text="${labelFYmd != null ? labelFYmd : '조회기간'}">조회기간</label>
            <div class="range-calendar-wrapper">
                <input type="text" id="filterFYmd" name="fYmd" class="filter-input range-calendar-input" th:value="${fYmd != null ? fYmd : ''}" readonly autocomplete="off" />
                <span class="range-calendar-separator">~</span>
                <input type="text" id="filterTYmd" name="tYmd" class="filter-input range-calendar-input" th:value="${tYmd != null ? tYmd : ''}" readonly autocomplete="off" />
                <button type="button" class="btn-range-calendar" title="기간 선택 달력" onclick="AamsCalendar.toggleRange('filterFYmd_filterTYmd')">
                    <i class="fa-regular fa-calendar-days"></i>
                </button>
            </div>
        </div>
        <div class="filter-item">
            <label for="filterDddw" th:text="${labelDddw != null ? labelDddw : '구분'}">구분</label>
            <select id="filterDddw" name="dddw" class="filter-select">
                <option value="">전체</option>
            </select>
        </div>
    </div>
</body>
</html>

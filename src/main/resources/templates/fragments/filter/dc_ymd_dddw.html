<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Single Date + DDDW Filter (dc_ymd_dddw) -->
    <div th:fragment="filter" class="filter-bar filter-dc-ymd-dddw">
        <div class="filter-item">
            <label for="filterYmd">조회일자</label>
            <input type="date" id="filterYmd" name="ymd" class="filter-input input-date" th:value="${ymd}"/>
        </div>
        <div class="filter-item">
            <label for="filterDddw">구분</label>
            <select id="filterDddw" name="dddw" class="filter-select">
                <option value="">전체</option>
            </select>
        </div>
    </div>
</body>
</html>

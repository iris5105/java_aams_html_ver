<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- From-To Date + 3 DDDWs Filter (dc_ftymd_dddw3) -->
    <div th:fragment="filter" class="filter-bar filter-dc-ftymd-dddw3">
        <div class="filter-item">
            <label for="filterFYmd" th:text="${labelFYmd != null ? labelFYmd : '조회기간'}">조회기간</label>
            <div class="range-calendar-wrapper">
                <input type="text" id="filterFYmd" name="fYmd" class="filter-input range-calendar-input" th:value="${fYmd != null ? fYmd : ''}" readonly autocomplete="off" />
                <span class="range-calendar-separator">~</span>
                <input type="text" id="filterTYmd" name="tYmd" class="filter-input range-calendar-input" th:value="${tYmd != null ? tYmd : ''}" readonly autocomplete="off" />
                <button type="button" class="btn-range-calendar" title="기간 선택 달력" onclick="AamsCalendar.toggleRange('filterFYmd_filterTYmd')">
                    <i class="fa-regular fa-calendar-days"></i>
                </button>
            </div>
        </div>
        <div class="filter-item">
            <label for="filterDddw1" th:text="${labelDddw1 != null ? labelDddw1 : '구분1'}">구분1</label>
            <select id="filterDddw1" name="dddw1" class="filter-select">
                <option value="">전체</option>
            </select>
        </div>
        <div class="filter-item">
            <label for="filterDddw2" th:text="${labelDddw2 != null ? labelDddw2 : '구분2'}">구분2</label>
            <select id="filterDddw2" name="dddw2" class="filter-select">
                <option value="">전체</option>
            </select>
        </div>
        <div class="filter-item">
            <label for="filterDddw3" th:text="${labelDddw3 != null ? labelDddw3 : '구분3'}">구분3</label>
            <select id="filterDddw3" name="dddw3" class="filter-select">
                <option value="">전체</option>
            </select>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- From-To Date Filter (dc_ftymd) -->
    <div th:fragment="filter" class="filter-bar filter-dc-ftymd">
        <div class="filter-item">
            <label for="filterFYmd" th:text="${label != null ? label : (labelFYmd != null ? labelFYmd : '조회기간')}">조회기간</label>
            <div class="range-calendar-wrapper">
                <input type="text" id="filterFYmd" name="fYmd" class="filter-input range-calendar-input" th:value="${fYmd != null ? fYmd : ''}" readonly autocomplete="off" />
                <span class="range-calendar-separator">~</span>
                <input type="text" id="filterTYmd" name="tYmd" class="filter-input range-calendar-input" th:value="${tYmd != null ? tYmd : ''}" readonly autocomplete="off" />
                <button type="button" class="btn-range-calendar" title="기간 선택 달력" onclick="AamsCalendar.toggleRange('filterFYmd_filterTYmd')">
                    <i class="fa-regular fa-calendar-days"></i>
                </button>
            </div>
        </div>
    </div>
</body>
</html>

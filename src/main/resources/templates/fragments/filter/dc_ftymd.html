<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- From-To Date Filter (dc_ftymd) -->
    <div th:fragment="filter" class="filter-bar filter-dc-ftymd">
        <div class="filter-item">
            <label for="filterFYmd" th:text="${label != null ? label : (labelFYmd != null ? labelFYmd : '조회기간')}">조회기간</label>
            <input type="date" id="filterFYmd" name="fYmd" class="filter-input input-date" th:value="${fYmd}"/>
            <span class="filter-separator">~</span>
            <input type="date" id="filterTYmd" name="tYmd" class="filter-input input-date" th:value="${tYmd}"/>
        </div>
    </div>
</body>
</html>

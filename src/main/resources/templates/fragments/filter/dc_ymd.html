<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Single Date Filter (dc_ymd) -->
    <div th:fragment="filter" class="filter-bar filter-dc-ymd">
        <div class="filter-item">
            <label for="filterYmd" th:text="${label != null ? label : (labelYmd != null ? labelYmd : '일자')}">일자</label>
            <input type="date" id="filterYmd" name="ymd" class="filter-input input-date" th:value="${ymd}"/>
        </div>
    </div>
</body>
</html>

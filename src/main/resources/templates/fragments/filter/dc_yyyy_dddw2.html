<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Year + 2 DDDWs Filter (dc_yyyy_dddw2) -->
    <div th:fragment="filter" class="filter-bar filter-dc-yyyy-dddw2">
        <div class="filter-item">
            <label for="filterYyyy" th:text="${labelYyyy != null ? labelYyyy : '조회년도'}">조회년도</label>
            <input type="number" id="filterYyyy" name="yyyy" class="filter-input input-year" min="2000" max="2099" step="1" th:value="${yyyy != null ? yyyy : #dates.format(#dates.createNow(), 'yyyy')}"/>
        </div>
        <div class="filter-item">
            <label for="filterDddw1" th:text="${labelDddw1 != null ? labelDddw1 : '구분1'}">구분1</label>
            <select id="filterDddw1" name="dddw1" class="filter-select">
                <option value="">전체</option>
            </select>
        </div>
        <div class="filter-item">
            <label for="filterDddw2" th:text="${labelDddw2 != null ? labelDddw2 : '구분2'}">구분2</label>
            <select id="filterDddw2" name="dddw2" class="filter-select">
                <option value="">전체</option>
            </select>
        </div>
    </div>
</body>
</html>

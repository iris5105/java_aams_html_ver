<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- YearMonth + 3 DDDWs Filter (dc_ym_dddw3) -->
    <div th:fragment="filter" class="filter-bar filter-dc-ym-dddw3">
        <div class="filter-item">
            <label for="filterYm">년월</label>
            <input type="month" id="filterYm" name="ym" class="filter-input input-month" th:value="${ym}"/>
        </div>
        <div class="filter-item">
            <label for="filterDddw1">구분1</label>
            <select id="filterDddw1" name="dddw1" class="filter-select">
                <option value="">전체</option>
            </select>
        </div>
        <div class="filter-item">
            <label for="filterDddw2">구분2</label>
            <select id="filterDddw2" name="dddw2" class="filter-select">
                <option value="">전체</option>
            </select>
        </div>
        <div class="filter-item">
            <label for="filterDddw3">구분3</label>
            <select id="filterDddw3" name="dddw3" class="filter-select">
                <option value="">전체</option>
            </select>
        </div>
    </div>
</body>
</html>

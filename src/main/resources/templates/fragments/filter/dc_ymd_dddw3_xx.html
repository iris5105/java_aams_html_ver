<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Single Date + 3 DDDWs + Extra Filter (dc_ymd_dddw3_xx) -->
    <div th:fragment="filter" class="filter-bar filter-dc-ymd-dddw3-xx">
        <div class="filter-item">
            <label for="filterYmd" th:text="${labelYmd != null ? labelYmd : (label != null ? label : '조회일자')}">조회일자</label>
            <input type="date" id="filterYmd" name="ymd" class="filter-input input-date" th:value="${ymd}"/>
        </div>
        <div class="filter-item">
            <label for="filterDddw1" th:text="${labelDddw1 != null ? labelDddw1 : '구분1'}">구분1</label>
            <select id="filterDddw1" name="dddw1" class="filter-select">
                <option value="">전체</option>
            </select>
        </div>
        <div class="filter-item">
            <label for="filterDddw2" th:text="${labelDddw2 != null ? labelDddw2 : '구분2'}">구분2</label>
            <select id="filterDddw2" name="dddw2" class="filter-select">
                <option value="">전체</option>
            </select>
        </div>
        <div class="filter-item">
            <label for="filterDddw3" th:text="${labelDddw3 != null ? labelDddw3 : '구분3'}">구분3</label>
            <select id="filterDddw3" name="dddw3" class="filter-select">
                <option value="">전체</option>
            </select>
        </div>
        <div class="filter-item">
            <label for="filterXx" th:text="${labelXx != null ? labelXx : '상세조건'}">상세조건</label>
            <input type="text" id="filterXx" name="xx" class="filter-input" placeholder="검색어 입력"/>
        </div>
    </div>
</body>
</html>

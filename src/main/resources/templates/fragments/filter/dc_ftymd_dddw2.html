<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- From-To Date + 2 DDDWs Filter (dc_ftymd_dddw2) -->
    <div th:fragment="filter" class="filter-bar filter-dc-ftymd-dddw2">
        <div class="filter-item">
            <label for="filterFYmd" th:text="${labelFYmd != null ? labelFYmd : '조회기간'}">조회기간</label>
            <input type="date" id="filterFYmd" name="fYmd" class="filter-input input-date" th:value="${fYmd}"/>
            <span class="filter-separator">~</span>
            <input type="date" id="filterTYmd" name="tYmd" class="filter-input input-date" th:value="${tYmd}"/>
        </div>
        <div class="filter-item">
            <label for="filterDddw1" th:text="${labelDddw1 != null ? labelDddw1 : '구분1'}">구분1</label>
            <select id="filterDddw1" name="dddw1" class="filter-select">
                <option value="">전체</option>
            </select>
        </div>
        <div class="filter-item">
            <label for="filterDddw2" th:text="${labelDddw2 != null ? labelDddw2 : '구분2'}">구분2</label>
            <select id="filterDddw2" name="dddw2" class="filter-select">
                <option value="">전체</option>
            </select>
        </div>
    </div>
</body>
</html>

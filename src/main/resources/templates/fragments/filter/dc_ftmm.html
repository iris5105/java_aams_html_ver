<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- From-To Month Filter (dc_ftmm) -->
    <div th:fragment="filter" class="filter-bar filter-dc-ftmm">
        <div class="filter-item">
            <label for="filterFMm" th:text="${label != null ? label : (labelFMm != null ? labelFMm : '조회월')}">조회월</label>
            <input type="month" id="filterFMm" name="fMm" class="filter-input input-month" th:value="${fMm}"/>
            <span class="filter-separator">~</span>
            <input type="month" id="filterTMm" name="tMm" class="filter-input input-month" th:value="${tMm}"/>
        </div>
    </div>
</body>
</html>

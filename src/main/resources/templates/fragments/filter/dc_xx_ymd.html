<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Extra Condition + Single Date Filter (dc_xx_ymd) -->
    <div th:fragment="filter" class="filter-bar filter-dc-xx-ymd">
        <div class="filter-item">
            <label for="filterXx">조회조건</label>
            <select id="filterXx" name="xx" class="filter-select">
                <option value="">전체</option>
            </select>
        </div>
        <div class="filter-item">
            <label for="filterYmd">조회일자</label>
            <input type="date" id="filterYmd" name="ymd" class="filter-input input-date" th:value="${ymd}"/>
        </div>
    </div>
</body>
</html>

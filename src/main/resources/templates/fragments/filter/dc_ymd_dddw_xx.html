<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Single Date + DDDW + Extra Dynamic Code Search Filter (dc_ymd_dddw_xx: AamsCalendar & DynamicCodeSearch 규격) -->
    <div th:fragment="filter" class="filter-bar filter-dc-ymd-dddw-xx">
        <div class="filter-item" style="position: relative; display: flex; align-items: center; gap: 6px;">
            <label for="filterYmd" th:text="${labelYmd != null ? labelYmd : (label != null ? label : '조회일자')}">조회일자</label>
            <div class="aams-calendar-wrapper" style="position: relative; display: inline-flex; align-items: center;">
                <input type="text" id="filterYmd" name="ymd" class="t-input aams-calendar-input" style="width: 110px; padding: 4px 8px; font-size: 13px; text-align: center; border: 1px solid #cbd5e1; border-radius: 4px 0 0 4px; cursor: pointer; background: #ffffff;" th:value="${ymd != null ? ymd : ''}" readonly autocomplete="off" />
                <button type="button" class="t-btn btn-calendar" title="달력 열기" style="padding: 5px 10px; border-radius: 0 4px 4px 0; border-left: none; background-color: #3b82f6; color: #ffffff; border: 1px solid #3b82f6; cursor: pointer;" onclick="AamsCalendar.toggle('filterYmd', event)">
                    <i class="fa-regular fa-calendar-days"></i>
                </button>
            </div>
        </div>
        <div class="filter-item">
            <label for="filterDddw" th:text="${labelDddw != null ? labelDddw : '구분'}">구분</label>
            <select id="filterDddw" name="dddw" class="filter-select">
                <option value="">전체</option>
            </select>
        </div>
        <div class="filter-item filter-code-search-item">
            <label for="filterXx" th:text="${labelXx != null ? labelXx : '조회조건'}">조회조건</label>
            <div class="code-search-input-wrapper">
                <input type="text" id="filterXx" name="xx" class="filter-input code-search-input" autocomplete="off"
                       th:attr="data-column-nm=${columnNm != null ? columnNm : 'rcd'}, data-seq=${seq != null ? seq : 4}" />
                <button type="button" class="btn-code-search" id="btnCodeSearchXx" title="코드 검색"
                        th:attr="data-column-nm=${columnNm != null ? columnNm : 'rcd'}, data-seq=${seq != null ? seq : 4}">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
            <span class="code-search-name" id="textXxName"></span>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- DDDW + YearMonth Filter (dc_dddw_ym) -->
    <div th:fragment="filter" class="filter-bar filter-dc-dddw-ym">
        <div class="filter-item">
            <label for="filterDddw">구분</label>
            <select id="filterDddw" name="dddw" class="filter-select">
                <option value="">전체</option>
            </select>
        </div>
        <div class="filter-item">
            <label for="filterYm">년월</label>
            <input type="month" id="filterYm" name="ym" class="filter-input input-month" th:value="${ym}"/>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- From-To Date + DDDW + Extra Filter (dc_ftymd_dddw_xx) -->
    <div th:fragment="filter" class="filter-bar filter-dc-ftymd-dddw-xx">
        <div class="filter-item">
            <label for="filterFYmd" th:text="${labelFYmd != null ? labelFYmd : '조회기간'}">조회기간</label>
            <input type="date" id="filterFYmd" name="fYmd" class="filter-input input-date" th:value="${fYmd}"/>
            <span class="filter-separator">~</span>
            <input type="date" id="filterTYmd" name="tYmd" class="filter-input input-date" th:value="${tYmd}"/>
        </div>
        <div class="filter-item">
            <label for="filterDddw" th:text="${labelDddw != null ? labelDddw : '구분'}">구분</label>
            <select id="filterDddw" name="dddw" class="filter-select">
                <option value="">전체</option>
            </select>
        </div>
        <div class="filter-item">
            <label for="filterXx" th:text="${labelXx != null ? labelXx : '상세조건'}">상세조건</label>
            <input type="text" id="filterXx" name="xx" class="filter-input" placeholder="검색어 입력"/>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- 1. Common Toolbar Buttons (닫기 버튼 분리 div + 액션 버튼 toolbar-buttons div) -->
    <div th:fragment="toolbarButtons" class="toolbar-button-group">
        <div class="toolbar-close-wrap">
            <button class="t-btn btn-close" title="닫기" aria-label="닫기" onclick="onToolbarClose(this)"><i class="fa-solid fa-xmark"></i><span class="btn-text">닫기</span></button>
        </div>
        <div class="toolbar-buttons">
            <button class="t-btn btn-refresh disabled" disabled title="새로고침" aria-label="새로고침" onclick="onToolbarRefresh(this)"><i class="fa-solid fa-rotate"></i><span class="btn-text">새로고침</span></button>
            <button class="t-btn btn-search" title="조회" aria-label="조회" onclick="onToolbarSearch(this)"><i class="fa-solid fa-magnifying-glass"></i><span class="btn-text">조회</span></button>
            <button class="t-btn btn-input disabled" disabled title="입력" aria-label="입력" onclick="onToolbarInput(this)"><i class="fa-solid fa-plus"></i><span class="btn-text">입력</span></button>
            <button class="t-btn btn-copy disabled" disabled title="복사" aria-label="복사" onclick="onToolbarCopy(this)"><i class="fa-solid fa-copy"></i><span class="btn-text">복사</span></button>
            <button class="t-btn btn-delete disabled" disabled title="삭제" aria-label="삭제" onclick="onToolbarDelete(this)"><i class="fa-solid fa-trash"></i><span class="btn-text">삭제</span></button>
            <button class="t-btn btn-save disabled" disabled title="저장" aria-label="저장" onclick="onToolbarSave(this)"><i class="fa-solid fa-floppy-disk"></i><span class="btn-text">저장</span></button>
            <button class="t-btn btn-print disabled" disabled title="인쇄" aria-label="인쇄" onclick="onToolbarPrint(this)"><i class="fa-solid fa-print"></i><span class="btn-text">인쇄</span></button>
            <button class="t-btn btn-excel disabled" disabled title="엑셀" aria-label="엑셀" onclick="onToolbarExcel(this)"><i class="fa-regular fa-file-excel"></i><span class="btn-text">엑셀</span></button>
        </div>
    </div>
    
    <!-- 2. Common Breadcrumb Fragment -->
    <div th:fragment="toolbarBreadcrumb" class="toolbar-right breadcrumb" th:title="${fullpgm2 != null ? fullpgm2 : ''}">
        <i class="fa-solid fa-house"></i> <span class="breadcrumb-text" th:text="${fullpgm2 != null ? fullpgm2 : '사무관리 > 자문일일 > 일위작업 > 1011 계좌계약정보관리 [w_ja010b]'}"></span>
    </div>

    <!-- 3. Common Corp Group Filter (Delegated to common filter module: fragments/filter/corp_filter.html) -->
    <div th:fragment="corpFilter(dddwId, seq, label)" th:replace="~{fragments/filter/corp_filter :: corpFilter(dddwId=${dddwId}, seq=${seq}, label=${label})}"></div>

    <!-- 4. Common Grid Sub-Action Navigator (파워빌더 fw_u_dw2subbtn 동적 마스크 대응 표준 프래그먼트) -->
    <!-- 1) buttons 생략 시: 파워빌더 표준 기본 6종('0011111001': 엑셀, 추가, 복사, 삭제, 첫행, 마지막행) 표출 -->
    <!-- 2) 10자리 마스크 지정 시: '0010001001'(3종), '0011110000'(4종), '0010001111'(5종), '0010000000'(1종), '0011010000'(3종), '0010011001'(4종) 등 정확히 파싱 -->
    <!-- 3) 키워드 지정 시: 'excel,first,last', 'excel,add,copy,del', 'excel,first,prev,next,last', 'excel' 등 지정 버튼만 표출 -->
    <div th:fragment="detailNav(targetGrid, fileName, buttons)" class="grid-nav-group"
         th:attr="data-target-grid=${targetGrid != null ? targetGrid : '#gridDetail'}, data-file-name=${fileName != null ? fileName : '상세목록'}, data-buttons=${buttons != null && buttons != '' ? buttons : '0011111001'}">
        <!-- 3: Excel -->
        <button th:if="${buttons == null || buttons == '' || (buttons.length() == 10 ? (buttons.substring(2, 3) == '1') : (#strings.contains(buttons, 'excel') || #strings.contains(buttons, 'all')))}"
                type="button" class="btn-grid-nav nav-excel" title="엑셀로 저장" onclick="onGridNavExcel(this)"><i class="fa-regular fa-file-excel"></i></button>
        <!-- 4: Add / Input -->
        <button th:if="${buttons == null || buttons == '' || (buttons.length() == 10 ? (buttons.substring(3, 4) == '1') : (#strings.contains(buttons, 'add') || #strings.contains(buttons, 'input') || #strings.contains(buttons, 'all')))}"
                type="button" class="btn-grid-nav nav-add" title="새로운 행 추가" onclick="onGridNavAdd(this)"><i class="fa-solid fa-plus"></i></button>
        <!-- 5: Copy -->
        <button th:if="${buttons == null || buttons == '' || (buttons.length() == 10 ? (buttons.substring(4, 5) == '1') : (#strings.contains(buttons, 'copy') || #strings.contains(buttons, 'all')))}"
                type="button" class="btn-grid-nav nav-copy" title="선택된 행 복사" onclick="onGridNavCopy(this)"><i class="fa-regular fa-copy"></i></button>
        <!-- 6: Delete -->
        <button th:if="${buttons == null || buttons == '' || (buttons.length() == 10 ? (buttons.substring(5, 6) == '1') : (#strings.contains(buttons, 'del') || #strings.contains(buttons, 'delete') || #strings.contains(buttons, 'all')))}"
                type="button" class="btn-grid-nav nav-delete" title="선택된 행 삭제" onclick="onGridNavDelete(this)"><i class="fa-regular fa-trash-can"></i></button>
        <!-- 7: First -->
        <button th:if="${buttons == null || buttons == '' || (buttons.length() == 10 ? (buttons.substring(6, 7) == '1') : (#strings.contains(buttons, 'first') || #strings.contains(buttons, 'all')))}"
                type="button" class="btn-grid-nav nav-first" title="제일 첫 행으로 이동" onclick="onGridNavFirst(this)"><i class="fa-solid fa-backward-step"></i></button>
        <!-- 8: Prior / Prev -->
        <button th:if="${buttons != null && buttons != '' && (buttons.length() == 10 ? (buttons.substring(7, 8) == '1') : (#strings.contains(buttons, 'prev') || #strings.contains(buttons, 'prior') || #strings.contains(buttons, 'all')))}"
                type="button" class="btn-grid-nav nav-prev" title="이전 행으로 이동" onclick="onGridNavPrev(this)"><i class="fa-solid fa-caret-left"></i></button>
        <!-- 9: Next -->
        <button th:if="${buttons != null && buttons != '' && (buttons.length() == 10 ? (buttons.substring(8, 9) == '1') : (#strings.contains(buttons, 'next') || #strings.contains(buttons, 'all')))}"
                type="button" class="btn-grid-nav nav-next" title="다음 행으로 이동" onclick="onGridNavNext(this)"><i class="fa-solid fa-caret-right"></i></button>
        <!-- 10: Last -->
        <button th:if="${buttons == null || buttons == '' || (buttons.length() == 10 ? (buttons.substring(9, 10) == '1') : (#strings.contains(buttons, 'last') || #strings.contains(buttons, 'all')))}"
                type="button" class="btn-grid-nav nav-last" title="제일 마지막 행으로 이동" onclick="onGridNavLast(this)"><i class="fa-solid fa-forward-step"></i></button>
    </div>

</body>
</html>

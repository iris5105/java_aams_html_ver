<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Left Menu Tree Sidebar Fragment -->
<aside class="left-sidebar" th:fragment="leftSidebar">
    <div class="sidebar-search" style="position: relative;">
        <input type="text" id="sidebarSearchInput" class="search-input" placeholder="전체 프로그램 검색 (명칭/번호/ID)" oninput="filterSidebarMenu(this.value)" onfocus="filterSidebarMenu(this.value)" autocomplete="off">
        <div id="sidebarSearchDropdown" class="search-dropdown-list" style="display: none;"></div>
    </div>
    <div class="sidebar-menu" id="sidebarMenuContainer">
        <th:block th:if="${sideMenuList != null and not #lists.isEmpty(sideMenuList)}">
            <div th:each="item : ${sideMenuList}" 
                 class="tree-menu-item" 
                 th:classappend="${(activePgmGo != null and item.pgmGo != null and activePgmGo == item.pgmGo) or (activePgmNo != null and activePgmNo == item.pgmNo)} ? 'active' : ''"
                 th:data-pgm-no="${item.pgmNo}"
                 th:data-pgm-id="${item.pgmId}"
                 th:data-pgm-go="${item.pgmGo}"
                 th:data-title="${item.displayNm}"
                 th:data-top-pgm-no="${activePgmNo != null ? activePgmNo : '00804'}"
                 th:data-breadcrumb="${item.fullpgm2 != null ? item.fullpgm2 : (item.fullpgm != null ? item.fullpgm : item.displayNm)}"
                 onclick="onSidebarMenuClick(this)">
                <i class="fa-regular fa-file-lines menu-icon"></i>
                <span class="menu-label" th:text="${item.displayNm}"></span>
            </div>
        </th:block>
    </div>
    <div class="sidebar-footer">
        <i class="fa-solid fa-cube"></i> AAMS Asset Management
    </div>
</aside>
</html>

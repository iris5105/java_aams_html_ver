<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Left Menu Tree Sidebar Fragment -->
<aside class="left-sidebar" th:fragment="leftSidebar">
    <div class="sidebar-search">
        <input type="text" class="search-input" placeholder="화면 명칭 (번호)">
    </div>
    <div class="sidebar-menu" id="sidebarMenuContainer">
        <th:block th:if="${sideMenuList != null and not #lists.isEmpty(sideMenuList)}">
            <div th:each="item : ${sideMenuList}" class="menu-item" th:data-pgm-no="${item.pgmNo}">
                <i class="fa-solid fa-file-code"></i>
                <span th:text="${item.displayNm}"></span>
            </div>
        </th:block>
    </div>
    <div class="sidebar-footer">
        <i class="fa-solid fa-cube"></i> AAMS System
    </div>
</aside>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Top Navigation Header Fragment -->
<header class="top-header" th:fragment="topHeader">
    <div class="top-header-left">
        <!-- Mobile Sidebar Toggle Button -->
        <button class="mobile-sidebar-toggle" onclick="toggleSidebar()" title="사이드바 메뉴 열기/닫기">
            <i class="fa-solid fa-bars"></i>
        </button>
        <!-- 회사 로고 (투명 PNG & 세련된 구분선) -->
        <div class="top-header-logo" 
             th:onclick="${adminYn != null and #strings.equalsIgnoreCase(adminYn, 'Y')} ? 'openCompanyModal()' : null"
             th:style="${adminYn != null and #strings.equalsIgnoreCase(adminYn, 'Y')} ? 'cursor: pointer;' : null"
             th:title="${adminYn != null and #strings.equalsIgnoreCase(adminYn, 'Y')} ? '회사 변경' : null">
            <img th:src="@{'/img/right_logo/fw_top_logo_right_' + ${corpGr} + '.png'}" src="/img/right_logo/fw_top_logo_right_2200.png" alt="Company Logo" class="top-company-logo" onerror="this.src='/img/right_logo/fw_top_logo_right_2200.png'">
        </div>
        <nav class="top-nav" id="topNavContainer">
            <th:block th:if="${topMenuList != null and not #lists.isEmpty(topMenuList)}">
                <span th:each="menu, iterStat : ${topMenuList}"
                      class="top-nav-item"
                      th:classappend="${(activePgmNo != null and activePgmNo == menu.pgmNo) or (activePgmNo == null and iterStat.first)} ? 'active' : ''"
                      th:data-pgm-no="${menu.pgmNo}"
                      th:text="${menu.pgmNm}"
                      onclick="onHeaderMenuClick(this)">
                </span>
            </th:block>
        </nav>
    </div>
    <!-- 사용자 정보 영역 (우측 배치) -->
    <div class="top-header-right">
        <div class="user-info">
            <div class="user-profile-badge">
                <i class="fa-solid fa-circle-user user-icon"></i>
                <span class="user-name" th:text="${userNm != null ? userNm + ' 님' : ' 님'}"></span>
            </div>
            <div class="user-access-time">
                <span class="access-label">최근 접속</span>
                <span class="access-date" th:text="${lastConnect != null ? lastConnect : today}"></span>
            </div>
            <button onclick="handleLogout()" class="btn-logout" title="로그아웃">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> 로그아웃
            </button>
        </div>
    </div>
</header>
</html>

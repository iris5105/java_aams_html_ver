<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> AAMS 자산관리 - 로그인</title>
    <!-- Favicon (Cube Icon) -->
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" href="/favicon.svg">
    <link rel="alternate icon" type="image/x-icon" th:href="@{/favicon.ico}" href="/favicon.ico">
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <!-- Unified Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
    <div class="login-wrapper">

        <!-- Floating Login Card Container -->
        <div class="login-card">
            <h1 class="login-title-header">Welcome to</h1>
            <div class="system-badge" id="companyLogoContainer">
                <img id="companyLogoImg" src="/img/company_logo/logo_2200.jpg" alt="Company Logo" style="max-height: 38px; vertical-align: middle;" onerror="this.src='/img/company_logo/logo_2200.jpg'">
            </div>

            <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <span class="input-label">아이디</span>
                    <input type="text" id="userId" class="input-field" required placeholder="아이디 입력" th:value="${savedEmail}">
                </div>

                <div class="input-group">
                    <span class="input-label">비밀번호</span>
                    <input type="password" id="password" class="input-field" placeholder="비밀번호 입력">
                </div>

                <div id="errorMsg" class="error-msg"></div>

                <button type="submit" class="btn-login">로 그 인</button>
            </form>
        </div>
    </div>

    <script>
        // AES-128-CBC Cookie Decryptor for ENC_ prefixed cookies
        const CookieCrypto = (function() {
            const KEY_STR = "AamsCookieKey16!";
            const IV_STR  = "AamsCookieIv16!!";
            const S = [
                0x63,0x7c,0x77,0x7b,0xf2,0x6b,0x6f,0xc5,0x30,0x01,0x67,0x2b,0xfe,0xd7,0xab,0x76,
                0xca,0x82,0xc9,0x7d,0xfa,0x59,0x47,0xf0,0xad,0xd4,0xa2,0xaf,0x9c,0xa4,0x72,0xc0,
                0xb7,0xfd,0x93,0x26,0x36,0x3f,0xf7,0xcc,0x34,0xa5,0xe5,0xf1,0x71,0xd8,0x31,0x15,
                0x04,0xc7,0x23,0xc3,0x18,0x96,0x05,0x9a,0x07,0x12,0x80,0xe2,0xeb,0x27,0xb2,0x75,
                0x09,0x83,0x2c,0x1a,0x1b,0x6e,0x5a,0xa0,0x52,0x3b,0xd6,0xb3,0x29,0xe3,0x2f,0x84,
                0x53,0xd1,0x00,0xed,0x20,0xfc,0xb1,0x5b,0x6a,0xcb,0xbe,0x39,0x4a,0x4c,0x58,0xcf,
                0xd0,0xef,0xaa,0xfb,0x43,0x4d,0x33,0x85,0x45,0xf9,0x02,0x7f,0x50,0x3c,0x9f,0xa8,
                0x51,0xa3,0x40,0x8f,0x92,0x9d,0x38,0xf5,0xbc,0xb6,0xda,0x21,0x10,0xff,0xf3,0xd2,
                0xcd,0x0c,0x13,0xec,0x5f,0x97,0x44,0x17,0xc4,0xa7,0x7e,0x3d,0x64,0x5d,0x19,0x73,
                0x60,0x81,0x4f,0xdc,0x22,0x2a,0x90,0x88,0x46,0xee,0xb8,0x14,0xde,0x5e,0x0b,0xdb,
                0xe0,0x32,0x3a,0x0a,0x49,0x06,0x24,0x5c,0xc2,0xd3,0xac,0x62,0x91,0x95,0xe4,0x79,
                0xe7,0xc8,0x37,0x6d,0x8d,0xd5,0x4e,0xa9,0x6c,0x56,0xf4,0xea,0x65,0x7a,0xae,0x08,
                0xba,0x78,0x25,0x2e,0x1c,0xa6,0xb4,0xc6,0xe8,0xdd,0x74,0x1f,0x4b,0xbd,0x8b,0x8a,
                0x70,0x3e,0xb5,0x66,0x48,0x03,0xf6,0x0e,0x61,0x35,0x57,0xb9,0x86,0xc1,0x1d,0x9e,
                0xe1,0xf8,0x98,0x11,0x69,0xd9,0x8e,0x94,0x9b,0x1e,0x87,0xe9,0xce,0x55,0x28,0xdf,
                0x8c,0xa1,0x89,0x0d,0xbf,0xe6,0x42,0x68,0x41,0x99,0x2d,0x0f,0xb0,0x54,0xbb,0x16
            ];
            const Si = [];
            for (let i = 0; i < 256; i++) Si[S[i]] = i;
            const Rcon = [0x00,0x01,0x02,0x04,0x08,0x10,0x20,0x40,0x80,0x1b,0x36];

            function strToBytes(str) {
                const b = [];
                for (let i = 0; i < str.length; i++) b.push(str.charCodeAt(i) & 0xff);
                return b;
            }
            function keyExpansion(key) {
                const w = [];
                for (let i = 0; i < 4; i++) w[i] = (key[4*i] << 24) | (key[4*i+1] << 16) | (key[4*i+2] << 8) | key[4*i+3];
                for (let i = 4; i < 44; i++) {
                    let temp = w[i - 1];
                    if (i % 4 === 0) {
                        temp = ((temp << 8) | (temp >>> 24)) & 0xffffffff;
                        temp = (S[(temp >>> 24) & 0xff] << 24) | (S[(temp >>> 16) & 0xff] << 16) | (S[(temp >>> 8) & 0xff] << 8) | S[temp & 0xff];
                        temp ^= (Rcon[i / 4] << 24);
                    }
                    w[i] = (w[i - 4] ^ temp) >>> 0;
                }
                return w;
            }
            function gmul(a, b) {
                let p = 0;
                for (let counter = 0; counter < 8; counter++) {
                    if ((b & 1) !== 0) p ^= a;
                    const hi = (a & 0x80) !== 0;
                    a = (a << 1) & 0xff;
                    if (hi) a ^= 0x1b;
                    b >>= 1;
                }
                return p;
            }
            function invCipher(input, w) {
                let state = [...input];
                for (let c = 0; c < 4; c++) {
                    const word = w[40 + c];
                    state[c*4] ^= (word >>> 24) & 0xff; state[c*4+1] ^= (word >>> 16) & 0xff; state[c*4+2] ^= (word >>> 8) & 0xff; state[c*4+3] ^= word & 0xff;
                }
                for (let round = 9; round >= 1; round--) {
                    const temp = [...state];
                    state[1] = temp[13]; state[5] = temp[1]; state[9] = temp[5]; state[13] = temp[9];
                    state[2] = temp[10]; state[6] = temp[14]; state[10] = temp[2]; state[14] = temp[6];
                    state[3] = temp[7]; state[7] = temp[11]; state[11] = temp[15]; state[15] = temp[3];
                    for (let i = 0; i < 16; i++) state[i] = Si[state[i]];
                    for (let c = 0; c < 4; c++) {
                        const word = w[round * 4 + c];
                        state[c*4] ^= (word >>> 24) & 0xff; state[c*4+1] ^= (word >>> 16) & 0xff; state[c*4+2] ^= (word >>> 8) & 0xff; state[c*4+3] ^= word & 0xff;
                    }
                    for (let c = 0; c < 4; c++) {
                        const a0 = state[c*4], a1 = state[c*4+1], a2 = state[c*4+2], a3 = state[c*4+3];
                        state[c*4] = gmul(a0, 0x0e) ^ gmul(a1, 0x0b) ^ gmul(a2, 0x0d) ^ gmul(a3, 0x09);
                        state[c*4+1] = gmul(a0, 0x09) ^ gmul(a1, 0x0e) ^ gmul(a2, 0x0b) ^ gmul(a3, 0x0d);
                        state[c*4+2] = gmul(a0, 0x0d) ^ gmul(a1, 0x09) ^ gmul(a2, 0x0e) ^ gmul(a3, 0x0b);
                        state[c*4+3] = gmul(a0, 0x0b) ^ gmul(a1, 0x0d) ^ gmul(a2, 0x09) ^ gmul(a3, 0x0e);
                    }
                }
                const temp = [...state];
                state[1] = temp[13]; state[5] = temp[1]; state[9] = temp[5]; state[13] = temp[9];
                state[2] = temp[10]; state[6] = temp[14]; state[10] = temp[2]; state[14] = temp[6];
                state[3] = temp[7]; state[7] = temp[11]; state[11] = temp[15]; state[15] = temp[3];
                for (let i = 0; i < 16; i++) state[i] = Si[state[i]];
                for (let c = 0; c < 4; c++) {
                    const word = w[c];
                    state[c*4] ^= (word >>> 24) & 0xff; state[c*4+1] ^= (word >>> 16) & 0xff; state[c*4+2] ^= (word >>> 8) & 0xff; state[c*4+3] ^= word & 0xff;
                }
                return state;
            }
            const keyBytes = strToBytes(KEY_STR);
            const ivBytes = strToBytes(IV_STR);
            const expandedKey = keyExpansion(keyBytes);

            function base64UrlDecode(str) {
                let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
                while (b64.length % 4) b64 += '=';
                const binStr = (typeof atob === 'function') ? atob(b64) : '';
                const bytes = [];
                for (let i = 0; i < binStr.length; i++) bytes.push(binStr.charCodeAt(i) & 0xff);
                return bytes;
            }

            return {
                decrypt: function(encryptedText) {
                    if (!encryptedText || typeof encryptedText !== 'string') return encryptedText;
                    if (!encryptedText.startsWith('ENC_')) return encryptedText;
                    try {
                        const cipherBytes = base64UrlDecode(encryptedText.substring(4));
                        if (!cipherBytes || cipherBytes.length === 0 || cipherBytes.length % 16 !== 0) return encryptedText;
                        let prevBlock = [...ivBytes];
                        const plainBytes = [];
                        for (let i = 0; i < cipherBytes.length; i += 16) {
                            const block = cipherBytes.slice(i, i + 16);
                            const decryptedBlock = invCipher(block, expandedKey);
                            for (let b = 0; b < 16; b++) plainBytes.push(decryptedBlock[b] ^ prevBlock[b]);
                            prevBlock = block;
                        }
                        const padLen = plainBytes[plainBytes.length - 1];
                        if (padLen < 1 || padLen > 16) return encryptedText;
                        const unpadded = plainBytes.slice(0, plainBytes.length - padLen);
                        if (typeof TextDecoder !== 'undefined') {
                            return new TextDecoder().decode(new Uint8Array(unpadded));
                        }
                        let res = '';
                        for (let i = 0; i < unpadded.length; i++) res += String.fromCharCode(unpadded[i]);
                        return res;
                    } catch (e) {
                        return encryptedText;
                    }
                }
            };
        })();

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) {
                const rawVal = decodeURIComponent(parts.pop().split(';').shift());
                return (name === 'savedEmail' || name === 'userId') ? CookieCrypto.decrypt(rawVal) : rawVal;
            }
            return null;
        }

        let checkTimeout = null;

        function checkUserRoleAndSetLogo() {
            const userIdInput = document.getElementById('userId');
            if (!userIdInput) return;
            const userId = userIdInput.value.trim();
            const logoImg = document.getElementById('companyLogoImg');
            if (!logoImg) return;

            if (!userId) {
                const savedCorpGr = getCookie('savedCorpGr');
                logoImg.src = savedCorpGr ? `/img/company_logo/logo_${savedCorpGr}.jpg` : '/img/company_logo/logo_2200.jpg';
                return;
            }

            fetch(`/api/auth/check-user-info?userId=${encodeURIComponent(userId)}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.exists) {
                        const adminYn = (data.adminYn || '').toUpperCase();
                        if (adminYn === 'Y') {
                            const savedCorpGr = getCookie('savedCorpGr');
                            if (savedCorpGr) {
                                logoImg.src = `/img/company_logo/logo_${savedCorpGr}.jpg`;
                            }
                        } else if (data.corpGr) {
                            logoImg.src = `/img/company_logo/logo_${data.corpGr}.jpg`;
                        }
                    }
                })
                .catch(err => console.error('Error checking user info:', err));
        }

        document.addEventListener("DOMContentLoaded", function() {
            // Clean up obsolete legacy cookies (admin, corp_gr, user_id)
            document.cookie = "admin=; path=/; max-age=0";
            document.cookie = "corp_gr=; path=/; max-age=0";
            document.cookie = "user_id=; path=/; max-age=0";

            // Check savedEmail cookie if not already populated by SSR
            const userIdInput = document.getElementById('userId');
            if (userIdInput && !userIdInput.value) {
                const savedEmail = getCookie('savedEmail');
                if (savedEmail) {
                    userIdInput.value = savedEmail;
                }
            }

            const savedCorpGr = getCookie('savedCorpGr');
            const logoImg = document.getElementById('companyLogoImg');
            if (logoImg) {
                if (savedCorpGr) {
                    logoImg.src = `/img/company_logo/logo_${savedCorpGr}.jpg`;
                } else {
                    logoImg.src = '/img/company_logo/logo_2200.jpg';
                }
            }

            // Bind input and blur events on userId field
            if (userIdInput) {
                userIdInput.addEventListener('input', function() {
                    clearTimeout(checkTimeout);
                    checkTimeout = setTimeout(checkUserRoleAndSetLogo, 300);
                });
                userIdInput.addEventListener('blur', checkUserRoleAndSetLogo);
                if (userIdInput.value) {
                    checkUserRoleAndSetLogo();
                }
            }

            // Check if token expired parameter exists
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('expired')) {
                alert('로그인 세션이 만료되었거나 토큰이 존재하지 않습니다. 로그인 화면으로 이동합니다.');
                // Clean up URL parameter
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });

        function handleLogin(event) {
            event.preventDefault();
            const userId = document.getElementById('userId').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            if (!userId) {
                alert('아이디를 입력해주세요.');
                return;
            }

            fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    // Store tokens in localStorage
                    localStorage.setItem('accessToken', data.accessToken);
                    localStorage.setItem('refreshToken', data.refreshToken);
                    localStorage.setItem('userId', data.userId);
                    localStorage.setItem('userNm', data.userNm || '');
                    localStorage.setItem('corpGr', data.corpGr);

                    // Expire legacy redundant cookies
                    document.cookie = "admin=; path=/; max-age=0";
                    document.cookie = "corp_gr=; path=/; max-age=0";
                    document.cookie = "user_id=; path=/; max-age=0";

                    if (data.userNm) {
                        document.cookie = "userNm=" + encodeURIComponent(data.userNm) + "; path=/; max-age=2592000";
                    }

                    // Redirect to Home root ("/")
                    window.location.href = '/';
                } else {
                    errorMsg.style.display = 'block';
                    errorMsg.innerText = data.message || '로그인에 실패했습니다.';
                    alert(data.message || '로그인에 실패했습니다.');
                }
            })
            .catch(err => {
                console.error('Login error:', err);
                alert('로그인 처리 중 오류가 발생했습니다.');
            });
        }
    </script>
</body>
</html>

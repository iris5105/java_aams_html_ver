<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-split shm0hj-container" th:fragment="shm0hjView">

    <!-- Top Action Control Bar (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <!-- Reusable Common Toolbar Buttons Fragment (닫기, 새로고침, 조회, 입력, 저장, 엑셀) -->
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
            <button type="button" class="t-btn btn-action" id="btnGenerateInterest" style="background-color: #2563eb; color: #fff; border-color: #1d4ed8;" title="선택된 종목의 구간이자를 생성합니다."><i class="fa-solid fa-calculator"></i> 구간이자생성</button>
        </div>
        <!-- Reusable Common Breadcrumb Fragment -->
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- Filter Bar (Row 2): dc_ymd_dddw fragment -->
    <div class="filter-bar">
        <div class="filter-left">
            <div th:replace="~{fragments/filter/dc_ymd_dddw :: filter(labelYmd='발행기일', labelDddw='현금종류')}"></div>
        </div>
    </div>


    <!-- Split Master-Detail Layout (Vertical Split: Upper Master, Lower Detail) -->
    <div class="layout-split-v split-body" data-split-key="W_SHM0HJ" data-default-ratio="55:45">

        <!-- Upper Master Grid Section (dw_list / d_shm0hj.srd) -->
        <div class="pane-top master-section">
            <div class="pane-header">
                <span><i class="fa-solid fa-coins"></i> ■ 현금 매입(종목) 목록</span>
                <span id="master-count" style="font-size: 11px; color: #64748b; font-weight: normal;">[0건]</span>
            </div>
            <div class="pane-body">
                <div id="master-grid" class="tabulator-aams-grid" style="height: 100%;"></div>
            </div>
        </div>

        <!-- Lower Detail Grid Section (dw_detail / d_shj0ig.srd) -->
        <div class="pane-bottom detail-section">
            <div class="pane-header">
                <span><i class="fa-solid fa-list-ol"></i> ■ <span id="detail-title">종목별 이자구간 상세</span></span>
                <span id="detail-count" style="font-size: 11px; color: #64748b; font-weight: normal;">[0건]</span>
            </div>
            <div class="pane-body">
                <div id="detail-grid" class="tabulator-aams-grid" style="height: 100%;"></div>
            </div>
        </div>

    </div>

    <!-- Inline Script for w_shm0hj View with Tabulator Grids -->
    <script th:inline="javascript">
        (function() {
            const currentScript = document.currentScript;
            const pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;

            let gridMaster = null;
            let gridDetail = null;
            let cudManagerMaster = null;
            let selectedMasterData = null;
            let deletedMasterList = [];

            function formatMoney(val) {
                if (val == null || val === "" || isNaN(val)) return "";
                return Number(val).toLocaleString("ko-KR");
            }

            function formatRate(val) {
                if (val == null || val === "" || isNaN(val)) return "";
                return Number(val).toFixed(4);
            }

            function formatDateVal(val) {
                if (!val) return "";
                const clean = String(val).replace(/\D/g, "");
                if (clean.length === 8) {
                    return clean.substring(0, 4) + "-" + clean.substring(4, 6) + "-" + clean.substring(6, 8);
                }
                return String(val).substring(0, 10);
            }

            // DDDW Option Caches (Populated via ue_dddw_retrieve and f_dddwctl)
            let dddwOptionsMap = {
                filter_dddw: [],
                cash_cd: [],
                sunhu_gb: [],
                sunhu_tax_gb: [],
                pg_cd: []
            };

            function ue_dddw_retrieve(corpGr) {
                const targetCorpGr = corpGr || resolveCorpGr(pane);

                if (typeof window.f_dddwctl !== 'function' || typeof window.f_dddwctl.retrieveMultiple !== 'function') {
                    console.warn("[ue_dddw_retrieve] f_dddwctl is not defined.");
                    return Promise.resolve();
                }

                return window.f_dddwctl.retrieveMultiple({
                    filter_dddw: ['dddw', targetCorpGr, '%,전체,', 5, "sebu_cd<>'90'"],
                    cash_cd: ['cash_cd', targetCorpGr, '', 1, ''],
                    sunhu_gb: ['sunhu_gb', targetCorpGr, '', 2, ''],
                    sunhu_tax_gb: ['sunhu_tax_gb', targetCorpGr, '', 1, ''],
                    pg_cd: ['pg_cd', targetCorpGr, ',,', 2, '']
                }).then(results => {
                    dddwOptionsMap.filter_dddw = results.filter_dddw || [];
                    dddwOptionsMap.cash_cd = results.cash_cd || [];
                    dddwOptionsMap.sunhu_gb = results.sunhu_gb || [];
                    dddwOptionsMap.sunhu_tax_gb = results.sunhu_tax_gb || [];
                    dddwOptionsMap.pg_cd = results.pg_cd || [];

                    // 1. Populate Filter select (#filterDddw)
                    const dddwSelect = pane ? pane.querySelector("#filterDddw") : document.getElementById("filterDddw");
                    if (dddwSelect && dddwOptionsMap.filter_dddw.length > 0) {
                        const prevVal = dddwSelect.value;
                        dddwSelect.innerHTML = dddwOptionsMap.filter_dddw.map(item => {
                            const code = (item.code != null ? item.code : (item.SEBU_CD != null ? item.SEBU_CD : item.cd)) || '';
                            const name = (item.name != null ? item.name : (item.SEBU_CD_NM != null ? item.SEBU_CD_NM : item.dscr)) || code;
                            const displayText = (code && code !== "%") ? `${code} : ${name}` : (name || code);
                            return `<option value="${code}">${displayText}</option>`;
                        }).join("");

                        // 현금종류 기본값: 전체(%) 설정
                        if (prevVal && dddwOptionsMap.filter_dddw.some(x => (x.code || x.cd || x.SEBU_CD) === prevVal)) {
                            dddwSelect.value = prevVal;
                        } else {
                            dddwSelect.value = "%";
                        }

                        // 2-Column DDDW 드롭다운 위젯 적용 (개발지침 Rule 7: 코드, 이름 순 2열 분할 표출)
                        if (typeof window.f_dddwctl === 'function' && typeof window.f_dddwctl.get2ColItemFormatter === 'function') {
                            window.f_dddwctl.get2ColItemFormatter(dddwSelect, dddwOptionsMap.filter_dddw, {
                                codeTitle: "코드",
                                nameTitle: "현금종류명",
                                defaultVal: dddwSelect.value || "%"
                            });
                        }
                    }

                    if (gridMaster) {
                        gridMaster.redraw(true);
                    }
                }).catch(err => {
                    console.error("[ue_dddw_retrieve] Failed to retrieve DDDW options:", err);
                });
            }

            function getDddwOptions(dddwKey) {
                const list = dddwOptionsMap[dddwKey] || [];
                return list.map(item => {
                    const code = (item.code != null ? item.code : (item.SEBU_CD != null ? item.SEBU_CD : (item.cd != null ? item.cd : ''))).toString().trim();
                    const name = (item.name != null ? item.name : (item.SEBU_CD_NM != null ? item.SEBU_CD_NM : (item.dscr != null ? item.dscr : code))).toString().trim();
                    return { 
                        label: name, 
                        value: code,
                        code: code,
                        name: name
                    };
                });
            }

            /**
             * 2-Column Dropdown Item Formatter for Tabulator List Editor (PowerBuilder DDDW Style)
             * Divides dropdown item into 2 columns: [Code] on the left, [Name] on the right, with sticky table header.
             */
            function createDddw2ColFormatter(codeWidth, codeTitle, nameTitle) {
                if (typeof window.f_dddwctl === 'function' && typeof window.f_dddwctl.get2ColItemFormatter === 'function') {
                    return window.f_dddwctl.get2ColItemFormatter(codeWidth, codeTitle, nameTitle);
                }
                return function(label, value, item) {
                    const code = (item && item.code != null) ? item.code : value;
                    const name = (item && item.name != null) ? item.name : label;
                    return `<div class="dddw-2col-row"><span class="dddw-col-code">${code}</span><span class="dddw-col-name">${name}</span></div>`;
                };
            }

            function getDddwLabel(dddwKey, codeVal) {
                if (codeVal == null || codeVal === "") return "";
                if (typeof window.f_dddwctl === 'function' && typeof window.f_dddwctl.getLabel === 'function') {
                    return window.f_dddwctl.getLabel(dddwOptionsMap, dddwKey, codeVal);
                }
                const list = dddwOptionsMap[dddwKey] || [];
                const found = list.find(item => {
                    const c = (item.code != null ? item.code : (item.SEBU_CD != null ? item.SEBU_CD : item.cd));
                    return String(c).trim() === String(codeVal).trim();
                });
                if (found) {
                    return found.name != null ? found.name : (found.SEBU_CD_NM != null ? found.SEBU_CD_NM : found.dscr);
                }
                return String(codeVal);
            }

            // Master row calculation (PowerBuilder uf_com)
            function recalculateMasterRow(row) {
                if (!row) return;
                const d = row.getData();
                const aekm = Number(d.aekm) || 0;
                const iyulPer = Number(d.pyomIyulPer) || 0;
                const iyul = iyulPer / 100.0;

                let balhDate = d.balhYmd ? new Date(d.balhYmd) : null;
                let sanghwDate = d.sanghwYmd ? new Date(d.sanghwYmd) : null;
                let meibDate = d.meibYmd ? new Date(d.meibYmd) : null;

                let dd1 = 0;
                let dd2 = 0;
                if (balhDate && !isNaN(balhDate.getTime())) {
                    if (meibDate && !isNaN(meibDate.getTime())) {
                        dd1 = Math.floor((meibDate.getTime() - balhDate.getTime()) / (1000 * 60 * 60 * 24));
                    }
                    if (sanghwDate && !isNaN(sanghwDate.getTime())) {
                        dd2 = Math.floor((sanghwDate.getTime() - balhDate.getTime()) / (1000 * 60 * 60 * 24));
                    }
                }

                let sungCost = Math.floor((aekm * iyul * dd1) / 365);
                let misuIja = Math.floor((aekm * iyul * dd2) / 365);

                let chuiAek = aekm;
                let trAek = aekm;
                let sanghwAek = aekm;

                const cashCd = d.cashCd || "ZS";
                if (cashCd === '70') {
                    misuIja = 0;
                    sungCost = 0;
                    chuiAek = aekm;
                    trAek = aekm;
                    sanghwAek = aekm;
                } else if (['80', '71', '72'].includes(cashCd)) {
                    chuiAek = aekm;
                    trAek = aekm + sungCost;
                    sanghwAek = aekm + misuIja;
                } else if (cashCd === '50') {
                    misuIja = Math.floor((aekm * iyul * dd2) / 365);
                    chuiAek = aekm;
                    sungCost = Math.floor((aekm * iyul * dd1) / 365);
                } else {
                    const sanghwStr = (d.sanghwYmd || "").replace(/\D/g, "");
                    if (sanghwStr === '20991231') {
                        misuIja = 0;
                        sungCost = 0;
                        sanghwAek = aekm;
                        chuiAek = aekm;
                        trAek = aekm;
                    } else {
                        chuiAek = aekm - misuIja;
                        if (d.sunhuGb === '1') { // 선취
                            sanghwAek = aekm;
                            chuiAek = aekm;
                            trAek = chuiAek - misuIja;
                        } else if (d.sunhuGb === '2') { // 후취
                            sanghwAek = aekm + misuIja;
                            chuiAek = aekm;
                            trAek = chuiAek + sungCost;
                        } else {
                            sanghwAek = aekm;
                        }
                    }
                }

                row.update({
                    sungCost: sungCost,
                    trAek: trAek,
                    chuiAek: chuiAek,
                    sanghwAek: sanghwAek,
                    pyomIyul: iyul,
                    meibSuikRt: iyul,
                    meibSuikRtPer: iyulPer,
                    isUpdated: true
                });
            }

            function handleMasterCellEdited(cell) {
                const row = cell.getRow();
                if (!row) return;
                const field = cell.getField();
                const d = row.getData();
                d.isUpdated = true;

                if (['aekm', 'pyomIyulPer', 'sanghwYmd', 'balhYmd', 'meibYmd', 'cashCd', 'sunhuGb', 'sunhuTaxGb'].includes(field)) {
                    recalculateMasterRow(row);
                }
            }

            // Master grid conditional edit check (신규 행만 수정 허용)
            function isMasterRowEditable(cell) {
                if (!cell) return false;
                const row = typeof cell.getRow === "function" ? cell.getRow() : null;
                if (!row) return false;
                const data = row.getData();
                return !!(data && (data.isNew === true || data._isNew === true || data.isNewRow === true));
            }

            // Detail grid conditional edit check
            function isDetailRowEditable(cell) {
                if (!cell) return false;
                const row = typeof cell.getRow === "function" ? cell.getRow() : null;
                if (!row) return false;
                const data = row.getData();
                return !!(data && (data.isNew === true || data._isNew === true || data.isNewRow === true));
            }

            // Init Master Grid (d_shm0hj.srd) - Edit settings configured based on tabsequence (New rows only)
            function initMasterGrid() {
                const container = pane ? pane.querySelector("#master-grid") : document.getElementById("master-grid");
                if (!container) return;

                gridMaster = new Tabulator(container, {
                    layout: "fitDataFill",
                    height: "100%",
                    selectableRows: 1,
                    editTriggerEvent: "click",
                    placeholder: "<span>조회 조건 설정 후 [조회] 버튼을 클릭하세요.</span>",
                    columnDefaults: { vertAlign: "middle", headerSortTristate: true },
                    rowFormatter: function(row) {
                        const data = row.getData();
                        if (data && (data.isNew === true || data._isNew === true)) {
                            row.getElement().classList.add("aams-new-row");
                        } else {
                            row.getElement().classList.remove("aams-new-row");
                        }
                    },
                    columns: [
                        // tab=0 (read-only)
                        { title: "No.",
                          formatter: "rownum",
                          hozAlign: "center",
                          width: 45, 
                          resizable: false, 
                          frozen: true 
                        },
                        // tab=10 (dddw)
                        { 
                            title: "현금종류", 
                            field: "cashCd", 
                            hozAlign: "center", 
                            width: 80,
                            formatter: cell => getDddwLabel('cash_cd', cell.getValue()) || cell.getValue() || '',
                            editor: "list",
                            cellClick: aamsCellEdit,
                            editorParams: {
                                valuesLookup: () => getDddwOptions('cash_cd'),
                                autocomplete: false,
                                listOnEmpty: true,
                                itemFormatter: createDddw2ColFormatter("코드", "현금종류명")
                            },
                            editable: isMasterRowEditable,
                            cellEdited: handleMasterCellEdited
                        },
                        // tab=20
                        { 
                            title: "관리번호", 
                            headerCssClass: "col-hdr-green",
                            field: "fundCd", 
                            hozAlign: "center", 
                            width: 90,
                            formatter: cell => `<span class="cell-text-green">${cell.getValue() || ''}</span>`,
                            editor: "input",
                            cellClick: aamsCellEdit,
                            editable: isMasterRowEditable,
                            cellEdited: handleMasterCellEdited
                        },
                        // p_xx_fund_cd (Grid Internal Rule 1, 2: Empty column with dynamic search button)
                        {
                            title: "",
                            field: "_btn_fundCd",
                            width: 36,
                            minWidth: 36,
                            maxWidth: 36,
                            hozAlign: "center",
                            headerSort: false,
                            resizable: false,
                            formatter: function(cell) {
                                const isNew = cell.getRow().getData().isNew;
                                const disClass = isNew ? "" : "disabled";
                                return `<button type="button" class="btn-grid-addon btn-search ${disClass}" title="펀드 검색"><i class="fa-solid fa-magnifying-glass"></i></button>`;
                            },
                            cellClick: function(e, cell) {
                                e.stopPropagation();
                                const row = cell.getRow();
                                const data = row.getData();
                                if (!data.isNew && !data._isNew) {
                                    if (gridMaster) { gridMaster.deselectRow(); row.select(); }
                                    return;
                                }
                                const curVal = data.fundCd || "";
                                if (window.DynamicCodeSearch && typeof window.DynamicCodeSearch.openModal === 'function') {
                                    window.DynamicCodeSearch.openModal({
                                        columnNm: "fund_cd",
                                        seq: 1,
                                        initialKeyword: curVal,
                                        onSelect: function(code, name) {
                                            row.update({ fundCd: code, fundNm: name, isUpdated: true });
                                        }
                                    });
                                }
                            }
                        },
                        // tab=32766
                        { 
                            title: "계좌명", 
                            field: "fundNm", 
                            hozAlign: "left", 
                            width: 140,
                            editor: "input",
                            cellClick: aamsCellEdit,
                            editable: isMasterRowEditable,
                            cellEdited: handleMasterCellEdited
                        },
                        // tab=40
                        { 
                            title: "종  목  명", 
                            headerCssClass: "col-hdr-blue",
                            field: "hjNm", 
                            hozAlign: "left", 
                            minWidth: 160,
                            formatter: cell => `<span class="cell-text-blue">${cell.getValue() || ''}</span>`,
                            editor: "input",
                            cellClick: aamsCellEdit,
                            editable: isMasterRowEditable,
                            cellEdited: handleMasterCellEdited
                        },
                        // tab=30 (mask:yyyy.mm.dd)
                        { 
                            title: "발행일", 
                            field: "balhYmd", 
                            hozAlign: "center", 
                            width: 95, 
                            formatter: cell => formatDateVal(cell.getValue()),
                            editor: "input",
                            cellClick: aamsCellEdit,
                            editable: isMasterRowEditable,
                            cellEdited: handleMasterCellEdited
                        },
                        // p_dd_balh_ymd (Grid Internal Rule 3, 4: Empty column with calendar popup button)
                        {
                            title: "",
                            field: "_btn_balhYmd",
                            width: 36,
                            minWidth: 36,
                            maxWidth: 36,
                            hozAlign: "center",
                            headerSort: false,
                            resizable: false,
                            formatter: function(cell) {
                                const isNew = cell.getRow().getData().isNew;
                                const disClass = isNew ? "" : "disabled";
                                return `<button type="button" class="btn-grid-addon btn-cal ${disClass}" title="발행일 선택"><i class="fa-regular fa-calendar-days"></i></button>`;
                            },
                            cellClick: function(e, cell) {
                                e.stopPropagation();
                                const row = cell.getRow();
                                const data = row.getData();
                                if (!data.isNew && !data._isNew) {
                                    if (gridMaster) { gridMaster.deselectRow(); row.select(); }
                                    return;
                                }
                                const curVal = data.balhYmd || "";
                                if (window.AamsCalendar && typeof window.AamsCalendar.openDatePicker === 'function') {
                                    window.AamsCalendar.openDatePicker({
                                        anchorEl: cell.getElement(),
                                        initialYmd: curVal,
                                        format: 'raw',
                                        onSelect: function(rawYmd) {
                                            row.update({ balhYmd: rawYmd, isUpdated: true });
                                            recalculateMasterRow(row);
                                        }
                                    });
                                }
                            }
                        },
                        // tab=50 (mask:yyyy.mm.dd)
                        { 
                            title: "매입일", 
                            headerCssClass: "col-hdr-blue",
                            field: "meibYmd", 
                            hozAlign: "center", 
                            width: 95,
                            formatter: cell => `<span class="cell-text-blue">${formatDateVal(cell.getValue())}</span>`,
                            editor: "input",
                            cellClick: aamsCellEdit,
                            editable: isMasterRowEditable,
                            cellEdited: handleMasterCellEdited
                        },
                        // p_dd_meib_ymd (Grid Internal Rule 3, 4: Empty column with calendar popup button)
                        {
                            title: "",
                            field: "_btn_meibYmd",
                            width: 36,
                            minWidth: 36,
                            maxWidth: 36,
                            hozAlign: "center",
                            headerSort: false,
                            resizable: false,
                            formatter: function(cell) {
                                const isNew = cell.getRow().getData().isNew;
                                const disClass = isNew ? "" : "disabled";
                                return `<button type="button" class="btn-grid-addon btn-cal ${disClass}" title="매입일 선택"><i class="fa-regular fa-calendar-days"></i></button>`;
                            },
                            cellClick: function(e, cell) {
                                e.stopPropagation();
                                const row = cell.getRow();
                                const data = row.getData();
                                if (!data.isNew && !data._isNew) {
                                    if (gridMaster) { gridMaster.deselectRow(); row.select(); }
                                    return;
                                }
                                const curVal = data.meibYmd || "";
                                if (window.AamsCalendar && typeof window.AamsCalendar.openDatePicker === 'function') {
                                    window.AamsCalendar.openDatePicker({
                                        anchorEl: cell.getElement(),
                                        initialYmd: curVal,
                                        format: 'raw',
                                        onSelect: function(rawYmd) {
                                            row.update({ meibYmd: rawYmd, isUpdated: true });
                                            recalculateMasterRow(row);
                                        }
                                    });
                                }
                            }
                        },
                        // tab=90 (mask:yyyy.mm.dd)
                        { 
                            title: "상환일", 
                            headerCssClass: "col-hdr-red",
                            field: "sanghwYmd", 
                            hozAlign: "center", 
                            width: 95,
                            formatter: cell => `<span class="cell-text-red">${formatDateVal(cell.getValue())}</span>`,
                            editor: "input",
                            cellClick: aamsCellEdit,
                            editable: isMasterRowEditable,
                            cellEdited: handleMasterCellEdited
                        },
                        // tab=60
                        { 
                            title: "액면가", 
                            field: "aekm", 
                            hozAlign: "right", 
                            width: 115, 
                            formatter: cell => formatMoney(cell.getValue()),
                            editor: "number",
                            cellClick: aamsCellEdit,
                            editable: isMasterRowEditable,
                            cellEdited: handleMasterCellEdited
                        },
                        // tab=70
                        { 
                            title: "표면이율(%)", 
                            field: "pyomIyulPer", 
                            hozAlign: "right", 
                            width: 90, 
                            formatter: cell => formatRate(cell.getValue()),
                            editor: "number",
                            cellClick: aamsCellEdit,
                            editorParams: { step: 0.0001 },
                            editable: isMasterRowEditable,
                            cellEdited: handleMasterCellEdited
                        },
                        // tab=0 (read-only in srd)
                        { title: "매입수익률(%)", field: "meibSuikRtPer", hozAlign: "right", width: 95, formatter: cell => formatRate(cell.getValue()) },
                        // tab=100
                        { 
                            title: "매매액", 
                            field: "trAek", 
                            hozAlign: "right", 
                            width: 115, 
                            formatter: cell => formatMoney(cell.getValue()),
                            editor: "number",
                            cellClick: aamsCellEdit,
                            editable: isMasterRowEditable,
                            cellEdited: handleMasterCellEdited
                        },
                        // tab=110
                        { 
                            title: "취득액", 
                            field: "chuiAek", 
                            hozAlign: "right", 
                            width: 115, 
                            formatter: cell => formatMoney(cell.getValue()),
                            editor: "number",
                            cellClick: aamsCellEdit,
                            editable: isMasterRowEditable,
                            cellEdited: handleMasterCellEdited
                        },
                        // tab=120
                        { 
                            title: "상환액", 
                            field: "sanghwAek", 
                            hozAlign: "right", 
                            width: 115, 
                            formatter: cell => formatMoney(cell.getValue()),
                            editor: "number",
                            cellClick: aamsCellEdit,
                            editable: isMasterRowEditable,
                            cellEdited: handleMasterCellEdited

            // Load Master List
            function loadMasterList() {
                const corpGr = resolveCorpGr();
                const filterYmd = pane ? pane.querySelector("#filterYmd") : document.getElementById("filterYmd");
                const filterDddw = pane ? pane.querySelector("#filterDddw") : document.getElementById("filterDddw");

                const ymd = filterYmd ? filterYmd.value : "";
                const cashCd = filterDddw ? filterDddw.value : "%";

                if (!corpGr) {
                    if (typeof showToast === 'function') showToast("회사코드를 확인할 수 없습니다.", "warning");
                    else alert("회사코드를 확인할 수 없습니다.");
                    return;
                }
                if (!ymd) {
                    if (typeof showToast === 'function') showToast("조회일자를 선택해주세요.", "warning");
                    else alert("조회일자를 선택해주세요.");
                    return;
                }

                if (cudManagerMaster) cudManagerMaster.reset();
                const url = `/api/shm0hj/master?corpGr=${encodeURIComponent(corpGr)}&ymd=${encodeURIComponent(ymd)}&cashCd=${encodeURIComponent(cashCd)}`;

                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        const countEl = pane ? pane.querySelector("#master-count") : document.getElementById("master-count");
                        if (countEl) countEl.textContent = `[${(data || []).length}건]`;

                        if (gridMaster) {
                            const formatted = cudManagerMaster ? cudManagerMaster.formatData(data || []) : (data || []);
                            gridMaster.setData(formatted).then(() => {
                                if (data && data.length > 0) {
                                    const rows = gridMaster.getRows();
                                    if (rows && rows.length > 0) {
                                        rows[0].select();
                                        selectedMasterData = rows[0].getData();
                                        loadDetailList(selectedMasterData, true);
                                    }
                                } else {
                                    selectedMasterData = null;
                                    lastLoadedMasterKey = "";
                                    if (gridDetail) gridDetail.setData([]);
                                    const detailTitle = pane ? pane.querySelector("#detail-title") : document.getElementById("detail-title");
                                    if (detailTitle) detailTitle.innerHTML = `<i class="fa-solid fa-list-ol"></i> ■ 종목별 이자구간 상세`;
                                    const detailCount = pane ? pane.querySelector("#detail-count") : document.getElementById("detail-count");
                                    if (detailCount) detailCount.textContent = `[0건]`;
                                }
                            });
                        }
                    })
                    .catch(err => {
                        console.error("Master fetch error:", err);
                        if (typeof showToast === 'function') showToast("데이터 조회 중 오류가 발생했습니다.", "error");
                        else alert("데이터 조회 중 오류가 발생했습니다.");
                    });
            }

            let lastLoadedMasterKey = "";

            // Load Detail List for selected Master row
            function loadDetailList(masterData, force = false) {
                if (!masterData) return;
                const corpGr = masterData.corpGr || resolveCorpGr(pane);
                const jmCd = masterData.jmCd || "";

                const detailTitle = pane ? pane.querySelector("#detail-title") : document.getElementById("detail-title");
                if (detailTitle) {
                    detailTitle.innerHTML = `<i class="fa-solid fa-list-ol"></i> ■ [${masterData.hjNm || jmCd}] 종목별 이자구간 상세`;
                }

                if (!jmCd) {
                    if (gridDetail) gridDetail.setData([]);
                    const countEl = pane ? pane.querySelector("#detail-count") : document.getElementById("detail-count");
                    if (countEl) countEl.textContent = "[0건]";
                    return;
                }

                const currentKey = `${corpGr}_${jmCd}`;
                if (!force && lastLoadedMasterKey === currentKey) {
                    return;
                }
                lastLoadedMasterKey = currentKey;

                const url = `/api/shm0hj/detail?corpGr=${encodeURIComponent(corpGr)}&jmCd=${encodeURIComponent(jmCd)}`;

                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        const countEl = pane ? pane.querySelector("#detail-count") : document.getElementById("detail-count");
                        if (countEl) countEl.textContent = `[${(data || []).length}건]`;

                        if (gridDetail) {
                            gridDetail.setData(data || []).then(() => {
                                if (data && data.length > 0) {
                                    const detailRows = gridDetail.getRows();
                                    if (detailRows && detailRows.length > 0) {
                                        detailRows[0].select();
                                    }
                                }
                            });
                        }
                    })
                    .catch(err => {
                        console.error("Detail fetch error:", err);
                    });
            }

            // Generate Period Interest (SR_SHJ0IG)
            function generateInterest() {
                if (!selectedMasterData) {
                    if (typeof showToast === 'function') showToast("구간이자를 생성할 종목을 상단 목록에서 먼저 선택해주세요.", "warning");
                    else alert("구간이자를 생성할 종목을 상단 목록에서 먼저 선택해주세요.");
                    return;
                }

                const corpGr = selectedMasterData.corpGr || resolveCorpGr(pane);
                const jmCd = selectedMasterData.jmCd;
                const hjNm = selectedMasterData.hjNm || jmCd;

                const confirmMsg = `[${hjNm}] 종목의 구간이자를 생성하시겠습니까?\n(기존 이자구간이 있는 경우 삭제 후 재생성됩니다.)`;
                if (!confirm(confirmMsg)) return;

                const formData = new FormData();
                formData.append("corpGr", corpGr);
                formData.append("jmCd", jmCd);

                fetch("/api/shm0hj/generate-interest", {
                    method: "POST",
                    body: formData
                })
                .then(res => res.json())
                .then(result => {
                    if (result && result.success) {
                        if (typeof showToast === 'function') showToast(result.message || "구간이자가 정상적으로 생성되었습니다.", "success");
                        else alert(result.message || "구간이자가 정상적으로 생성되었습니다.");
                        loadDetailList(selectedMasterData, true);
                    } else {
                        if (typeof showToast === 'function') showToast("구간이자 생성 실패: " + (result.message || "오류가 발생했습니다."), "error");
                        else alert("구간이자 생성 실패: " + (result.message || "오류가 발생했습니다."));
                    }
                })
                .catch(err => {
                    console.error("Error generating interest:", err);
                    if (typeof showToast === 'function') showToast("구간이자 생성 요청 처리 중 오류가 발생했습니다.", "error");
                    else alert("구간이자 생성 요청 처리 중 오류가 발생했습니다.");
                });
            }

            // Add New Master Row (PB dw_list::ue_insertstart & itemchanged_next 채번 연동)
            function addNewMasterRow() {
                if (!gridMaster) return;
                const corpGr = resolveCorpGr(pane);
                const filterYmd = pane ? pane.querySelector("#filterYmd") : document.getElementById("filterYmd");
                const filterDddw = pane ? pane.querySelector("#filterDddw") : document.getElementById("filterDddw");
                const ymd = filterYmd ? filterYmd.value : new Date().toISOString().slice(0, 10);
                const cashCd = filterDddw && filterDddw.value !== "%" ? filterDddw.value : "ZS";

                const newRowData = {
                    isNew: true,
                    corpGr: corpGr,
                    cashCd: cashCd,
                    balhYmd: ymd,
                    meibYmd: ymd,
                    sanghwYmd: "2099-12-31",
                    fundCd: "",
                    fundNm: "",
                    jmCd: "",
                    hjNm: "",
                    aekm: null,
                    pyomIyulPer: null,
                    trAek: null,
                    chuiAek: null,
                    sanghwAek: null,
                    meibMkGb: "1",
                    sunhuGb: (cashCd === 'ZS' || cashCd === 'ZF') ? "3" : (cashCd === '10' || cashCd === 'DC' ? "1" : "2"),
                    sunhuTaxGb: "2",
                    ksdJmCd: "",
                    ksdJm5: "",
                    ksdJm8: "1",
                    cdJigubGb: "1",
                    yyIjaHoicha: 1,
                    taxOfferGb: "2",
                    daeyeoGb: "0",
                    pgCd: (cashCd === 'ZS' || cashCd === 'ZF') ? "0211" : ""
                };

                fetch(`/api/shm0hj/next-jm-cd?corpGr=${encodeURIComponent(corpGr)}&ymd=${encodeURIComponent(ymd)}&cashCd=${encodeURIComponent(cashCd)}`)
                    .then(res => res.json())
                    .then(d => {
                        if (d && d.nextJmCd) {
                            newRowData.jmCd = d.nextJmCd;
                        }
                    })
                    .catch(() => {})
                    .finally(() => {
                        const addPromise = cudManagerMaster ? cudManagerMaster.addRow(newRowData, true) : gridMaster.addRow(newRowData, true);
                        addPromise.then(function(newRow) {
                            gridMaster.deselectRow();
                            newRow.select();
                            newRow.scrollTo();
                            selectedMasterData = newRow.getData();
                            if (gridDetail) gridDetail.setData([]);
                            const countEl = pane ? pane.querySelector("#master-count") : document.getElementById("master-count");
                            if (countEl) countEl.textContent = `[${gridMaster.getRows().length}건]`;
                            if (typeof showToast === 'function') showToast("신규 행이 추가되었습니다.", "info");

            }

            // Delete Row
            function handleDelete() {
                if (!gridMaster) return;
                const selectedRows = gridMaster.getSelectedRows();
                if (!selectedRows || selectedRows.length === 0) {
                    if (typeof showToast === 'function') showToast("삭제할 행을 먼저 선택해주세요.", "warning");
                    else alert("삭제할 행을 먼저 선택해주세요.");
                    return;
                }

                if (!confirm("선택한 행을 삭제하시겠습니까? (저장 시 DB에 반영됩니다)")) return;

                selectedRows.forEach(row => {
                    if (cudManagerMaster) {
                        cudManagerMaster.deleteRow(row);
                    } else {
                        row.delete();
                    }
                });

                if (gridDetail) gridDetail.setData([]);
                selectedMasterData = null;
                lastLoadedMasterKey = null;
                const countEl = pane ? pane.querySelector("#master-count") : document.getElementById("master-count");
                if (countEl) countEl.textContent = `[${gridMaster.getRows().length}건]`;
            }

            // Save Master List
            function handleSave() {
                if (!gridMaster) return;
                const corpGr = resolveCorpGr(pane);
                if (!corpGr) {
                    if (typeof showToast === 'function') showToast("회사코드를 확인할 수 없습니다.", "warning");
                    else alert("회사코드를 확인할 수 없습니다.");
                    return;
                }

                const changes = cudManagerMaster ? cudManagerMaster.getChanges() : { inserts: [], updates: [], deletes: [], hasChanges: false };
                const insertList = changes.inserts || [];
                const updateList = changes.updates || [];
                const deleteList = changes.deletes || [];

                if (insertList.length === 0 && updateList.length === 0 && deleteList.length === 0) {
                    if (typeof showToast === 'function') showToast("저장할 변경사항이 없습니다.", "info");
                    else alert("저장할 변경사항이 없습니다.");
                    return;
                }

                for (let i = 0; i < insertList.length; i++) {
                    const d = insertList[i];
                    if (!d.jmCd) {
                        if (typeof showToast === 'function') showToast(`${i + 1}번째 행의 종목코드를 입력해주세요.`, "warning");
                        else alert(`${i + 1}번째 행의 종목코드를 입력해주세요.`);
                        return;
                    }
                }

                if (!confirm(`신규 ${insertList.length}건, 수정 ${updateList.length}건, 삭제 ${deleteList.length}건을 저장하시겠습니까?`)) {
                    return;
                }

                const payload = {
                    corpGr: corpGr,
                    insertList: insertList,
                    updateList: updateList,
                    deleteList: deleteList
                };

                fetch("/api/shm0hj/save", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                })
                .then(res => res.json())
                .then(resData => {
                    if (resData && resData.success) {
                        if (cudManagerMaster) cudManagerMaster.reset();
                        if (typeof showToast === 'function') showToast(resData.message || "저장이 완료되었습니다.", "success");
                        else alert(resData.message || "저장이 완료되었습니다.");
                        loadMasterList();
                    } else {
                        if (typeof showToast === 'function') showToast("저장 실패: " + (resData ? resData.message : "알 수 없는 오류"), "error");
                        else alert("저장 실패: " + (resData ? resData.message : "알 수 없는 오류"));
                    }
                })
                .catch(err => {
                    console.error("Save error:", err);
                    if (typeof showToast === 'function') showToast("저장 중 서버 통신 오류가 발생했습니다.", "error");
                    else alert("저장 중 서버 통신 오류가 발생했습니다.");
                });
            }

            // Event Listeners
            function initEvents() {
                if (pane) {
                    pane.onSearch = loadMasterList;
                    pane.onRetrieve = loadMasterList;
                    pane.onInput = addNewMasterRow;
                    pane.onInsert = addNewMasterRow;
                    pane.onSave = handleSave;
                    pane.onDelete = handleDelete;
                    pane.getNewRowData = function() {
                        return { isNew: true };
                    };
                    pane.onCorpGrChange = function(newCorpGr) {
                        ue_dddw_retrieve(newCorpGr);
                    };
                    pane.onRefresh = function() {
                        if (gridMaster) gridMaster.clearData();
                        if (gridDetail) gridDetail.clearData();
                        if (cudManagerMaster) cudManagerMaster.reset();
                        selectedMasterData = null;
                        lastLoadedMasterKey = null;
                        deletedMasterList = [];

                        const dddwSelect = pane ? pane.querySelector("#filterDddw") : document.getElementById("filterDddw");
                        if (dddwSelect) {
                            dddwSelect.value = "%";
                            const customWrapper = dddwSelect.nextElementSibling;
                            if (customWrapper && customWrapper.classList.contains("dddw-select-custom")) {
                                const labelEl = customWrapper.querySelector(".dddw-select-label");
                                if (labelEl) labelEl.textContent = "전체";
                                customWrapper.querySelectorAll(".tabulator-edit-list-item").forEach(it => {
                                    if (it.dataset.value === "%") {
                                        it.classList.add("active");
                                    } else {
                                        it.classList.remove("active");
                                    }
                                });
                            }
                        }

                        if (typeof showToast === "function") {
                            showToast("화면이 초기화되었습니다.", "info");
                        }
                    };
                }

                const btnInterest = pane ? pane.querySelector("#btnGenerateInterest") : document.getElementById("btnGenerateInterest");
                if (btnInterest) btnInterest.onclick = generateInterest;

                const filterYmd = pane ? pane.querySelector("#filterYmd") : document.getElementById("filterYmd");
                if (filterYmd) {
                    filterYmd.addEventListener("keydown", function(e) {
                        if (e.key === "Enter") loadMasterList();
                    });
                    if (!filterYmd.value) {
                        const now = new Date();
                        const pad = n => String(n).padStart(2, '0');
                        filterYmd.value = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
                    }
                }
            }

            // Pure JS Simple Calendar (Rule 16)
            function initCalendar() {
                if (typeof AamsCalendar !== 'undefined') {
                    const filterYmd = pane ? pane.querySelector("#filterYmd") : document.getElementById("filterYmd");
                    const initialYmd = filterYmd ? filterYmd.value : "";
                    AamsCalendar.initSimple('filterYmd', {
                        pane: pane,
                        initialYmd: initialYmd
                    });
                }
            }

            let isInitialized = false;
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;
                initCalendar();
                ue_dddw_retrieve();
                initMasterGrid();
                initDetailGrid();
                initEvents();
            }

            document.addEventListener("DOMContentLoaded", startInit);
            if (document.readyState === "complete" || document.readyState === "interactive") {
                setTimeout(startInit, 50);
            }
        })();
    </script>
</div>
</html>

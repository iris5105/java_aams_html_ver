<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-single ja020k-container" th:fragment="ja020kView" style="display: flex; flex-direction: column; height: 100%; width: 100%; overflow: hidden;">

    <!-- 1. 상단 공통 툴바 (Row 1: 툴바 버튼 + 네비게이션 브레드크럼) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- 2. 상단 필터바 (Row 2: dc_ymd_dddw 표준 공통 컴포넌트) -->
    <div class="filter-bar">
        <div class="filter-left">
            <th:block th:replace="~{fragments/filter/dc_ymd_dddw :: filter(labelYmd='기준일자', labelDddw='자료구분')}"></th:block>
        </div>
        <div class="filter-actions" style="display: flex; align-items: center; gap: 6px;">
            <!-- 빠른 조회/새로고침 보조 액션 등이 필요할 경우 배치 -->
        </div>
    </div>

    <!-- 3. RD Report Preview Viewer Panel (공통 프래그먼트 연동) -->
    <div class="report-container-panel">
        <div th:replace="~{fragments/report/report_viewer :: reportViewerPane(reportTitle='일(종목)별 운용현황', defaultStatus='조회 대기 중')}"></div>
    </div>
    <script th:inline="javascript">
        (function () {
            var pane = document.currentScript.closest('.tab-pane') || document;
            var initialYmd = /*[[${initialYmd}]]*/ '';
            var serverCorpGr = /*[[${corpGr}]]*/ '';
            var isInitialized = false;
            var reportViewer = null;

            function getFilterCorpGr() {
                if (typeof resolveCorpGr === 'function') {
                    return resolveCorpGr(pane);
                }
                var el = pane.querySelector('#corpGrSelect') || document.querySelector('#corpGrSelect');
                if (el && el.value) return el.value;
                return serverCorpGr || '';
            }

            function getFilterYmd() {
                var el = pane.querySelector('#filterYmd') || pane.querySelector('input[name="ymd"]');
                if (el && el.value) return el.value.replace(/-/g, '').replace(/\./g, '');
                return (initialYmd || '').replace(/-/g, '').replace(/\./g, '');
            }

            function getFilterSeriesGb() {
                var el = pane.querySelector('#filterDddw') || pane.querySelector('select[name="dddw"]');
                if (el && el.value) return el.value;
                return "1110";
            }

            function getFilterSeriesNm() {
                var customLabel = pane.querySelector('.dddw-select-label');
                if (customLabel && customLabel.textContent && customLabel.textContent.trim()) {
                    return customLabel.textContent.trim();
                }
                var dddwSelect = pane.querySelector('#filterDddw') || pane.querySelector('select[name="dddw"]');
                if (dddwSelect && dddwSelect.selectedIndex >= 0 && dddwSelect.options && dddwSelect.options[dddwSelect.selectedIndex]) {
                    var txt = dddwSelect.options[dddwSelect.selectedIndex].textContent;
                    if (txt && txt.trim()) return txt.trim();
                }
                var val = getFilterSeriesGb();
                var map = { "1110": "고위험고수익", "1120": "채권형", "1130": "혼합/기타" };
                return map[val] || "고위험고수익";
            }

            // 달력 컴포넌트 초기화 (AamsCalendar 표준 규격 연동)
            function initCalendar() {
                var filterYmdInput = pane.querySelector('#filterYmd');
                if (!filterYmdInput) return;

                if (initialYmd && !filterYmdInput.value) {
                    filterYmdInput.value = initialYmd;
                }

                if (typeof AamsCalendar !== 'undefined' && typeof AamsCalendar.initSimple === 'function') {
                    AamsCalendar.initSimple('filterYmd', {
                        pane: pane,
                        initialYmd: filterYmdInput.value || initialYmd
                    });
                }
            }

            // DDDW 초기화: f_dddwctl 2칸(코드, 코드명) 분할 표출 및 선택 시 코드명만 표출 규격 적용 (규칙 7)
            function initDddw() {
                var dddwSelect = pane.querySelector('#filterDddw') || pane.querySelector('select[name="dddw"]');
                if (!dddwSelect) return;
                var corpGr = getFilterCorpGr();

                function apply2ColWidget(options) {
                    dddwSelect.innerHTML = '';
                    options.forEach(function (opt) {
                        var code = (opt.code != null ? opt.code : (opt.cd != null ? opt.cd : '')).toString().trim();
                        var name = (opt.name != null ? opt.name : (opt.nm != null ? opt.nm : (opt.dscr != null ? opt.dscr : code))).toString().trim();
                        var optEl = document.createElement('option');
                        optEl.value = code;
                        optEl.textContent = name;
                        dddwSelect.appendChild(optEl);
                    });

                    // 초기 선택값 (기본값: 1110)
                    var targetVal = dddwSelect.value || "1110";
                    var match = options.find(function(o) {
                        var c = (o.code != null ? o.code : o.cd || '').toString().trim();
                        return c === targetVal;
                    });
                    if (!match && options.length > 0) {
                        targetVal = (options[0].code != null ? options[0].code : options[0].cd || '').toString().trim();
                    }
                    dddwSelect.value = targetVal;

                    // 2칸(앞: 코드, 뒤: 코드명) 분할 드롭다운 컴포넌트 생성 및 선택 시 코드명만 버튼에 표출 (규칙 7)
                    if (window.f_dddwctl && typeof window.f_dddwctl.get2ColItemFormatter === 'function') {
                        window.f_dddwctl.get2ColItemFormatter(dddwSelect, options, {
                            codeTitle: "코드",
                            nameTitle: "자료구분",
                            defaultVal: targetVal,
                            onSelect: function (code, name) {
                                dddwSelect.value = code;
                            }
                        });
                    }
                }

                if (typeof window.f_dddwctl === 'function') {
                    window.f_dddwctl('dddw', corpGr, '', 3, '').then(function (options) {
                        if (options && options.length > 0) {
                            apply2ColWidget(options);
                        } else {
                            apply2ColWidget(getDefaultOptions());
                        }
                    }).catch(function (e) {
                        console.warn('[w_ja020k] f_dddwctl load error, using default options:', e);
                        apply2ColWidget(getDefaultOptions());
                    });
                } else {
                    apply2ColWidget(getDefaultOptions());
                }
            }

            function getDefaultOptions() {
                return [
                    { code: "1110", name: "고위험고수익" },
                    { code: "1120", name: "채권형" },
                    { code: "1130", name: "혼합/기타" }
                ];
            }

            function loadReport() {
                if (!reportViewer || typeof reportViewer.load !== 'function') return;
                var ymd = getFilterYmd();
                var seriesGb = getFilterSeriesGb();
                var seriesNm = getFilterSeriesNm();

                if (!ymd) {
                    if (typeof showToast === "function") {
                        showToast("기준일자를 선택해 주세요.", "warning");
                    } else {
                        alert("기준일자를 선택해 주세요.");
                    }
                    return;
                }

                var displayYmd = ymd;
                if (ymd.length === 8) {
                    displayYmd = ymd.substring(0, 4) + '-' + ymd.substring(4, 6) + '-' + ymd.substring(6, 8);
                }

                reportViewer.load({ ymd: ymd, seriesGb: seriesGb }, "조회일자: " + displayYmd + " (" + seriesNm + ")");
            }

            function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                // 1. 달력 초기화
                initCalendar();

                // 2. DDDW 드롭다운 초기화
                initDddw();

                // 3. 리포트 뷰어 일체형 자동 바인딩 (공통 프래그먼트 연동)
                reportViewer = AamsReport.bindViewer(pane, {
                    mrdName: function(data) {
                        var seriesGb = getFilterSeriesGb();
                        return (seriesGb === '1110') ? 'rd_ja020k1.mrd' : ((seriesGb === '1120') ? 'rd_ja020k2.mrd' : 'rd_ja020k3.mrd');
                    },
                    getParams: function(data) {
                        var ymd = getFilterYmd();
                        var seriesGb = getFilterSeriesGb();
                        var ymdDot = (ymd && ymd.length === 8) ? (ymd.substring(0, 4) + '.' + ymd.substring(4, 6) + '.' + ymd.substring(6, 8)) : (ymd || '');
                        return {
                            corpGr: getFilterCorpGr(),
                            series_gb: seriesGb,
                            gubun: (seriesGb === '1110') ? '2' : ((seriesGb === '1120') ? '1' : ''),
                            ymd: ymdDot
                        };
                    },
                    beforeAction: function(data, action) {
                        var ymd = getFilterYmd();
                        if (!ymd) {
                            if (typeof showToast === "function") showToast("기준일자를 선택해 주세요.", "warning");
                            return false;
                        }
                        return true;
                    }
                });

                // 4. 상단 툴바 표준 계약 (규칙 9)
                pane.onSearch = function () {
                    loadReport();
                };
                pane.onRetrieve = function () {
                    loadReport();
                };
                pane.onExcel = function () {
                    if (reportViewer && typeof reportViewer.exportReport === 'function') {
                        reportViewer.exportReport('excel');
                    }
                };
                pane.onCorpGrChange = function () {
                    var corpGr = getFilterCorpGr();
                    if (!corpGr) return;

                    // 회사 변경 시 해당 회사의 기준일자를 API로 조회하여 달력 input 갱신 (규칙 4)
                    fetch('/api/common/workdate?corpGr=' + encodeURIComponent(corpGr))
                        .then(function (res) { return res.json(); })
                        .then(function (data) {
                            if (data && data.workDate) {
                                var filterYmdInput = pane.querySelector('#filterYmd');
                                if (filterYmdInput) {
                                    filterYmdInput.value = data.workDate;
                                    if (typeof AamsCalendar !== 'undefined' && typeof AamsCalendar.initSimple === 'function') {
                                        AamsCalendar.initSimple('filterYmd', {
                                            pane: pane,
                                            initialYmd: data.workDate
                                        });
                                    }
                                }
                            }
                            initDddw();
                        })
                        .catch(function (err) {
                            console.warn('[w_ja020k] workdate fetch error:', err);
                            initDddw();
                        });
                };
                pane.onRefresh = function () {
                    var filterYmdInput = pane.querySelector('#filterYmd');
                    if (filterYmdInput) {
                        filterYmdInput.value = initialYmd;
                        if (typeof AamsCalendar !== 'undefined' && typeof AamsCalendar.initSimple === 'function') {
                            AamsCalendar.initSimple('filterYmd', {
                                pane: pane,
                                initialYmd: initialYmd
                            });
                        }
                    }
                    var dddwSelect = pane.querySelector('#filterDddw') || pane.querySelector('select[name="dddw"]');
                    if (dddwSelect) {
                        dddwSelect.value = "1110";
                        var customWrapper = dddwSelect.nextElementSibling;
                        if (customWrapper && customWrapper.classList.contains("dddw-select-custom")) {
                            var matchItem = customWrapper.querySelector('.tabulator-edit-list-item[data-value="1110"]');
                            var labelEl = customWrapper.querySelector(".dddw-select-label");
                            if (matchItem && labelEl) {
                                labelEl.textContent = matchItem.dataset.name || "고위험고수익";
                                customWrapper.querySelectorAll(".tabulator-edit-list-item").forEach(function(it) {
                                    it.classList.remove("active");
                                });
                                matchItem.classList.add("active");
                            }
                        }
                    }
                    var iframe = pane.querySelector('#report-frame');
                    if (iframe) iframe.src = 'about:blank';
                    var statusEl = pane.querySelector('#report-status');
                    if (statusEl) statusEl.innerText = "조회 대기 중";
                    if (typeof showToast === "function") {
                        showToast("화면이 초기화되었습니다.", "info");
                    }
                };
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", startInit);
            } else {
                startInit();
            }
        })();
    </script>
</div>
</html>

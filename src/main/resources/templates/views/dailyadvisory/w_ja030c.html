<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-single ja030c-container" th:fragment="ja030cView">

    <!-- Top Action Control Bar (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <!-- Reusable Common Toolbar Buttons Fragment (닫기, 새로고침, 조회, 입력, 저장, 엑셀) -->
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <!-- Reusable Common Breadcrumb Fragment -->
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- Filter Bar (Row 2): dc_ymd_dddw fragment (매매일자 + 매매구분) -->
    <div class="filter-bar">
        <div class="filter-left">
            <div th:replace="~{fragments/filter/dc_ymd_dddw :: filter(labelYmd='매매일자', labelDddw='매매구분')}"></div>
        </div>
    </div>

    <!-- Main Grid Section (d_ja030c.srd / SCT0CG) -->
    <div class="grid-section" style="flex: 1 1 auto; height: calc(100% - 85px); padding: 8px 12px; overflow: hidden;">
        <div class="grid-table-wrapper" style="height: 100%; width: 100%; border: 1px solid #cbd5e1; border-radius: 4px; overflow: hidden; background-color: #fff;">
            <div id="master-grid" class="tabulator-aams-grid" style="height: 100%;"></div>
        </div>
    </div>


    <!-- Page Specific Script for w_ja030c -->
    <script th:inline="javascript">
        (function() {
            const currentScript = document.currentScript;
            const pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;

            let gridJa030c = null;
            let cudManager = null;

            // DDDW Option Caches (dw_c dddw, dw_list pg_cd)
            let dddwOptionsMap = {
                filter_dddw: [],
                pg_cd: []
            };

            function getDddwOptions(key) {
                return (dddwOptionsMap[key] || []).map(opt => {
                    const code = (opt.code != null ? opt.code : (opt.SEBU_CD != null ? opt.SEBU_CD : (opt.cd != null ? opt.cd : ''))).toString().trim();
                    const name = (opt.name != null ? opt.name : (opt.SEBU_CD_NM != null ? opt.SEBU_CD_NM : (opt.dscr != null ? opt.dscr : code))).toString().trim();
                    return {
                        label: name ? name : code,
                        value: code,
                        code: code,
                        name: name ? name : code
                    };
                });
            }

            function getDddwLabel(key, codeVal) {
                if (codeVal == null || codeVal === '') return '';
                const codeStr = String(codeVal).trim();
                const list = dddwOptionsMap[key] || [];
                const found = list.find(item => {
                    const c = (item.code != null ? item.code : (item.SEBU_CD != null ? item.SEBU_CD : item.cd));
                    return String(c).trim() === codeStr;
                });
                return found ? (found.name ? found.name : (found.SEBU_CD_NM ? found.SEBU_CD_NM : found.code)) : codeStr;
            }

            /**
             * 2-Column Dropdown Item Formatter for Tabulator List Editor (PowerBuilder DDDW Style)
             * Divides dropdown item into 2 columns: [Code] on the left, [Name] on the right, with sticky table header.
             */
            function createDddw2ColFormatter(codeWidth, codeTitle, nameTitle) {
                if (typeof window.f_dddwctl === 'function' && typeof window.f_dddwctl.get2ColItemFormatter === 'function') {
                    return window.f_dddwctl.get2ColItemFormatter(codeWidth, codeTitle, nameTitle);
                }
                return function(label, value, item) {
                    const code = (item && item.code != null) ? item.code : value;
                    const name = (item && item.name != null) ? item.name : label;
                    return `<div class="dddw-2col-row"><span class="dddw-col-code">${code}</span><span class="dddw-col-name">${name}</span></div>`;
                };
            }

            /**
             * PowerBuilder ue_dddw_retrieve Integration (w_ja030c.srw)
             * 1. dw_c::ue_dddw_retrieve: F_DDDWCTL (THIS, 'dddw', gaa.corp_gr, '', 1, "szx1pt.obj_id='W_JA030C'")
             * 2. dw_list::ue_dddw_retrieve: f_dddwctl (THIS, 'pg_cd', '', '', 1, '')
             */
            function ue_dddw_retrieve(corpGr) {
                const targetCorp = corpGr || resolveCorpGr();
                return window.f_dddwctl.retrieveMultiple({
                    filter_dddw: ['dddw', targetCorp, '', 1, "szx1pt.obj_id='W_JA030C'"],
                    pg_cd: ['pg_cd', '', '', 1, '']
                }).then(resultMap => {
                    dddwOptionsMap = resultMap;

                    // Populate filter dddw dropdown
                    const filterDddwSelect = pane ? pane.querySelector("#filterDddw") : document.getElementById("filterDddw");
                    if (filterDddwSelect && dddwOptionsMap.filter_dddw) {
                        const curVal = filterDddwSelect.value;
                        filterDddwSelect.innerHTML = '';
                        dddwOptionsMap.filter_dddw.forEach(item => {
                            const opt = document.createElement("option");
                            opt.value = item.code;
                            opt.textContent = item.name ? `${item.code}: ${item.name}` : item.code;
                            filterDddwSelect.appendChild(opt);
                        });

                        // Set default 'J15' (dw_c.object.dddw[1] = 'J15' in w_ja030c.srw)
                        const defaultOpt = curVal || /*[[${dddw}]]*/ "J15";
                        if ([...filterDddwSelect.options].some(o => o.value === defaultOpt)) {
                            filterDddwSelect.value = defaultOpt;
                        }

                        // Transform into 2-Column DDDW Filter Dropdown (Development Guide Rule 6 - Unified Formatter)
                        if (window.f_dddwctl && typeof window.f_dddwctl.get2ColItemFormatter === 'function') {
                            window.f_dddwctl.get2ColItemFormatter(filterDddwSelect, dddwOptionsMap.filter_dddw, {
                                codeTitle: "코드",
                                nameTitle: "거래구분명",
                                defaultVal: defaultOpt
                            });
                        }
                    }

                    if (gridJa030c) {
                        gridJa030c.redraw(true);
                    }
                }).catch(err => {
                    console.error("Failed to retrieve DDDW options for w_ja030c:", err);
                });
            }

            function numFmt(val) {
                if (val == null || val === "") return "";
                return Number(val).toLocaleString('ko-KR');
            }

            function formatDateVal(val) {
                if (!val) return "";
                const clean = String(val).replace(/\D/g, "");
                if (clean.length >= 8) {
                    return clean.substring(0, 4) + '.' + clean.substring(4, 6) + '.' + clean.substring(6, 8);
                }
                const str = String(val).trim();
                if (str.length >= 10) {
                    return str.substring(0, 10).replace(/[-/]/g, ".");
                }
                return str;
            }

            // Initialize Grid (d_ja030c.srd / SCT0CG)
            function initJa030cGrid() {
                const container = pane ? pane.querySelector("#master-grid") : document.getElementById("master-grid");
                if (!container) return;

                gridJa030c = new Tabulator(container, {
                    layout: "fitColumns",
                    height: "100%",
                    selectableRows: 1,
                    placeholder: "<span>조회된 채권 매매등록 데이터가 없습니다.</span>",
                    columnDefaults: { vertAlign: "middle", headerSortTristate: true },
                    columns: [
                        { title: "No.", formatter: "rownum", hozAlign: "center", width: 45, resizable: false, widthGrow: 0 },
                        // tabsequence=10: tr_ymd (매입일자)
                        { 
                            title: "매입일자", 
                            field: "trYmd", 
                            hozAlign: "center", 
                            width: 105, 
                            formatter: cell => formatDateVal(cell.getValue()),
                            editor: "input",
                            cellClick: aamsCellEdit
                        },
                        // tabsequence=20: fund_cd (관리번호)
                        { 
                            title: "관리번호", 
                            field: "fundCd", 
                            hozAlign: "center", 
                            width: 90, 
                            editor: "input",
                            cellClick: aamsCellEdit
                        },
                        // p_xx_fund_cd (Grid Internal Rule 1, 2: Empty column with dynamic search button)
                        {
                            title: "",
                            field: "_btn_fundCd",
                            width: 36,
                            minWidth: 36,
                            maxWidth: 36,
                            hozAlign: "center",
                            headerSort: false,
                            resizable: false,
                            formatter: () => `<button type="button" class="btn-grid-addon btn-search" title="펀드 검색"><i class="fa-solid fa-magnifying-glass"></i></button>`,
                            cellClick: function(e, cell) {
                                e.stopPropagation();
                                const row = cell.getRow();
                                const curVal = row.getData().fundCd || "";
                                if (window.DynamicCodeSearch && typeof window.DynamicCodeSearch.openModal === 'function') {
                                    window.DynamicCodeSearch.openModal({
                                        columnNm: "fund_cd",
                                        seq: 1,
                                        initialKeyword: curVal,
                                        onSelect: function(code, name) {
                                            row.update({ fundCd: code, fundNm: name });
                                            if (!row.getData().isNew) {
                                                row.update({ isUpdated: true });
                                            }
                                        }
                                    });
                                }
                            }
                        },
                        // tabsequence=32766: fund_nm (계좌명 - read-only)
                        { title: "계좌명", field: "fundNm", minWidth: 140, hozAlign: "left" },
                        // tabsequence=30: jm_cd (매입종목)
                        { 
                            title: "매입종목", 
                            field: "jmCd", 
                            hozAlign: "center", 
                            width: 95, 
                            editor: "input",
                            cellClick: aamsCellEdit
                        },
                        // p_xx_cj_cd (Grid Internal Rule 1, 2: Empty column with dynamic search button)
                        {
                            title: "",
                            field: "_btn_jmCd",
                            width: 36,
                            minWidth: 36,
                            maxWidth: 36,
                            hozAlign: "center",
                            headerSort: false,
                            resizable: false,
                            formatter: () => `<button type="button" class="btn-grid-addon btn-search" title="채권종목 검색"><i class="fa-solid fa-magnifying-glass"></i></button>`,
                            cellClick: function(e, cell) {
                                e.stopPropagation();
                                const row = cell.getRow();
                                const curVal = row.getData().jmCd || "";
                                if (window.DynamicCodeSearch && typeof window.DynamicCodeSearch.openModal === 'function') {
                                    window.DynamicCodeSearch.openModal({
                                        columnNm: "cj_cd",
                                        seq: 1,
                                        initialKeyword: curVal,
                                        onSelect: function(code, name) {
                                            row.update({ jmCd: code, cjNm: name });
                                            if (!row.getData().isNew) {
                                                row.update({ isUpdated: true });
                                            }
                                        }
                                    });
                                }
                            }
                        },
                        // tabsequence=32766: cj_nm (종목명 - read-only)
                        { title: "종목명", field: "cjNm", minWidth: 150, hozAlign: "left" },
                        // tabsequence=40: pg_cd (신용등급 - DDDW)
                        { 
                            title: "신용등급", 
                            field: "pgCd", 
                            hozAlign: "center", 
                            width: 90,
                            formatter: cell => getDddwLabel('pg_cd', cell.getValue()),
                            editor: "list",
                            editorParams: {
                                valuesLookup: () => getDddwOptions('pg_cd'),
                                autocomplete: false,
                                listOnEmpty: true,
                                clearable: true,
                                itemFormatter: createDddw2ColFormatter("코드", "신용등급명")
                            },
                            cellClick: aamsCellEdit
                        },
                        // tabsequence=50: seq_no (순번)
                        { 
                            title: "순번", 
                            field: "seqNo", 
                            hozAlign: "center", 
                            width: 60, 
                            editor: "number",
                            cellClick: aamsCellEdit
                        },
                        // tabsequence=60: aekm (매입액면)
                        { 
                            title: "매입액면", 
                            field: "aekm", 
                            hozAlign: "right", 
                            minWidth: 110, 
                            formatter: cell => numFmt(cell.getValue()),
                            editor: "number",
                            cellClick: aamsCellEdit
                        },
                        // danga (단가)
                        { 
                            title: "단가", 
                            field: "danga", 
                            hozAlign: "right", 
                            minWidth: 90, 
                            formatter: cell => numFmt(cell.getValue()),
                            editor: "number",
                            cellClick: aamsCellEdit
                        },
                        // tabsequence=70: tr_aek (매입액)
                        { 
                            title: "매입액", 
                            field: "trAek", 
                            hozAlign: "right", 
                            minWidth: 110, 
                            formatter: cell => numFmt(cell.getValue()),
                            editor: "number",
                            cellClick: aamsCellEdit
                        },
                        // tabsequence=80: susu (수수료)
                        { 
                            title: "수수료", 
                            field: "susu", 
                            hozAlign: "right", 
                            minWidth: 95, 
                            formatter: cell => numFmt(cell.getValue()),
                            editor: "number",
                            cellClick: aamsCellEdit
                        },
                        // tabsequence=90: buy_date (매입일 - 개별법)
                        { 
                            title: "매입일(개별법)", 
                            field: "buyDate", 
                            hozAlign: "center", 
                            width: 105, 
                            formatter: cell => formatDateVal(cell.getValue()),
                            editor: "input",
                            cellClick: aamsCellEdit
                        },
                        // tabsequence=100: sudo_ymd (수도일자)
                        { 
                            title: "수도일자", 
                            field: "sudoYmd", 
                            hozAlign: "center", 
                            width: 105, 
                            formatter: cell => formatDateVal(cell.getValue()),
                            editor: "input",
                            cellClick: aamsCellEdit
                        }
                    ]
                });

                // Rule 8: Row Selection
                if (typeof setupTabulatorRowSelection === 'function') {
                    setupTabulatorRowSelection(gridJa030c);
                }

                // cellEdited: Mark modified & calculate amounts (PB itemchanged logic)
                gridJa030c.on("cellEdited", function(cell) {
                    const row = cell.getRow();
                    const data = row.getData();
                    const field = cell.getField();

                    if (!data.isNew) {
                        row.update({ isUpdated: true });
                    }

                    if (field === "aekm" || field === "danga") {
                        const aekm = Number(data.aekm) || 0;
                        const danga = Number(data.danga) || 0;
                        if (aekm > 0 && danga > 0) {
                            const trAek = Math.floor(danga * aekm / 10000);
                            row.update({ trAek: trAek, chuiAek: trAek });
                        }
                    } else if (field === "trAek") {
                        const trAek = Number(data.trAek) || 0;
                        const aekm = Number(data.aekm) || 0;
                        row.update({ chuiAek: trAek });
                        if (aekm > 0 && trAek > 0) {
                            const danga = Math.floor((trAek / aekm * 10000) * 100) / 100;
                            row.update({ danga: danga });
                        }
                    } else if (field === "fundCd" && data.fundCd) {
                        // PB dw_list::itemchanged: mg_cd -> tr_co_cd
                        const corpGr = resolveCorpGr(pane);
                        fetch(`/api/daily/ja030c/tr-co-cd?corpGr=${encodeURIComponent(corpGr)}&fundCd=${encodeURIComponent(data.fundCd)}`)
                            .then(r => r.json())
                            .then(d => {
                                if (d && d.trCoCd) {
                                    row.update({ trCoCd: d.trCoCd });
                                }
                            }).catch(() => {});
                    }
                });

                cudManager = AamsCudManager.create(gridJa030c);
            }

            // Data retrieval function (REST API)
            window.loadJa030cData = function() {
                const corpGr = resolveCorpGr(pane);
                const filterYmdInput = pane ? pane.querySelector("#filterYmd") : document.getElementById("filterYmd");
                const ymd = filterYmdInput ? filterYmdInput.value : "";

                if (!corpGr || !ymd) {
                    if (gridJa030c) gridJa030c.setData([]);
                    return;
                }

                fetch(`/api/daily/ja030c/list?corpGr=${encodeURIComponent(corpGr)}&ymd=${encodeURIComponent(ymd)}`)
                    .then(res => res.json())
                    .then(data => {
                        if (gridJa030c) {
                            const formatted = cudManager ? cudManager.formatData(data) : (Array.isArray(data) ? data : []);
                            gridJa030c.setData(formatted).then(() => {
                                const rows = gridJa030c.getRows();
                                if (rows && rows.length > 0) {
                                    gridJa030c.deselectRow();
                                    rows[0].select();
                                }
                            });
                        }
                    })
                    .catch(err => console.error("Error loading ja030c list:", err));
            };

            const initialYmd = /*[[${ymd}]]*/ '';
            const initialTrDates = /*[[${trDates}]]*/ [];

            // Initialize Pure JS Highlight Calendar (AamsCalendar - Rule 16)
            function initCalendar() {
                if (typeof AamsCalendar !== 'undefined') {
                    const corp = resolveCorpGr(pane);
                    AamsCalendar.init('filterYmd', {
                        pane: pane,
                        initialYmd: initialYmd,
                        highlightDates: initialTrDates,
                        datesApiUrl: '/api/daily/ja030c/dates',
                        corpGr: corp,
                        historyTitle: "채권 매매 데이터 존재"
                    });
                }
            }

            // Register standard toolbar & CorpGr contracts (Guideline 8)
            if (pane) {
                pane.onSearch = function() { window.loadJa030cData(); };
                pane.onRetrieve = function() { window.loadJa030cData(); };
                pane.onCorpGrChange = function(val) {
                    ue_dddw_retrieve(val).then(() => {
                        const corp = resolveCorpGr(pane);
                        if (typeof AamsCalendar !== 'undefined') {
                            AamsCalendar.loadHighlightDates('filterYmd', '/api/daily/ja030c/dates', corp);
                        }
                    });
                };
                pane.addEventListener("corpGrChanged", function(e) {
                    const val = e.detail ? e.detail.corpGr : "";
                    if (pane.onCorpGrChange) pane.onCorpGrChange(val);
                });

                pane.onRefresh = function() {
                    if (cudManager) cudManager.reset();
                    if (gridJa030c) gridJa030c.clearData();
                    if (typeof showToast === "function") {
                        showToast("화면이 초기화되었습니다.", "info");
                    }
                };

                // Provide default new row data when [입력] toolbar button is clicked
                pane.getNewRowData = function() {
                    const corpGr = resolveCorpGr(pane);
                    const filterYmdInput = pane.querySelector("#filterYmd");
                    const filterDddwSelect = pane.querySelector("#filterDddw");
                    const ymd = filterYmdInput ? filterYmdInput.value : "";
                    const trCd = filterDddwSelect ? filterDddwSelect.value : "J15";

                    return {
                        corpGr: corpGr,
                        trYmd: ymd,
                        trCd: trCd,
                        fundCd: "",
                        jmCd: "",
                        buyDate: ymd,
                        seqNo: null,
                        aekm: null,
                        danga: null,
                        trAek: null,
                        susu: 0,
                        sudoYmd: ymd,
                        pgCd: "0211",
                        isNew: true
                    };
                };

                // [입력] 버튼 핸들러 (PB dw_list::ue_insertstart 스크립트 기반 채번 연동)
                pane.onInput = function() {
                    if (!gridJa030c) return;
                    const newRow = pane.getNewRowData();
                    const corpGr = newRow.corpGr || '';
                    const trCd = newRow.trCd || 'J15';
                    const ymd = newRow.trYmd || '';

                    fetch(`/api/daily/ja030c/next-seq?corpGr=${encodeURIComponent(corpGr)}&trCd=${encodeURIComponent(trCd)}&ymd=${encodeURIComponent(ymd)}`)
                        .then(res => res.json())
                        .then(resData => {
                            if (resData && resData.nextSeqNo != null) {
                                newRow.seqNo = resData.nextSeqNo;
                            }
                            return cudManager ? cudManager.addRow(newRow, true) : gridJa030c.addRow(newRow, true);
                        })
                        .catch(() => {
                            return cudManager ? cudManager.addRow(newRow, true) : gridJa030c.addRow(newRow, true);
                        })
                        .then(function(row) {
                            if (row) {
                                gridJa030c.deselectRow();
                                row.select();
                            }
                            if (typeof showToast === "function") {
                                showToast("신규 행이 추가되었습니다.", "info");
                            }
                        });
                };

                // [삭제] 버튼 핸들러 (요구사항 2, 3: 4대 원칙 큐 연동)
                pane.onDelete = function() {
                    if (!gridJa030c) return;
                    const selectedRows = gridJa030c.getSelectedRows();
                    if (!selectedRows || selectedRows.length === 0) {
                        if (typeof showToast === "function") showToast("삭제할 행을 먼저 선택해주세요.", "warning");
                        return;
                    }
                    if (confirm("선택한 채권 매매등록 행을 삭제하시겠습니까? (저장 시 최종 삭제)")) {
                        if (cudManager) {
                            cudManager.deleteRow(selectedRows[0]).then(function() {
                                if (typeof showToast === "function") showToast("행이 삭제 대기열에 등록되었습니다. [저장] 시 최종 반영됩니다.", "info");
                            });
                        } else {
                            selectedRows[0].delete();
                        }
                    }
                };

                // [저장] 버튼 핸들러 (CUD 큐 4대 원칙 반영)
                pane.onSave = function() {
                    if (!gridJa030c) return;

                    const changes = cudManager ? cudManager.getChanges() : { itemList: [], deletedList: [], hasChanges: false };
                    if (!changes.hasChanges) {
                        if (typeof showToast === "function") {
                            showToast("저장할 변경 내역이 없습니다.", "warning");
                        }
                        return;
                    }

                    // 필수값 검증
                    for (let i = 0; i < changes.itemList.length; i++) {
                        const item = changes.itemList[i];
                        if (!item.trYmd) {
                            if (typeof showToast === "function") showToast("매입일자는 필수 입력 항목입니다.", "warning");
                            return;
                        }
                        if (!item.fundCd) {
                            if (typeof showToast === "function") showToast("관리번호(펀드)는 필수 입력 항목입니다.", "warning");
                            return;
                        }
                        if (!item.jmCd) {
                            if (typeof showToast === "function") showToast("매입종목은 필수 입력 항목입니다.", "warning");
                            return;
                        }
                    }

                    const corpGr = resolveCorpGr(pane);
                    const filterYmdInput = pane.querySelector("#filterYmd");
                    const filterDddwSelect = pane.querySelector("#filterDddw");
                    const trYmd = filterYmdInput ? filterYmdInput.value : "";
                    const trCd = filterDddwSelect ? filterDddwSelect.value : "J15";

                    const requestPayload = {
                        corpGr: corpGr,
                        trYmd: trYmd,
                        trCd: trCd,
                        items: changes.itemList,
                        deletedList: changes.deletedList
                    };

                    fetch("/api/daily/ja030c/save", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(requestPayload)
                    })
                    .then(res => res.json())
                    .then(res => {
                        if (res && res.success) {
                            if (cudManager) cudManager.reset();
                            if (typeof showToast === "function") {
                                showToast(`채권 매매등록 정보가 저장되었습니다. (${res.count}건)`, "success");
                            }
                            window.loadJa030cData();
                        } else {
                            if (typeof showToast === "function") {
                                showToast(res.message || "저장 중 오류가 발생했습니다.", "error");
                            }
                        }
                    })
                    .catch(err => {
                        console.error("Save error:", err);
                        if (typeof showToast === "function") {
                            showToast("저장 처리 중 네트워크 오류가 발생했습니다.", "error");
                        }
                    });
                };
            }

            // Guideline 10: Single initialization entry point with isInitialized guard
            let isInitialized = false;
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;
                initCalendar();
                initJa030cGrid();
                ue_dddw_retrieve();
            }

            document.addEventListener("DOMContentLoaded", startInit);
            if (document.readyState === "complete" || document.readyState === "interactive") {
                setTimeout(startInit, 50);
            }
        })();
    </script>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-split ja020k1-container" th:fragment="ja020k1View" style="display: flex; flex-direction: column; height: 100%; width: 100%; overflow: hidden;">

    <!-- 1. 상단 공통 툴바 (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- 2. 상단 필터바 (규칙 14, 17: dc_ymd) -->
    <div class="filter-bar">
        <div class="filter-left">
            <th:block th:replace="~{fragments/filter/dc_ymd :: filter(label='기일')}"></th:block>
        </div>
        <div class="filter-actions d-flex align-items-center gap-1">
            <!-- 보조 액션 버튼 영역 -->
        </div>
    </div>

    <!-- 3. 메인 레이아웃 (좌: d_uzm0hy 계좌 목록, 우: RD 주간 운용현황 리포트) -->
    <div class="layout-split-h split-body" data-split-key="W_JA020K1" data-default-ratio="38:62">
        <!-- 좌측 펀드 그리드 -->
        <div class="pane-left left-pane">
            <div class="pane-header">
                <span class="fw-bold small text-secondary"><i class="fas fa-list me-1"></i> 계좌(펀드) 목록</span>
                <span id="fund-count-badge" class="badge bg-primary rounded-pill">0건</span>
            </div>
            <div class="pane-body">
                <div id="ja020k1-fund-grid" class="tabulator-aams-grid" style="height: 100%; width: 100%;"></div>
            </div>
        </div>

        <!-- 우측 RD 미리보기 뷰어 (공통 프래그먼트) -->
        <div th:replace="~{fragments/report/report_viewer :: reportViewerPane(reportTitle='주간 운용현황 리포트', defaultStatus='선택된 계좌 없음')}"></div>
    </div>

    <!-- 모바일 전용 리포트 모달 (공통 프래그먼트) -->
    <div th:replace="~{fragments/report/report_viewer :: reportMobileModal(modalId='ja020k1MobileModal', modalTitle='주간 운용현황 리포트')}"></div>

    <script th:inline="javascript">
        (function () {
            var currentPane = document.currentScript.closest('.tab-pane') || document;
            var initialYmd = /*[[${initialYmd}]]*/ '';
            var serverCorpGr = /*[[${corpGr}]]*/ '';

            var grid = null;
            var isInitialized = false;
            var lastLoadedMasterKey = null;
            var currentSelectedRowData = null;

            // DDDW Option Caches (Populated via ue_dddw_retrieve and f_dddwctl)
            var dddwOptionsMap = {
                mg_cd: [],
                series_gb: []
            };

            /**
             * PowerBuilder dw_list::ue_dddw_retrieve Event Integration
             * Corresponds to dw_list::ue_dddw_retrieve in w_ja020k1.srw:
             *   1. f_dddwctl (THIS, 'mg_cd', gaa.corp_gr, '', 1, "")
             *   2. f_dddwctl (THIS, 'series_gb', gaa.corp_gr, '', 1, "")
             */
            function ue_dddw_retrieve(corpGr) {
                var targetCorpGr = corpGr || getFilterCorpGr();
                if (!targetCorpGr) return Promise.resolve();

                return f_dddwctl.retrieveMultiple({
                    mg_cd: ['mg_cd', targetCorpGr, '', 1, ''],
                    series_gb: ['series_gb', targetCorpGr, '', 1, '']
                }).then(function (results) {
                    dddwOptionsMap.mg_cd = results.mg_cd || [];
                    dddwOptionsMap.series_gb = results.series_gb || [];

                    if (grid) {
                        grid.redraw(true);
                    }
                    return dddwOptionsMap;
                }).catch(function (err) {
                    console.warn('[w_ja020k1 ue_dddw_retrieve] Error retrieving DDDW options:', err);
                    return dddwOptionsMap;
                });
            }

            function getDddwLabel(dddwKey, codeVal) {
                return f_dddwctl.getLabel(dddwOptionsMap, dddwKey, codeVal);
            }

            // 회사코드 해결 함수: 셀렉트박스 -> 쿠키 -> 서버 모델값 순으로 해결 (개발지침 1번 준수)
            function getFilterCorpGr() {
                var el = currentPane.querySelector('#corpGrSelect') || document.querySelector('#corpGrSelect');
                if (el && el.value) return el.value;

                var matchSaved = document.cookie.match(/(?:^|;\s*)savedCorpGr=([^;]*)/);
                if (matchSaved && matchSaved[1]) return decodeURIComponent(matchSaved[1]);

                var matchCorp = document.cookie.match(/(?:^|;\s*)corpGr=([^;]*)/);
                if (matchCorp && matchCorp[1]) return decodeURIComponent(matchCorp[1]);

                if (serverCorpGr) return serverCorpGr;
                if (typeof g_corp_gr !== 'undefined' && g_corp_gr) return g_corp_gr;
                return '';
            }

            function getFilterYmd() {
                var el = currentPane.querySelector('#filterYmd') || currentPane.querySelector('input[name="ymd"]');
                if (el && el.value) return el.value.replace(/-/g, '').replace(/\./g, '');
                return (initialYmd || '').replace(/-/g, '').replace(/\./g, '');
            }

            // 달력 컴포넌트 초기화 (AamsCalendar 표준 규격 연동)
            function initCalendar() {
                var filterYmdInput = currentPane.querySelector('#filterYmd');
                if (!filterYmdInput) return;

                if (initialYmd && !filterYmdInput.value) {
                    filterYmdInput.value = initialYmd;
                }

                if (typeof AamsCalendar !== 'undefined' && typeof AamsCalendar.initSimple === 'function') {
                    AamsCalendar.initSimple('filterYmd', {
                        pane: currentPane,
                        initialYmd: filterYmdInput.value || initialYmd
                    });
                }
            }

            function initGrid() {
                var gridEl = currentPane.querySelector('#ja020k1-fund-grid');
                if (!gridEl) return;

                // d_uzm0hy.srd의 컬럼 x좌표 순서와 100% 일치
                grid = new Tabulator(gridEl, {
                    height: "100%",
                    layout: "fitDataFill",
                    selectableRows: 1,
                    selectableRowsRollingSelection: false,
                    data: [],
                    columnDefaults: {
                        vertAlign: "middle"
                    },
                    rowFormatter: function (row) {
                        if (row.isSelected && row.isSelected()) {
                            var el = row.getElement();
                            if (el && !el.classList.contains('tabulator-selected')) {
                                el.classList.add('tabulator-selected');
                            }
                        }
                    },
                    columns: [
                        { title: "No.", formatter: "rownum", width: 45, hozAlign: "center", headerHozAlign: "center" },
                        { 
                            title: "증권사", 
                            field: "mgCd", 
                            width: 105, 
                            hozAlign: "center", 
                            headerHozAlign: "center",
                            formatter: function(cell) {
                                return getDddwLabel('mg_cd', cell.getValue());
                            }
                        },
                        { title: "고객명", field: "fundNm", minWidth: 130, hozAlign: "left", headerHozAlign: "center" },
                        { 
                            title: "계좌시리즈구분", 
                            field: "seriesGb", 
                            width: 110, 
                            hozAlign: "left", 
                            headerHozAlign: "center",
                            formatter: function(cell) {
                                return getDddwLabel('series_gb', cell.getValue());
                            }
                        },
                        { title: "관리번호", field: "fundCd", width: 80, hozAlign: "center", headerHozAlign: "center" },
                        { title: "계좌번호", field: "acctNo", width: 110, hozAlign: "center", headerHozAlign: "center" },
                        { 
                            title: "최초계약일", 
                            field: "fstSeoljYmd", 
                            width: 90, 
                            hozAlign: "center", 
                            headerHozAlign: "center",
                            formatter: function(cell) {
                                var val = cell.getValue();
                                if (!val) return "";
                                var s = String(val).replace(/-/g, '').replace(/\./g, '');
                                if (s.length === 8) return s.substring(0, 4) + "." + s.substring(4, 6) + "." + s.substring(6, 8);
                                return val;
                            }
                        },
                        { 
                            title: "(재)계약일", 
                            field: "reSeoljYmd", 
                            width: 90, 
                            hozAlign: "center", 
                            headerHozAlign: "center",
                            formatter: function(cell) {
                                var val = cell.getValue();
                                if (!val) return "";
                                var s = String(val).replace(/-/g, '').replace(/\./g, '');
                                if (s.length === 8) return s.substring(0, 4) + "." + s.substring(4, 6) + "." + s.substring(6, 8);
                                return val;
                            }
                        },
                        { 
                            title: "계약액", 
                            field: "reSeoljAek", 
                            width: 110, 
                            hozAlign: "right", 
                            headerHozAlign: "center",
                            formatter: "money",
                            formatterParams: { precision: 0 }
                        },
                        { title: "계약기", field: "gyulGi", width: 65, hozAlign: "center", headerHozAlign: "center" },
                        { 
                            title: "만기일", 
                            field: "afGyulYmd", 
                            width: 90, 
                            hozAlign: "center", 
                            headerHozAlign: "center",
                            formatter: function(cell) {
                                var val = cell.getValue();
                                if (!val) return "";
                                var s = String(val).replace(/-/g, '').replace(/\./g, '');
                                if (s.length === 8) return s.substring(0, 4) + "." + s.substring(4, 6) + "." + s.substring(6, 8);
                                return val;
                            }
                        }
                    ]
                });

                // 규칙 8번 삼중 안전망 (setupTabulatorRowSelection + rowClick + rowSelectionChanged)
                if (typeof setupTabulatorRowSelection === "function") {
                    setupTabulatorRowSelection(grid, function (row, data) {
                        syncDetail(row, data, false);
                    }, { autoSelectFirst: false });
                }
                grid.on("rowClick", function (e, row) {
                    var isRealClick = e && (e.isTrusted !== false);
                    syncDetail(row, row ? row.getData() : null, isRealClick);
                });
                grid.on("rowSelectionChanged", function (data, rows) {
                    if (rows && rows.length > 0 && !isMobileView()) {
                        syncDetail(rows[0], rows[0].getData(), false);
                    }
                });
            }

            // Helper to check if currently in mobile view (태블릿-S / 876px 이하 또는 우측 패널 숨김)
            function isMobileView() {
                var right = currentPane.querySelector('.split-right') || currentPane.querySelector('.report-card');
                if (right && window.getComputedStyle(right).display === 'none') {
                    return true;
                }
                return window.innerWidth <= 876 || (currentPane.clientWidth > 0 && currentPane.clientWidth <= 876);
            }

            function syncDetail(row, masterRowData, isUserClick) {
                if (!row) return;
                if (!row.isSelected || !row.isSelected()) {
                    if (grid && typeof grid.deselectRow === 'function') {
                        grid.deselectRow();
                    }
                    row.select();
                }
                var el = (typeof row.getElement === 'function') ? row.getElement() : null;
                if (el && !el.classList.contains('tabulator-selected')) {
                    el.classList.add('tabulator-selected');
                }
                var data = masterRowData || (row.getData ? row.getData() : null);
                if (!data) return;

                currentSelectedRowData = data;

                if (isMobileView()) {
                    // 모바일 환경: 사용자가 행을 직접 클릭했을 때만 모달 팝업으로 리포트 표출 (숨겨진 우측 패널에 중복 load 호출 방지)
                    if (isUserClick && reportViewer) {
                        var title = (data.fundNm || '') + ' (' + (data.fundCd || '') + ') 주간 운용현황';
                        reportViewer.openModal(data, title);
                    }
                } else {
                    var corpGr = getFilterCorpGr();
                    var ymd = getFilterYmd();
                    var fundCd = data.fundCd || '';
                    var currentKey = corpGr + "_" + ymd + "_" + fundCd;

                    if (lastLoadedMasterKey === currentKey) return;
                    lastLoadedMasterKey = currentKey;

                    if (reportViewer) {
                        reportViewer.load(data, "기일: " + ymd);
                    }
                }
            }

            function loadFunds() {
                var corpGr = getFilterCorpGr();
                var ymd = getFilterYmd();

                if (!corpGr) {
                    if (typeof showToast === "function") showToast("회사그룹을 선택해주세요.", "warning");
                    return;
                }

                var url = "/api/daily/ja020k1/funds?corpGr=" + encodeURIComponent(corpGr) + "&ymd=" + encodeURIComponent(ymd);
                fetch(url)
                    .then(function (res) { return res.json(); })
                    .then(function (data) {
                        var list = data || [];
                        var badge = currentPane.querySelector('#fund-count-badge');
                        if (badge) badge.innerText = list.length + "건";

                        lastLoadedMasterKey = null;
                        if (grid) {
                            grid.setData(list).then(function () {
                                var rows = grid.getRows();
                                // 규칙 15: 데이터 존재 시 행 선택 (데스크톱만 첫 행 자동 선택, 모바일은 자동 포커스 방지)
                                if (rows && rows.length > 0) {
                                    if (!isMobileView()) {
                                        grid.deselectRow();
                                        rows[0].select();
                                        syncDetail(rows[0], rows[0].getData(), false);

                                        // 가상 DOM 렌더링 완료 후 첫 번째 행 선택 및 포커스 하이라이트 확정 (규칙 15)
                                        setTimeout(function () {
                                            if (grid && !isMobileView()) {
                                                var currentRows = grid.getRows();
                                                if (currentRows && currentRows.length > 0) {
                                                    var targetRow = currentRows[0];
                                                    if (!targetRow.isSelected || !targetRow.isSelected()) {
                                                        grid.deselectRow();
                                                        targetRow.select();
                                                    }
                                                    var el = (typeof targetRow.getElement === 'function') ? targetRow.getElement() : null;
                                                    if (el) {
                                                        el.classList.add('tabulator-selected');
                                                        if (!el.hasAttribute('tabindex')) {
                                                            el.setAttribute('tabindex', '-1');
                                                        }
                                                        try {
                                                            el.focus({ preventScroll: true });
                                                        } catch (e) {}
                                                    }
                                                }
                                            }
                                        }, 60);
                                    } else {
                                        grid.deselectRow();
                                        currentSelectedRowData = null;
                                        lastLoadedMasterKey = null;
                                    }
                                } else {
                                    reportViewer.clear();
                                }
                            });
                        }
                    })
                    .catch(function (err) {
                        console.error("계좌 목록 조회 실패:", err);
                        if (typeof showToast === "function") showToast("조회 중 오류가 발생했습니다.", "error");
                    });
            }

            var reportViewer = null;

            function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                initCalendar();
                initGrid();

                // 리포트 뷰어 일체형 자동 바인딩 (계좌별 주간 운용현황 전용 엔드포인트 연동)
                reportViewer = AamsReport.bindViewer(currentPane, {
                    modalSelector: '#ja020k1MobileModal',
                    buildPreviewUrl: function (data) {
                        var corpGr = getFilterCorpGr();
                        var ymd = getFilterYmd();
                        var fundCd = (data && data.fundCd) ? data.fundCd : '';
                        var fundNm = (data && data.fundNm) ? data.fundNm : '';
                        var gugan = (data && data.gugan) ? data.gugan : '1';
                        var rawUrl = '/api/daily/ja020k1/preview?corpGr=' + encodeURIComponent(corpGr) +
                            '&fundCd=' + encodeURIComponent(fundCd) +
                            '&fundNm=' + encodeURIComponent(fundNm) +
                            '&ymd=' + encodeURIComponent(ymd) +
                            '&gugan=' + encodeURIComponent(gugan) +
                            '&t=' + new Date().getTime();
                        return AamsReport.formatPreviewUrl(rawUrl, 120);
                    },
                    buildExportUrl: function (data, format) {
                        var corpGr = getFilterCorpGr();
                        var ymd = getFilterYmd();
                        var fundCd = (data && data.fundCd) ? data.fundCd : '';
                        var fundNm = (data && data.fundNm) ? data.fundNm : '';
                        var gugan = (data && data.gugan) ? data.gugan : '1';
                        return '/api/daily/ja020k1/export?corpGr=' + encodeURIComponent(corpGr) +
                            '&fundCd=' + encodeURIComponent(fundCd) +
                            '&fundNm=' + encodeURIComponent(fundNm) +
                            '&ymd=' + encodeURIComponent(ymd) +
                            '&gugan=' + encodeURIComponent(gugan) +
                            '&format=' + encodeURIComponent(format || 'pdf') +
                            '&t=' + new Date().getTime();
                    },
                    getTitle: function (data) {
                        var fundNm = (data && data.fundNm) ? data.fundNm : '';
                        var fundCd = (data && data.fundCd) ? data.fundCd : '';
                        return fundNm + ' (' + fundCd + ') 주간 운용현황';
                    },
                    getStatus: function (data) {
                        return "기일: " + getFilterYmd();
                    }
                });

                // 개발지침 규칙 9: 표준 계약 함수 연결
                currentPane.onRetrieve = currentPane.onSearch = function () {
                    loadFunds();
                };

                // 회사그룹 변경 이벤트 연동
                currentPane.onCorpGrChange = function () {
                    var newCorpGr = getFilterCorpGr();
                    if (!newCorpGr) return;
                    ue_dddw_retrieve(newCorpGr);
                    fetch('/api/daily/ja020k1/workdate?corpGr=' + encodeURIComponent(newCorpGr))
                        .then(function (res) { return res.json(); })
                        .then(function (data) {
                            if (data && data.workDate) {
                                var filterYmdInput = currentPane.querySelector('#filterYmd');
                                if (filterYmdInput) {
                                    filterYmdInput.value = data.workDate;
                                }
                            }
                        })
                        .catch(function (err) {
                            console.error("작업일자 조회 실패:", err);
                        });
                };

                currentPane.onRefresh = function () {
                    if (grid) grid.clearData();
                    currentSelectedRowData = null;
                    lastLoadedMasterKey = null;

                    var filterYmdInput = currentPane.querySelector('#filterYmd');
                    if (filterYmdInput && initialYmd) {
                        filterYmdInput.value = initialYmd;
                    }

                    if (typeof showToast === "function") {
                        showToast("화면이 초기화되었습니다.", "info");
                    }
                };

                // Window resize responsive sync
                window.addEventListener('resize', function () {
                    if (grid) grid.redraw(true);
                    if (!isMobileView()) {
                        if (reportViewer && typeof reportViewer.closeModal === 'function') {
                            reportViewer.closeModal();
                        }
                        if (currentSelectedRowData && reportViewer) {
                            reportViewer.load(currentSelectedRowData, "기일: " + getFilterYmd());
                        }
                    }
                });

                // 파워빌더 eb_direct_retrieve = true 규격 준수: 화면 오픈 시 자동 조회 실행
                setTimeout(function () {
                    loadFunds();
                }, 100);
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", startInit);
            } else {
                startInit();
            }
        })();
    </script>
</div>
</html>

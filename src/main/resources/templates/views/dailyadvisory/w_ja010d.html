<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container ja010d-container" th:fragment="ja010dView">

    <!-- Top Action Control Bar (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <!-- Reusable Common Toolbar Buttons Fragment (닫기 ~ 엑셀) -->
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <!-- Reusable Common Breadcrumb Fragment -->
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- Sub Filter Bar (Row 2: 입출금일자 Filter with Pure JS AAMS Highlight Calendar) -->
    <div class="filter-bar" style="display: flex; align-items: center; gap: 15px; background-color: #f8fafc; padding: 8px 12px; border-bottom: 1px solid #e2e8f0; position: relative;">
        <div class="filter-item" style="position: relative; display: flex; align-items: center; gap: 6px;">
            <label for="filterTrYmd" style="font-weight: 600; font-size: 13px; color: #334155;">입.출금일자:</label>
            <!-- Pure JS AamsCalendar automatically constructs input wrapper, icon button and popover -->
            <input type="text" id="filterTrYmd" th:value="${trYmd}" />
            <span> 7영업일전 입,출금은 등록을 의뢰하십시오.</span>
        </div>
    </div>

    <!-- Main Grid Section (d_ja010d1.srd) -->
    <div class="grid-section">
        <div class="grid-table-wrapper">
            <div id="master-grid" class="tabulator-aams-grid"></div>
        </div>
    </div>

    <!-- Page Specific Script (Mapper / API Data Fetching Only) -->
    <script th:inline="javascript">
        (function() {
            const currentScript = document.currentScript;
            const pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;

            let gridJa010d = null;
            let cudManager = null;

            const initialData = /*[[${dataList}]]*/ [];
            const rawInitialData = initialData;
            // numFmt 및 formatDateVal은 common.js의 전역 공통 함수 사용

            function initJa010dGrid() {
                const container = pane ? pane.querySelector("#master-grid") : document.getElementById("master-grid");
                if (!container) return;

                gridJa010d = new Tabulator(container, {
                    data: initialData || [],
                    layout: "fitColumns",
                    height: "100%",
                    selectableRows: 1,
                    placeholder: "<span>조회된 입.출금 내역 데이터가 없습니다.</span>",
                    columnDefaults: { vertAlign: "middle", headerSortTristate: true },
                    columns: [
                        { title: "No.", formatter: "rownum", hozAlign: "center", width: 45, resizable: false, widthGrow: 0 },
                        { title: "펀드번호", field: "fundCd", hozAlign: "center", width: 90, editor: "input", cellClick: aamsCellEdit },
                        // p_xx_fund_cd (Grid Internal Rule 1, 2: Empty column with dynamic search button)
                        {
                            title: "",
                            field: "_btn_fundCd",
                            width: 36,
                            minWidth: 36,
                            maxWidth: 36,
                            hozAlign: "center",
                            headerSort: false,
                            resizable: false,
                            formatter: () => `<button type="button" class="btn-grid-addon btn-search" title="펀드 검색"><i class="fa-solid fa-magnifying-glass"></i></button>`,
                            cellClick: function(e, cell) {
                                e.stopPropagation();
                                const row = cell.getRow();
                                const curVal = row.getData().fundCd || "";
                                if (window.DynamicCodeSearch && typeof window.DynamicCodeSearch.openModal === 'function') {
                                    window.DynamicCodeSearch.openModal({
                                        columnNm: "fund_cd",
                                        seq: 1,
                                        initialKeyword: curVal,
                                        onSelect: function(code, name) {
                                            const isNew = row.getData().isNew;
                                            row.update({ fundCd: code, fundNm: name, isUpdated: !isNew });
                                            if (cudManager) cudManager.trackChange(row);
                                        }
                                    });
                                }
                            }
                        },
                        { title: "펀드명", field: "fundNm", hozAlign: "left", minWidth: 160 },
                        { title: "입금액", field: "inAek", hozAlign: "right", minWidth: 120, formatter: cell => numFmt(cell.getValue()), editor: "number", cellClick: aamsCellEdit },
                        { title: "출금액", field: "outAek", hozAlign: "right", minWidth: 120, formatter: cell => numFmt(cell.getValue()), editor: "number", cellClick: aamsCellEdit },
                        { title: "계약잔액", field: "wonbonAek", hozAlign: "right", minWidth: 130, formatter: cell => numFmt(cell.getValue()), editor: "number", cellClick: aamsCellEdit },
                        { title: "입출금조정액", field: "ioJo", hozAlign: "right", minWidth: 130, formatter: cell => numFmt(cell.getValue()), editor: "number", cellClick: aamsCellEdit }
                    ]
                });

                cudManager = AamsCudManager.create(gridJa010d);

                if (typeof setupTabulatorRowSelection === "function") {
                    setupTabulatorRowSelection(gridJa010d);
                }
            }

            // Data retrieval function (Mapper / REST API)
            window.loadJa010dData = function(selectedCorpGr) {
                const corpGr = selectedCorpGr != null ? selectedCorpGr : resolveCorpGr(pane);
                const filterTrYmdInput = pane ? pane.querySelector("#filterTrYmd") : document.getElementById("filterTrYmd");
                const trYmd = filterTrYmdInput ? filterTrYmdInput.value : "";

                fetch(`/api/account/ja010d/list?corpGr=${encodeURIComponent(corpGr)}&trYmd=${encodeURIComponent(trYmd)}`)
                    .then(res => res.json())
                    .then(data => {
                        if (gridJa010d) {
                            const formatted = cudManager ? cudManager.formatData(data) : (Array.isArray(data) ? data : []);
                            gridJa010d.setData(formatted).then(() => {
                                const rows = gridJa010d.getRows();
                                if (rows && rows.length > 0) {
                                    gridJa010d.deselectRow();
                                    rows[0].select();
                                }
                            });
                        }
                    })
                    .catch(err => console.error("Error loading ja010d list:", err));
            };

            // Register standard toolbar & CorpGr contract
            if (pane) {
                pane.onSearch = function() { window.loadJa010dData(); };
                pane.onRetrieve = function() { window.loadJa010dData(); };

                // 1. 신규 행 입력: insert 큐에 등록
                pane.onInput = function() {
                    if (!gridJa010d) return;
                    const filterTrYmdInput = pane ? pane.querySelector("#filterTrYmd") : document.getElementById("filterTrYmd");
                    const trYmd = filterTrYmdInput ? filterTrYmdInput.value : "";

                    const newRowData = {
                        isNew: true,
                        isUpdated: false,
                        trYmd: trYmd,
                        fundCd: "",
                        fundNm: "",
                        inAek: null,
                        outAek: null,
                        wonbonAek: null,
                        ioJo: null
                    };

                    const addPromise = cudManager ? cudManager.addRow(newRowData, false) : gridJa010d.addRow(newRowData, false);
                    if (addPromise) {
                        addPromise.then(function(newRow) {
                            if (newRow) {
                                gridJa010d.deselectRow();
                                newRow.select();
                                newRow.scrollTo();
                            }
                        });
                    }
                };

                // 행 삭제 처리 (요구사항 2, 3)
                pane.onDelete = function() {
                    if (!gridJa010d) return;
                    const selectedRows = gridJa010d.getSelectedRows();
                    if (!selectedRows || selectedRows.length === 0) {
                        showToast("삭제할 행을 먼저 선택해주세요.", "warning");
                        return;
                    }
                    if (confirm("선택한 입출금 내역 행을 삭제하시겠습니까? (저장 시 최종 삭제)")) {
                        if (cudManager) {
                            cudManager.deleteRow(selectedRows[0]).then(function() {
                                showToast("행이 삭제되었습니다. [저장] 시 최종 반영됩니다.", "info");
                            });
                        } else {
                            selectedRows[0].delete();
                        }
                    }
                };

                // 저장 처리 (insert/update/delete 큐 일괄 반영)
                pane.onSave = function() {
                    if (!gridJa010d) return;
                    const corpGr = resolveCorpGr(pane);
                    if (!corpGr) {
                        showToast("회사그룹을 선택해주세요.", "warning");
                        return;
                    }
                    const filterTrYmdInput = pane ? pane.querySelector("#filterTrYmd") : document.getElementById("filterTrYmd");
                    const trYmd = filterTrYmdInput ? filterTrYmdInput.value : "";

                    const changes = cudManager ? cudManager.getChanges() : { itemList: [], deletedList: [], hasChanges: false };
                    if (!changes.hasChanges) {
                        showToast("저장할 변경 내역이 없습니다.", "info");
                        return;
                    }

                    // 필수 입력값 검증 (신규/수정 항목)
                    for (let d of changes.itemList) {
                        if (!d.fundCd || !d.fundCd.trim()) {
                            showToast("펀드번호는 필수 입력 항목입니다.", "warning");
                            return;
                        }
                        if (!d.trYmd || !d.trYmd.trim()) {
                            d.trYmd = trYmd;
                        }
                    }

                    fetch("/api/account/ja010d/save", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            corpGr: corpGr,
                            trYmd: trYmd,
                            itemList: changes.itemList,
                            deletedList: changes.deletedList
                        })
                    })
                    .then(res => res.json())
                    .then(res => {
                        if (res.success) {
                            if (cudManager) cudManager.reset();
                            showToast(res.message || "정상적으로 저장되었습니다.", "success");
                            window.loadJa010dData();
                        } else {
                            showToast(res.message || "저장 중 오류가 발생했습니다.", "error");
                        }
                    })
                    .catch(err => {
                        console.error("Save error:", err);
                        showToast("저장 중 통신 오류가 발생했습니다.", "error");
                    });
                };

                // 4. 새로고침 시 큐 reset
                pane.onRefresh = function() {
                    if (cudManager) cudManager.reset();
                    if (gridJa010d) gridJa010d.clearData();
                    if (typeof showToast === "function") showToast("화면이 초기화되었습니다.", "info");
                };

                pane.onCorpGrChange = function(val) {
                };
                pane.addEventListener("corpGrChanged", function(e) {
                });
            }

            // Guideline 10: Single initialization entry point with isInitialized guard
            let isInitialized = false;
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;
                initJa010dGrid();
                initCalendarComponent();
            }

            document.addEventListener("DOMContentLoaded", startInit);
            if (document.readyState === "complete" || document.readyState === "interactive") {
                setTimeout(startInit, 50);
            }

            function initCalendarComponent() {
                if (typeof AamsCalendar !== 'undefined') {
                    AamsCalendar.init('filterTrYmd', {
                        pane: pane,
                        initialYmd: /*[[${trYmd}]]*/ "",
                        highlightDates: /*[[${trDates}]]*/ [],
                        datesApiUrl: '/api/account/ja010d/dates'
                    });
                }
            }
        })();
    </script>
</div>
</html>

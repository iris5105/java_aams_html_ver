<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-split ja010h-container" th:fragment="ja010hView" style="display: flex; flex-direction: column; height: 100%; width: 100%; overflow: hidden;">

    <!-- 1. 상단 공통 툴바 (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <!-- Reusable Common Toolbar Buttons Fragment (닫기, 새로고침, 조회, 엑셀) -->
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <!-- Reusable Common Breadcrumb Fragment -->
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- 2. 상단 필터바 (규칙 14, 17: dc_ymd) -->
    <div class="filter-bar">
        <div class="filter-left">
            <th:block th:replace="~{fragments/filter/dc_ymd :: filter(label='기준일자')}"></th:block>
        </div>
        <div class="filter-actions d-flex align-items-center gap-1">
            <span class="small text-muted"><i class="fa-solid fa-circle-info text-primary me-1"></i> 계좌를 선택하면 우측에 자산명세표 리포트가 표출됩니다.</span>
        </div>
    </div>

    <!-- 3. 메인 레이아웃 (좌: d_szm0ia 계좌 목록, 우: 자산명세표 리포트) -->
    <div class="layout-split-h split-body" data-split-key="W_JA010H" data-default-ratio="38:62">
        <!-- 좌측 펀드 그리드 -->
        <div class="pane-left left-pane">
            <div class="pane-header">
                <span class="fw-bold small text-secondary"><i class="fa-solid fa-list me-1"></i> 계좌(펀드) 목록</span>
                <span id="fund-count-badge" class="badge bg-primary rounded-pill">0건</span>
            </div>
            <div class="pane-body">
                <div id="ja010h-grid" class="tabulator-aams-grid" style="height: 100%; width: 100%;"></div>
            </div>
        </div>

        <!-- 우측 RD 미리보기 뷰어 (공통 프래그먼트) -->
        <div th:replace="~{fragments/report/report_viewer :: reportViewerPane(reportTitle='자산명세표 리포트', defaultStatus='계좌를 선택하십시오')}"></div>
    </div>

    <!-- 모바일 전용 리포트 모달 (공통 프래그먼트) -->
    <div th:replace="~{fragments/report/report_viewer :: reportMobileModal(modalId='ja010hMobileModal', modalTitle='자산명세표 리포트')}"></div>

    <script th:inline="javascript">
        (function () {
            var currentPane = document.currentScript.closest('.tab-pane') || document;
            var initialYmd = /*[[${ymd}]]*/ '';
            var serverCorpGr = /*[[${corpGr}]]*/ '';

            var grid = null;
            var isInitialized = false;
            var lastLoadedMasterKey = null;
            var currentSelectedRowData = null;
            var reportViewer = null;

            // Securities dddw column lookup map (w_ja010h.srw dw_list::ue_dddw_retrieve: f_dddwctl (THIS, 'sec_cd | tr_co_cd', gaa.corp_gr, '', 1, ''))
            var secMap = {};

            function loadSecDddw() {
                var corpGr = resolveCorpGr(currentPane);
                if (typeof window.f_dddwctl === 'function' && corpGr) {
                    return window.f_dddwctl('sec_cd | tr_co_cd', corpGr, '', 1, '').then(function (list) {
                        if (list && Array.isArray(list)) {
                            secMap = {};
                            list.forEach(function (item) {
                                var c = (item.code != null ? item.code : (item.cd != null ? item.cd : '')).toString().trim();
                                var n = (item.name != null ? item.name : (item.dscr != null ? item.dscr : c)).toString().trim();
                                if (c) {
                                    secMap[c] = n;
                                }
                            });
                            if (grid) grid.redraw(true);
                        }
                    }).catch(function (err) {
                        console.warn('sec_cd dddw load error:', err);
                    });
                }
                return Promise.resolve();
            }

            // 달력 컴포넌트 초기화 (common.js initFilterCalendar 공통 연동)
            function initCalendar() {
                initFilterCalendar(currentPane, initialYmd);
            }

            // Helper to check if currently in mobile view (태블릿-S / 876px 이하 또는 우측 패널 숨김)
            function isMobileView() {
                var right = currentPane.querySelector('.split-right') || currentPane.querySelector('.report-card');
                if (right && window.getComputedStyle(right).display === 'none') {
                    return true;
                }
                return window.innerWidth <= 876 || (currentPane.clientWidth > 0 && currentPane.clientWidth <= 876);
            }

            function initGrid() {
                var gridEl = currentPane.querySelector('#ja010h-grid');
                if (!gridEl) return;

                grid = new Tabulator(gridEl, {
                    layout: "fitColumns",
                    height: "100%",
                    placeholder: "조회된 데이터가 없습니다.",
                    selectableRows: 1,
                    selectableRowsRollingSelection: false,
                    columnDefaults: {
                        vertAlign: "middle"
                    },
                    rowFormatter: function (row) {
                        if (row.isSelected && row.isSelected()) {
                            var el = row.getElement();
                            if (el && !el.classList.contains('tabulator-selected')) {
                                el.classList.add('tabulator-selected');
                            }
                        }
                    },
                    columns: [
                        { title: "No.", formatter: "rownum", hozAlign: "center", width: 45, resizable: false, widthGrow: 0 },
                        {
                            title: "증권사",
                            field: "secCd",
                            width: 100,
                            hozAlign: "left",
                            headerHozAlign: "center",
                            formatter: function (cell) {
                                var val = String(cell.getValue() || '').trim();
                                return secMap[val] || val || "";
                            }
                        },
                        {
                            title: "고객명",
                            field: "fundNm",
                            minWidth: 120,
                            widthGrow: 2,
                            hozAlign: "left",
                            headerHozAlign: "center",
                            formatter: function (cell) {
                                var v = cell.getValue() || "";
                                return '<span class="fw-semibold text-dark">' + v + '</span>';
                            }
                        },
                        {
                            title: "관리번호",
                            field: "fundCd",
                            width: 80,
                            hozAlign: "center",
                            headerHozAlign: "center",
                            formatter: function (cell) {
                                var v = cell.getValue() || "";
                                return '<span class="badge bg-light text-primary border">' + v + '</span>';
                            }
                        },
                        {
                            title: "결산",
                            field: "workGb",
                            width: 60,
                            hozAlign: "center",
                            headerHozAlign: "center",
                            formatter: function (cell) {
                                var v = cell.getValue();
                                if (v === '결산') {
                                    return '<span class="text-danger fw-bold">' + v + '</span>';
                                }
                                return v || "";
                            }
                        },
                        {
                            title: "만기일자",
                            field: "afGyulYmd",
                            width: 95,
                            hozAlign: "center",
                            headerHozAlign: "center",
                            formatter: function (cell) {
                                var v = cell.getValue() || "";
                                return v ? v.substring(0, 10) : "";
                            }
                        }
                    ]
                });

                // 개발지침 규칙 8: 마스터-디테일 삼중 안전망 (Triple Fallback)
                setupTabulatorRowSelection(grid, function (row, data) {
                    syncDetail(row, data, false);
                });

                grid.on("rowClick", function (e, row) {
                    var isRealClick = e && (e.isTrusted !== false);
                    syncDetail(row, row ? row.getData() : null, isRealClick);
                });

                grid.on("rowSelectionChanged", function (data, rows) {
                    if (rows && rows.length > 0 && !isMobileView()) {
                        syncDetail(rows[0], rows[0].getData(), false);
                    }
                });
            }

            function syncDetail(row, masterRowData, isUserClick) {
                if (!row) return;
                if (!row.isSelected || !row.isSelected()) {
                    if (grid && typeof grid.deselectRow === 'function') {
                        grid.deselectRow();
                    }
                    row.select();
                }
                var el = (typeof row.getElement === 'function') ? row.getElement() : null;
                if (el && !el.classList.contains('tabulator-selected')) {
                    el.classList.add('tabulator-selected');
                }
                var data = masterRowData || (row.getData ? row.getData() : null);
                if (!data) return;

                currentSelectedRowData = data;

                if (isMobileView()) {
                    // 모바일 환경: 사용자가 행을 직접 클릭했을 때만 모달 팝업으로 리포트 표출 (우측 패널 중복 load 방지)
                    if (isUserClick && reportViewer) {
                        var title = (data.fundNm || '') + ' (' + (data.fundCd || '') + ') 자산명세표';
                        reportViewer.openModal(data, title);
                    }
                } else {
                    var corpGr = resolveCorpGr(currentPane);
                    var ymd = getFilterYmd(currentPane);
                    var fundCd = data.fundCd || '';
                    var currentKey = corpGr + "_" + ymd + "_" + fundCd;

                    if (lastLoadedMasterKey === currentKey) return;
                    lastLoadedMasterKey = currentKey;

                    if (reportViewer) {
                        reportViewer.load(data, "기준일자: " + ymd);
                    }
                }
            }

            function loadData() {
                var corpGr = resolveCorpGr(currentPane);
                var ymd = getFilterYmd(currentPane);

                if (!corpGr) {
                    if (typeof showToast === "function") showToast("회사그룹을 선택해주세요.", "warning");
                    return;
                }
                if (!ymd) {
                    if (typeof showToast === "function") showToast("조회일자를 선택해주세요.", "warning");
                    return;
                }

                var url = "/api/daily/ja010h/list?corpGr=" + encodeURIComponent(corpGr) + "&ymd=" + encodeURIComponent(ymd);
                fetch(url)
                    .then(function (res) { return res.json(); })
                    .then(function (data) {
                        var list = data || [];
                        var badge = currentPane.querySelector('#fund-count-badge');
                        if (badge) badge.innerText = list.length + "건";

                        if (grid) {
                            grid.setData(list).then(function () {
                                if (list.length > 0) {
                                    if (!isMobileView()) {
                                        setTimeout(function () {
                                            var rows = grid.getRows();
                                            if (rows && rows.length > 0) {
                                                grid.deselectRow();
                                                var targetRow = rows[0];
                                                if (typeof targetRow.select === 'function') {
                                                    targetRow.select();
                                                }
                                                var el = (typeof targetRow.getElement === 'function') ? targetRow.getElement() : null;
                                                if (el) {
                                                    el.classList.add('tabulator-selected');
                                                    if (!el.hasAttribute('tabindex')) {
                                                        el.setAttribute('tabindex', '-1');
                                                    }
                                                    try {
                                                        el.focus({ preventScroll: true });
                                                    } catch (e) {}
                                                }
                                            }
                                        }, 60);
                                    } else {
                                        grid.deselectRow();
                                        currentSelectedRowData = null;
                                        lastLoadedMasterKey = null;
                                    }
                                } else {
                                    if (reportViewer) reportViewer.clear();
                                    currentSelectedRowData = null;
                                    lastLoadedMasterKey = null;
                                }
                            });
                        }
                    })
                    .catch(function (err) {
                        console.error("ja010h data fetch error:", err);
                        if (grid) grid.setData([]);
                        if (reportViewer) reportViewer.clear();
                        if (typeof showToast === "function") showToast("조회 중 오류가 발생했습니다.", "error");
                    });
            }

            function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                initCalendar();
                loadSecDddw();
                initGrid();

                // 리포트 뷰어 일체형 자동 바인딩 (w_ja020k1 표준 패턴 준수)
                reportViewer = AamsReport.bindViewer(currentPane, {
                    grid: function () { return grid; },
                    modalSelector: '#ja010hMobileModal',
                    buildPreviewUrl: function (data) {
                        var corpGr = resolveCorpGr(currentPane);
                        var ymd = getFilterYmd(currentPane);
                        var fundCd = (data && data.fundCd) ? data.fundCd : '';
                        var rawUrl = '/api/daily/ja010h/preview?corpGr=' + encodeURIComponent(corpGr) +
                            '&ymd=' + encodeURIComponent(ymd) +
                            '&fundCd=' + encodeURIComponent(fundCd) +
                            '&t=' + new Date().getTime();
                        return AamsReport.formatPreviewUrl(rawUrl, 120);
                    },
                    buildExportUrl: function (data, format) {
                        var corpGr = resolveCorpGr(currentPane);
                        var ymd = getFilterYmd(currentPane);
                        var fundCd = (data && data.fundCd) ? data.fundCd : '';
                        return '/api/daily/ja010h/export?corpGr=' + encodeURIComponent(corpGr) +
                            '&ymd=' + encodeURIComponent(ymd) +
                            '&fundCd=' + encodeURIComponent(fundCd) +
                            '&format=' + encodeURIComponent(format || 'pdf') +
                            '&t=' + new Date().getTime();
                    },
                    getTitle: function (data) {
                        var fundNm = (data && data.fundNm) ? data.fundNm : '';
                        var fundCd = (data && data.fundCd) ? data.fundCd : '';
                        return fundNm + ' (' + fundCd + ') 자산명세표';
                    },
                    getStatus: function (data) {
                        return "기준일자: " + getFilterYmd(currentPane);
                    }
                });

                // 개발지침 규칙 9: 표준 계약 함수 연결
                currentPane.onRetrieve = currentPane.onSearch = function () {
                    loadData();
                };

                currentPane.onExcel = function () {
                    if (reportViewer && currentSelectedRowData) {
                        reportViewer.exportFormat('excel');
                    } else if (grid) {
                        grid.download("xlsx", "자산명세표_계좌목록.xlsx", { sheetName: "계좌목록" });
                    }
                };

                // 회사그룹 변경 이벤트 연동
                currentPane.onCorpGrChange = function () {
                    loadSecDddw();
                };

                currentPane.onRefresh = function () {
                    if (grid) grid.clearData();
                    currentSelectedRowData = null;
                    lastLoadedMasterKey = null;
                    if (reportViewer) reportViewer.clear();

                    var filterYmdInput = currentPane.querySelector('#filterYmd');
                    if (filterYmdInput && initialYmd) {
                        filterYmdInput.value = initialYmd;
                    }
                    var badge = currentPane.querySelector('#fund-count-badge');
                    if (badge) badge.innerText = "0건";

                    if (typeof showToast === "function") {
                        showToast("화면이 초기화되었습니다.", "info");
                    }
                };

                // 리사이즈 및 모바일/PC 반응형 동기화는 AamsReport.bindViewer 공통 모듈(aams_report.js)에서 자동 처리됨

                // 초기 진입 시 자동 조회 실행 (파워빌더 eb_direct_retrieve = true 규격)
                setTimeout(function () {
                    loadData();
                }, 100);
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", startInit);
            } else {
                startInit();
            }
        })();
    </script>
</div>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-single ja010e-container layout-mobile-stack-container" th:fragment="ja010eView">

    <!-- Top Action Control Bar (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <!-- Reusable Common Toolbar Buttons Fragment (닫기, 새로고침, 조회, 입력, 저장, 엑셀) -->
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <!-- Reusable Common Breadcrumb Fragment -->
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- Filter Bar (Row 2): dc_ymd_dddw fragment (매매일자 + 매매증권사) + Sub Action Buttons -->
    <div class="filter-bar">
        <div class="filter-left">
            <div th:replace="~{fragments/filter/dc_ymd_dddw :: filter(labelYmd='매매일자', labelDddw='매매증권사')}"></div>
            <button type="button" id="btnNew" class="t-btn btn-action" style="background: #10b981; color: #ffffff; border-color: #059669;">
                <i class="fa-solid fa-plus"></i> NEW체결
            </button>
            <button type="button" id="btnLoad" class="t-btn btn-action" style="background: #2563eb; color: #ffffff; border-color: #1d4ed8;">
                <i class="fa-solid fa-file-import"></i> 체결등록
            </button>
            <button type="button" id="btnDel" class="t-btn btn-action" style="background: #ef4444; color: #ffffff; border-color: #dc2626;">
                <i class="fa-solid fa-trash-can"></i> 일괄삭제
            </button>
            <button type="button" id="btn2402" class="t-btn btn-action" th:if="${corpGr == '2402' and isAdmin}" style="background: #6366f1; color: #ffffff; border-color: #4f46e5;">
                <i class="fa-solid fa-database"></i> 잔고LOAD
            </button>
        </div>
    </div>

    <!-- Main Grid Section (d_ja010e1.srd / SJT1JG) -->
    <div class="grid-section" style="flex: 1 1 auto; height: calc(100% - 85px); padding: 8px 12px; overflow: hidden;">
        <div class="grid-table-wrapper grid-table-wrapper--frame-owner" style="height: 100%; width: 100%; border: 1px solid #cbd5e1; border-radius: 4px; overflow: hidden; background-color: #fff;">
            <div id="ja010e-grid" class="tabulator-aams-grid" style="height: 100%;"></div>
        </div>
    </div>

    <!-- PB w_import_sjt1jg response window: file load -> temporary rows -> INSERT/COMMIT on save or close. -->
    <dialog class="ja010e-import-dialog" aria-labelledby="ja010e-import-title">
        <div class="ja010e-import-form">
            <div class="ja010e-import-header">
                <h2 id="ja010e-import-title">체결내역 Excel LOAD</h2>
                <button type="button" class="t-btn btn-secondary ja010e-import-close">닫기</button>
            </div>
            <p class="ja010e-import-description">선택한 증권사의 Excel 또는 CSV 파일을 해당 증권사 컬럼 순서로 변환하여 임시 목록에 적재합니다. 저장 또는 닫기를 누르면 검증된 자료를 INSERT·COMMIT합니다.</p>
            <label class="ja010e-import-file-label">
                <span>체결 파일</span>
                <input type="file" class="ja010e-import-file" accept=".xlsx,.xls,.csv" multiple>
            </label>
            <div class="ja010e-import-grid-wrap">
                <div class="ja010e-import-grid tabulator-aams-grid"></div>
            </div>
            <div class="ja010e-import-actions">
                <button type="button" class="t-btn btn-action ja010e-import-submit"><i class="fa-solid fa-folder-open"></i> 파일 다시 선택</button>
                <button type="button" class="t-btn btn-primary ja010e-import-apply" disabled><i class="fa-solid fa-floppy-disk"></i> 저장</button>
            </div>
            <div class="ja010e-import-result" aria-live="polite"></div>
        </div>
    </dialog>

    <!-- Page Specific Script for w_ja010e -->
    <script th:inline="javascript">
        (function() {
            const currentScript = document.currentScript;
            const pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;

            let gridJa010e = null;
            let gridImportTrades = null;
            let brokerOptionsMap = {}; // tr_co_cd code -> name cache
            let importPreviewRows = [];
            let importPreviewLoading = false;
            let importCommitPromise = null;

            // Numeric Money Formatter
            function numberFormatter(cell) {
                const val = cell.getValue();
                if (val == null || val === "" || isNaN(val)) return "0";
                return Number(val).toLocaleString();
            }

            // Trading Code (tr_cd) Formatter (J: 매수, K: 매도, F: 입고, O: 출고, +: 취득액)
            function trCdFormatter(cell) {
                const val = cell.getValue();
                if (val === "J") return '<span class="cell-tr-buy">매수</span>';
                if (val === "K") return '<span class="cell-tr-sell">매도</span>';
                if (val === "F") return '<span class="cell-tr-in">입고</span>';
                if (val === "O") return '<span class="cell-tr-out">출고</span>';
                if (val === "+") return '<span class="cell-tr-acquire">취득액</span>';
                return val || "-";
            }

            // Broker (tr_co_cd) Name Lookup Formatter
            function trCoFormatter(cell) {
                const val = cell.getValue();
                if (!val) return "";
                if (brokerOptionsMap[val]) {
                    return brokerOptionsMap[val];
                }
                return val;
            }

            let brokerOptionsList = [];

            // formatDateVal은 common.js의 전역 공통 함수 사용


            // Exception Rule 1 & Rule 7: tabsequence based editability
            function isRowEditable(cell) {
                if (!cell) return false;
                const row = typeof cell.getRow === "function" ? cell.getRow() : null;
                if (!row) return false;
                const data = row.getData();
                return Boolean(data && (data.isNew === true || data._isNew === true));
            }

            function isDetailEditable(cell) {
                return true; // tr_jusu, danga, tr_aek, susu, tax, sudo_ymd have tabsequence in PB srd
            }

            // 1. Initialize DDDW Options for tr_co_cd (Rule 6: 2-column dropdown with sticky header)
            function initDddwOptions() {
                const corpGr = resolveCorpGr(pane);
                const dddwSelect = pane ? pane.querySelector("#filterDddw") : document.getElementById("filterDddw");
                if (!dddwSelect) return Promise.resolve();

                if (typeof window.f_dddwctl === "function") {
                    return window.f_dddwctl(dddwSelect, 'tr_co_cd', corpGr, '%,전체,', 1, "tr_gb='1'", {
                        codeTitle: "코드",
                        nameTitle: "증권사명",
                        defaultVal: "%"
                    }).then(options => {
                        brokerOptionsMap = {};
                        brokerOptionsList = [];
                        (options || []).forEach(opt => {
                            const code = (opt.code != null ? opt.code : (opt.cd || '')).toString().trim();
                            const name = (opt.name != null ? opt.name : (opt.dscr || code)).toString().trim();
                            if (code && code !== "%") {
                                brokerOptionsMap[code] = name;
                                brokerOptionsList.push({ label: `${code}: ${name}`, value: code });
                            }
                        });

                        if (gridJa010e) {
                            gridJa010e.redraw(true);
                        }
                    }).catch(err => console.error("Error loading tr_co_cd DDDW in w_ja010e:", err));
                }
                return Promise.resolve();
            }

            // 2. Initialize Main Grid (d_ja010e1.srd / SJT1JG)
            // Configured strictly based on tabsequence (Rule 5) and Exception 1 (editable for isNew rows only)
            function initGrid() {
                const gridElement = pane ? pane.querySelector("#ja010e-grid") : document.getElementById("ja010e-grid");
                if (!gridElement) return;

                gridJa010e = new Tabulator(gridElement, {
                    layout: "fitDataFill",
                    height: "100%",
                    placeholder: "조회된 체결 내역이 없습니다.",
                    selectableRows: 1,
                    editTriggerEvent: "click",
                    columnDefaults: {
                        vertAlign: "middle"
                    },
                    rowFormatter: function(row) {
                        const data = row.getData();
                        if (data && (data.isNew === true || data._isNew === true)) {
                            row.getElement().classList.add("aams-new-row");
                        } else {
                            row.getElement().classList.remove("aams-new-row");
                        }
                    },
                    columns: [
                        { title: "No.", headerSort: false, formatter: "rownum", width: 45, hozAlign: "center", headerHozAlign: "center", resizable: false },
                        // srd sequence 1: tr_cd (매매)
                        { 
                            title: "매매", 
                            field: "trCd", 
                            width: 75, 
                            hozAlign: "center", 
                            headerHozAlign: "center", 
                            formatter: trCdFormatter,
                            editor: "list",
                            editorParams: {
                                values: [
                                    { label: "매수", value: "J" },
                                    { label: "매도", value: "K" },
                                    { label: "입고", value: "F" },
                                    { label: "출고", value: "O" },
                                    { label: "취득액", value: "+" }
                                ],
                                autocomplete: false,
                                listOnEmpty: true
                            },
                            editable: isRowEditable,
                            cellClick: (e, cell) => { if (isRowEditable(cell)) cell.edit(true); }
                        },
                        // srd sequence 2: offer_no (주문No - read-only)
                        { title: "주문No", field: "offerNo", width: 85, hozAlign: "center", headerHozAlign: "center" },
                        // srd sequence 3: fund_cd (관리번호)
                        { 
                            title: "펀드번호", 
                            field: "fundCd", 
                            width: 105, 
                            hozAlign: "center", 
                            headerHozAlign: "center",
                            editor: "input",
                            editable: isRowEditable,
                            cellClick: (e, cell) => { if (isRowEditable(cell)) cell.edit(true); }
                        },
                        // p_xx_fund_cd (Grid Internal Rule 1, 2: Empty column with dynamic search button)
                        {
                            title: "",
                            field: "p_xx_fund_cd",
                            width: 36,
                            minWidth: 36,
                            maxWidth: 36,
                            hozAlign: "center",
                            headerSort: false,
                            resizable: false,
                            formatter: function(cell) {
                                const isNew = cell.getRow().getData().isNew;
                                const disClass = isNew ? "" : "disabled";
                                return `<button type="button" class="btn-grid-addon btn-search ${disClass}" title="펀드 검색"><i class="fa-solid fa-magnifying-glass"></i></button>`;
                            },
                            cellClick: function(e, cell) {
                                e.stopPropagation();
                                const row = cell.getRow();
                                const data = row.getData();
                                if (!data.isNew && !data._isNew) {
                                    if (gridJa010e) { gridJa010e.deselectRow(); row.select(); }
                                    return;
                                }
                                const curVal = data.fundCd || "";
                                if (window.DynamicCodeSearch && typeof window.DynamicCodeSearch.openModal === 'function') {
                                    window.DynamicCodeSearch.openModal({
                                        columnNm: "fund_cd",
                                        seq: 1,
                                        initialKeyword: curVal,
                                        onSelect: function(code, name) {
                                            row.update({ fundCd: code, fundNm: name });
                                        }
                                    });
                                }
                            }
                        },
                        // srd sequence 4: xx_fund_cd (고객명 - read-only)
                        { title: "고객명", field: "fundNm", width: 150, hozAlign: "left", headerHozAlign: "center" },
                        // srd sequence 5: koscom_cd (종목코드)
                        { 
                            title: "종목코드", 
                            field: "jmCd", 
                            width: 100, 
                            hozAlign: "center", 
                            headerHozAlign: "center",
                            editor: "input",
                            editable: isRowEditable,
                            cellClick: (e, cell) => { if (isRowEditable(cell)) cell.edit(true); }
                        },
                        // p_xx_koscom_cd (Grid Internal Rule 1, 2: Empty column with dynamic search button)
                        {
                            title: "",
                            field: "p_xx_jm_cd",
                            width: 36,
                            minWidth: 36,
                            maxWidth: 36,
                            hozAlign: "center",
                            headerSort: false,
                            resizable: false,
                            formatter: function(cell) {
                                const isNew = cell.getRow().getData().isNew;
                                const disClass = isNew ? "" : "disabled";
                                return `<button type="button" class="btn-grid-addon btn-search ${disClass}" title="종목 검색"><i class="fa-solid fa-magnifying-glass"></i></button>`;
                            },
                            cellClick: function(e, cell) {
                                e.stopPropagation();
                                const row = cell.getRow();
                                const data = row.getData();
                                if (!data.isNew && !data._isNew) {
                                    if (gridJa010e) { gridJa010e.deselectRow(); row.select(); }
                                    return;
                                }
                                const curVal = data.jmCd || "";
                                if (window.DynamicCodeSearch && typeof window.DynamicCodeSearch.openModal === 'function') {
                                    window.DynamicCodeSearch.openModal({
                                        columnNm: "koscom_cd",
                                        seq: 1,
                                        initialKeyword: curVal,
                                        onSelect: function(code, name) {
                                            row.update({ jmCd: code, jjNm: name });
                                        }
                                    });
                                }
                            }
                        },
                        // srd sequence 6: xx_koscom_cd (종목명 - read-only)
                        { title: "종목명", field: "jjNm", minWidth: 160, hozAlign: "left", headerHozAlign: "center" },
                        // tabsequence=40: tr_jusu (매매수량)
                        { 
                            title: "매매수량", 
                            field: "trJusu", 
                            width: 100, 
                            hozAlign: "right", 
                            headerHozAlign: "center", 
                            formatter: numberFormatter,
                            editor: "number",
                            editable: isDetailEditable,
                            cellClick: aamsCellEdit,
                            cellEdited: function(cell) {
                                const row = cell.getRow();
                                const data = row.getData();
                                const jusu = Number(data.trJusu || 0);
                                const danga = Number(data.danga || 0);
                                if (jusu > 0 && danga > 0) {
                                    row.update({ trAek: Math.round(jusu * danga) });
                                }
                            }
                        },
                        // tabsequence=50: danga (매매단가)
                        { 
                            title: "매매단가", 
                            field: "danga", 
                            width: 100, 
                            hozAlign: "right", 
                            headerHozAlign: "center", 
                            formatter: numberFormatter,
                            editor: "number",
                            editable: isDetailEditable,
                            cellClick: aamsCellEdit,
                            cellEdited: function(cell) {
                                const row = cell.getRow();
                                const data = row.getData();
                                const jusu = Number(data.trJusu || 0);
                                const danga = Number(data.danga || 0);
                                if (jusu > 0 && danga > 0) {
                                    row.update({ trAek: Math.round(jusu * danga) });
                                }
                            }
                        },
                        // tabsequence=60: tr_aek (매매금액)
                        { 
                            title: "매매금액", 
                            field: "trAek", 
                            width: 125, 
                            hozAlign: "right", 
                            headerHozAlign: "center", 
                            formatter: numberFormatter,
                            editor: "number",
                            editable: isDetailEditable,
                            cellClick: aamsCellEdit
                        },
                        // tabsequence=70: susu (수수료)
                        { 
                            title: "수수료", 
                            field: "susu", 
                            width: 90, 
                            hozAlign: "right", 
                            headerHozAlign: "center", 
                            formatter: numberFormatter,
                            editor: "number",
                            editable: isDetailEditable,
                            cellClick: aamsCellEdit
                        },
                        // tabsequence=80: tax (거래세)
                        { 
                            title: "거래세", 
                            field: "tax", 
                            width: 90, 
                            hozAlign: "right", 
                            headerHozAlign: "center", 
                            formatter: numberFormatter,
                            editor: "number",
                            editable: isDetailEditable,
                            cellClick: aamsCellEdit
                        },
                        // tabsequence=90: sudo_ymd (수도결제일)
                        { 
                            title: "수도결제일", 
                            field: "sudoYmd", 
                            width: 105, 
                            hozAlign: "center", 
                            headerHozAlign: "center", 
                            formatter: cell => formatDateVal(cell.getValue()),
                            editor: "input",
                            editable: isDetailEditable,
                            cellClick: aamsCellEdit
                        },
                        // srd sequence 14 / tabsequence=100: tr_co_cd (매매처 - DDDW)
                        { 
                            title: "매매처", 
                            field: "trCoCd", 
                            width: 130, 
                            hozAlign: "left", 
                            headerHozAlign: "center", 
                            formatter: trCoFormatter,
                            editor: "list",
                            editorParams: {
                                valuesLookup: () => brokerOptionsList,
                                autocomplete: false,
                                listOnEmpty: true,
                                clearable: true,
                                itemFormatter: (label, value, item, element) => {
                                    const code = (item && item.value != null) ? item.value : (value || '');
                                    const name = (item && item.label != null) ? item.label.replace(/^[^:]+:\s*/, '') : '';
                                    return `<div style="display:flex; justify-content:space-between; width:100%; font-size:12px;">
                                        <span style="font-weight:600; color:#1e293b; width:45px;">${code}</span>
                                        <span style="color:#475569; text-align:right; flex:1;">${name}</span>
                                    </div>`;
                                }
                            },
                            editable: isRowEditable,
                            cellClick: aamsCellEdit
                        }
                    ]
                });

                // AAMS 전역 공통 CUD 버퍼 매니저 바인딩 (규칙 1, 2, 3, 4)
                cudManager = (typeof AamsCudManager !== 'undefined' && typeof AamsCudManager.create === 'function')
                    ? AamsCudManager.create(gridJa010e)
                    : null;

                if (typeof setupTabulatorRowSelection === "function") {
                    setupTabulatorRowSelection(gridJa010e);
                }
            }

            // 3. Load Data Function
            window.loadJa010eData = function() {
                const corpGr = resolveCorpGr(pane);
                const filterDddwSelect = pane ? pane.querySelector("#filterDddw") : document.getElementById("filterDddw");

                const ymd = getFilterYmd(pane);
                const trCoCd = filterDddwSelect ? filterDddwSelect.value : "%";

                if (!corpGr || !ymd) {
                    if (cudManager) cudManager.reset();
                    if (gridJa010e) gridJa010e.setData([]);
                    return;
                }

                const url = `/api/daily/ja010e/list?corpGr=${encodeURIComponent(corpGr)}&ymd=${encodeURIComponent(ymd)}&trCoCd=${encodeURIComponent(trCoCd || '%')}`;

                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        if (gridJa010e) {
                            if (cudManager) {
                                gridJa010e.setData(cudManager.formatData(data)).then(() => {
                                    const rows = gridJa010e.getRows();
                                    if (rows && rows.length > 0) {
                                        gridJa010e.deselectRow();
                                        rows[0].select();
                                    }
                                });
                            } else {
                                gridJa010e.setData(Array.isArray(data) ? data : []).then(() => {
                                    const rows = gridJa010e.getRows();
                                    if (rows && rows.length > 0) {
                                        gridJa010e.deselectRow();
                                        rows[0].select();
                                    }
                                });
                            }
                        }
                    })
                    .catch(err => {
                        console.error("Error loading ja010e list:", err);
                    });
            };

            // 4. Add New Row Function (Rule 5 & Exception 1)
            function addNewRow() {
                const filterDddwSelect = pane ? pane.querySelector("#filterDddw") : document.getElementById("filterDddw");
                const ymd = getFilterYmd(pane);
                const trCoCd = (filterDddwSelect && filterDddwSelect.value !== "%") ? filterDddwSelect.value : "";

                const selectedRows = gridJa010e ? gridJa010e.getSelectedRows() : [];
                const prevRowData = (selectedRows && selectedRows.length > 0) ? selectedRows[0].getData() : null;
                const allRows = gridJa010e ? gridJa010e.getRows() : [];
                const maxOfferNo = allRows.reduce((max, r) => {
                    const n = parseInt(r.getData().offerNo, 10);
                    return (!isNaN(n) && n > max) ? n : max;
                }, 0);

                const baseData = {
                    isNew: true,
                    trYmd: ymd,
                    trCd: prevRowData ? (prevRowData.trCd || "J") : "J",
                    fundCd: prevRowData ? (prevRowData.fundCd || "") : "",
                    fundNm: prevRowData ? (prevRowData.fundNm || "") : "",
                    trCoCd: prevRowData ? (prevRowData.trCoCd || trCoCd) : trCoCd,
                    offerNo: maxOfferNo > 0 ? (maxOfferNo + 1) : 1,
                    jmCd: null,
                    jjNm: null,
                    trJusu: null,
                    danga: null,
                    trAek: null,
                    susu: 0,
                    tax: 0,
                    sudoYmd: ymd ? ymd.replace(/-/g, ".") : null,
                    acctNo: prevRowData ? (prevRowData.acctNo || null) : null,
                    loadTime: null
                };

                const newRowData = cudManager ? cudManager.createNewRow(baseData) : baseData;

                if (gridJa010e) {
                    gridJa010e.addRow(newRowData, true).then(function(row) {
                        gridJa010e.deselectRow();
                        row.select();
                        const cell = row.getCell("fundCd");
                        if (cell) cell.edit();
                    });
                }
            }

            const initialYmd = /*[[${ymd}]]*/ '';
            const initialTrDates = /*[[${trDates}]]*/ [];

            // Initialize Pure JS Highlight Calendar (AamsCalendar - Rule 16)
            function initCalendar() {
                if (typeof AamsCalendar !== 'undefined') {
                    const corp = resolveCorpGr(pane);
                    const dddwSelect = pane ? pane.querySelector("#filterDddw") : null;
                    const trCo = dddwSelect ? dddwSelect.value : "%";
                    const datesUrl = `/api/daily/ja010e/dates?trCoCd=${encodeURIComponent(trCo)}`;
                    AamsCalendar.init('filterYmd', {
                        pane: pane,
                        initialYmd: initialYmd,
                        highlightDates: initialTrDates,
                        datesApiUrl: datesUrl,
                        corpGr: corp,
                        historyTitle: "체결 데이터 존재"
                    });
                }
            }

            // PB w_import_sjt1jg / d_xlsx 역할: 변환된 체결자료를 저장 전 임시 목록으로 유지한다.
            function initImportTradeGrid() {
                if (gridImportTrades) return;
                const gridElement = pane.querySelector(".ja010e-import-grid");
                if (!gridElement) return;
                gridImportTrades = new Tabulator(gridElement, {
                    height: "100%",
                    layout: "fitDataFill",
                    placeholder: "선택한 체결 파일의 변환 결과가 여기에 표시됩니다.",
                    columns: [
                        { title: "No.", headerSort: false, formatter: "rownum", width: 46, hozAlign: "center", headerHozAlign: "center" },
                        { title: "매매", field: "trCd", width: 65, hozAlign: "center", headerHozAlign: "center", formatter: trCdFormatter },
                        { title: "펀드코드", field: "fundCd", width: 90, hozAlign: "center", headerHozAlign: "center" },
                        { title: "고객명", field: "fundNm", minWidth: 120, headerHozAlign: "center" },
                        { title: "계좌번호", field: "acctNo", width: 125, headerHozAlign: "center" },
                        { title: "종목코드", field: "koscomCd", width: 90, hozAlign: "center", headerHozAlign: "center" },
                        { title: "종목", field: "jjNm", minWidth: 130, headerHozAlign: "center" },
                        { title: "주문번호", field: "offerNo", width: 90, hozAlign: "right", headerHozAlign: "center" },
                        { title: "수량", field: "trJusu", width: 100, hozAlign: "right", headerHozAlign: "center", formatter: numberFormatter },
                        { title: "체결금액", field: "trAek", width: 120, hozAlign: "right", headerHozAlign: "center", formatter: numberFormatter },
                        { title: "수수료", field: "susu", width: 90, hozAlign: "right", headerHozAlign: "center", formatter: numberFormatter },
                        { title: "세금", field: "tax", width: 90, hozAlign: "right", headerHozAlign: "center", formatter: numberFormatter }
                    ]
                });
            }

            function resetImportTradeModal() {
                importPreviewRows = [];
                const fileInput = pane.querySelector(".ja010e-import-file");
                const applyButton = pane.querySelector(".ja010e-import-apply");
                const result = pane.querySelector(".ja010e-import-result");
                if (fileInput) fileInput.value = "";
                if (applyButton) applyButton.disabled = true;
                if (result) result.textContent = "";
                initImportTradeGrid();
                if (gridImportTrades) gridImportTrades.clearData();
            }

            function previewImportTradeFiles() {
                const fileInput = pane.querySelector(".ja010e-import-file");
                const result = pane.querySelector(".ja010e-import-result");
                const importSubmit = pane.querySelector(".ja010e-import-submit");
                const files = fileInput ? fileInput.files : null;
                if (!files || files.length === 0) return;

                const formData = new FormData();
                formData.append("corpGr", resolveCorpGr(pane));
                formData.append("ymd", getFilterYmd(pane));
                formData.append("trCoCd", (pane.querySelector("#filterDddw") || {}).value || "");
                Array.from(files).forEach(function(file) { formData.append("files", file); });
                importPreviewLoading = true;
                if (importSubmit) importSubmit.disabled = true;
                if (result) result.textContent = "체결 파일을 증권사 양식에 맞게 변환하고 있습니다.";

                fetch("/api/daily/ja010e/import-trades", { method: "POST", body: formData })
                    .then(function(response) { return response.json(); })
                    .then(function(response) {
                        if (!response.success) throw new Error(response.message || "체결 파일 변환에 실패했습니다.");
                        const errors = Array.isArray(response.errors) ? response.errors : [];
                        importPreviewRows = Array.isArray(response.itemList) ? response.itemList : [];
                        const applyButton = pane.querySelector(".ja010e-import-apply");
                        if (applyButton) applyButton.disabled = importPreviewRows.length === 0;
                        initImportTradeGrid();
                        if (gridImportTrades) gridImportTrades.setData(importPreviewRows);

                        let message = response.message || "체결자료 변환을 완료했습니다.";
                        if (errors.length) message += "\n미적재 " + errors.length + "건:\n" + errors.join("\n");
                        if (importPreviewRows.length) message += "\n저장 또는 닫기를 누르면 INSERT·COMMIT됩니다.";
                        if (result) result.textContent = message;
                        showToast(message.split("\n")[0], errors.length ? "warning" : "success");
                    })
                    .catch(function(error) {
                        console.error("[W_JA010E] 체결 파일 변환 실패:", error);
                        importPreviewRows = [];
                        if (gridImportTrades) gridImportTrades.clearData();
                        if (result) result.textContent = error.message || "체결 파일 변환 중 오류가 발생했습니다.";
                    })
                    .finally(function() {
                        importPreviewLoading = false;
                        if (importSubmit) importSubmit.disabled = false;
                    });
            }

            function commitImportTrades() {
                const dialog = pane.querySelector(".ja010e-import-dialog");
                const result = pane.querySelector(".ja010e-import-result");
                const applyButton = pane.querySelector(".ja010e-import-apply");
                if (importCommitPromise) return importCommitPromise;
                if (importPreviewLoading) {
                    if (result) result.textContent = "파일 변환이 끝난 후 저장 또는 닫기를 눌러 주세요.";
                    return Promise.reject(new Error("체결 파일 변환 중입니다."));
                }
                if (!importPreviewRows.length) {
                    if (dialog && dialog.open) dialog.close();
                    window.loadJa010eData();
                    return Promise.resolve();
                }
                if (applyButton) applyButton.disabled = true;
                if (result) result.textContent = "임시 목록의 체결자료를 INSERT·COMMIT하고 있습니다.";

                importCommitPromise = fetch("/api/daily/ja010e/import-trades/commit", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        corpGr: resolveCorpGr(pane),
                        ymd: getFilterYmd(pane),
                        itemList: importPreviewRows
                    })
                })
                    .then(function(response) { return response.json(); })
                    .then(function(response) {
                        if (!response.success) throw new Error(response.message || "체결자료 저장에 실패했습니다.");
                        importPreviewRows = [];
                        if (dialog && dialog.open) dialog.close();
                        window.loadJa010eData();
                        showToast(response.message || "체결자료를 저장했습니다.", "success");
                    })
                    .catch(function(error) {
                        console.error("[W_JA010E] 체결자료 INSERT·COMMIT 실패:", error);
                        if (result) result.textContent = error.message || "체결자료 저장 중 오류가 발생했습니다.";
                        if (applyButton) applyButton.disabled = false;
                        throw error;
                    })
                    .finally(function() { importCommitPromise = null; });
                return importCommitPromise;
            }

            // 5. Register Standard Contracts (Guideline 8)
            if (pane) {
                pane.onSearch = function() { window.loadJa010eData(); };
                pane.onRetrieve = function() { window.loadJa010eData(); };
                pane.onInput = addNewRow;

                // 삭제 처리 (AamsCudManager 전역 연동)
                pane.onDelete = function() {
                    if (!gridJa010e) return;
                    const selectedRows = gridJa010e.getSelectedRows();
                    if (!selectedRows || selectedRows.length === 0) {
                        showToast("삭제할 행을 먼저 선택해주세요.", "warning");
                        return;
                    }
                    const targetRow = selectedRows[0];
                    if (cudManager) {
                        cudManager.deleteRow(targetRow).then(function() {
                            showToast("행이 삭제되었습니다. [저장] 시 최종 반영됩니다.", "info");
                        });
                    } else {
                        targetRow.delete().then(function() {
                            showToast("행이 삭제되었습니다.", "info");
                        });
                    }
                };

                pane.onSave = function() {
                    if (!gridJa010e) return;
                    const corpGr = resolveCorpGr(pane);
                    if (!corpGr) {
                        showToast("회사그룹을 선택해주세요.", "warning");
                        return;
                    }
                    const ymd = getFilterYmd(pane);

                    let targetItems = [];
                    let deletedItems = [];

                    if (cudManager) {
                        const changes = cudManager.getChanges();
                        if (!changes.hasChanges) {
                            showToast("저장할 변경 내역이 없습니다.", "info");
                            return;
                        }
                        targetItems = changes.itemList;
                        deletedItems = changes.deletedList;
                    } else {
                        const allRows = gridJa010e.getRows();
                        for (let r of allRows) {
                            const d = r.getData();
                            if (d.isNew || d.isUpdated) targetItems.push(d);
                        }
                        if (targetItems.length === 0) {
                            showToast("저장할 변경 내역이 없습니다.", "info");
                            return;
                        }
                    }

                    for (let d of targetItems) {
                        if (!d.fundCd || !d.fundCd.trim()) {
                            showToast("펀드번호는 필수 입력 항목입니다.", "warning");
                            return;
                        }
                        if (!d.jmCd || !d.jmCd.trim()) {
                            showToast("종목코드는 필수 입력 항목입니다.", "warning");
                            return;
                        }
                    }

                    fetch("/api/daily/ja010e/save", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            corpGr: corpGr,
                            ymd: ymd,
                            itemList: targetItems,
                            deletedList: deletedItems
                        })
                    })
                    .then(res => res.json())
                    .then(res => {
                        if (res.success) {
                            if (cudManager) cudManager.reset();
                            showToast(res.message || "정상적으로 저장되었습니다.", "success");
                            window.loadJa010eData();
                        } else {
                            showToast(res.message || "저장 중 오류가 발생했습니다.", "error");
                        }
                    })
                    .catch(err => {
                        console.error("Save error:", err);
                        showToast("저장 중 통신 오류가 발생했습니다.", "error");
                    });
                };

                // 공통버튼 지침: 새로고침은 조회 전 초기화 상태로 되돌린다.
                pane.onRefresh = function() {
                    if (cudManager) cudManager.reset();
                    if (gridJa010e) gridJa010e.clearData();
                    if (typeof showToast === "function") showToast("화면이 초기화되었습니다.", "info");
                };

                pane.onCorpGrChange = function() {
                    initDddwOptions().then(() => {
                        const corp = resolveCorpGr(pane);
                        if (typeof AamsCalendar !== 'undefined') {
                            const dddwSelect = pane ? pane.querySelector("#filterDddw") : null;
                            const trCo = dddwSelect ? dddwSelect.value : "%";
                            const datesUrl = `/api/daily/ja010e/dates?trCoCd=${encodeURIComponent(trCo)}`;
                            AamsCalendar.loadHighlightDates('filterYmd', datesUrl, corp);
                        }
                    });
                };

                pane.addEventListener("corpGrChanged", function() {
                    if (pane.onCorpGrChange) pane.onCorpGrChange();
                });

                // DDDW change event: 증권사 변경 시 달력 하이라이트 날짜 갱신 (자동 조회는 수행하지 않음)
                const filterDddwSelect = pane.querySelector("#filterDddw");
                if (filterDddwSelect) {
                    filterDddwSelect.addEventListener("change", () => {
                        const corp = resolveCorpGr(pane);
                        const trCo = filterDddwSelect.value;
                        const datesUrl = `/api/daily/ja010e/dates?trCoCd=${encodeURIComponent(trCo)}`;
                        if (typeof AamsCalendar !== 'undefined') {
                            AamsCalendar.loadHighlightDates('filterYmd', datesUrl, corp);
                        }
                    });
                }

                // Sub action buttons
                const btnLoad = pane.querySelector("#btnLoad");
                if (btnLoad) {
                    btnLoad.addEventListener("click", function() {
                        const corpGr = resolveCorpGr(pane);
                        const ymd = getFilterYmd(pane);
                        const trCoCd = (pane.querySelector("#filterDddw") || {}).value || "";
                        if (!corpGr || !ymd || !trCoCd || trCoCd === "%") {
                            showToast("회사그룹, 매매일자 및 매매증권사를 선택해 주세요.", "warning");
                            return;
                        }
                        const dialog = pane.querySelector(".ja010e-import-dialog");
                        const fileInput = pane.querySelector(".ja010e-import-file");
                        if (!dialog || !fileInput) return;
                        resetImportTradeModal();
                        dialog.showModal();
                        fileInput.click();
                    });
                }

                const importSubmit = pane.querySelector(".ja010e-import-submit");
                if (importSubmit) {
                    importSubmit.addEventListener("click", function() {
                        const fileInput = pane.querySelector(".ja010e-import-file");
                        if (fileInput) fileInput.click();
                    });
                }

                const importFileInput = pane.querySelector(".ja010e-import-file");
                if (importFileInput) {
                    importFileInput.addEventListener("change", previewImportTradeFiles);
                }

                const importApply = pane.querySelector(".ja010e-import-apply");
                if (importApply) {
                    importApply.addEventListener("click", function() {
                        commitImportTrades().catch(function() {});
                    });
                }

                const importClose = pane.querySelector(".ja010e-import-close");
                if (importClose) {
                    importClose.addEventListener("click", function() {
                        commitImportTrades().catch(function() {});
                    });
                }

                const importDialog = pane.querySelector(".ja010e-import-dialog");
                if (importDialog) {
                    importDialog.addEventListener("cancel", function(event) {
                        event.preventDefault();
                        commitImportTrades().catch(function() {});
                    });
                }

                const btnNew = pane.querySelector("#btnNew");
                if (btnNew) {
                    btnNew.addEventListener("click", function() {
                        showToast("NEW체결은 PowerBuilder의 통합 문서1.xlsm 매크로와 SJT1JG.txt 산출물을 사용하는 별도 처리입니다. 웹에서는 체결등록으로 증권사 원본 파일을 등록하거나 [입력]으로 수기 체결을 추가해 주세요.", "info");
                    });
                }

                const btnDel = pane.querySelector("#btnDel");
                if (btnDel) {
                    btnDel.addEventListener("click", function() {
                        const corpGr = resolveCorpGr(pane);
                        const ymd = getFilterYmd(pane);
                        const trCoCd = (pane.querySelector("#filterDddw") || {}).value || "";
                        if (!corpGr || !ymd || !trCoCd) {
                            showToast("회사그룹, 매매일자 및 매매증권사를 확인해주세요.", "warning");
                            return;
                        }
                        if (!confirm("LOAD한 체결자료를 일괄 삭제하시겠습니까?\n입력한 자료는 삭제되지 않습니다.")) return;

                        const params = new URLSearchParams({ corpGr: corpGr, ymd: ymd, trCoCd: trCoCd });
                        fetch("/api/daily/ja010e/delete-loaded", {
                            method: "POST",
                            headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
                            body: params
                        })
                            .then(function(res) { return res.json(); })
                            .then(function(res) {
                                if (!res.success) throw new Error(res.message || "일괄삭제에 실패했습니다.");
                                showToast((res.deletedCount || 0) + "건의 LOAD 자료를 삭제했습니다. 입력한 자료는 유지됩니다.", "success");
                                window.loadJa010eData();
                            })
                            .catch(function(err) {
                                console.error("[W_JA010E] 일괄삭제 실패:", err);
                                showToast(err.message || "일괄삭제 중 오류가 발생했습니다.", "error");
                            });
                    });
                }

                const btn2402 = pane.querySelector("#btn2402");
                if (btn2402) {
                    btn2402.addEventListener("click", function() {
                        showToast("잔고LOAD는 PowerBuilder에서 현재 실행 중인 Excel의 모든 펀드 시트를 읽어 저장 전 그리드에 추가하는 관리자 전용 기능입니다. 웹 파일 업로드 화면으로 별도 이관이 필요합니다.", "info");
                    });
                }
            }

            // Guideline 10: Single initialization entry point with isInitialized guard
            let isInitialized = false;
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                initCalendar();
                initGrid();
                initDddwOptions();
                // 자동 조회 지침: boolean eb_direct_retrieve = true 가 없으므로 초기 자동 조회 없음
            }

            if (document.readyState === "complete" || document.readyState === "interactive") {
                setTimeout(startInit, 0);
            } else {
                document.addEventListener("DOMContentLoaded", startInit);
            }
        })();
    </script>
</div>
</html>

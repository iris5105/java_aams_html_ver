<!DOCTYPE html>

<div class="view-container layout-split ja010m3-container" th:fragment="ja010m3View" style="display: flex; flex-direction: column; height: 100%; width: 100%; overflow: hidden;">

    <!-- 1. 상단 공통 툴바 (Row 1: 공통 액션 버튼 + 네비게이션 브레드크럼) -->

    <!-- 2. 상단 공통 필터바 (Row 2: Rule 14 & Rule 17 - dc_ymd_dddw fragment matching dw_c in w_ja010m3.srw) -->

            <div th:replace="~{fragments/filter/dc_ymd_dddw :: filter(labelYmd='결산기준일', labelDddw='정렬구분', ymd=${ymd})}"></div>

        <!-- 좌측: 결산현황 목록 그리드 (d_ja010m3) -->

            <div class="pane-header">

                    <span style="font-weight: 600; font-size: 13px; color: #1e293b;">

                            </button>
                            <button type="button" class="btn-export-format export-btn" data-format="excel" title="Excel(XLSX) 파일로 저장" style="border: 1px solid #10b981; color: #059669;">
                                <i class="fa-solid fa-file-excel" style="color: #10b981;"></i>Excel
                            </button>
                            <button type="button" class="btn-export-format export-btn" data-format="word" title="MS Word(DOC) 파일로 저장" style="border: 1px solid #3b82f6; color: #2563eb;">

                            <button type="button" class="btn-export-format export-btn" data-format="ppt" title="PowerPoint(PPTX) 파일로 저장" style="border: 1px solid #f59e0b; color: #d97706;">

                <div class="pane-body" style="background-color: #525659; position: relative;">
                    <!-- 로딩 스피너 -->

                    <span>결산보고서</span>
                </div>
                <button type="button" class="btn-export-format btn-pdf mobile-export-btn" data-format="pdf" title="PDF 파일로 저장"><i class="fa-solid fa-file-pdf"></i> PDF</button>

            <!-- 3. 하단: 결산보고서 뷰어 바디 -->
            <div class="report-modal-body" style="flex: 1 1 auto; height: 100%; min-height: 220px; position: relative; background: #525659;">
                <div id="mobile-preview-loading" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #ffffff; z-index: 10;">
                    <i class="fa-solid fa-spinner fa-spin fa-2x" style="margin-bottom: 8px;"></i>
                    <div style="font-size: 12px;">보고서를 로드 중입니다...</div>
                </div>
                <div id="mobile-report-placeholder" style="display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; color: #cbd5e1; font-size: 13px; text-align: center; background: #475569;">
                    <i class="fa-regular fa-file-lines" style="font-size: 36px; margin-bottom: 8px;"></i>
                    <span id="mobile-placeholder-text">결산보고서가 존재하지 않는 항목입니다.</span>

            </div>
        </div>
    </div>


    <!-- Page Specific Script for w_ja010m3 -->
    <script th:inline="javascript">
        (function() {
            const currentScript = document.currentScript;
            const pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;

            let grid = null;
            let isInitialized = false;
            let lastLoadedMasterKey = null;
            let currentSelectedRowData = null;
            let currentReportUrl = "";


            function getFilterValues() {
                const ymdInput = pane ? pane.querySelector("#filterYmd") : document.getElementById("filterYmd");
                const dddwSelect = pane ? pane.querySelector("#filterDddw") : document.getElementById("filterDddw");
                let ymd = ymdInput ? (ymdInput.value || "") : "";
                let rawSort = dddwSelect ? (dddwSelect.value || "1") : "1";
                // 고객명순: sortGb = "1", 결산일순: sortGb = "2"
                let sortGb = (String(rawSort).trim() === "2" || String(rawSort).includes("결산일")) ? "2" : "1";
                return {
                    gyulYmd: ymd.replace(/\./g, '-'),
                    sortGb: sortGb
                };
            }

            // Init Filter DDDW Options
            // 파워빌더 소스 원본: f_dddwctl (THIS, 'dddw | dual', gaa.corp_gr, "1,고객명순,,2,결산일순,", 1, "")
            // 웹 프로젝트 변환 호출 규격: f_dddwctl ('dddw | dual', gaa.corp_gr, "1,고객명순,,2,결산일순,", 1, "")
            function initFilterDddw() {
                const selectEl = pane ? pane.querySelector("#filterDddw") : document.getElementById("filterDddw");
                if (!selectEl) return Promise.resolve();
                const corpGr = resolveCorpGr();

                if (typeof window.f_dddwctl === 'function') {
                    // 웹 프로젝트 변환 f_dddwctl 호출을 통해 dual 데이터 생성
                    return window.f_dddwctl('dddw | dual', corpGr, "1,고객명순,,2,결산일순,", 1, "").then(list => {
                        // 2-Column DDDW 드롭다운 위젯 적용 (개발지침 Rule 7: 코드, 코드명 2칸 분할)
                        if (typeof window.f_dddwctl.get2ColItemFormatter === 'function') {
                            window.f_dddwctl.get2ColItemFormatter(selectEl, list, {
                                codeTitle: "구분",
                                nameTitle: "정렬순서",
                                defaultVal: selectEl.value || (list && list[0] ? list[0].code : "1"),
                                onSelect: function(code, name) {
                                    selectEl.value = code;
                                }
                            });
                        } else {
                            selectEl.innerHTML = list.map(item => `<option value="${item.code}">${item.code} : ${item.name}</option>`).join("");
                            selectEl.value = (list && list[0] ? list[0].code : "1");
                        }
                        return list;
                    }).catch(err => {
                        console.error("[initFilterDddw] f_dddwctl load error:", err);
                    });
                }
                return Promise.resolve();
            }

            // Date Formatter Helper (Fixed missing formatDateVal runtime error)
            function formatDateVal(val) {
                if (!val) return "";
                const clean = String(val).replace(/\D/g, "");
                if (clean.length === 8) {
                    return clean.substring(0, 4) + '.' + clean.substring(4, 6) + '.' + clean.substring(6, 8);
                }
                return String(val).replace(/-/g, ".");
            }

            // Number Formatter Helpers
            function numFormatter(cell) {
                const val = cell.getValue();
                if (val == null || val === "" || isNaN(val)) return "0";
                return Math.round(Number(val)).toLocaleString();
            }

            function percentFormatter(cell) {
                const val = cell.getValue();
                if (val == null || val === "" || isNaN(val)) return "0.00";
                return Number(val).toFixed(2);
            }


            // Editable rule for cells: only allow editing if tblGb === 'a'
            function isCellEditable(cell) {
                const data = cell.getRow().getData();
                return data && data.tblGb === 'a';
            }

            // Columns definition based on d_ja010m3.srd
            const columns = [
                {
                    title: "No.",
                    field: "fseq",
                    formatter: "rownum",
                    width: 50,
                    hozAlign: "center",
                    headerHozAlign: "center",
                    frozen: true
                },
                {
                    title: "펀드명",
                    field: "xxFundCd",
                    minWidth: 150,
                    hozAlign: "left",
                    headerHozAlign: "center",
                    frozen: true,
                    // 파워빌더 d_ja010m3 visible="1~tif(tbl_gb='a',1,0)": tbl_gb='b'는 빈칸 표출
                    formatter: cell => {
                        const d = cell.getRow().getData();
                        return (d && d.tblGb === 'b') ? "" : (cell.getValue() || "");
                    }
                },
                {
                    title: "결산원자",
                    field: "gyulYmd",
                    width: 95,
                    hozAlign: "center",
                    headerHozAlign: "center",
                    // 파워빌더 d_ja010m3 visible="0~tif(tbl_gb='a',1,0)": tbl_gb='b'는 빈칸 표출
                    formatter: cell => {
                        const d = cell.getRow().getData();
                        return (d && d.tblGb === 'b') ? "" : formatDateVal(cell.getValue());
                    }
                },
                {
                    title: "수익률(%)",
                    field: "pjSuikPer",
                    width: 85,
                    hozAlign: "right",
                    headerHozAlign: "center",
                    formatter: percentFormatter
                },
                {
                    title: "보수합계",
                    field: "totalBosu",
                    width: 105,
                    hozAlign: "right",
                    headerHozAlign: "center",
                    cssClass: "col-hdr-blue",
                    headerCssClass: "col-hdr-blue",
                    formatter: cell => '<span class="cell-text-blue">' + numFormatter(cell) + '</span>'
                },
                {
                    title: "투자일임<br>수수료",
                    field: "basicBosu",
                    width: 100,
                    hozAlign: "right",
                    headerHozAlign: "center",
                    formatter: numFormatter,
                    editor: "number",
                    editable: isCellEditable,
                    cellClick: aamsCellEdit,
                    cellEdited: function(cell) {
                        const row = cell.getRow();
                        const data = row.getData();
                        const basic = parseFloat(cell.getValue()) || 0;
                        const success = parseFloat(data.successBosu) || 0;
                        row.update({
                            basicBosu: basic,
                            totalBosu: basic + success,
                            isUpdated: true
                        });
                    }
                },
                {
                    title: "성과수수료",
                    field: "successBosu",
                    width: 105,
                    hozAlign: "right",
                    headerHozAlign: "center",
                    formatter: numFormatter,
                    editor: "number",
                    editable: isCellEditable,
                    cellClick: aamsCellEdit,
                    cellEdited: function(cell) {
                        const row = cell.getRow();
                        const data = row.getData();
                        const success = parseFloat(cell.getValue()) || 0;
                        const basic = parseFloat(data.basicBosu) || 0;
                        row.update({
                            successBosu: success,
                            totalBosu: basic + success,
                            isUpdated: true
                        });
                    }
                },
                {
                    title: "제계약액",
                    field: "recontractAek",
                    width: 110,
                    hozAlign: "right",
                    headerHozAlign: "center",
                    formatter: numFormatter,
                    editor: "number",
                    editable: isCellEditable,
                    cellClick: aamsCellEdit,
                    cellEdited: function(cell) {
                        cell.getRow().update({ isUpdated: true });
                    }
                },
                {
                    title: "펀드코드",
                    field: "fundCd",
                    width: 80,
                    hozAlign: "center",
                    headerHozAlign: "center",
                    cssClass: "col-hdr-green",
                    headerCssClass: "col-hdr-green",
                    // 파워빌더 d_ja010m3 visible="1~tif(tbl_gb='a',1,0)": tbl_gb='b'는 빈칸 표출, 초록색 글씨
                    formatter: cell => {
                        const d = cell.getRow().getData();
                        if (d && d.tblGb === 'b') return "";
                        const v = cell.getValue() || "";
                        return v ? `<span class="cell-text-green">${v}</span>` : "";
                    }
                },
                {
                    title: "수수료(%)",
                    headerHozAlign: "center",
                    columns: [
                        {
                            title: "선취",
                            field: "preBasic",
                            width: 50,
                            hozAlign: "center",
                            headerHozAlign: "center",
                            formatter: percentFormatter
                        },
                        {
                            title: "후취",
                            field: "basicPer",
                            width: 50,
                            hozAlign: "center",
                            headerHozAlign: "center",
                            formatter: percentFormatter
                        }
                    ]
                },
                {
                    title: "BM<br>(%)",
                    field: "bmPer",
                    width: 65,
                    hozAlign: "center",
                    headerHozAlign: "center",
                    formatter: percentFormatter
                },
                {
                    title: "성과<br>보수(%)",
                    field: "successPer",
                    width: 75,
                    hozAlign: "center",
                    headerHozAlign: "center",
                    formatter: percentFormatter
                },
                {
                    title: "워터마크<br>투자일임액",
                    field: "wmSeoljAek",
                    width: 120,
                    hozAlign: "right",
                    headerHozAlign: "center",
                    cssClass: "col-hdr-red",
                    headerCssClass: "col-hdr-red",
                    formatter: cell => '<span class="cell-text-red">' + numFormatter(cell) + '</span>',
                    editor: "number",
                    editable: isCellEditable,
                    cellClick: aamsCellEdit,
                    cellEdited: function(cell) {
                        cell.getRow().update({ isUpdated: true });
                    }
                },
                {
                    title: "워터마크 손익액",
                    field: "wmSonik",
                    width: 110,
                    hozAlign: "right",
                    headerHozAlign: "center",
                    cssClass: "col-hdr-red",
                    headerCssClass: "col-hdr-red",
                    formatter: cell => '<span class="cell-text-red">' + numFormatter(cell) + '</span>',
                    editor: "number",
                    editable: isCellEditable,
                    cellClick: aamsCellEdit,
                    cellEdited: function(cell) {
                        cell.getRow().update({ isUpdated: true });
                    }
                },
                {
                    title: "재계약 공문서번호",
                    field: "docNo",
                    width: 120,
                    hozAlign: "left",
                    headerHozAlign: "center",
                    editor: "input",
                    editable: isCellEditable,
                    cellClick: aamsCellEdit,
                    cellEdited: function(cell) {
                        cell.getRow().update({ isUpdated: true });
                    }
                },
                {
                    title: "해지사유",
                    field: "haejiSayu",
                    width: 130,
                    hozAlign: "left",
                    headerHozAlign: "center",
                    editor: "input",
                    editable: isCellEditable,
                    cellClick: aamsCellEdit,
                    cellEdited: function(cell) {
                        cell.getRow().update({ isUpdated: true });
                    }
                },
                {

                    field: "tujaPj",
                    width: 110,
                    hozAlign: "right",
                    headerHozAlign: "center",
                    formatter: numFormatter
                },
                {
                    title: "투자원금",
                    field: "tujaAek",
                    width: 110,
                    hozAlign: "right",
                    headerHozAlign: "center",
                    formatter: numFormatter
                },
                {
                    title: "순자산액",
                    field: "nav",
                    width: 110,
                    hozAlign: "right",
                    headerHozAlign: "center",
                    formatter: numFormatter
                },
                {
                    title: "손익액",
                    field: "sonik",
                    width: 110,
                    hozAlign: "right",
                    headerHozAlign: "center",
                    formatter: numFormatter
                }
            ];

            let isProgrammaticSelect = false;

            // Helper to check if currently in mobile view (태블릿-S / 876px 이하 또는 우측 패널 숨김)
            function isMobileView() {
                const right = pane ? (pane.querySelector('.pane-right') || pane.querySelector('.right-pane') || pane.querySelector('.split-right') || pane.querySelector('.report-card')) 
                                   : (document.querySelector('.pane-right') || document.querySelector('.right-pane') || document.querySelector('.split-right') || document.querySelector('.report-card'));
                if (right && window.getComputedStyle(right).display === 'none') {
                    return true;
                }
                return window.matchMedia('(max-width: 876px)').matches || window.innerWidth <= 876 || (pane && pane.clientWidth > 0 && pane.clientWidth <= 876);
            }

            // Detail Synchronizer: Update Memo & Load RD Report (Rule 8, 10 및 모바일 자동 조회 방지)
            function syncDetail(row, rowData, isUserClick) {
                if (!row) return;
                if (!row.isSelected || !row.isSelected()) {
                    row.select();
                }
                const data = rowData || (row.getData ? row.getData() : null);
                if (!data) return;

                // 1) 모바일 환경: 사용자가 직접 클릭했을 때 상단 메모 + 하단 결산보고서 통합 모달 오픈 (키 비교 이전 즉시 표출 보장)
                if (isMobileView() && isUserClick) {
                    openMobileModal(data);
                }

                const currentKey = (data.corpGr || "") + "_" + (data.fundCd || "") + "_" + (data.gyulYmd || "") + "_" + (data.tblGb || "");
                if (lastLoadedMasterKey === currentKey) return;
                lastLoadedMasterKey = currentKey;

                // 이전 행의 메모 수정사항 반영
                if (currentSelectedRowData && currentSelectedRowData._memoEdited) {
                    const prevRow = grid.getRows().find(r => r.getData() === currentSelectedRowData);
                    if (prevRow) {
                        prevRow.update({
                            contractCondition: currentSelectedRowData.contractCondition,
                            isUpdated: true
                        });
                    }
                }

                currentSelectedRowData = data;
                const corpGr = resolveCorpGr();

                // 2) Bind Memo (mle_cond) & 권한 보호 (Rule 12: corpGr == '2402' 및 tblGb == 'a'만 수정 허용)
                const memoEl = pane ? pane.querySelector("#ja010m3-memo") : document.getElementById("ja010m3-memo");
                const nameEl = pane ? pane.querySelector("#memo-fund-name") : document.getElementById("memo-fund-name");
                if (nameEl) {
                    nameEl.textContent = `${data.xxFundCd || ''} (${data.fundCd || ''}) - ${formatDateVal(data.gyulYmd)}`;
                }
                if (memoEl) {
                    memoEl.value = data.contractCondition || "";
                    const isEditable = (corpGr === '2402' && data.tblGb === 'a');
                    memoEl.readOnly = !isEditable;
                    memoEl.style.backgroundColor = isEditable ? "#ffffff" : "#f1f5f9";
                }

                // 3) 데스크톱 환경: 우측 pane에 리포트 자동 표출
                if (!isMobileView()) {
                    loadRdReportPreview(data);
                }
            }

            // RD Report Preview Loader (리포트 뷰어 표준 규격)
            function loadRdReportPreview(data) {
                const placeholder = pane ? pane.querySelector("#report-placeholder") : document.getElementById("report-placeholder");
                const frame = pane ? pane.querySelector("#report-frame") : document.getElementById("report-frame");
                const loading = pane ? pane.querySelector("#preview-loading") : document.getElementById("preview-loading");
                const statusEl = pane ? pane.querySelector("#preview-status") : document.getElementById("preview-status");

                if (!data) {
                    if (frame) {
                        frame.style.display = "none";
                        frame.src = "about:blank";
                    }
                    if (placeholder) {
                        placeholder.style.display = "flex";
                        placeholder.innerHTML = `<i class="fa-regular fa-file-lines" style="font-size: 36px; margin-bottom: 8px;"></i><span>선택된 결산건의 보고서가 여기에 표출됩니다.</span>`;
                    }
                    if (statusEl) statusEl.textContent = "선택된 건 없음";
                    currentReportUrl = "";
                    return;
                }

                // 파워빌더 w_ja010m3.srw: tbl_gb='b' 행 클릭 시에도 같은 건의 'a' 행 리포트를 연계하여 표출
                if (data.tblGb === 'b') {
                    if (grid) {
                        const allRows = grid.getData();
                        const pairRow = allRows.find(r => r.tblGb === 'a' && r.fundCd === data.fundCd && r.gyulYmd === data.gyulYmd);
                        if (pairRow && pairRow.mrdNm) {
                            data = pairRow;
                        } else {
                            // 기존 보고서 유지
                            return;
                        }
                    } else {
                        return;
                    }
                }

                if (!data.mrdNm) {
                    if (frame) {
                        frame.style.display = "none";
                        frame.src = "about:blank";
                    }
                    if (placeholder) {
                        placeholder.style.display = "flex";
                        placeholder.innerHTML = `<i class="fa-regular fa-file-lines" style="font-size: 36px; margin-bottom: 8px;"></i><span>결산보고서가 존재하지 않는 항목입니다.</span>`;
                    }
                    if (statusEl) statusEl.textContent = "보고서 없음";
                    currentReportUrl = "";
                    return;
                }

                const corpGr = resolveCorpGr();
                const mrd = (data.mrdNm || "").trim();
                const fundCd = data.fundCd || "";
                const fundNm = data.xxFundCd || "";
                const gyulYmd = (data.gyulYmd || "").replace(/\./g, '-');

                const previewUrl = `/api/daily/ja010m3/preview?corpGr=${encodeURIComponent(corpGr)}&mrdName=${encodeURIComponent(mrd)}&fundCd=${encodeURIComponent(fundCd)}&fundNm=${encodeURIComponent(fundNm)}&gyulYmd=${encodeURIComponent(gyulYmd)}&t=${new Date().getTime()}`;
                currentReportUrl = previewUrl;

                if (statusEl) {
                    statusEl.textContent = `${fundNm} (${formatDateVal(gyulYmd)})`;
                }

                if (placeholder) placeholder.style.display = "none";
                if (loading) loading.style.display = "block";

                if (frame) {
                    frame.style.display = "block";
                    frame.src = previewUrl;
                    frame.onload = function() {
                        if (loading) loading.style.display = "none";
                    };
                }
            }

            // 모바일 통합 모달 열기 (상단: 계약조건 메모, 하단: 결산보고서)
            function openMobileModal(data) {
                const modal = pane ? pane.querySelector("#ja010m3MobileModal") : document.getElementById("ja010m3MobileModal");
                const modalFrame = pane ? pane.querySelector("#mobile-report-frame") : document.getElementById("mobile-report-frame");
                const modalLabel = pane ? pane.querySelector("#mobileModalLabel") : document.getElementById("mobileModalLabel");
                const mobileMemoEl = pane ? pane.querySelector("#ja010m3-mobile-memo") : document.getElementById("ja010m3-mobile-memo");
                const mobileMemoFundEl = pane ? pane.querySelector("#mobile-memo-fund-name") : document.getElementById("mobile-memo-fund-name");
                const loadingEl = pane ? pane.querySelector("#mobile-preview-loading") : document.getElementById("mobile-preview-loading");
                const placeholderEl = pane ? pane.querySelector("#mobile-report-placeholder") : document.getElementById("mobile-report-placeholder");
                const placeholderText = pane ? pane.querySelector("#mobile-placeholder-text") : document.getElementById("mobile-placeholder-text");

                if (!modal) return;

                const corpGr = resolveCorpGr();
                const fundCd = data.fundCd || "";
                const fundNm = data.xxFundCd || "";
                const gyulYmd = (data.gyulYmd || "").replace(/\./g, '-');

                // 1) 모달 상단 타이틀
                if (modalLabel) {
                    modalLabel.textContent = `결산보고서 및 계약조건 - ${fundNm} (${formatDateVal(gyulYmd)})`;
                }

                // 2) 상단 계약조건 메모 바인딩 & 권한 제어 (Rule 12: corpGr == '2402' 및 tblGb == 'a'만 수정 허용)
                if (mobileMemoFundEl) {
                    mobileMemoFundEl.textContent = `${fundNm} (${fundCd}) - ${formatDateVal(gyulYmd)}`;
                }
                if (mobileMemoEl) {
                    mobileMemoEl.value = data.contractCondition || "";
                    const isEditable = (corpGr === '2402' && data.tblGb === 'a');
                    mobileMemoEl.readOnly = !isEditable;
                    mobileMemoEl.style.backgroundColor = isEditable ? "#ffffff" : "#f1f5f9";
                }

                // 3) 하단 결산보고서 로딩 분기 (tbl_gb='b' 대응 및 mrdNm 체크)
                let reportData = data;
                if (reportData.tblGb === 'b' && grid) {
                    const allRows = grid.getData();
                    const pairRow = allRows.find(r => r.tblGb === 'a' && r.fundCd === data.fundCd && r.gyulYmd === data.gyulYmd);
                    if (pairRow && pairRow.mrdNm) {
                        reportData = pairRow;
                    }
                }

                const mrd = (reportData.mrdNm || "").trim();

                if (!mrd) {
                    if (modalFrame) {
                        modalFrame.style.display = "none";
                        modalFrame.src = "about:blank";
                    }
                    if (loadingEl) loadingEl.style.display = "none";
                    if (placeholderEl) {
                        placeholderEl.style.display = "flex";
                        if (placeholderText) placeholderText.textContent = "결산보고서가 존재하지 않는 항목입니다.";
                    }
                } else {
                    if (placeholderEl) placeholderEl.style.display = "none";
                    if (loadingEl) loadingEl.style.display = "block";
                    if (modalFrame) {
                        modalFrame.style.display = "block";
                        const rptFundCd = reportData.fundCd || "";
                        const rptFundNm = reportData.xxFundCd || "";
                        const rptGyulYmd = (reportData.gyulYmd || "").replace(/\./g, '-');
                        const previewUrl = `/api/daily/ja010m3/preview?corpGr=${encodeURIComponent(corpGr)}&mrdName=${encodeURIComponent(mrd)}&fundCd=${encodeURIComponent(rptFundCd)}&fundNm=${encodeURIComponent(rptFundNm)}&gyulYmd=${encodeURIComponent(rptGyulYmd)}&t=${new Date().getTime()}`;
                        modalFrame.src = previewUrl;
                        modalFrame.onload = function() {
                            if (loadingEl) loadingEl.style.display = "none";
                        };
                    }
                }

                modal.style.display = "flex";
            }

            function closeMobileModal() {
                const modal = pane ? pane.querySelector("#ja010m3MobileModal") : document.getElementById("ja010m3MobileModal");
                const modalFrame = pane ? pane.querySelector("#mobile-report-frame") : document.getElementById("mobile-report-frame");
                if (modal) modal.style.display = "none";
                if (modalFrame) modalFrame.src = "about:blank";
            }

            // 리포트 내보내기 실행 (PDF, Excel, Word, PPT, HWP)
            function exportReport(format) {
                if (!currentSelectedRowData) {
                    if (window.AamsModal) window.AamsModal.alert("내보낼 결산 항목을 먼저 선택해주세요.");
                    else alert("내보낼 결산 항목을 먼저 선택해주세요.");
                    return;
                }
                if (currentSelectedRowData.tblGb === 'b' || !currentSelectedRowData.mrdNm) {
                    if (window.AamsModal) window.AamsModal.alert("해당 항목은 결산보고서가 존재하지 않습니다.");
                    else alert("해당 항목은 결산보고서가 존재하지 않습니다.");
                    return;
                }

                const corpGr = resolveCorpGr();
                const mrd = (currentSelectedRowData.mrdNm || "").trim();
                const fundCd = currentSelectedRowData.fundCd || "";
                const fundNm = currentSelectedRowData.xxFundCd || "";
                const gyulYmd = (currentSelectedRowData.gyulYmd || "").replace(/\./g, '-');

                const exportUrl = `/api/daily/ja010m3/export?corpGr=${encodeURIComponent(corpGr)}&mrdName=${encodeURIComponent(mrd)}&fundCd=${encodeURIComponent(fundCd)}&fundNm=${encodeURIComponent(fundNm)}&gyulYmd=${encodeURIComponent(gyulYmd)}&format=${encodeURIComponent(format)}`;
                window.location.href = exportUrl;
            }

            // Grid Data Loader
            function loadGrid() {
                const corpGr = resolveCorpGr();
                const filters = getFilterValues();
                if (!corpGr) {
                    if (window.AamsModal) window.AamsModal.alert("회사그룹을 선택해주세요.");
                    return;
                }

                lastLoadedMasterKey = null;
                currentSelectedRowData = null;

                const countEl = pane ? pane.querySelector("#grid-count") : document.getElementById("grid-count");
                const memoEl = pane ? pane.querySelector("#ja010m3-memo") : document.getElementById("ja010m3-memo");
                const nameEl = pane ? pane.querySelector("#memo-fund-name") : document.getElementById("memo-fund-name");
                if (nameEl) nameEl.textContent = "선택된 펀드 없음";
                if (memoEl) memoEl.value = "";
                loadRdReportPreview(null);

                let url = `/api/daily/ja010m3/list?corpGr=${encodeURIComponent(corpGr)}&sortGb=${encodeURIComponent(filters.sortGb)}`;
                if (filters.gyulYmd) {
                    url += `&gyulYmd=${encodeURIComponent(filters.gyulYmd)}`;
                }

                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        grid.setData(data || []).then(() => {
                            grid.redraw(true);
                            if (countEl) {
                                countEl.textContent = (data ? data.length : 0) + "건";
                            }
                            // Rule 8, 15: 데스크톱만 첫 행 자동 선택, 모바일 환경에서는 첫행 autofocus/select 완전 차단
                            if (data && data.length > 0) {
                                if (!isMobileView()) {
                                    const rows = grid.getRows();
                                    if (rows && rows.length > 0) {
                                        isProgrammaticSelect = true;
                                        rows[0].select();
                                        syncDetail(rows[0], data[0], false);
                                        setTimeout(() => { isProgrammaticSelect = false; }, 150);
                                    }
                                } else {
                                    // 모바일 환경: 첫행 autofocus 및 자동 선택 방지 (선택 해제 및 마스터키 초기화)
                                    grid.deselectRow();
                                    currentSelectedRowData = null;
                                    lastLoadedMasterKey = null;
                                    setTimeout(() => {
                                        if (grid && typeof grid.deselectRow === 'function') {
                                            grid.deselectRow();
                                        }
                                    }, 50);
                                }
                            }
                        });
                    })
                    .catch(err => {
                        console.error("Failed to load ja010m3 data:", err);
                        grid.clearData();
                        if (countEl) countEl.textContent = "0건";
                    });
            }

            // Initialization Function
            function init() {
                initFilterDddw();

                const gridEl = pane ? pane.querySelector("#ja010m3-grid") : document.getElementById("ja010m3-grid");
                if (!gridEl) return;

                grid = new Tabulator(gridEl, {
                    data: [],
                    layout: "fitDataFill",
                    selectable: 1,
                    columns: columns,
                    height: "100%",
                    placeholder: "조회된 결산현황 데이터가 없습니다.",
                    rowFormatter: function(row) {
                        const data = row.getData();
                        if (data && data.tblGb === 'b') {
                            row.getElement().style.backgroundColor = "#f8fafc"; // 파워빌더 'b' 행(계산 데이터) 포인트 음영
                        }
                    }
                });

                // Rule 8: Triple Fallback Row Selection for Master Grid
                // 모바일 환경 자동 선택 방지: { autoSelectFirst: false } 옵션 지정 (common.js의 50ms 후 자동 doSelect 완전 차단)
                if (typeof setupTabulatorRowSelection === 'function') {
                    setupTabulatorRowSelection(grid, function(row, data) {
                        if (!isProgrammaticSelect) {
                            syncDetail(row, data, true);
                        }
                    }, { autoSelectFirst: false });
                }
                grid.on("rowClick", function(e, row) {
                    if (!isProgrammaticSelect) {
                        syncDetail(row, row ? row.getData() : null, true);
                    }
                });
                grid.on("rowSelectionChanged", function(data, rows) {
                    if (rows && rows.length > 0 && !isMobileView()) {
                        syncDetail(rows[0], rows[0].getData(), false);
                    }
                });

                // Memo Edit Handler (데스크톱 및 모바일 양방향 동기화)
                const memoEl = pane ? pane.querySelector("#ja010m3-memo") : document.getElementById("ja010m3-memo");
                const mobileMemoEl = pane ? pane.querySelector("#ja010m3-mobile-memo") : document.getElementById("ja010m3-mobile-memo");

                if (memoEl) {
                    memoEl.addEventListener("input", function() {
                        const corpGr = resolveCorpGr();
                        if (currentSelectedRowData && corpGr === '2402' && currentSelectedRowData.tblGb === 'a') {
                            currentSelectedRowData.contractCondition = memoEl.value;
                            currentSelectedRowData._memoEdited = true;
                            currentSelectedRowData.isUpdated = true;
                            if (mobileMemoEl) mobileMemoEl.value = memoEl.value;
                        }
                    });
                }
                if (mobileMemoEl) {
                    mobileMemoEl.addEventListener("input", function() {
                        const corpGr = resolveCorpGr();
                        if (currentSelectedRowData && corpGr === '2402' && currentSelectedRowData.tblGb === 'a') {
                            currentSelectedRowData.contractCondition = mobileMemoEl.value;
                            currentSelectedRowData._memoEdited = true;
                            currentSelectedRowData.isUpdated = true;
                            if (memoEl) memoEl.value = mobileMemoEl.value;
                        }
                    });
                }

                // New Tab Button Handler
                const btnNewTab = pane ? pane.querySelector("#btnOpenNewWindow") : document.getElementById("btnOpenNewWindow");
                if (btnNewTab) {
                    btnNewTab.addEventListener("click", function() {
                        if (currentReportUrl) {
                            window.open(currentReportUrl, "_blank");
                        }
                    });
                }

                // 5 Format Export Buttons Binding
                const exportBtns = pane ? pane.querySelectorAll(".export-btn, .mobile-export-btn") : document.querySelectorAll(".export-btn, .mobile-export-btn");
                exportBtns.forEach(btn => {
                    btn.addEventListener("click", function() {
                        const fmt = this.getAttribute("data-format") || "pdf";
                        exportReport(fmt);
                    });
                });

                // Mobile Modal Close Button & Backdrop Handler
                const btnCloseMobile = pane ? pane.querySelector("#btnCloseMobileModal") : document.getElementById("btnCloseMobileModal");
                if (btnCloseMobile) {
                    btnCloseMobile.addEventListener("click", function() {
                        closeMobileModal();
                    });
                }

                const modal = pane ? pane.querySelector("#ja010m3MobileModal") : document.getElementById("ja010m3MobileModal");
                if (modal) {
                    modal.addEventListener("click", function(e) {
                        if (e.target === modal) {
                            closeMobileModal();
                        }
                    });
                }

                // ESC key handler for modal
                document.addEventListener("keydown", function(e) {
                    if (e.key === "Escape") {
                        closeMobileModal();
                    }
                });

                // Window resize responsive sync
                window.addEventListener('resize', function () {
                    if (grid) grid.redraw(true);
                    if (!isMobileView()) {
                        closeMobileModal();
                        if (currentSelectedRowData) {
                            loadRdReportPreview(currentSelectedRowData);
                        }
                    }
                });

                // Initial Load (Rule: eb_direct_retrieve = true)
                setTimeout(loadGrid, 100);
            }

            // Save Function (Rule 9)
            function save() {
                if (!grid) return;
                
                // Sync current memo value before save
                const memoEl = pane ? pane.querySelector("#ja010m3-memo") : document.getElementById("ja010m3-memo");
                if (memoEl && currentSelectedRowData && currentSelectedRowData.tblGb === 'a') {
                    currentSelectedRowData.contractCondition = memoEl.value;
                }

                const rows = grid.getData();
                const updatedList = rows.filter(r => r.isUpdated && r.tblGb === 'a');

                if (!updatedList || updatedList.length === 0) {
                    if (window.AamsModal) window.AamsModal.alert("수정된 결산 정보가 없습니다.");
                    else alert("수정된 결산 정보가 없습니다.");
                    return;
                }

                const corpGr = resolveCorpGr();
                const saveDto = {
                    updatedList: updatedList.map(r => ({
                        corpGr: corpGr,
                        gyulYmd: r.gyulYmd,
                        fundCd: r.fundCd,
                        basicBosu: r.basicBosu,
                        successBosu: r.successBosu,
                        totalBosu: r.totalBosu,
                        recontractAek: r.recontractAek,
                        wmSeoljAek: r.wmSeoljAek,
                        wmSonik: r.wmSonik,
                        docNo: r.docNo,
                        haejiSayu: r.haejiSayu,
                        sendMailAddr: r.sendMailAddr,
                        sendCcAddr: r.sendCcAddr,
                        productNm: r.productNm,
                        contractCondition: r.contractCondition,
                        tblGb: r.tblGb
                    }))
                };

                const doSave = function() {
                    fetch("/api/daily/ja010m3/save", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(saveDto)
                    })
                    .then(res => res.json())
                    .then(res => {
                        if (res.success) {
                            if (window.AamsModal) {
                                window.AamsModal.alert("저장이 완료되었습니다.", () => {
                                    loadGrid();
                                });
                            } else {
                                alert("저장이 완료되었습니다.");
                                loadGrid();
                            }
                        } else {
                            if (window.AamsModal) window.AamsModal.alert(res.message || "저장 중 오류가 발생했습니다.");
                            else alert(res.message || "저장 중 오류가 발생했습니다.");
                        }
                    })
                    .catch(err => {
                        console.error("Failed to save:", err);
                        if (window.AamsModal) window.AamsModal.alert("저장 통신 오류가 발생했습니다.");
                        else alert("저장 통신 오류가 발생했습니다.");
                    });
                };

                if (window.AamsModal) {
                    window.AamsModal.confirm("수정된 결산현황 데이터를 저장하시겠습니까?", doSave);
                } else {
                    if (confirm("수정된 결산현황 데이터를 저장하시겠습니까?")) {
                        doSave();
                    }
                }
            }

            // Toolbar Contract Binding (Rule 9)
            if (pane) {
                pane.onSearch = function() {
                    loadGrid();
                };
                pane.onSave = function() {
                    save();
                };
                // 공통버튼 지침: 새로고침은 조회 전 초기화 상태로 되돌린다.
                pane.onRefresh = function() {
                    closeMobileModal();
                    if (grid) grid.clearData();
                    currentSelectedRowData = null;
                    lastLoadedMasterKey = null;
                    currentReportUrl = "";

                    const memoEl = pane ? pane.querySelector("#ja010m3-memo") : document.getElementById("ja010m3-memo");
                    if (memoEl) memoEl.value = "";
                    const nameEl = pane ? pane.querySelector("#memo-fund-name") : document.getElementById("memo-fund-name");
                    if (nameEl) nameEl.textContent = "선택된 펀드 없음";
                    const statusEl = pane ? pane.querySelector("#preview-status") : document.getElementById("preview-status");
                    if (statusEl) statusEl.textContent = "선택된 건 없음";
                    const countEl = pane ? pane.querySelector("#grid-count") : document.getElementById("grid-count");
                    if (countEl) countEl.textContent = "0건";

                    const frame = pane ? pane.querySelector("#report-frame") : document.getElementById("report-frame");
                    if (frame) {
                        frame.src = "about:blank";
                        frame.style.display = "none";
                    }
                    const placeholder = pane ? pane.querySelector("#report-placeholder") : document.getElementById("report-placeholder");
                    if (placeholder) {
                        placeholder.style.display = "flex";
                        placeholder.innerHTML = `<i class="fa-regular fa-file-lines" style="font-size: 36px; margin-bottom: 8px;"></i><span>선택된 결산건의 보고서가 여기에 표출됩니다.</span>`;
                    }

                    if (typeof showToast === "function") showToast("화면이 초기화되었습니다.", "info");
                };
                pane.onCorpGrChange = function() {
                    const corpGr = resolveCorpGr();
                    // 달력 규칙 4: 회사 변경 시 해당 회사의 기준일자를 API로 조회하여 달력 input 갱신
                    fetch(`/api/daily/ja010m3/workdate?corpGr=${encodeURIComponent(corpGr)}`)
                        .then(res => res.json())
                        .then(data => {
                            if (data && data.ymd) {
                                const ymdInput = pane ? pane.querySelector("#filterYmd") : document.getElementById("filterYmd");
                                if (ymdInput) ymdInput.value = data.ymd;
                            }
                            initFilterDddw();
                        })
                        .catch(err => {
                            console.error("Failed to load workdate:", err);
                            initFilterDddw();
                        });
                };
                pane.onExcel = function() {
                    if (grid) {
                        grid.download("xlsx", `결산현황목록_${resolveCorpGr()}.xlsx`);
                    }
                };
            }

            // Rule 11: Single Entry Point (isInitialized guard)
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;
                init();

                // AamsCalendar 초기화 (규칙 16: 순정 단일 날짜 달력)
                if (typeof AamsCalendar !== 'undefined' && typeof AamsCalendar.initSimple === 'function') {
                    AamsCalendar.initSimple('filterYmd', { pane: pane });
                }
            }

            if (document.readyState === "complete" || document.readyState === "interactive") {
                startInit();
            } else {
                document.addEventListener("DOMContentLoaded", startInit);
            }

        })();
    </script>
</div>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-split ja010b-container layout-mobile-stack-container" th:fragment="ja010bView">

    <style>
        /* 모바일 환경: 마지막 그리드(입출금 내역)와 화면 사이 여백 추가 규격 */
        @media (max-width: 876px) {
            .ja010b-container.layout-mobile-stack-container {
                padding-bottom: 24px !important;
            }

            .ja010b-container.layout-mobile-stack-container::after {
                content: "" !important;
                display: block !important;
                height: 24px !important;
                min-height: 24px !important;
                flex-shrink: 0 !important;
                width: 100% !important;
            }

            .ja010b-container .io-grid-box {
                margin-bottom: 8px !important;
            }
        }
    </style>

    <!-- Top Action Control Bar (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <!-- Reusable Common Toolbar Buttons Fragment (닫기 ~ 엑셀) -->
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <!-- Reusable Common Breadcrumb Fragment -->
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- Sub Filter Bar (Row 2: Common 운용사 Select Box + Page-specific Action Button) -->
    <div class="filter-bar">
        <div class="filter-left">
            <div th:replace="~{fragments/filter/corp_filter :: corpFilter(dddwId='CORP_GR', seq=1,label='자산운용(자문)사')}"></div>
            <button type="button" class="t-btn btn-action btn-pyungjan" onclick="onJa010bPyungjanCalc()"><i class="fa-solid fa-calculator"></i> 평잔재계산</button>
        </div>

    </div>

    <!-- Split Master-Detail Layout (Vertical Split: Upper Master, Lower History Detail) -->
    <div class="layout-split-v split-body layout-mobile-stack" data-split-key="W_JA010B" data-default-ratio="50:50">

        <!-- Upper Master Grid Section (dw_list / d_ja010b1.srd) -->
        <div class="pane-top master-section">
            <div class="pane-header">
                <span><i class="fa-solid fa-file-invoice-dollar"></i> 채권단가등록 목록</span>
            </div>
            <div class="pane-body">
                <div id="master-grid" class="tabulator-aams-grid" style="height: 100%;"></div>
            </div>
        </div>

        <!-- Lower Detail Section (Bottom: Left History Detail + Right Notes/IO) -->
        <div class="pane-bottom detail-section split-lr-container">
            <!-- 2차 좌측 패널 (Left: 결산기별 이력 / SZM0GI) -->
            <div class="split-left-section split-panel panel-left">
                <div class="sub-grid-header">
                    <span class="sub-title"><i class="fa-solid fa-list-ol"></i> 결산기별 이력</span>
                    <div class="sub-grid-actions">
                        <button type="button" class="btn-sub-grid btn-add" id="btnDetailAdd" title="신규 행 삽입">
                            <i class="fa-solid fa-plus"></i> 행 삽입
                        </button>
                        <button type="button" class="btn-sub-grid btn-copy" id="btnDetailCopy" title="행 복사">
                            <i class="fa-solid fa-copy"></i> 행 복사
                        </button>
                        <button type="button" class="btn-sub-grid btn-del" id="btnDetailDel" title="행 삭제">
                            <i class="fa-solid fa-trash-can"></i> 행 삭제
                        </button>
                    </div>
                </div>
                <div class="grid-table-wrapper">
                    <div id="grid-ja010b-detail" class="tabulator-aams-grid" style="height: 100%;"></div>
                </div>
            </div>

            <!-- 2차 우측 패널 (Right: 3차 상하 분할 적용) -->
            <div class="split-right-section split-panel panel-right">
                <!-- 3차 상단: 특이사항 메모 패널 (mle_special_note in w_ja010b.srw) -->
                <div class="special-note-box">
                    <div class="sub-grid-header">
                        <span class="sub-title"><i class="fa-solid fa-pen-to-square"></i> 특이사항 메모</span>
                    </div>
                    <textarea id="mleSpecialNote" class="aams-textarea" placeholder="특이사항 메모를 입력하세요..."></textarea>
                </div>

                <!-- 3차 하단: 입출금 내역 서브 그리드 패널 (dw_1 / d_szt0io.srd / SZT0IO) -->
                <div class="io-grid-box">
                    <div class="sub-grid-header">
                        <span class="sub-title"><i class="fa-solid fa-money-bill-transfer"></i> 입출금 내역</span>
                        <div class="sub-grid-actions">
                            <button type="button" class="btn-sub-grid btn-add" id="btnIoAdd" title="신규 행 삽입">
                                <i class="fa-solid fa-plus"></i> 행 삽입
                            </button>
                            <button type="button" class="btn-sub-grid btn-copy" id="btnIoCopy" title="행 복사">
                                <i class="fa-solid fa-copy"></i> 행 복사
                            </button>
                            <button type="button" class="btn-sub-grid btn-del" id="btnIoDel" title="행 삭제">
                                <i class="fa-solid fa-trash-can"></i> 행 삭제
                            </button>
                        </div>
                    </div>
                    <div class="grid-table-wrapper">
                        <div id="grid-ja010b-io" class="tabulator-aams-grid" style="height: 100%;"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Inline Script for Ja010b View with Tabulator Grids -->
    <script th:inline="javascript">
        (function() {
            const currentScript = document.currentScript;
            const pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;

            let gridMaster = null;
            let gridDetail = null;
            let gridIo = null;
            let cudManagerMaster = null;
            let cudManagerDetail = null;
            let cudManagerIo = null;

            const initialMasterData = /*[[${masterList}]]*/ [];

            // DDDW Option Caches (Populated via ue_dddw_retrieve and f_dddwctl)
            let dddwOptionsMap = {
                type_gb: [],
                unyong_sabun: [],
                series_gb: [],
                target_jasan: [],
                mg_cd: []
            };

            /**
             * PowerBuilder dw_list::ue_dddw_retrieve Event Integration
             * Corresponds to dw_list::ue_dddw_retrieve in w_ja010b.srw:
             *   1. f_dddwctl (THIS, 'type_gb', dw_c.object.dddw [1], '', 9, "")
             *   2. f_dddwctl (THIS, 'unyong_sabun', dw_c.object.dddw [1], '', 1, "")
             *   3. f_dddwctl (THIS, 'series_gb', dw_c.object.dddw [1], '', 1, "")
             *   4. f_dddwctl (THIS, 'target_jasan', dw_c.object.dddw [1], '', 1, "")
             *   5. f_dddwctl (THIS, 'mg_cd', dw_c.object.dddw [1], '', 1, "")
             */
            function ue_dddw_retrieve(corpGr) {
                const targetCorpGr = (corpGr != null && String(corpGr).trim() !== "") ? corpGr : (typeof resolveCorpGr === 'function' ? resolveCorpGr(pane) : "");

                f_dddwctl.retrieveMultiple({
                    type_gb:        ['type_gb', targetCorpGr,'', 9,''],
                    unyong_sabun:   ['unyong_sabun', targetCorpGr, '', 1, ''],
                    series_gb:      ['series_gb', targetCorpGr, '', 1, ''],
                    target_jasan:   ['target_jasan', targetCorpGr, '', 1, ''],
                    mg_cd:          ['mg_cd', targetCorpGr, '', 1, '']
                }).then(results => {
                    dddwOptionsMap.type_gb = results.type_gb || [];
                    dddwOptionsMap.unyong_sabun = results.unyong_sabun || [];
                    dddwOptionsMap.series_gb = results.series_gb || [];
                    dddwOptionsMap.target_jasan = results.target_jasan || [];
                    dddwOptionsMap.mg_cd = results.mg_cd || [];

                    if (gridMaster) {
                        gridMaster.redraw(true);
                    }
                });
            }

            function getDddwLabel(dddwKey, codeVal) {
                return f_dddwctl.getLabel(dddwOptionsMap, dddwKey, codeVal);
            }

            function getDddwOptions(dddwKey) {
                return f_dddwctl.getOptions(dddwOptionsMap, dddwKey);
            }

            function numFmt(val) {
                if (val == null || val === "") return "0";
                return Number(val).toLocaleString('ko-KR');
            }

            function formatDateVal(val) {
                if (!val) return "";
                const clean = String(val).replace(/\D/g, "");
                if (clean.length === 8) {
                    return clean.substring(0, 4) + '.' + clean.substring(4, 6) + '.' + clean.substring(6, 8);
                }
                return String(val).replace(/-/g, ".");
            }

            // 1. Initialize Master Tabulator Grid
            function initMasterGrid() {
                const container = pane ? pane.querySelector("#master-grid") : document.getElementById("master-grid");
                if (!container) return;

                gridMaster = new Tabulator(container, {
                    data: initialMasterData || [],
                    layout: "fitDataFill",
                    height: "100%",
                    selectableRows: 1,
                    selectableRowsRollingSelection: true,
                    placeholder: "<span>조회된 계좌 계약정보가 없습니다.</span>",
                    columnDefaults: { vertAlign: "middle", headerSortTristate: true },
                    rowFormatter: function(row) {
                        const data = row.getData();
                        if (data && data.typeGb && String(data.typeGb).trim().toUpperCase() === 'X') {
                            row.getElement().classList.add("row-completed");
                        }
                    },
                    columns: [
                        { title: "No.", formatter: "rownum", hozAlign: "center", width: 45, resizable: false, widthGrow: 0 },
                        { 
                            title: "증권회사", 
                            field: "mgCd", 
                            hozAlign: "center",
                            minWidth: 90, 
                            formatter: cell => getDddwLabel('mg_cd', cell.getValue() || cell.getRow().getData().mgNm),
                            editor: "list",
                            editorParams: {
                                valuesLookup: () => getDddwOptions('mg_cd'),
                                autocomplete: false,
                                clearable: true,
                                itemFormatter: f_dddwctl.get2ColItemFormatter("코드", "증권사명")
                            },
                            cellClick: aamsCellEdit
                        },
                        { title: "고객명", field: "fundNm", hozAlign: "left", minWidth: 120, editor: "input", cellClick: aamsCellEdit },
                        { title: "관리번호", headerCssClass: "col-hdr-green", field: "fundCd", hozAlign: "center", width: 75 },
                        { title: "계좌번호", field: "acctNo", hozAlign: "center", minWidth: 105, formatter: cell => cell.getValue() || '-', editor: "input", cellClick: aamsCellEdit },
                        { 
                            title: "계좌관리그룹", 
                            field: "seriesGb", 
                            hozAlign: "center", 
                            minWidth: 85, 
                            formatter: cell => getDddwLabel('series_gb', cell.getValue()),
                            editor: "list",
                            editorParams: {
                                valuesLookup: () => getDddwOptions('series_gb'),
                                autocomplete: false,
                                clearable: true,
                                itemFormatter: f_dddwctl.get2ColItemFormatter("코드", "그룹명")
                            },
                            cellClick: aamsCellEdit
                        },
                        { 
                            title: "고객<br/>유형", 
                            field: "typeGb", 
                            hozAlign: "center", 
                            minWidth: 75, 
                            formatter: cell => getDddwLabel('type_gb', cell.getValue() || cell.getRow().getData().typeGbNm),
                            editor: "list",
                            editorParams: {
                                valuesLookup: () => getDddwOptions('type_gb'),
                                autocomplete: false,
                                clearable: true,
                                itemFormatter: f_dddwctl.get2ColItemFormatter("코드", "유형명")
                            },
                            cellClick: aamsCellEdit
                        },
                        {
                            title: "수수료(%)",
                            headerHozAlign: "center",
                            columns: [
                                { title: "선취", headerCssClass: "col-hdr-blue", field: "preBasic", hozAlign: "right", minWidth: 55, editor: "number", editorParams: { step: 0.01 }, cellClick: aamsCellEdit },
                                { title: "후취", headerCssClass: "col-hdr-blue", field: "basicPer", hozAlign: "right", minWidth: 55, editor: "number", editorParams: { step: 0.01 }, cellClick: aamsCellEdit }
                            ]
                        },
                        { title: "목표<br/>수익(%)", headerCssClass: "col-hdr-blue", field: "bmPer", hozAlign: "right", minWidth: 75, editor: "number", editorParams: { step: 0.01 }, cellClick: aamsCellEdit },
                        { title: "성과<br/>보수(%)", headerCssClass: "col-hdr-blue", field: "successPer", hozAlign: "right", minWidth: 75, editor: "number", editorParams: { step: 0.01 }, cellClick: aamsCellEdit },
                        { 
                            title: "성과보수<br/>대상자산", 
                            field: "targetJasan", 
                            hozAlign: "center", 
                            minWidth: 95, 
                            formatter: cell => getDddwLabel('target_jasan', cell.getValue()),
                            editor: "list",
                            editorParams: {
                                valuesLookup: () => getDddwOptions('target_jasan'),
                                autocomplete: false,
                                clearable: true,
                                itemFormatter: f_dddwctl.get2ColItemFormatter("코드", "자산구분명")
                            },
                            cellClick: aamsCellEdit
                        },
                        { 
                            title: "최 초<br/>계약일", 
                            field: "fstSeoljYmd", 
                            hozAlign: "center", 
                            minWidth: 85, 
                            formatter: cell => formatDateVal(cell.getValue()),
                            editor: "input",
                            editable: (cell) => !cell.getValue() || cell.getRow().getData().isNew,
                            cellClick: aamsCellEdit
                        },
                        { title: "(재)<br/>계약일", headerCssClass: "col-hdr-blue", field: "reSeoljYmd", hozAlign: "center", minWidth: 85, formatter: cell => `<span class="cell-text-blue">${formatDateVal(cell.getValue())}</span>`, editor: "input", cellClick: aamsCellEdit },
                        // p_dd_re_seolj_ymd (Grid Internal Rule 3, 4: Empty column with calendar popup button)
                        {
                            title: "",
                            field: "_btn_reSeoljYmd",
                            width: 36,
                            minWidth: 36,
                            maxWidth: 36,
                            hozAlign: "center",
                            headerSort: false,
                            resizable: false,
                            formatter: () => `<button type="button" class="btn-grid-addon btn-cal" title="재설정일자 선택"><i class="fa-regular fa-calendar-days"></i></button>`,
                            cellClick: function(e, cell) {
                                e.stopPropagation();
                                const row = cell.getRow();
                                const curVal = row.getData().reSeoljYmd || "";
                                if (window.AamsCalendar && typeof window.AamsCalendar.openDatePicker === 'function') {
                                    window.AamsCalendar.openDatePicker({
                                        anchorEl: cell.getElement(),
                                        initialYmd: curVal,
                                        format: 'raw',
                                        onSelect: function(rawYmd) {
                                            row.update({ reSeoljYmd: rawYmd });
                                        }
                                    });
                                }
                            }
                        },
                        { title: "계약잔액", headerCssClass: "col-hdr-blue", field: "reSeoljAek", hozAlign: "right", minWidth: 100, formatter: cell => `<span class="cell-text-blue">${numFmt(cell.getValue())}</span>` },
                        { 
                            title: "수수료<br/>비용처리", 
                            field: "expenseYn", 
                            hozAlign: "center", 
                            minWidth: 85, 
                            formatter: cell => {
                                const isChecked = (cell.getValue() === 'Y');
                                return `<input type="checkbox" ${isChecked ? 'checked' : ''} style="pointer-events: none;" />`;
                            },
                            cellClick: function(e, cell) {
                                cell.setValue(cell.getValue() === 'Y' ? 'N' : 'Y');
                            }
                        },
                        { title: "계약<br/>횟수", field: "gyulGi", hozAlign: "center", minWidth: 60 },
                        { title: "계약<br/>기간", field: "sintakGigan", hozAlign: "center", minWidth: 60, editor: "number", cellClick: aamsCellEdit },
                        { title: "만기예정일", field: "afGyulYmd", hozAlign: "center", minWidth: 85, formatter: cell => formatDateVal(cell.getValue()) },
                        { title: "계약종료일", headerCssClass: "col-hdr-red", field: "haejiYmd", hozAlign: "center", minWidth: 85, formatter: cell => `<span class="cell-text-red">${formatDateVal(cell.getValue())}</span>`, editor: "input", cellClick: aamsCellEdit },
                        { 
                            title: "운용역", 
                            field: "unyongSabun", 
                            hozAlign: "center", 
                            minWidth: 70, 
                            formatter: cell => getDddwLabel('unyong_sabun', cell.getValue()),
                            editor: "list",
                            editorParams: {
                                valuesLookup: () => getDddwOptions('unyong_sabun'),
                                autocomplete: false,
                                clearable: true,
                                itemFormatter: f_dddwctl.get2ColItemFormatter("사번", "성명")
                            },
                            cellClick: aamsCellEdit
                        },
                        { 
                            title: "계좌별<br/>주식매매수수료율", 
                            field: "susuRt", 
                            hozAlign: "right", 
                            minWidth: 110,
                            editor: "list",
                            editorParams: {
                                values: [
                                    { label: "0.001", value: 0.001 },
                                    { label: "0.0005", value: 0.0005 }
                                ],
                                autocomplete: false
                            },
                            cellClick: aamsCellEdit
                        },
                        { title: "특이사항", field: "noteText", hozAlign: "center", minWidth: 65 },
                        { title: "이메일주소", headerCssClass: "col-hdr-green", field: "email1", hozAlign: "left", minWidth: 120, editor: "input", cellClick: aamsCellEdit }
                    ]
                });

                function syncJa010bDetail(row, data) {
                    if (!row) return;
                    if (!row.isSelected || !row.isSelected()) {
                        row.select();
                    }
                    const d = data || (row.getData ? row.getData() : null);
                    if (!d) return;
                    const specialNote = d.specialNote || "";
                    const mle = pane ? pane.querySelector("#mleSpecialNote") : document.getElementById("mleSpecialNote");
                    if (mle) mle.value = specialNote;
                    fetchJa010bSubGrids(d.fundCd, d);
                }

                // Helper to check if currently in mobile view (width <= 876px)
                function isMobileView() {
                    return window.matchMedia('(max-width: 876px)').matches || window.innerWidth <= 876 || (pane && pane.clientWidth > 0 && pane.clientWidth <= 876);
                }

                // 1. AAMS Standard: Register global row selection callback (모바일 자동 선택 방지)
                setupTabulatorRowSelection(gridMaster, function(row, data) {
                    syncJa010bDetail(row, data);
                }, { autoSelectFirst: false });

                // 2. Tabulator standard rowClick fallback (guarantees visual selection)
                gridMaster.on("rowClick", function(e, row) {
                    if (row && (!row.isSelected || !row.isSelected())) {
                        row.select();
                    }
                    const data = row ? row.getData() : null;
                    syncJa010bDetail(row, data);
                });

                // 3. Tabulator rowSelectionChanged fallback
                gridMaster.on("rowSelectionChanged", function(data, rows) {
                    if (rows && rows.length > 0) {
                        syncJa010bDetail(rows[0], rows[0].getData());
                    }
                });

                // Auto select first row if exists (Rule 15: 데이터 존재 시 첫 행 자동 선택 및 하단 상세 동기화)
                gridMaster.on("tableBuilt", function() {
                    const rows = gridMaster.getRows();
                    if (rows && rows.length > 0) {
                        rows[0].select();
                        syncJa010bDetail(rows[0], rows[0].getData());
                    }
                });

                cudManagerMaster = AamsCudManager.create(gridMaster);
            }

            // 2. Initialize Detail Grid (d_ja010b2.srd)
            function initDetailGrid() {
                const container = pane ? pane.querySelector("#grid-ja010b-detail") : document.getElementById("grid-ja010b-detail");
                if (!container) return;

                gridDetail = new Tabulator(container, {
                    layout: "fitColumns",
                    height: "100%",
                    selectableRows: 1,
                    placeholder: "<span>상단 목록에서 항목을 선택하세요.</span>",
                    columnDefaults: { vertAlign: "middle", headerSortTristate: true },
                    columns: [
                        { title: "No.", formatter: "rownum", hozAlign: "center", width: 45, resizable: false, widthGrow: 0 },
                        { title: "회<br/>기", field: "gyulGi", hozAlign: "center", width: 55, editor: "number" },
                        { title: "(전)<br/>결산일자", field: "bfGyulYmd", hozAlign: "center", width: 95, formatter: cell => formatDateVal(cell.getValue()), editor: "input" },
                        { title: "(당)<br/>결산일자", field: "afGyulYmd", hozAlign: "center", width: 95, formatter: cell => formatDateVal(cell.getValue()), editor: "input" },
                        { title: "구간<br/>일수", field: "ilsu", hozAlign: "center", width: 70, editor: "number" },
                        { title: "결산기<br/>손익액", field: "giSonikAek", hozAlign: "right", minWidth: 100, formatter: cell => numFmt(cell.getValue()), editor: "number" },
                        { title: "워터마크<br/>대상원본", field: "wmSeoljAek", hozAlign: "right", minWidth: 110, formatter: cell => numFmt(cell.getValue()), editor: "number" },
                        { title: "계약<br/>종료일", field: "haejiYmd", hozAlign: "center", width: 95, formatter: cell => formatDateVal(cell.getValue()), editor: "input" }
                    ]
                });

                gridDetail.on("rowClick", function(e, row) {
                    gridDetail.deselectRow();
                    row.select();
                });

                cudManagerDetail = AamsCudManager.create(gridDetail);
            }

            // 3. Initialize IO Grid (d_szt0io.srd)
            function initIoGrid() {
                const container = pane ? pane.querySelector("#grid-ja010b-io") : document.getElementById("grid-ja010b-io");
                if (!container) return;

                gridIo = new Tabulator(container, {
                    layout: "fitColumns",
                    height: "100%",
                    selectableRows: 1,
                    placeholder: "<span>상단 목록에서 항목을 선택하세요.</span>",
                    columnDefaults: { vertAlign: "middle", headerSortTristate: true },
                    columns: [
                        { title: "No.", formatter: "rownum", hozAlign: "center", width: 45, resizable: false, widthGrow: 0 },
                        { title: "입출일자", field: "trYmd", hozAlign: "center", width: 95, formatter: cell => formatDateVal(cell.getValue()), editor: "input" },
                        { title: "입금액", field: "inAek", hozAlign: "right", minWidth: 95, formatter: cell => numFmt(cell.getValue()), editor: "number" },
                        { title: "출금액", field: "outAek", hozAlign: "right", minWidth: 95, formatter: cell => numFmt(cell.getValue()), editor: "number" },
                        { title: "입출금조정액", field: "ioJo", hozAlign: "right", minWidth: 100, formatter: cell => numFmt(cell.getValue()), editor: "number" },
                        { title: "계약잔액", field: "wonbonAek", hozAlign: "right", minWidth: 100, formatter: cell => numFmt(cell.getValue()), editor: "number" },
                        { title: "운용잔여일", field: "giganIlsu", hozAlign: "right", width: 80, formatter: cell => numFmt(cell.getValue()), editor: "number" },
                        { title: "경과일수", field: "passIlsu", hozAlign: "right", width: 70, formatter: cell => numFmt(cell.getValue()), editor: "number" }
                    ]
                });

                gridIo.on("rowClick", function(e, row) {
                    gridIo.deselectRow();
                    row.select();
                });

                cudManagerIo = AamsCudManager.create(gridIo);
            }

            // Sub-grid Action Handlers: 결산기별 이력 (gridDetail)
            function addDetailRow() {
                const selectedMasterRows = gridMaster ? gridMaster.getSelectedRows() : [];
                if (!selectedMasterRows || selectedMasterRows.length === 0) {
                    if (typeof showToast === "function") showToast("상단 목록에서 계좌(마스터)를 먼저 선택하세요.", "warning");
                    else alert("상단 목록에서 계좌(마스터)를 먼저 선택하세요.");
                    return;
                }
                const masterData = selectedMasterRows[0].getData();
                const fundCd = masterData.fundCd || "";
                const filterSelect = pane ? pane.querySelector("#filterCorpGr") : document.getElementById("filterCorpGr");
                const corpGr = filterSelect ? filterSelect.value : (masterData.corpGr || "");

                let maxGyulGi = 0;
                if (gridDetail) {
                    const data = gridDetail.getData();
                    if (Array.isArray(data)) {
                        data.forEach(d => {
                            const g = parseInt(d.gyulGi, 10);
                            if (!isNaN(g) && g > maxGyulGi) maxGyulGi = g;
                        });
                    }
                }
                const nextGyulGi = maxGyulGi + 1;

                const newRow = {
                    isNew: true,
                    _isNew: true,
                    corpGr: corpGr,
                    fundCd: fundCd,
                    gyulGi: nextGyulGi,
                    bfGyulYmd: null,
                    afGyulYmd: null,
                    ilsu: null,
                    giSonikAek: null,
                    wmSeoljAek: null,
                    haejiYmd: null
                };

                const addPromise = cudManagerDetail ? cudManagerDetail.addRow(newRow, true) : (gridDetail ? gridDetail.addRow(newRow, true) : null);
                if (addPromise) {
                    addPromise.then(function(row) {
                        if (row) {
                            gridDetail.deselectRow();
                            row.select();
                            const cell = row.getCell("bfGyulYmd") || row.getCell("gyulGi");
                            if (cell) cell.edit();
                        }
                    });
                }
            }

            function copyDetailRow() {
                if (!gridDetail) return;
                const selectedRows = gridDetail.getSelectedRows();
                if (!selectedRows || selectedRows.length === 0) {
                    if (typeof showToast === "function") showToast("복사할 결산기 이력 행을 선택하세요.", "warning");
                    else alert("복사할 결산기 이력 행을 선택하세요.");
                    return;
                }
                const srcData = selectedRows[0].getData();
                const copiedData = Object.assign({}, srcData, {
                    isNew: true,
                    _isNew: true
                });
                const addPromise = cudManagerDetail ? cudManagerDetail.addRow(copiedData, false) : gridDetail.addRow(copiedData, false, selectedRows[0]);
                if (addPromise) {
                    addPromise.then(function(row) {
                        if (row) {
                            gridDetail.deselectRow();
                            row.select();
                        }
                    });
                }
            }

            function deleteDetailRow() {
                if (!gridDetail) return;
                const selectedRows = gridDetail.getSelectedRows();
                if (!selectedRows || selectedRows.length === 0) {
                    if (typeof showToast === "function") showToast("삭제할 결산기 이력 행을 선택하세요.", "warning");
                    else alert("삭제할 결산기 이력 행을 선택하세요.");
                    return;
                }
                if (cudManagerDetail) {
                    cudManagerDetail.deleteRow(selectedRows[0]).then(function() {
                        if (typeof showToast === "function") showToast("결산기 이력 행이 삭제 대기열에 등록되었습니다.", "info");
                    });
                } else {
                    selectedRows[0].delete();
                }
            }

            // Sub-grid Action Handlers: 입출금 내역 (gridIo)
            function addIoRow() {
                const selectedMasterRows = gridMaster ? gridMaster.getSelectedRows() : [];
                if (!selectedMasterRows || selectedMasterRows.length === 0) {
                    if (typeof showToast === "function") showToast("상단 목록에서 계좌(마스터)를 먼저 선택하세요.", "warning");
                    else alert("상단 목록에서 계좌(마스터)를 먼저 선택하세요.");
                    return;
                }
                const masterData = selectedMasterRows[0].getData();
                const fundCd = masterData.fundCd || "";
                const filterSelect = pane ? pane.querySelector("#filterCorpGr") : document.getElementById("filterCorpGr");
                const corpGr = filterSelect ? filterSelect.value : (masterData.corpGr || "");
                const todayStr = new Date().toISOString().slice(0, 10).replace(/-/g, ".");

                const newRow = {
                    isNew: true,
                    _isNew: true,
                    corpGr: corpGr,
                    fundCd: fundCd,
                    trYmd: todayStr,
                    inAek: null,
                    outAek: null,
                    ioJo: null,
                    wonbonAek: null,
                    giganIlsu: null,
                    passIlsu: null
                };

                const addPromise = cudManagerIo ? cudManagerIo.addRow(newRow, true) : (gridIo ? gridIo.addRow(newRow, true) : null);
                if (addPromise) {
                    addPromise.then(function(row) {
                        if (row) {
                            gridIo.deselectRow();
                            row.select();
                            const cell = row.getCell("trYmd") || row.getCell("inAek");
                            if (cell) cell.edit();
                        }
                    });
                }
            }

            function copyIoRow() {
                if (!gridIo) return;
                const selectedRows = gridIo.getSelectedRows();
                if (!selectedRows || selectedRows.length === 0) {
                    if (typeof showToast === "function") showToast("복사할 입출금 내역 행을 선택하세요.", "warning");
                    else alert("복사할 입출금 내역 행을 선택하세요.");
                    return;
                }
                const srcData = selectedRows[0].getData();
                const copiedData = Object.assign({}, srcData, {
                    isNew: true,
                    _isNew: true
                });
                const addPromise = cudManagerIo ? cudManagerIo.addRow(copiedData, false) : gridIo.addRow(copiedData, false, selectedRows[0]);
                if (addPromise) {
                    addPromise.then(function(row) {
                        if (row) {
                            gridIo.deselectRow();
                            row.select();
                        }
                    });
                }
            }

            function deleteIoRow() {
                if (!gridIo) return;
                const selectedRows = gridIo.getSelectedRows();
                if (!selectedRows || selectedRows.length === 0) {
                    if (typeof showToast === "function") showToast("삭제할 입출금 내역 행을 선택하세요.", "warning");
                    else alert("삭제할 입출금 내역 행을 선택하세요.");
                    return;
                }
                if (cudManagerIo) {
                    cudManagerIo.deleteRow(selectedRows[0]).then(function() {
                        if (typeof showToast === "function") showToast("입출금 내역 행이 삭제 대기열에 등록되었습니다.", "info");
                    });
                } else {
                    selectedRows[0].delete();
                }
            }

            // Global functions for controller integration
            window.loadJa010bMaster = function(corpGr) {
                lastLoadedMasterKey = null;
                const corp = (corpGr != null && String(corpGr).trim() !== "") ? corpGr : (typeof resolveCorpGr === 'function' ? resolveCorpGr(pane) : "");

                // Re-trigger ue_dddw_retrieve when corpGr changes
                ue_dddw_retrieve(corp);

                fetch('/api/account/ja010b/master?corpGr=' + encodeURIComponent(corp))
                    .then(res => res.json())
                    .then(data => {
                        if (gridMaster) {
                            const formatted = cudManagerMaster ? cudManagerMaster.formatData(data) : (Array.isArray(data) ? data : []);
                            gridMaster.setData(formatted);
                            if (Array.isArray(formatted) && formatted.length > 0) {
                                setTimeout(() => {
                                    const rows = gridMaster.getRows();
                                    if (rows && rows.length > 0) {
                                        rows[0].select();
                                        const d = rows[0].getData();
                                        const mle = pane ? pane.querySelector("#mleSpecialNote") : document.getElementById("mleSpecialNote");
                                        if (mle) mle.value = d.specialNote || "";
                                        if (d.fundCd) fetchJa010bSubGrids(d.fundCd, d);
                                    }
                                }, 100);
                            } else {
                                if (gridDetail) gridDetail.setData([]);
                                if (gridIo) gridIo.setData([]);
                                const mle = pane ? pane.querySelector("#mleSpecialNote") : document.getElementById("mleSpecialNote");
                                if (mle) mle.value = "";
                            }
                        }
                    })
                    .catch(err => console.error("Error loading master ja010b:", err));
            };

            // Window resize responsive redraw
            window.addEventListener("resize", function() {
                if (gridMaster) gridMaster.redraw(true);
                if (gridDetail) gridDetail.redraw(true);
                if (gridIo) gridIo.redraw(true);
            });

            let lastLoadedMasterKey = null;
            function fetchJa010bSubGrids(fundCd, masterRowData) {
                const targetFundCd = fundCd || (masterRowData ? masterRowData.fundCd : "");
                if (!targetFundCd) return;

                const filterSelect = pane ? pane.querySelector("#filterCorpGr") : document.getElementById("filterCorpGr");
                let corpGr = (masterRowData && masterRowData.corpGr) ? masterRowData.corpGr : (filterSelect ? filterSelect.value : "");
                if (!corpGr && gridMaster) {
                    const sel = gridMaster.getSelectedData();
                    if (sel && sel.length > 0 && sel[0].corpGr) {
                        corpGr = sel[0].corpGr;
                    }
                }

                const currentKey = (corpGr || '') + '_' + targetFundCd;
                if (lastLoadedMasterKey === currentKey) return;
                lastLoadedMasterKey = currentKey;

                fetch(`/api/account/ja010b/detail?corpGr=${encodeURIComponent(corpGr)}&fundCd=${encodeURIComponent(targetFundCd)}`)
                    .then(res => res.json())
                    .then(data => {
                        if (gridDetail) {
                            const formatted = cudManagerDetail ? cudManagerDetail.formatData(data) : (Array.isArray(data) ? data : []);
                            gridDetail.setData(formatted);
                            setTimeout(() => { gridDetail.redraw(true); }, 50);
                        }
                    })
                    .catch(err => console.error("Error fetching detail:", err));

                fetch(`/api/account/ja010b/io?corpGr=${encodeURIComponent(corpGr)}&fundCd=${encodeURIComponent(targetFundCd)}`)
                    .then(res => res.json())
                    .then(data => {
                        if (gridIo) {
                            const formatted = cudManagerIo ? cudManagerIo.formatData(data) : (Array.isArray(data) ? data : []);
                            gridIo.setData(formatted);
                            setTimeout(() => { gridIo.redraw(true); }, 50);
                        }
                    })
                    .catch(err => console.error("Error fetching IO:", err));
            }

            // Bind Sub-grid Buttons
            const btnDetailAdd = pane ? pane.querySelector("#btnDetailAdd") : document.getElementById("btnDetailAdd");
            if (btnDetailAdd) btnDetailAdd.addEventListener("click", addDetailRow);

            const btnDetailCopy = pane ? pane.querySelector("#btnDetailCopy") : document.getElementById("btnDetailCopy");
            if (btnDetailCopy) btnDetailCopy.addEventListener("click", copyDetailRow);

            const btnDetailDel = pane ? pane.querySelector("#btnDetailDel") : document.getElementById("btnDetailDel");
            if (btnDetailDel) btnDetailDel.addEventListener("click", deleteDetailRow);

            const btnIoAdd = pane ? pane.querySelector("#btnIoAdd") : document.getElementById("btnIoAdd");
            if (btnIoAdd) btnIoAdd.addEventListener("click", addIoRow);

            const btnIoCopy = pane ? pane.querySelector("#btnIoCopy") : document.getElementById("btnIoCopy");
            if (btnIoCopy) btnIoCopy.addEventListener("click", copyIoRow);

            const btnIoDel = pane ? pane.querySelector("#btnIoDel") : document.getElementById("btnIoDel");
            if (btnIoDel) btnIoDel.addEventListener("click", deleteIoRow);

            // Register standard toolbar & CorpGr contract (Guideline 8 & 9)
            if (pane) {
                pane.onSearch = function() { window.loadJa010bMaster(); };
                pane.onRetrieve = function() { window.loadJa010bMaster(); };

                // [입력] 버튼: 신규 계좌(마스터) 행 추가
                pane.onInput = function() {
                    const filterSelect = pane ? pane.querySelector("#filterCorpGr") : document.getElementById("filterCorpGr");
                    const corpGr = filterSelect ? filterSelect.value : "";
                    const todayStr = new Date().toISOString().slice(0, 10).replace(/-/g, ".");

                    fetch('/api/account/ja010b/next-fund-cd?corpGr=' + encodeURIComponent(corpGr))
                        .then(res => res.json())
                        .then(resData => {
                            const nextFundCd = (resData && resData.nextFundCd) ? resData.nextFundCd : "";
                            const selectedRows = gridMaster ? gridMaster.getSelectedRows() : [];
                            const prevRowData = (selectedRows && selectedRows.length > 0) ? selectedRows[0].getData() : null;
                            const newMaster = {
                                isNew: true,
                                isUpdated: false,
                                corpGr: corpGr,
                                fundCd: nextFundCd,
                                fundNm: "",
                                mgCd: prevRowData ? (prevRowData.mgCd || "") : "",
                                unyongSabun: prevRowData ? (prevRowData.unyongSabun || "") : "",
                                typeGb: "1",
                                sintakGigan: 12,
                                fstSeoljYmd: todayStr,
                                bfGyulYmd: null,
                                afGyulYmd: null,
                                reSeoljYear: 1,
                                reSeoljYmd: todayStr,
                                haejiYmd: null,
                                preBasic: null,
                                basicPer: 1,
                                bmPer: 0,
                                successPer: 0,
                                susuRt: 0.0005,
                                orderSend: "N",
                                encAcctNo: "AAAAAAAAAAA=",
                                email1: null,
                                specialNote: null,
                                expenseYn: null,
                                acctNo: null
                            };

                            const addPromise = cudManagerMaster ? cudManagerMaster.addRow(newMaster, true) : gridMaster.addRow(newMaster, true);
                            addPromise.then(function(row) {
                                if (row) {
                                    gridMaster.deselectRow();
                                    row.select();
                                    syncJa010bDetail(row, row.getData());
                                    const cell = row.getCell("fundNm") || row.getCell("fundCd");
                                    if (cell) cell.edit();
                                }
                            });
                        })
                        .catch(err => {
                            console.error("Error fetching next fundCd:", err);
                        });
                };

                // [삭제] 버튼: 선택된 행 큐 반영 삭제
                pane.onDelete = function() {
                    const selIo = gridIo ? gridIo.getSelectedRows() : [];
                    if (selIo.length > 0) {
                        if (confirm("선택한 입출금 내역 행을 삭제하시겠습니까?")) {
                            deleteIoRow();
                        }
                        return;
                    }
                    const selDetail = gridDetail ? gridDetail.getSelectedRows() : [];
                    if (selDetail.length > 0) {
                        if (confirm("선택한 결산기 이력 행을 삭제하시겠습니까?")) {
                            deleteDetailRow();
                        }
                        return;
                    }
                    const selMaster = gridMaster ? gridMaster.getSelectedRows() : [];
                    if (selMaster.length > 0) {
                        if (confirm("선택한 계좌(마스터) 행을 삭제하시겠습니까? (저장 시 최종 삭제)")) {
                            if (cudManagerMaster) {
                                cudManagerMaster.deleteRow(selMaster[0]).then(function() {
                                    if (typeof showToast === "function") showToast("계좌 행이 삭제 대기열에 등록되었습니다.", "info");
                                });
                            } else {
                                selMaster[0].delete();
                            }
                        }
                        return;
                    }
                    if (typeof showToast === "function") showToast("삭제할 행을 선택하세요.", "warning");
                };

                // [저장] 버튼: 신규행은 INSERT, 기존 수정행은 UPDATE, 삭제행은 DELETE (4대 원칙 큐 연동)
                pane.onSave = function() {
                    const masterChanges = cudManagerMaster ? cudManagerMaster.getChanges() : { itemList: [], deletedList: [] };
                    const detailChanges = cudManagerDetail ? cudManagerDetail.getChanges() : { itemList: [], deletedList: [] };
                    const ioChanges = cudManagerIo ? cudManagerIo.getChanges() : { itemList: [], deletedList: [] };

                    if (!masterChanges.hasChanges && !detailChanges.hasChanges && !ioChanges.hasChanges) {
                        if (typeof showToast === "function") showToast("저장할 변경사항이 없습니다.", "info");
                        return;
                    }

                    const filterSelect = pane ? pane.querySelector("#filterCorpGr") : document.getElementById("filterCorpGr");
                    const corpGr = filterSelect ? filterSelect.value : "";

                    const payload = {
                        corpGr: corpGr,
                        masterList: masterChanges.itemList,
                        detailList: detailChanges.itemList,
                        ioList: ioChanges.itemList,
                        deletedMasterList: masterChanges.deletedList,
                        deletedDetailList: detailChanges.deletedList,
                        deletedIoList: ioChanges.deletedList
                    };

                    fetch('/api/account/ja010b/save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    })
                    .then(res => res.json())
                    .then(resData => {
                        if (resData && resData.success) {
                            if (cudManagerMaster) cudManagerMaster.reset();
                            if (cudManagerDetail) cudManagerDetail.reset();
                            if (cudManagerIo) cudManagerIo.reset();
                            if (typeof showToast === "function") showToast(resData.message || "정상적으로 저장되었습니다.", "success");
                            const selectedRows = gridMaster ? gridMaster.getSelectedRows() : [];
                            const curFundCd = (selectedRows.length > 0) ? selectedRows[0].getData().fundCd : "";
                            window.loadJa010bMaster(corpGr);
                        } else {
                            const msg = (resData && resData.message) ? resData.message : "저장에 실패했습니다.";
                            if (typeof showToast === "function") showToast(msg, "error");
                        }
                    })
                    .catch(err => {
                        console.error("저장 오류:", err);
                        if (typeof showToast === "function") showToast("저장 중 통신 오류가 발생했습니다.", "error");
                    });
                };

                // 공통버튼 지침: 새로고침은 조회 전 초기화 상태로 되돌린다.
                pane.onRefresh = function() {
                    if (cudManagerMaster) cudManagerMaster.reset();
                    if (cudManagerDetail) cudManagerDetail.reset();
                    if (cudManagerIo) cudManagerIo.reset();
                    if (gridMaster) gridMaster.clearData();
                    if (gridDetail) gridDetail.clearData();
                    if (gridIo) gridIo.clearData();
                    lastLoadedMasterKey = null;
                    const mle = pane ? pane.querySelector("#mleSpecialNote") : document.getElementById("mleSpecialNote");
                    if (mle) mle.value = "";
                    if (typeof showToast === "function") showToast("화면이 초기화되었습니다.", "info");
                };
                pane.onCorpGrChange = function(val) {
                    lastLoadedMasterKey = null;
                    window.loadJa010bMaster(val);
                };
                pane.addEventListener("corpGrChanged", function(e) {
                    lastLoadedMasterKey = null;
                    if (e.detail && e.detail.corpGr) {
                        window.loadJa010bMaster(e.detail.corpGr);
                    }
                });
            }

            // Guideline 10: Single initialization entry point with isInitialized guard
            let isInitialized = false;
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;
                initMasterGrid();
                initDetailGrid();
                initIoGrid();
                const initCorp = typeof resolveCorpGr === 'function' ? resolveCorpGr(pane) : "";
                ue_dddw_retrieve(initCorp);

                // 셀 편집 감지 (기존행 update 플래그 설정)
                if (gridMaster) {
                    gridMaster.on("cellEdited", function(cell) {
                        const rowData = cell.getRow().getData();
                        if (!rowData.isNew) rowData.isUpdated = true;
                    });
                }
                if (gridDetail) {
                    gridDetail.on("cellEdited", function(cell) {
                        const rowData = cell.getRow().getData();
                        if (!rowData.isNew) rowData.isUpdated = true;
                    });
                }
                if (gridIo) {
                    gridIo.on("cellEdited", function(cell) {
                        const rowData = cell.getRow().getData();
                        if (!rowData.isNew) rowData.isUpdated = true;
                    });
                }

                // 특이사항 텍스트에어리어 변경 감지
                const mle = pane ? pane.querySelector("#mleSpecialNote") : document.getElementById("mleSpecialNote");
                if (mle) {
                    mle.addEventListener("input", function() {
                        const selected = gridMaster ? gridMaster.getSelectedRows() : [];
                        if (selected && selected.length > 0) {
                            const d = selected[0].getData();
                            d.specialNote = mle.value;
                            if (!d.isNew) d.isUpdated = true;
                        }
                    });
                }

                // eb_direct_retrieve = true 명세 반영 자동 조회
                setTimeout(() => {
                    window.loadJa010bMaster();
                }, 100);
            }

            document.addEventListener("DOMContentLoaded", startInit);
            if (document.readyState === "complete" || document.readyState === "interactive") {
                setTimeout(startInit, 50);
            }
        })();

        function onJa010bPyungjanCalc() {
            const mle = document.getElementById("mleSpecialNote");
            if (confirm("선택한 계좌의 평잔 재계산 작업을 진행하시겠습니까?")) {
                alert("평잔 재계산 작업이 완료되었습니다.");
            }
        }

        function onJa010bInput() {
            const pane = document.querySelector('.ja010b-container') || document;
            if (pane && typeof pane.onInput === 'function') pane.onInput();
        }
        function onJa010bSave() {
            const pane = document.querySelector('.ja010b-container') || document;
            if (pane && typeof pane.onSave === 'function') pane.onSave();
        }
        function onJa010bExcel() { alert("엑셀 다운로드를 진행합니다."); }
    </script>
</div>

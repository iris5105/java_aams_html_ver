<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container szx0se-container" th:fragment="szx0seView">

    <!-- Top Action Control Bar (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <!-- Reusable Common Toolbar Buttons Fragment (닫기 ~ 엑셀) -->
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <!-- Reusable Common Breadcrumb Fragment -->
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- Sub Filter Bar (Row 2: Common 운용사 Select Box: dw_c in w_szx0se.srw) -->
    <div class="filter-bar">
        <div class="filter-left">
            <div th:replace="~{fragments/filter/corp_filter :: corpFilter(dddwId='CORP_GR', seq=1,label ='자산운용(자문)사' )}"></div>
        </div>
    </div>

    <!-- Main Grid Section (d_szx0se.srd / SZX0SE) -->
    <div class="grid-section">
        <div class="grid-table-wrapper">
            <div id="master-grid" class="tabulator-aams-grid"></div>
        </div>
    </div>

    <!-- Page Specific Script with PowerBuilder f_dddwctl / ue_dddw_retrieve Integration -->
    <script th:inline="javascript">
        (function() {
            const currentScript = document.currentScript;
            const pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;

            const initialData = /*[[${dataList}]]*/ [];
            let gridSzx0se = null;
            let cudManager = null;
            let deletedList = [];
            let isInitialized = false;

            // DDDW Option Caches (Populated via ue_dddw_retrieve and f_dddwctl)
            let dddwOptionsMap = {
                series_g1: [],
                series_g2: [],
                bm_gr: [],
                gugan: [],
                ga: []
            };

            function ue_dddw_retrieve(corpGr) {
                const targetCorpGr = corpGr != null ? corpGr : resolveCorpGr(pane);

                f_dddwctl.retrieveMultiple({
                    series_g1: ['series_g1', targetCorpGr, '', 1, `corp_gr='${targetCorpGr}'`],
                    series_g2: ['series_g2', targetCorpGr, '', 1, `corp_gr='${targetCorpGr}'`],
                    bm_gr: ['bm_gr', targetCorpGr, '', 1, ''],
                    gugan: ['gugan', '', ',,', 1, ''],
                    ga: ['ga', '', ',,', 1, '']
                }).then(results => {
                    dddwOptionsMap.series_g1 = results.series_g1 || [];
                    dddwOptionsMap.series_g2 = results.series_g2 || [];
                    dddwOptionsMap.bm_gr = results.bm_gr || [];
                    dddwOptionsMap.gugan = results.gugan || [];
                    dddwOptionsMap.ga = results.ga || [];

                    if (gridSzx0se) {
                        gridSzx0se.redraw(true);
                    }
                });
            }

            function getDddwLabel(dddwKey, codeVal) {
                return f_dddwctl.getLabel(dddwOptionsMap, dddwKey, codeVal);
            }

            function getDddwOptions(dddwKey) {
                return f_dddwctl.getOptions(dddwOptionsMap, dddwKey);
            }

            function markRowUpdated(cell) {
                const row = cell.getRow();
                const data = row.getData();
                if (!data.isNew && data.rowStatus !== 'C') {
                    row.update({ rowStatus: 'U', isUpdated: true });
                }
            }

            function initSzx0seGrid() {
                const container = pane ? pane.querySelector("#master-grid") : document.getElementById("master-grid");
                if (!container) return;

                gridSzx0se = new Tabulator(container, {
                    data: initialData || [],
                    layout: "fitColumns",
                    height: "100%",
                    selectableRows: 1,
                    placeholder: "<span>조회된 계좌관리그룹/상품그룹 데이터가 없습니다.</span>",
                    columnDefaults: { vertAlign: "middle", headerSortTristate: true },
                    columns: [
                        { title: "No.", formatter: "rownum", hozAlign: "center", width: 45, resizable: false, widthGrow: 0 },
                        
                        // Requirement 1: Checkbox for '미사용' (used == '0' -> checked, tabsequence=10)
                        { 
                            title: "미사용", 
                            field: "used", 
                            hozAlign: "center", 
                            width: 65, 
                            headerCssClass: "col-hdr-red",
                            formatter: cell => {
                                const val = String(cell.getValue() != null ? cell.getValue() : '').trim();
                                const isChecked = (val === '0');
                                return `<input type="checkbox" ${isChecked ? 'checked' : ''} style="pointer-events: none;" />`;
                            },
                            cellClick: function(e, cell) {
                                const curVal = String(cell.getValue() != null ? cell.getValue() : '').trim();
                                const nextVal = (curVal === '0' ? '1' : '0');
                                cell.setValue(nextVal);
                                markRowUpdated(cell);
                            }
                        },
                        
                        // Requirement 2: Dynamic DDDW Formatters & Editors (tabsequence=20, 30, 40...)
                        { 
                            title: "대분류", 
                            field: "seriesG1", 
                            hozAlign: "center", 
                            width: 85, 
                            formatter: cell => getDddwLabel('series_g1', cell.getValue()),
                            editor: "list",
                            editorParams: {
                                valuesLookup: () => getDddwOptions('series_g1'),
                                autocomplete: false,
                                listOnEmpty: true,
                                clearable: true,
                                itemFormatter: f_dddwctl.get2ColItemFormatter("코드", "대분류명")
                            },
                            cellClick: aamsCellEdit,
                            cellEdited: function(cell) {
                                const row = cell.getRow();
                                const data = row.getData();
                                const g1 = cell.getValue() || "";
                                const g2 = data.seriesG2 || "";
                                row.update({
                                    seriesGb: g1 + g2,
                                    rowStatus: data.isNew ? 'C' : 'U'
                                });
                            }
                        },
                        { 
                            title: "시리즈(상품분류)", 
                            field: "seriesG2", 
                            hozAlign: "center", 
                            width: 110, 
                            formatter: cell => getDddwLabel('series_g2', cell.getValue()),
                            editor: "input",
                            cellClick: aamsCellEdit,
                            cellEdited: function(cell) {
                                const row = cell.getRow();
                                const data = row.getData();
                                const g1 = data.seriesG1 || "";
                                const g2 = cell.getValue() || "";
                                row.update({
                                    seriesGb: g1 + g2,
                                    rowStatus: data.isNew ? 'C' : 'U'
                                });
                            }
                        },
                        { 
                            title: "시리즈(상품분류)명", 
                            field: "seriesNm", 
                            hozAlign: "left", 
                            width: 160, 
                            editor: "input", 
                            cellClick: aamsCellEdit,
                            cellEdited: markRowUpdated
                        },
                        { 
                            title: "평잔구간", 
                            field: "gugan", 
                            hozAlign: "center", 
                            width: 160, 
                            formatter: cell => getDddwLabel('gugan', cell.getValue()),
                            editor: "list",
                            editorParams: {
                                valuesLookup: () => getDddwOptions('gugan'),
                                autocomplete: false,
                                listOnEmpty: true,
                                clearable: true,
                                itemFormatter: f_dddwctl.get2ColItemFormatter("코드", "평잔구간명")
                            },
                            cellClick: aamsCellEdit,
                            cellEdited: markRowUpdated
                        },
                        { 
                            title: "금감원<br/>보고분류", 
                            field: "ga", 
                            hozAlign: "center", 
                            width: 60, 
                            formatter: cell => getDddwLabel('ga', cell.getValue()),
                            editor: "list",
                            editorParams: {
                                valuesLookup: () => getDddwOptions('ga'),
                                autocomplete: false,
                                listOnEmpty: true,
                                clearable: true,
                                itemFormatter: f_dddwctl.get2ColItemFormatter("코드", "보고분류명")
                            },
                            cellClick: aamsCellEdit,
                            cellEdited: markRowUpdated
                        },
                        { title: "재설정기한<br/>(년)", field: "reSeoljYear", hozAlign: "center", width: 105, editor: "number", cellClick: aamsCellEdit, cellEdited: markRowUpdated },
                        { title: "신탁기간<br/>(월)", field: "sintakGigan", hozAlign: "center", width: 85, editor: "number", cellClick: aamsCellEdit, cellEdited: markRowUpdated },
                        { title: "보수기간<br/>(월)", field: "bosuGigan", hozAlign: "center", width: 85, editor: "number", cellClick: aamsCellEdit, cellEdited: markRowUpdated },
                        { title: "목표수익률<br/>(%)", field: "mokpyoSuikPer", hozAlign: "right", minWidth: 110, editor: "number", editorParams: { step: 0.01 }, cellClick: aamsCellEdit, cellEdited: markRowUpdated },
                        { title: "선취수수료<br/>(%)", field: "preBasic", hozAlign: "right", minWidth: 100, editor: "number", editorParams: { step: 0.01 }, cellClick: aamsCellEdit, cellEdited: markRowUpdated },
                        { title: "운용보수율<br/>(%)", field: "basicPer", hozAlign: "right", minWidth: 100, editor: "number", editorParams: { step: 0.01 }, cellClick: aamsCellEdit, cellEdited: markRowUpdated },
                        { title: "성과보수<br/>(%)", field: "successPer", hozAlign: "right", minWidth: 100, editor: "number", editorParams: { step: 0.01 }, cellClick: aamsCellEdit, cellEdited: markRowUpdated },
                        { 
                            title: "마감일자<br/>사용여부", 
                            field: "magamUsed", 
                            hozAlign: "center", 
                            width: 65, 
                            formatter: cell => {
                                const val = String(cell.getValue() != null ? cell.getValue() : '').trim();
                                const isChecked = (val === '1');
                                return `<input type="checkbox" ${isChecked ? 'checked' : ''} style="pointer-events: none;" />`;
                            },
                            cellClick: function(e, cell) {
                                const curVal = String(cell.getValue() != null ? cell.getValue() : '').trim();
                                cell.setValue(curVal === '1' ? '0' : '1');
                                markRowUpdated(cell);
                            }
                        },
                        { 
                            title: "수요예측<br/>생성여부", 
                            field: "dpUsed", 
                            hozAlign: "center", 
                            width: 65, 
                            formatter: cell => {
                                const val = String(cell.getValue() != null ? cell.getValue() : '').trim();
                                const isChecked = (val === '1');
                                return `<input type="checkbox" ${isChecked ? 'checked' : ''} style="pointer-events: none;" />`;
                            },
                            cellClick: function(e, cell) {
                                const curVal = String(cell.getValue() != null ? cell.getValue() : '').trim();
                                cell.setValue(curVal === '1' ? '0' : '1');
                                markRowUpdated(cell);
                            }
                        },
                        { 
                            title: "BM그룹<br/>(9420)", 
                            field: "bmGr", 
                            hozAlign: "center", 
                            width: 90, 
                            formatter: cell => getDddwLabel('bm_gr', cell.getValue()),
                            editor: "list",
                            editorParams: {
                                valuesLookup: () => getDddwOptions('bm_gr'),
                                autocomplete: false,
                                listOnEmpty: true,
                                clearable: true,
                                itemFormatter: f_dddwctl.get2ColItemFormatter("코드", "BM그룹명")
                            },
                            cellClick: aamsCellEdit,
                            cellEdited: markRowUpdated
                        },
                        { title: "비고", field: "bigo", minWidth: 150, hozAlign: "left", editor: "input", cellClick: aamsCellEdit, cellEdited: markRowUpdated }
                    ]
                });

                cudManager = AamsCudManager.create(gridSzx0se);

                // 개발지침 규칙 8번 & 15번: setupTabulatorRowSelection 연결 (reportViewer가 없으므로 첫 행 자동 rowfocus)
                if (typeof setupTabulatorRowSelection === 'function') {
                    setupTabulatorRowSelection(gridSzx0se);
                }
            }

            // Data retrieval function (Mapper / REST API)
            function loadSzx0seData() {
                const corpGr = resolveCorpGr(pane);
                if (!corpGr) {
                    if (typeof showToast === 'function') showToast("운용사를 선택해주세요.", "warning");
                    return;
                }

                if (cudManager) cudManager.reset();
                deletedList = [];
                ue_dddw_retrieve(corpGr);

                fetch('/api/account/szx0se/list?corpGr=' + encodeURIComponent(corpGr))
                    .then(res => res.json())
                    .then(data => {
                        if (gridSzx0se) {
                            const formatted = cudManager ? cudManager.formatData(Array.isArray(data) ? data : []) : (Array.isArray(data) ? data : []);
                            gridSzx0se.setData(formatted);
                        }
                    })
                    .catch(err => {
                        console.error("Error loading szx0se list:", err);
                        if (typeof showToast === 'function') showToast("조회 중 오류가 발생했습니다.", "error");
                    });
            }

            function addRow() {
                if (!gridSzx0se) return;
                const corpGr = resolveCorpGr(pane);

                const selectedRows = gridSzx0se.getSelectedRows();
                const prevSeriesG1 = (selectedRows && selectedRows.length > 0) ? (selectedRows[0].getData().seriesG1 || "") : "";

                const newRowData = {
                    corpGr: corpGr,
                    seriesG1: prevSeriesG1,
                    seriesG2: "",
                    seriesGb: "",
                    seriesNm: "",
                    used: '1',
                    magamUsed: '0',
                    dpUsed: null,
                    reSeoljYear: null,
                    sintakGigan: null,
                    bosuGigan: null,
                    mokpyoSuikPer: null,
                    preBasic: null,
                    basicPer: null,
                    successPer: null,
                    isNew: true,
                    rowStatus: "C"
                };

                const addPromise = cudManager ? cudManager.addRow(newRowData, true) : gridSzx0se.addRow(newRowData, true);
                addPromise.then(row => {
                    gridSzx0se.deselectRow();
                    row.select();
                    row.scrollIntoView();
                });
            }

            function deleteRow() {
                if (!gridSzx0se) return;
                const selectedRows = gridSzx0se.getSelectedRows();
                if (selectedRows.length === 0) {
                    if (typeof showToast === 'function') showToast("삭제할 행을 선택해주세요.", "warning");
                    else alert("삭제할 행을 선택해주세요.");
                    return;
                }

                if (!confirm("선택한 행을 삭제하시겠습니까? (저장 시 최종 반영됩니다)")) {
                    return;
                }

                selectedRows.forEach(row => {
                    if (cudManager) {
                        cudManager.deleteRow(row);
                    } else {
                        row.delete();
                    }
                });
            }

            function saveData() {
                if (!gridSzx0se) return;
                const corpGr = resolveCorpGr(pane);

                if (!corpGr) {
                    if (typeof showToast === 'function') showToast("운용사를 확인해주세요.", "warning");
                    return;
                }

                const changes = cudManager ? cudManager.getChanges() : { inserts: [], updates: [], deletes: [], hasChanges: false };
                const insertList = changes.inserts || [];
                const updateList = changes.updates || [];
                const deleteList = changes.deletes || [];

                for (const data of insertList) {
                    if (!data.seriesG1 || !data.seriesG2) {
                        if (typeof showToast === 'function') showToast("신규 행의 대분류와 시리즈코드를 입력해주세요.", "warning");
                        else alert("신규 행의 대분류와 시리즈코드를 입력해주세요.");
                        return;
                    }
                }

                if (insertList.length === 0 && updateList.length === 0 && deleteList.length === 0) {
                    if (typeof showToast === 'function') showToast("저장할 변경 내역이 없습니다.", "info");
                    else alert("저장할 변경 내역이 없습니다.");
                    return;
                }

                if (!confirm(`저장하시겠습니까?\n(신규: ${insertList.length}건, 수정: ${updateList.length}건, 삭제: ${deleteList.length}건)`)) {
                    return;
                }

                const payload = {
                    corpGr: corpGr,
                    insertList: insertList,
                    updateList: updateList,
                    deleteList: deleteList
                };

                fetch("/api/account/szx0se/save", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                })
                .then(res => res.json())
                .then(res => {
                    if (res.success) {
                        if (cudManager) cudManager.reset();
                        if (typeof showToast === 'function') showToast(res.message || "저장이 완료되었습니다.", "success");
                        else alert(res.message || "저장이 완료되었습니다.");
                        loadSzx0seData();
                    } else {
                        if (typeof showToast === 'function') showToast("저장 실패: " + (res.message || "알 수 없는 오류"), "error");
                        else alert("저장 실패: " + (res.message || "알 수 없는 오류"));
                    }
                })
                .catch(err => {
                    console.error("saveData error:", err);
                    if (typeof showToast === 'function') showToast("저장 중 오류가 발생했습니다: " + err.message, "error");
                    else alert("저장 중 오류가 발생했습니다: " + err.message);
                });
            }

            // Register standard contracts on pane
            if (pane) {
                pane.onSearch = loadSzx0seData;
                pane.onInput = addRow;
                pane.onDelete = deleteRow;
                pane.onSave = saveData;
                pane.onExcel = function() {
                    if (gridSzx0se) gridSzx0se.download("xlsx", `상품분류_설정_${resolveCorpGr(pane)}.xlsx`);
                };
                pane.onRefresh = function() {
                    if (gridSzx0se) gridSzx0se.clearData();
                    if (cudManager) cudManager.reset();
                    if (typeof showToast === "function") showToast("화면이 초기화되었습니다.", "info");
                };
                pane.onCorpGrChange = function(val) {
                    loadSzx0seData();
                };
                pane.addEventListener("corpGrChanged", function(e) {
                    loadSzx0seData();
                });
            }

            // Guideline 11: Single initialization entry point with isInitialized guard
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;
                initSzx0seGrid();
                ue_dddw_retrieve();

                // eb_direct_retrieve = true 명세 반영 자동 조회
                setTimeout(() => {
                    loadSzx0seData();
                }, 100);
            }

            document.addEventListener("DOMContentLoaded", startInit);
            if (document.readyState === "complete" || document.readyState === "interactive") {
                setTimeout(startInit, 50);
            }
        })();
    </script>
</div>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-single ja010o-container" th:fragment="ja010oView">

    <!-- Top Action Control Bar (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <!-- Reusable Common Toolbar Buttons Fragment (닫기, 새로고침, 조회, 저장, 엑셀) -->
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <!-- Reusable Common Breadcrumb Fragment -->
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- Filter Bar (Row 2): Rule 14 & Rule 17 - dc_xx_ymd fragment matching dw_c in w_ja010o.srw -->
    <div class="filter-bar">
        <div class="filter-left">
            <div th:replace="~{fragments/filter/dc_xx_ymd :: filter(labelYmd='기준일자', labelXx='관리번호')}"></div>
            <input type="file" id="ja010oExcelFileInput" accept=".xls,.xlsx,.csv" style="display: none;" />
            <button type="button" id="btnLoadExcel" class="t-btn btn-action" style="background: #2563eb; color: #ffffff; border-color: #1d4ed8;" title="엑셀 파일로부터 입/출잔고를 로드합니다.">
                <i class="fa-solid fa-file-excel"></i> 신용/대출잔고LOAD
            </button>
        </div>
    </div>

    <!-- Styles for Placeholder, Summary Band & Header Colors (PowerBuilder Matching) -->
    <style>
        /* 1. Placeholder가 그리드 영역 전체(100%)를 차지하여 정중앙에 단일 표출 (화면 분할 및 가로선 방지) */
        .ja010o-container .tabulator .tabulator-tableholder .tabulator-placeholder {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            width: 100% !important;
            height: 100% !important;
            min-height: 100% !important;
            background-color: transparent !important;
            box-sizing: border-box !important;
        }
        .ja010o-container .tabulator .tabulator-placeholder span {
            color: #64748b !important;
            font-size: 13px !important;
            font-weight: 500 !important;
        }

        /* 2. Summary(합계) 행 스타일 (PowerBuilder d_ja010o1.srd: 연노랑 #fbf2c4 배경 + 흰색 숫자 박스) */
        .ja010o-container .tabulator-row.aams-summary-row {
            background-color: #fbf2c4 !important;
            border-top: 1px solid #cbd5e1 !important;
            border-bottom: 1px solid #cbd5e1 !important;
            font-weight: 600;
            cursor: default !important;
        }
        .ja010o-container .tabulator-row.aams-summary-row:hover {
            background-color: #fbf2c4 !important;
        }
        .ja010o-container .tabulator-row.aams-summary-row.tabulator-selected {
            background-color: #fbf2c4 !important;
        }
        .ja010o-container .tabulator-row.aams-summary-row .tabulator-cell {
            background-color: transparent !important;
            padding: 2px 4px !important;
        }
        .ja010o-container .tabulator-row.aams-summary-row .summary-box {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 2px;
            padding: 0 6px;
            width: 100%;
            height: 20px;
            line-height: 18px;
            text-align: right;
            font-size: 11px;
            font-weight: 500;
            color: #1e293b;
            box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        /* 3. 헤더 고유 색상 매핑 (PowerBuilder 원본 규격) */
        .ja010o-container .tabulator-header .tabulator-col.col-hdr-collateral {
            background-color: #fef9c3 !important; /* 신용/대출 잔액 헤더 크림/연노랑 (PB 15793151) */
        }
        .ja010o-container .tabulator-header .tabulator-col.col-hdr-collateral .tabulator-col-content {
            background-color: #fef9c3 !important;
        }

        .ja010o-container .tabulator-header .tabulator-col.col-hdr-jango {
            background-color: #dcfce7 !important; /* 당일잔고 주수 헤더 연녹색 (PB 12639424) */
        }
        .ja010o-container .tabulator-header .tabulator-col.col-hdr-jango .tabulator-col-content {
            background-color: #dcfce7 !important;
        }
    </style>

    <!-- Main Grid Section (d_ja010o1.srd / SJM0JM + SJM0JM_COLL + SJM0JJ) -->
    <div class="grid-section" style="flex: 1 1 auto; height: calc(100% - 90px); padding: 8px 12px; overflow: hidden; display: flex; flex-direction: column;">
        <div class="grid-table-wrapper" style="flex: 1 1 auto; height: 100%; width: 100%; border: 1px solid #cbd5e1; border-radius: 4px; overflow: hidden; background-color: #fff;">
            <div id="ja010o-grid" class="tabulator-aams-grid" style="height: 100%;"></div>
        </div>
    </div>

    <!-- SheetJS for Excel Reading (cb_1 client parsing) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>


    <!-- Page Specific Script for w_ja010o -->
    <script th:inline="javascript">
        (function() {
            const currentScript = document.currentScript;
            const pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;

            let gridJa010o = null;
            let isInitialized = false;
            let lastFundCd = null;
            let lastYmd = null;
            let lastCorpGr = null;

            // Numeric Formatter (값이 없거나 0이 아니면 공백 반환, summaryRow면 공백)
            function numberFormatter(cell) {
                const row = cell.getRow().getData();
                if (row && row.isSummaryRow) return "";
                const val = cell.getValue();
                if (val == null || val === "" || isNaN(val)) return "";
                return Number(val).toLocaleString();
            }
            // formatDateVal 및 addMonthsToYmd는 common.js의 전역 공통 함수 사용


            // Exception Rule 1 & Rule 5: Tabsequence-based in-line edit check
            function isCellEditable(cell) {
                if (!cell) return false;
                const row = typeof cell.getRow === "function" ? cell.getRow() : null;
                if (!row) return false;

                // Summary row is not editable
                const rowData = row.getData();
                if (rowData && rowData.isSummaryRow) return false;

                // Tabsequence: coll_start(10), coll_end(20), coll_jusu(30), collateral(40) are editable
                const colField = cell.getColumn().getField();
                const editableFields = ["collStart", "collEnd", "collJusu", "collateral"];

                if (editableFields.includes(colField)) {
                    return true;
                } else {
                    // Non-editable cell selection guarantee (Rule 8)
                    if (gridJa010o && (!row.isSelected || !row.isSelected())) {
                        gridJa010o.deselectRow();
                        row.select();
                    }
                    return false;
                }
            }

            // Summary Row 합계 실시간 재계산 함수
            function recalcSummaryRow() {
                if (!gridJa010o) return;
                const rows = gridJa010o.getRows();
                let summaryRow = null;
                let totalCollateral = 0;
                let dataCount = 0;

                rows.forEach(r => {
                    const d = r.getData();
                    if (d.isSummaryRow) {
                        summaryRow = r;
                    } else {
                        dataCount++;
                        totalCollateral += (Number(d.collateral) || 0);
                    }
                });

                if (dataCount > 0) {
                    if (summaryRow) {
                        summaryRow.update({ collateral: totalCollateral });
                    } else {
                        gridJa010o.addRow({ isSummaryRow: true, collateral: totalCollateral }, false);
                    }
                } else if (summaryRow) {
                    summaryRow.delete();
                }
            }

            let codeSearchInstance = null;

            // 1. Initialize Dynamic Code Search (u_dynamiccodesearch: rcd seq 2)
            function initCodeSearch(retryCount) {
                retryCount = retryCount || 0;
                if (window.DynamicCodeSearch && typeof window.DynamicCodeSearch.bind === "function") {
                    codeSearchInstance = window.DynamicCodeSearch.bind({
                        inputEl: "#filterXx",
                        btnEl: "#btnCodeSearchXx",
                        textEl: "#textXxName",
                        columnNm: "rcd",
                        seq: 2,
                        pane: pane,
                        getCorpGr: resolveCorpGr,
                        onSelect: function(code, name, rowData) {
                            lastFundCd = null;
                        }
                    });
                } else if (retryCount < 20) {
                    setTimeout(function() {
                        initCodeSearch(retryCount + 1);
                    }, 50);
                }
            }

            // 2. Initialize Main Grid (d_ja010o1.srd / SJM0JM_COLL)
            function initGrid() {
                const gridElement = pane ? pane.querySelector("#ja010o-grid") : document.getElementById("ja010o-grid");
                if (!gridElement) return;

                gridJa010o = new Tabulator(gridElement, {
                    layout: "fitColumns",
                    height: "100%",
                    placeholder: "<span>조회된 데이터가 없습니다.</span>",
                    selectableRows: 1,
                    editTriggerEvent: "click",
                    keybindings: {
                        navNext: "tab",
                        navPrev: "shift + tab"
                    },
                    tabEndNewRow: false,
                    rowFormatter: function(row) {
                        const data = row.getData();
                        if (data && data.isSummaryRow) {
                            row.getElement().classList.add("aams-summary-row");
                        }
                    },
                    columns: [
                        {
                            title: "No.",
                            field: "fseq",
                            width: 55,
                            hozAlign: "center",
                            headerHozAlign: "center",
                            headerSort: false,
                            formatter: function(cell) {
                                const row = cell.getRow().getData();
                                if (row && row.isSummaryRow) return "";
                                return cell.getRow().getPosition(true);
                            }
                        },
                        {
                            title: "종목코드",
                            field: "jmJmCd",
                            width: 100,
                            hozAlign: "center",
                            headerHozAlign: "center",
                            headerSort: false,
                            editable: false,
                            formatter: function(cell) {
                                const row = cell.getRow().getData();
                                if (row && row.isSummaryRow) return "";
                                return cell.getValue() || "";
                            }
                        },
                        {
                            title: "종목명",
                            field: "jjNm",
                            minWidth: 180,
                            hozAlign: "left",
                            headerHozAlign: "center",
                            headerSort: false,
                            editable: false,
                            formatter: function(cell) {
                                const row = cell.getRow().getData();
                                if (row && row.isSummaryRow) return "";
                                return cell.getValue() || "";
                            }
                        },
                        {
                            title: "신용/대출<br>시작일자",
                            field: "collStart",
                            width: 115,
                            hozAlign: "center",
                            headerHozAlign: "center",
                            headerSort: false,
                            editor: "input",
                            editable: isCellEditable,
                            formatter: function(cell) {
                                const row = cell.getRow().getData();
                                if (row && row.isSummaryRow) return "";
                                return formatDateVal(cell.getValue());
                            },
                            cellEdited: function(cell) {
                                const row = cell.getRow();
                                const rowData = row.getData();
                                if (rowData && rowData.isSummaryRow) return;
                                rowData.isEdited = true;
                                const newStart = cell.getValue();
                                if (newStart) {
                                    const formattedStart = formatDateVal(newStart);
                                    row.update({
                                        collStart: formattedStart,
                                        collEnd: addMonthsToYmd(formattedStart, 6),
                                        isEdited: true
                                    });
                                }
                            }
                        },
                        // p_dd_coll_start (Grid Internal Rule 3, 4: Empty column with calendar popup button)
                        {
                            title: "",
                            field: "_btn_collStart",
                            width: 32,
                            minWidth: 32,
                            maxWidth: 32,
                            hozAlign: "center",
                            headerSort: false,
                            resizable: false,
                            formatter: (cell) => {
                                const row = cell.getRow().getData();
                                if (row && row.isSummaryRow) return "";
                                return `<button type="button" class="btn-grid-addon btn-cal" title="시작일자 선택"><i class="fa-regular fa-calendar-days"></i></button>`;
                            },
                            cellClick: function(e, cell) {
                                e.stopPropagation();
                                const row = cell.getRow();
                                if (row.getData().isSummaryRow) return;
                                const curVal = row.getData().collStart || "";
                                if (window.AamsCalendar && typeof window.AamsCalendar.openDatePicker === 'function') {
                                    window.AamsCalendar.openDatePicker({
                                        anchorEl: cell.getElement(),
                                        initialYmd: curVal,
                                        format: 'dot',
                                        onSelect: function(dotYmd) {
                                             const formattedStart = formatDateVal(dotYmd);
                                            row.update({
                                                collStart: formattedStart,
                                                collEnd: addMonthsToYmd(formattedStart, 6),
                                                isEdited: true
                                            });
                                        }
                                    });
                                }
                            }
                        },
                        {
                            title: "신용/대출<br>만기일자",
                            field: "collEnd",
                            width: 115,
                            hozAlign: "center",
                            headerHozAlign: "center",
                            headerSort: false,
                            editor: "input",
                            editable: isCellEditable,
                            formatter: function(cell) {
                                const row = cell.getRow().getData();
                                if (row && row.isSummaryRow) return "";
                                return formatDateVal(cell.getValue());
                            },
                            cellEdited: function(cell) {
                                const row = cell.getRow();
                                if (row.getData().isSummaryRow) return;
                                row.update({ isEdited: true });
                            }
                        },
                        // p_dd_coll_end (Grid Internal Rule 3, 4: Empty column with calendar popup button)
                        {
                            title: "",
                            field: "_btn_collEnd",
                            width: 32,
                            minWidth: 32,
                            maxWidth: 32,
                            hozAlign: "center",
                            headerSort: false,
                            resizable: false,
                            formatter: (cell) => {
                                const row = cell.getRow().getData();
                                if (row && row.isSummaryRow) return "";
                                return `<button type="button" class="btn-grid-addon btn-cal" title="만기일자 선택"><i class="fa-regular fa-calendar-days"></i></button>`;
                            },
                            cellClick: function(e, cell) {
                                e.stopPropagation();
                                const row = cell.getRow();
                                if (row.getData().isSummaryRow) return;
                                const curVal = row.getData().collEnd || "";
                                if (window.AamsCalendar && typeof window.AamsCalendar.openDatePicker === 'function') {
                                    window.AamsCalendar.openDatePicker({
                                        anchorEl: cell.getElement(),
                                        initialYmd: curVal,
                                        format: 'dot',
                                        onSelect: function(dotYmd) {
                                            row.update({
                                                collEnd: formatDateVal(dotYmd),
                                                isEdited: true
                                            });
                                        }
                                    });
                                }
                            }
                        },
                        {
                            title: "신용/대출<br>수량",
                            field: "collJusu",
                            width: 115,
                            hozAlign: "right",
                            headerHozAlign: "center",
                            headerSort: false,
                            editor: "number",
                            editable: isCellEditable,
                            formatter: numberFormatter,
                            cellEdited: function(cell) {
                                const row = cell.getRow();
                                if (row.getData().isSummaryRow) return;
                                row.update({ isEdited: true });
                            }
                        },
                        {
                            title: "신용/대출<br>잔액",
                            field: "collateral",
                            width: 130,
                            hozAlign: "right",
                            headerHozAlign: "center",
                            headerSort: false,
                            headerCssClass: "col-hdr-collateral",
                            editor: "number",
                            editable: isCellEditable,
                            formatter: function(cell) {
                                const row = cell.getRow().getData();
                                const val = cell.getValue();
                                if (row && row.isSummaryRow) {
                                    const sumVal = (val == null || val === "" || isNaN(val)) ? 0 : Number(val);
                                    return `<div class="summary-box">${sumVal.toLocaleString()}</div>`;
                                }
                                if (val == null || val === "" || isNaN(val)) return "";
                                return Number(val).toLocaleString();
                            },
                            cellEdited: function(cell) {
                                const row = cell.getRow();
                                if (row.getData().isSummaryRow) return;
                                row.update({ isEdited: true });
                                recalcSummaryRow();
                            }
                        },
                        {
                            title: "전일보유<br>주수",
                            field: "bfilBoyuJusu",
                            width: 105,
                            hozAlign: "right",
                            headerHozAlign: "center",
                            headerSort: false,
                            editable: false,
                            formatter: numberFormatter
                        },
                        {
                            title: "당일매수<br>주수",
                            field: "upJusu",
                            width: 105,
                            hozAlign: "right",
                            headerHozAlign: "center",
                            headerSort: false,
                            editable: false,
                            formatter: numberFormatter
                        },
                        {
                            title: "당일매도<br>주수",
                            field: "dwJusu",
                            width: 105,
                            hozAlign: "right",
                            headerHozAlign: "center",
                            headerSort: false,
                            editable: false,
                            formatter: numberFormatter
                        },
                        {
                            title: "당일잔고<br>주수",
                            field: "compute1",
                            width: 115,
                            hozAlign: "right",
                            headerHozAlign: "center",
                            headerSort: false,
                            headerCssClass: "col-hdr-jango",
                            editable: false,
                            formatter: function(cell) {
                                const row = cell.getRow().getData();
                                if (row && row.isSummaryRow) return "";
                                if (!row.bfilBoyuJusu && !row.upJusu && !row.dwJusu) {
                                    return "";
                                }
                                const bfil = Number(row.bfilBoyuJusu) || 0;
                                const up = Number(row.upJusu) || 0;
                                const dw = Number(row.dwJusu) || 0;
                                return (bfil + up - dw).toLocaleString();
                            }
                        }
                    ]
                });

                // Rule 8: setupTabulatorRowSelection 표준 적용
                if (typeof setupTabulatorRowSelection === "function") {
                    setupTabulatorRowSelection(gridJa010o, function(row, data) {
                        if (data && data.isSummaryRow && row) {
                            row.deselect();
                        }
                    });
                } else {
                    gridElement.addEventListener("click", function(e) {
                        const rowEl = e.target.closest(".tabulator-row");
                        if (rowEl && gridJa010o) {
                            const row = gridJa010o.getRow(rowEl);
                            if (row) {
                                const data = row.getData();
                                if (data && data.isSummaryRow) {
                                    row.deselect();
                                    return;
                                }
                                if (!row.isSelected || !row.isSelected()) {
                                    gridJa010o.deselectRow();
                                    row.select();
                                }
                            }
                        }
                    }, true);
                }

                // Summary 행 선택 방지 이벤트 가드
                gridJa010o.on("rowClick", function(e, row) {
                    if (row && row.getData().isSummaryRow) {
                        row.deselect();
                    }
                });
            }

            // 3. Load Data Function
            function loadJa010oData(force) {
                const corpGr = resolveCorpGr(pane);
                const fundSelect = pane ? pane.querySelector("#filterXx") : document.getElementById("filterXx");

                const ymd = getFilterYmd(pane, 'YYYYMMDD');
                const fundCd = fundSelect ? fundSelect.value.trim() : "";

                if (!corpGr) {
                    alert("운용사를 선택하세요.");
                    return;
                }
                if (!ymd) {
                    alert("기일을 선택하세요.");
                    return;
                }
                if (!fundCd) {
                    alert("펀드를 선택하세요.");
                    return;
                }

                // Rule 10: Guard against redundant fetch
                if (!force && lastCorpGr === corpGr && lastYmd === ymd && lastFundCd === fundCd) {
                    return;
                }

                const url = `/api/daily/ja010o/list?corpGr=${encodeURIComponent(corpGr)}&ymd=${encodeURIComponent(ymd)}&fundCd=${encodeURIComponent(fundCd)}`;

                fetch(url)
                    .then(res => {
                        if (!res.ok) throw new Error("HTTP " + res.status);
                        return res.json();
                    })
                    .then(data => {
                        lastCorpGr = corpGr;
                        lastYmd = ymd;
                        lastFundCd = fundCd;

                        if (window.ButtonRole && typeof window.ButtonRole.setSearchState === "function") {
                            window.ButtonRole.setSearchState(pane, true);
                        }

                        if (gridJa010o) {
                            if (!data || data.length === 0) {
                                // 데이터가 없을 때: 빈 배열 바인딩하여 Placeholder 정중앙 단일 표출 (첫 번째 이미지 규격)
                                gridJa010o.setData([]);
                            } else {
                                // 데이터가 있을 때: 실제 데이터 끝에 Summary(합계) 행 추가 (두 번째 이미지 및 PB d_ja010o1.srd 규격)
                                const totalCollateral = data.reduce((acc, cur) => acc + (Number(cur.collateral) || 0), 0);
                                const listWithSummary = [
                                    ...data,
                                    { isSummaryRow: true, collateral: totalCollateral }
                                ];
                                gridJa010o.setData(listWithSummary).then(() => {
                                    // Rule 15: Select first row automatically on data binding
                                    const rows = gridJa010o.getRows();
                                    if (rows && rows.length > 1) {
                                        rows[0].select();
                                    }
                                });
                            }
                        }
                    })
                    .catch(err => {
                        console.error("Error loading w_ja010o data:", err);
                        alert("데이터 조회 중 오류가 발생했습니다: " + err.message);
                    });
            }

            // 4. Save Data Function (SJM0JM_COLL)
            function saveJa010oData() {
                if (!gridJa010o) return;
                const rows = gridJa010o.getRows();
                const saveList = [];

                rows.forEach(r => {
                    const data = r.getData();
                    if (data && data.isSummaryRow) return; // Summary 행은 저장 대상에서 제외
                    if (data.isEdited || data.collStatus === 'load' || data.collStatus === 'new') {
                        saveList.push(data);
                    }
                });

                if (saveList.length === 0) {
                    alert("저장할 수정 내역이 없습니다.");
                    return;
                }

                if (!confirm(`총 ${saveList.length}건의 담보 내역을 저장하시겠습니까?`)) {
                    return;
                }

                const corpGr = resolveCorpGr(pane);
                const fundSelect = pane ? pane.querySelector("#filterXx") : document.getElementById("filterXx");

                const ymd = getFilterYmd(pane, 'YYYYMMDD');
                const fundCd = fundSelect ? fundSelect.value.trim() : "";

                const payload = {
                    corpGr: corpGr,
                    ymd: ymd,
                    fundCd: fundCd,
                    saveList: saveList,
                    deleteList: []
                };

                fetch('/api/daily/ja010o/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(res => res.json())
                .then(result => {
                    if (result.success) {
                        alert(result.message || "저장이 완료되었습니다.");
                        loadJa010oData(true);
                    } else {
                        alert("저장 실패: " + result.message);
                    }
                })
                .catch(err => {
                    console.error("Error saving ja010o collateral:", err);
                    alert("저장 중 오류가 발생했습니다: " + err.message);
                });
            }

            // 5. Excel Import Function (cb_1 logic in w_ja010o.srw)
            function initExcelImport() {
                const btnLoadExcel = pane ? pane.querySelector("#btnLoadExcel") : document.getElementById("btnLoadExcel");
                const fileInput = pane ? pane.querySelector("#ja010oExcelFileInput") : document.getElementById("ja010oExcelFileInput");

                if (!btnLoadExcel || !fileInput) return;

                btnLoadExcel.onclick = function() {
                    if (!gridJa010o || gridJa010o.getData().length === 0) {
                        alert("먼저 해당 펀드의 데이터를 조회한 후 입/출잔고 LOAD를 실행하세요.");
                        return;
                    }
                    fileInput.value = "";
                    fileInput.click();
                };

                fileInput.onchange = function(e) {
                    const file = e.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        try {
                            const data = new Uint8Array(evt.target.result);
                            const workbook = XLSX.read(data, { type: 'array' });
                            const firstSheetName = workbook.SheetNames[0];
                            const sheet = workbook.Sheets[firstSheetName];
                            const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

                            const currentYmd = getFilterYmd(pane, 'YYYY.MM.DD');

                            let matchCount = 0;
                            const gridRows = gridJa010o.getRows();

                            // Rows loop matching koscom_cd (similar to w_ja010o.srw cb_1)
                            for (let r = 1; r < rows.length; r++) {
                                const rowCells = rows[r];
                                if (!rowCells || rowCells.length === 0) continue;

                                let rawCd = String(rowCells[0] || "").trim();
                                if (!rawCd) continue;

                                // Match koscom_cd extraction: POS(rawCd, '(A')
                                let koscomCd = rawCd;
                                if (rawCd.includes('(A')) {
                                    const startIdx = rawCd.indexOf('(A') + 2;
                                    const endIdx = rawCd.indexOf(')', startIdx);
                                    koscomCd = endIdx > startIdx ? rawCd.substring(startIdx, endIdx) : rawCd.substring(startIdx);
                                } else if (rawCd.startsWith('A')) {
                                    koscomCd = rawCd.substring(1);
                                }

                                const collJusu = Number(rowCells[2]) || 0; // cell(r, 3)
                                const collateral = Number(rowCells[8]) || 0; // cell(r, 9)

                                // Find in grid by koscom_cd or jm_cd
                                for (let gr of gridRows) {
                                    const gd = gr.getData();
                                    const targetKoscom = gd.koscom_cd || gd.jmCd || "";
                                    if (targetKoscom.trim() === koscomCd.trim() || gd.jmCd.trim() === koscomCd.trim()) {
                                        let collStart = gd.collStart || currentYmd;
                                        let collEnd = gd.collEnd || addMonthsToYmd(collStart, 6);

                                        gr.update({
                                            collJusu: collJusu,
                                            collateral: collateral,
                                            collStart: collStart,
                                            collEnd: collEnd,
                                            collStatus: 'load',
                                            isEdited: true
                                        });
                                        matchCount++;
                                        break;
                                    }
                                }
                            }

                            // Delete rows where collStatus is 'jango' (unmatched old jango in PowerBuilder)
                            gridRows.forEach(gr => {
                                const gd = gr.getData();
                                if (gd.collStatus === 'jango') {
                                    gr.delete();
                                }
                            });

                            // Summary(합계) 행 실시간 재계산
                            recalcSummaryRow();

                            alert(`입/출잔고 Load가 완료되었습니다.\n(반영 종목: ${matchCount}건)`);
                        } catch (err) {
                            console.error("Error parsing excel file:", err);
                            alert("엑셀 파일 로드 중 오류가 발생했습니다: " + err.message);
                        }
                    };
                    reader.readAsArrayBuffer(file);
                };
            }

            // 6. Excel Export Function
            function exportJa010oExcel() {
                if (!gridJa010o) return;
                const fundSelect = pane ? pane.querySelector("#filterXx") : document.getElementById("filterXx");
                const fundCd = fundSelect ? fundSelect.value.trim() : "펀드";
                const ymd = getFilterYmd(pane, 'YYYYMMDD');

                gridJa010o.download("xlsx", `주식신용대출잔고_${fundCd}_${ymd}.xlsx`, { sheetName: "신용대출잔고" });
            }

            // 7. Initialize Pure JS Calendar (common.js initFilterCalendar 공통 연동)
            function initCalendar() {
                initFilterCalendar(pane, /*[[${ymd}]]*/ '');
            }

            // 8. Connect Toolbar Actions (Rule 9 standard contract functions)
            function bindToolbarActions() {
                if (!pane) return;
                pane.onSearch = function() {
                    loadJa010oData(true);
                };
                pane.onSave = function() {
                    saveJa010oData();
                };
                pane.onExcel = function() {
                    exportJa010oExcel();
                };
                pane.onCorpGrChange = function(newCorpGr) {
                    if (codeSearchInstance) {
                        codeSearchInstance.clear();
                    }
                    lastCorpGr = null;
                    lastFundCd = null;
                };
                pane.onRefresh = function() {
                    if (codeSearchInstance) {
                        codeSearchInstance.clear();
                    }
                    if (gridJa010o) {
                        gridJa010o.clearData();
                        updateSummaryVisibility();
                    }
                    lastCorpGr = null;
                    lastFundCd = null;
                    lastYmd = null;
                    if (window.ButtonRole && typeof window.ButtonRole.setSearchState === "function") {
                        window.ButtonRole.setSearchState(pane, false);
                    }
                    if (typeof showToast === "function") {
                        showToast("화면이 초기화되었습니다.", "info");
                    }
                };
            }

            // 9. Single Entry Point Initialization (Rule 11)
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                initCalendar();
                initGrid();
                initCodeSearch();
                initExcelImport();
                bindToolbarActions();

                if (window.ButtonRole && typeof window.ButtonRole.setSearchState === "function") {
                    window.ButtonRole.setSearchState(pane, false);
                }
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", startInit);
            } else {
                startInit();
            }
        })();
    </script>
</div>

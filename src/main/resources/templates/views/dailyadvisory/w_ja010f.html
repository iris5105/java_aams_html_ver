<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-single ja010f-container" th:fragment="ja010fView">

    <!-- Top Action Control Bar (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <!-- Reusable Common Toolbar Buttons Fragment (닫기, 새로고침, 조회, 입력, 저장, 엑셀) -->
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <!-- Reusable Common Breadcrumb Fragment -->
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- Filter Bar (Row 2): Rule 14 unified filter-bar with left filter and right action buttons -->
    <div class="filter-bar">
        <div class="filter-left" style="display: flex; align-items: center; gap: 16px;">
            <div class="filter-item" style="position: relative; display: flex; align-items: center; gap: 6px;">
                <label for="filterJa010fYmd" style="font-weight: 600; font-size: 13px; color: #334155;">LOAD일자:</label>
                <!-- Pure JS AamsCalendar Wrapper + Button + Popover -->
                <div class="aams-calendar-wrapper" style="position: relative; display: inline-flex; align-items: center;">
                    <input type="text" id="filterJa010fYmd" name="ymd" class="t-input aams-calendar-input" style="width: 110px; padding: 4px 8px; font-size: 13px; text-align: center; border: 1px solid #cbd5e1; border-radius: 4px 0 0 4px; cursor: pointer; background: #ffffff;" th:value="${ymd}" readonly />
                    <button type="button" class="t-btn btn-calendar" id="btnJa010fCalendar" title="달력 열기" style="padding: 5px 10px; border-radius: 0 4px 4px 0; border-left: none; background-color: #3b82f6; color: #ffffff; border: 1px solid #3b82f6; cursor: pointer;">
                        <i class="fa-regular fa-calendar-days"></i>
                    </button>
                </div>
            </div>
            <div class="filter-item" style="display: flex; align-items: center; gap: 6px;">
                <label for="filterDddw" style="font-weight: 600; font-size: 13px; color: #334155;">증권사:</label>
                <select id="filterDddw" name="dddw" class="filter-select">
                    <option value="">전체</option>
                </select>
                <button type="button" id="btnLoad" class="t-btn btn-action" style="background: #2563eb; color: #ffffff; border-color: #1d4ed8;">
                <i class="fa-solid fa-file-import"></i> 예수금LOAD
            </button>
            </div>
        </div>

    </div>

    <!-- Tag Guide Notice Banner (from w_ja010f.srw tag property) -->
    <div class="guide-notice-bar" style="padding: 4px 16px; background-color: #f8fafc; border-bottom: 1px solid #e2e8f0; font-size: 11px; color: #64748b; display: flex; align-items: center; gap: 6px;">
        <i class="fa-solid fa-circle-info" style="color: #0284c7;"></i>
        <span>* 수요예측자료 엑셀LOAD시 등록된 예금자료 기준으로 처리</span>
    </div>

    <!-- Main Grid Section (d_ja010f1.srd / SHT0YE + SZM0IA) -->
    <div class="grid-section" style="flex: 1 1 auto; height: calc(100% - 115px); padding: 8px 12px; overflow: hidden;">
        <div class="grid-table-wrapper" style="height: 100%; width: 100%; border: 1px solid #cbd5e1; border-radius: 4px; overflow: hidden; background-color: #fff;">
            <div id="ja010f-grid" class="tabulator-aams-grid" style="height: 100%;"></div>
        </div>
    </div>

    <!-- Page Specific Script for w_ja010f -->
    <script th:inline="javascript">
        (function() {
            const currentScript = document.currentScript;
            const pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;

            let gridJa010f = null;
            let brokerOptionsMap = {}; // tr_co_cd code -> name cache

            // Numeric Money Formatter
            function numberFormatter(cell) {
                const val = cell.getValue();
                if (val == null || val === "" || isNaN(val)) return "0";
                return Number(val).toLocaleString();
            }

            // Broker (tr_co_cd) Name Lookup Formatter
            function trCoFormatter(cell) {
                const val = cell.getValue();
                if (!val) return "";
                if (brokerOptionsMap[val]) {
                    return brokerOptionsMap[val];
                }
                return val;
            }

            // Recalculate total evaluation amount
            function recalculateTotAek(row) {
                const data = row.getData();
                const t0 = Number(data.t0Aek || 0);
                const stock = Number(data.stockAek || 0);
                const bond = Number(data.bondAek || 0);
                const rp = Number(data.rpAek || 0);
                row.update({ totAek: t0 + stock + bond + rp });
            }

            // Initialize Pure JS Highlight Calendar (AamsCalendar)
            function initCalendarComponent() {
                const doInit = function() {
                    if (typeof AamsCalendar !== 'undefined') {
                        const corpGr = resolveCorpGr(pane);
                        AamsCalendar.init('filterJa010fYmd', {
                            pane: pane,
                            initialYmd: /*[[${ymd}]]*/ "",
                            highlightDates: /*[[${trDates}]]*/ [],
                            datesApiUrl: '/api/daily/ja010f/dates',
                            corpGr: corpGr,
                            historyTitle: "예수금 내역 존재"
                        });
                    } else {
                        setTimeout(doInit, 50);
                    }
                };
                doInit();
            }

            // 1. Initialize DDDW Options for tr_co_cd (Rule 7: 2-column dropdown with sticky header)
            function initDddwOptions() {
                const corpGr = resolveCorpGr(pane);
                const dddwSelect = pane ? pane.querySelector("#filterDddw") : document.getElementById("filterDddw");
                if (!dddwSelect) return Promise.resolve();

                if (typeof window.f_dddwctl === "function") {
                    return window.f_dddwctl('tr_co_cd', corpGr, '%,전체,', 1, "tr_gb='1'").then(options => {
                        brokerOptionsMap = {};
                        if (options && options.length > 0) {
                            dddwSelect.innerHTML = '';
                            options.forEach(opt => {
                                const code = (opt.code != null ? opt.code : (opt.cd || '')).toString().trim();
                                const name = (opt.name != null ? opt.name : (opt.dscr || code)).toString().trim();
                                if (code && code !== "%") {
                                    brokerOptionsMap[code] = name;
                                }
                                const optionEl = document.createElement("option");
                                optionEl.value = code;
                                optionEl.textContent = name ? `${code}: ${name}` : code;
                                dddwSelect.appendChild(optionEl);
                            });

                            dddwSelect.value = "%";

                            // Transform to 2-column sticky dropdown widget using Guideline 7
                            if (typeof window.f_dddwctl.get2ColItemFormatter === 'function') {
                                window.f_dddwctl.get2ColItemFormatter(dddwSelect, options, {
                                    codeTitle: "코드",
                                    nameTitle: "증권사명",
                                    defaultVal: "%",
                                    onSelect: function(val) {
                                        dddwSelect.value = val;
                                    }
                                });
                            }
                        }

                        if (gridJa010f) {
                            gridJa010f.redraw(true);
                        }
                    }).catch(err => console.error("Error loading tr_co_cd DDDW in w_ja010f:", err));
                }
                return Promise.resolve();
            }

            // Helper to ensure row selection upon clicking any editable cell
            function selectAndEdit(cell) {
                const row = cell.getRow();
                if (row && (!row.isSelected || !row.isSelected())) {
                    if (gridJa010f) {
                        gridJa010f.deselectRow();
                    }
                    row.select();
                }
                cell.edit(true);
            }

            // 2. Initialize Main Grid (d_ja010f1.srd / SHT0YE + SZM0IA)
            // Configured strictly based on tabsequence (Rule 5) & column naming rule (fundCd -> 펀드번호)
            function initGrid() {
                const gridElement = pane ? pane.querySelector("#ja010f-grid") : document.getElementById("ja010f-grid");
                if (!gridElement) return;

                gridJa010f = new Tabulator(gridElement, {
                    layout: "fitDataFill",
                    height: "100%",
                    placeholder: "조회된 예수금 잔액 내역이 없습니다.",
                    selectableRows: 1,
                    editTriggerEvent: "click",
                    tabEndNewRow: false,
                    keybindings: {
                        navNext: "tab",
                        navPrev: "shift + tab"
                    },
                    rowFormatter: function(row) {
                        const data = row.getData();
                        if (data && (data.isNew === true || data._isNew === true)) {
                            row.getElement().classList.add("aams-new-row");
                        } else {
                            row.getElement().classList.remove("aams-new-row");
                        }
                    },
                    columns: [
                        { title: "No.", formatter: "rownum", width: 45, hozAlign: "center", headerHozAlign: "center", resizable: false },
                        // tabsequence=10: fund_cd (펀드번호)
                        { 
                            title: "펀드번호", 
                            field: "fundCd", 
                            width: 105, 
                            hozAlign: "center", 
                            headerHozAlign: "center",
                            editor: "input",
                            editable: function(cell) { return Boolean(cell.getRow().getData().isNew); },
                            cellClick: aamsCellEdit
                        },
                        // p_xx_fund_cd: Dynamic search button
                        {
                            title: "",
                            field: "_btn_fundCd",
                            width: 36,
                            minWidth: 36,
                            maxWidth: 36,
                            hozAlign: "center",
                            headerSort: false,
                            resizable: false,
                            formatter: function(cell) {
                                const isNew = cell.getRow().getData().isNew;
                                const disClass = isNew ? "" : "disabled";
                                return `<button type="button" class="btn-grid-addon btn-search ${disClass}" title="펀드 검색"><i class="fa-solid fa-magnifying-glass"></i></button>`;
                            },
                            cellClick: function(e, cell) {
                                e.stopPropagation();
                                const row = cell.getRow();
                                const data = row.getData();
                                if (!data.isNew && !data._isNew) {
                                    if (gridJa010f) { gridJa010f.deselectRow(); row.select(); }
                                    return;
                                }
                                const curVal = data.fundCd || "";
                                if (window.DynamicCodeSearch && typeof window.DynamicCodeSearch.openModal === 'function') {
                                    window.DynamicCodeSearch.openModal({
                                        columnNm: "fund_cd",
                                        seq: 1,
                                        initialKeyword: curVal,
                                        onSelect: function(code, name) {
                                            row.update({ fundCd: code, fundNm: name });
                                        }
                                    });
                                }
                            }
                        },
                        // tabsequence=32766: xx_fund_cd (고객명 - read-only)
                        { title: "고객명", field: "fundNm", width: 160, hozAlign: "left", headerHozAlign: "center" },
                        // tabsequence=20: t0_aek (당일잔액 - editable)
                        { 
                            title: "당일잔액", 
                            field: "t0Aek", 
                            width: 130, 
                            hozAlign: "right", 
                            headerHozAlign: "center", 
                            formatter: numberFormatter,
                            editor: "number",
                            editable: true,
                            cellClick: aamsCellEdit,
                            cellEdited: function(cell) { 
                                recalculateTotAek(cell.getRow()); 
                                const r = cell.getRow();
                                if (!r.getData().isNew) r.update({ isUpdated: true });
                            }
                        },
                        // tabsequence=40: t2_aek (D+2일잔액 - editable)
                        { 
                            title: "D+2일잔액", 
                            field: "t2Aek", 
                            width: 130, 
                            hozAlign: "right", 
                            headerHozAlign: "center", 
                            formatter: numberFormatter,
                            editor: "number",
                            editable: true,
                            cellClick: aamsCellEdit,
                            cellEdited: function(cell) {
                                const r = cell.getRow();
                                if (!r.getData().isNew) r.update({ isUpdated: true });
                            }
                        },
                        // tabsequence=50: stock_aek (주식평가액 - editable)
                        { 
                            title: "주식평가액", 
                            field: "stockAek", 
                            width: 130, 
                            hozAlign: "right", 
                            headerHozAlign: "center", 
                            formatter: numberFormatter,
                            editor: "number",
                            editable: true,
                            cellClick: aamsCellEdit,
                            cellEdited: function(cell) { 
                                recalculateTotAek(cell.getRow()); 
                                const r = cell.getRow();
                                if (!r.getData().isNew) r.update({ isUpdated: true });
                            }
                        },
                        // tabsequence=60: bond_aek (채권평가액 - editable)
                        { 
                            title: "채권평가액", 
                            field: "bondAek", 
                            width: 130, 
                            hozAlign: "right", 
                            headerHozAlign: "center", 
                            formatter: numberFormatter,
                            editor: "number",
                            editable: true,
                            cellClick: aamsCellEdit,
                            cellEdited: function(cell) { 
                                recalculateTotAek(cell.getRow()); 
                                const r = cell.getRow();
                                if (!r.getData().isNew) r.update({ isUpdated: true });
                            }
                        },
                        // tabsequence=70: rp_aek (RP평가액 - editable)
                        { 
                            title: "RP평가액", 
                            field: "rpAek", 
                            width: 130, 
                            hozAlign: "right", 
                            headerHozAlign: "center", 
                            formatter: numberFormatter,
                            editor: "number",
                            editable: true,
                            cellClick: aamsCellEdit,
                            cellEdited: function(cell) { 
                                recalculateTotAek(cell.getRow()); 
                                const r = cell.getRow();
                                if (!r.getData().isNew) r.update({ isUpdated: true });
                            }
                        },
                        // tabsequence=32766: tot_aek (평가총액 - read-only, auto calculated)
                        { title: "평가총액", field: "totAek", width: 140, hozAlign: "right", headerHozAlign: "center", formatter: numberFormatter },
                        // tabsequence=32766: acct_no (계좌번호 - read-only)
                        { title: "계좌번호", field: "acctNo", width: 130, hozAlign: "center", headerHozAlign: "center" }
                    ]
                });

                // AAMS 전역 공통 CUD 버퍼 매니저 바인딩 (규칙 1, 2, 3, 4)
                cudManager = (typeof AamsCudManager !== 'undefined' && typeof AamsCudManager.create === 'function')
                    ? AamsCudManager.create(gridJa010f)
                    : null;

                if (typeof setupTabulatorRowSelection === "function") {
                    setupTabulatorRowSelection(gridJa010f);
                }
            }

            // 3. Load Data Function
            window.loadJa010fData = function() {
                const corpGr = resolveCorpGr(pane);
                const ymd = getFilterYmd(pane);
                const trCoCd = filterDddwSelect ? filterDddwSelect.value : "%";

                if (!corpGr || !ymd) {
                    if (cudManager) cudManager.reset();
                    if (gridJa010f) gridJa010f.setData([]);
                    return;
                }

                const url = `/api/daily/ja010f/list?corpGr=${encodeURIComponent(corpGr)}&ymd=${encodeURIComponent(ymd)}&trCoCd=${encodeURIComponent(trCoCd || '%')}`;

                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        if (gridJa010f) {
                            if (cudManager) {
                                gridJa010f.setData(cudManager.formatData(data)).then(() => {
                                    const rows = gridJa010f.getRows();
                                    if (rows && rows.length > 0) {
                                        gridJa010f.deselectRow();
                                        rows[0].select();
                                    }
                                });
                            } else {
                                gridJa010f.setData(Array.isArray(data) ? data : []).then(() => {
                                    const rows = gridJa010f.getRows();
                                    if (rows && rows.length > 0) {
                                        gridJa010f.deselectRow();
                                        rows[0].select();
                                    }
                                });
                            }
                        }
                    })
                    .catch(err => {
                        console.error("Error loading ja010f list:", err);
                    });
            };

            // 4. Add New Row Function (Rule 5 & Exception 1)
            function addNewRow() {
                const ymd = getFilterYmd(pane);
                const filterDddwSelect = pane ? pane.querySelector("#filterDddw") : document.getElementById("filterDddw");
                const trCoCd = (filterDddwSelect && filterDddwSelect.value !== "%") ? filterDddwSelect.value : "";

                const baseData = {
                    isNew: true,
                    isUpdated: false,
                    trYmd: ymd,
                    fundCd: "",
                    fundNm: "",
                    t0Aek: null,
                    t2Aek: null,
                    stockAek: null,
                    bondAek: null,
                    rpAek: null,
                    totAek: null,
                    acctNo: null,
                    trCoCd: trCoCd,
                    bigo: "w_ja010f"
                };

                const newRowData = cudManager ? cudManager.createNewRow(baseData) : baseData;

                if (gridJa010f) {
                    gridJa010f.addRow(newRowData, true).then(function(row) {
                        gridJa010f.deselectRow();
                        row.select();
                        const cell = row.getCell("fundCd");
                        if (cell) cell.edit();
                    });
                }
            }

            // 5. Register Standard Contracts (Guideline 9)
            if (pane) {
                pane.onSearch = function() { window.loadJa010fData(); };
                pane.onRetrieve = function() { window.loadJa010fData(); };
                pane.onInput = addNewRow;

                // 삭제 처리 (AamsCudManager 전역 연동)
                pane.onDelete = function() {
                    if (!gridJa010f) return;
                    const selectedRows = gridJa010f.getSelectedRows();
                    if (!selectedRows || selectedRows.length === 0) {
                        showToast("삭제할 행을 먼저 선택해주세요.", "warning");
                        return;
                    }
                    const targetRow = selectedRows[0];
                    if (cudManager) {
                        cudManager.deleteRow(targetRow).then(function() {
                            showToast("행이 삭제되었습니다. [저장] 시 최종 반영됩니다.", "info");
                        });
                    } else {
                        targetRow.delete().then(function() {
                            showToast("행이 삭제되었습니다.", "info");
                        });
                    }
                };

                pane.onSave = function() {
                    if (!gridJa010f) return;
                    const corpGr = resolveCorpGr(pane);
                    if (!corpGr) {
                        showToast("회사그룹을 선택해주세요.", "warning");
                        return;
                    }
                    const ymd = getFilterYmd(pane);

                    let targetItems = [];
                    let deletedItems = [];

                    if (cudManager) {
                        const changes = cudManager.getChanges();
                        if (!changes.hasChanges) {
                            showToast("저장할 변경 내역이 없습니다.", "info");
                            return;
                        }
                        targetItems = changes.itemList;
                        deletedItems = changes.deletedList;
                    } else {
                        const allRows = gridJa010f.getRows();
                        for (let r of allRows) {
                            const d = r.getData();
                            if (d.isNew || d.isUpdated) targetItems.push(d);
                        }
                        if (targetItems.length === 0) {
                            showToast("저장할 변경 내역이 없습니다.", "info");
                            return;
                        }
                    }

                    for (let d of targetItems) {
                        if (!d.fundCd || !d.fundCd.trim()) {
                            showToast("펀드번호는 필수 입력 항목입니다.", "warning");
                            return;
                        }
                    }

                    fetch("/api/daily/ja010f/save", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            corpGr: corpGr,
                            ymd: ymd,
                            itemList: targetItems,
                            deletedList: deletedItems
                        })
                    })
                    .then(res => res.json())
                    .then(res => {
                        if (res.success) {
                            if (cudManager) cudManager.reset();
                            showToast(res.message || "정상적으로 저장되었습니다.", "success");
                            window.loadJa010fData();
                        } else {
                            showToast(res.message || "저장 중 오류가 발생했습니다.", "error");
                        }
                    })
                    .catch(err => {
                        console.error("Save error:", err);
                        showToast("저장 중 통신 오류가 발생했습니다.", "error");
                    });
                };

                // 공통버튼 지침: 새로고침은 조회 전 초기화 상태로 되돌린다.
                pane.onRefresh = function() {
                    if (cudManager) cudManager.reset();
                    if (gridJa010f) gridJa010f.clearData();
                    if (typeof showToast === "function") showToast("화면이 초기화되었습니다.", "info");
                };
                pane.onCorpGrChange = function(val) {
                    if (typeof AamsCalendar !== 'undefined') {
                        AamsCalendar.loadHighlightDates('filterJa010fYmd', '/api/daily/ja010f/dates', val);
                    }
                    initDddwOptions();
                };

                pane.addEventListener("corpGrChanged", function(e) {
                    const val = e.detail ? e.detail.corpGr : resolveCorpGr(pane);
                    if (typeof AamsCalendar !== 'undefined') {
                        AamsCalendar.loadHighlightDates('filterJa010fYmd', '/api/daily/ja010f/dates', val);
                    }
                    initDddwOptions();
                });

                // Sub action buttons
                const btnLoad = pane.querySelector("#btnLoad");
                if (btnLoad) {
                    btnLoad.addEventListener("click", function() {
                        alert("예수금 엑셀 파일 LOAD 작업을 실행합니다.");
                    });
                }
            }

            // Guideline 11: Single initialization entry point with isInitialized guard
            let isInitialized = false;
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                initCalendarComponent();
                initGrid();
                initDddwOptions();
                // 자동 조회 지침: boolean eb_direct_retrieve = true 가 없으므로 초기 자동 조회 없음
            }

            if (document.readyState === "complete" || document.readyState === "interactive") {
                setTimeout(startInit, 50);
            } else {
                document.addEventListener("DOMContentLoaded", startInit);
            }
        })();
    </script>
</div>
</html>

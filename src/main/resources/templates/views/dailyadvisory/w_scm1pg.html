<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-split scm1pg-container" th:fragment="scm1pgView">

    <!-- Top Action Control Bar (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <!-- Reusable Common Toolbar Buttons Fragment -->
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <!-- Reusable Common Breadcrumb Fragment -->
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- Filter Bar (Row 2): Rule 14 & Rule 17 - dc_ymd fragment matching dw_c in w_scm1pg.srw -->
    <div class="filter-bar">
        <div class="filter-left">
            <div th:replace="~{fragments/filter/dc_ymd :: filter(labelYmd='적용기준일')}"></div>
        </div>
        <div class="filter-actions">
            <!-- Optional search input or quick filter -->
            <div class="filter-item">
                <input type="text" id="filterMasterKeyword" class="filter-input" placeholder="종목코드/종목명 검색" style="width: 180px; font-size: 12px;" />
            </div>
        </div>
    </div>

    <!-- Split Master-Detail Layout (Horizontal Split: Left Master, Right Detail) -->
    <div class="split-content-container" style="flex: 1 1 auto; height: calc(100% - 92px); padding: 8px 12px; overflow: hidden; display: flex; flex-direction: row; gap: 12px;">
        
        <!-- Left Master Section: Bond Stock List (d_scm1pg_1) -->
        <div class="grid-section master-section" style="flex: 0 0 42%; min-width: 320px; display: flex; flex-direction: column; overflow: hidden;">
            <div class="section-header" style="padding: 6px 10px; font-weight: 600; font-size: 13px; color: #1e293b; background: #e2e8f0; border-radius: 4px 4px 0 0; display: flex; justify-content: space-between; align-items: center;">
                <span><i class="fa-solid fa-list" style="margin-right: 6px; color: #3b82f6;"></i> 채권 종목 목록</span>
                <span id="master-count" style="font-size: 11px; color: #64748b; font-weight: normal;">0건</span>
            </div>
            <div class="grid-table-wrapper" style="flex: 1 1 auto; height: 100%; width: 100%; border: 1px solid #cbd5e1; border-top: none; border-radius: 0 0 4px 4px; overflow: hidden; background-color: #fff;">
                <div id="scm1pg-master-grid" class="tabulator-aams-grid" style="height: 100%;"></div>
            </div>
        </div>

        <!-- Right Detail Section: Credit Rating & Buy Account List (d_scm1pg_2) -->
        <div class="grid-section detail-section" style="flex: 1 1 58%; min-width: 420px; display: flex; flex-direction: column; overflow: hidden;">
            <div class="section-header" style="padding: 5px 10px; font-weight: 600; font-size: 13px; color: #1e293b; background: #e2e8f0; border-radius: 4px 4px 0 0; display: flex; justify-content: space-between; align-items: center;">
                <span><i class="fa-solid fa-award" style="margin-right: 6px; color: #10b981;"></i> 채권 등급 및 매수계좌 (<span id="selected-jm-name" style="color: #2563eb;">선택된 종목 없음</span>)</span>
                <div style="display: flex; align-items: center; gap: 6px;">
                    <span id="detail-count" style="font-size: 11px; color: #64748b; font-weight: normal; margin-right: 4px;">0건</span>
                    <!-- Detail Sub Action Buttons matching PowerBuilder UI -->
                    <div class="btn-group-sub" style="display: inline-flex; gap: 3px;">
                        <button type="button" id="btnDetailRefresh" class="btn-action btn-sub" title="상세 새로고침" style="padding: 2px 7px; font-size: 11px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 3px; cursor: pointer;">
                            <i class="fa-solid fa-rotate-right"></i>
                        </button>
                        <button type="button" id="btnDetailAdd" class="btn-action btn-sub" title="행추가" style="padding: 2px 7px; font-size: 11px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 3px; cursor: pointer;">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                        <button type="button" id="btnDetailDel" class="btn-action btn-sub" title="행삭제" style="padding: 2px 7px; font-size: 11px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 3px; cursor: pointer;">
                            <i class="fa-solid fa-minus"></i>
                        </button>
                        <button type="button" id="btnDetailSave" class="btn-action btn-sub" title="상세저장" style="padding: 2px 7px; font-size: 11px; background: #2563eb; color: #fff; border: 1px solid #1d4ed8; border-radius: 3px; cursor: pointer;">
                            <i class="fa-solid fa-floppy-disk"></i>
                        </button>
                        <button type="button" id="btnDetailExcel" class="btn-action btn-sub" title="엑셀다운로드" style="padding: 2px 7px; font-size: 11px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 3px; cursor: pointer;">
                            <i class="fa-solid fa-file-excel" style="color: #16a34a;"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="grid-table-wrapper" style="flex: 1 1 auto; height: 100%; width: 100%; border: 1px solid #cbd5e1; border-top: none; border-radius: 0 0 4px 4px; overflow: hidden; background-color: #fff;">
                <div id="scm1pg-detail-grid" class="tabulator-aams-grid" style="height: 100%;"></div>
            </div>
        </div>

    </div>

    <!-- Responsive Layout Style for Small Screens -->
    <style>
        @media (max-width: 876px) {
            .scm1pg-container .split-content-container {
                flex-direction: column !important;
            }
            .scm1pg-container .master-section {
                flex: 0 0 45% !important;
                min-height: 220px;
            }
            .scm1pg-container .detail-section {
                flex: 1 1 55% !important;
                min-height: 250px;
            }
        }
    </style>

    <!-- Pure JS AAMS Calendar Component (Rule 16) -->
    <script th:src="@{/js/aams_calendar.js}" src="/js/aams_calendar.js"></script>

    <!-- DDDW Control Component (Rule 7) -->
    <script th:src="@{/js/f_dddwctl.js}" src="/js/f_dddwctl.js"></script>

    <!-- Page Specific Script for w_scm1pg -->
    <script th:inline="javascript">
        (function() {
            const currentScript = document.currentScript;
            const pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;

            let gridMaster = null;
            let gridDetail = null;
            let isInitialized = false;
            let lastLoadedMasterKey = null;
            let currentSelectedMaster = null;
            let masterAllData = [];
            let deletedDetailList = [];
            let dddwOptionsMap = {};

            // Corporate Group Resolver (Guideline 1: No default hardcoded value)
            function resolveCorpGr() {
                if (window.currentCorpGr) return window.currentCorpGr;
                const m = document.cookie.match(/(^|;)\s*savedCorpGr=([^;]+)/) || document.cookie.match(/(^|;)\s*corpGr=([^;]+)/);
                if (m) return decodeURIComponent(m[2]);
                const selectEl = pane ? pane.querySelector("#filterCorpGr") : document.getElementById("filterCorpGr");
                if (selectEl && selectEl.value) return selectEl.value;
                const globalSelect = document.getElementById("topCorpGrSelect") || document.getElementById("filterCorpGr");
                if (globalSelect && globalSelect.value) return globalSelect.value;
                return "";
            }

            function getFilterYmd() {
                const input = pane ? pane.querySelector("#filterYmd") : document.getElementById("filterYmd");
                if (!input) return "";
                let val = input.value || "";
                return val.replace(/\./g, '-');
            }

            // DDDW Retrieval (Rule 7: f_dddwctl (THIS, 'pg_cd', '', '', 1, ''))
            function retrieveDddw() {
                const targetCorpGr = resolveCorpGr();
                if (typeof window.f_dddwctl === 'function') {
                    window.f_dddwctl('pg_cd', 1, targetCorpGr, '', '').then(list => {
                        dddwOptionsMap.pg_cd = list || [];
                        if (gridDetail) {
                            gridDetail.redraw(true);
                        }
                    }).catch(err => {
                        console.error("Failed to retrieve DDDW options for pg_cd:", err);
                    });
                }
            }

            function getDddwOptions(dddwKey) {
                const list = dddwOptionsMap[dddwKey] || [];
                return list.map(item => {
                    const code = (item.code != null ? item.code : (item.SEBU_CD != null ? item.SEBU_CD : (item.cd != null ? item.cd : ''))).toString().trim();
                    const name = (item.name != null ? item.name : (item.SEBU_CD_NM != null ? item.SEBU_CD_NM : (item.dscr != null ? item.dscr : code))).toString().trim();
                    return { 
                        label: `${code} / (${name})`, 
                        value: code,
                        code: code,
                        name: name
                    };
                });
            }

            // Rule 7: 2-Column Dropdown Item Formatter
            function createDddw2ColFormatter(codeWidth, codeTitle, nameTitle) {
                if (typeof window.f_dddwctl === 'function' && typeof window.f_dddwctl.get2ColItemFormatter === 'function') {
                    return window.f_dddwctl.get2ColItemFormatter(codeWidth, codeTitle, nameTitle);
                }
                return function(label, value, item) {
                    const code = (item && item.code != null) ? item.code : value;
                    const name = (item && item.name != null) ? item.name : label;
                    return `<div class="dddw-2col-row"><span class="dddw-col-code">${code}</span><span class="dddw-col-name">${name}</span></div>`;
                };
            }

            function getDddwLabel(dddwKey, codeVal) {
                if (codeVal == null || codeVal === "") return "";
                if (typeof window.f_dddwctl === 'function' && typeof window.f_dddwctl.getLabel === 'function') {
                    const l = window.f_dddwctl.getLabel(dddwOptionsMap, dddwKey, codeVal);
                    if (l) return `${codeVal} / (${l})`;
                }
                const list = dddwOptionsMap[dddwKey] || [];
                const found = list.find(item => {
                    const c = (item.code != null ? item.code : (item.SEBU_CD != null ? item.SEBU_CD : item.cd));
                    return String(c).trim() === String(codeVal).trim();
                });
                if (found) {
                    const n = found.name != null ? found.name : (found.SEBU_CD_NM != null ? found.SEBU_CD_NM : found.dscr);
                    return `${codeVal} / (${n})`;
                }
                return String(codeVal);
            }

            // Master Columns (d_scm1pg_1.srd)
            const masterColumns = [
                {
                    title: "No.",
                    field: "fseq",
                    formatter: "rownum",
                    width: 55,
                    hozAlign: "center",
                    headerHozAlign: "center",
                    headerSort: false,
                    frozen: true
                },
                {
                    title: "종목코드",
                    field: "jmCd",
                    width: 130,
                    hozAlign: "center",
                    headerHozAlign: "center"
                },
                {
                    title: "종목명",
                    field: "cjNm",
                    minWidth: 160,
                    hozAlign: "left",
                    headerHozAlign: "center"
                }
            ];

            // Detail Columns (d_scm1pg_2.srd - Exactly 4 columns matching PB image)
            const detailColumns = [
                {
                    title: "No.",
                    field: "fseq",
                    formatter: "rownum",
                    width: 55,
                    hozAlign: "center",
                    headerHozAlign: "center",
                    headerSort: false,
                    frozen: true
                },
                {
                    title: "적용일자",
                    field: "ymd",
                    width: 120,
                    hozAlign: "center",
                    headerHozAlign: "center",
                    editor: "input",
                    editable: function(cell) { return !!cell.getRow().getData().isNew; },
                    cellClick: function(e, cell) {
                        if (typeof aamsCellEdit === 'function') aamsCellEdit(e, cell);
                        const rowData = cell.getRow().getData();
                        if (rowData.isNew && typeof AamsCalendar !== 'undefined') {
                            AamsCalendar.open(cell.getElement(), cell.getValue(), function(selectedDate) {
                                cell.setValue(selectedDate);
                            });
                        }
                    }
                },
                {
                    title: "신용등급",
                    field: "pgCd",
                    width: 200,
                    hozAlign: "left",
                    headerHozAlign: "center",
                    editor: "list",
                    editorParams: {
                        values: function() { return getDddwOptions('pg_cd'); },
                        itemFormatter: createDddw2ColFormatter(60, "코드", "등급명"),
                        autocomplete: true,
                        listOnEmpty: true,
                        freetext: false
                    },
                    formatter: function(cell) {
                        return getDddwLabel('pg_cd', cell.getValue());
                    },
                    cellClick: typeof aamsCellEdit !== 'undefined' ? aamsCellEdit : undefined,
                    cellEdited: function(cell) {
                        const row = cell.getRow();
                        const data = row.getData();
                        if (!data.isNew) row.update({ rowStatus: "U" });
                    }
                },
                {
                    title: "매수계좌 LIST",
                    field: "fundList",
                    minWidth: 200,
                    hozAlign: "left",
                    headerHozAlign: "center"
                }
            ];

            function initGrids() {
                const masterEl = pane ? pane.querySelector("#scm1pg-master-grid") : document.getElementById("scm1pg-master-grid");
                const detailEl = pane ? pane.querySelector("#scm1pg-detail-grid") : document.getElementById("scm1pg-detail-grid");
                if (!masterEl || !detailEl) return;

                gridMaster = new Tabulator(masterEl, {
                    data: [],
                    layout: "fitColumns",
                    columns: masterColumns,
                    height: "100%",
                    placeholder: "조회된 채권 종목 데이터가 없습니다.",
                    selectableRows: 1
                });

                gridDetail = new Tabulator(detailEl, {
                    data: [],
                    layout: "fitColumns",
                    columns: detailColumns,
                    height: "100%",
                    placeholder: "선택된 채권의 등급 내역이 없습니다.",
                    selectableRows: 1
                });

                // Rule 8: Triple Fallback & Master-Detail Standard Contract
                // ① setupTabulatorRowSelection 전역 헬퍼 연결
                if (typeof setupTabulatorRowSelection === 'function') {
                    setupTabulatorRowSelection(gridMaster, function(row, data) {
                        syncDetail(row, data);
                    });
                    setupTabulatorRowSelection(gridDetail);
                }

                // ② rowClick 안전망
                gridMaster.on("rowClick", function(e, row) {
                    syncDetail(row, row ? row.getData() : null);
                });

                // ③ rowSelectionChanged 안전망
                gridMaster.on("rowSelectionChanged", function(data, rows) {
                    if (rows && rows.length > 0) {
                        syncDetail(rows[0], rows[0].getData());
                    }
                });

                // Rule 15: Select first row on data loaded
                gridMaster.on("dataLoaded", function() {
                    const rows = gridMaster.getRows();
                    const countEl = pane ? pane.querySelector("#master-count") : document.getElementById("master-count");
                    if (countEl) countEl.innerText = `${rows.length}건`;

                    if (rows && rows.length > 0) {
                        rows[0].select();
                        syncDetail(rows[0], rows[0].getData());
                    } else {
                        clearDetail();
                    }
                });

                gridDetail.on("dataLoaded", function() {
                    const rows = gridDetail.getRows();
                    const countEl = pane ? pane.querySelector("#detail-count") : document.getElementById("detail-count");
                    if (countEl) countEl.innerText = `${rows.length}건`;
                });

                // Filter search keyword event
                const kwInput = pane ? pane.querySelector("#filterMasterKeyword") : document.getElementById("filterMasterKeyword");
                if (kwInput) {
                    kwInput.addEventListener("input", function() {
                        const kw = this.value.trim().toLowerCase();
                        if (!kw) {
                            gridMaster.setData(masterAllData);
                            return;
                        }
                        const filtered = masterAllData.filter(d => {
                            const cd = (d.jmCd || "").toLowerCase();
                            const nm = (d.cjNm || "").toLowerCase();
                            return cd.includes(kw) || nm.includes(kw);
                        });
                        gridMaster.setData(filtered);
                    });
                }

                // Date filter change
                const ymdInput = pane ? pane.querySelector("#filterYmd") : document.getElementById("filterYmd");
                if (ymdInput) {
                    ymdInput.addEventListener("change", function() {
                        lastLoadedMasterKey = null;
                        loadMaster();
                    });
                }

                // Attach sub button events in detail section header
                bindSubButtons();
            }

            function bindSubButtons() {
                const btnRefresh = pane ? pane.querySelector("#btnDetailRefresh") : document.getElementById("btnDetailRefresh");
                if (btnRefresh) {
                    btnRefresh.addEventListener("click", function() {
                        if (currentSelectedMaster && currentSelectedMaster.jmCd) {
                            loadDetail(currentSelectedMaster.jmCd);
                        }
                    });
                }

                const btnAdd = pane ? pane.querySelector("#btnDetailAdd") : document.getElementById("btnDetailAdd");
                if (btnAdd) {
                    btnAdd.addEventListener("click", doInput);
                }

                const btnDel = pane ? pane.querySelector("#btnDetailDel") : document.getElementById("btnDetailDel");
                if (btnDel) {
                    btnDel.addEventListener("click", doDelete);
                }

                const btnSave = pane ? pane.querySelector("#btnDetailSave") : document.getElementById("btnDetailSave");
                if (btnSave) {
                    btnSave.addEventListener("click", doSave);
                }

                const btnExcel = pane ? pane.querySelector("#btnDetailExcel") : document.getElementById("btnDetailExcel");
                if (btnExcel) {
                    btnExcel.addEventListener("click", function() {
                        if (gridDetail) {
                            gridDetail.download("xlsx", `채권등급_${currentSelectedMaster ? currentSelectedMaster.jmCd : ''}.xlsx`);
                        }
                    });
                }
            }

            function syncDetail(row, masterRowData) {
                if (!row) return;
                if (!row.isSelected || !row.isSelected()) {
                    row.select();
                }
                const data = masterRowData || (row.getData ? row.getData() : null);
                if (!data) return;

                const corpGr = resolveCorpGr();
                const currentKey = (corpGr || "") + "_" + (data.jmCd || "");
                if (lastLoadedMasterKey === currentKey) return;
                lastLoadedMasterKey = currentKey;
                currentSelectedMaster = data;

                const labelEl = pane ? pane.querySelector("#selected-jm-name") : document.getElementById("selected-jm-name");
                if (labelEl) {
                    labelEl.innerText = `${data.cjNm || data.jmCd || ''} (${data.jmCd || ''})`;
                }

                loadDetail(data.jmCd);
            }

            function clearDetail() {
                lastLoadedMasterKey = null;
                currentSelectedMaster = null;
                deletedDetailList = [];
                if (gridDetail) gridDetail.setData([]);
                const labelEl = pane ? pane.querySelector("#selected-jm-name") : document.getElementById("selected-jm-name");
                if (labelEl) labelEl.innerText = "선택된 종목 없음";
                const countEl = pane ? pane.querySelector("#detail-count") : document.getElementById("detail-count");
                if (countEl) countEl.innerText = "0건";
            }

            function loadMaster() {
                const corpGr = resolveCorpGr();
                const ymd = getFilterYmd();
                if (!corpGr) {
                    alert("소속그룹을 선택해 주세요.");
                    return;
                }
                if (!ymd) {
                    alert("적용기준일을 선택해 주세요.");
                    return;
                }

                clearDetail();
                const url = `/api/daily/scm1pg/master?corpGr=${encodeURIComponent(corpGr)}&ymd=${encodeURIComponent(ymd)}`;
                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        masterAllData = data || [];
                        if (gridMaster) {
                            gridMaster.setData(masterAllData);
                        }
                    })
                    .catch(err => {
                        console.error("Error fetching scm1pg master:", err);
                        alert("조회 중 오류가 발생했습니다.");
                    });
            }

            function loadDetail(jmCd) {
                if (!jmCd) return;
                const corpGr = resolveCorpGr();
                deletedDetailList = [];

                const url = `/api/daily/scm1pg/detail?corpGr=${encodeURIComponent(corpGr)}&jmCd=${encodeURIComponent(jmCd)}`;
                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        if (gridDetail) {
                            gridDetail.setData(data || []);
                        }
                    })
                    .catch(err => {
                        console.error("Error fetching scm1pg detail:", err);
                    });
            }

            function doInput() {
                if (!currentSelectedMaster || !currentSelectedMaster.jmCd) {
                    alert("상세 등급을 추가할 채권 종목을 먼저 선택해 주세요.");
                    return;
                }
                if (!gridDetail) return;

                const corpGr = resolveCorpGr();
                const ymd = getFilterYmd();
                const newRow = {
                    fseq: gridDetail.getData().length + 1,
                    corpGr: corpGr,
                    jmCd: currentSelectedMaster.jmCd,
                    ymd: ymd,
                    pgCd: "",
                    week: "",
                    fundList: "",
                    isNew: true,
                    rowStatus: "C"
                };
                gridDetail.addRow(newRow, true).then(function(row) {
                    row.select();
                });
            }

            function doDelete() {
                if (!gridDetail) return;
                const selectedRows = gridDetail.getSelectedRows();
                if (!selectedRows || selectedRows.length === 0) {
                    alert("삭제할 등급 행을 선택하세요.");
                    return;
                }

                const row = selectedRows[0];
                const rowData = row.getData();
                if (!confirm(`[${rowData.ymd || '신규'}] 등급 데이터를 삭제하시겠습니까?`)) {
                    return;
                }

                if (!rowData.isNew && rowData.ymd) {
                    deletedDetailList.push(rowData);
                }
                row.delete();
            }

            function doSave() {
                if (!currentSelectedMaster || !currentSelectedMaster.jmCd) {
                    alert("저장할 대상 종목이 없습니다.");
                    return;
                }
                if (!gridDetail) return;

                const allData = gridDetail.getData();
                const corpGr = resolveCorpGr();

                const createdRows = allData.filter(d => d.isNew || d.rowStatus === "C");
                const updatedRows = allData.filter(d => !d.isNew && d.rowStatus === "U");

                if (createdRows.length === 0 && updatedRows.length === 0 && deletedDetailList.length === 0) {
                    alert("저장할 변경 내용이 없습니다.");
                    return;
                }

                if (!confirm("변경 사항을 저장하시겠습니까?")) return;

                const payload = {
                    corpGr: corpGr,
                    jmCd: currentSelectedMaster.jmCd,
                    createdRows: createdRows,
                    updatedRows: updatedRows,
                    deletedRows: deletedDetailList
                };

                fetch("/api/daily/scm1pg/save", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                })
                .then(res => res.json())
                .then(res => {
                    if (res.success) {
                        alert(res.message || "저장되었습니다.");
                        loadDetail(currentSelectedMaster.jmCd);
                    } else {
                        alert(res.message || "저장에 실패했습니다.");
                    }
                })
                .catch(err => {
                    console.error("Save error:", err);
                    alert("저장 중 오류가 발생했습니다.");
                });
            }

            // Toolbar Button Binding (Rule 9)
            if (pane) {
                pane.onSearch = loadMaster;
                pane.onInput = doInput;
                pane.onSave = doSave;
                pane.onDelete = doDelete;
                pane.onExcel = function() {
                    if (gridDetail) gridDetail.download("xlsx", `채권등급_${currentSelectedMaster ? currentSelectedMaster.jmCd : ''}.xlsx`);
                };
                // 공통버튼 지침: 새로고침은 조회 전 초기화 상태로 되돌린다.
                pane.onRefresh = function() {
                    if (gridMaster) gridMaster.clearData();
                    if (gridDetail) gridDetail.clearData();
                    currentSelectedMaster = null;
                    lastLoadedMasterKey = null;
                    const ymdInput = pane ? pane.querySelector("#filterYmd") : document.getElementById("filterYmd");
                    if (ymdInput) {
                        const today = new Date();
                        const yyyy = today.getFullYear();
                        const mm = String(today.getMonth() + 1).padStart(2, '0');
                        const dd = String(today.getDate()).padStart(2, '0');
                        ymdInput.value = `${yyyy}-${mm}-${dd}`;
                    }
                    const detailDesc = pane ? pane.querySelector("#selected-jm-desc") : document.getElementById("selected-jm-desc");
                    if (detailDesc) detailDesc.innerText = "채권 종목을 선택하세요";
                    if (typeof showToast === "function") showToast("화면이 초기화되었습니다.", "info");
                };
                pane.onCorpGrChange = function(newCorpGr) {
                    if (gridMaster) gridMaster.clearData();
                    if (gridDetail) gridDetail.clearData();
                    retrieveDddw();
                    loadMaster();
                };
            }

            // Initialization logic (Rule 11: startInit pattern)
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                initGrids();
                retrieveDddw();

                // AamsCalendar 초기화
                if (typeof AamsCalendar !== 'undefined' && typeof AamsCalendar.initSimple === 'function') {
                    AamsCalendar.initSimple('filterYmd', { pane: pane });
                }

                // eb_direct_retrieve = true 명세 반영 자동 조회
                setTimeout(() => {
                    loadMaster();
                }, 100);
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", startInit);
            } else {
                startInit();
            }
        })();
    </script>
</div>
</html>

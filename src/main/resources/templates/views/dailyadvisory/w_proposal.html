<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-split proposal-container layout-mobile-stack-container" th:fragment="proposalView">

    <style>

        .proposal-container .proposal-left-split {
            height: 100%;
            min-height: 0;
            padding: 0;
            background: transparent;
        }

        .proposal-container .proposal-left-split > .pane-top {
            flex-basis: calc(66% - 3px);
            min-height: 180px;
            border-radius: 0;
            box-shadow: none;
        }

        .proposal-container .proposal-left-split > .pane-bottom {
            min-height: 120px;
            border-radius: 0;
            box-shadow: none;
        }

        .proposal-container .quick-comment-textarea,
        .proposal-container .proposal-right-pane .proposal-textarea {
            width: 100%;
            resize: none;
            border: 0;
            padding: 8px 10px;
            box-sizing: border-box;
            font: inherit;
            font-size: 12px;
            line-height: 1.5;
            color: #0f172a;
            outline: none;
        }

        .proposal-container .quick-comment-textarea {
            flex: 1;
        }

        .proposal-container .proposal-right-pane .right-section {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
        }

        @media (min-width: 877px) {
            .proposal-container .proposal-right-pane .matter-section {
                flex: 1.1;
                min-height: 120px;
            }

            .proposal-container .proposal-right-pane .content-section {
                flex: 0.9;
                min-height: 100px;
            }

            .proposal-container .proposal-right-pane .comment-section {
                flex: 1.3;
                min-height: 150px;
            }
        }

        /* Section Headers */
        .proposal-container .proposal-right-pane .section-header-bar {
            padding: 4px 8px;
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .proposal-container .proposal-right-pane .header-help-text {
            font-size: 11px;
            color: #2563eb;
            font-weight: 600;
        }

        .proposal-container .proposal-right-pane .header-help-text .kbd {
            background-color: #dbeafe;
            color: #1e40af;
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 10.5px;
            font-weight: 700;
        }

        .proposal-container .proposal-right-pane .header-title {
            font-size: 12px;
            font-weight: 700;
            color: #1e293b;
        }

        .proposal-container .proposal-right-pane .proposal-textarea {
            flex: 1;
            background-color: #ffffff;
        }

        .proposal-container .comment-grid-header {
            padding: 4px 8px;
            background-color: #f1f5f9;
            border-bottom: 1px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 32px;
            box-sizing: border-box;
        }

        .proposal-container .comment-grid-header .grid-title {
            font-size: 12px;
            font-weight: 700;
            color: #0f172a;
        }

    </style>

    <!-- Top Action Control Bar (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <!-- Reusable Common Toolbar Buttons Fragment (닫기 ~ 엑셀) -->
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <!-- Reusable Common Breadcrumb Fragment -->
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <div class="proposal-filter-bar">
        <div class="filter-bar">
            <div class="filter-left">
                <div th:replace="~{fragments/filter/corp_filter :: corpFilter(dddwId='CORP_GR', seq=1,label ='자산운용(자문)사')}"></div>
            </div>
        </div>
    </div>

    <!-- Main Left/Right Split Layout Container -->
    <div class="layout-split-h split-body proposal-main-content layout-mobile-stack" data-split-key="W_PROPOSAL" data-default-ratio="46:54">

        <!-- LEFT COLUMN: Master Grid + Quick Comment -->
        <div class="pane-left proposal-left-pane master-section aams-nested-pane-host">
            <div class="layout-split-v proposal-left-split" data-split-key="W_PROPOSAL_LEFT" data-default-ratio="66:34">
                <div class="pane-top aams-grid-frame-owner">
                    <div class="master-grid-wrapper">
                        <div id="master-grid" class="tabulator-aams-grid"></div>
                    </div>
                </div>
                <div class="split-gutter-v"></div>
                <div class="pane-bottom">
                    <textarea id="proposalQuickComment" class="quick-comment-textarea" placeholder="기타 의견이나 전달사항이 있으면 입력하십시오.&#10;입력 완료 후 Enter를 치면 댓글로 등록됩니다."></textarea>
                </div>
            </div>
        </div>

        <div class="split-gutter-h"></div>

        <!-- RIGHT COLUMN: Matter Text + Content Text + Comment Grid -->
        <div class="pane-right proposal-right-pane detail-section multi-stack-pane">

            <!-- Top Right Section: 개발 의뢰내용 (Matter) -->
            <div class="right-section matter-section">
                <div class="section-header-bar">
                    <span class="header-help-text">머리글 수준 <span class="kbd">Ctrl</span> 증가[->], 감소[<-], 모양변경(최근사용분부터) <span class="kbd">Ctrl</span> [Home, ↑]/[↓, End] 선택줄이동-SPACE</span>
                </div>
                <textarea id="proposalMatter" class="proposal-textarea" placeholder="개발 의뢰 내용을 입력하십시오."></textarea>
            </div>

            <!-- Middle Right Section: 처리 내용 (Content) -->
            <div class="right-section content-section">
                <div class="section-header-bar">
                    <span class="header-title">※ 수정완료</span>
                </div>
                <textarea id="proposalContent" class="proposal-textarea" placeholder="처리 내역을 입력하십시오."></textarea>
            </div>

            <!-- Bottom Right Section: 댓글현황 (Comment Grid) -->
            <div class="right-section comment-section">
                <div class="comment-grid-header">
                    <span class="grid-title">■ 댓글현황</span>
                    <div th:replace="~{fragments/grid/detail_nav :: detailNav(targetGrid='#grid-proposal-comment', fileName='댓글현황', buttons='0010011001')}"></div>
                </div>
                <div class="grid-table-wrapper">
                    <div id="grid-proposal-comment" class="tabulator-aams-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Inline Script for Proposal View with Tabulator Grids -->
    <script th:inline="javascript">
        (function() {
            let gridMaster = null;
            let gridComment = null;
            let cudManagerMaster = null;
            let cudManagerComment = null;

            // 데이터는 eb_direct_retrieve REST API(loadProposalMaster)로만 비동기 로드
            const initialMasterData = [];

            function resolveCurrentUserNm() {
                // 1. Server-injected model attribute
                let u = /*[[${userNm}]]*/ "";
                if (u && String(u).trim()) return String(u).trim();

                // 2. Cookie values (userNm, userName, user_nm)
                const cVal = getCookieVal("userNm") || getCookieVal("userName") || getCookieVal("user_nm");
                if (cVal && String(cVal).trim()) {
                    try {
                        return decodeURIComponent(cVal).trim();
                    } catch(e) {
                        return String(cVal).trim();
                    }
                }

                // 3. LocalStorage userNm
                try {
                    const lsUserNm = localStorage.getItem("userNm");
                    if (lsUserNm && lsUserNm.trim()) return lsUserNm.trim();
                } catch(e) {}

                // 4. Fallback to DOM top header user name element (e.g. "김태현 님")
                const userEl = document.querySelector(".user-info .user-name");
                if (userEl && userEl.textContent) {
                    const txt = userEl.textContent.replace(/님|\s+/g, "").trim();
                    if (txt) return txt;
                }

                return getCookieVal("userId") || "";
            }

            function isCurrentUserProposer(cellOrRow) {
                if (!cellOrRow) return false;
                const row = (typeof cellOrRow.getRow === 'function') ? cellOrRow.getRow() : cellOrRow;
                const data = (typeof row.getData === 'function') ? row.getData() : row;
                if (!data) return false;
                if (data.isNew) return true;
                const currentNm = resolveCurrentUserNm();
                const proposer = (data.proposer || '').trim();
                return Boolean(currentNm && proposer && (currentNm === proposer || proposer.includes(currentNm) || currentNm.includes(proposer)));
            }

            // Master grid title conditional edit check (Only allows edit if current user is proposer or new row)
            function isProposalEditable(cell) {
                if (!cell) return false;
                return isCurrentUserProposer(cell);
            }

            // Comment grid appending conditional edit check (Only author or new row)
            function isCommentEditable(cell) {
                if (!cell) return false;
                const row = typeof cell.getRow === 'function' ? cell.getRow() : null;
                if (!row) return false;
                const data = row.getData();
                if (!data) return false;

                const currentNm = resolveCurrentUserNm();
                return Boolean(data.isNew || !data.sbNm || !currentNm || data.sbNm === currentNm);
            }

            // formatDateVal은 common.js 전역 함수 사용


            // 1. Initialize Master Tabulator Grid (d_proposal_list / PROPOSAL)
            function initMasterGrid() {
                const container = pane ? pane.querySelector("#master-grid") : document.getElementById("master-grid");
                if (!container) return;

                gridMaster = new Tabulator(container, {
                    data: initialMasterData || [],
                    layout: "fitDataFill",
                    height: "100%",
                    selectableRows: 1,
                    selectableRowsRollingSelection: false,
                    editTriggerEvent: "click",
                    placeholder: "<span>조회된 건의사항/개선요청 내역이 없습니다.</span>",
                    columnDefaults: { vertAlign: "middle", headerSortTristate: true },
                    columns: [
                        { title: "No.", headerSort: false, formatter: "rownum", hozAlign: "center", width: 40, resizable: false, widthGrow: 0 },
                        { title: "의뢰일시", field: "ymd", hozAlign: "center", width: 125, formatter: cell => formatDateVal(cell.getValue()) },
                        { 
                            title: "개발 의뢰내용", 
                            field: "title", 
                            hozAlign: "left", 
                            minWidth: 200, 
                            editor: "input",
                            editable: isProposalEditable,
                            cellClick: aamsCellEdit
                        },
                        { 
                            title: "의뢰자", 
                            field: "proposer", 
                            hozAlign: "center", 
                            width: 80,
                            formatter: cell => {
                                let val = cell.getValue();
                                if (val == null || String(val).trim() === "") {
                                    val = resolveCurrentUserNm();
                                }
                                return `<span class="cell-text-blue">${val || ''}</span>`;
                            }
                        },
                        { title: "완료일시", field: "contentYmd", hozAlign: "center", width: 125, formatter: cell => formatDateVal(cell.getValue()) },
                        { 
                            title: "첨부파일", 
                            field: "fexp", 
                            hozAlign: "center", 
                            width: 75, 
                            formatter: function(cell) {
                                const val = cell.getValue();
                                if (!val || val === '-') return '';
                                const ext = String(val).toUpperCase();
                                if (ext === 'PNG' || ext === 'JPG' || ext === 'GIF') {
                                    return `<span class="file-badge badge-img"><i class="fa-solid fa-file-image"></i> ${ext}</span>`;
                                } else if (ext === 'XLSX' || ext === 'XLS' || ext === 'CSV') {
                                    return `<span class="file-badge badge-excel"><i class="fa-solid fa-file-excel"></i> ${ext}</span>`;
                                } else {
                                    return `<span class="file-badge badge-file"><i class="fa-solid fa-folder-open"></i> ${ext}</span>`;
                                }
                            }
                        }
                    ]
                });

                // 1. AAMS Standard: Register global row selection callback (표준 2대 정책에 따라 첫 행 자동 선택)
                setupTabulatorRowSelection(gridMaster, function(row, data) {
                    updateDetailPanel(data);
                }, { keyField: 'ymd' });

                cudManagerMaster = AamsCudManager.create(gridMaster, {
                    allowedFields: ['matter', 'content', 'orgFname']
                });

                // 2. Tabulator standard rowClick fallback
                gridMaster.on("rowClick", function(e, row) {
                    const data = row ? row.getData() : null;
                    if (data) updateDetailPanel(data);
                });

                // 3. Tabulator rowSelectionChanged fallback
                gridMaster.on("rowSelectionChanged", function(data, rows) {
                    if (rows && rows.length > 0) {
                        updateDetailPanel(rows[0].getData());
                    }
                });
            }

            // 2. Initialize Comment Grid (d_proposal_2 / PROPOSAL_APPEND)
            function initCommentGrid() {
                const container = pane ? pane.querySelector("#grid-proposal-comment") : document.getElementById("grid-proposal-comment");
                if (!container) return;

                gridComment = new Tabulator(container, {
                    layout: "fitDataFill",
                    height: "100%",
                    selectableRows: 1,
                    selectableRowsRollingSelection: false,
                    editTriggerEvent: "click",
                    placeholder: "<span>선택된 의뢰건에 등록된 댓글이 없습니다.</span>",
                    columnDefaults: { vertAlign: "middle", headerSortTristate: true },
                    columns: [
                        { title: "No.", headerSort: false, formatter: "rownum", hozAlign: "center", width: 40, resizable: false, widthGrow: 0 },
                        { title: "댓글입력일시", field: "ymd", hozAlign: "center", width: 135, formatter: cell => formatDateVal(cell.getValue()) },
                        { 
                            title: "입력자", 
                            field: "sbNm", 
                            hozAlign: "left", 
                            width: 85,
                            formatter: cell => {
                                const row = cell.getRow().getData();
                                if (row && row.color === 16711680) {
                                    return `<span class="cell-text-blue">${cell.getValue() || ''}</span>`;
                                }
                                return cell.getValue() || '';
                            }
                        },
                        { 
                            title: "댓  글  내  용", 
                            field: "appending", 
                            hozAlign: "left", 
                            minWidth: 200, 
                            editor: "input",
                            editable: isCommentEditable,
                            cellClick: aamsCellEdit,
                            formatter: cell => {
                                const row = cell.getRow().getData();
                                if (row && row.color === 16711680) {
                                    return `<span class="cell-text-blue">${cell.getValue() || ''}</span>`;
                                }
                                return cell.getValue() || '';
                            }
                        }
                    ]
                });

                cudManagerComment = AamsCudManager.create(gridComment, {
                    allowedFields: ['pYmd', 'pProposer']
                });

                if (typeof setupTabulatorRowSelection === "function") {
                    setupTabulatorRowSelection(gridComment);
                }
            }

            function resetDetailPanel() {
                updateDetailPanel(null);
                lastLoadedProposalKey = null;
            }

            function updateDetailPanel(data) {
                const matterEl = pane ? pane.querySelector("#proposalMatter") : document.getElementById("proposalMatter");
                const contentEl = pane ? pane.querySelector("#proposalContent") : document.getElementById("proposalContent");

                if (!data) {
                    if (matterEl) matterEl.value = "";
                    if (contentEl) contentEl.value = "";
                    if (gridComment) gridComment.setData([]);
                    return;
                }

                if (matterEl) {
                    matterEl.value = data.matter || "";
                    const canEditMatter = isCurrentUserProposer(data);
                    matterEl.readOnly = !canEditMatter;
                    matterEl.style.backgroundColor = canEditMatter ? "#ffffff" : "#f8fafc";
                }
                if (contentEl) contentEl.value = data.content || "";

                const filterSelect = pane ? pane.querySelector('select[name="corpGr"]') : document.getElementById("filterCorpGr");
                const corpGr = data.corpGr || (filterSelect && filterSelect.value ? filterSelect.value : (getCookieVal("savedCorpGr") || getCookieVal("corpGr")));

                if (corpGr && data.ymd && data.proposer) {
                    fetchProposalComments(corpGr, data.ymd, data.proposer);
                } else {
                    if (gridComment) gridComment.setData([]);
                }
            }

            // Capture script element and tab pane scope at TOP LEVEL during synchronous parsing
            const currentScript = document.currentScript;
            const pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;

            // getCookieVal 및 resolveCorpGr은 common.js 전역 함수 사용
            window.loadProposalMaster = function(targetCorpGr) {
                lastLoadedProposalKey = null;
                const corpGr = (targetCorpGr != null && String(targetCorpGr).trim() !== "")
                    ? targetCorpGr 
                    : resolveCorpGr(pane);

                // Reset detail panels
                resetDetailPanel();
                if (cudManagerMaster) cudManagerMaster.reset();
                if (cudManagerComment) cudManagerComment.reset();
                
                fetch(`/api/proposal/master?corpGr=${encodeURIComponent(corpGr)}`)
                    .then(res => res.json())
                    .then(data => {
                        const list = Array.isArray(data) ? data : [];
                        const formatted = cudManagerMaster ? cudManagerMaster.formatData(list) : list;
                        if (gridMaster) {
                            gridMaster.setData(formatted).then(function() {
                                if (list.length > 0) {
                                    setTimeout(() => {
                                        const rows = gridMaster.getRows();
                                        if (rows && rows.length > 0) {
                                            const firstRow = rows[0];
                                            if (typeof firstRow.select === 'function') {
                                                firstRow.select();
                                            }
                                            updateDetailPanel(firstRow.getData());
                                        }
                                    }, 80);
                                } else {
                                    resetDetailPanel();
                                }
                                // 전체 뷰 스크롤 위치 최상단 유지 (컨테이너 및 부모 tab-pane 모두 0으로 리셋)
                                if (pane && typeof pane.scrollTop === 'number') {
                                    pane.scrollTop = 0;
                                }
                                const tabPane = pane ? pane.closest('.tab-pane') : null;
                                if (tabPane && typeof tabPane.scrollTop === 'number') {
                                    tabPane.scrollTop = 0;
                                }
                            });
                        }
                    })
                    .catch(err => console.error("Failed to load proposal master:", err));
            };

            let lastLoadedProposalKey = null;
            function fetchProposalComments(corpGr, ymd, proposer) {
                const key = `${corpGr}_${ymd}_${proposer}`;
                if (lastLoadedProposalKey === key) return;
                lastLoadedProposalKey = key;
                if (cudManagerComment) cudManagerComment.reset();

                let url = `/api/proposal/comment?corpGr=${encodeURIComponent(corpGr)}`;
                if (ymd) url += `&ymd=${encodeURIComponent(ymd)}`;
                if (proposer) url += `&proposer=${encodeURIComponent(proposer)}`;

                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        if (gridComment) {
                            const formatted = cudManagerComment ? cudManagerComment.formatData(data || []) : (data || []);
                            gridComment.setData(formatted);
                            setTimeout(() => {
                                gridComment.redraw(true);
                            }, 50);
                        }
                    })
                    .catch(err => console.error("Failed to load proposal comments:", err));
            }

            // Register standard contracts on current tab pane (Guideline 8)
            if (pane) {
                pane.onSearch = function() { window.loadProposalMaster(); };
                pane.onRetrieve = function() { window.loadProposalMaster(); };
                pane.onCorpGrChange = function(val) {
                    lastLoadedProposalKey = null;
                };
                pane.addEventListener("corpGrChanged", function(e) {
                    lastLoadedProposalKey = null;
                });

                // Provide default initial data when [입력] toolbar button is clicked
                pane.getNewRowData = function() {
                    const now = new Date();
                    const pad = n => String(n).padStart(2, '0');
                    const nowYmd = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
                    const userNm = resolveCurrentUserNm();
                    const filterSelect = pane ? pane.querySelector('select[name="corpGr"]') : document.getElementById("filterCorpGr");
                    const corpGr = filterSelect ? filterSelect.value : (getCookieVal("savedCorpGr") || getCookieVal("corpGr") || "");

                    return {
                        corpGr: corpGr,
                        ymd: nowYmd,
                        proposer: userNm,
                        title: "",
                        matter: "",
                        contentYmd: "",
                        content: "",
                        fexp: "",
                        saveVisible: 1,
                        isNew: true
                    };
                };

                pane.addEventListener("masterRowInserted", function(e) {
                    if (e.detail && e.detail.data) {
                        updateDetailPanel(e.detail.data);
                    }
                });
            }

            // Sync Matter / Content textarea inputs to selected row in gridMaster
            const matterEl = document.getElementById("proposalMatter");
            if (matterEl) {
                matterEl.addEventListener("input", function() {
                    if (gridMaster) {
                        const selectedRows = gridMaster.getSelectedRows();
                        if (selectedRows && selectedRows.length > 0) {
                            selectedRows[0].update({ matter: matterEl.value, isUpdated: true });
                            if (cudManagerMaster) {
                                cudManagerMaster.trackChange(selectedRows[0]);
                            }
                        }
                    }
                });
            }

            const contentEl = document.getElementById("proposalContent");
            if (contentEl) {
                contentEl.addEventListener("input", function() {
                    if (gridMaster) {
                        const selectedRows = gridMaster.getSelectedRows();
                        if (selectedRows && selectedRows.length > 0) {
                            selectedRows[0].update({ content: contentEl.value, isUpdated: true });
                            if (cudManagerMaster) {
                                cudManagerMaster.trackChange(selectedRows[0]);
                            }
                        }
                    }
                });
            }

            function addQuickComment(appending) {
                if (!gridMaster || !gridComment || !cudManagerComment) return Promise.resolve(null);

                const selectedMaster = gridMaster.getSelectedRows();
                if (!selectedMaster || selectedMaster.length === 0) {
                    if (typeof showToast === "function") showToast("댓글을 추가할 의뢰 건을 먼저 선택해주세요.", "warning");
                    return Promise.resolve(null);
                }

                const masterData = selectedMaster[0].getData();
                const now = new Date();
                const pad = n => String(n).padStart(2, '0');
                const nowYmd = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

                return cudManagerComment.addRow({
                    corpGr: masterData.corpGr,
                    pYmd: masterData.ymd,
                    pProposer: masterData.proposer,
                    ymd: nowYmd,
                    sbNm: resolveCurrentUserNm(),
                    appending: appending || "",
                    color: 16711680,
                    isNew: true
                }, false);
            }

            function initQuickCommentInput() {
                const input = pane ? pane.querySelector("#proposalQuickComment") : document.getElementById("proposalQuickComment");
                if (!input) return;

                input.addEventListener("keydown", function(e) {
                    if (e.key !== "Enter" || e.shiftKey || e.isComposing) return;
                    e.preventDefault();

                    const appending = input.value.trim();
                    if (!appending) return;

                    addQuickComment(appending).then(function(row) {
                        if (!row) return;
                        input.value = "";
                        gridComment.deselectRow();
                        row.select();
                        row.scrollTo();
                    });
                });
            }

            function initCommentTools() {
                const btnAdd = pane ? pane.querySelector("#btnAddComment") : document.getElementById("btnAddComment");
                const btnDel = pane ? pane.querySelector("#btnDeleteComment") : document.getElementById("btnDeleteComment");
                const btnPrev = pane ? pane.querySelector("#btnPrevComment") : document.getElementById("btnPrevComment");
                const btnNext = pane ? pane.querySelector("#btnNextComment") : document.getElementById("btnNextComment");

                if (btnAdd) {
                    btnAdd.onclick = function() {
                        if (!gridMaster || !gridComment) return;
                        const selectedMaster = gridMaster.getSelectedRows();
                        if (!selectedMaster || selectedMaster.length === 0) {
                            if (typeof showToast === "function") showToast("댓글을 추가할 의뢰 건을 먼저 선택해주세요.", "warning");
                            return;
                        }
                        const masterData = selectedMaster[0].getData();

                        const now = new Date();
                        const pad = n => String(n).padStart(2, '0');
                        const nowYmd = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
                        const currentUser = resolveCurrentUserNm();

                        const newRowData = {
                            corpGr: masterData.corpGr,
                            pYmd: masterData.ymd,
                            pProposer: masterData.proposer,
                            ymd: nowYmd,
                            sbNm: currentUser,
                            appending: "",
                            color: 16711680,
                            isNew: true
                        };

                        if (cudManagerComment) {
                            cudManagerComment.addRow(newRowData, false).then(function(newRow) {
                                gridComment.deselectRow();
                                newRow.select();
                                newRow.scrollTo();
                                setTimeout(() => {
                                    const cell = newRow.getCell("appending");
                                    if (cell) cell.edit(true);
                                }, 50);
                            });
                        }
                    };
                }

                if (btnDel) {
                    btnDel.onclick = function() {
                        if (!gridComment) return;
                        const selectedRows = gridComment.getSelectedRows();
                        if (!selectedRows || selectedRows.length === 0) {
                            if (typeof showToast === "function") showToast("삭제할 댓글을 먼저 선택해주세요.", "warning");
                            return;
                        }

                        const rowData = selectedRows[0].getData();
                        const currentNm = resolveCurrentUserNm();
                        if (!rowData.isNew && rowData.sbNm && currentNm && rowData.sbNm !== currentNm) {
                            if (typeof showToast === "function") showToast("본인이 작성한 댓글만 삭제할 수 있습니다.", "warning");
                            return;
                        }

                        if (confirm("선택한 댓글을 삭제하시겠습니까?")) {
                            if (cudManagerComment) {
                                cudManagerComment.deleteRow(selectedRows[0]);
                            } else {
                                selectedRows[0].delete();
                            }
                            if (typeof showToast === "function") showToast("댓글이 삭제되었습니다. 저장 버튼을 누르면 최종 반영됩니다.", "info");
                        }
                    };
                }

                if (btnPrev) {
                    btnPrev.onclick = function() {
                        if (!gridComment) return;
                        const selectedRows = gridComment.getSelectedRows();
                        if (!selectedRows || selectedRows.length === 0) {
                            const allRows = gridComment.getRows();
                            if (allRows.length > 0) {
                                allRows[0].select();
                                allRows[0].scrollTo();
                            }
                            return;
                        }
                        const prev = selectedRows[0].getPrevRow();
                        if (prev) {
                            gridComment.deselectRow();
                            prev.select();
                            prev.scrollTo();
                        }
                    };
                }

                if (btnNext) {
                    btnNext.onclick = function() {
                        if (!gridComment) return;
                        const selectedRows = gridComment.getSelectedRows();
                        if (!selectedRows || selectedRows.length === 0) {
                            const allRows = gridComment.getRows();
                            if (allRows.length > 0) {
                                allRows[0].select();
                                allRows[0].scrollTo();
                            }
                            return;
                        }
                        const next = selectedRows[0].getNextRow();
                        if (next) {
                            gridComment.deselectRow();
                            next.select();
                            next.scrollTo();
                        }
                    };
                }
            }

            // Register standard toolbar & CorpGr contracts (Guideline 8, 9)
            if (pane) {
                pane.onSearch = function() { loadProposalMaster(); };
                pane.onRetrieve = function() { loadProposalMaster(); };
                // 공통버튼 지침: 새로고침은 조회 전 초기화 상태로 되돌린다.
                pane.onRefresh = function() {
                    if (gridMaster) gridMaster.clearData();
                    if (gridComment) gridComment.clearData();
                    if (cudManagerMaster) cudManagerMaster.reset();
                    if (cudManagerComment) cudManagerComment.reset();
                    resetDetailPanel();
                    if (typeof showToast === "function") showToast("화면이 초기화되었습니다.", "info");
                };
                pane.onCorpGrChange = function(val) {
                    lastLoadedProposalKey = null;
                };
                pane.addEventListener("corpGrChanged", function(e) {
                    lastLoadedProposalKey = null;
                });

                // [입력] 버튼 핸들러
                pane.onInput = function() {
                    if (!gridMaster) return;
                    const now = new Date();
                    const pad = n => String(n).padStart(2, '0');
                    const nowYmd = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
                    const currentUser = resolveCurrentUserNm();
                    const filterSelect = pane ? pane.querySelector('select[name="corpGr"]') : document.getElementById("filterCorpGr");
                    const corpGr = filterSelect && filterSelect.value ? filterSelect.value : (getCookieVal("savedCorpGr") || getCookieVal("corpGr") || "");

                    const newRow = {
                        corpGr: corpGr,
                        isNew: true,
                        isUpdated: false,
                        ymd: nowYmd,
                        proposer: currentUser,
                        title: "",
                        matter: "",
                        content: "",
                        contentYmd: null,
                        color: 16711680
                    };

                    if (cudManagerMaster) {
                        cudManagerMaster.addRow(newRow, true).then(function(row) {
                            gridMaster.deselectRow();
                            row.select();
                            updateDetailPanel(newRow);
                            if (typeof showToast === "function") showToast("신규 건의사항이 추가되었습니다.", "info");
                            setTimeout(() => {
                                const cell = row.getCell("title");
                                if (cell) cell.edit(true);
                            }, 80);
                        });
                    }
                };

                // [삭제] 버튼 핸들러 (마스터 건의사항 삭제)
                pane.onDelete = function() {
                    if (!gridMaster) return;
                    const selected = gridMaster.getSelectedRows();
                    if (!selected || selected.length === 0) {
                        if (typeof showToast === "function") showToast("삭제할 건의사항 행을 먼저 선택해주세요.", "warning");
                        return;
                    }

                    const row = selected[0];
                    const data = row.getData();
                    if (!isCurrentUserProposer(data)) {
                        if (typeof showToast === "function") showToast("본인이 작성한 건의사항만 삭제할 수 있습니다.", "warning");
                        return;
                    }

                    if (confirm("선택한 건의사항(및 해당 댓글 일체)을 삭제하시겠습니까?\n저장 버튼을 누르면 최종 반영됩니다.")) {
                        if (cudManagerMaster) {
                            cudManagerMaster.deleteRow(row);
                        } else {
                            row.delete();
                        }
                        resetDetailPanel();
                        if (typeof showToast === "function") showToast("건의사항이 삭제 목록에 추가되었습니다.", "info");
                    }
                };

                // [저장] 버튼 핸들러
                pane.onSave = function() {
                    if (!gridMaster) return;

                    const masterChanges = cudManagerMaster ? cudManagerMaster.getChanges() : { inserts: [], updates: [], deletes: [], hasChanges: false };
                    const commentChanges = cudManagerComment ? cudManagerComment.getChanges() : { inserts: [], updates: [], deletes: [], hasChanges: false };

                    const targetMasters = masterChanges.inserts.concat(masterChanges.updates);
                    const deletedMasterList = masterChanges.deletes;
                    const targetComments = commentChanges.inserts.concat(commentChanges.updates);
                    const deletedCommentList = commentChanges.deletes;

                    if (!masterChanges.hasChanges && !commentChanges.hasChanges) {
                        if (typeof showToast === "function") showToast("저장할 변경 내역이 없습니다.", "warning");
                        return;
                    }

                    // 필수값 검증
                    for (let i = 0; i < targetMasters.length; i++) {
                        const m = targetMasters[i];
                        if (!m.title || m.title.trim() === "") {
                            if (typeof showToast === "function") showToast("개발 의뢰내용(제목)을 입력해주세요.", "warning");
                            return;
                        }
                    }

                    const filterSelect = pane ? pane.querySelector('select[name="corpGr"]') : document.getElementById("filterCorpGr");
                    const corpGr = filterSelect && filterSelect.value ? filterSelect.value : (getCookieVal("savedCorpGr") || getCookieVal("corpGr") || "");

                    const payload = {
                        corpGr: corpGr,
                        masterList: targetMasters,
                        deletedMasterList: deletedMasterList,
                        commentList: targetComments,
                        deletedCommentList: deletedCommentList
                    };

                    fetch("/api/proposal/save", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    })
                    .then(res => res.json())
                    .then(res => {
                        if (res && res.success) {
                            if (cudManagerMaster) cudManagerMaster.reset();
                            if (cudManagerComment) cudManagerComment.reset();
                            if (typeof showToast === "function") {
                                showToast(`건의사항 정보가 저장되었습니다. (${res.count}건)`, "success");
                            }
                            loadProposalMaster();
                        } else {
                            if (typeof showToast === "function") {
                                showToast(res.message || "저장 중 오류가 발생했습니다.", "error");
                            }
                        }
                    })
                    .catch(err => {
                        console.error("Save error:", err);
                        if (typeof showToast === "function") {
                            showToast("저장 처리 중 네트워크 오류가 발생했습니다.", "error");
                        }
                    });
                };
            }

            // Guideline 10: Single initialization entry point with isInitialized guard
            let isInitialized = false;
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;
                initMasterGrid();
                initCommentGrid();
                initCommentTools();
                initQuickCommentInput();

                if (window.AamsSplitter && typeof window.AamsSplitter.init === 'function') {
                    window.AamsSplitter.init(pane);
                }

                // 모바일/데스크톱 화면 전환 및 윈도우 리사이즈 대응 그리드 리드로우 (공통 AamsResponsive 연동: 탭 닫힘 시 자동 파기 및 활성 탭 가드)
                if (window.AamsResponsive && typeof window.AamsResponsive.bindGridResize === 'function') {
                    AamsResponsive.bindGridResize(pane, [function() { return gridMaster; }, function() { return gridComment; }]);
                }

                // eb_direct_retrieve = true 명세 반영 자동 조회
                setTimeout(() => {
                    loadProposalMaster();
                }, 100);
            }

            document.addEventListener("DOMContentLoaded", startInit);
            if (document.readyState === "complete" || document.readyState === "interactive") {
                setTimeout(startInit, 50);
            }
        })();
    </script>
</div>
</html>

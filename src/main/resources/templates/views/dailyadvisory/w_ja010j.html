<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-split ja010j-container" th:fragment="ja010jView" style="display: flex; flex-direction: column; height: 100%; width: 100%; overflow: hidden;">


    <!-- 1. 상단 공통 툴바 (Row 1: 공통 액션 버튼 + 네비게이션 브레드크럼) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- 2. 상단 필터바 (Row 2: srw dw_c dataobject인 dc_ftymd 공통 프래그먼트 연동, 규칙 13, 14, 17) -->
    <div class="filter-bar">
        <div class="filter-left">
            <th:block th:replace="~{fragments/filter/dc_ftymd :: filter(label='조회기간')}"></th:block>
        </div>
        <div class="filter-actions" style="display: flex; align-items: center; gap: 6px;">
        </div>
    </div>

    <!-- 3. 메인 레이아웃 (좌: d_ja010j1 참여그룹 목록, 우: RD 수요예측 참여표 리포트) -->
    <div class="layout-split-h split-body" data-split-key="W_JA010J" data-default-ratio="42:58">
        <!-- 좌측 참여그룹 목록 그리드 -->
        <div class="pane-left left-pane">
            <div class="pane-header">
                <span class="fw-bold small text-secondary"><i class="fa-solid fa-list me-1"></i> 참여그룹 목록</span>
                <span id="group-count-badge" class="badge bg-primary rounded-pill">0건</span>
            </div>
            <div class="pane-body">
                <div id="ja010j-grid" class="tabulator-aams-grid" style="height: 100%; width: 100%;"></div>
            </div>
        </div>

        <!-- 우측 RD 미리보기 뷰어 (공통 프래그먼트) -->
        <div th:replace="~{fragments/report/report_viewer :: reportViewerPane(reportTitle='수요예측 참여표 리포트', defaultStatus='선택된 그룹 없음')}"></div>
    </div>

    <!-- 모바일 전용 리포트 모달 (공통 프래그먼트) -->
    <div th:replace="~{fragments/report/report_viewer :: reportMobileModal(modalId='ja010jMobileModal', modalTitle='수요예측 참여표 리포트')}"></div>

    <script th:inline="javascript">
        (function () {
            var currentPane = document.currentScript.closest('.tab-pane') || document;
            var initialTymd = /*[[${initialTymd}]]*/ '';
            var initialFymd = /*[[${initialFymd}]]*/ '';
            var serverCorpGr = /*[[${corpGr}]]*/ '';

            var grid = null;
            var isInitialized = false;
            var lastLoadedMasterKey = null;
            var currentSelectedRowData = null;

            // 회사코드 해결 함수: 셀렉트박스 -> 쿠키 -> 서버 모델값 순으로 해결 (개발지침 1번 준수)
            function getFilterCorpGr() {
                var el = currentPane.querySelector('#corpGrSelect') || document.querySelector('#corpGrSelect');
                if (el && el.value) return el.value;

                var matchSaved = document.cookie.match(/(?:^|;\s*)savedCorpGr=([^;]*)/);
                if (matchSaved && matchSaved[1]) return decodeURIComponent(matchSaved[1]);

                var matchCorp = document.cookie.match(/(?:^|;\s*)corpGr=([^;]*)/);
                if (matchCorp && matchCorp[1]) return decodeURIComponent(matchCorp[1]);

                if (serverCorpGr) return serverCorpGr;
                if (typeof g_corp_gr !== 'undefined' && g_corp_gr) return g_corp_gr;
                return '';
            }

            function getFilterFymd() {
                var el = currentPane.querySelector('#filterFYmd') || currentPane.querySelector('input[name="fYmd"]') || currentPane.querySelector('#filterFymd');
                if (el && el.value) return el.value.replace(/-/g, '').replace(/\./g, '');
                return (initialFymd || '').replace(/-/g, '').replace(/\./g, '');
            }

            function getFilterTymd() {
                var el = currentPane.querySelector('#filterTYmd') || currentPane.querySelector('input[name="tYmd"]') || currentPane.querySelector('#filterTymd');
                if (el && el.value) return el.value.replace(/-/g, '').replace(/\./g, '');
                return (initialTymd || '').replace(/-/g, '').replace(/\./g, '');
            }

            // 달력 컴포넌트 초기화 (AamsCalendar Range 모드 연동, 개발지침 달력 규칙 1)
            function initCalendar() {
                var fEl = currentPane.querySelector('#filterFYmd') || currentPane.querySelector('input[name="fYmd"]');
                var tEl = currentPane.querySelector('#filterTYmd') || currentPane.querySelector('input[name="tYmd"]');

                if (initialFymd && fEl && !fEl.value) {
                    fEl.value = initialFymd;
                }
                if (initialTymd && tEl && !tEl.value) {
                    tEl.value = initialTymd;
                }

                if (window.AamsCalendar && typeof window.AamsCalendar.initRange === 'function') {
                    window.AamsCalendar.initRange('filterFYmd', 'filterTYmd', {
                        pane: currentPane
                    });
                }
            }

            function initGrid() {
                var gridEl = currentPane.querySelector('#ja010j-grid');
                if (!gridEl) return;

                // d_ja010j1.srd 컬럼 x좌표 순서와 100% 일치
                grid = new Tabulator(gridEl, {
                    height: "100%",
                    layout: "fitDataFill",
                    selectable: 1,
                    data: [],
                    columns: [
                        { title: "No.", formatter: "rownum", width: 45, hozAlign: "center", headerHozAlign: "center" },
                        { title: "회사코드", field: "corpGr", width: 85, hozAlign: "center", headerHozAlign: "center" },
                        { title: "공모참여그룹회사명", field: "companyName", minWidth: 260, hozAlign: "left", headerHozAlign: "center" }
                    ]
                });

                // 개발지침 규칙 8번 삼중 안전망 (setupTabulatorRowSelection + rowClick + rowSelectionChanged)
                if (typeof setupTabulatorRowSelection === "function") {
                    setupTabulatorRowSelection(grid, function (row, data) {
                        syncDetail(row, data, false);
                    });
                }
                grid.on("rowClick", function (e, row) {
                    var isRealClick = e && (e.isTrusted !== false);
                    syncDetail(row, row ? row.getData() : null, isRealClick);
                });
                grid.on("rowSelectionChanged", function (data, rows) {
                    if (rows && rows.length > 0 && !isMobileView()) {
                        syncDetail(rows[0], rows[0].getData(), false);
                    }
                });
            }

            // Helper to check if currently in mobile view (태블릿-S / 876px 이하 또는 우측 패널 숨김)
            function isMobileView() {
                var right = currentPane.querySelector('.split-right') || currentPane.querySelector('.report-card');
                if (right && window.getComputedStyle(right).display === 'none') {
                    return true;
                }
                return window.innerWidth <= 876 || (currentPane.clientWidth > 0 && currentPane.clientWidth <= 876);
            }

            function syncDetail(row, masterRowData, isUserClick) {
                if (!row) return;
                if (!row.isSelected || !row.isSelected()) {
                    row.select();
                }
                var data = masterRowData || (row.getData ? row.getData() : null);
                if (!data) return;

                currentSelectedRowData = data;

                var currentKey = (data.corpGr || "") + "_" + (data.fundCd || "") + "_" + (data.companyName || "");
                if (isMobileView() && isManualClick) {
                    var title = (data.companyName || '') + ' 수요예측 참여표';
                    reportViewer.openModal(data, title);
                } else {
                    if (lastLoadedMasterKey === currentKey) return;
                    lastLoadedMasterKey = currentKey;

                    var fymd = getFilterFymd();
                    var tymd = getFilterTymd();
                    var fStr = (fymd.length === 8) ? (fymd.substring(0, 4) + "." + fymd.substring(4, 6) + "." + fymd.substring(6, 8)) : fymd;
                    var tStr = (tymd.length === 8) ? (tymd.substring(0, 4) + "." + tymd.substring(4, 6) + "." + tymd.substring(6, 8)) : tymd;
                    reportViewer.load(data, "조회구간: " + fStr + " ~ " + tStr);
                }
            }

            function loadList() {
                var corpGr = getFilterCorpGr();
                var tymd = getFilterTymd();

                if (!corpGr) {
                    if (typeof showToast === "function") showToast("회사그룹을 선택해주세요.", "warning");
                    return;
                }

                var url = "/api/daily/ja010j/list?corpGr=" + encodeURIComponent(corpGr) + "&ymd=" + encodeURIComponent(tymd);
                fetch(url)
                    .then(function (res) { return res.json(); })
                    .then(function (data) {
                        var list = data || [];
                        var badge = currentPane.querySelector('#group-count-badge');
                        if (badge) badge.innerText = list.length + "건";

                        lastLoadedMasterKey = null;
                        if (grid) {
                            grid.setData(list).then(function () {
                                var rows = grid.getRows();
                                // 개발지침 규칙 15: 데이터 존재 시 행 선택 (데스크톱만 첫 행 자동 선택, 모바일은 자동 포커스 방지)
                                if (rows && rows.length > 0) {
                                    if (!isMobileView()) {
                                        rows[0].select();
                                        syncDetail(rows[0], rows[0].getData(), false);
                                    } else {
                                        grid.deselectRow();
                                        currentSelectedRowData = null;
                                        lastLoadedMasterKey = null;
                                    }
                                } else {
                                    reportViewer.clear();
                                }
                            });
                        }
                    })
                    .catch(function (err) {
                        console.error("수요예측 참여표 목록 조회 실패:", err);
                        if (typeof showToast === "function") showToast("조회 중 오류가 발생했습니다.", "error");
                    });
            }

            var reportViewer = null;

            function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                initCalendar();
                initGrid();

                // 리포트 뷰어 일체형 자동 바인딩 (공통 프래그먼트 및 모듈 연동)
                reportViewer = AamsReport.bindViewer(currentPane, {
                    mrdName: 'rd_ja010j.mrd',
                    modalSelector: '#ja010jMobileModal',
                    getParams: function (data) {
                        return {
                            corpGr: (data && data.corpGr) ? data.corpGr : getFilterCorpGr(),
                            fundCd: (data && data.fundCd != null) ? data.fundCd : '0',
                            companyName: (data && data.companyName) ? data.companyName : '',
                            fundNm: (data && data.fundNm) ? data.fundNm : '',
                            fymd: getFilterFymd(),
                            tymd: getFilterTymd()
                        };
                    },
                    getDownloadName: function (data, format) {
                        var cName = (data && data.companyName) ? data.companyName : '수요예측';
                        return cName + '_참여표';
                    }
                });

                // 개발지침 규칙 9: 상단 공통 툴바 표준 계약 함수 연결
                currentPane.onRetrieve = currentPane.onSearch = function () {
                    loadList();
                };

                // 회사그룹 변경 이벤트 연동 (개발지침 달력 규칙 4)
                currentPane.onCorpGrChange = function () {
                    var newCorpGr = getFilterCorpGr();
                    if (!newCorpGr) return;
                    fetch('/api/daily/ja010j/workdate?corpGr=' + encodeURIComponent(newCorpGr))
                        .then(function (res) { return res.json(); })
                        .then(function (data) {
                            if (data && data.tymd) {
                                var fEl = currentPane.querySelector('#filterFYmd') || currentPane.querySelector('input[name="fYmd"]');
                                var tEl = currentPane.querySelector('#filterTYmd') || currentPane.querySelector('input[name="tYmd"]');
                                if (fEl && data.fymd) fEl.value = data.fymd;
                                if (tEl && data.tymd) tEl.value = data.tymd;
                            }
                        })
                        .catch(function (err) {
                            console.error("작업일자 조회 실패:", err);
                        });
                };

                // 새로고침 연동 (개발지침 공통버튼 규칙 1)
                currentPane.onRefresh = function () {
                    if (grid) grid.clearData();
                    currentSelectedRowData = null;
                    lastLoadedMasterKey = null;

                    var fEl = currentPane.querySelector('#filterFYmd') || currentPane.querySelector('input[name="fYmd"]');
                    var tEl = currentPane.querySelector('#filterTYmd') || currentPane.querySelector('input[name="tYmd"]');
                    if (fEl && initialFymd) fEl.value = initialFymd;
                    if (tEl && initialTymd) tEl.value = initialTymd;

                    if (reportViewer) reportViewer.clear();
                    var badge = currentPane.querySelector('#group-count-badge');
                    if (badge) badge.innerText = '0건';

                    if (typeof showToast === "function") {
                        showToast("화면이 초기화되었습니다.", "info");
                    }
                };

                // Window resize responsive sync
                window.addEventListener('resize', function () {
                    if (grid) grid.redraw(true);
                    if (!isMobileView() && reportViewer) {
                        reportViewer.closeModal();
                        if (currentSelectedRowData) {
                            var fymd = getFilterFymd();
                            var tymd = getFilterTymd();
                            var fStr = (fymd.length === 8) ? (fymd.substring(0, 4) + "." + fymd.substring(4, 6) + "." + fymd.substring(6, 8)) : fymd;
                            var tStr = (tymd.length === 8) ? (tymd.substring(0, 4) + "." + tymd.substring(4, 6) + "." + tymd.substring(6, 8)) : tymd;
                            reportViewer.load(currentSelectedRowData, "조회구간: " + fStr + " ~ " + tStr);
                        }
                    }
                });

                // 파워빌더 eb_direct_retrieve = true 규격 준수: 화면 오픈 시 자동 조회 실행
                setTimeout(function () {
                    loadList();
                }, 100);
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", startInit);
            } else {
                startInit();
            }
        })();
    </script>
</div>
</html>

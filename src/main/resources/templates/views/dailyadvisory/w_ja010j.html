<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-split-h ja010j-container layout-mobile-stack-container" th:fragment="ja010jView"
     data-pgm-id="W_JA010J"
     th:data-initial-tymd="${initialTymd}"
     th:data-initial-fymd="${initialFymd}"
     th:data-corp-gr="${corpGr}"
     th:data-is-admin="${isAdmin}"
     style="display: flex; flex-direction: column; height: 100%; width: 100%; overflow: hidden;">

    <!-- 1. 상단 공통 툴바 (Row 1: 공통 액션 버튼 + 네비게이션 브레드크럼) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- 2. 상단 필터바 (Row 2: srw dw_c dataobject인 dc_ftymd 공통 프래그먼트 연동, 규칙 08, 09) -->
    <div class="filter-bar">
        <div class="filter-left">
            <th:block th:replace="~{fragments/filter/dc_ftymd :: filter(label='조회기간')}"></th:block>
        </div>
    </div>

    <!-- 3. 메인 레이아웃 (좌: d_ja010j1 참여그룹 목록, 우: RD 3개월 평잔현황 리포트 - wt_vertole 상속 구조) -->
    <div class="layout-split-h split-body layout-mobile-stack" data-split-key="W_JA010J" data-default-ratio="42:58" style="flex: 1; min-height: 0;">
        <!-- 좌측 참여그룹 목록 그리드 -->
        <div class="split-pane pane-left" style="width: 42%;">
            <div class="pane-header">
                <span class="panel-title"><i class="fa-solid fa-list me-1"></i> 참여그룹 목록</span>
            </div>
            <div class="pane-body">
                <div id="ja010j-grid" class="tabulator-aams-grid" style="height: 100%; width: 100%;"></div>
            </div>
        </div>

        <!-- 스플리터 드래그 바 (규칙 10) -->
        <div class="split-gutter-h"></div>

        <!-- 우측 RD 미리보기 뷰어 (공통 프래그먼트: 3개월 평잔현황) -->
        <div th:replace="~{fragments/report/report_viewer :: reportViewerPane(reportTitle='3개월 평잔현황', defaultStatus='선택된 그룹 없음')}"></div>
    </div>

    <!-- 모바일 전용 리포트 모달 (공통 프래그먼트) -->
    <div th:replace="~{fragments/report/report_viewer :: reportMobileModal(modalId='ja010jMobileModal', modalTitle='3개월 평잔현황')}"></div>

    <script>
        (function () {
            var currentScript = document.currentScript;
            var pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;
            var currentPane = pane || document;

            var initialTymd = currentPane.getAttribute('data-initial-tymd') || '';
            var initialFymd = currentPane.getAttribute('data-initial-fymd') || '';
            var serverCorpGr = currentPane.getAttribute('data-corp-gr') || '';
            var isAdmin = currentPane.getAttribute('data-is-admin') === 'true';

            var grid = null;
            var isInitialized = false;
            var lastLoadedMasterKey = null;
            var currentSelectedRowData = null;
            var reportViewer = null;

            // 리포트 타이틀 공통 생성 헬퍼
            function getReportTitle(data) {
                if (!data) return '3개월 평잔현황';
                var fCd = (data.fundCd != null) ? String(data.fundCd) : '0';
                if (fCd === '0') {
                    var cName = (data.companyName || '').replace('-고유공모계좌', '').trim();
                    return (cName || data.corpGr || '') + ' 3개월 평잔현황';
                }
                return (data.fundNm || data.companyName || '') + ' 3개월 평잔현황';
            }

            // 달력 컴포넌트 초기화 (common.js initFilterCalendar 공통 연동: Range 자동 감지)
            function initCalendar() {
                if (typeof window.initFilterCalendar === 'function') {
                    window.initFilterCalendar(currentPane);
                }
            }

            function initGrid() {
                var gridEl = currentPane.querySelector('#ja010j-grid');
                if (!gridEl) return;

                // d_ja010j1.srd 컬럼 및 속성 100% 반영:
                // - corp_gr: color="32768" (초록색 headerCssClass: "col-hdr-green"), sparse(names="corp_gr") -> suppressRepeating: true
                // - company_name: alignment="0" (좌측 정렬)
                grid = new Tabulator(gridEl, {
                    height: "100%",
                    layout: "fitColumns",
                    selectableRows: 1,
                    data: [],
                    columns: [
                        { title: "No.", formatter: "rownum", width: 50, hozAlign: "center", headerHozAlign: "center", resizable: false, headerSort: false },
                        { title: "회사코드", field: "corpGr", width: 85, hozAlign: "center", headerHozAlign: "center", headerCssClass: "col-hdr-green", suppressRepeating: true },
                        { title: "공모참여그룹회사명", field: "companyName", minWidth: 260, hozAlign: "left", headerHozAlign: "center" }
                    ]
                });

                // 개발지침 규칙 05 삼중 안전망 (setupTabulatorRowSelection + rowClick + rowSelectionChanged)
                if (typeof setupTabulatorRowSelection === "function") {
                    setupTabulatorRowSelection(grid, function (row, data) {
                        syncDetail(row, data, false);
                    }, { autoSelectFirst: false });
                }
                grid.on("rowClick", function (e, row) {
                    var isRealClick = e && (e.isTrusted !== false);
                    syncDetail(row, row ? row.getData() : null, isRealClick);
                });
                grid.on("rowSelectionChanged", function (data, rows) {
                    var isMobile = window.AamsReport && typeof window.AamsReport.isMobileView === 'function'
                        ? window.AamsReport.isMobileView(currentPane)
                        : (window.innerWidth <= 876);
                    if (rows && rows.length > 0 && !isMobile) {
                        syncDetail(rows[0], rows[0].getData(), false);
                    }
                });
            }

            function syncDetail(row, masterRowData, isUserClick) {
                if (!row) return;
                if (!row.isSelected || !row.isSelected()) {
                    if (grid && typeof grid.deselectRow === 'function') {
                        grid.deselectRow();
                    }
                    row.select();
                }
                var data = masterRowData || (row.getData ? row.getData() : null);
                if (!data) return;

                currentSelectedRowData = data;

                var isMobile = window.AamsReport && typeof window.AamsReport.isMobileView === 'function'
                    ? window.AamsReport.isMobileView(currentPane)
                    : (window.innerWidth <= 876);

                if (isMobile) {
                    if (isUserClick && reportViewer) {
                        reportViewer.openModal(data);
                    }
                } else {
                    var currentKey = (data.corpGr || "") + "_" + (data.fundCd || "") + "_" + (data.companyName || "");
                    if (lastLoadedMasterKey === currentKey) return;
                    lastLoadedMasterKey = currentKey;

                    if (reportViewer) {
                        reportViewer.load(data);
                    }
                }
            }

            function loadList() {
                var corpGr = (typeof resolveCorpGr === 'function') ? resolveCorpGr(currentPane) : serverCorpGr;
                var tymd = (typeof getFilterTymd === 'function') ? getFilterTymd(currentPane, 'YYYY-MM-DD') : '';

                if (!corpGr && !isAdmin) {
                    if (typeof showToast === "function") showToast("회사그룹을 선택해주세요.", "warning");
                    return;
                }

                // 파워빌더 w_ja010j.srw wue_retrieve 명세:
                // IF gaa.aams Then dw_list.retrieve('%', tymd) Else dw_list.retrieve(gaa.corp_gr, tymd)
                var queryCorpGr = isAdmin ? "%" : corpGr;
                var url = "/api/daily/ja010j/list?corpGr=" + encodeURIComponent(queryCorpGr) + "&ymd=" + encodeURIComponent(tymd);
                fetch(url)
                    .then(function (res) { return res.json(); })
                    .then(function (data) {
                        var list = data || [];

                        lastLoadedMasterKey = null;
                        if (grid) {
                            grid.setData(list).then(function () {
                                var rows = grid.getRows();
                                if (rows && rows.length > 0) {
                                    var isMobile = window.AamsReport && typeof window.AamsReport.isMobileView === 'function'
                                        ? window.AamsReport.isMobileView(currentPane)
                                        : (window.innerWidth <= 876);

                                    if (!isMobile) {
                                        // 파워빌더 ue_activate 명세: dw_list.uf_find ("corp_gr='" + gaa.corp_gr + "'")
                                        // 현재 접속한 회사그룹(corpGr)과 일치하는 행을 우선 탐색하여 자동 포커스/선택, 없으면 첫 행 선택
                                        var targetRow = rows[0];
                                        if (corpGr) {
                                            for (var i = 0; i < rows.length; i++) {
                                                var rData = rows[i].getData();
                                                if (rData && rData.corpGr === corpGr) {
                                                    targetRow = rows[i];
                                                    break;
                                                }
                                            }
                                        }
                                        grid.deselectRow();
                                        targetRow.select();
                                        syncDetail(targetRow, targetRow.getData(), false);
                                    } else {
                                        grid.deselectRow();
                                        currentSelectedRowData = null;
                                        lastLoadedMasterKey = null;
                                    }
                                } else {
                                    if (reportViewer) reportViewer.clear();
                                }
                            });
                        }
                    })
                    .catch(function (err) {
                        console.error("수요예측 참여표 목록 조회 실패:", err);
                        if (typeof showToast === "function") showToast("조회 중 오류가 발생했습니다.", "error");
                    });
            }

            function initSplitter() {
                if (window.AamsSplitter && typeof window.AamsSplitter.init === 'function') {
                    window.AamsSplitter.init(currentPane);
                }
            }

            function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                initCalendar();
                initGrid();
                initSplitter();

                // 파워빌더 ole_rd::ue_retrieve 분기 명세 100% 반영:
                // CASE '0': 'rd_ja010j_0.mrd', corp_gr, title: '... 3개월 평잔현황', fymd, tymd
                // CASE '1': IF corp_gr='2202' THEN 'rd_ja010j_2202.mrd' ELSE 'rd_ja010j_1.mrd'
                // CASE '2': 'rd_ja010j_2.mrd'
                // CASE ELSE: 'rd_ja010j_6.mrd', fund_cd
                var reportEngine = window.AamsReport;
                reportViewer = (reportEngine && typeof reportEngine.bindViewer === 'function')
                    ? reportEngine.bindViewer(currentPane, {
                        reportFile: function (data) {
                            var fCd = (data && data.fundCd != null) ? String(data.fundCd) : '0';
                            var cGr = (data && data.corpGr) ? String(data.corpGr) : resolveCorpGr(currentPane);
                            if (fCd === '0') return 'rd_ja010j_0.mrd';
                            if (fCd === '1') return (cGr === '2202') ? 'rd_ja010j_2202.mrd' : 'rd_ja010j_1.mrd';
                            if (fCd === '2') return 'rd_ja010j_2.mrd';
                            return 'rd_ja010j_6.mrd';
                        },
                        modalSelector: '#ja010jMobileModal',
                        grid: function () { return grid; },
                        getCorpGr: function (data) {
                            return (data && data.corpGr) ? data.corpGr : resolveCorpGr(currentPane);
                        },
                        getParams: function (data) {
                            if (!data) return {};
                            var fCd = (data.fundCd != null) ? String(data.fundCd) : '0';
                            var fymd = (typeof getFilterFymd === 'function') ? getFilterFymd(currentPane, 'YYYY.MM.DD') : '';
                            var tymd = (typeof getFilterTymd === 'function') ? getFilterTymd(currentPane, 'YYYY.MM.DD') : '';

                            var params = {
                                title: getReportTitle(data),
                                fymd: fymd,
                                tymd: tymd
                            };
                            if (fCd !== '0' && fCd !== '1' && fCd !== '2') {
                                params.fund_cd = data.fundCd;
                            }
                            return params;
                        },
                        getTitle: function (data) {
                            return getReportTitle(data);
                        },
                        getStatus: function () {
                            var fymd = (typeof getFilterFymd === 'function') ? getFilterFymd(currentPane, 'YYYY.MM.DD') : '';
                            var tymd = (typeof getFilterTymd === 'function') ? getFilterTymd(currentPane, 'YYYY.MM.DD') : '';
                            return "조회구간: " + fymd + " ~ " + tymd;
                        },
                        getDownloadName: function (data) {
                            var tymdClean = (typeof getFilterTymd === 'function') ? getFilterTymd(currentPane, 'YYYYMMDD') : '';
                            var title = getReportTitle(data).replace(/[\\/:*?"<>|]/g, "_").trim();
                            return tymdClean + "_" + (title || "수요예측_참여표");
                        }
                    })
                    : null;

                // 개발지침 규칙 08: 상단 공통 툴바 표준 계약 바인딩
                currentPane.onSearch = function () {
                    loadList();
                };

                // 상단 공통 툴바 [엑셀] 버튼 연동 (규칙 12)
                currentPane.onExcel = function () {
                    if (reportViewer && currentSelectedRowData) {
                        reportViewer.exportReport('excel');
                    } else if (grid) {
                        grid.download("xlsx", "참여그룹목록.xlsx", { sheetName: "참여그룹" });
                    }
                };

                // 회사그룹 변경 이벤트 연동 (개발지침 규칙 08 준수: 자동 조회는 실행하지 않고 일자만 갱신)
                currentPane.onCorpGrChange = function () {
                    var newCorpGr = resolveCorpGr(currentPane);
                    if (!newCorpGr) return;
                    fetch('/api/daily/ja010j/workdate?corpGr=' + encodeURIComponent(newCorpGr))
                        .then(function (res) { return res.json(); })
                        .then(function (data) {
                            if (data && data.tymd) {
                                var fEl = currentPane.querySelector('#filterFYmd');
                                var tEl = currentPane.querySelector('#filterTYmd');
                                if (fEl && data.fymd) fEl.value = data.fymd;
                                if (tEl && data.tymd) tEl.value = data.tymd;
                            }
                        })
                        .catch(function (err) {
                            console.error("작업일자 조회 실패:", err);
                        });
                };

                // 새로고침 연동 (규칙 08: 상태 완전 초기화, 자동 재조회 절대 금지)
                currentPane.onRefresh = function () {
                    if (grid) grid.clearData();
                    currentSelectedRowData = null;
                    lastLoadedMasterKey = null;

                    var fEl = currentPane.querySelector('#filterFYmd');
                    var tEl = currentPane.querySelector('#filterTYmd');
                    if (fEl && initialFymd) fEl.value = initialFymd;
                    if (tEl && initialTymd) tEl.value = initialTymd;

                    if (reportViewer) reportViewer.clear();

                    if (typeof showToast === "function") {
                        showToast("화면이 초기화되었습니다.", "info");
                    }
                };

                // 파워빌더 eb_direct_retrieve = true 규격 준수: 화면 오픈 시 자동 조회 실행
                setTimeout(function () {
                    loadList();
                }, 100);
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", startInit);
            } else {
                startInit();
            }
        })();
    </script>
</div>
</html>

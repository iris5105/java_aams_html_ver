<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-split ja010h1-container" th:fragment="ja010h1View"
     th:data-initial-ymd="${initialYmd}" th:data-corp-gr="${corpGr}"
     style="display: flex; flex-direction: column; height: 100%; width: 100%; overflow: hidden;">

    <style>
        /* 화면 전용 펀드 건수 뱃지 */
        .ja010h1-container .badge-count {
            background-color: #3b82f6;
            color: #ffffff;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 12px;
        }

        .ja010h1-container .cell-work-gb {
            color: #dc2626;
            font-weight: 600;
            cursor: pointer;
        }

        .ja010h1-container .cell-work-gb:hover {
            text-decoration: underline;
        }
    </style>

    <!-- 1. 상단 공통 툴바 (Row 1: 툴바 버튼 + 네비게이션 브레드크럼) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- 2. 상단 필터바 (Row 2: dc_ymd + 화면 전용 서브 버튼 cb_pj, cb_1, export 일체형) -->
    <div class="filter-bar">
        <div class="filter-left">
            <th:block th:replace="~{fragments/filter/dc_ymd :: filter(label='조회일자')}"></th:block>
        </div>
        <div class="filter-actions" style="display: flex; align-items: center; gap: 6px;">
            <!-- 파워빌더 cb_pj: 평잔재계산 -->
            <button type="button" id="btnPyungjan" class="t-btn btn-action" style="background: #f59e0b; color: #ffffff; border-color: #d97706;" title="선택된 계좌 평잔 재계산">
                <i class="fa-solid fa-calculator" style="margin-right: 4px;"></i> 평잔재계산
            </button>
            <!-- 파워빌더 cb_1: 보유자산종합엑셀생성 -->
            <button type="button" id="btnTotalExcel" class="t-btn btn-action" style="background: #10b981; color: #ffffff; border-color: #059669;" title="전체 보유자산 종합 엑셀 생성">
                <i class="fa-solid fa-file-excel" style="margin-right: 4px;"></i> 보유자산종합엑셀
            </button>
        </div>
    </div>

    <!-- 3. 메인 분할 영역 (좌: d_szm0ia.srd 그리드, 우: rd_ja010h1.mrd 리포트 뷰어) -->
    <div class="layout-split-h split-body" data-split-key="W_JA010H1" data-default-ratio="38:62">
        <!-- 좌측: 펀드 목록 그리드 -->
        <div class="pane-left left-pane">
            <div class="pane-header">
                <span><i class="fa-solid fa-list" style="margin-right: 6px; color: #3b82f6;"></i> 계좌(펀드) 목록</span>
                <span id="fund-count-badge" class="badge-count">0건</span>
            </div>
            <div class="pane-body">
                <div id="fund-grid" class="tabulator-aams-grid" style="height: 100%; width: 100%;"></div>
            </div>
        </div>

        <!-- 우측: RD Report 리포트 미리보기 뷰어 -->
        <div th:replace="~{fragments/report/report_viewer :: reportViewerPane(reportTitle='자산명세표 리포트', defaultStatus='선택된 계좌 없음')}"></div>
    </div>

    <!-- 모바일 전용 리포트 모달 (width <= 876px) -->
    <div th:replace="~{fragments/report/report_viewer :: reportMobileModal(modalId='ja010h1MobileModal', modalTitle='자산명세표 리포트')}"></div>
    <script>
        (function () {
            var pane = (document.currentScript && document.currentScript.closest) ? document.currentScript.closest('.tab-pane') : (document.querySelector('.tab-pane.active') || document);
            var initialYmd = (pane && pane.getAttribute) ? (pane.getAttribute('data-initial-ymd') || '') : '';
            var serverCorpGr = (pane && pane.getAttribute) ? (pane.getAttribute('data-corp-gr') || '') : '';
            var grid = null;
            var isInitialized = false;
            var lastLoadedMasterKey = null;
            var currentSelectedRowData = null;
            var dddwOptionsMap = {};

            // 회사코드 해결 함수: 개발지침 공통 resolveCorpGr 호출
            function getFilterCorpGr() {
                return (typeof resolveCorpGr === 'function') ? resolveCorpGr(pane) : (serverCorpGr || '');
            }

            function getFilterYmd() {
                var el = pane.querySelector('#filterYmd') || pane.querySelector('input[name="ymd"]');
                if (el && el.value) return el.value.replace(/-/g, '');
                return '';
            }

            // AamsReport 통합 바인딩 (5종 내보내기, 새 창, 모바일 모달, 로딩 제어)
            var reportViewer = (window.AamsReport && typeof window.AamsReport.bindViewer === 'function')
                ? window.AamsReport.bindViewer(pane, {
                    reportFile: 'rd_ja010h1.mrd',
                    modalId: 'ja010h1MobileModal',
                    getCorpGr: function () { return getFilterCorpGr(); },
                    buildParams: function (data) {
                        return {
                            fund_cd: data.fundCd || '',
                            fund_nm: data.fundNm || '',
                            ymd: (getFilterYmd() || '').replace(/-/g, '.')
                        };
                    },
                    getTitle: function (data) {
                        return (data.fundNm || '') + ' (' + (data.fundCd || '') + ') 자산명세표1';
                    },
                    getStatus: function (data, params) {
                        return "조회일자: " + getFilterYmd();
                    },
                    getDownloadName: function (data, params) {
                        var safeFundNm = (data.fundNm || '').trim().replace(/[\\/:*?"<>|]/g, "_") || "자산명세표";
                        return (getFilterYmd() || '').replace(/[-.]/g, '') + "_" + safeFundNm + "(" + (data.fundCd || '') + ")";
                    },
                    onBeforePreview: function (data) {
                        var corpGr = getFilterCorpGr();
                        var ymd = getFilterYmd();
                        if (corpGr === '2402') {
                            fetch("/api/daily/ja010h1/check-ledger?corpGr=" + encodeURIComponent(corpGr) + "&ymd=" + encodeURIComponent(ymd))
                                .then(function (res) { return res.json(); })
                                .then(function (result) {
                                    if (result && !result.valid && result.message) {
                                        if (typeof showToast === "function") {
                                            showToast(result.message, "warning", 8000);
                                        } else {
                                            alert(result.message);
                                        }
                                    }
                                })
                                .catch(function (e) { console.warn("원장생성 검증 오류:", e); });
                        }
                    }
                })
                : null;

            // 엑세스 쿠키의 현재 영업일 추출
            function getCookieWorkDate() {
                var matchWork = document.cookie.match(/(?:^|;\s*)workDate=([^;]*)/);
                if (matchWork && matchWork[1]) return decodeURIComponent(matchWork[1]);
                var matchHyun = document.cookie.match(/(?:^|;\s*)hyunYmd=([^;]*)/);
                if (matchHyun && matchHyun[1]) return decodeURIComponent(matchHyun[1]);
                return '';
            }

            // 달력 컴포넌트 초기화 (wue_lastopen 명세 연동)
            function initCalendar() {
                var filterYmdInput = pane.querySelector('#filterYmd');
                if (!filterYmdInput) return;

                var corpGr = getFilterCorpGr();
                var targetYmd = filterYmdInput.value || initialYmd;
                if (!targetYmd && corpGr !== '2402') {
                    targetYmd = getCookieWorkDate();
                }
                if (targetYmd) {
                    filterYmdInput.value = targetYmd;
                }

                if (typeof AamsCalendar !== 'undefined' && typeof AamsCalendar.initSimple === 'function') {
                    AamsCalendar.initSimple('filterYmd', {
                        pane: pane,
                        initialYmd: filterYmdInput.value || targetYmd
                    });
                }
            }

            // 증권사 DDDW 초기화: f_dddwctl (THIS, 'sec_cd | tr_co_cd', gaa.corp_gr, '', 1, '')
            function initDddw() {
                var corpGr = getFilterCorpGr();
                if (typeof window.f_dddwctl === 'function') {
                    window.f_dddwctl('tr_co_cd', corpGr, '', 1, '').then(function (options) {
                        dddwOptionsMap['tr_co_cd'] = options || [];
                        if (grid) grid.redraw(true);
                    }).catch(function (e) {
                        console.warn('[w_ja010h1] f_dddwctl tr_co_cd error:', e);
                    });
                }
            }

            // 그리드 초기화: d_szm0ia.srd 명세 및 개발지침 준수
            // 순서: No. -> 증권사 -> 고객명 -> 관리번호 -> 결산 -> 만기일자
            function initGrid() {
                var gridEl = pane.querySelector('#fund-grid');
                if (!gridEl) return;

                grid = new Tabulator(gridEl, {
                    height: "100%",
                    layout: "fitColumns",
                    selectableRows: 1,
                    selectableRowsRollingSelection: false,
                    data: [],
                    columnDefaults: {
                        vertAlign: "middle"
                    },
                    rowFormatter: function (row) {
                        if (row.isSelected && row.isSelected()) {
                            var el = row.getElement();
                            if (el && !el.classList.contains('tabulator-selected')) {
                                el.classList.add('tabulator-selected');
                            }
                        }
                    },
                    columns: [
                        {
                            title: "No.",
                            formatter: "rownum",
                            width: 45,
                            hozAlign: "center",
                            headerHozAlign: "center"
                        },
                        {
                            title: "증권사",
                            field: "secCd",
                            width: 90,
                            hozAlign: "center",
                            headerHozAlign: "center",
                            formatter: function (cell) {
                                var val = cell.getValue();
                                if (!val) return '';
                                var opts = dddwOptionsMap['tr_co_cd'] || [];
                                for (var i = 0; i < opts.length; i++) {
                                    if ((opts[i].code || opts[i].cd) === val) {
                                        return opts[i].name || opts[i].nm || val;
                                    }
                                }
                                return val;
                            }
                        },
                        {
                            title: "고객명",
                            field: "fundNm",
                            minWidth: 140,
                            hozAlign: "left",
                            headerHozAlign: "center"
                        },
                        {
                            title: "관리번호",
                            field: "fundCd",
                            width: 80,
                            hozAlign: "center",
                            headerHozAlign: "center",
                            formatter: function (cell) {
                                return '<span class="cell-fund-cd">' + (cell.getValue() || '') + '</span>';
                            }
                        },
                        {
                            title: "결산",
                            field: "workGb",
                            width: 55,
                            hozAlign: "center",
                            headerHozAlign: "center",
                            formatter: function (cell) {
                                var val = cell.getValue();
                                if (val) {
                                    return '<span class="cell-work-gb" title="더블클릭 시 결산작업 이동">' + val + '</span>';
                                }
                                return '';
                            },
                            cellDblClick: function (e, cell) {
                                // 파워빌더 work_gb 더블클릭 메뉴 오픈 로직
                                var corpGr = getFilterCorpGr();
                                var targetPgmNo = (corpGr === '2201') ? '00118' : '00236';
                                if (window.parent && window.parent.TabManager && typeof window.parent.TabManager.openTabByPgmNo === 'function') {
                                    window.parent.TabManager.openTabByPgmNo(targetPgmNo);
                                } else if (typeof showToast === "function") {
                                    showToast("결산 화면(" + targetPgmNo + ")으로 이동합니다.", "info");
                                }
                            }
                        },
                        {
                            title: "만기일자",
                            field: "afGyulYmd",
                            width: 95,
                            hozAlign: "center",
                            headerHozAlign: "center",
                            formatter: function (cell) {
                                var v = cell.getValue();
                                if (!v) return '';
                                var clean = v.replace(/-/g, '').replace(/\./g, '');
                                if (clean.length === 8) {
                                    return clean.substring(0, 4) + '.' + clean.substring(4, 6) + '.' + clean.substring(6, 8);
                                }
                                return v;
                            }
                        }
                    ]
                });

                // 개발 지침 규칙 8번 삼중 안전망 (전역 헬퍼 + rowClick + rowSelectionChanged)
                if (typeof setupTabulatorRowSelection === "function") {
                    setupTabulatorRowSelection(grid, function (row, data) {
                        syncDetail(row, data, false);
                    }, { autoSelectFirst: false });
                }
                grid.on("rowClick", function (e, row) {
                    var isRealClick = e && (e.isTrusted !== false);
                    syncDetail(row, row ? row.getData() : null, isRealClick);
                });
                grid.on("rowSelectionChanged", function (data, rows) {
                    if (rows && rows.length > 0 && !isMobileView()) {
                        syncDetail(rows[0], rows[0].getData(), false);
                    }
                });
            }

            function isMobileView() {
                if (window.AamsReport && typeof window.AamsReport.isMobileView === 'function') {
                    return window.AamsReport.isMobileView(pane);
                }
                var right = pane.querySelector('.right-pane') || pane.querySelector('.split-right') || pane.querySelector('.report-card');
                if (right && window.getComputedStyle(right).display === 'none') return true;
                return window.innerWidth <= 876 || (pane.clientWidth > 0 && pane.clientWidth <= 876);
            }

            // 상세 연동 함수 (규칙 8 & 10 가드 적용 및 모바일 자동 조회 방지)
            function syncDetail(row, masterRowData, isUserClick) {
                if (!row) return;
                if (!row.isSelected || !row.isSelected()) {
                    if (grid && typeof grid.deselectRow === 'function') {
                        grid.deselectRow();
                    }
                    row.select();
                }
                var el = (typeof row.getElement === 'function') ? row.getElement() : null;
                if (el && !el.classList.contains('tabulator-selected')) {
                    el.classList.add('tabulator-selected');
                }
                var data = masterRowData || (row.getData ? row.getData() : null);
                if (!data) return;

                currentSelectedRowData = data;

                if (isMobileView()) {
                    if (isUserClick && reportViewer) {
                        var title = (data.fundNm || '') + ' (' + (data.fundCd || '') + ') 자산명세표1';
                        reportViewer.openModal(data, title);
                    }
                } else {
                    var corpGr = getFilterCorpGr();
                    var ymd = getFilterYmd();
                    var currentKey = corpGr + "_" + ymd + "_" + (data.fundCd || "");

                    if (lastLoadedMasterKey === currentKey) return;
                    lastLoadedMasterKey = currentKey;

                    if (reportViewer) {
                        reportViewer.load(data);
                    }
                }
            }

            // 펀드 목록 조회 (selectFundList)
            function loadFunds() {
                var corpGr = getFilterCorpGr();
                var ymd = getFilterYmd();

                if (!corpGr) {
                    if (typeof showToast === "function") showToast("회사그룹을 선택해주세요.", "warning");
                    return;
                }

                var url = "/api/daily/ja010h1/funds?corpGr=" + encodeURIComponent(corpGr) + "&ymd=" + encodeURIComponent(ymd);
                fetch(url)
                    .then(function (res) { return res.json(); })
                    .then(function (data) {
                        var list = data || [];
                        var badge = pane.querySelector('#fund-count-badge');
                        if (badge) badge.innerText = list.length + "건";

                        lastLoadedMasterKey = null;
                        currentSelectedRowData = null;

                        if (grid) {
                            grid.setData(list).then(function () {
                                var rows = grid.getRows();
                                // 규칙 15: 데이터 존재 시 행 선택 (데스크톱만 첫 행 자동 선택, 모바일은 자동 포커스 방지)
                                if (rows && rows.length > 0) {
                                    if (!isMobileView()) {
                                        grid.deselectRow();
                                        rows[0].select();
                                        syncDetail(rows[0], rows[0].getData(), false);

                                        // 가상 DOM 렌더링 완료 후 첫 번째 행 선택 및 포커스 하이라이트 확정 (규칙 15)
                                        setTimeout(function () {
                                            if (grid && !isMobileView()) {
                                                var currentRows = grid.getRows();
                                                if (currentRows && currentRows.length > 0) {
                                                    var targetRow = currentRows[0];
                                                    if (!targetRow.isSelected || !targetRow.isSelected()) {
                                                        grid.deselectRow();
                                                        targetRow.select();
                                                    }
                                                    var el = (typeof targetRow.getElement === 'function') ? targetRow.getElement() : null;
                                                    if (el) {
                                                        el.classList.add('tabulator-selected');
                                                        if (!el.hasAttribute('tabindex')) {
                                                            el.setAttribute('tabindex', '-1');
                                                        }
                                                        try {
                                                            el.focus({ preventScroll: true });
                                                        } catch (e) {}
                                                    }
                                                }
                                            }
                                        }, 60);
                                    } else {
                                        grid.deselectRow();
                                        currentSelectedRowData = null;
                                        lastLoadedMasterKey = null;
                                    }
                                } else {
                                    var iframe = pane.querySelector('#report-frame');
                                    if (iframe) iframe.src = "about:blank";
                                    var statusEl = pane.querySelector('#preview-status');
                                    if (statusEl) statusEl.innerText = "조회 결과 없음";
                                    var titleEl = pane.querySelector('#preview-header-title');
                                    if (titleEl) titleEl.innerHTML = '<i class="fa-solid fa-file-invoice" style="margin-right: 4px;"></i> 자산명세표1 리포트';
                                }
                            });
                        }
                    })
                    .catch(function (err) {
                        console.error("[w_ja010h1] 펀드 목록 조회 실패:", err);
                        if (typeof showToast === "function") showToast("펀드 목록 조회 중 오류 발생", "error");
                    });
            }

            // 파워빌더 cb_pj: 평잔재계산 (SR_PYUNGJAN)
            function executePyungjan() {
                if (!currentSelectedRowData) {
                    alert("평잔 재계산 대상 계좌를 선택해주세요.");
                    return;
                }

                var corpGr = getFilterCorpGr();
                var ymd = getFilterYmd();
                var fundNm = currentSelectedRowData.fundNm || '';
                var fundCd = currentSelectedRowData.fundCd || '';

                if (!confirm(fundNm + " (" + fundCd + ") 계좌 평잔 재계산 작업을 하시겠습니까?")) {
                    return;
                }

                fetch("/api/daily/ja010h1/pyungjan", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ corpGr: corpGr, fundCd: fundCd, ymd: ymd })
                })
                    .then(function (res) { return res.json(); })
                    .then(function (res) {
                        if (res.success) {
                            if (typeof showToast === "function") showToast(res.message || "평잔 재계산 완료", "success");
                            else alert(res.message || "평잔 재계산 완료");
                            lastLoadedMasterKey = null;
                            if (reportViewer && currentSelectedRowData) {
                                reportViewer.load(currentSelectedRowData);
                            }
                        } else {
                            if (typeof showToast === "function") showToast("오류: " + res.message, "error");
                            else alert("오류: " + res.message);
                        }
                    })
                    .catch(function (err) {
                        console.error("[w_ja010h1] 평잔 재계산 오류:", err);
                    });
            }

            // 파워빌더 cb_1: 보유자산종합엑셀생성
            function executeTotalExcel() {
                var corpGr = getFilterCorpGr();
                var ymd = getFilterYmd();

                if (!corpGr) {
                    alert("회사그룹을 먼저 선택해주세요.");
                    return;
                }

                var url = "/api/daily/ja010h1/export-total-excel?corpGr=" + encodeURIComponent(corpGr) +
                    "&ymd=" + encodeURIComponent(ymd);

                window.location.href = url;
            }

            // 화면 초기화 단일 진입점 (규칙 11)
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                initCalendar();
                initDddw();
                initGrid();

                // 화면 패널 분할 규격 (AamsSplitter 표준 연동)
                if (window.AamsSplitter && typeof window.AamsSplitter.init === 'function') {
                    AamsSplitter.init(pane);
                }

                // 서브 버튼 이벤트 바인딩
                var btnP = pane.querySelector('#btnPyungjan');
                if (btnP) btnP.addEventListener('click', executePyungjan);

                var btnTot = pane.querySelector('#btnTotalExcel');
                if (btnTot) btnTot.addEventListener('click', executeTotalExcel);

                // Window resize responsive sync
                window.addEventListener('resize', function () {
                    if (grid) grid.redraw(true);
                    if (!isMobileView() && currentSelectedRowData && reportViewer) {
                        reportViewer.load(currentSelectedRowData);
                    }
                });

                // 상단 툴바 표준 계약 (규칙 9)
                pane.onSearch = function () {
                    loadFunds();
                };
                pane.onRetrieve = function () {
                    loadFunds();
                };

                // 상단 공통 [엑셀] 버튼 클릭 연동
                pane.onExcel = function () {
                    if (reportViewer && currentSelectedRowData) {
                        reportViewer.exportReport('excel');
                    } else if (grid && grid.getData().length > 0) {
                        grid.download("xlsx", "자산명세표_계좌목록.xlsx");
                    } else if (typeof showToast === "function") {
                        showToast("내보낼 계좌를 먼저 선택해주세요.", "warning");
                    }
                };

                // 공통버튼 지침: 새로고침은 조회 전 초기화 상태로 되돌린다.
                pane.onRefresh = function () {
                    if (grid) grid.clearData();
                    currentSelectedRowData = null;
                    lastLoadedMasterKey = null;

                    var filterYmdInput = pane.querySelector('#filterYmd');
                    if (filterYmdInput && initialYmd) {
                        filterYmdInput.value = initialYmd;
                    }

                    if (reportViewer) {
                        reportViewer.clear();
                    } else {
                        var iframe = pane.querySelector('#report-frame');
                        if (iframe) iframe.src = "about:blank";
                        var statusEl = pane.querySelector('#preview-status');
                        if (statusEl) statusEl.innerText = "조회 결과 없음";
                    }

                    var titleEl = pane.querySelector('#preview-header-title');
                    if (titleEl) titleEl.innerHTML = '<i class="fa-solid fa-file-invoice" style="margin-right: 4px;"></i> 자산명세표1 리포트';

                    var badge = pane.querySelector('#fund-count-badge');
                    if (badge) badge.innerText = "0건";

                    if (typeof showToast === "function") showToast("화면이 초기화되었습니다.", "info");
                };

                // 회사그룹 변경 이벤트: 해당 회사의 기준일자를 비동기로 조회하여 달력 갱신
                pane.onCorpGrChange = function () {
                    var corpGr = getFilterCorpGr();

                    // corp_gr != '2402'인 경우 엑세스 쿠키에 있는 현재 영업일을 즉시 반영
                    if (corpGr !== '2402') {
                        var cookieDate = getCookieWorkDate();
                        if (cookieDate) {
                            var filterYmdInput = pane.querySelector('#filterYmd');
                            if (filterYmdInput) {
                                filterYmdInput.value = cookieDate;
                            }
                        }
                    }

                    fetch("/api/daily/ja010h1/workdate?corpGr=" + encodeURIComponent(corpGr))
                        .then(function (res) { return res.json(); })
                        .then(function (data) {
                            if (data && data.workDate) {
                                var filterYmdInput = pane.querySelector('#filterYmd');
                                if (filterYmdInput) {
                                    filterYmdInput.value = data.workDate;
                                }
                            }
                            initDddw();
                        })
                        .catch(function (err) {
                            console.warn("[w_ja010h1] 회사 기준일자 조회 오류:", err);
                            initDddw();
                        });
                };

                // eb_direct_retrieve = true 파워빌더 명세 반영: 화면 진입 시 자동 조회
                setTimeout(function () {
                    loadFunds();
                }, 150);
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", startInit);
            } else {
                startInit();
            }
        })();
    </script>
</div>
</html>

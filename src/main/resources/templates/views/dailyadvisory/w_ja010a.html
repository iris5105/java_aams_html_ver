<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-split ja010a-container" th:fragment="ja010aView">

    <!-- Top Action Control Bar (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <!-- Reusable Common Toolbar Buttons Fragment (닫기 ~ 엑셀) -->
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <!-- Reusable Common Breadcrumb Fragment -->
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- Split Master-Detail Layout (Vertical Split: Upper Master, Lower History Detail) -->
    <div class="layout-split-v split-body" data-split-key="W_JA010A" data-default-ratio="50:50">

        <!-- Upper Master Grid Section (dw_list / d_ja010a1.srd / SZX0AA) -->
        <div class="pane-top master-section">
            <div class="pane-header">
                <span><i class="fa-solid fa-list-check"></i> 회사별 수익율기능 설정 목록</span>
            </div>
            <div class="pane-body">
                <div id="master-grid" class="tabulator-aams-grid" style="height: 100%;"></div>
            </div>
        </div>

        <!-- Lower Split Panels (dw_detail / d_ja010a2.srd / SZX0AB) -->
        <div class="pane-bottom detail-section">
            <div class="pane-header" style="display: flex; justify-content: space-between; align-items: center;">
                <span><i class="fa-solid fa-file-contract"></i> 회사 계약 및 변경 이력</span>
                <button type="button" id="btnDetailAdd" class="btn btn-sm btn-outline-primary" style="padding: 2px 8px; font-size: 12px; cursor: pointer;">
                    <i class="fa-solid fa-plus"></i> 변경이력 추가
                </button>
            </div>
            <div class="pane-body">
                <div id="grid-ja010a-detail" class="tabulator-aams-grid" style="height: 100%;"></div>
            </div>
        </div>

    </div>

    <!-- Inline Script for Ja010a View with Tabulator Grids -->
    <script th:inline="javascript">
        (function() {
            const currentScript = document.currentScript;
            const pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;

            let gridMaster = null;
            let gridDetail = null;
            let cudManagerMaster = null;
            let cudManagerDetail = null;

            const initialMasterData = /*[[${masterList}]]*/ [];

            function formatDepositDd(val) {
                if (val == null || val === "") return "";
                const str = String(val).trim();
                if (str === "5") return "5영업일";
                if (str === "7") return "7영업일";
                return str + "영업일";
            }

            function formatDateVal(val) {
                if (!val) return "";
                const clean = String(val).replace(/\D/g, "");
                if (clean.length >= 8) {
                    return clean.substring(0, 4) + '.' + clean.substring(4, 6) + '.' + clean.substring(6, 8);
                }
                const str = String(val).trim();
                if (str.length >= 10) {
                    return str.substring(0, 10).replace(/[-/]/g, ".");
                }
                return str;
            }

            function formatIdno(val) {
                if (!val) return "";
                const clean = String(val).replace(/\D/g, "");
                if (clean.length === 10) {
                    return clean.substring(0, 3) + "-" + clean.substring(3, 5) + "-" + clean.substring(5, 10);
                }
                return val;
            }

            // 1. Initialize Master Tabulator Grid (d_ja010a1 / SZX0AA)
            function initMasterGrid() {
                const container = pane ? pane.querySelector("#master-grid") : document.getElementById("master-grid");
                if (!container) return;

                gridMaster = new Tabulator(container, {
                    data: initialMasterData || [],
                    layout: "fitDataFill",
                    height: "100%",
                    selectableRows: 1,
                    placeholder: "<span>조회된 회사 기본 정보가 없습니다.</span>",
                    columnDefaults: { vertAlign: "middle", headerSortTristate: true },
                    columns: [
                        { title: "No.", formatter: "rownum", hozAlign: "center", width: 45, resizable: false, widthGrow: 0 },
                        { 
                            title: "회사코드", 
                            field: "corpGr", 
                            hozAlign: "center", 
                            width: 80, 
                            editor: "input",
                            editable: (cell) => !cell.getValue() || cell.getRow().getData().isNew,
                            cellClick: aamsCellEdit
                        },
                        { title: "회사명", field: "companyName", minWidth: 140, hozAlign: "left", editor: "input", cellClick: aamsCellEdit },
                        { 
                            title: "입금<br/>영업일수", 
                            field: "depositDd", 
                            hozAlign: "center", 
                            width: 95, 
                            formatter: cell => formatDepositDd(cell.getValue()),
                            editor: "list",
                            editorParams: {
                                values: [
                                    { label: "5영업일", value: 5 },
                                    { label: "7영업일", value: 7 }
                                ],
                                autocomplete: false,
                                listOnEmpty: true
                            },
                            cellClick: aamsCellEdit
                        },
                        { 
                            title: "작업<br/>기준일", 
                            headerCssClass: "col-hdr-blue",
                            field: "hyunYmd", 
                            hozAlign: "center", 
                            width: 95, 
                            formatter: cell => `<span class="cell-text-blue">${formatDateVal(cell.getValue())}</span>`,
                            editor: "input",
                            cellClick: aamsCellEdit
                        },
                        { title: "기준가<br/>계산일", field: "gijungaYmd", hozAlign: "center", width: 95, formatter: cell => formatDateVal(cell.getValue()), editor: "input", cellClick: aamsCellEdit },
                        { title: "관리<br/>시작일", field: "symd", hozAlign: "center", width: 95, formatter: cell => formatDateVal(cell.getValue()), editor: "input", cellClick: aamsCellEdit },
                        { 
                            title: "관리<br/>종료일", 
                            headerCssClass: "col-hdr-red",
                            field: "eymd", 
                            hozAlign: "center", 
                            width: 95, 
                            formatter: cell => `<span class="cell-text-red">${formatDateVal(cell.getValue())}</span>`,
                            editor: "input",
                            cellClick: aamsCellEdit
                        },
                        { title: "전영업일", field: "junyongYmd", hozAlign: "center", width: 95, formatter: cell => formatDateVal(cell.getValue()), editor: "input", cellClick: aamsCellEdit },
                        { title: "익영업일", field: "ikyongYmd", hozAlign: "center", width: 95, formatter: cell => formatDateVal(cell.getValue()), editor: "input", cellClick: aamsCellEdit },
                        { title: "3영업일", field: "thikyongYmd", hozAlign: "center", width: 95, formatter: cell => formatDateVal(cell.getValue()), editor: "input", cellClick: aamsCellEdit },
                        { 
                            title: "수수료<br/>비용처리", 
                            field: "expenseYn", 
                            hozAlign: "center", 
                            width: 90, 
                            formatter: cell => {
                                const isChecked = (cell.getValue() === 'Y');
                                return `<input type="checkbox" ${isChecked ? 'checked' : ''} style="pointer-events: none;" />`;
                            },
                            cellClick: function(e, cell) {
                                const row = cell.getRow();
                                if (row && typeof row.select === 'function' && !row.isSelected()) {
                                    gridMaster.deselectRow();
                                    row.select();
                                    const d = row.getData();
                                    if (d && d.corpGr) fetchJa010aDetail(d.corpGr);
                                }
                                cell.setValue(cell.getValue() === 'Y' ? 'N' : 'Y');
                            }
                        },
                        { 
                            title: "메뉴그룹", 
                            field: "customerGr", 
                            hozAlign: "center", 
                            width: 100,
                            editor: "list",
                            editorParams: {
                                values: ["자산운용", "*자산운용", "자문회사", "*자문회사"],
                                autocomplete: false,
                                listOnEmpty: true
                            },
                            cellClick: aamsCellEdit
                        },
                        { title: "수수료 입금계좌", field: "depositAccount", minWidth: 170, hozAlign: "left", editor: "input", cellClick: aamsCellEdit },
                        { title: "비고", field: "bigo", minWidth: 150, hozAlign: "left", editor: "input", cellClick: aamsCellEdit }
                    ]
                });

                // 마스터 셀 수정 감지 (기존행 update 플래그 설정)
                gridMaster.on("cellEdited", function(cell) {
                    const rowData = cell.getRow().getData();
                    if (!rowData.isNew) {
                        rowData.isUpdated = true;
                    }
                });

                function syncJa010aDetail(row, data) {
                    if (data && data.corpGr) {
                        fetchJa010aDetail(data.corpGr);
                    }
                }

                cudManagerMaster = AamsCudManager.create(gridMaster);

                // 1. AAMS Standard: Register global row selection callback
                setupTabulatorRowSelection(gridMaster, function(row, data) {
                    syncJa010aDetail(row, data);
                });

                // 2. Tabulator standard rowClick fallback
                gridMaster.on("rowClick", function(e, row) {
                    const data = row ? row.getData() : null;
                    syncJa010aDetail(row, data);
                });

                // 3. Tabulator rowSelectionChanged fallback
                gridMaster.on("rowSelectionChanged", function(data, rows) {
                    if (rows && rows.length > 0) {
                        syncJa010aDetail(rows[0], rows[0].getData());
                    }
                });

                // Auto select first row on build
                gridMaster.on("tableBuilt", function() {
                    const rows = gridMaster.getRows();
                    if (rows && rows.length > 0) {
                        rows[0].select();
                        syncJa010aDetail(rows[0], rows[0].getData());
                    }
                });
            }

            // 2. Initialize Detail Tabulator Grid (d_ja010a2 / SZX0AB)
            function initDetailGrid() {
                const container = pane ? pane.querySelector("#grid-ja010a-detail") : document.getElementById("grid-ja010a-detail");
                if (!container) return;

                gridDetail = new Tabulator(container, {
                    layout: "fitColumns",
                    height: "100%",
                    placeholder: "<span>상단 목록에서 항목을 선택하세요.</span>",
                    columnDefaults: { vertAlign: "middle", headerSortTristate: true },
                    columns: [
                        { title: "No.", formatter: "rownum", hozAlign: "center", width: 45, resizable: false, widthGrow: 0 },
                        { title: "계약(변경)일자", field: "ymd", hozAlign: "center", width: 110, formatter: cell => formatDateVal(cell.getValue()), editor: "input", cellClick: aamsCellEdit },
                        { title: "회사명", field: "companyName", minWidth: 140, hozAlign: "left", editor: "input", cellClick: aamsCellEdit },
                        { title: "사업자등록번호", field: "idno", hozAlign: "center", width: 125, formatter: cell => formatIdno(cell.getValue()), editor: "input", cellClick: aamsCellEdit },
                        { title: "계약일자", field: "contractYmd", hozAlign: "center", width: 105, formatter: cell => formatDateVal(cell.getValue()), editor: "input", cellClick: aamsCellEdit },
                        { title: "대표자명", field: "ceoNm", hozAlign: "center", width: 110, editor: "input", cellClick: aamsCellEdit },
                        { title: "대표전화번호", field: "telNo", hozAlign: "center", width: 120, editor: "input", cellClick: aamsCellEdit },
                        { title: "팩스번호", field: "faxNo", hozAlign: "center", width: 120, editor: "input", cellClick: aamsCellEdit },
                        { title: "E-Mail 주소", field: "email", minWidth: 150, hozAlign: "left", editor: "input", cellClick: aamsCellEdit },
                        { title: "우편번호", field: "post", hozAlign: "center", width: 80, editor: "input", cellClick: aamsCellEdit },
                        { title: "주소", field: "juso", minWidth: 200, hozAlign: "left", editor: "input", cellClick: aamsCellEdit }
                    ]
                });

                cudManagerDetail = AamsCudManager.create(gridDetail);

                // 하단 변경이력 추가 버튼 이벤트
                const btnDetailAdd = pane ? pane.querySelector("#btnDetailAdd") : document.getElementById("btnDetailAdd");
                if (btnDetailAdd) {
                    btnDetailAdd.addEventListener("click", function() {
                        const selectedRows = gridMaster ? gridMaster.getSelectedRows() : [];
                        if (selectedRows.length === 0) {
                            if (typeof showToast === "function") showToast("상단에서 회사를 먼저 선택해주세요.", "warning");
                            return;
                        }
                        const masterData = selectedRows[0].getData();
                        const todayStr = (new Date()).toISOString().slice(0, 10);

                        cudManagerDetail.addRow({
                            isNew: true,
                            isUpdated: false,
                            corpGr: masterData.corpGr,
                            companyName: masterData.companyName || "",
                            ymd: todayStr,
                            contractYmd: null,
                            idno: null,
                            ceoNm: null,
                            telNo: null,
                            faxNo: null,
                            email: null,
                            post: null,
                            juso: null
                        }, true).then(function(row) {
                            if (row) row.select();
                        });
                    });
                }
            }

            // Global functions for controller integration
            window.loadJa010aMaster = function(targetCorpGr) {
                lastLoadedMasterKey = null;
                const filterSelect = pane ? pane.querySelector("#filterCorpGr") : document.getElementById("filterCorpGr");
                const corpGr = targetCorpGr != null ? targetCorpGr : (filterSelect ? filterSelect.value : "");

                fetch('/api/company/ja010a/master')
                    .then(res => res.json())
                    .then(data => {
                        if (gridMaster) {
                            const formatted = cudManagerMaster ? cudManagerMaster.formatData(data) : (Array.isArray(data) ? data : []);
                            gridMaster.setData(formatted);
                            if (Array.isArray(formatted) && formatted.length > 0) {
                                setTimeout(() => {
                                    const rows = gridMaster.getRows();
                                    let targetRow = null;
                                    if (corpGr) {
                                        rows.forEach(r => {
                                            if (r.getData().corpGr === corpGr) targetRow = r;
                                        });
                                    }
                                    if (!targetRow && rows.length > 0) targetRow = rows[0];

                                    if (targetRow) {
                                        gridMaster.deselectRow();
                                        targetRow.select();
                                        const d = targetRow.getData();
                                        if (d.corpGr) fetchJa010aDetail(d.corpGr);
                                    }
                                }, 100);
                            } else {
                                if (gridDetail) gridDetail.setData([]);
                            }
                        }
                    })
                    .catch(err => console.error("Error loading master ja010a:", err));
            };

            let lastLoadedMasterKey = null;
            function fetchJa010aDetail(corpGr) {
                if (!corpGr || lastLoadedMasterKey === corpGr) return;
                lastLoadedMasterKey = corpGr;
                fetch(`/api/company/ja010a/detail?corpGr=${encodeURIComponent(corpGr)}`)
                    .then(res => res.json())
                    .then(data => {
                        if (gridDetail) {
                            const formatted = cudManagerDetail ? cudManagerDetail.formatData(data) : (Array.isArray(data) ? data : []);
                            gridDetail.setData(formatted);
                        }
                    })
                    .catch(err => console.error("Error fetching ja010a detail:", err));
            }

            // Register standard toolbar & CorpGr contract (Guideline 8 & 9)
            if (pane) {
                pane.onSearch = function() { window.loadJa010aMaster(); };
                pane.onRetrieve = function() { window.loadJa010aMaster(); };

                // [입력] 버튼: 마스터 회사 신규 행 추가
                pane.onInput = function() {
                    fetch('/api/company/ja010a/next-corp-gr')
                        .then(res => res.json())
                        .then(resData => {
                            const nextCode = (resData && resData.nextCorpGr) ? resData.nextCorpGr : "";
                            const todayStr = (new Date()).toISOString().slice(0, 10);
                            const initial = {
                                isNew: true,
                                isUpdated: false,
                                corpGr: nextCode,
                                companyName: "신규생성회사명",
                                depositDd: 5,
                                hyunYmd: null,
                                gijungaYmd: null,
                                symd: todayStr,
                                eymd: null,
                                junyongYmd: null,
                                ikyongYmd: null,
                                thikyongYmd: null,
                                expenseYn: null,
                                customerGr: "자문회사",
                                depositAccount: null,
                                bigo: null
                            };
                            const addPromise = cudManagerMaster ? cudManagerMaster.addRow(initial, true) : gridMaster.addRow(initial, true);
                            addPromise.then(function(row) {
                                if (row) {
                                    gridMaster.deselectRow();
                                    row.select();
                                    syncJa010aDetail(row, row.getData());
                                }
                            });
                        })
                        .catch(err => {
                            console.error("다음 회사코드 조회 실패:", err);
                        });
                };

                // [삭제] 버튼: 선택된 행 큐 반영 삭제
                pane.onDelete = function() {
                    const selDetail = gridDetail ? gridDetail.getSelectedRows() : [];
                    if (selDetail.length > 0) {
                        if (confirm("선택한 변경이력 행을 삭제하시겠습니까?")) {
                            if (cudManagerDetail) {
                                cudManagerDetail.deleteRow(selDetail[0]).then(function() {
                                    if (typeof showToast === "function") showToast("변경이력 행이 삭제 대기열에 등록되었습니다.", "info");
                                });
                            } else {
                                selDetail[0].delete();
                            }
                        }
                        return;
                    }
                    const selMaster = gridMaster ? gridMaster.getSelectedRows() : [];
                    if (selMaster.length > 0) {
                        if (confirm("선택한 회사 행을 삭제하시겠습니까? (저장 시 최종 삭제)")) {
                            if (cudManagerMaster) {
                                cudManagerMaster.deleteRow(selMaster[0]).then(function() {
                                    if (typeof showToast === "function") showToast("회사 행이 삭제 대기열에 등록되었습니다.", "info");
                                });
                            } else {
                                selMaster[0].delete();
                            }
                        }
                        return;
                    }
                    if (typeof showToast === "function") showToast("삭제할 행을 선택하세요.", "warning");
                };

                // [저장] 버튼: CUD 큐 4대 원칙 반영 일괄 저장
                pane.onSave = function() {
                    const masterChanges = cudManagerMaster ? cudManagerMaster.getChanges() : { itemList: [], deletedList: [] };
                    const detailChanges = cudManagerDetail ? cudManagerDetail.getChanges() : { itemList: [], deletedList: [] };

                    if (!masterChanges.hasChanges && !detailChanges.hasChanges) {
                        if (typeof showToast === "function") showToast("저장할 변경사항이 없습니다.", "info");
                        return;
                    }

                    const payload = {
                        masterList: masterChanges.itemList,
                        detailList: detailChanges.itemList,
                        deletedMasterList: masterChanges.deletedList,
                        deletedDetailList: detailChanges.deletedList
                    };

                    fetch('/api/company/ja010a/save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    })
                    .then(res => res.json())
                    .then(resData => {
                        if (resData && resData.success) {
                            if (cudManagerMaster) cudManagerMaster.reset();
                            if (cudManagerDetail) cudManagerDetail.reset();
                            if (typeof showToast === "function") showToast(resData.message || "정상적으로 저장되었습니다.", "success");
                            const selectedRows = gridMaster ? gridMaster.getSelectedRows() : [];
                            const curCorpGr = selectedRows.length > 0 ? selectedRows[0].getData().corpGr : "";
                            window.loadJa010aMaster(curCorpGr);
                        } else {
                            const msg = (resData && resData.message) ? resData.message : "저장에 실패했습니다.";
                            if (typeof showToast === "function") showToast(msg, "error");
                        }
                    })
                    .catch(err => {
                        console.error("저장 오류:", err);
                        if (typeof showToast === "function") showToast("저장 중 통신 오류가 발생했습니다.", "error");
                    });
                };

                // 조회 버튼이 없고 새로고침만 있는 화면 규격: 새로고침 시 화면 데이터를 재조회
                pane.onRefresh = function() {
                    if (cudManagerMaster) cudManagerMaster.reset();
                    if (cudManagerDetail) cudManagerDetail.reset();
                    lastLoadedMasterKey = null;
                    const selectedRows = gridMaster ? gridMaster.getSelectedRows() : [];
                    const curCorpGr = selectedRows.length > 0 ? selectedRows[0].getData().corpGr : "";
                    window.loadJa010aMaster(curCorpGr);
                    if (typeof showToast === "function") showToast("화면 데이터를 새로고침했습니다.", "info");
                };
                pane.onCorpGrChange = function(val) {
                    lastLoadedMasterKey = null;
                };
                pane.addEventListener("corpGrChanged", function(e) {
                    lastLoadedMasterKey = null;
                });
            }

            // Guideline 10: Single initialization entry point with isInitialized guard
            let isInitialized = false;
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;
                initMasterGrid();
                initDetailGrid();

                // eb_direct_retrieve = true 명세 반영 자동 조회
                setTimeout(() => {
                    window.loadJa010aMaster();
                }, 100);
            }

            document.addEventListener("DOMContentLoaded", startInit);
            if (document.readyState === "complete" || document.readyState === "interactive") {
                setTimeout(startInit, 50);
            }
        })();
    </script>
</div>
</html>

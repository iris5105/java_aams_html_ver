<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-single run-container" th:fragment="runView" style="display: flex; flex-direction: column; height: 100%; width: 100%; overflow: hidden; background-color: #ffffff;">

    <style>
        .run-container {
            font-size: 12px;
        }

        /* 1. 상단 공통 툴바 */
        .run-container .view-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            background: #f8fafc;
            border-bottom: 1px solid #cbd5e1;
            min-height: 34px;
            flex-shrink: 0;
        }

        /* 2. 상단 필터바 */
        .run-container .filter-bar {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 6px 12px;
            background-color: #ffffff;
            border-bottom: 1px solid #cbd5e1;
            gap: 16px;
            flex-wrap: nowrap;
            flex-shrink: 0;
        }

        .run-container .filter-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .run-container .filter-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .run-container .filter-item label {
            font-size: 12px;
            font-weight: 500;
            color: #334155;
            white-space: nowrap;
            margin: 0;
        }

        .run-container .range-calendar-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .run-container .filter-input {
            height: 26px;
            width: 95px;
            padding: 2px 6px;
            font-size: 12px;
            text-align: center;
            border: 1px solid #94a3b8;
            border-radius: 2px;
            background-color: #ffffff;
            color: #0f172a;
        }

        .run-container .range-calendar-separator {
            color: #64748b;
            font-size: 12px;
        }

        .run-container .btn-range-calendar {
            height: 26px;
            width: 26px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #94a3b8;
            border-radius: 2px;
            background: #f1f5f9;
            color: #475569;
            cursor: pointer;
        }
        .run-container .btn-range-calendar:hover {
            background: #e2e8f0;
            color: #1e293b;
        }

        .run-container .filter-select {
            height: 26px;
            min-width: 150px;
            padding: 2px 6px;
            font-size: 12px;
            border: 1px solid #94a3b8;
            border-radius: 2px;
            background-color: #ffffff;
            color: #0f172a;
        }

        /* 이미지 전용 액션 버튼 스타일 (파란색 테두리/텍스트, 흰 배경) */
        .run-container .btn-run-action {
            height: 26px;
            padding: 0 16px;
            font-size: 12px;
            font-weight: 500;
            color: #2563eb;
            background-color: #ffffff;
            border: 1px solid #3b82f6;
            border-radius: 2px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            transition: all 0.15s ease-in-out;
        }
        .run-container .btn-run-action:hover {
            background-color: #eff6ff;
            border-color: #1d4ed8;
            color: #1d4ed8;
        }
        .run-container .btn-run-action:active {
            background-color: #dbeafe;
        }
        .run-container .btn-run-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* 3. 메인 그리드 섹션 */
        .run-container .grid-section {
            flex: 1 1 auto;
            height: calc(100% - 75px);
            width: 100%;
            padding: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .run-container .grid-table-wrapper {
            flex: 1 1 auto;
            height: 100%;
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            overflow: hidden;
            background: #ffffff;
        }

        /* 완료 체크박스 스타일 */
        .run-container .run-checkbox {
            width: 15px;
            height: 15px;
            cursor: default;
            accent-color: #2563eb;
            margin: 0;
            vertical-align: middle;
        }

        /* 공통 dc_ftymd_dddw 프래그먼트 내부 정렬 */
        .run-container .filter-dc-ftymd-dddw {
            display: inline-flex !important;
            align-items: center !important;
            justify-content: flex-start !important;
            gap: 16px !important;
            background: transparent !important;
            border: none !important;
            padding: 0 !important;
            min-height: auto !important;
        }
    </style>

    <!-- 1. 상단 공통 툴바 (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- 2. 필터바 (Row 2: 이미지와 100% 동일한 영업일자구간, 작업회사, 원장생성, 에러메세지CLEAR) -->
    <div class="filter-bar">
        <div class="filter-left">
            <th:block th:replace="~{fragments/filter/dc_ftymd_dddw :: filter(labelFYmd='영업일자구간', labelDddw='작업회사')}"></th:block>
        </div>

        <!-- 이미지 우측 액션 버튼 (원장생성, 에러메세지CLEAR) -->
        <div class="filter-actions d-flex align-items-center gap-2 ms-2">
            <button type="button" id="btnExecuteRun" class="btn-run-action">
                원장생성
            </button>
            <button type="button" id="btnClearError" class="btn-run-action">
                에러메세지CLEAR
            </button>
        </div>

        <!-- 실행 진행 상태 표시 (작업 중에만 작게 표출) -->
        <div id="runProgressAlert" class="small text-primary d-none ms-auto me-2">
            <span id="runProgressText"><i class="fa-solid fa-spinner fa-spin me-1"></i> 진행 중...</span>
        </div>
    </div>

    <!-- 3. 메인 그리드 섹션 (d_run.srd) -->
    <div class="grid-section">
        <div class="grid-table-wrapper">
            <div id="run-grid" class="tabulator-aams-grid" style="height: 100%; width: 100%;"></div>
        </div>
    </div>

    <script th:src="@{/js/f_dddwctl.js}" src="/js/f_dddwctl.js"></script>
    <script th:src="@{/js/aams_calendar.js}" src="/js/aams_calendar.js"></script>
    <script th:inline="javascript">
        (function () {
            var pane = document.currentScript.closest('.tab-pane') || document;
            var grid = null;
            var isInitialized = false;
            var isRunning = false;

            function getFilterCorpGr() {
                var el = pane.querySelector('#filterDddw') || pane.querySelector('#corpGrSelect') || document.querySelector('#corpGrSelect');
                if (el && el.value) return el.value;
                if (typeof g_corp_gr !== 'undefined' && g_corp_gr) return g_corp_gr;
                return '';
            }

            function getFilterFymd() {
                var el = pane.querySelector('#filterFYmd');
                if (el && el.value) return el.value.replace(/[^0-9]/g, '');
                return (new Date()).toISOString().slice(0, 10).replace(/-/g, '');
            }

            function getFilterTymd() {
                var el = pane.querySelector('#filterTYmd');
                if (el && el.value) return el.value.replace(/[^0-9]/g, '');
                return (new Date()).toISOString().slice(0, 10).replace(/-/g, '');
            }

            function initDefaultDates() {
                var fEl = pane.querySelector('#filterFYmd');
                var tEl = pane.querySelector('#filterTYmd');
                var today = new Date();
                var yyyy = today.getFullYear();
                var mm = ('0' + (today.getMonth() + 1)).slice(-2);
                var dd = ('0' + today.getDate()).slice(-2);
                var formatted = yyyy + '.' + mm + '.' + dd;

                if (fEl && !fEl.value) fEl.value = formatted;
                if (tEl && !tEl.value) tEl.value = formatted;
            }

            // DDDW 초기화: f_dddwctl (dw_c, 'dddw | corp_gr', gaa.corp_gr, '', 1, "")
            function initDddw() {
                var dddwSelect = pane.querySelector('#filterDddw');
                if (!dddwSelect) return;

                var globalCorpGr = (typeof g_corp_gr !== 'undefined' && g_corp_gr) ? g_corp_gr : '';
                if (!globalCorpGr) {
                    var mainSelect = document.querySelector('#corpGrSelect');
                    if (mainSelect && mainSelect.value) globalCorpGr = mainSelect.value;
                }

                if (typeof window.f_dddwctl === 'function') {
                    window.f_dddwctl('dddw | corp_gr', globalCorpGr, '', 1, '').then(function (options) {
                        if (options && options.length > 0) {
                            dddwSelect.innerHTML = '';
                            options.forEach(function (opt) {
                                var optEl = document.createElement('option');
                                var code = opt.code || opt.cd || '';
                                var name = opt.name || opt.nm || opt.dscr || code;
                                optEl.value = code;
                                optEl.textContent = name;
                                dddwSelect.appendChild(optEl);
                            });

                            if (globalCorpGr) {
                                dddwSelect.value = globalCorpGr;
                            }
                        }
                    }).catch(function (e) {
                        console.warn('[w_run] f_dddwctl load error:', e);
                    });
                }
            }

            // 그리드 초기화: d_run.srd 명세 및 첨부 이미지 100% 일치
            function initGrid() {
                var gridEl = pane.querySelector('#run-grid');
                if (!gridEl) return;

                grid = new Tabulator(gridEl, {
                    height: "100%",
                    layout: "fitColumns",
                    selectable: 1,
                    data: [],
                    columns: [
                        { 
                            title: "No.", 
                            formatter: "rownum", 
                            width: 50, 
                            hozAlign: "center", 
                            headerHozAlign: "center" 
                        },
                        { 
                            title: "프로그램ID", 
                            field: "pgmId", 
                            width: 120, 
                            hozAlign: "center", 
                            headerHozAlign: "center" 
                        },
                        { 
                            title: "프로그램명", 
                            field: "pgmNm", 
                            width: 250, 
                            hozAlign: "left", 
                            headerHozAlign: "center" 
                        },
                        {
                            title: "완료",
                            field: "flag",
                            width: 60,
                            hozAlign: "center",
                            headerHozAlign: "center",
                            formatter: function (cell) {
                                var val = cell.getValue();
                                var isChecked = (val === 'Y' || val === true || val === '1');
                                return '<input type="checkbox" disabled ' + (isChecked ? 'checked' : '') + ' class="run-checkbox">';
                            }
                        },
                        {
                            title: "오류 메세지",
                            field: "errMsg",
                            minWidth: 400,
                            hozAlign: "left",
                            headerHozAlign: "center",
                            formatter: function (cell) {
                                var val = cell.getValue() || '';
                                var rowData = cell.getRow().getData();
                                if (rowData && rowData.flag === 'N') {
                                    return '<span style="color: #dc2626; font-weight: 600;">' + val + '</span>';
                                }
                                return val;
                            }
                        }
                    ]
                });

                // 개발 지침 규칙 8번 삼중 안전망
                if (typeof setupTabulatorRowSelection === "function") {
                    setupTabulatorRowSelection(grid);
                }
                grid.on("rowClick", function (e, row) {
                    if (row && (!row.isSelected || !row.isSelected())) {
                        row.select();
                    }
                });
            }

            function loadPrograms() {
                fetch("/api/daily/run/programs")
                    .then(function (res) { return res.json(); })
                    .then(function (data) {
                        if (grid) {
                            grid.setData(data || []).then(function () {
                                var rows = grid.getRows();
                                if (rows && rows.length > 0) {
                                    rows[0].select();
                                }
                            });
                        }
                    })
                    .catch(function (err) {
                        console.error("[w_run] 프로그램 목록 조회 실패:", err);
                        if (typeof showToast === "function") showToast("조회 중 오류가 발생했습니다.", "error");
                    });
            }

            function formatDate(d) {
                var yyyy = d.getFullYear();
                var mm = ('0' + (d.getMonth() + 1)).slice(-2);
                var dd = ('0' + d.getDate()).slice(-2);
                return yyyy + '.' + mm + '.' + dd;
            }

            function parseYmd(ymdStr) {
                var clean = ymdStr.replace(/[^0-9]/g, '');
                var y = parseInt(clean.substring(0, 4), 10);
                var m = parseInt(clean.substring(4, 6), 10) - 1;
                var d = parseInt(clean.substring(6, 8), 10);
                return new Date(y, m, d);
            }

            async function executeRun() {
                if (isRunning) return;

                var corpGr = getFilterCorpGr();
                var fymdStr = getFilterFymd();
                var tymdStr = getFilterTymd();

                if (!corpGr) {
                    if (typeof showToast === "function") showToast("작업회사를 선택해주세요.", "warning");
                    return;
                }

                if (fymdStr > tymdStr) {
                    alert("작업 시작일이 종료일보다 큽니다.");
                    return;
                }

                if (!confirm("원장생성 작업을 실행하시겠습니까?\n작업회사: " + corpGr + "\n작업구간: " + fymdStr + " ~ " + tymdStr)) {
                    return;
                }

                isRunning = true;
                var progressAlert = pane.querySelector('#runProgressAlert');
                var progressText = pane.querySelector('#runProgressText');
                if (progressAlert) progressAlert.classList.remove('d-none');

                var btnRun = pane.querySelector('#btnExecuteRun');
                if (btnRun) btnRun.disabled = true;

                var startDate = parseYmd(fymdStr);
                var endDate = parseYmd(tymdStr);
                var currentDate = new Date(startDate.getTime());

                var rows = grid.getRows();
                var totalSteps = rows.length;
                var stoppedOnError = false;

                try {
                    while (currentDate <= endDate) {
                        var ymdFormatted = formatDate(currentDate);

                        for (var i = 0; i < totalSteps; i++) {
                            var row = rows[i];
                            var data = row.getData();
                            row.select();

                            if (progressText) {
                                progressText.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i> ' + ymdFormatted + '일 작업 진행 중... [' + (i + 1) + '/' + totalSteps + '] ' + data.pgmNm;
                            }

                            var resp = await fetch("/api/daily/run/execute-step", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    corpGr: corpGr,
                                    ymd: ymdFormatted,
                                    pgmId: data.pgmId,
                                    pgmNm: data.pgmNm
                                })
                            });

                            var result = await resp.json();

                            if (result.success) {
                                row.update({
                                    flag: 'Y',
                                    errMsg: ymdFormatted + '일 작업을 완료했습니다.'
                                });
                            } else {
                                row.update({
                                    flag: 'N',
                                    errMsg: result.outMsg || result.message
                                });
                                alert(data.pgmId + " " + data.pgmNm + "\n실행에러 메세지 = [" + (result.outMsg || result.message) + "]");
                                stoppedOnError = true;
                                break;
                            }
                        }

                        if (stoppedOnError) break;
                        currentDate.setDate(currentDate.getDate() + 1);
                    }

                    if (!stoppedOnError) {
                        var checkResp = await fetch("/api/daily/run/check-results?corpGr=" + encodeURIComponent(corpGr));
                        var checkList = await checkResp.json();
                        var checkText = "";
                        if (checkList && checkList.length > 0) {
                            checkText = "\n\n[점검 결과]\n" + checkList.map(function (c) { return c.errMsg; }).join("\n");
                        }

                        if (progressText) {
                            progressText.innerHTML = '<i class="fa-solid fa-circle-check text-success me-1"></i> 원장생성 작업 완료';
                        }
                        alert("원장생성 작업 완료!" + checkText);
                    } else {
                        if (progressText) {
                            progressText.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-danger me-1"></i> 원장생성 작업 오류 중단';
                        }
                    }
                } catch (err) {
                    console.error("[w_run] 원장생성 중 오류:", err);
                    alert("원장생성 처리 중 예외 발생: " + err.message);
                } finally {
                    isRunning = false;
                    if (btnRun) btnRun.disabled = false;
                }
            }

            function clearError() {
                if (!confirm("오류메세지를 모두 삭제(CLEAR)하시겠습니까?")) return;

                fetch("/api/daily/run/clear-error", { method: "POST" })
                    .then(function (res) { return res.json(); })
                    .then(function (res) {
                        if (res.success) {
                            if (typeof showToast === "function") showToast(res.message || "삭제 완료", "success");
                            else alert(res.message || "삭제 완료");
                            loadPrograms();
                        } else {
                            if (typeof showToast === "function") showToast("삭제 실패: " + res.message, "error");
                            else alert("삭제 실패: " + res.message);
                        }
                    })
                    .catch(function (err) {
                        console.error("[w_run] 오류메세지 삭제 실패:", err);
                    });
            }

            function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                initDefaultDates();

                // AAMS Range Calendar 초기화
                if (window.AamsCalendar && typeof window.AamsCalendar.initRange === 'function') {
                    window.AamsCalendar.initRange('filterFYmd', 'filterTYmd', {
                        pane: pane,
                        onSelect: function (fYmd, tYmd) {
                            loadPrograms();
                        }
                    });
                }

                initDddw();
                initGrid();

                var btnRun = pane.querySelector('#btnExecuteRun');
                if (btnRun) btnRun.addEventListener('click', executeRun);

                var btnClear = pane.querySelector('#btnClearError');
                if (btnClear) btnClear.addEventListener('click', clearError);

                // 상단 공통 툴바 표준 계약 (규칙 9)
                pane.onSearch = function () {
                    loadPrograms();
                };
                pane.onRetrieve = function () {
                    loadPrograms();
                };
                pane.onCorpGrChange = function () {
                    initDddw();
                    loadPrograms();
                };
                pane.onRefresh = function () {
                    if (grid) grid.clearData();
                    initDefaultDates();
                    if (typeof showToast === "function") {
                        showToast("화면이 초기화되었습니다.", "info");
                    }
                };

                setTimeout(function () {
                    loadPrograms();
                }, 100);
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", startInit);
            } else {
                startInit();
            }
        })();
    </script>
</div>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-single sjt0tg-container" th:fragment="sjt0tgView">

    <!-- Top Action Control Bar (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <!-- Reusable Common Toolbar Buttons Fragment (닫기, 새로고침, 조회, 입력, 저장, 삭제, 엑셀) -->
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <!-- Reusable Common Breadcrumb Fragment -->
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- Filter Bar (Row 2): Rule 14 & Rule 17 - dc_ymd fragment matching dw_c in w_sjt0tg.srw -->
    <div class="filter-bar">
        <div class="filter-left">
            <div th:replace="~{fragments/filter/dc_ymd :: filter(label='종가일자')}"></div>
        </div>

        <!-- Sub Action Buttons (종가LOAD - cb_1 in w_sjt0tg.srw) -->
        <div class="filter-actions sjt0tg-action-buttons">
            <input type="file" id="sjt0tgExcelFileInput" accept=".xls,.xlsx,.csv" style="display: none;" />
            <button type="button" id="btnLoadCloseExcel" class="t-btn btn-action" style="background: #2563eb; color: #ffffff; border-color: #1d4ed8;" title="엑셀 파일로부터 종가를 로드합니다.">
                <i class="fa-solid fa-file-excel"></i> 종가LOAD
            </button>
        </div>
    </div>

    <!-- Main Grid Section (d_sjt0tg.srd / SJT0TG) -->
    <div class="grid-section" style="flex: 1 1 auto; height: calc(100% - 90px); padding: 8px 12px; overflow: hidden; display: flex; flex-direction: column;">
        <div class="grid-table-wrapper" style="flex: 1 1 auto; height: 100%; width: 100%; border: 1px solid #cbd5e1; border-radius: 4px; overflow: hidden; background-color: #fff;">
            <div id="sjt0tg-grid" class="tabulator-aams-grid" style="height: 100%;"></div>
        </div>
    </div>

    <!-- SheetJS for Excel Reading (cb_1 client parsing) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- Pure JS AAMS Calendar Component (Rule 16) -->
    <script th:src="@{/js/aams_calendar.js}" src="/js/aams_calendar.js"></script>

    <!-- Dynamic Code Search Component (u_dynamiccodesearch) -->
    <script th:src="@{/js/dynamic_code_search.js}" src="/js/dynamic_code_search.js"></script>

    <!-- Page Specific Script for w_sjt0tg -->
    <script th:inline="javascript">
        (function() {
            const currentScript = document.currentScript;
            const pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;

            let gridSjt0tg = null;
            let isInitialized = false;
            let lastYmd = null;
            let lastCorpGr = null;
            let deletedList = [];

            // Corporate Group Resolver (Guideline 1: No default hardcoded value)
            function resolveCorpGr() {
                if (window.currentCorpGr) return window.currentCorpGr;
                const m = document.cookie.match(/(^|;)\s*savedCorpGr=([^;]+)/) || document.cookie.match(/(^|;)\s*corpGr=([^;]+)/);
                if (m) return decodeURIComponent(m[2]);
                const selectEl = pane ? pane.querySelector("#filterCorpGr") : document.getElementById("filterCorpGr");
                if (selectEl && selectEl.value) return selectEl.value;
                const globalSelect = document.getElementById("topCorpGrSelect") || document.getElementById("filterCorpGr");
                if (globalSelect && globalSelect.value) return globalSelect.value;
                return "";
            }

            function getFilterYmd() {
                const input = pane ? pane.querySelector("#filterYmd") : document.getElementById("filterYmd");
                if (!input) return "";
                let val = input.value || "";
                return val.replace(/\./g, '-');
            }

            // Tabulator Formatter Utilities
            function numberFormatter(cell) {
                const val = cell.getValue();
                if (val === null || val === undefined || val === "") return "";
                const num = Number(val);
                if (isNaN(num)) return val;
                return num.toLocaleString('ko-KR');
            }

            function changeFormatter(cell) {
                const val = cell.getValue();
                if (val === null || val === undefined || val === "") return "";
                const num = Number(val);
                if (isNaN(num)) return val;
                const formatted = num.toLocaleString('ko-KR');
                if (num > 0) {
                    return `<span style="color: #ef4444; font-weight: 500;">▲ ${formatted}</span>`;
                } else if (num < 0) {
                    return `<span style="color: #2563eb; font-weight: 500;">▼ ${Math.abs(num).toLocaleString('ko-KR')}</span>`;
                }
                return formatted;
            }

            // Tabulator Columns (Following d_sjt0tg.srd sequence & tab_order)
            const columns = [
                {
                    title: "No.",
                    field: "fseq",
                    width: 55,
                    hozAlign: "center",
                    headerHozAlign: "center",
                    formatter: function(cell) {
                        return cell.getRow().getPosition(true);
                    }
                },
                {
                    title: "종목",
                    field: "koscomCd",
                    width: 100,
                    hozAlign: "center",
                    headerHozAlign: "center",
                    editable: function(cell) {
                        // Guideline Exception 1: 신규 추가된 행만 수정 가능
                        const rowData = cell.getRow().getData();
                        return !!rowData.isNew;
                    },
                    editor: "input"
                },
                // Grid Internal Rule 1, 2: Empty column with dynamic search button
                {
                    title: "",
                    field: "_btn_koscomCd",
                    width: 36,
                    minWidth: 36,
                    maxWidth: 36,
                    hozAlign: "center",
                    headerSort: false,
                    resizable: false,
                    formatter: function(cell) {
                        const isNew = cell.getRow().getData().isNew;
                        const disClass = isNew ? "" : "disabled";
                        return `<button type="button" class="btn-grid-addon btn-search ${disClass}" title="종목 검색"><i class="fa-solid fa-magnifying-glass"></i></button>`;
                    },
                    cellClick: function(e, cell) {
                        e.stopPropagation();
                        const row = cell.getRow();
                        if (!row.getData().isNew) return;
                        openKoscomSearchModal(row);
                    }
                },
                {
                    title: "종목명",
                    field: "xxKoscomCd",
                    width: 220,
                    hozAlign: "left",
                    headerHozAlign: "center",
                    editable: false
                },
                {
                    title: "종가",
                    field: "close",
                    width: 120,
                    hozAlign: "right",
                    headerHozAlign: "center",
                    editable: true,
                    editor: "number",
                    formatter: function(cell) {
                        const val = cell.getValue();
                        const formatted = numberFormatter(cell);
                        return `<span style="color: #dc2626; font-weight: 600;">${formatted}</span>`;
                    },
                    cellEdited: function(cell) {
                        const row = cell.getRow();
                        const data = row.getData();
                        const newClose = Number(cell.getValue()) || 0;
                        const preclose = Number(data.preclose) || 0;
                        const newChange = newClose - preclose;

                        row.update({
                            close: newClose,
                            change: newChange,
                            rowStatus: data.isNew ? 'C' : 'U'
                        });
                    }
                },
                {
                    title: "거래량",
                    field: "volume",
                    width: 110,
                    hozAlign: "right",
                    headerHozAlign: "center",
                    editable: false,
                    formatter: numberFormatter
                },
                {
                    title: "거래대금",
                    field: "value",
                    width: 140,
                    hozAlign: "right",
                    headerHozAlign: "center",
                    editable: false,
                    formatter: numberFormatter
                },
                {
                    title: "전일종가",
                    field: "preclose",
                    width: 110,
                    hozAlign: "right",
                    headerHozAlign: "center",
                    editable: false,
                    formatter: numberFormatter
                },
                {
                    title: "전일대비",
                    field: "change",
                    width: 110,
                    hozAlign: "right",
                    headerHozAlign: "center",
                    editable: false,
                    formatter: changeFormatter
                },
                {
                    title: "액면",
                    field: "aekm",
                    width: 100,
                    hozAlign: "center",
                    headerHozAlign: "center",
                    editable: false,
                    formatter: numberFormatter
                },
                {
                    title: "상장주수",
                    field: "sangjJusu",
                    width: 130,
                    hozAlign: "right",
                    headerHozAlign: "center",
                    editable: true,
                    editor: "number",
                    formatter: numberFormatter,
                    cellEdited: function(cell) {
                        const row = cell.getRow();
                        const data = row.getData();
                        row.update({
                            rowStatus: data.isNew ? 'C' : 'U'
                        });
                    }
                }
            ];

            // 종목 코드 검색 모달 연동
            function openKoscomSearchModal(row) {
                if (typeof openCommonCodeSearchModal === 'function') {
                    openCommonCodeSearchModal({
                        title: "종목 검색",
                        apiEndpoint: "/api/daily/ja010o/funds", // or common search
                        onSelect: function(item) {
                            if (item) {
                                row.update({
                                    koscomCd: item.code || item.koscomCd,
                                    xxKoscomCd: item.name || item.koscomNm,
                                    rowStatus: 'C'
                                });
                            }
                        }
                    });
                } else {
                    const promptVal = prompt("종목코드를 입력해주세요:");
                    if (promptVal) {
                        row.update({
                            koscomCd: promptVal.trim(),
                            rowStatus: 'C'
                        });
                    }
                }
            }

            // Init Tabulator Grid
            function initGrid() {
                const gridEl = pane ? pane.querySelector("#sjt0tg-grid") : document.getElementById("sjt0tg-grid");
                if (!gridEl) return;

                gridSjt0tg = new Tabulator(gridEl, {
                    data: [],
                    layout: "fitColumns",
                    responsiveLayout: false,
                    height: "100%",
                    selectableRows: 1,
                    columns: columns,
                    placeholder: "조회된 종가 내역이 없습니다.",
                    rowClick: function(e, row) {
                        row.select();
                    }
                });

                // Rule 8: Capturing event listener to guarantee row selection on non-editable cells
                gridEl.addEventListener('click', function(e) {
                    const rowEl = e.target.closest('.tabulator-row');
                    if (rowEl && gridSjt0tg) {
                        const rows = gridSjt0tg.getRows();
                        const targetRow = rows.find(r => r.getElement() === rowEl);
                        if (targetRow && !targetRow.isSelected()) {
                            targetRow.select();
                        }
                    }
                }, true);
            }

            // Retrieve Data (wue_retrieve)
            function searchData() {
                const corpGr = resolveCorpGr();
                const ymd = getFilterYmd();

                if (!corpGr) {
                    alert("운용사를 선택하거나 로그인 정보가 필요합니다.");
                    return;
                }
                if (!ymd) {
                    alert("종가일자를 선택해주세요.");
                    return;
                }

                lastCorpGr = corpGr;
                lastYmd = ymd;
                deletedList = [];

                const btnLoad = pane ? pane.querySelector("#btnLoadCloseExcel") : document.getElementById("btnLoadCloseExcel");
                if (btnLoad) btnLoad.disabled = false;

                const url = `/api/daily/sjt0tg/list?corpGr=${encodeURIComponent(corpGr)}&ymd=${encodeURIComponent(ymd)}`;
                fetch(url)
                    .then(res => {
                        if (!res.ok) throw new Error("조회 중 오류 발생: " + res.status);
                        return res.json();
                    })
                    .then(data => {
                        if (gridSjt0tg) {
                            gridSjt0tg.setData(data || []);

                            // Rule 15: 데이터 존재 시 첫 번째 행 자동 선택
                            if (data && data.length > 0) {
                                setTimeout(() => {
                                    const rows = gridSjt0tg.getRows();
                                    if (rows.length > 0) {
                                        rows[0].select();
                                    }
                                }, 50);
                            }
                        }
                    })
                    .catch(err => {
                        console.error("searchData error:", err);
                        alert("조회 실패: " + err.message);
                    });
            }

            // Add Row (Input Contract)
            function addRow() {
                if (!gridSjt0tg) return;
                const corpGr = resolveCorpGr();
                const ymd = getFilterYmd();

                const newRowData = {
                    corpGr: corpGr,
                    ymd: ymd,
                    koscomCd: "",
                    xxKoscomCd: "",
                    close: 0,
                    volume: 0,
                    value: 0,
                    preclose: 0,
                    change: 0,
                    aekm: 0,
                    sangjJusu: 0,
                    isNew: true,
                    rowStatus: "C"
                };

                gridSjt0tg.addRow(newRowData, true).then(row => {
                    row.select();
                    row.scrollIntoView();
                });
            }

            // Delete Row (Delete Contract)
            function deleteRow() {
                if (!gridSjt0tg) return;
                const selectedRows = gridSjt0tg.getSelectedRows();
                if (selectedRows.length === 0) {
                    alert("삭제할 행을 선택해주세요.");
                    return;
                }

                if (!confirm("선택한 행을 삭제하시겠습니까? (저장 시 최종 반영됩니다)")) {
                    return;
                }

                selectedRows.forEach(row => {
                    const data = row.getData();
                    if (!data.isNew) {
                        deletedList.push(data);
                    }
                    row.delete();
                });
            }

            // Save Data (Save Contract)
            function saveData() {
                if (!gridSjt0tg) return;
                const corpGr = resolveCorpGr();
                const ymd = getFilterYmd();

                if (!corpGr || !ymd) {
                    alert("운용사 및 종가일자를 확인해주세요.");
                    return;
                }

                const allRows = gridSjt0tg.getRows();
                const insertList = [];
                const updateList = [];

                for (const row of allRows) {
                    const data = row.getData();
                    if (data.isNew) {
                        if (!data.koscomCd || data.koscomCd.trim() === "") {
                            alert("신규 행의 종목코드를 입력해주세요.");
                            row.select();
                            return;
                        }
                        insertList.push(data);
                    } else if (data.rowStatus === 'U') {
                        updateList.push(data);
                    }
                }

                if (insertList.length === 0 && updateList.length === 0 && deletedList.length === 0) {
                    alert("저장할 변경 내역이 없습니다.");
                    return;
                }

                if (!confirm(`저장하시겠습니까?\n(신규: ${insertList.length}건, 수정: ${updateList.length}건, 삭제: ${deletedList.length}건)`)) {
                    return;
                }

                const savePayload = {
                    corpGr: corpGr,
                    ymd: ymd,
                    insertList: insertList,
                    updateList: updateList,
                    deleteList: deletedList
                };

                fetch("/api/daily/sjt0tg/save", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(savePayload)
                })
                .then(res => res.json())
                .then(res => {
                    if (res.success) {
                        alert(res.message || "저장이 완료되었습니다.");
                        searchData();
                    } else {
                        alert("저장 실패: " + (res.message || "알 수 없는 오류"));
                    }
                })
                .catch(err => {
                    console.error("saveData error:", err);
                    alert("저장 중 통신 오류가 발생했습니다: " + err.message);
                });
            }

            // Excel Export (Excel Contract)
            function exportExcel() {
                if (!gridSjt0tg) return;
                const ymd = getFilterYmd() || "일자미지정";
                gridSjt0tg.download("xlsx", `주식종가_${ymd}.xlsx`, { sheetName: "주식종가" });
            }

            // cb_1: 종가LOAD 엑셀 파일 업로드 및 파싱
            function initExcelLoader() {
                const fileInput = pane ? pane.querySelector("#sjt0tgExcelFileInput") : document.getElementById("sjt0tgExcelFileInput");
                const btnLoad = pane ? pane.querySelector("#btnLoadCloseExcel") : document.getElementById("btnLoadCloseExcel");

                if (btnLoad && fileInput) {
                    btnLoad.addEventListener("click", function() {
                        fileInput.value = "";
                        fileInput.click();
                    });

                    fileInput.addEventListener("change", function(e) {
                        const file = e.target.files[0];
                        if (!file) return;

                        const reader = new FileReader();
                        reader.onload = function(evt) {
                            try {
                                const data = new Uint8Array(evt.target.result);
                                const workbook = XLSX.read(data, { type: 'array' });
                                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                                const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

                                if (!rows || rows.length < 2) {
                                    alert("엑셀 파일에 유효한 데이터가 없습니다.");
                                    return;
                                }

                                parseAndApplyCloseExcel(rows);
                            } catch (err) {
                                console.error("Excel read error:", err);
                                alert("엑셀 파일을 읽는 중 오류가 발생했습니다: " + err.message);
                            }
                        };
                        reader.readAsArrayBuffer(file);
                    });
                }
            }

            // 엑셀 파싱 및 그리드 종가 매핑
            function parseAndApplyCloseExcel(rows) {
                if (!gridSjt0tg) return;
                const currentRows = gridSjt0tg.getRows();
                if (currentRows.length === 0) {
                    alert("조회된 종목 내역이 없습니다. 먼저 [조회]를 진행해주세요.");
                    return;
                }

                // 종목코드 매핑 인덱스 탐색
                let headerRowIdx = 0;
                let codeColIdx = -1;
                let closeColIdx = -1;
                let volumeColIdx = -1;
                let valueColIdx = -1;

                // 헤더 탐색
                for (let r = 0; r < Math.min(rows.length, 5); r++) {
                    const row = rows[r];
                    if (!row || !Array.isArray(row)) continue;
                    for (let c = 0; c < row.length; c++) {
                        const val = String(row[c] || '').trim().toUpperCase();
                        if (val.includes('종목') || val.includes('단축') || val.includes('KOSCOM') || val.includes('CODE')) {
                            if (codeColIdx === -1) codeColIdx = c;
                        }
                        if (val.includes('종가') || val.includes('현재가') || val.includes('CLOSE')) {
                            if (closeColIdx === -1) closeColIdx = c;
                        }
                        if (val.includes('거래량') || val.includes('VOLUME')) {
                            if (volumeColIdx === -1) volumeColIdx = c;
                        }
                        if (val.includes('거래대금') || val.includes('VALUE')) {
                            if (valueColIdx === -1) valueColIdx = c;
                        }
                    }
                    if (codeColIdx !== -1 && closeColIdx !== -1) {
                        headerRowIdx = r;
                        break;
                    }
                }

                // 자동 감지 실패 시 파워빌더 표준 인덱스 fallback
                if (codeColIdx === -1) codeColIdx = 1; // B열
                if (closeColIdx === -1) closeColIdx = 8; // I열

                let matchCount = 0;

                // 그리드 데이터를 Map으로 인덱싱
                const rowMap = new Map();
                currentRows.forEach(r => {
                    const code = String(r.getData().koscomCd || '').trim();
                    if (code) rowMap.set(code, r);
                });

                for (let r = headerRowIdx + 1; r < rows.length; r++) {
                    const row = rows[r];
                    if (!row || row.length <= codeColIdx) continue;

                    let codeVal = String(row[codeColIdx] || '').trim();
                    if (!codeVal) continue;
                    // 종목코드 앞 'A' 제거 등 정규화
                    if (codeVal.startsWith('A') && codeVal.length === 7) {
                        codeVal = codeVal.substring(1);
                    }

                    let targetRow = rowMap.get(codeVal);
                    if (!targetRow && codeVal.length === 6) {
                        // 'A' 접두어 붙어있는 코드와 대조
                        targetRow = rowMap.get('A' + codeVal);
                    }

                    if (targetRow) {
                        const rawClose = row[closeColIdx];
                        const newClose = Number(String(rawClose || '0').replace(/,/g, '')) || 0;
                        const preclose = Number(targetRow.getData().preclose) || 0;
                        const newChange = newClose - preclose;

                        const updateObj = {
                            close: newClose,
                            change: newChange,
                            rowStatus: targetRow.getData().isNew ? 'C' : 'U'
                        };

                        if (volumeColIdx !== -1 && row[volumeColIdx] !== undefined) {
                            updateObj.volume = Number(String(row[volumeColIdx]).replace(/,/g, '')) || 0;
                        }
                        if (valueColIdx !== -1 && row[valueColIdx] !== undefined) {
                            updateObj.value = Number(String(row[valueColIdx]).replace(/,/g, '')) || 0;
                        }

                        targetRow.update(updateObj);
                        matchCount++;
                    }
                }

                alert(`종가 LOAD가 완료되었습니다.\n(총 ${matchCount}개 종목 매핑 완료)`);
            }

            // Single Entrypoint Initialization (Guideline 11)
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                initGrid();
                initExcelLoader();

                // 날짜 기본값 세팅
                const ymdInput = pane ? pane.querySelector("#filterYmd") : document.getElementById("filterYmd");
                if (ymdInput && !ymdInput.value) {
                    const today = new Date();
                    const yyyy = today.getFullYear();
                    const mm = String(today.getMonth() + 1).padStart(2, '0');
                    const dd = String(today.getDate()).padStart(2, '0');
                    ymdInput.value = `${yyyy}-${mm}-${dd}`;
                }

                // AamsCalendar 초기화
                if (typeof AamsCalendar !== 'undefined' && typeof AamsCalendar.initSimple === 'function') {
                    AamsCalendar.initSimple('filterYmd', {
                        pane: pane,
                        initialYmd: ymdInput ? ymdInput.value : ''
                    });
                }

                // Guideline 9: Standard Toolbar Contracts Binding
                if (pane) {
                    pane.onSearch = searchData;
                    pane.onInput = addRow;
                    pane.onSave = saveData;
                    pane.onDelete = deleteRow;
                    pane.onExcel = exportExcel;
                    // 공통버튼 지침: 새로고침은 조회 전 초기화 상태로 되돌린다.
                    pane.onRefresh = function() {
                        if (gridSjt0tg) gridSjt0tg.clearData();
                        if (ymdInput) {
                            const today = new Date();
                            const yyyy = today.getFullYear();
                            const mm = String(today.getMonth() + 1).padStart(2, '0');
                            const dd = String(today.getDate()).padStart(2, '0');
                            ymdInput.value = `${yyyy}-${mm}-${dd}`;
                        }
                        const countEl = pane ? pane.querySelector("#record-count") : document.getElementById("record-count");
                        if (countEl) countEl.innerText = "0건";
                        if (typeof showToast === "function") showToast("화면이 초기화되었습니다.", "info");
                    };
                    pane.onCorpGrChange = function(val) {
                        // 회사 변경 시 그리드 초기화
                        if (gridSjt0tg) gridSjt0tg.clearData();
                    };
                }

                // 자동 조회 지침: boolean eb_direct_retrieve = true 가 없으므로 초기 자동 조회 없음
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', startInit);
            } else {
                startInit();
            }
        })();
    </script>
</div>
</html>

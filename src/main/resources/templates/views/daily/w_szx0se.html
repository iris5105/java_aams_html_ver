<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container szx0se-container" th:fragment="szx0seView">

    <!-- Top Action Control Bar (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <!-- Reusable Common Toolbar Buttons Fragment (닫기 ~ 엑셀) -->
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
            <button class="t-btn btn-action" onclick="loadSzx0seData()"><i class="fa-solid fa-magnifying-glass"></i> 조회</button>
        </div>
        <!-- Reusable Common Breadcrumb Fragment -->
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- Sub Filter Bar (Row 2: Common 운용사 Select Box: dw_c in w_szx0se.srw) -->
    <div th:replace="~{fragments/tab_header :: corpFilter(dddwId='CORP_GR', seq=1)}"></div>

    <!-- Main Grid Section (d_szx0se.srd / SZX0SE) -->
    <div class="grid-section" style="padding: 10px; flex: 1; height: calc(100vh - 180px); min-height: 400px;">
        <div class="grid-table-wrapper" style="height: 100%;">
            <div id="grid-szx0se" class="tabulator-aams-grid" style="height: 100%;"></div>
        </div>
    </div>

    <!-- Page Specific Script with PowerBuilder f_dddwctl / ue_dddw_retrieve Integration -->
    <script th:inline="javascript">
        (function() {
            const initialData = /*[[${dataList}]]*/ [];
            let gridSzx0se = null;

            // DDDW Option Caches (Populated via ue_dddw_retrieve and f_dddwctl)
            let dddwOptionsMap = {
                series_g1: [],
                series_g2: [],
                bm_gr: [],
                gugan: [],
                ga: []
            };

            /**
             * PowerBuilder dw_list::ue_dddw_retrieve Event Integration
             * Corresponds to dw_list::ue_dddw_retrieve in w_szx0se.srw:
             *   1. F_DDDWCTL (THIS, 'series_g1', gaa.corp_gr, '', 1, "corp_gr='" + corp_gr + "'")
             *   2. F_DDDWCTL (THIS, 'series_g2', gaa.corp_gr, '', 1, "corp_gr='" + corp_gr + "'")
             *   4. f_dddwctl (THIS, 'bm_gr', gaa.corp_gr, '', 1, '')
             *   5. f_dddwctl (THIS, 'gugan', '', ',,', 1, '')
             *   6. f_dddwctl (THIS, 'ga', '', ',,', 1, '')
             */
            function ue_dddw_retrieve(corpGr) {
                const filterSelect = document.getElementById("filterCorpGr");
                const targetCorpGr = corpGr != null ? corpGr : (filterSelect ? filterSelect.value : "");

                f_dddwctl.retrieveMultiple({
                    series_g1: ['series_g1', 1, `corp_gr='${targetCorpGr}'`],
                    series_g2: ['series_g2', 1, `corp_gr='${targetCorpGr}'`],
                    bm_gr: ['bm_gr', 1],
                    gugan: ['gugan', 1],
                    ga: ['ga', 1]
                }).then(results => {
                    dddwOptionsMap.series_g1 = results.series_g1 || [];
                    dddwOptionsMap.series_g2 = results.series_g2 || [];

                    dddwOptionsMap.bm_gr = results.bm_gr || [];
                    dddwOptionsMap.gugan = results.gugan || [];
                    dddwOptionsMap.ga = results.ga || [];

                    console.log('[ue_dddw_retrieve] Successfully retrieved DDDW options via f_dddwctl:', {
                        series_g1: dddwOptionsMap.series_g1.length,
                        series_g2: dddwOptionsMap.series_g2.length,
                        bm_gr: dddwOptionsMap.bm_gr.length,
                        gugan: dddwOptionsMap.gugan.length,
                        ga: dddwOptionsMap.ga.length
                    });

                    if (gridSzx0se) {
                        gridSzx0se.redraw(true);
                    }
                });
            }

            function getDddwLabel(dddwKey, codeVal) {
                return f_dddwctl.getLabel(dddwOptionsMap, dddwKey, codeVal);
            }

            function numFmt(val) {
                if (val == null || val === "") return "0";
                return Number(val).toLocaleString('ko-KR');
            }

            function initSzx0seGrid() {
                const container = document.getElementById("grid-szx0se");
                if (!container) return;

                gridSzx0se = new Tabulator(container, {
                    data: initialData || [],
                    layout: "fitColumns",
                    height: "100%",
                    placeholder: "<span>조회된 계좌관리그룹/상품그룹 데이터가 없습니다.</span>",
                    columnDefaults: { vertAlign: "middle", headerSortTristate: true },
                    columns: [
                        { title: "No.", formatter: "rownum", hozAlign: "center", width: 45, resizable: false, widthGrow: 0 },
                        
                        // Requirement 1: Checkbox for '미사용' (used == '0' -> checked)
                        { 
                            title: "미사용", 
                            field: "used", 
                            hozAlign: "center", 
                            width: 65, 
                            formatter: cell => {
                                const val = String(cell.getValue() != null ? cell.getValue() : '').trim();
                                const isChecked = (val === '0');
                                return `<input type="checkbox" ${isChecked ? 'checked' : ''} disabled />`;
                            } 
                        },
                        
                        // Requirement 2: Dynamic DDDW Formatters powered by f_dddwctl / ue_dddw_retrieve
                        { title: "대분류", field: "seriesG1", hozAlign: "center", width: 85, formatter: cell => getDddwLabel('series_g1', cell.getValue()) },
                        { title: "시리즈(상품분류)", field: "seriesG2", hozAlign: "center", width: 110, formatter: cell => getDddwLabel('series_g2', cell.getValue()) },
                        { title: "시리즈(상품분류)명", field: "seriesNm", hozAlign: "center", width: 160 },
                        { title: "평잔구간", field: "gugan", hozAlign: "center", width: 160, formatter: cell => getDddwLabel('gugan', cell.getValue()) },
                        { title: "금감원<br/>보고분류", field: "ga", hozAlign: "center", width: 60, formatter: cell => getDddwLabel('ga', cell.getValue()) },
                        { title: "재설정기한<br/>(년)", field: "reSeoljYear", hozAlign: "center", width: 105 },
                        { title: "신탁기간<br/>(월)", field: "sintakGigan", hozAlign: "center", width: 85 },
                        { title: "보수기간<br/>(월)", field: "bosuGigan", hozAlign: "center", width: 85 },
                        { title: "목표수익률<br/>(%)", field: "mokpyoSuikPer", hozAlign: "right", minWidth: 110 },
                        { title: "선취수수료<br/>(%)", field: "preBasic", hozAlign: "right", minWidth: 100 },
                        { title: "운용보수율료<br/>(%)", field: "basicPer", hozAlign: "right", minWidth: 100 },
                        { title: "성과보수<br/>(%)", field: "successPer", hozAlign: "right", minWidth: 100 },
                        { 
                            title: "마감일자<br/>사용여부", 
                            field: "magamUsed", 
                            hozAlign: "center", 
                            width: 65, 
                            formatter: cell => {
                                const val = String(cell.getValue() != null ? cell.getValue() : '').trim();
                                const isChecked = (val === '1');
                                return `<input type="checkbox" ${isChecked ? 'checked' : ''} disabled />`;
                            } 
                        },
                        { 
                            title: "수요예측<br/>생성여부", 
                            field: "dpUsed", 
                            hozAlign: "center", 
                            width: 65, 
                            formatter: cell => {
                                const val = String(cell.getValue() != null ? cell.getValue() : '').trim();
                                const isChecked = (val === '1' );
                                return `<input type="checkbox" ${isChecked ? 'checked' : ''} disabled />`;
                            } 
                        },
                        { title: "BM그룹<br/>(9420)", field: "bmGr", hozAlign: "center", width: 90, formatter: cell => getDddwLabel('bm_gr', cell.getValue()) },
                        { title: "비고", field: "bigo", minWidth: 150 }
                    ]
                });
            }

            // Data retrieval function (Mapper / REST API)
            window.loadSzx0seData = function(selectedCorpGr) {
                const filterSelect = document.getElementById("filterCorpGr");
                const corpGr = selectedCorpGr != null ? selectedCorpGr : (filterSelect ? filterSelect.value : "");

                // Re-trigger ue_dddw_retrieve when corpGr changes (matches dw_c::itemchanged event in w_szx0se.srw)
                ue_dddw_retrieve(corpGr);

                fetch('/api/account/szx0se/list?corpGr=' + encodeURIComponent(corpGr))
                    .then(res => res.json())
                    .then(data => {
                        if (gridSzx0se) {
                            gridSzx0se.setData(Array.isArray(data) ? data : []);
                        }
                    })
                    .catch(err => console.error("Error loading szx0se list for corpGr [" + corpGr + "]:", err));
            };

            // Bind change event listener directly to company select element (#filterCorpGr)
            const filterSelect = document.getElementById("filterCorpGr");
            if (filterSelect) {
                filterSelect.addEventListener("change", function() {
                    window.loadSzx0seData(this.value);
                });
            }

            // Initialize Grid & Trigger ue_dddw_retrieve on page load
            initSzx0seGrid();
            ue_dddw_retrieve();
        })();
    </script>
</div>
</html>

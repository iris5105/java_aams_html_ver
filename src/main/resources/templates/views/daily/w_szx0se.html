<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container szx0se-container" th:fragment="szx0seView">

    <!-- Top Action Control Bar (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <!-- Reusable Common Toolbar Buttons Fragment (닫기 ~ 엑셀) -->
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <!-- Reusable Common Breadcrumb Fragment -->
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- Sub Filter Bar (Row 2: Common 운용사 Select Box: dw_c in w_szx0se.srw) -->
    <div th:replace="~{fragments/filter/corp_filter :: corpFilter(dddwId='CORP_GR', seq=1)}"></div>

    <!-- Main Grid Section (d_szx0se.srd / SZX0SE) -->
    <div class="grid-section">
        <div class="grid-table-wrapper">
            <div id="master-grid" class="tabulator-aams-grid"></div>
        </div>
    </div>

    <!-- Page Specific Script with PowerBuilder f_dddwctl / ue_dddw_retrieve Integration -->
    <script th:inline="javascript">
        (function() {
            const currentScript = document.currentScript;
            const pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;

            const initialData = /*[[${dataList}]]*/ [];
            let gridSzx0se = null;

            // DDDW Option Caches (Populated via ue_dddw_retrieve and f_dddwctl)
            let dddwOptionsMap = {
                series_g1: [],
                series_g2: [],
                bm_gr: [],
                gugan: [],
                ga: []
            };

            /**
             * PowerBuilder dw_list::ue_dddw_retrieve Event Integration
             * Corresponds to dw_list::ue_dddw_retrieve in w_szx0se.srw:
             *   1. F_DDDWCTL (THIS, 'series_g1', gaa.corp_gr, '', 1, "corp_gr='" + corp_gr + "'")
             *   2. F_DDDWCTL (THIS, 'series_g2', gaa.corp_gr, '', 1, "corp_gr='" + corp_gr + "'")
             *   4. f_dddwctl (THIS, 'bm_gr', gaa.corp_gr, '', 1, '')
             *   5. f_dddwctl (THIS, 'gugan', '', ',,', 1, '')
             *   6. f_dddwctl (THIS, 'ga', '', ',,', 1, '')
             */
            function ue_dddw_retrieve(corpGr) {
                const filterSelect = pane ? pane.querySelector("#filterCorpGr") : document.getElementById("filterCorpGr");
                const targetCorpGr = corpGr != null ? corpGr : (filterSelect ? filterSelect.value : "");

                f_dddwctl.retrieveMultiple({
                    series_g1: ['series_g1', targetCorpGr, '', 1, `corp_gr='${targetCorpGr}'`],
                    series_g2: ['series_g2', targetCorpGr, '', 1, `corp_gr='${targetCorpGr}'`],
                    bm_gr: ['bm_gr', targetCorpGr, '', 1, ''],
                    gugan: ['gugan', '', ',,', 1, ''],
                    ga: ['ga', '', ',,', 1, '']
                }).then(results => {
                    dddwOptionsMap.series_g1 = results.series_g1 || [];
                    dddwOptionsMap.series_g2 = results.series_g2 || [];

                    dddwOptionsMap.bm_gr = results.bm_gr || [];
                    dddwOptionsMap.gugan = results.gugan || [];
                    dddwOptionsMap.ga = results.ga || [];

                    console.log('[ue_dddw_retrieve] Successfully retrieved DDDW options via f_dddwctl:', {
                        series_g1: dddwOptionsMap.series_g1.length,
                        series_g2: dddwOptionsMap.series_g2.length,
                        bm_gr: dddwOptionsMap.bm_gr.length,
                        gugan: dddwOptionsMap.gugan.length,
                        ga: dddwOptionsMap.ga.length
                    });

                    if (gridSzx0se) {
                        gridSzx0se.redraw(true);
                    }
                });
            }

            function getDddwLabel(dddwKey, codeVal) {
                return f_dddwctl.getLabel(dddwOptionsMap, dddwKey, codeVal);
            }

            function getDddwOptions(dddwKey) {
                const list = dddwOptionsMap[dddwKey] || [];
                return list.map(item => {
                    const code = (item.code != null ? item.code : (item.SEBU_CD != null ? item.SEBU_CD : (item.cd != null ? item.cd : ''))).toString().trim();
                    const name = (item.name != null ? item.name : (item.SEBU_CD_NM != null ? item.SEBU_CD_NM : (item.dscr != null ? item.dscr : code))).toString().trim();
                    return { label: name, value: code };
                });
            }

            function numFmt(val) {
                if (val == null || val === "") return "0";
                return Number(val).toLocaleString('ko-KR');
            }

            function initSzx0seGrid() {
                const container = pane ? pane.querySelector("#master-grid") : document.getElementById("master-grid");
                if (!container) return;

                gridSzx0se = new Tabulator(container, {
                    data: initialData || [],
                    layout: "fitColumns",
                    height: "100%",
                    selectableRows: 1,
                    placeholder: "<span>조회된 계좌관리그룹/상품그룹 데이터가 없습니다.</span>",
                    columnDefaults: { vertAlign: "middle", headerSortTristate: true },
                    columns: [
                        { title: "No.", formatter: "rownum", hozAlign: "center", width: 45, resizable: false, widthGrow: 0 },
                        
                        // Requirement 1: Checkbox for '미사용' (used == '0' -> checked, tabsequence=10)
                        { 
                            title: "미사용", 
                            field: "used", 
                            hozAlign: "center", 
                            width: 65, 
                            formatter: cell => {
                                const val = String(cell.getValue() != null ? cell.getValue() : '').trim();
                                const isChecked = (val === '0');
                                return `<input type="checkbox" ${isChecked ? 'checked' : ''} style="pointer-events: none;" />`;
                            },
                            cellClick: function(e, cell) {
                                const curVal = String(cell.getValue() != null ? cell.getValue() : '').trim();
                                cell.setValue(curVal === '0' ? '1' : '0');
                            }
                        },
                        
                        // Requirement 2: Dynamic DDDW Formatters & Editors (tabsequence=20, 30, 40...)
                        { 
                            title: "대분류", 
                            field: "seriesG1", 
                            hozAlign: "center", 
                            width: 85, 
                            formatter: cell => getDddwLabel('series_g1', cell.getValue()),
                            editor: "list",
                            editorParams: {
                                valuesLookup: () => getDddwOptions('series_g1'),
                                autocomplete: false,
                                listOnEmpty: true,
                                clearable: true
                            },
                            cellClick: function(e, cell) {
                                cell.edit(true);
                            }
                        },
                        { 
                            title: "시리즈(상품분류)", 
                            field: "seriesG2", 
                            hozAlign: "center", 
                            width: 110, 
                            formatter: cell => getDddwLabel('series_g2', cell.getValue()),
                            editor: "input",
                            cellClick: function(e, cell) {
                                cell.edit(true);
                            }
                        },
                        { title: "시리즈(상품분류)명", field: "seriesNm", hozAlign: "left", width: 160, editor: "input", cellClick: (e, cell) => cell.edit(true) },
                        { 
                            title: "평잔구간", 
                            field: "gugan", 
                            hozAlign: "center", 
                            width: 160, 
                            formatter: cell => getDddwLabel('gugan', cell.getValue()),
                            editor: "list",
                            editorParams: {
                                valuesLookup: () => getDddwOptions('gugan'),
                                autocomplete: false,
                                listOnEmpty: true,
                                clearable: true
                            },
                            cellClick: function(e, cell) {
                                cell.edit(true);
                            }
                        },
                        { 
                            title: "금감원<br/>보고분류", 
                            field: "ga", 
                            hozAlign: "center", 
                            width: 60, 
                            formatter: cell => getDddwLabel('ga', cell.getValue()),
                            editor: "list",
                            editorParams: {
                                valuesLookup: () => getDddwOptions('ga'),
                                autocomplete: false,
                                listOnEmpty: true,
                                clearable: true
                            },
                            cellClick: function(e, cell) {
                                cell.edit(true);
                            }
                        },
                        { title: "재설정기한<br/>(년)", field: "reSeoljYear", hozAlign: "center", width: 105, editor: "number", cellClick: (e, cell) => cell.edit(true) },
                        { title: "신탁기간<br/>(월)", field: "sintakGigan", hozAlign: "center", width: 85, editor: "number", cellClick: (e, cell) => cell.edit(true) },
                        { title: "보수기간<br/>(월)", field: "bosuGigan", hozAlign: "center", width: 85, editor: "number", cellClick: (e, cell) => cell.edit(true) },
                        { title: "목표수익률<br/>(%)", field: "mokpyoSuikPer", hozAlign: "right", minWidth: 110, editor: "number", editorParams: { step: 0.01 }, cellClick: (e, cell) => cell.edit(true) },
                        { title: "선취수수료<br/>(%)", field: "preBasic", hozAlign: "right", minWidth: 100, editor: "number", editorParams: { step: 0.01 }, cellClick: (e, cell) => cell.edit(true) },
                        { title: "운용보수율<br/>(%)", field: "basicPer", hozAlign: "right", minWidth: 100, editor: "number", editorParams: { step: 0.01 }, cellClick: (e, cell) => cell.edit(true) },
                        { title: "성과보수<br/>(%)", field: "successPer", hozAlign: "right", minWidth: 100, editor: "number", editorParams: { step: 0.01 }, cellClick: (e, cell) => cell.edit(true) },
                        { 
                            title: "마감일자<br/>사용여부", 
                            field: "magamUsed", 
                            hozAlign: "center", 
                            width: 65, 
                            formatter: cell => {
                                const val = String(cell.getValue() != null ? cell.getValue() : '').trim();
                                const isChecked = (val === '1');
                                return `<input type="checkbox" ${isChecked ? 'checked' : ''} style="pointer-events: none;" />`;
                            },
                            cellClick: function(e, cell) {
                                const curVal = String(cell.getValue() != null ? cell.getValue() : '').trim();
                                cell.setValue(curVal === '1' ? '0' : '1');
                            }
                        },
                        { 
                            title: "수요예측<br/>생성여부", 
                            field: "dpUsed", 
                            hozAlign: "center", 
                            width: 65, 
                            formatter: cell => {
                                const val = String(cell.getValue() != null ? cell.getValue() : '').trim();
                                const isChecked = (val === '1');
                                return `<input type="checkbox" ${isChecked ? 'checked' : ''} style="pointer-events: none;" />`;
                            },
                            cellClick: function(e, cell) {
                                const curVal = String(cell.getValue() != null ? cell.getValue() : '').trim();
                                cell.setValue(curVal === '1' ? '0' : '1');
                            }
                        },
                        { 
                            title: "BM그룹<br/>(9420)", 
                            field: "bmGr", 
                            hozAlign: "center", 
                            width: 90, 
                            formatter: cell => getDddwLabel('bm_gr', cell.getValue()),
                            editor: "list",
                            editorParams: {
                                valuesLookup: () => getDddwOptions('bm_gr'),
                                autocomplete: false,
                                listOnEmpty: true,
                                clearable: true
                            },
                            cellClick: function(e, cell) {
                                cell.edit(true);
                            }
                        },
                        { title: "비고", field: "bigo", minWidth: 150, editor: "input", cellClick: (e, cell) => cell.edit(true) }
                    ]
                });

                // Guideline 7: Capturing phase listener to guarantee row selection
                container.addEventListener("click", function(e) {
                    const rowEl = e.target.closest(".tabulator-row");
                    if (!rowEl || !gridSzx0se) return;
                    const row = gridSzx0se.getRow(rowEl);
                    if (row && (!row.isSelected || !row.isSelected())) {
                        gridSzx0se.deselectRow();
                        row.select();
                    }
                }, true);
            }

            // Data retrieval function (Mapper / REST API)
            window.loadSzx0seData = function(selectedCorpGr) {
                const filterSelect = pane ? pane.querySelector("#filterCorpGr") : document.getElementById("filterCorpGr");
                const corpGr = selectedCorpGr != null ? selectedCorpGr : (filterSelect ? filterSelect.value : "");

                // Re-trigger ue_dddw_retrieve when corpGr changes (matches dw_c::itemchanged event in w_szx0se.srw)
                ue_dddw_retrieve(corpGr);

                fetch('/api/account/szx0se/list?corpGr=' + encodeURIComponent(corpGr))
                    .then(res => res.json())
                    .then(data => {
                        if (gridSzx0se) {
                            gridSzx0se.setData(Array.isArray(data) ? data : []);
                        }
                    })
                    .catch(err => console.error("Error loading szx0se list for corpGr [" + corpGr + "]:", err));
            };

            // Register standard CorpGr change contract method on current tab pane (Guideline 8)
            if (pane) {
                pane.onSearch = function() { window.loadSzx0seData(); };
                pane.onRetrieve = function() { window.loadSzx0seData(); };
                pane.onCorpGrChange = function(val) {
                    window.loadSzx0seData(val);
                };
                pane.addEventListener("corpGrChanged", function(e) {
                    window.loadSzx0seData(e.detail ? e.detail.corpGr : val);
                });
                pane.getNewRowData = function() {
                    const filterSelect = pane.querySelector("#filterCorpGr");
                    const corpGr = filterSelect ? filterSelect.value : "";
                    return {
                        corpGr: corpGr,
                        used: '1',
                        magamUsed: '0',
                        dpUsed: '0',
                        reSeoljYear: 1,
                        sintakGigan: 12,
                        bosuGigan: 12,
                        mokpyoSuikPer: 0,
                        preBasic: 0,
                        basicPer: 0,
                        successPer: 0,
                        isNew: true
                    };
                };
            }

            // Guideline 10: Single initialization entry point with isInitialized guard
            let isInitialized = false;
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;
                initSzx0seGrid();
                ue_dddw_retrieve();
            }

            document.addEventListener("DOMContentLoaded", startInit);
            if (document.readyState === "complete" || document.readyState === "interactive") {
                setTimeout(startInit, 50);
            }
        })();
    </script>
</div>
</html>

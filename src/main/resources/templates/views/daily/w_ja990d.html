<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container ja990d-container" th:fragment="ja990dView">

    <style>
        .ja990d-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }
        .stock-header-code {
            color: #2563eb !important;
            font-weight: 700 !important;
        }
        .stock-header-balh {
            background-color: #dbeafe !important;
            color: #1e40af !important;
            font-weight: 600 !important;
        }
        .form-row {
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 25px;
            font-size: 12px;
        }
        .form-label {
            width: 100px;
            min-width: 100px;
            background: #f1f5f9;
            color: #334155;
            font-weight: 600;
            text-align: center;
            padding: 3px 4px;
            border: 1px solid #cbd5e1;
            border-radius: 2px;
            font-size: 11.5px;
            white-space: nowrap;
            letter-spacing: -0.3px;
        }
        .form-control-area {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 4px;
            min-width: 0;
        }
        .form-input {
            height: 24px;
            padding: 2px 6px;
            border: 1px solid #cbd5e1;
            border-radius: 2px;
            font-size: 12px;
            color: #1e293b;
            background: #fff;
            box-sizing: border-box;
        }
        .form-input:focus, .form-select:focus {
            border-color: #2563eb;
            outline: none;
            box-shadow: 0 0 0 1px #2563eb;
        }
        .form-input[readonly] {
            background: #f8fafc;
            color: #475569;
        }
        .form-select {
            height: 24px;
            padding: 1px 4px;
            border: 1px solid #cbd5e1;
            border-radius: 2px;
            font-size: 12px;
            color: #1e293b;
            background: #fff;
            box-sizing: border-box;
        }
        .btn-search-icon, .btn-cal-icon {
            height: 24px;
            width: 24px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            border-radius: 2px;
            cursor: pointer;
            color: #2563eb;
            flex-shrink: 0;
        }
        .btn-search-icon:hover, .btn-cal-icon:hover {
            background: #e2e8f0;
        }

        /* 반응형: 태블릿/모바일 (width <= 876px) 우측 폼 하단 배치 */
        @media (max-width: 876px) {
            #panel-stock {
                flex-direction: column !important;
            }
            .stock-right-pane {
                width: 100% !important;
                flex: 0 0 auto !important;
                max-height: 280px;
            }
        }
    </style>

    <!-- Page Specific Script for w_ja990d -->
    <script th:inline="javascript">
        (function() {
            const currentScript = document.currentScript;
            const pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;

            let gridStock = null;
            let gridRight = null;
            let currentTab = "stock";
            let isInitialized = false;

            let selectedStockRow = null;
            let lastLoadedMasterKey = null;

            let deletedStockList = [];
            let deletedRightList = [];

            let dddwOptionsMap = {
                woos_ilban_gb: [],
                chg_gb: [],
                new_old_gb: [],
                danc_gb: [],
                capsize: [],
                kospigubun: [],
                under: []
            };

            function resolveCorpGr() {
                if (window.currentCorpGr) return window.currentCorpGr;
                const m = document.cookie.match(/(^|;)\s*savedCorpGr=([^;]+)/) || document.cookie.match(/(^|;)\s*corpGr=([^;]+)/);
                if (m) return decodeURIComponent(m[2]);
                const selectEl = pane ? pane.querySelector("#filterCorpGr") : document.getElementById("filterCorpGr");
                if (selectEl && selectEl.value) return selectEl.value;
                return "";
            }

            function aamsCellEdit(e, cell) {
                const row = cell.getRow();
                if (row && (!row.isSelected || !row.isSelected())) {
                    row.select();
                }
            }

            function numFormatter(cell) {
                const val = cell.getValue();
                if (val == null || val === "" || isNaN(val)) return "0";
                return Math.round(Number(val)).toLocaleString();
            }

            function dateFormatter(cell) {
                const val = cell.getValue();
                if (!val) return "";
                const clean = String(val).replace(/[-.\s]/g, "");
                if (clean.length === 8) {
                    return clean.substring(0, 4) + "." + clean.substring(4, 6) + "." + clean.substring(6, 8);
                }
                return String(val).replace(/-/g, ".");
            }

            function formatDateDot(val) {
                if (!val) return "";
                const clean = String(val).replace(/[-.\s]/g, "");
                if (clean.length === 8) {
                    return clean.substring(0, 4) + "." + clean.substring(4, 6) + "." + clean.substring(6, 8);
                }
                return String(val).replace(/-/g, ".");
            }

            function formatDateHyphen(val) {
                if (!val) return "";
                const clean = String(val).replace(/[-.\s]/g, "");
                if (clean.length === 8) {
                    return clean.substring(0, 4) + "-" + clean.substring(4, 6) + "-" + clean.substring(6, 8);
                }
                return String(val).replace(/\./g, "-");
            }

            // Populate form select dropdowns
            function populateSelectOptions(selectId, options) {
                const sel = pane ? pane.querySelector("#" + selectId) : document.getElementById(selectId);
                if (!sel) return;
                const prevVal = sel.value;
                sel.innerHTML = '<option value="">선택</option>';
                (options || []).forEach(opt => {
                    const optEl = document.createElement("option");
                    optEl.value = opt.value;
                    optEl.textContent = opt.label || opt.name || opt.value;
                    sel.appendChild(optEl);
                });
                if (prevVal) sel.value = prevVal;
            }

            // Retrieve DDDW options (Rule 7)
            function retrieveDddw() {
                const targetCorpGr = resolveCorpGr();
                if (typeof window.f_dddwctl === 'function') {
                    const keys = ['woos_ilban_gb', 'chg_gb', 'new_old_gb', 'danc_gb', 'capsize', 'kospigubun', 'under'];
                    const selectIdMap = {
                        woos_ilban_gb: 'form-woosIlbanGb',
                        chg_gb: 'form-chgGb',
                        new_old_gb: 'form-newOldGb',
                        danc_gb: 'form-dancGb',
                        capsize: 'form-capsize',
                        kospigubun: 'form-kospigubun',
                        under: 'form-under'
                    };

                    keys.forEach(k => {
                        window.f_dddwctl(k, 1, targetCorpGr, '', '').then(list => {
                            dddwOptionsMap[k] = list || [];
                            const opts = getDddwOptions(k);
                            if (selectIdMap[k]) {
                                populateSelectOptions(selectIdMap[k], opts);
                            }
                            if (gridStock) gridStock.redraw(true);
                            if (gridRight) gridRight.redraw(true);
                        }).catch(e => console.error(e));
                    });
                }
            }

            function getDddwOptions(dddwKey) {
                const list = dddwOptionsMap[dddwKey] || [];
                return list.map(item => {
                    const code = (item.code != null ? item.code : (item.SEBU_CD != null ? item.SEBU_CD : (item.cd != null ? item.cd : ''))).toString().trim();
                    const name = (item.name != null ? item.name : (item.SEBU_CD_NM != null ? item.SEBU_CD_NM : (item.dscr != null ? item.dscr : code))).toString().trim();
                    return { label: name, value: code, code: code, name: name };
                });
            }

            function getDddwLabel(dddwKey, codeVal) {
                if (codeVal == null || codeVal === "") return "";
                const list = dddwOptionsMap[dddwKey] || [];
                const found = list.find(item => {
                    const c = (item.code != null ? item.code : (item.SEBU_CD != null ? item.SEBU_CD : item.cd));
                    return String(c).trim() === String(codeVal).trim();
                });
                if (found) {
                    return found.name != null ? found.name : (found.SEBU_CD_NM != null ? found.SEBU_CD_NM : found.dscr);
                }
                return String(codeVal);
            }

            // Stock Columns (d_ja990d_t1a.srd - 1:1 match with PB screenshot)
            const stockColumns = [

            // Sync form field change back to grid row
            function syncFormToGrid(field, value) {
                if (!selectedStockRow) return;
                const updateObj = { isUpdated: true };
                updateObj[field] = value;
                selectedStockRow.update(updateObj);
            }

            // Attach listeners to form inputs
            function initFormListeners() {
                const getEl = id => (pane ? pane.querySelector("#" + id) : document.getElementById(id));

                const bindInput = (id, field, isNumeric, isDate) => {
                    const el = getEl(id);
                    if (!el) return;
                    el.addEventListener("input", function() {
                        let val = el.value.trim();
                        if (isNumeric) {
                            val = val.replace(/,/g, "");
                            if (isNaN(val) || val === "") val = 0;
                            else val = Number(val);
                        } else if (isDate) {
                            val = formatDateHyphen(val);
                        }
                        syncFormToGrid(field, val);
                    });
                };

                const bindSelect = (id, field) => {
                    const el = getEl(id);
                    if (!el) return;
                    el.addEventListener("change", function() {
                        syncFormToGrid(field, el.value);
                    });
                };

                const bindCheckbox = (id, field) => {
                    const el = getEl(id);
                    if (!el) return;
                    el.addEventListener("change", function() {
                        syncFormToGrid(field, el.checked ? "Y" : "N");
                    });
                };

                bindInput("form-jmCd", "jmCd");
                bindInput("form-balhNation", "balhNation");
                bindInput("form-balhCo", "balhCo");
                bindInput("form-koscomCd", "koscomCd");
                bindInput("form-jjNm", "jjNm");
                bindInput("form-jjEnm", "jjEnm");
                bindSelect("form-dancGb", "dancGb");
                bindCheckbox("form-deposit", "deposit");
                bindSelect("form-woosIlbanGb", "woosIlbanGb");
                bindSelect("form-newOldGb", "newOldGb");
                bindSelect("form-chgGb", "chgGb");

                bindInput("form-kweonriYmd", "kweonriYmd", false, true);
                bindInput("form-woosVoteYmd", "woosVoteYmd", false, true);
                bindInput("form-sangjYmd", "sangjYmd", false, true);
                bindInput("form-balhGa", "balhGa", true);
                bindInput("form-sangjJusu", "sangjJusu", true);

                bindSelect("form-capsize", "capsize");
                bindInput("form-upjCd", "upjCd");
                bindSelect("form-kospigubun", "kospigubun");
                bindInput("form-createdYmd", "createdYmd", false, true);
                bindInput("form-baedGisanYmd", "baedGisanYmd", false, true);
                bindSelect("form-under", "under");
                bindInput("form-isinCd", "isinCd");
                bindCheckbox("form-a0231", "a0231");

                // 발행기관 검색 모달 버튼
                const btnBalh = getEl("btn-balh-search");
                if (btnBalh) {
                    btnBalh.addEventListener("click", function() {
                        if (window.AamsCodeSearch) {
                            window.AamsCodeSearch.open("balh_co", function(selected) {
                                if (selected) {
                                    if (getEl("form-balhCo")) getEl("form-balhCo").value = selected.code || "";
                                    if (getEl("form-balhNm")) getEl("form-balhNm").value = selected.name || "";
                                    if (selectedStockRow) {
                                        selectedStockRow.update({
                                            balhCo: selected.code,
                                            balhNm: selected.name,
                                            isUpdated: true
                                        });
                                    }
                                }
                            });
                        }
                    });
                }

                // 업종코드 검색 모달 버튼
                const btnUpj = getEl("btn-upj-search");
                if (btnUpj) {
                    btnUpj.addEventListener("click", function() {
                        if (window.AamsCodeSearch) {
                            window.AamsCodeSearch.open("upj_cd", function(selected) {
                                if (selected) {
                                    if (getEl("form-upjCd")) getEl("form-upjCd").value = selected.code || "";
                                    if (getEl("form-upjFnm")) getEl("form-upjFnm").value = selected.name || "";
                                    if (selectedStockRow) {
                                        selectedStockRow.update({
                                            upjCd: selected.code,
                                            upjFnm: selected.name,
                                            isUpdated: true
                                        });
                                    }
                                }
                            });
                        }
                    });
                }

                // 달력 선택 버튼 바인딩 헬퍼 (Rule 16)
                const bindCalendarBtn = (btnId, inputId, fieldName) => {
                    const btn = getEl(btnId);
                    const inp = getEl(inputId);
                    if (!btn || !inp) return;
                    btn.addEventListener("click", function() {
                        if (window.AamsCalendar && window.AamsCalendar.pickDate) {
                            window.AamsCalendar.pickDate(inp.value, function(newDate) {
                                inp.value = formatDateDot(newDate);
                                syncFormToGrid(fieldName, formatDateHyphen(newDate));
                            });
                        }
                    });
                };

                bindCalendarBtn("btn-kweonri-cal", "form-kweonriYmd", "kweonriYmd");
                bindCalendarBtn("btn-woos-vote-cal", "form-woosVoteYmd", "woosVoteYmd");
                bindCalendarBtn("btn-sangj-cal", "form-sangjYmd", "sangjYmd");
                bindCalendarBtn("btn-created-cal", "form-createdYmd", "createdYmd");
                bindCalendarBtn("btn-baed-gisan-cal", "form-baedGisanYmd", "baedGisanYmd");
            }

            // Triple Fallback Detail Synchronization (Rule 8)
            function syncDetail(row, masterRowData) {
                if (!row) return;
                if (!row.isSelected || !row.isSelected()) {
                    row.select();
                }
                selectedStockRow = row;
                const data = masterRowData || (row.getData ? row.getData() : null);
                if (!data) return;

                const currentKey = (data.jmCd || "") + "_" + (data.koscomCd || "");
                if (lastLoadedMasterKey === currentKey) return;
                lastLoadedMasterKey = currentKey;

                bindStockForm(data);
            }

            // Tab Switching Logic
            function switchTab(target) {
                currentTab = target;
                const btnStock = pane ? pane.querySelector("#tab-btn-stock") : document.getElementById("tab-btn-stock");
                const btnRight = pane ? pane.querySelector("#tab-btn-right") : document.getElementById("tab-btn-right");
                const pnlStock = pane ? pane.querySelector("#panel-stock") : document.getElementById("panel-stock");
                const pnlRight = pane ? pane.querySelector("#panel-right") : document.getElementById("panel-right");

                if (target === "stock") {
                    btnStock.style.background = "#fff";
                    btnStock.style.borderColor = "#cbd5e1";
                    btnStock.style.color = "#2563eb";

                    btnRight.style.background = "#e2e8f0";
                    btnRight.style.borderColor = "transparent";
                    btnRight.style.color = "#64748b";

                    pnlStock.style.display = "flex";
                    pnlRight.style.display = "none";
                    if (gridStock) gridStock.redraw(true);
                } else {
                    btnRight.style.background = "#fff";
                    btnRight.style.borderColor = "#cbd5e1";
                    btnRight.style.color = "#2563eb";

                    btnStock.style.background = "#e2e8f0";
                    btnStock.style.borderColor = "transparent";
                    btnStock.style.color = "#64748b";

                    pnlStock.style.display = "none";
                    pnlRight.style.display = "flex";
                    if (gridRight) gridRight.redraw(true);
                    loadRightList();
                }
            }

            // Load Data
            function loadStockList() {
                const searchInput = pane ? pane.querySelector("#ja990d-search") : document.getElementById("ja990d-search");
                const keyword = searchInput ? searchInput.value.trim() : "";
                const countEl = pane ? pane.querySelector("#stock-count") : document.getElementById("stock-count");

                fetch(`/api/daily/ja990d/stocks?searchKeyword=${encodeURIComponent(keyword)}`)
                    .then(r => r.json())
                    .then(data => {
                        gridStock.setData(data || []);
                        if (countEl) countEl.textContent = (data ? data.length : 0) + "건";
                        // Rule 15: Select first row automatically
                        if (data && data.length > 0) {
                            const rows = gridStock.getRows();
                            if (rows && rows.length > 0) {
                                rows[0].select();
                                syncDetail(rows[0], rows[0].getData());
                            }
                        } else {
                            bindStockForm({});
                        }
                    })
                    .catch(e => console.error(e));
            }

            function loadRightList() {
                const searchInput = pane ? pane.querySelector("#ja990d-search") : document.getElementById("ja990d-search");
                const keyword = searchInput ? searchInput.value.trim() : "";
                const countEl = pane ? pane.querySelector("#right-count") : document.getElementById("right-count");

                fetch(`/api/daily/ja990d/rights?searchKeyword=${encodeURIComponent(keyword)}`)
                    .then(r => r.json())
                    .then(data => {
                        gridRight.setData(data || []);
                        if (countEl) countEl.textContent = (data ? data.length : 0) + "건";
                        if (data && data.length > 0) {
                            const rows = gridRight.getRows();
                            if (rows && rows.length > 0) rows[0].select();
                        }
                    })
                    .catch(e => console.error(e));
            }

            function loadData() {
                lastLoadedMasterKey = null;
                if (currentTab === "stock") {
                    loadStockList();
                } else {
                    loadRightList();
                }
            }

            // Init Grids and Components
            function init() {
                retrieveDddw();
                initFormListeners();

                const stockEl = pane ? pane.querySelector("#ja990d-stock-grid") : document.getElementById("ja990d-stock-grid");
                const rightEl = pane ? pane.querySelector("#ja990d-right-grid") : document.getElementById("ja990d-right-grid");

                if (stockEl) {
                    gridStock = new Tabulator(stockEl, {
                        data: [],
                        layout: "fitDataFill",
                        selectable: 1,
                        columns: stockColumns,
                        height: "100%",
                        placeholder: "조회된 주식 종목이 없습니다."
                    });

                    // Rule 8: Triple Fallback Row Selection Binding
                    if (typeof setupTabulatorRowSelection === 'function') {
                        setupTabulatorRowSelection(gridStock, function(row, data) {
                            syncDetail(row, data);
                        });
                    }
                    gridStock.on("rowClick", function(e, row) {
                        syncDetail(row, row ? row.getData() : null);
                    });
                    gridStock.on("rowSelectionChanged", function(data, rows) {
                        if (rows && rows.length > 0) {
                            syncDetail(rows[0], rows[0].getData());
                        }
                    });
                }

                if (rightEl) {
                    gridRight = new Tabulator(rightEl, {
                        data: [],
                        layout: "fitDataFill",
                        selectable: 1,
                        columns: rightColumns,
                        height: "100%",
                        placeholder: "조회된 신주인수권 종목이 없습니다.",
                        cellEdited: function(cell) {
                            cell.getRow().update({ isUpdated: true });
                        }
                    });
                    if (typeof setupTabulatorRowSelection === 'function') {
                        setupTabulatorRowSelection(gridRight);
                    }
                }

                // Tab Click Handlers
                const btnStock = pane ? pane.querySelector("#tab-btn-stock") : document.getElementById("tab-btn-stock");
                const btnRight = pane ? pane.querySelector("#tab-btn-right") : document.getElementById("tab-btn-right");
                if (btnStock) btnStock.addEventListener("click", () => switchTab("stock"));
                if (btnRight) btnRight.addEventListener("click", () => switchTab("right"));

                // Search Keyup
                const searchInput = pane ? pane.querySelector("#ja990d-search") : document.getElementById("ja990d-search");
                if (searchInput) {
                    searchInput.addEventListener("keyup", function(e) {
                        if (e.key === "Enter") loadData();
                    });
                }

                setTimeout(loadStockList, 100);
            }

            // Input Row
            function inputRow() {

                    const newRow = {

                        balhNm: "",

                        chgGb: "0",
                        newOldGb: "0",
                        balhGa: 0,
                        sangjJusu: 0,
                        upjCd: "A99",
                        under: "N",
                        delYn: "0",
                        isNew: true
                    };

                    gridStock.addRow(newRow, true).then(row => {
                        lastLoadedMasterKey = null;
                        row.select();
                        syncDetail(row, newRow);
                        const jmCdEl = pane ? pane.querySelector("#form-jmCd") : document.getElementById("form-jmCd");
                        if (jmCdEl) {
                            jmCdEl.readOnly = false;
                            jmCdEl.focus();
                        }
                    });
                } else {
                    if (!gridRight) return;
                    const newRow = {
                        jmCd: "",
                        balhCo: "",
                        balhNm: "",
                        jjNm: "",
                        woosIlbanGb: "0",
                        chgGb: "0",
                        newOldGb: "0",
                        koscomCd: "",
                        dancGb: "X",
                        balhGa: 0,
                        sangjJusu: 0,
                        kweonriYmd: "",
                        sangjYmd: "",
                        chgRt: 1,
                        under: "N",
                        delYn: "0",
                        isNew: true
                    };

                    gridRight.addRow(newRow, true).then(row => {
                        row.select();
                        setTimeout(() => {
                            const cell = row.getCell("jmCd");
                            if (cell) cell.edit();
                        }, 100);
                    });
                }
            }

            // Delete Row
            function deleteRow() {
                const targetGrid = (currentTab === "stock") ? gridStock : gridRight;
                const delList = (currentTab === "stock") ? deletedStockList : deletedRightList;
                if (!targetGrid) return;

                const selected = targetGrid.getSelectedRows();
                if (!selected || selected.length === 0) {
                    if (window.AamsModal) window.AamsModal.alert("삭제할 행을 선택해주세요.");
                    return;
                }

                const row = selected[0];
                const data = row.getData();

                const doDelete = function() {
                    if (data.isNew) {
                        row.delete();
                    } else {
                        delList.push(data);
                        row.delete();
                    }
                    if (currentTab === "stock") {
                        selectedStockRow = null;
                        bindStockForm({});
                    }
                };

                if (window.AamsModal) {
                    window.AamsModal.confirm("선택한 종목을 삭제하시겠습니까?", doDelete);
                } else {
                    if (confirm("선택한 종목을 삭제하시겠습니까?")) {
                        doDelete();
                    }
                }
            }

            // Save Function
            function save() {
                const targetGrid = (currentTab === "stock") ? gridStock : gridRight;
                const delList = (currentTab === "stock") ? deletedStockList : deletedRightList;
                if (!targetGrid) return;

                const rows = targetGrid.getData();
                const inserted = rows.filter(r => r.isNew);
                const updated = rows.filter(r => !r.isNew && r.isUpdated);

                if (inserted.length === 0 && updated.length === 0 && delList.length === 0) {
                    if (window.AamsModal) window.AamsModal.alert("수정 또는 변경된 데이터가 없습니다.");
                    return;
                }

                for (const item of inserted) {
                    if (!item.jmCd || item.jmCd.trim() === "") {
                        if (window.AamsModal) window.AamsModal.alert("종목코드를 입력해주세요.");
                        return;
                    }
                }

                const saveDto = {
                    insertedList: inserted,
                    updatedList: updated,
                    deletedList: delList
                };

                const doSave = function() {
                    fetch("/api/daily/ja990d/save", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(saveDto)
                    })
                    .then(r => r.json())
                    .then(res => {
                        if (res.success) {
                            if (window.AamsModal) {
                                window.AamsModal.alert("저장이 완료되었습니다.", () => { loadData(); });
                            } else {
                                alert("저장이 완료되었습니다.");
                                loadData();
                            }
                        } else {
                            if (window.AamsModal) window.AamsModal.alert(res.message || "오류 발생");
                            else alert(res.message || "오류 발생");
                        }
                    })
                    .catch(err => {
                        console.error("Save error:", err);
                        if (window.AamsModal) window.AamsModal.alert("통신 오류가 발생했습니다.");
                    });
                };

                if (window.AamsModal) {
                    window.AamsModal.confirm("종목 정보를 저장하시겠습니까?", doSave);
                } else {
                    if (confirm("종목 정보를 저장하시겠습니까?")) doSave();
                }
            }

            // Toolbar Contract Binding (Rule 9)
            if (pane) {
                pane.onSearch = function() { loadData(); };
                pane.onInput = function() { inputRow(); };
                pane.onDelete = function() { deleteRow(); };
                pane.onSave = function() { save(); };
                pane.onCorpGrChange = function() { loadData(); };
                pane.onRefresh = function() {
                    if (gridStock) gridStock.clearData();
                    if (gridRight) gridRight.clearData();
                    selectedStockRow = null;
                    lastLoadedMasterKey = null;
                    bindStockForm({});
                    deletedStockList = [];
                    deletedRightList = [];
                    const searchInput = pane ? pane.querySelector("#ja990d-search") : document.getElementById("ja990d-search");
                    if (searchInput) searchInput.value = "";
                    if (typeof showToast === "function") {
                        showToast("화면이 초기화되었습니다.", "info");
                    }
                };
            }

            // Rule 11: Single Entry Point (isInitialized guard)
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;
                init();
            }

            if (document.readyState === "complete" || document.readyState === "interactive") {
                startInit();
            } else {
                document.addEventListener("DOMContentLoaded", startInit);
            }

        })();
    </script>
</div>
</html>

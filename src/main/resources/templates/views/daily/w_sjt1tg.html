<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-single sjt1tg-container" th:fragment="sjt1tgView">

    <!-- Top Action Control Bar (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <!-- Reusable Common Toolbar Buttons Fragment -->
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <!-- Reusable Common Breadcrumb Fragment -->
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- Filter Bar (Row 2): Rule 14 & Rule 17 - dc_ymd fragment matching dw_c in w_sjt1tg.srw -->
    <div class="filter-bar">
        <div class="filter-left">
            <div th:replace="~{fragments/filter/dc_ymd :: filter(labelYmd='영업일자')}"></div>
        </div>

        <!-- Sub Action Buttons (cb_3, cb_other in w_sjt1tg.srw) -->
        <div class="filter-actions sjt1tg-action-buttons">
            <input type="file" id="sjt1tgExcelFileInput" accept=".xls,.xlsx,.csv" style="display: none;" />
            <button type="button" id="btnImportCloseExcel" class="t-btn btn-action" style="background: #0284c7; color: #ffffff; border-color: #0369a1;" title="엑셀 파일로부터 종가를 로드합니다.">
                <i class="fa-solid fa-file-excel"></i> 엑셀종가IMPORT
            </button>
            <button type="button" id="btnGenerateNewFutures" class="t-btn btn-action" style="background: #2563eb; color: #ffffff; border-color: #1d4ed8;" title="신규 선물 및 결제지수를 생성합니다.">
                <i class="fa-solid fa-wand-magic-sparkles"></i> 신규(결제지수)생성
            </button>
        </div>
    </div>

    <!-- Main Grid Section (d_sjt1tg.srd / SJT1TG) -->
    <div class="grid-section" style="flex: 1 1 auto; height: calc(100% - 90px); padding: 8px 12px; overflow: hidden; display: flex; flex-direction: column;">
        <div class="grid-table-wrapper" style="flex: 1 1 auto; height: 100%; width: 100%; border: 1px solid #cbd5e1; border-radius: 4px; overflow: hidden; background-color: #fff;">
            <div id="sjt1tg-grid" class="tabulator-aams-grid" style="height: 100%;"></div>
        </div>
    </div>

    <!-- SheetJS for Excel Reading -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- Pure JS AAMS Calendar Component (Rule 16) -->
    <script th:src="@{/js/aams_calendar.js}" src="/js/aams_calendar.js"></script>

    <!-- Dynamic Code Search Component (u_dynamiccodesearch) -->
    <script th:src="@{/js/dynamic_code_search.js}" src="/js/dynamic_code_search.js"></script>

    <!-- Page Specific Script for w_sjt1tg -->
    <script th:inline="javascript">
        (function() {
            const currentScript = document.currentScript;
            const pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;

            let gridSjt1tg = null;
            let isInitialized = false;
            let deletedList = [];

            // Corporate Group Resolver (Guideline 1: No default hardcoded value)
            function resolveCorpGr() {
                if (window.currentCorpGr) return window.currentCorpGr;
                const m = document.cookie.match(/(^|;)\s*savedCorpGr=([^;]+)/) || document.cookie.match(/(^|;)\s*corpGr=([^;]+)/);
                if (m) return decodeURIComponent(m[2]);
                const selectEl = pane ? pane.querySelector("#filterCorpGr") : document.getElementById("filterCorpGr");
                if (selectEl && selectEl.value) return selectEl.value;
                const globalSelect = document.getElementById("topCorpGrSelect") || document.getElementById("filterCorpGr");
                if (globalSelect && globalSelect.value) return globalSelect.value;
                return "";
            }

            function getFilterYmd() {
                const input = pane ? pane.querySelector("#filterYmd") : document.getElementById("filterYmd");
                if (!input) return "";
                let val = input.value || "";
                return val.replace(/\./g, '-');
            }

            // Tabulator Formatter Utilities
            function numberFormatter(cell) {
                const val = cell.getValue();
                if (val === null || val === undefined || val === "") return "";
                const num = Number(val);
                if (isNaN(num)) return val;
                return num.toLocaleString('ko-KR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }

            function intFormatter(cell) {
                const val = cell.getValue();
                if (val === null || val === undefined || val === "") return "";
                const num = Number(val);
                if (isNaN(num)) return val;
                return num.toLocaleString('ko-KR');
            }

            function changeFormatter(cell) {
                const val = cell.getValue();
                if (val === null || val === undefined || val === "") return "";
                const num = Number(val);
                if (isNaN(num)) return val;
                const formatted = num.toLocaleString('ko-KR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                if (num > 0) {
                    return `<span style="color: #ef4444; font-weight: 500;">▲ ${formatted}</span>`;
                } else if (num < 0) {
                    return `<span style="color: #2563eb; font-weight: 500;">▼ ${Math.abs(num).toLocaleString('ko-KR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>`;
                }
                return formatted;
            }

            // Cell Edit Guard (develope-guide.md Exception 1)
            function isCellEditable(cell) {
                const rowData = cell.getRow().getData();
                return !!rowData.isNew;
            }

            // Columns definition based on d_sjt1tg.srd
            const columns = [
                {
                    title: "No.",
                    field: "fseq",
                    formatter: "rownum",
                    width: 60,
                    hozAlign: "center",
                    headerHozAlign: "center",
                    headerSort: false
                },
                {
                    title: "선물/옵션",
                    field: "sjCd",
                    width: 130,
                    hozAlign: "center",
                    headerHozAlign: "center",
                    editor: "input",
                    editable: isCellEditable,
                    cellClick: typeof aamsCellEdit !== 'undefined' ? aamsCellEdit : undefined
                },
                {
                    title: "",
                    field: "searchBtn",
                    width: 36,
                    hozAlign: "center",
                    headerHozAlign: "center",
                    headerSort: false,
                    formatter: function() {
                        return '<i class="fa-solid fa-magnifying-glass" style="cursor: pointer; color: #2563eb;"></i>';
                    },
                    cellClick: function(e, cell) {
                        const row = cell.getRow();
                        if (typeof openDynamicCodeSearchModal === 'function') {
                            openDynamicCodeSearchModal('p_xx_sj_cd', function(selectedData) {
                                if (selectedData) {
                                    row.update({
                                        sjCd: selectedData.code || selectedData.sj_cd || "",
                                        xxSjCd: selectedData.name || selectedData.sj_nm || ""
                                    });
                                }
                            });
                        }
                    }
                },
                {
                    title: "선물/옵션종목명",
                    field: "xxSjCd",
                    width: 200,
                    hozAlign: "left",
                    headerHozAlign: "center"
                },
                {
                    title: "당일종가",
                    field: "close",
                    width: 110,
                    hozAlign: "right",
                    headerHozAlign: "center",
                    editor: "number",
                    formatter: numberFormatter,
                    cellClick: typeof aamsCellEdit !== 'undefined' ? aamsCellEdit : undefined,
                    cellEdited: function(cell) {
                        const row = cell.getRow();
                        const data = row.getData();
                        const closeVal = Number(data.close || 0);
                        const precloseVal = Number(data.preclose || 0);
                        row.update({
                            change: closeVal - precloseVal,
                            rowStatus: data.isNew ? "C" : "U"
                        });
                    }
                },
                {
                    title: "전일종가",
                    field: "preclose",
                    width: 110,
                    hozAlign: "right",
                    headerHozAlign: "center",
                    editor: "number",
                    formatter: numberFormatter,
                    cellClick: typeof aamsCellEdit !== 'undefined' ? aamsCellEdit : undefined,
                    cellEdited: function(cell) {
                        const row = cell.getRow();
                        const data = row.getData();
                        const closeVal = Number(data.close || 0);
                        const precloseVal = Number(data.preclose || 0);
                        row.update({
                            change: closeVal - precloseVal,
                            rowStatus: data.isNew ? "C" : "U"
                        });
                    }
                },
                {
                    title: "등락",
                    field: "change",
                    width: 100,
                    hozAlign: "right",
                    headerHozAlign: "center",
                    formatter: changeFormatter
                },
                {
                    title: "거래량",
                    field: "volume",
                    width: 100,
                    hozAlign: "right",
                    headerHozAlign: "center",
                    editor: "number",
                    formatter: intFormatter,
                    cellClick: typeof aamsCellEdit !== 'undefined' ? aamsCellEdit : undefined,
                    cellEdited: function(cell) {
                        const row = cell.getRow();
                        const data = row.getData();
                        if (!data.isNew) row.update({ rowStatus: "U" });
                    }
                },
                {
                    title: "거래대금",
                    field: "value",
                    width: 110,
                    hozAlign: "right",
                    headerHozAlign: "center",
                    editor: "number",
                    formatter: intFormatter,
                    cellClick: typeof aamsCellEdit !== 'undefined' ? aamsCellEdit : undefined,
                    cellEdited: function(cell) {
                        const row = cell.getRow();
                        const data = row.getData();
                        if (!data.isNew) row.update({ rowStatus: "U" });
                    }
                },
                {
                    title: "현물가격",
                    field: "spotPrice",
                    width: 110,
                    hozAlign: "right",
                    headerHozAlign: "center",
                    editor: "number",
                    formatter: numberFormatter,
                    cellClick: typeof aamsCellEdit !== 'undefined' ? aamsCellEdit : undefined,
                    cellEdited: function(cell) {
                        const row = cell.getRow();
                        const data = row.getData();
                        if (!data.isNew) row.update({ rowStatus: "U" });
                    }
                },
                {
                    title: "정산가격",
                    field: "calcPrice",
                    width: 110,
                    hozAlign: "right",
                    headerHozAlign: "center",
                    editor: "number",
                    formatter: numberFormatter,
                    cellClick: typeof aamsCellEdit !== 'undefined' ? aamsCellEdit : undefined,
                    cellEdited: function(cell) {
                        const row = cell.getRow();
                        const data = row.getData();
                        if (!data.isNew) row.update({ rowStatus: "U" });
                    }
                },
                {
                    title: "비고",
                    field: "bigo",
                    width: 200,
                    hozAlign: "left",
                    headerHozAlign: "center"
                }
            ];

            function initGrid() {
                const gridEl = pane ? pane.querySelector("#sjt1tg-grid") : document.getElementById("sjt1tg-grid");
                if (!gridEl) return;

                gridSjt1tg = new Tabulator(gridEl, {
                    data: [],
                    layout: "fitColumns",
                    columns: columns,
                    height: "100%",
                    placeholder: "조회된 종가 데이터가 없습니다.",
                    selectableRows: 1
                });

                // Rule 8: Global Tabulator Row Selection Setup
                if (typeof setupTabulatorRowSelection === 'function') {
                    setupTabulatorRowSelection(gridSjt1tg);
                }

                // Rule 15: Select first row on data loaded
                gridSjt1tg.on("dataLoaded", function() {
                    const rows = gridSjt1tg.getRows();
                    if (rows && rows.length > 0) {
                        rows[0].select();
                    }
                });
            }

            function loadList() {
                const ymd = getFilterYmd();
                if (!ymd) {
                    alert("영업일자를 선택해 주세요.");
                    return;
                }

                deletedList = [];
                const url = `/api/daily/sjt1tg/list?ymd=${encodeURIComponent(ymd)}`;
                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        if (gridSjt1tg) {
                            gridSjt1tg.setData(data || []);
                        }
                    })
                    .catch(err => {
                        console.error("Error fetching sjt1tg list:", err);
                        alert("조회 중 오류가 발생했습니다.");
                    });
            }

            function doInput() {
                if (!gridSjt1tg) return;
                const ymd = getFilterYmd();
                const newRow = {
                    fseq: gridSjt1tg.getData().length + 1,
                    sjCd: "",
                    xxSjCd: "",
                    close: 0,
                    preclose: 0,
                    change: 0,
                    volume: 0,
                    value: 0,
                    spotPrice: 0,
                    calcPrice: 0,
                    ymd: ymd,
                    bigo: "신규 입력",
                    isNew: true,
                    rowStatus: "C"
                };
                gridSjt1tg.addRow(newRow, true).then(function(row) {
                    row.select();
                });
            }

            function doDelete() {
                if (!gridSjt1tg) return;
                const selectedRows = gridSjt1tg.getSelectedRows();
                if (!selectedRows || selectedRows.length === 0) {
                    alert("삭제할 행을 선택하세요.");
                    return;
                }

                const row = selectedRows[0];
                const rowData = row.getData();
                if (!confirm(`[${rowData.sjCd || '신규'}] 종목을 삭제하시겠습니까?`)) {
                    return;
                }

                if (!rowData.isNew && rowData.sjCd) {
                    deletedList.push(rowData);
                }
                row.delete();
            }

            function doSave() {
                if (!gridSjt1tg) return;
                const allData = gridSjt1tg.getData();
                const ymd = getFilterYmd();
                const corpGr = resolveCorpGr();

                const createdRows = allData.filter(d => d.isNew || d.rowStatus === "C");
                const updatedRows = allData.filter(d => !d.isNew && d.rowStatus === "U");

                if (createdRows.length === 0 && updatedRows.length === 0 && deletedList.length === 0) {
                    alert("저장할 변경 내용이 없습니다.");
                    return;
                }

                if (!confirm("변경 사항을 저장하시겠습니까?")) return;

                const payload = {
                    corpGr: corpGr,
                    ymd: ymd,
                    createdRows: createdRows,
                    updatedRows: updatedRows,
                    deletedRows: deletedList
                };

                fetch("/api/daily/sjt1tg/save", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                })
                .then(res => res.json())
                .then(res => {
                    if (res.success) {
                        alert(res.message || "저장되었습니다.");
                        loadList();
                    } else {
                        alert(res.message || "저장에 실패했습니다.");
                    }
                })
                .catch(err => {
                    console.error("Save error:", err);
                    alert("저장 중 오류가 발생했습니다.");
                });
            }

            function doGenerate() {
                const corpGr = resolveCorpGr();
                const ymd = getFilterYmd();
                if (!ymd) {
                    alert("영업일자를 선택해 주세요.");
                    return;
                }

                if (!confirm(`[${ymd}] 신규 선물/옵션 및 결제지수를 생성하시겠습니까?`)) return;

                fetch(`/api/daily/sjt1tg/generate?corpGr=${encodeURIComponent(corpGr)}&ymd=${encodeURIComponent(ymd)}`)
                    .then(res => res.json())
                    .then(generatedList => {
                        if (!generatedList || generatedList.length === 0) {
                            alert("생성할 신규 종목/결제지수가 없습니다.");
                            return;
                        }

                        const currentRows = gridSjt1tg.getData();
                        let addedCount = 0;

                        generatedList.forEach(item => {
                            const exists = currentRows.some(r => r.sjCd === item.sjCd);
                            if (!exists) {
                                gridSjt1tg.addRow({
                                    ...item,
                                    isNew: true,
                                    rowStatus: "C"
                                }, false);
                                addedCount++;
                            }
                        });

                        alert(`${addedCount} 건의 신규 종목이 추가되었습니다. [저장] 버튼을 눌러 확정하세요.`);
                    })
                    .catch(err => {
                        console.error("Generate error:", err);
                        alert("신규 생성 중 오류가 발생했습니다.");
                    });
            }

            function handleExcelFile(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(evt) {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const sheet = workbook.Sheets[firstSheetName];
                        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

                        if (!rows || rows.length === 0) {
                            alert("엑셀 데이터가 없습니다.");
                            return;
                        }

                        let matchCount = 0;
                        const currentRows = gridSjt1tg.getRows();

                        rows.forEach(r => {
                            if (!r || r.length < 3) return;
                            const excelCode = String(r[0] || '').trim();
                            const excelClose = Number(r[2] || 0);
                            const excelDiff = Number(r[3] || 0);

                            currentRows.forEach(rowComp => {
                                const d = rowComp.getData();
                                const pureCd = (d.sjCd || '').replace(/^KR[0-9A-Z]/, '').trim();
                                if (d.sjCd === excelCode || pureCd === excelCode || (d.sjCd && d.sjCd.includes(excelCode))) {
                                    rowComp.update({
                                        close: excelClose,
                                        preclose: excelClose - excelDiff,
                                        change: excelDiff,
                                        volume: Number(r[9] || d.volume || 0),
                                        value: Number(r[10] || d.value || 0),
                                        spotPrice: Number(r[7] || d.spotPrice || 0),
                                        calcPrice: Number(r[8] || d.calcPrice || 0),
                                        bigo: "엑셀 종가반영",
                                        rowStatus: d.isNew ? "C" : "U"
                                    });
                                    matchCount++;
                                }
                            });
                        });

                        alert(`${matchCount} 건의 종가가 엑셀에서 반영되었습니다. [저장] 버튼을 눌러 확정하세요.`);
                    } catch (ex) {
                        console.error("Excel parse error:", ex);
                        alert("엑셀 파일을 파싱하는 중 오류가 발생했습니다.");
                    } finally {
                        e.target.value = "";
                    }
                };
                reader.readAsArrayBuffer(file);
            }

            // Toolbar Button Binding (Rule 9)
            if (pane) {
                pane.onSearch = loadList;
                pane.onInput = doInput;
                pane.onSave = doSave;
                pane.onDelete = doDelete;
                pane.onExcel = function() {
                    if (gridSjt1tg) gridSjt1tg.download("xlsx", `선물옵션_종가_${getFilterYmd()}.xlsx`);
                };
                // 공통버튼 지침: 새로고침은 조회 전 초기화 상태로 되돌린다.
                pane.onRefresh = function() {
                    if (gridSjt1tg) gridSjt1tg.clearData();
                    const ymdInput = pane ? pane.querySelector("#filterYmd") : document.getElementById("filterYmd");
                    if (ymdInput) {
                        const today = new Date();
                        const yyyy = today.getFullYear();
                        const mm = String(today.getMonth() + 1).padStart(2, '0');
                        const dd = String(today.getDate()).padStart(2, '0');
                        ymdInput.value = `${yyyy}-${mm}-${dd}`;
                    }
                    const countEl = pane ? pane.querySelector("#sjt1tg-count") : document.getElementById("sjt1tg-count");
                    if (countEl) countEl.innerText = "0건";
                    if (typeof showToast === "function") showToast("화면이 초기화되었습니다.", "info");
                };
                pane.onCorpGrChange = function(newCorpGr) {
                    if (gridSjt1tg) gridSjt1tg.clearData();
                    loadList();
                };
            }

            // Initialization logic (Rule 11: startInit pattern)
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                initGrid();

                // AamsCalendar 초기화
                if (typeof AamsCalendar !== 'undefined' && typeof AamsCalendar.initSimple === 'function') {
                    AamsCalendar.initSimple('filterYmd', { pane: pane });
                }

                // Button events
                const btnGen = pane ? pane.querySelector("#btnGenerateNewFutures") : document.getElementById("btnGenerateNewFutures");
                if (btnGen) btnGen.addEventListener("click", doGenerate);

                const btnExcel = pane ? pane.querySelector("#btnImportCloseExcel") : document.getElementById("btnImportCloseExcel");
                const fileInput = pane ? pane.querySelector("#sjt1tgExcelFileInput") : document.getElementById("sjt1tgExcelFileInput");
                if (btnExcel && fileInput) {
                    btnExcel.addEventListener("click", () => fileInput.click());
                    fileInput.addEventListener("change", handleExcelFile);
                }

                // Auto-search: eb_direct_retrieve = true 명세 반영
                setTimeout(() => {
                    loadList();
                }, 100);
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", startInit);
            } else {
                startInit();
            }
        })();
    </script>
</div>
</html>

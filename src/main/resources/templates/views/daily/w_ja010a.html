<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container ja010a-container" th:fragment="ja010aView">

    <style>
        .ja010a-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            box-sizing: border-box;
            background-color: #f8fafc;
        }

        .ja010a-container .master-grid-section {
            flex: 6;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            padding: 6px 12px 2px 12px;
        }

        .ja010a-container .master-grid-section .grid-table-wrapper {
            flex: 1;
            height: 100%;
            min-height: 0;
        }

        .ja010a-container .split-divider {
            flex: 0 0 6px;
            background-color: #cbd5e1;
            margin: 2px 0;
        }

        .ja010a-container .lower-split-section {
            flex: 4;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            padding: 2px 12px 6px 12px;
            margin-bottom: 0;
        }

        .ja010a-container .lower-split-section .panel-left {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .ja010a-container .lower-split-section .grid-table-wrapper {
            flex: 1;
            height: 100%;
            min-height: 0;
        }
    </style>

    <!-- Top Action Control Bar (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <!-- Reusable Common Toolbar Buttons Fragment (닫기 ~ 엑셀) -->
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
            <button class="t-btn btn-action" onclick="loadJa010aMaster()"><i class="fa-solid fa-magnifying-glass"></i> 조회</button>
        </div>
        <!-- Reusable Common Breadcrumb Fragment -->
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- Upper Master Grid Section (dw_list / d_ja010a1.srd / SZX0AA) -->
    <div class="grid-section master-grid-section">
        <div class="grid-table-wrapper">
            <div id="grid-ja010a-master" class="tabulator-aams-grid"></div>
        </div>
    </div>

    <!-- Split Bar Separator -->
    <div class="split-divider"></div>

    <!-- Lower Split Panels (dw_detail / d_ja010a2.srd / SZX0AB) -->
    <div class="grid-section lower-split-section">
        <div class="split-panel panel-left" style="flex: 1;">
            <div class="sub-grid-header">
                <span class="sub-title"><i class="fa-solid fa-file-contract"></i> 회사 계약 및 변경 이력</span>
            </div>
            <div class="grid-table-wrapper">
                <div id="grid-ja010a-detail" class="tabulator-aams-grid"></div>
            </div>
        </div>
    </div>

    <!-- Inline Script for Ja010a View with Tabulator Grids -->
    <script th:inline="javascript">
        (function() {
            let gridMaster = null;
            let gridDetail = null;

            const initialMasterData = /*[[${masterList}]]*/ [];

            function formatDepositDd(val) {
                if (val == null || val === "") return "";
                const str = String(val).trim();
                if (str === "5") return "5영업일";
                if (str === "7") return "7영업일";
                return str + "영업일";
            }

            function formatDateVal(val) {
                if (!val) return "";
                const clean = String(val).replace(/\D/g, "");
                if (clean.length === 8) {
                    return clean.substring(0, 4) + '.' + clean.substring(4, 6) + '.' + clean.substring(6, 8);
                }
                return String(val).replace(/-/g, ".");
            }

            function formatIdno(val) {
                if (!val) return "";
                const clean = String(val).replace(/\D/g, "");
                if (clean.length === 10) {
                    return clean.substring(0, 3) + "-" + clean.substring(3, 5) + "-" + clean.substring(5, 10);
                }
                return val;
            }

            // 1. Initialize Master Tabulator Grid (d_ja010a1 / SZX0AA)
            function initMasterGrid() {
                const container = document.getElementById("grid-ja010a-master");
                if (!container) return;

                gridMaster = new Tabulator(container, {
                    data: initialMasterData || [],
                    layout: "fitDataFill",
                    height: "100%",
                    selectableRows: 1,
                    placeholder: "<span>조회된 회사 기본 정보가 없습니다.</span>",
                    columnDefaults: { vertAlign: "middle", headerSortTristate: true },
                    columns: [
                        { title: "No.", formatter: "rownum", hozAlign: "center", width: 45, resizable: false, widthGrow: 0 },
                        { title: "회사코드", field: "corpGr", hozAlign: "center", width: 80 },
                        { title: "회사명", field: "companyName", minWidth: 140 },
                        { title: "입금<br/>영업일수", field: "depositDd", hozAlign: "center", width: 95, formatter: cell => formatDepositDd(cell.getValue()) },
                        { title: "<span style='color: #2563eb;'>작업<br/>기준일</span>", field: "hyunYmd", hozAlign: "center", width: 95, formatter: cell => `<span style="color: #2563eb; font-weight: 500;">${formatDateVal(cell.getValue())}</span>` },
                        { title: "기준가<br/>계산일", field: "gijungaYmd", hozAlign: "center", width: 95, formatter: cell => formatDateVal(cell.getValue()) },
                        { title: "관리<br/>시작일", field: "symd", hozAlign: "center", width: 95, formatter: cell => formatDateVal(cell.getValue()) },
                        { title: "<span style='color: #ef4444;'>관리<br/>종료일</span>", field: "eymd", hozAlign: "center", width: 95, formatter: cell => `<span style="color: #ef4444; font-weight: 500;">${formatDateVal(cell.getValue())}</span>` },
                        { title: "전영업일", field: "junyongYmd", hozAlign: "center", width: 95, formatter: cell => formatDateVal(cell.getValue()) },
                        { title: "익영업일", field: "ikyongYmd", hozAlign: "center", width: 95, formatter: cell => formatDateVal(cell.getValue()) },
                        { title: "3영업일", field: "thikyongYmd", hozAlign: "center", width: 95, formatter: cell => formatDateVal(cell.getValue()) },
                        { title: "수수료<br/>비용처리", field: "expenseYn", hozAlign: "center", width: 90, formatter: cell => `<input type="checkbox" ${cell.getValue() === 'Y' ? 'checked' : ''} disabled />` },
                        { title: "메뉴그룹", field: "customerGr", hozAlign: "center", width: 100 },
                        { title: "수수료 입금계좌", field: "depositAccount", minWidth: 170 },
                        { title: "비고", field: "bigo", minWidth: 150 }
                    ]
                });

                gridMaster.on("rowClick", function(e, row) {
                    gridMaster.deselectRow();
                    row.select();
                    const data = row.getData();
                    if (data.corpGr) {
                        fetchJa010aDetail(data.corpGr);
                    }
                });

                // Auto select first row on build
                gridMaster.on("tableBuilt", function() {
                    const rows = gridMaster.getRows();
                    if (rows && rows.length > 0) {
                        rows[0].select();
                        const data = rows[0].getData();
                        if (data.corpGr) {
                            fetchJa010aDetail(data.corpGr);
                        }
                    }
                });
            }

            // 2. Initialize Detail Tabulator Grid (d_ja010a2 / SZX0AB)
            function initDetailGrid() {
                const container = document.getElementById("grid-ja010a-detail");
                if (!container) return;

                gridDetail = new Tabulator(container, {
                    layout: "fitColumns",
                    height: "100%",
                    placeholder: "<span>상단 목록에서 항목을 선택하세요.</span>",
                    columnDefaults: { vertAlign: "middle", headerSortTristate: true },
                    columns: [
                        { title: "No.", formatter: "rownum", hozAlign: "center", width: 45, resizable: false, widthGrow: 0 },
                        { title: "계약(변경)일자", field: "ymd", hozAlign: "center", width: 110, formatter: cell => formatDateVal(cell.getValue()) },
                        { title: "회사명", field: "companyName", minWidth: 140 },
                        { title: "사업자등록번호", field: "idno", hozAlign: "center", width: 125, formatter: cell => formatIdno(cell.getValue()) },
                        { title: "계약일자", field: "contractYmd", hozAlign: "center", width: 105, formatter: cell => formatDateVal(cell.getValue()) },
                        { title: "대표자명", field: "ceoNm", hozAlign: "center", width: 110 },
                        { title: "대표전화번호", field: "telNo", hozAlign: "center", width: 120 },
                        { title: "팩스번호", field: "faxNo", hozAlign: "center", width: 120 },
                        { title: "E-Mail 주소", field: "email", minWidth: 150 },
                        { title: "우편번호", field: "post", hozAlign: "center", width: 80 },
                        { title: "주소", field: "juso", minWidth: 200 }
                    ]
                });
            }

            // Global functions for controller integration
            window.loadJa010aMaster = function(targetCorpGr) {
                const filterSelect = document.getElementById("filterCorpGr");
                const corpGr = targetCorpGr != null ? targetCorpGr : (filterSelect ? filterSelect.value : "");

                fetch('/api/company/ja010a/master')
                    .then(res => res.json())
                    .then(data => {
                        if (gridMaster) {
                            gridMaster.setData(Array.isArray(data) ? data : []);
                            if (Array.isArray(data) && data.length > 0) {
                                setTimeout(() => {
                                    const rows = gridMaster.getRows();
                                    let targetRow = null;
                                    if (corpGr) {
                                        rows.forEach(r => {
                                            if (r.getData().corpGr === corpGr) targetRow = r;
                                        });
                                    }
                                    if (!targetRow && rows.length > 0) targetRow = rows[0];

                                    if (targetRow) {
                                        gridMaster.deselectRow();
                                        targetRow.select();
                                        const d = targetRow.getData();
                                        if (d.corpGr) fetchJa010aDetail(d.corpGr);
                                    }
                                }, 100);
                            } else {
                                if (gridDetail) gridDetail.setData([]);
                            }
                        }
                    })
                    .catch(err => console.error("Error loading master ja010a:", err));
            };

            function fetchJa010aDetail(corpGr) {
                fetch(`/api/company/ja010a/detail?corpGr=${encodeURIComponent(corpGr)}`)
                    .then(res => res.json())
                    .then(data => {
                        if (gridDetail) gridDetail.setData(Array.isArray(data) ? data : []);
                    })
                    .catch(err => console.error("Error fetching ja010a detail:", err));
            }

            // Register standard CorpGr change contract method on current tab pane
            const currentScript = document.currentScript;
            const pane = currentScript ? currentScript.closest('.tab-pane') : null;
            if (pane) {
                pane.onCorpGrChange = function(val) {
                    window.loadJa010aMaster(val);
                };
                pane.addEventListener("corpGrChanged", function(e) {
                    window.loadJa010aMaster(e.detail ? e.detail.corpGr : val);
                });
            }

            // Initialize both grids on view load
            initMasterGrid();
            initDetailGrid();
        })();
    </script>
</div>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container proposal-container" th:fragment="proposalView">

    <style>
        .proposal-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            box-sizing: border-box;
            background-color: #f8fafc;
        }

        .proposal-main-content {
            display: flex;
            flex: 1;
            height: calc(100% - 40px);
            overflow: hidden;
            padding: 4px 8px 8px 8px;
            gap: 6px;
        }

        /* Left Column (Filter + Master Grid) */
        .proposal-left-pane {
            flex: 1.1;
            display: flex;
            flex-direction: column;
            min-width: 450px;
            height: 100%;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            overflow: hidden;
        }

        .proposal-left-pane .filter-bar {
            padding: 6px 10px;
            background-color: #f1f5f9;
            border-bottom: 1px solid #cbd5e1;
            margin-bottom: 0;
        }

        .proposal-left-pane .master-grid-wrapper {
            flex: 1;
            height: 100%;
            min-height: 0;
            padding: 2px;
        }

        /* Vertical Split Bar */
        .proposal-v-divider {
            width: 4px;
            background-color: #cbd5e1;
            border-radius: 2px;
            margin: 0 1px;
        }

        /* Right Column (Matter + Content + Comment Grid) */
        .proposal-right-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 400px;
            height: 100%;
            gap: 6px;
        }

        .proposal-right-pane .right-section {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .proposal-right-pane .matter-section {
            flex: 1.1;
            min-height: 120px;
        }

        .proposal-right-pane .content-section {
            flex: 0.9;
            min-height: 100px;
        }

        .proposal-right-pane .comment-section {
            flex: 1.3;
            min-height: 150px;
        }

        /* Section Headers */
        .proposal-right-pane .section-header-bar {
            padding: 4px 8px;
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .proposal-right-pane .header-help-text {
            font-size: 11px;
            color: #2563eb;
            font-weight: 600;
        }

        .proposal-right-pane .header-help-text .kbd {
            background-color: #dbeafe;
            color: #1e40af;
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 10.5px;
            font-weight: 700;
        }

        .proposal-right-pane .header-title {
            font-size: 12px;
            font-weight: 700;
            color: #1e293b;
        }

        .proposal-right-pane .proposal-textarea {
            flex: 1;
            width: 100%;
            resize: none;
            border: none;
            padding: 8px 10px;
            font-size: 12px;
            line-height: 1.5;
            font-family: inherit;
            color: #0f172a;
            background-color: #ffffff;
            box-sizing: border-box;
            outline: none;
        }

        /* Comment Header & Buttons */
        .comment-grid-header {
            padding: 4px 8px;
            background-color: #f1f5f9;
            border-bottom: 1px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .comment-grid-header .grid-title {
            font-size: 12px;
            font-weight: 700;
            color: #0f172a;
        }

        .comment-grid-header .comment-tools {
            display: flex;
            gap: 4px;
        }

        .comment-grid-header .grid-tool-btn {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 3px;
            padding: 2px 6px;
            font-size: 11px;
            color: #475569;
            cursor: pointer;
        }

        .comment-grid-header .grid-tool-btn:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        /* File badges in Master Grid */
        .file-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 10.5px;
            font-weight: 700;
        }

        .file-badge.badge-img {
            background-color: #fee2e2;
            color: #dc2626;
        }

        .file-badge.badge-excel {
            background-color: #dcfce7;
            color: #166534;
        }

        .file-badge.badge-file {
            background-color: #e0f2fe;
            color: #0369a1;
        }
    </style>

    <!-- Top Action Control Bar (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <!-- Reusable Common Toolbar Buttons Fragment (닫기 ~ 엑셀) -->
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
            <button class="t-btn btn-action" onclick="loadProposalMaster()"><i class="fa-solid fa-magnifying-glass"></i> 조회</button>
        </div>
        <!-- Reusable Common Breadcrumb Fragment -->
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- Main Left/Right Split Layout Container -->
    <div class="proposal-main-content">

        <!-- LEFT COLUMN: Filter Bar + Master Grid -->
        <div class="proposal-left-pane">
            <!-- Sub Filter Bar: Common 운용사 Select Box (dddwId='CORP_GR', seq=1) -->
            <div th:replace="~{fragments/filter/corp_filter :: corpFilter(dddwId='CORP_GR', seq=1)}"></div>

            <!-- Master Grid Section -->
            <div class="master-grid-wrapper">
                <div id="grid-proposal-master" class="tabulator-aams-grid"></div>
            </div>
        </div>

        <!-- Vertical Divider -->
        <div class="proposal-v-divider"></div>

        <!-- RIGHT COLUMN: Matter Text + Content Text + Comment Grid -->
        <div class="proposal-right-pane">

            <!-- Top Right Section: 개발 의뢰내용 (Matter) -->
            <div class="right-section matter-section">
                <div class="section-header-bar">
                    <span class="header-help-text">머리글 수준 <span class="kbd">Ctrl</span> 증가[->], 감소[<-], 모양변경(최근사용분부터) <span class="kbd">Ctrl</span> [Home, ↑]/[↓, End] 선택줄이동-SPACE</span>
                </div>
                <textarea id="proposalMatter" class="proposal-textarea" readonly placeholder="상단 목록에서 항목을 선택하십시오."></textarea>
            </div>

            <!-- Middle Right Section: 처리 내용 (Content) -->
            <div class="right-section content-section">
                <div class="section-header-bar">
                    <span class="header-title">※ 수정완료</span>
                </div>
                <textarea id="proposalContent" class="proposal-textarea" readonly placeholder="처리 내역이 여기에 표시됩니다."></textarea>
            </div>

            <!-- Bottom Right Section: 댓글현황 (Comment Grid) -->
            <div class="right-section comment-section">
                <div class="comment-grid-header">
                    <span class="grid-title">■ 댓글현황</span>
                    <div class="comment-tools">
                        <button class="grid-tool-btn" title="댓글 추가"><i class="fa-solid fa-plus"></i></button>
                        <button class="grid-tool-btn" title="댓글 삭제"><i class="fa-solid fa-trash"></i></button>
                        <button class="grid-tool-btn" title="댓글 저장"><i class="fa-solid fa-floppy-disk"></i></button>
                        <button class="grid-tool-btn" title="이전"><i class="fa-solid fa-step-backward"></i></button>
                        <button class="grid-tool-btn" title="다음"><i class="fa-solid fa-step-forward"></i></button>
                    </div>
                </div>
                <div class="grid-table-wrapper" style="flex: 1; height: 100%;">
                    <div id="grid-proposal-comment" class="tabulator-aams-grid"></div>
                </div>
            </div>

        </div>

    </div>

    <!-- Inline Script for Proposal View with Tabulator Grids -->
    <script th:inline="javascript">
        (function() {
            let gridMaster = null;
            let gridComment = null;

            const initialMasterData = /*[[${masterList}]]*/ [];

            function formatDateVal(val) {
                if (!val) return "";
                const str = String(val).replace(/\D/g, "");
                if (str.length >= 8) {
                    let res = str.substring(0, 4) + '.' + str.substring(4, 6) + '.' + str.substring(6, 8);
                    if (str.length >= 12) {
                        res += ' ' + str.substring(8, 10) + ':' + str.substring(10, 12);
                    }
                    return res;
                }
                return String(val);
            }

            // 1. Initialize Master Tabulator Grid (d_proposal_list / PROPOSAL)
            function initMasterGrid() {
                const container = document.getElementById("grid-proposal-master");
                if (!container) return;

                gridMaster = new Tabulator(container, {
                    data: initialMasterData || [],
                    layout: "fitDataFill",
                    height: "100%",
                    selectableRows: 1,
                    placeholder: "<span>조회된 건의사항/개선요청 내역이 없습니다.</span>",
                    columnDefaults: { vertAlign: "middle", headerSortTristate: true },
                    columns: [
                        { title: "No.", formatter: "rownum", hozAlign: "center", width: 40, resizable: false, widthGrow: 0 },
                        { title: "의뢰일시", field: "ymd", hozAlign: "center", width: 125, formatter: cell => formatDateVal(cell.getValue()) },
                        { title: "개발 의뢰내용", field: "title", minWidth: 200 },
                        { title: "의뢰자", field: "proposer", hozAlign: "center", width: 75, formatter: cell => `<span style="color: #2563eb; font-weight: 600;">${cell.getValue() || ''}</span>` },
                        { title: "완료일시", field: "contentYmd", hozAlign: "center", width: 125, formatter: cell => formatDateVal(cell.getValue()) },
                        { 
                            title: "첨부파일", 
                            field: "fexp", 
                            hozAlign: "center", 
                            width: 75, 
                            formatter: function(cell) {
                                const val = cell.getValue();
                                if (!val || val === '-') return '';
                                const ext = String(val).toUpperCase();
                                if (ext === 'PNG' || ext === 'JPG' || ext === 'GIF') {
                                    return `<span class="file-badge badge-img"><i class="fa-solid fa-file-image"></i> ${ext}</span>`;
                                } else if (ext === 'XLSX' || ext === 'XLS' || ext === 'CSV') {
                                    return `<span class="file-badge badge-excel"><i class="fa-solid fa-file-excel"></i> ${ext}</span>`;
                                } else {
                                    return `<span class="file-badge badge-file"><i class="fa-solid fa-folder-open"></i> ${ext}</span>`;
                                }
                            }
                        }
                    ]
                });

                gridMaster.on("rowClick", function(e, row) {
                    gridMaster.deselectRow();
                    row.select();
                    const data = row.getData();
                    updateDetailPanel(data);
                });

                // Auto select first row on build
                gridMaster.on("tableBuilt", function() {
                    const rows = gridMaster.getRows();
                    if (rows && rows.length > 0) {
                        rows[0].select();
                        updateDetailPanel(rows[0].getData());
                    }
                });
            }

            // 2. Initialize Comment Grid (d_proposal_2 / PROPOSAL_APPEND)
            function initCommentGrid() {
                const container = document.getElementById("grid-proposal-comment");
                if (!container) return;

                gridComment = new Tabulator(container, {
                    layout: "fitColumns",
                    height: "100%",
                    placeholder: "<span>상단 목록에서 항목을 선택하세요.</span>",
                    columnDefaults: { vertAlign: "middle", headerSortTristate: true },
                    columns: [
                        { title: "No.", formatter: "rownum", hozAlign: "center", width: 40, resizable: false, widthGrow: 0 },
                        { title: "댓글입력일시", field: "ymd", hozAlign: "center", width: 135, formatter: cell => formatDateVal(cell.getValue()) },
                        { title: "입력자", field: "sbNm", hozAlign: "center", width: 85 },
                        { title: "댓  글  내  용", field: "appending", minWidth: 200 }
                    ]
                });
            }

            function updateDetailPanel(data) {
                if (!data) return;
                const matterEl = document.getElementById("proposalMatter");
                const contentEl = document.getElementById("proposalContent");

                if (matterEl) matterEl.value = data.matter || "";
                if (contentEl) contentEl.value = data.content || "";

                if (data.corpGr) {
                    fetchProposalComments(data.corpGr, data.ymd, data.proposer);
                }
            }

            // Capture script element and tab pane scope at TOP LEVEL during synchronous parsing
            const currentScript = document.currentScript;
            const pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;

            function getCookieVal(name) {
                const value = `; ${document.cookie}`;
                const parts = value.split(`; ${name}=`);
                if (parts.length === 2) return decodeURIComponent(parts.pop().split(';').shift());
                return "";
            }

            window.loadProposalMaster = function(targetCorpGr) {
                const filterSelect = pane ? pane.querySelector('select[name="corpGr"]') : document.getElementById("filterCorpGr");
                const corpGr = (targetCorpGr != null && String(targetCorpGr).trim() !== "")
                    ? targetCorpGr 
                    : (filterSelect && filterSelect.value ? filterSelect.value : (getCookieVal("savedCorpGr") || getCookieVal("corpGr") || getCookieVal("corp_gr")));

                // Reset detail panels
                const matterEl = document.getElementById("proposalMatter");
                const contentEl = document.getElementById("proposalContent");
                if (matterEl) matterEl.value = "";
                if (contentEl) contentEl.value = "";
                if (gridComment) gridComment.setData([]);
                
                fetch(`/api/proposal/master?corpGr=${encodeURIComponent(corpGr)}`)
                    .then(res => res.json())
                    .then(data => {
                        if (gridMaster) {
                            gridMaster.setData(data || []);
                            // Auto select first row on data refresh
                            const rows = gridMaster.getRows();
                            if (rows && rows.length > 0) {
                                rows[0].select();
                                updateDetailPanel(rows[0].getData());
                            }
                        }
                    })
                    .catch(err => console.error("Failed to load proposal master:", err));
            };

            function fetchProposalComments(corpGr, ymd, proposer) {
                let url = `/api/proposal/comment?corpGr=${encodeURIComponent(corpGr)}`;
                if (ymd) url += `&ymd=${encodeURIComponent(ymd)}`;
                if (proposer) url += `&proposer=${encodeURIComponent(proposer)}`;

                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        if (gridComment) {
                            gridComment.setData(data || []);
                        }
                    })
                    .catch(err => console.error("Failed to load proposal comments:", err));
            }

            // Register standard CorpGr change contract method on current tab pane
            if (pane) {
                pane.onCorpGrChange = function(val) {
                    window.loadProposalMaster(val);
                };
                pane.addEventListener("corpGrChanged", function(e) {
                    const selectedVal = (e.detail && e.detail.corpGr) ? e.detail.corpGr : "";
                    window.loadProposalMaster(selectedVal);
                });
            }

            document.addEventListener("DOMContentLoaded", function() {
                initMasterGrid();
                initCommentGrid();
            });

            // Initialize immediately if DOM is ready
            if (document.readyState === "complete" || document.readyState === "interactive") {
                setTimeout(() => {
                    initMasterGrid();
                    initCommentGrid();
                }, 50);
            }
        })();
    </script>
</div>
</html>

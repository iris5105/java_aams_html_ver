<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-split-lr proposal-container" th:fragment="proposalView">

    <style>
        .proposal-right-pane .matter-section {
            flex: 1.1;
            min-height: 120px;
        }

        .proposal-right-pane .content-section {
            flex: 0.9;
            min-height: 100px;
        }

        .proposal-right-pane .comment-section {
            flex: 1.3;
            min-height: 150px;
        }

        /* Section Headers */
        .proposal-right-pane .section-header-bar {
            padding: 4px 8px;
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .proposal-right-pane .header-help-text {
            font-size: 11px;
            color: #2563eb;
            font-weight: 600;
        }

        .proposal-right-pane .header-help-text .kbd {
            background-color: #dbeafe;
            color: #1e40af;
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 10.5px;
            font-weight: 700;
        }

        .proposal-right-pane .header-title {
            font-size: 12px;
            font-weight: 700;
            color: #1e293b;
        }

        .proposal-right-pane .proposal-textarea {
            flex: 1;
            width: 100%;
            resize: none;
            border: none;
            padding: 8px 10px;
            font-size: 12px;
            line-height: 1.5;
            font-family: inherit;
            color: #0f172a;
            background-color: #ffffff;
            box-sizing: border-box;
            outline: none;
        }

        /* Comment Header & Buttons */
        .comment-grid-header {
            padding: 4px 8px;
            background-color: #f1f5f9;
            border-bottom: 1px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .comment-grid-header .grid-title {
            font-size: 12px;
            font-weight: 700;
            color: #0f172a;
        }

        .comment-grid-header .comment-tools {
            display: flex;
            gap: 4px;
        }

        .comment-grid-header .grid-tool-btn {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 3px;
            padding: 2px 6px;
            font-size: 11px;
            color: #475569;
            cursor: pointer;
        }

        .comment-grid-header .grid-tool-btn:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        /* File badges in Master Grid */
        .file-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 10.5px;
            font-weight: 700;
        }

        .file-badge.badge-img {
            background-color: #fee2e2;
            color: #dc2626;
        }

        .file-badge.badge-excel {
            background-color: #dcfce7;
            color: #166534;
        }

        .file-badge.badge-file {
            background-color: #e0f2fe;
            color: #0369a1;
        }

        /* Selected row style */
        .tabulator-row.tabulator-selected,
        .tabulator-row.tabulator-selected .tabulator-cell {
            background-color: #dbeafe !important;
        }
        .tabulator-row {
            cursor: pointer;
        }
    </style>

    <!-- Top Action Control Bar (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <!-- Reusable Common Toolbar Buttons Fragment (닫기 ~ 엑셀) -->
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
            <button class="t-btn btn-action" onclick="loadProposalMaster()"><i class="fa-solid fa-magnifying-glass"></i> 조회</button>
        </div>
        <!-- Reusable Common Breadcrumb Fragment -->
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- Main Left/Right Split Layout Container -->
    <div class="split-lr-container proposal-main-content">

        <!-- LEFT COLUMN: Filter Bar + Master Grid -->
        <div class="split-left-section proposal-left-pane">
            <!-- Sub Filter Bar: Common 운용사 Select Box (dddwId='CORP_GR', seq=1) -->
            <div th:replace="~{fragments/filter/corp_filter :: corpFilter(dddwId='CORP_GR', seq=1,label ='자산운용(자문)사' )}"></div>

            <!-- Master Grid Section -->
            <div class="master-grid-wrapper">
                <div id="master-grid" class="tabulator-aams-grid"></div>
            </div>
        </div>

        <!-- Vertical Divider -->
        <div class="split-v-divider proposal-v-divider"></div>

        <!-- RIGHT COLUMN: Matter Text + Content Text + Comment Grid -->
        <div class="split-right-section proposal-right-pane">

            <!-- Top Right Section: 개발 의뢰내용 (Matter) -->
            <div class="right-section matter-section">
                <div class="section-header-bar">
                    <span class="header-help-text">머리글 수준 <span class="kbd">Ctrl</span> 증가[->], 감소[<-], 모양변경(최근사용분부터) <span class="kbd">Ctrl</span> [Home, ↑]/[↓, End] 선택줄이동-SPACE</span>
                </div>
                <textarea id="proposalMatter" class="proposal-textarea" placeholder="개발 의뢰 내용을 입력하십시오."></textarea>
            </div>

            <!-- Middle Right Section: 처리 내용 (Content) -->
            <div class="right-section content-section">
                <div class="section-header-bar">
                    <span class="header-title">※ 수정완료</span>
                </div>
                <textarea id="proposalContent" class="proposal-textarea" placeholder="처리 내역을 입력하십시오."></textarea>
            </div>

            <!-- Bottom Right Section: 댓글현황 (Comment Grid) -->
            <div class="right-section comment-section">
                <div class="comment-grid-header">
                    <span class="grid-title">■ 댓글현황</span>
                    <div class="comment-tools">
                        <button type="button" id="btnAddComment" class="grid-tool-btn" title="댓글 추가"><i class="fa-solid fa-plus"></i></button>
                        <button type="button" id="btnDeleteComment" class="grid-tool-btn" title="댓글 삭제"><i class="fa-solid fa-trash"></i></button>
                        <button type="button" id="btnPrevComment" class="grid-tool-btn" title="이전"><i class="fa-solid fa-step-backward"></i></button>
                        <button type="button" id="btnNextComment" class="grid-tool-btn" title="다음"><i class="fa-solid fa-step-forward"></i></button>
                    </div>
                </div>
                <div class="grid-table-wrapper" style="flex: 1; height: 100%;">
                    <div id="grid-proposal-comment" class="tabulator-aams-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Inline Script for Proposal View with Tabulator Grids -->
    <script th:inline="javascript">
        (function() {
            let gridMaster = null;
            let gridComment = null;

            const initialMasterData = /*[[${masterList}]]*/ [];

            function resolveCurrentUserNm() {
                // 1. Server-injected model attribute
                let u = /*[[${userNm}]]*/ "";
                if (u && String(u).trim()) return String(u).trim();

                // 2. Cookie values (userNm, userName, user_nm)
                const cVal = getCookieVal("userNm") || getCookieVal("userName") || getCookieVal("user_nm");
                if (cVal && String(cVal).trim()) {
                    try {
                        return decodeURIComponent(cVal).trim();
                    } catch(e) {
                        return String(cVal).trim();
                    }
                }

                // 3. LocalStorage userNm
                try {
                    const lsUserNm = localStorage.getItem("userNm");
                    if (lsUserNm && lsUserNm.trim()) return lsUserNm.trim();
                } catch(e) {}

                // 4. Try parsing JWT accessToken from cookie or localStorage
                const token = getCookieVal("accessToken") || (function() {
                    try { return localStorage.getItem("accessToken"); } catch(e) { return ""; }
                })();
                if (token && token.includes('.')) {
                    try {
                        const base64Url = token.split('.')[1];
                        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                        const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                        }).join(''));
                        const obj = JSON.parse(jsonPayload);
                        if (obj.userNm) return obj.userNm;
                        if (obj.name) return obj.name;
                    } catch(e) {}
                }

                // 5. Fallback to DOM top header user name element (e.g. "김태현 님")
                const userEl = document.querySelector(".user-info .user-name");
                if (userEl && userEl.textContent) {
                    const txt = userEl.textContent.replace(/님|\s+/g, "").trim();
                    if (txt) return txt;
                }

                return getCookieVal("userId") || "";
            }

            function isCurrentUserProposer(cellOrRow) {
                if (!cellOrRow) return false;
                const row = (typeof cellOrRow.getRow === 'function') ? cellOrRow.getRow() : cellOrRow;
                const data = (typeof row.getData === 'function') ? row.getData() : row;
                if (!data) return false;
                if (data.isNew) return true;
                const currentNm = resolveCurrentUserNm();
                const proposer = (data.proposer || '').trim();
                return Boolean(currentNm && proposer && (currentNm === proposer || proposer.includes(currentNm) || currentNm.includes(proposer)));
            }

            // Master grid title conditional edit check (Only allows edit if current user is proposer or new row)
            function isProposalEditable(cell) {
                if (!cell) return false;
                const row = typeof cell.getRow === 'function' ? cell.getRow() : null;
                if (!row) return false;
                const data = row.getData();
                if (!data) return false;

                const canEdit = isCurrentUserProposer(cell);
                if (canEdit) {
                    return true;
                } else {
                    // 사용자와 의뢰자가 다름: 편집 차단 및 즉시 행 선택 & 상세 패널 조회
                    if (gridMaster && (!row.isSelected || !row.isSelected())) {
                        gridMaster.deselectRow();
                        row.select();
                        updateDetailPanel(data);
                    }
                    return false;
                }
            }

            // Comment grid appending conditional edit check (Only author or new row)
            function isCommentEditable(cell) {
                if (!cell) return false;
                const row = typeof cell.getRow === 'function' ? cell.getRow() : null;
                if (!row) return false;
                const data = row.getData();
                if (!data) return false;

                const currentNm = resolveCurrentUserNm();
                const canEdit = Boolean(data.isNew || !data.sbNm || !currentNm || data.sbNm === currentNm);
                if (canEdit) {
                    return true;
                } else {
                    if (gridComment && (!row.isSelected || !row.isSelected())) {
                        gridComment.deselectRow();
                        row.select();
                    }
                    return false;
                }
            }

            function formatDateVal(val) {
                if (!val) return "";
                const str = String(val).replace(/\D/g, "");
                if (str.length >= 8) {
                    let res = str.substring(0, 4) + '.' + str.substring(4, 6) + '.' + str.substring(6, 8);
                    if (str.length >= 12) {
                        res += ' ' + str.substring(8, 10) + ':' + str.substring(10, 12);
                    }
                    return res;
                }
                return String(val);
            }

            // 1. Initialize Master Tabulator Grid (d_proposal_list / PROPOSAL)
            function initMasterGrid() {
                const container = pane ? pane.querySelector("#master-grid") : document.getElementById("master-grid");
                if (!container) return;

                gridMaster = new Tabulator(container, {
                    data: initialMasterData || [],
                    layout: "fitDataFill",
                    height: "100%",
                    selectableRows: 1,
                    editTriggerEvent: "click",
                    placeholder: "<span>조회된 건의사항/개선요청 내역이 없습니다.</span>",
                    columnDefaults: { vertAlign: "middle", headerSortTristate: true },
                    columns: [
                        { title: "No.", formatter: "rownum", hozAlign: "center", width: 40, resizable: false, widthGrow: 0 },
                        { title: "의뢰일시", field: "ymd", hozAlign: "center", width: 125, formatter: cell => formatDateVal(cell.getValue()) },
                        { 
                            title: "개발 의뢰내용", 
                            field: "title", 
                            minWidth: 200, 
                            editor: "input",
                            editable: isProposalEditable
                        },
                        { 
                            title: "의뢰자", 
                            field: "proposer", 
                            hozAlign: "center", 
                            width: 80,
                            formatter: cell => {
                                let val = cell.getValue();
                                if (val == null || String(val).trim() === "") {
                                    val = resolveCurrentUserNm();
                                }
                                return `<span style="color: #2563eb; font-weight: 600;">${val || ''}</span>`;
                            }
                        },
                        { title: "완료일시", field: "contentYmd", hozAlign: "center", width: 125, formatter: cell => formatDateVal(cell.getValue()) },
                        { 
                            title: "첨부파일", 
                            field: "fexp", 
                            hozAlign: "center", 
                            width: 75, 
                            formatter: function(cell) {
                                const val = cell.getValue();
                                if (!val || val === '-') return '';
                                const ext = String(val).toUpperCase();
                                if (ext === 'PNG' || ext === 'JPG' || ext === 'GIF') {
                                    return `<span class="file-badge badge-img"><i class="fa-solid fa-file-image"></i> ${ext}</span>`;
                                } else if (ext === 'XLSX' || ext === 'XLS' || ext === 'CSV') {
                                    return `<span class="file-badge badge-excel"><i class="fa-solid fa-file-excel"></i> ${ext}</span>`;
                                } else {
                                    return `<span class="file-badge badge-file"><i class="fa-solid fa-folder-open"></i> ${ext}</span>`;
                                }
                            }
                        }
                    ]
                });

                                // Capturing phase listener: guarantees row selection before cell's stopPropagation can block it
                container.addEventListener("click", function(e) {
                    const rowEl = e.target.closest(".tabulator-row");
                    if (!rowEl || !gridMaster) return;
                    const row = gridMaster.getRow(rowEl);
                    if (row) {
                        const data = row.getData();
                        if (!row.isSelected || !row.isSelected()) {
                            gridMaster.deselectRow();
                            row.select();
                            updateDetailPanel(data);
                        }
                    }
                }, true);

                gridMaster.on("cellClick", function(e, cell) {
                    const row = cell.getRow();
                    if (row) {
                        gridMaster.deselectRow();
                        row.select();
                        updateDetailPanel(row.getData());
                    }
                });

                gridMaster.on("rowClick", function(e, row) {
                    gridMaster.deselectRow();
                    row.select();
                    updateDetailPanel(row.getData());
                });

                // Auto select first row on build
                gridMaster.on("tableBuilt", function() {
                    const rows = gridMaster.getRows();
                    if (rows && rows.length > 0) {
                        gridMaster.deselectRow();
                        rows[0].select();
                        updateDetailPanel(rows[0].getData());
                    } else {
                        updateDetailPanel(null);
                    }
                });
            }

            // 2. Initialize Comment Grid (d_proposal_2 / PROPOSAL_APPEND)
            function initCommentGrid() {
                const container = pane ? pane.querySelector("#grid-proposal-comment") : document.getElementById("grid-proposal-comment");
                if (!container) return;

                gridComment = new Tabulator(container, {
                    layout: "fitColumns",
                    height: "100%",
                    selectableRows: 1,
                    editTriggerEvent: "click",
                    placeholder: "<span>선택된 의뢰건에 등록된 댓글이 없습니다.</span>",
                    columnDefaults: { vertAlign: "middle", headerSortTristate: true },
                    columns: [
                        { title: "No.", formatter: "rownum", hozAlign: "center", width: 40, resizable: false, widthGrow: 0 },
                        { title: "댓글입력일시", field: "ymd", hozAlign: "center", width: 135, formatter: cell => formatDateVal(cell.getValue()) },
                        { 
                            title: "입력자", 
                            field: "sbNm", 
                            hozAlign: "center", 
                            width: 85,
                            formatter: cell => {
                                const row = cell.getRow().getData();
                                if (row && row.color === 16711680) {
                                    return `<span style="color: #2563eb; font-weight: 700;">${cell.getValue() || ''}</span>`;
                                }
                                return cell.getValue() || '';
                            }
                        },
                        { 
                            title: "댓  글  내  용", 
                            field: "appending", 
                            minWidth: 200,
                            editor: "input",
                            editable: isCommentEditable,
                            formatter: cell => {
                                const row = cell.getRow().getData();
                                if (row && row.color === 16711680) {
                                    return `<span style="color: #2563eb; font-weight: 600;">${cell.getValue() || ''}</span>`;
                                }
                                return cell.getValue() || '';
                            }
                        }
                    ]
                });

                                // Capturing phase listener for comment grid
                container.addEventListener("click", function(e) {
                    const rowEl = e.target.closest(".tabulator-row");
                    if (!rowEl || !gridComment) return;
                    const row = gridComment.getRow(rowEl);
                    if (row) {
                        if (!row.isSelected || !row.isSelected()) {
                            gridComment.deselectRow();
                            row.select();
                        }
                    }
                }, true);

                gridComment.on("rowClick", function(e, row) {
                    gridComment.deselectRow();
                    row.select();
                });
            }

            function updateDetailPanel(data) {
                const matterEl = pane ? pane.querySelector("#proposalMatter") : document.getElementById("proposalMatter");
                const contentEl = pane ? pane.querySelector("#proposalContent") : document.getElementById("proposalContent");

                if (!data) {
                    if (matterEl) matterEl.value = "";
                    if (contentEl) contentEl.value = "";
                    if (gridComment) gridComment.setData([]);
                    return;
                }

                if (matterEl) {
                    matterEl.value = data.matter || "";
                    const canEditMatter = isCurrentUserProposer(data);
                    matterEl.readOnly = !canEditMatter;
                    matterEl.style.backgroundColor = canEditMatter ? "#ffffff" : "#f8fafc";
                }
                if (contentEl) contentEl.value = data.content || "";

                const filterSelect = pane ? pane.querySelector('select[name="corpGr"]') : document.getElementById("filterCorpGr");
                const corpGr = data.corpGr || (filterSelect && filterSelect.value ? filterSelect.value : (getCookieVal("savedCorpGr") || getCookieVal("corpGr") || getCookieVal("corp_gr")));

                if (corpGr && data.ymd && data.proposer) {
                    fetchProposalComments(corpGr, data.ymd, data.proposer);
                } else {
                    if (gridComment) gridComment.setData([]);
                }
            }

            // Capture script element and tab pane scope at TOP LEVEL during synchronous parsing
            const currentScript = document.currentScript;
            const pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;

            function getCookieVal(name) {
                const value = `; ${document.cookie}`;
                const parts = value.split(`; ${name}=`);
                if (parts.length === 2) return decodeURIComponent(parts.pop().split(';').shift());
                return "";
            }

            window.loadProposalMaster = function(targetCorpGr) {
                lastLoadedProposalKey = null;
                const filterSelect = pane ? pane.querySelector('select[name="corpGr"]') : document.getElementById("filterCorpGr");
                const corpGr = (targetCorpGr != null && String(targetCorpGr).trim() !== "")
                    ? targetCorpGr 
                    : (filterSelect && filterSelect.value ? filterSelect.value : (getCookieVal("savedCorpGr") || getCookieVal("corpGr") || getCookieVal("corp_gr")));

                // Reset detail panels
                const matterEl = document.getElementById("proposalMatter");
                const contentEl = document.getElementById("proposalContent");
                if (matterEl) matterEl.value = "";
                if (contentEl) contentEl.value = "";
                if (gridComment) gridComment.setData([]);
                
                fetch(`/api/proposal/master?corpGr=${encodeURIComponent(corpGr)}`)
                    .then(res => res.json())
                    .then(data => {
                        if (gridMaster) {
                            gridMaster.setData(data || []);
                            // Auto select first row on data refresh
                            const rows = gridMaster.getRows();
                            if (rows && rows.length > 0) {
                                rows[0].select();
                                updateDetailPanel(rows[0].getData());
                            }
                        }
                    })
                    .catch(err => console.error("Failed to load proposal master:", err));
            };

            let lastLoadedProposalKey = null;
            function fetchProposalComments(corpGr, ymd, proposer) {
                const key = `${corpGr}_${ymd}_${proposer}`;
                if (lastLoadedProposalKey === key) return;
                lastLoadedProposalKey = key;

                let url = `/api/proposal/comment?corpGr=${encodeURIComponent(corpGr)}`;
                if (ymd) url += `&ymd=${encodeURIComponent(ymd)}`;
                if (proposer) url += `&proposer=${encodeURIComponent(proposer)}`;

                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        if (gridComment) {
                            gridComment.setData(data || []);
                        }
                    })
                    .catch(err => console.error("Failed to load proposal comments:", err));
            }

            // Register standard contracts on current tab pane (Guideline 8)
            if (pane) {
                pane.onSearch = function() { window.loadProposalMaster(); };
                pane.onRetrieve = function() { window.loadProposalMaster(); };
                pane.onCorpGrChange = function(val) {
                    lastLoadedProposalKey = null;
                    window.loadProposalMaster(val);
                };
                pane.addEventListener("corpGrChanged", function(e) {
                    lastLoadedProposalKey = null;
                    const selectedVal = (e.detail && e.detail.corpGr) ? e.detail.corpGr : "";
                    window.loadProposalMaster(selectedVal);
                });

                // Provide default initial data when [입력] toolbar button is clicked
                pane.getNewRowData = function() {
                    const now = new Date();
                    const pad = n => String(n).padStart(2, '0');
                    const nowYmd = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
                    const userNm = resolveCurrentUserNm();
                    const filterSelect = pane ? pane.querySelector('select[name="corpGr"]') : document.getElementById("filterCorpGr");
                    const corpGr = filterSelect ? filterSelect.value : (getCookieVal("savedCorpGr") || getCookieVal("corpGr") || getCookieVal("corp_gr") || "");

                    return {
                        corpGr: corpGr,
                        ymd: nowYmd,
                        proposer: userNm,
                        title: "",
                        matter: "",
                        contentYmd: "",
                        content: "",
                        fexp: "",
                        saveVisible: 1,
                        isNew: true
                    };
                };

                pane.addEventListener("masterRowInserted", function(e) {
                    if (e.detail && e.detail.data) {
                        updateDetailPanel(e.detail.data);
                    }
                });
            }

            // Sync Matter / Content textarea inputs to selected row in gridMaster
            const matterEl = document.getElementById("proposalMatter");
            if (matterEl) {
                matterEl.addEventListener("input", function() {
                    if (gridMaster) {
                        const selectedRows = gridMaster.getSelectedRows();
                        if (selectedRows && selectedRows.length > 0) {
                            selectedRows[0].update({ matter: matterEl.value });
                        }
                    }
                });
            }

            const contentEl = document.getElementById("proposalContent");
            if (contentEl) {
                contentEl.addEventListener("input", function() {
                    if (gridMaster) {
                        const selectedRows = gridMaster.getSelectedRows();
                        if (selectedRows && selectedRows.length > 0) {
                            selectedRows[0].update({ content: contentEl.value });
                        }
                    }
                });
            }

            function initCommentTools() {
                const btnAdd = pane ? pane.querySelector("#btnAddComment") : document.getElementById("btnAddComment");
                const btnDel = pane ? pane.querySelector("#btnDeleteComment") : document.getElementById("btnDeleteComment");
                const btnPrev = pane ? pane.querySelector("#btnPrevComment") : document.getElementById("btnPrevComment");
                const btnNext = pane ? pane.querySelector("#btnNextComment") : document.getElementById("btnNextComment");

                if (btnAdd) {
                    btnAdd.onclick = function() {
                        if (!gridMaster || !gridComment) return;
                        const selectedMaster = gridMaster.getSelectedRows();
                        if (!selectedMaster || selectedMaster.length === 0) {
                            alert("댓글을 추가할 의뢰 건을 먼저 선택해주세요.");
                            return;
                        }
                        const masterData = selectedMaster[0].getData();

                        const now = new Date();
                        const pad = n => String(n).padStart(2, '0');
                        const nowYmd = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
                        const currentUser = resolveCurrentUserNm();

                        const newRowData = {
                            corpGr: masterData.corpGr,
                            pYmd: masterData.ymd,
                            pProposer: masterData.proposer,
                            ymd: nowYmd,
                            sbNm: currentUser,
                            appending: "",
                            color: 16711680,
                            isNew: true
                        };

                        // Tabulator 자체 addRow API로 행 추가
                        gridComment.addRow(newRowData, false).then(function(newRow) {
                            gridComment.deselectRow();
                            newRow.select();
                            newRow.scrollTo();

                            // 새로 생성된 댓글 내용(appending) 셀로 바로 편집 모드 포커스
                            setTimeout(() => {
                                const cell = newRow.getCell("appending");
                                if (cell) cell.edit(true);
                            }, 50);
                        });
                    };
                }

                if (btnDel) {
                    btnDel.onclick = function() {
                        if (!gridComment) return;
                        const selectedRows = gridComment.getSelectedRows();
                        if (!selectedRows || selectedRows.length === 0) {
                            alert("삭제할 댓글을 먼저 선택해주세요.");
                            return;
                        }

                        const rowData = selectedRows[0].getData();
                        const currentNm = resolveCurrentUserNm();
                        if (!rowData.isNew && rowData.sbNm && currentNm && rowData.sbNm !== currentNm) {
                            alert("본인이 작성한 댓글만 삭제할 수 있습니다.");
                            return;
                        }

                        if (confirm("선택한 댓글을 삭제하시겠습니까?")) {
                            // Tabulator 자체 delete API
                            selectedRows[0].delete();
                        }
                    };
                }

                if (btnPrev) {
                    btnPrev.onclick = function() {
                        if (!gridComment) return;
                        const selectedRows = gridComment.getSelectedRows();
                        if (!selectedRows || selectedRows.length === 0) {
                            const allRows = gridComment.getRows();
                            if (allRows.length > 0) {
                                allRows[0].select();
                                allRows[0].scrollTo();
                            }
                            return;
                        }
                        const prev = selectedRows[0].getPrevRow();
                        if (prev) {
                            gridComment.deselectRow();
                            prev.select();
                            prev.scrollTo();
                        }
                    };
                }

                if (btnNext) {
                    btnNext.onclick = function() {
                        if (!gridComment) return;
                        const selectedRows = gridComment.getSelectedRows();
                        if (!selectedRows || selectedRows.length === 0) {
                            const allRows = gridComment.getRows();
                            if (allRows.length > 0) {
                                allRows[0].select();
                                allRows[0].scrollTo();
                            }
                            return;
                        }
                        const next = selectedRows[0].getNextRow();
                        if (next) {
                            gridComment.deselectRow();
                            next.select();
                            next.scrollTo();
                        }
                    };
                }
            }

            // Guideline 10: Single initialization entry point with isInitialized guard
            let isInitialized = false;
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;
                initMasterGrid();
                initCommentGrid();
                initCommentTools();
            }

            document.addEventListener("DOMContentLoaded", startInit);
            if (document.readyState === "complete" || document.readyState === "interactive") {
                setTimeout(startInit, 50);
            }
        })();
    </script>
</div>
</html>

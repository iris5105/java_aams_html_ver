<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-single ja020n-container" th:fragment="ja020nView">

    <!-- Top Action Control Bar (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <!-- Reusable Common Toolbar Buttons Fragment (닫기, 새로고침, 조회, 입력, 저장, 엑셀) -->
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <!-- Reusable Common Breadcrumb Fragment -->
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- Filter Bar (Row 2): dc_ymd fragment (LOAD기준일) + Mode Tabs -->
    <div class="filter-bar">
        <div class="filter-left">
            <div th:replace="~{fragments/filter/dc_ymd :: filter(label='LOAD기준일')}"></div>
        </div>

        <!-- Mode Selection Tabs (처리결과조회 / LOAD잔고내역 / LOAD체결내역) -->
        <div class="filter-actions ja020n-mode-tabs" style="display: flex; align-items: center; gap: 4px;">
            <button type="button" class="btn-mode active" data-mode="status" style="padding: 4px 12px; font-size: 12px; font-weight: 600; border: 1px solid #2563eb; background: #2563eb; color: #ffffff; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;">
                <i class="fa-solid fa-list-check"></i> 처리결과조회
            </button>
            <button type="button" class="btn-mode" data-mode="siga" style="padding: 4px 12px; font-size: 12px; font-weight: 600; border: 1px solid #cbd5e1; background: #ffffff; color: #475569; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;">
                <i class="fa-solid fa-coins"></i> LOAD잔고내역
            </button>
            <button type="button" class="btn-mode" data-mode="tr" style="padding: 4px 12px; font-size: 12px; font-weight: 600; border: 1px solid #cbd5e1; background: #ffffff; color: #475569; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;">
                <i class="fa-solid fa-file-invoice-dollar"></i> LOAD체결내역
            </button>
            <button type="button" id="btnHtsGuide" style="padding: 4px 10px; font-size: 12px; font-weight: 500; border: 1px solid #94a3b8; background: #f1f5f9; color: #334155; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; margin-left: 8px;">
                <i class="fa-solid fa-circle-info" style="color: #0284c7;"></i> HTS 화면안내
            </button>
        </div>
    </div>

    <!-- HTS Screen Code Guide Panel (Expandable) -->
    <div id="htsGuidePanel" style="display: none; background: #f0fdf4; border-bottom: 1px solid #bbf7d0; padding: 8px 16px; font-size: 11px; color: #166534; line-height: 1.6;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <strong>[주요 증권사 HTS 화면번호 안내]</strong><br>
                미래에셋: 잔고 <code>#2885</code> / 체결 <code>#2893</code> (<code>#0650</code>) |
                한국금융: 잔고 <code>#0717</code> / 체결 <code>#0712</code> |
                삼성증권: 잔고 <code>#1573</code> / 체결 <code>#1518</code> |
                KB증권: 잔고 <code>#0885</code> / 체결 <code>#1716</code> |
                NH투자: 잔고 <code>#1610</code> / 체결 <code>#6466</code> |
                신한투자: 잔고 <code>#8022</code> / 체결 <code>#0292</code> |
                DB금투: 체결 <code>#0292</code>
            </div>
            <button type="button" id="btnCloseHtsGuide" style="background: none; border: none; font-size: 14px; cursor: pointer; color: #166534;">&times;</button>
        </div>
    </div>

    <!-- Main Grid Section -->
    <div class="grid-section" style="flex: 1 1 auto; height: calc(100% - 85px); padding: 8px 12px; overflow: hidden;">
        <div class="grid-table-wrapper" style="height: 100%; width: 100%; border: 1px solid #cbd5e1; border-radius: 4px; overflow: hidden; background-color: #fff;">
            <div id="ja020n-grid" class="tabulator-aams-grid" style="height: 100%;"></div>
        </div>
    </div>

    <!-- PowerBuilder DDDW & Common Script -->
    <script th:src="@{/js/f_dddwctl.js}" src="/js/f_dddwctl.js"></script>

    <!-- Page Specific Script for w_ja020n -->
    <script th:inline="javascript">
        (function() {
            const currentScript = document.currentScript;
            const pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;

            let gridJa020n = null;
            let currentMode = "status"; // 'status' | 'siga' | 'tr'

            // Corporate Group Resolver (Guideline 1: No default hardcoded value)
            function resolveCorpGr() {
                const globalSelect = document.getElementById("corpGrSelect");
                if (globalSelect && globalSelect.value) return globalSelect.value;

                const matchSaved = document.cookie.match(/(?:^|;\s*)savedCorpGr=([^;]*)/);
                if (matchSaved && matchSaved[1]) return decodeURIComponent(matchSaved[1]);

                const matchCorp = document.cookie.match(/(?:^|;\s*)corpGr=([^;]*)/);
                if (matchCorp && matchCorp[1]) return decodeURIComponent(matchCorp[1]);

                const serverVal = /*[[${corpGr}]]*/ null;
                if (serverVal) return serverVal;

                return "";
            }

            // Numeric Money Formatter
            function numberFormatter(cell) {
                const val = cell.getValue();
                if (val == null || val === "" || isNaN(val)) return "0";
                return Number(val).toLocaleString();
            }

            // Status Badge Formatter
            function loadOkFormatter(cell) {
                const val = cell.getValue();
                if (val === "1" || val === "Y" || val === "성공") {
                    return '<span style="color: #15803d; font-weight: 700; background: #dcfce7; padding: 2px 6px; border-radius: 4px;">성공</span>';
                } else if (val === "0" || val === "N" || val === "오류") {
                    return '<span style="color: #b91c1c; font-weight: 700; background: #fee2e2; padding: 2px 6px; border-radius: 4px;">오류</span>';
                }
                return val || "-";
            }

            // Column Definitions for Each Mode
            const columnsByMode = {
                status: [
                    { title: "작업일시", field: "loadDate", width: 170, hozAlign: "center", headerHozAlign: "center" },
                    { title: "작업자ID/IP", field: "ipUser", width: 130, hozAlign: "center", headerHozAlign: "center" },
                    { title: "작업자성명", field: "userNm", width: 110, hozAlign: "center", headerHozAlign: "center" },
                    { title: "처리결과", field: "loadOk", width: 90, hozAlign: "center", headerHozAlign: "center", formatter: loadOkFormatter },
                    { title: "처리내용", field: "loadNaye", minWidth: 280, hozAlign: "left", headerHozAlign: "center" },
                    { title: "대상기일", field: "loadYmd", width: 110, hozAlign: "center", headerHozAlign: "center" }
                ],
                siga: [
                    { title: "자산구분", field: "jasanNm", width: 90, hozAlign: "center", headerHozAlign: "center" },
                    { title: "펀드코드", field: "fundCd", width: 110, hozAlign: "center", headerHozAlign: "center" },
                    { title: "펀드명", field: "fundNm", width: 160, hozAlign: "left", headerHozAlign: "center" },
                    { title: "종목코드", field: "jmCd", width: 110, hozAlign: "center", headerHozAlign: "center" },
                    { title: "종목명", field: "jmNm", minWidth: 160, hozAlign: "left", headerHozAlign: "center" },
                    { title: "수량/금액", field: "aekm", width: 120, hozAlign: "right", headerHozAlign: "center", formatter: numberFormatter },
                    { title: "취득금액", field: "chuiAek", width: 130, hozAlign: "right", headerHozAlign: "center", formatter: numberFormatter },
                    { title: "시가금액", field: "sigaAek", width: 130, hozAlign: "right", headerHozAlign: "center", formatter: numberFormatter },
                    { title: "검증상태", field: "loadOk", width: 90, hozAlign: "center", headerHozAlign: "center", formatter: loadOkFormatter }
                ],
                tr: [
                    { title: "매매구분", field: "trCd", width: 90, hozAlign: "center", headerHozAlign: "center" },
                    { title: "펀드코드", field: "fundCd", width: 100, hozAlign: "center", headerHozAlign: "center" },
                    { title: "펀드명", field: "fundNm", width: 150, hozAlign: "left", headerHozAlign: "center" },
                    { title: "거래증권사", field: "trCoCd", width: 90, hozAlign: "center", headerHozAlign: "center" },
                    { title: "종목코드", field: "jmCd", width: 100, hozAlign: "center", headerHozAlign: "center" },
                    { title: "종목명", field: "jmNm", minWidth: 150, hozAlign: "left", headerHozAlign: "center" },
                    { title: "주문번호", field: "offerNo", width: 90, hozAlign: "center", headerHozAlign: "center" },
                    { title: "체결수량", field: "trJusu", width: 100, hozAlign: "right", headerHozAlign: "center", formatter: numberFormatter },
                    { title: "체결금액", field: "trAek", width: 120, hozAlign: "right", headerHozAlign: "center", formatter: numberFormatter },
                    { title: "계좌번호", field: "encAcctNo", width: 120, hozAlign: "center", headerHozAlign: "center" },
                    { title: "수수료", field: "susu", width: 90, hozAlign: "right", headerHozAlign: "center", formatter: numberFormatter },
                    { title: "제세금", field: "tax", width: 90, hozAlign: "right", headerHozAlign: "center", formatter: numberFormatter },
                    { title: "결제일자", field: "sudoYmd", width: 100, hozAlign: "center", headerHozAlign: "center" },
                    { title: "상태", field: "status", width: 80, hozAlign: "center", headerHozAlign: "center" },
                    { title: "검증상태", field: "loadOk", width: 80, hozAlign: "center", headerHozAlign: "center", formatter: loadOkFormatter }
                ]
            };

            // Initialize Tabulator Grid
            function initGrid() {
                const gridElement = pane ? pane.querySelector("#ja020n-grid") : document.getElementById("ja020n-grid");
                if (!gridElement) return;

                gridJa020n = new Tabulator(gridElement, {
                    layout: "fitColumns",
                    height: "100%",
                    placeholder: "조회된 데이터가 없습니다.",
                    selectableRows: 1,
                    columns: columnsByMode[currentMode]
                });

                // Rule 7: Capturing click listener to guarantee row selection
                gridElement.addEventListener("click", function(e) {
                    const rowEl = e.target.closest(".tabulator-row");
                    if (rowEl && gridJa020n) {
                        const row = gridJa020n.getRow(rowEl);
                        if (row) {
                            gridJa020n.deselectRow();
                            row.select();
                        }
                    }
                }, true);
            }

            // Data Retrieval Function (REST API by Mode)
            window.loadJa020nData = function() {
                const corpGr = resolveCorpGr();
                const filterYmdInput = pane ? pane.querySelector("#filterYmd") : document.getElementById("filterYmd");
                const ymd = filterYmdInput ? filterYmdInput.value : "";

                if (!corpGr || !ymd) {
                    if (gridJa020n) gridJa020n.setData([]);
                    return;
                }

                let apiUrl = "";
                if (currentMode === "status") {
                    apiUrl = `/api/daily/ja020n/status?corpGr=${encodeURIComponent(corpGr)}&ymd=${encodeURIComponent(ymd)}`;
                } else if (currentMode === "siga") {
                    apiUrl = `/api/daily/ja020n/siga?corpGr=${encodeURIComponent(corpGr)}&ymd=${encodeURIComponent(ymd)}`;
                } else if (currentMode === "tr") {
                    apiUrl = `/api/daily/ja020n/tr?corpGr=${encodeURIComponent(corpGr)}&ymd=${encodeURIComponent(ymd)}`;
                }

                fetch(apiUrl)
                    .then(res => res.json())
                    .then(data => {
                        if (gridJa020n) {
                            gridJa020n.setData(Array.isArray(data) ? data : []);
                        }
                    })
                    .catch(err => {
                        console.error(`Error loading ja020n [${currentMode}]:`, err);
                    });
            };

            // Switch Display Mode
            function switchMode(newMode) {
                if (currentMode === newMode) return;
                currentMode = newMode;

                // Update Button Active Style
                if (pane) {
                    pane.querySelectorAll(".btn-mode").forEach(btn => {
                        if (btn.dataset.mode === newMode) {
                            btn.style.background = "#2563eb";
                            btn.style.color = "#ffffff";
                            btn.style.borderColor = "#2563eb";
                        } else {
                            btn.style.background = "#ffffff";
                            btn.style.color = "#475569";
                            btn.style.borderColor = "#cbd5e1";
                        }
                    });
                }

                // Reconfigure Grid Columns and Reload Data
                if (gridJa020n) {
                    gridJa020n.setColumns(columnsByMode[newMode]).then(() => {
                        window.loadJa020nData();
                    });
                }
            }

            // Register standard toolbar & CorpGr contracts (Guideline 8)
            if (pane) {
                pane.onSearch = function() { window.loadJa020nData(); };
                pane.onRetrieve = function() { window.loadJa020nData(); };
                pane.onCorpGrChange = function() { window.loadJa020nData(); };

                pane.addEventListener("corpGrChanged", function() {
                    window.loadJa020nData();
                });

                // Mode switch buttons click listener
                pane.querySelectorAll(".btn-mode").forEach(btn => {
                    btn.addEventListener("click", function() {
                        switchMode(this.dataset.mode);
                    });
                });

                // HTS guide panel toggle
                const btnHts = pane.querySelector("#btnHtsGuide");
                const htsPanel = pane.querySelector("#htsGuidePanel");
                const btnCloseHts = pane.querySelector("#btnCloseHtsGuide");
                if (btnHts && htsPanel) {
                    btnHts.addEventListener("click", () => {
                        htsPanel.style.display = (htsPanel.style.display === "none") ? "block" : "none";
                    });
                }
                if (btnCloseHts && htsPanel) {
                    btnCloseHts.addEventListener("click", () => {
                        htsPanel.style.display = "none";
                    });
                }

                // Auto reload on date change
                const filterYmdInput = pane.querySelector("#filterYmd");
                if (filterYmdInput) {
                    filterYmdInput.addEventListener("change", () => window.loadJa020nData());
                }
            }

            // Guideline 10: Single initialization entry point with isInitialized guard
            let isInitialized = false;
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                initGrid();

                const corpGr = resolveCorpGr();
                const filterYmdInput = pane ? pane.querySelector("#filterYmd") : document.getElementById("filterYmd");
                if (corpGr && filterYmdInput && filterYmdInput.value) {
                    window.loadJa020nData();
                }
            }

            if (document.readyState === "complete" || document.readyState === "interactive") {
                setTimeout(startInit, 0);
            } else {
                document.addEventListener("DOMContentLoaded", startInit);
            }
        })();
    </script>
</div>
</html>

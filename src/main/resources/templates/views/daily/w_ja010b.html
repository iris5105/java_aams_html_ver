<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-split-tb ja010b-container" th:fragment="ja010bView">

    <style>
        .ja010b-container .tabulator-row.row-completed,
        .ja010b-container .tabulator-row.row-completed .tabulator-cell {
            color: #94a3b8 !important;
            background-color: #f8fafc !important;
        }

        /* 입출금 내역 섹션: 헤더 고정 및 내부 데이터 행 전용 스크롤 보장 */
        .ja010b-container .io-grid-box {
            overflow: hidden !important;
        }

        .ja010b-container .io-grid-box .grid-table-wrapper {
            overflow: hidden !important;
        }

        .ja010b-container #grid-ja010b-io {
            height: 100% !important;
            overflow: hidden !important;
        }

        .ja010b-container #grid-ja010b-io .tabulator-header {
            position: sticky !important;
            top: 0 !important;
            z-index: 2 !important;
        }

        .ja010b-container #grid-ja010b-io .tabulator-tableholder {
            overflow-y: auto !important;
            overflow-x: auto !important;
        }

        /* w_ja010b Dedicated Mobile Responsive Layout */
        @media (max-width: 767px) {
            .ja010b-container {
                display: flex !important;
                flex-direction: column !important;
                height: auto !important;
                min-height: 100% !important;
                overflow-y: auto !important;
                padding-bottom: 20px !important;
            }

            .ja010b-container .split-top-section {
                flex: 0 0 auto !important;
                height: 240px !important;
                min-height: 240px !important;
            }

            .ja010b-container .split-bottom-section {
                display: flex !important;
                flex-direction: column !important;
                flex: 0 0 auto !important;
                height: auto !important;
                gap: 12px !important;
                overflow: visible !important;
                padding-bottom: 10px !important;
            }

            .ja010b-container .split-panel.panel-left {
                width: 100% !important;
                height: 200px !important;
                min-height: 200px !important;
                flex: 0 0 auto !important;
                overflow: hidden !important;
            }

            .ja010b-container .split-panel.panel-right {
                width: 100% !important;
                height: auto !important;
                min-height: 280px !important;
                flex: 0 0 auto !important;
                display: flex !important;
                flex-direction: column !important;
                overflow: hidden !important;
                border: 1px solid #cbd5e1 !important;
                border-radius: 4px !important;
                background-color: #fff !important;
            }

            .ja010b-container .special-note-box {
                flex: 0 0 auto !important;
                height: auto !important;
            }

            .ja010b-container .special-note-box textarea {
                height: 52px !important;
                min-height: 52px !important;
            }

            .ja010b-container .io-grid-box {
                flex: 0 0 auto !important;
                height: 200px !important;
                min-height: 200px !important;
                display: flex !important;
                flex-direction: column !important;
                border-top: 1px solid #cbd5e1 !important;
                overflow: hidden !important;
            }

            .ja010b-container .io-grid-box .grid-table-wrapper {
                flex: 1 1 auto !important;
                height: calc(200px - 28px) !important;
                min-height: 160px !important;
                overflow: hidden !important;
            }

            .ja010b-container #grid-ja010b-io {
                height: 100% !important;
                min-height: 160px !important;
                overflow: hidden !important;
            }
        }
    </style>

    <!-- Top Action Control Bar (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <!-- Reusable Common Toolbar Buttons Fragment (닫기 ~ 엑셀) -->
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
            <!-- Page-specific Action Button for w_ja010b -->
            <button class="t-btn btn-action btn-pyungjan" onclick="onJa010bPyungjanCalc()"><i class="fa-solid fa-calculator"></i> 평잔재계산</button>
        </div>
        <!-- Reusable Common Breadcrumb Fragment -->
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- Sub Filter Bar (Row 2: Common 운용사 Select Box: dddwId='CORP_GR', seq=1) -->
    <div th:replace="~{fragments/filter/corp_filter :: corpFilter(dddwId='CORP_GR', seq=1)}"></div>

    <!-- Upper Master Grid Section (dw_list / d_ja010b1.srd) -->
    <div class="grid-section split-top-section">
        <div class="grid-table-wrapper">
            <div id="master-grid" class="tabulator-aams-grid"></div>
        </div>
    </div>

    <!-- Split Bar Separator -->
    <div class="split-h-divider"></div>

    <!-- 1차: 하단 섹션 (Bottom, ~50%) -->
    <!-- 2차: 하단 내부를 좌우 분할(split-lr-container)로 구성 -->
    <div class="grid-section split-bottom-section split-lr-container">
        <!-- 2차 좌측 패널 (Left: 결산기별 이력 / SZM0GI) -->
        <div class="split-left-section split-panel panel-left">
            <div class="sub-grid-header">
                <span class="sub-title"><i class="fa-solid fa-list-ol"></i> 결산기별 이력</span>
            </div>
            <div class="grid-table-wrapper">
                <div id="grid-ja010b-detail" class="tabulator-aams-grid"></div>
            </div>
        </div>

        <!-- 2차 우측 패널 (Right: 3차 상하 분할 적용) -->
        <div class="split-right-section split-panel panel-right">
            <!-- 3차 상단: 특이사항 메모 패널 (mle_special_note in w_ja010b.srw) -->
            <div class="special-note-box">
                <div class="sub-grid-header">
                    <span class="sub-title"><i class="fa-solid fa-pen-to-square"></i> 특이사항 메모</span>
                </div>
                <textarea id="mleSpecialNote" class="aams-textarea" placeholder="특이사항 메모를 입력하세요..."></textarea>
            </div>

            <!-- 3차 하단: 입출금 내역 서브 그리드 패널 (dw_1 / d_szt0io.srd / SZT0IO) -->
            <div class="io-grid-box">
                <div class="sub-grid-header">
                    <span class="sub-title"><i class="fa-solid fa-money-bill-transfer"></i> 입출금 내역</span>
                </div>
                <div class="grid-table-wrapper">
                    <div id="grid-ja010b-io" class="tabulator-aams-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Inline Script for Ja010b View with Tabulator Grids -->
    <script th:inline="javascript">
        (function() {
            const currentScript = document.currentScript;
            const pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;

            let gridMaster = null;
            let gridDetail = null;
            let gridIo = null;

            const initialMasterData = /*[[${masterList}]]*/ [];

            // DDDW Option Caches (Populated via ue_dddw_retrieve and f_dddwctl)
            let dddwOptionsMap = {
                type_gb: [],
                unyong_sabun: [],
                series_gb: [],
                target_jasan: [],
                mg_cd: []
            };

            /**
             * PowerBuilder dw_list::ue_dddw_retrieve Event Integration
             * Corresponds to dw_list::ue_dddw_retrieve in w_ja010b.srw:
             *   1. f_dddwctl (THIS, 'type_gb', dw_c.object.dddw [1], '', 9, "")
             *   2. f_dddwctl (THIS, 'unyong_sabun', dw_c.object.dddw [1], '', 1, "")
             *   3. f_dddwctl (THIS, 'series_gb', dw_c.object.dddw [1], '', 1, "")
             *   4. f_dddwctl (THIS, 'target_jasan', dw_c.object.dddw [1], '', 1, "")
             *   5. f_dddwctl (THIS, 'mg_cd', dw_c.object.dddw [1], '', 1, "")
             */
            function ue_dddw_retrieve(corpGr) {
                const filterSelect = pane ? pane.querySelector("#filterCorpGr") : document.getElementById("filterCorpGr");
                const targetCorpGr = corpGr != null ? corpGr : (filterSelect ? filterSelect.value : "");

                f_dddwctl.retrieveMultiple({
                    type_gb:        ['type_gb', targetCorpGr,'', 9,''],
                    unyong_sabun:   ['unyong_sabun', targetCorpGr, '', 1, ''],
                    series_gb:      ['series_gb', targetCorpGr, '', 1, ''],
                    target_jasan:   ['target_jasan', targetCorpGr, '', 1, ''],
                    mg_cd:          ['mg_cd', targetCorpGr, '', 1, '']
                }).then(results => {
                    dddwOptionsMap.type_gb = results.type_gb || [];
                    dddwOptionsMap.unyong_sabun = results.unyong_sabun || [];
                    dddwOptionsMap.series_gb = results.series_gb || [];
                    dddwOptionsMap.target_jasan = results.target_jasan || [];
                    dddwOptionsMap.mg_cd = results.mg_cd || [];

                    console.log('[w_ja010b ue_dddw_retrieve] Successfully retrieved DDDW options via f_dddwctl:', {
                        type_gb: dddwOptionsMap.type_gb.length,
                        unyong_sabun: dddwOptionsMap.unyong_sabun.length,
                        series_gb: dddwOptionsMap.series_gb.length,
                        target_jasan: dddwOptionsMap.target_jasan.length,
                        mg_cd: dddwOptionsMap.mg_cd.length
                    });

                    if (gridMaster) {
                        gridMaster.redraw(true);
                    }
                });
            }

            function getDddwLabel(dddwKey, codeVal) {
                return f_dddwctl.getLabel(dddwOptionsMap, dddwKey, codeVal);
            }

            function getDddwOptions(dddwKey) {
                const list = dddwOptionsMap[dddwKey] || [];
                return list.map(item => {
                    const code = (item.code != null ? item.code : (item.SEBU_CD != null ? item.SEBU_CD : (item.cd != null ? item.cd : ''))).toString().trim();
                    const name = (item.name != null ? item.name : (item.SEBU_CD_NM != null ? item.SEBU_CD_NM : (item.dscr != null ? item.dscr : code))).toString().trim();
                    return { label: name, value: code };
                });
            }

            function numFmt(val) {
                if (val == null || val === "") return "0";
                return Number(val).toLocaleString('ko-KR');
            }

            function formatDateVal(val) {
                if (!val) return "";
                const clean = String(val).replace(/\D/g, "");
                if (clean.length === 8) {
                    return clean.substring(0, 4) + '.' + clean.substring(4, 6) + '.' + clean.substring(6, 8);
                }
                return String(val).replace(/-/g, ".");
            }

            // 1. Initialize Master Tabulator Grid
            function initMasterGrid() {
                const container = pane ? pane.querySelector("#master-grid") : document.getElementById("master-grid");
                if (!container) return;

                gridMaster = new Tabulator(container, {
                    data: initialMasterData || [],
                    layout: "fitDataFill",
                    height: "100%",
                    selectableRows: 1,
                    placeholder: "<span>조회된 계좌 계약정보가 없습니다.</span>",
                    columnDefaults: { vertAlign: "middle", headerSortTristate: true },
                    rowFormatter: function(row) {
                        const data = row.getData();
                        if (data && data.typeGb && String(data.typeGb).trim().toUpperCase() === 'X') {
                            row.getElement().classList.add("row-completed");
                        }
                    },
                    columns: [
                        { title: "No.", formatter: "rownum", hozAlign: "center", width: 45, resizable: false, widthGrow: 0 },
                        { 
                            title: "증권회사", 
                            field: "mgCd", 
                            minWidth: 90, 
                            formatter: cell => getDddwLabel('mg_cd', cell.getValue() || cell.getRow().getData().mgNm),
                            editor: "list",
                            editorParams: {
                                valuesLookup: () => getDddwOptions('mg_cd'),
                                autocomplete: false,
                                listOnEmpty: true,
                                clearable: true
                            },
                            cellClick: function(e, cell) {
                                cell.edit(true);
                            }
                        },
                        { title: "고객명", field: "fundNm", minWidth: 120, editor: "input", cellClick: (e, cell) => cell.edit(true) },
                        { title: "<span style='color: #0d9488;'>관리번호</span>", field: "fundCd", hozAlign: "center", width: 75 },
                        { title: "계좌번호", field: "acctNo", minWidth: 105, formatter: cell => cell.getValue() || '-', editor: "input", cellClick: (e, cell) => cell.edit(true) },
                        { 
                            title: "계좌관리그룹", 
                            field: "seriesGb", 
                            hozAlign: "center", 
                            minWidth: 85, 
                            formatter: cell => getDddwLabel('series_gb', cell.getValue()),
                            editor: "list",
                            editorParams: {
                                valuesLookup: () => getDddwOptions('series_gb'),
                                autocomplete: false,
                                listOnEmpty: true,
                                clearable: true
                            },
                            cellClick: function(e, cell) {
                                cell.edit(true);
                            }
                        },
                        { 
                            title: "고객<br/>유형", 
                            field: "typeGb", 
                            hozAlign: "center", 
                            minWidth: 75, 
                            formatter: cell => getDddwLabel('type_gb', cell.getValue() || cell.getRow().getData().typeGbNm),
                            editor: "list",
                            editorParams: {
                                valuesLookup: () => getDddwOptions('type_gb'),
                                autocomplete: false,
                                listOnEmpty: true,
                                clearable: true
                            },
                            cellClick: function(e, cell) {
                                cell.edit(true);
                            }
                        },
                        {
                            title: "수수료(%)",
                            headerHozAlign: "center",
                            columns: [
                                { title: "<span style='color: #2563eb;'>선취</span>", field: "preBasic", hozAlign: "right", minWidth: 55, editor: "number", editorParams: { step: 0.01 }, cellClick: (e, cell) => cell.edit(true) },
                                { title: "<span style='color: #2563eb;'>후취</span>", field: "basicPer", hozAlign: "right", minWidth: 55, editor: "number", editorParams: { step: 0.01 }, cellClick: (e, cell) => cell.edit(true) }
                            ]
                        },
                        { title: "<span style='color: #2563eb;'>목표<br/>수익(%)</span>", field: "bmPer", hozAlign: "right", minWidth: 75, editor: "number", editorParams: { step: 0.01 }, cellClick: (e, cell) => cell.edit(true) },
                        { title: "<span style='color: #2563eb;'>성과<br/>보수(%)</span>", field: "successPer", hozAlign: "right", minWidth: 75, editor: "number", editorParams: { step: 0.01 }, cellClick: (e, cell) => cell.edit(true) },
                        { 
                            title: "성과보수<br/>대상자산", 
                            field: "targetJasan", 
                            hozAlign: "center", 
                            minWidth: 95, 
                            formatter: cell => getDddwLabel('target_jasan', cell.getValue()),
                            editor: "list",
                            editorParams: {
                                valuesLookup: () => getDddwOptions('target_jasan'),
                                autocomplete: false,
                                listOnEmpty: true,
                                clearable: true
                            },
                            cellClick: function(e, cell) {
                                cell.edit(true);
                            }
                        },
                        { 
                            title: "최 초<br/>계약일", 
                            field: "fstSeoljYmd", 
                            hozAlign: "center", 
                            minWidth: 85, 
                            formatter: cell => formatDateVal(cell.getValue()),
                            editor: "input",
                            editable: (cell) => !cell.getValue() || cell.getRow().getData().isNew,
                            cellClick: function(e, cell) {
                                cell.edit(true);
                            }
                        },
                        { title: "<span style='color: #2563eb;'>(재)<br/>계약일</span>", field: "reSeoljYmd", hozAlign: "center", minWidth: 85, formatter: cell => `<span style="color: #2563eb; font-weight: 500;">${formatDateVal(cell.getValue())}</span>`, editor: "input", cellClick: (e, cell) => cell.edit(true) },
                        { title: "<span style='color: #2563eb;'>계약잔액</span>", field: "reSeoljAek", hozAlign: "right", minWidth: 100, formatter: cell => `<span style="color: #2563eb; font-weight: 500;">${numFmt(cell.getValue())}</span>` },
                        { 
                            title: "수수료<br/>비용처리", 
                            field: "expenseYn", 
                            hozAlign: "center", 
                            minWidth: 85, 
                            formatter: cell => {
                                const isChecked = (cell.getValue() === 'Y');
                                return `<input type="checkbox" ${isChecked ? 'checked' : ''} style="pointer-events: none;" />`;
                            },
                            cellClick: function(e, cell) {
                                cell.setValue(cell.getValue() === 'Y' ? 'N' : 'Y');
                            }
                        },
                        { title: "계약<br/>횟수", field: "gyulGi", hozAlign: "center", minWidth: 60 },
                        { title: "계약<br/>기간", field: "sintakGigan", hozAlign: "center", minWidth: 60, editor: "number", cellClick: (e, cell) => cell.edit(true) },
                        { title: "만기예정일", field: "afGyulYmd", hozAlign: "center", minWidth: 85, formatter: cell => formatDateVal(cell.getValue()) },
                        { title: "<span style='color: #ef4444;'>계약종료일</span>", field: "haejiYmd", hozAlign: "center", minWidth: 85, formatter: cell => `<span style="color: #ef4444; font-weight: 500;">${formatDateVal(cell.getValue())}</span>`, editor: "input", cellClick: (e, cell) => cell.edit(true) },
                        { 
                            title: "운용역", 
                            field: "unyongSabun", 
                            hozAlign: "center", 
                            minWidth: 70, 
                            formatter: cell => getDddwLabel('unyong_sabun', cell.getValue()),
                            editor: "list",
                            editorParams: {
                                valuesLookup: () => getDddwOptions('unyong_sabun'),
                                autocomplete: false,
                                listOnEmpty: true,
                                clearable: true
                            },
                            cellClick: function(e, cell) {
                                cell.edit(true);
                            }
                        },
                        { 
                            title: "계좌별<br/>주식매매수수료율", 
                            field: "susuRt", 
                            hozAlign: "right", 
                            minWidth: 110,
                            editor: "list",
                            editorParams: {
                                values: [
                                    { label: "0.001", value: 0.001 },
                                    { label: "0.0005", value: 0.0005 }
                                ],
                                autocomplete: false,
                                listOnEmpty: true
                            },
                            cellClick: (e, cell) => cell.edit(true)
                        },
                        { title: "특이사항", field: "noteText", hozAlign: "center", minWidth: 65 },
                        { title: "<span style='color: #0d9488;'>이메일주소</span>", field: "email1", minWidth: 120, editor: "input", cellClick: (e, cell) => cell.edit(true) }
                    ]
                });

                gridMaster.on("rowClick", function(e, row) {
                    gridMaster.deselectRow();
                    row.select();
                    const data = row.getData();
                    const specialNote = data.specialNote || "";
                    const mle = pane ? pane.querySelector("#mleSpecialNote") : document.getElementById("mleSpecialNote");
                    if (mle) mle.value = specialNote;
                    if (data.fundCd) {
                        fetchJa010bSubGrids(data.fundCd);
                    }
                });

                // Auto select first row if exists
                gridMaster.on("tableBuilt", function() {
                    const rows = gridMaster.getRows();
                    if (rows && rows.length > 0) {
                        rows[0].select();
                        const data = rows[0].getData();
                        const mle = pane ? pane.querySelector("#mleSpecialNote") : document.getElementById("mleSpecialNote");
                        if (mle) mle.value = data.specialNote || "";
                        if (data.fundCd) {
                            fetchJa010bSubGrids(data.fundCd);
                        }
                    }
                });
            }

            // 2. Initialize Detail Grid (d_ja010b2.srd)
            function initDetailGrid() {
                const container = pane ? pane.querySelector("#grid-ja010b-detail") : document.getElementById("grid-ja010b-detail");
                if (!container) return;

                gridDetail = new Tabulator(container, {
                    layout: "fitColumns",
                    height: "100%",
                    placeholder: "<span>상단 목록에서 항목을 선택하세요.</span>",
                    columnDefaults: { vertAlign: "middle", headerSortTristate: true },
                    columns: [
                        { title: "No.", formatter: "rownum", hozAlign: "center", width: 45, resizable: false, widthGrow: 0 },
                        { title: "회<br/>기", field: "gyulGi", hozAlign: "center", width: 55, editor: "number" },
                        { title: "(전)<br/>결산일자", field: "bfGyulYmd", hozAlign: "center", width: 95, formatter: cell => formatDateVal(cell.getValue()), editor: "input" },
                        { title: "(당)<br/>결산일자", field: "afGyulYmd", hozAlign: "center", width: 95, formatter: cell => formatDateVal(cell.getValue()), editor: "input" },
                        { title: "구간<br/>일수", field: "ilsu", hozAlign: "center", width: 70 },
                        { title: "결산기<br/>손익액", field: "giSonikAek", hozAlign: "right", minWidth: 100, formatter: cell => numFmt(cell.getValue()), editor: "number" },
                        { title: "워터마크<br/>대상원본", field: "wmSeoljAek", hozAlign: "right", minWidth: 110, formatter: cell => numFmt(cell.getValue()), editor: "number" },
                        { title: "계약<br/>종료일", field: "haejiYmd", hozAlign: "center", width: 95, formatter: cell => formatDateVal(cell.getValue()) }
                    ]
                });
            }

            // 3. Initialize IO Grid (d_szt0io.srd)
            function initIoGrid() {
                const container = pane ? pane.querySelector("#grid-ja010b-io") : document.getElementById("grid-ja010b-io");
                if (!container) return;

                gridIo = new Tabulator(container, {
                    layout: "fitColumns",
                    height: "100%",
                    placeholder: "<span>상단 목록에서 항목을 선택하세요.</span>",
                    columnDefaults: { vertAlign: "middle", headerSortTristate: true },
                    columns: [
                        { title: "No.", formatter: "rownum", hozAlign: "center", width: 45, resizable: false, widthGrow: 0 },
                        { title: "입출일자", field: "trYmd", hozAlign: "center", width: 95, formatter: cell => formatDateVal(cell.getValue()), editor: "input" },
                        { title: "입금액", field: "inAek", hozAlign: "right", minWidth: 95, formatter: cell => numFmt(cell.getValue()) },
                        { title: "출금액", field: "outAek", hozAlign: "right", minWidth: 95, formatter: cell => numFmt(cell.getValue()) },
                        { title: "입출금조정액", field: "ioJo", hozAlign: "right", minWidth: 100, formatter: cell => numFmt(cell.getValue()) },
                        { title: "계약잔액", field: "wonbonAek", hozAlign: "right", minWidth: 100, formatter: cell => numFmt(cell.getValue()), editor: "number" },
                        { title: "운용잔여일", field: "giganIlsu", hozAlign: "center", width: 80 },
                        { title: "경과일수", field: "passIlsu", hozAlign: "center", width: 70 }
                    ]
                });
            }

            // Global functions for controller integration
            window.loadJa010bMaster = function(corpGr) {
                const filterSelect = document.getElementById("filterCorpGr");
                const corp = corpGr != null ? corpGr : (filterSelect ? filterSelect.value : "");

                // Re-trigger ue_dddw_retrieve when corpGr changes
                ue_dddw_retrieve(corp);

                fetch('/api/account/ja010b/master?corpGr=' + encodeURIComponent(corp))
                    .then(res => res.json())
                    .then(data => {
                        if (gridMaster) {
                            gridMaster.setData(Array.isArray(data) ? data : []);
                            if (Array.isArray(data) && data.length > 0) {
                                setTimeout(() => {
                                    const rows = gridMaster.getRows();
                                    if (rows && rows.length > 0) {
                                        rows[0].select();
                                        const d = rows[0].getData();
                                        const mle = document.getElementById("mleSpecialNote");
                                        if (mle) mle.value = d.specialNote || "";
                                        if (d.fundCd) fetchJa010bSubGrids(d.fundCd);
                                    }
                                }, 100);
                            } else {
                                if (gridDetail) gridDetail.setData([]);
                                if (gridIo) gridIo.setData([]);
                                const mle = document.getElementById("mleSpecialNote");
                                if (mle) mle.value = "";
                            }
                        }
                    })
                    .catch(err => console.error("Error loading master ja010b:", err));
            };

            function fetchJa010bSubGrids(fundCd) {
                const filterSelect = pane ? pane.querySelector("#filterCorpGr") : document.getElementById("filterCorpGr");
                const corpGr = filterSelect ? filterSelect.value : "";

                fetch(`/api/account/ja010b/detail?corpGr=${encodeURIComponent(corpGr)}&fundCd=${encodeURIComponent(fundCd)}`)
                    .then(res => res.json())
                    .then(data => {
                        if (gridDetail) gridDetail.setData(Array.isArray(data) ? data : []);
                    })
                    .catch(err => console.error("Error fetching detail:", err));

                fetch(`/api/account/ja010b/io?corpGr=${encodeURIComponent(corpGr)}&fundCd=${encodeURIComponent(fundCd)}`)
                    .then(res => res.json())
                    .then(data => {
                        if (gridIo) gridIo.setData(Array.isArray(data) ? data : []);
                    })
                    .catch(err => console.error("Error fetching IO:", err));
            }

            // Initialize all 3 grids & Trigger ue_dddw_retrieve on view load
            initMasterGrid();
            initDetailGrid();
            initIoGrid();
            ue_dddw_retrieve();

            // Register standard CorpGr change contract method on current tab pane
            if (pane) {
                pane.onCorpGrChange = function(val) {
                    window.loadJa010bMaster(val);
                };
                pane.addEventListener("corpGrChanged", function(e) {
                    window.loadJa010bMaster(e.detail ? e.detail.corpGr : val);
                });
            }

            // Initial Master Grid data load if initial data exists
            if (initialMasterData && initialMasterData.length > 0) {
                setTimeout(() => {
                    if (gridMaster) {
                        gridMaster.setData(initialMasterData);
                    }
                }, 50);
            }
        })();

        function onJa010bPyungjanCalc() {
            const mle = document.getElementById("mleSpecialNote");
            if (confirm("선택한 계좌의 평잔 재계산 작업을 진행하시겠습니까?")) {
                alert("평잔 재계산 작업이 완료되었습니다.");
            }
        }

        function onJa010bInput() { alert("신규 입력을 진행합니다."); }
        function onJa010bSave() { alert("변경사항이 저장되었습니다."); }
        function onJa010bExcel() { alert("엑셀 다운로드를 진행합니다."); }
    </script>
</div>
</html>

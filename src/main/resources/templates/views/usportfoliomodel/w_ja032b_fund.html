<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
    W_JA032B_FUND: 기준정보 펀드 일별현황 (사무관리 > US Portfolio Model > USPM)
    DataWindows:
      - dw_c: dc_ymd (조회기준일)
      - dw_list: d_ja032a1 (마스터 펀드 목록)
      - dw_detail: d_ja032b_fund2 (펀드 기준정보 일별현황 상세)
-->
<div class="view-container layout-split ja032b-fund-container layout-mobile-stack-container" th:fragment="ja032bFundView">

    <!-- 1. Top Action Control Bar -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- 2. Sub Filter Bar: 조회기준일 -->
    <div class="filter-bar">
        <div class="filter-left">
            <div th:replace="~{fragments/filter/dc_ymd :: filter(label='조회기준일')}"></div>
        </div>
    </div>

    <!-- 3. Split Master-Detail Layout (wt_listdetail: Top Master + Bottom Detail) -->

        <!-- 3-1. Upper Section: 펀드별 포트폴리오 마스터 목록 (d_ja032a1) -->

            <div class="sub-grid-header">
                <span class="sub-title"><i class="fa-solid fa-list-check"></i> 펀드별 포트폴리오 마스터 목록</span>
            </div>
            <div class="pane-body">
                <div id="gridJa032bFundMaster" class="tabulator-aams-grid"></div>
            </div>
        </div>

        <!-- 스플리터 드래그 바 -->
        <div class="split-gutter-v"></div>

        <!-- 3-2. Lower Section: 펀드 기준정보 일별현황 상세 목록 (d_ja032b_fund2) -->
        <div class="pane-bottom detail-section">
            <div class="sub-grid-header">
                <span class="sub-title" id="titleDetailSection"><i class="fa-solid fa-calendar-days"></i> 펀드 기준정보 일별현황</span>
            </div>
            <div class="pane-body">
                <div id="gridJa032bFundDetail" class="tabulator-aams-grid"></div>
            </div>
        </div>

    </div>

            // 4. 스플리터 초기화 (규정 10: AamsSplitter 표준 연동)
            function initSplitter() {

                    window.AamsSplitter.init(currentPane);
                }

            // 5. 마스터 그리드 데이터 로드
            function loadMasterGrid() {
                var corpGr = resolveCorpGr(currentPane);
                var ymd = getFilterYmd(currentPane, 'YYYY-MM-DD');

                if (!corpGr) {
                    if (window.showToast) window.showToast("회사그룹을 선택해주세요.", "warning");
                    return;
                }
                if (!ymd) {
                    if (window.showToast) window.showToast("조회기준일을 입력해주세요.", "warning");
                    return;
                }

                lastLoadedFundKey = null;
                currentMasterRowData = null;
                if (gridDetail) gridDetail.clearData();

                var url = "/api/usportfoliomodel/ja032b_fund/master?corpGr=" + encodeURIComponent(corpGr) + "&ymd=" + encodeURIComponent(ymd);
                fetch(url)
                    .then(function (res) { return res.json(); })
                    .then(function (data) {
                        var list = Array.isArray(data) ? data : [];
                        if (gridMaster) {
                            gridMaster.setData(list).then(function () {
                                var rows = gridMaster.getRows();
                                if (rows && rows.length > 0) {
                                    rows[0].select();
                                } else {
                                    if (gridDetail) gridDetail.clearData();
                                    updateDetailTitle(null);
                                }
                            });
                        }
                    })
                    .catch(function (err) {
                        console.error("[Ja032bFund] 마스터 목록 조회 실패:", err);
                        if (window.showToast) window.showToast("마스터 목록 조회 중 오류가 발생했습니다.", "error");
                    });
            }

            // 6. 하단 디테일 데이터 동기화 (syncDetail)
            function syncDetail(row, masterRowData) {
                if (!row) return;
                var data = masterRowData || (row.getData ? row.getData() : null);
                if (!data || !data.fundCd) return;

                currentMasterRowData = data;
                var corpGr = resolveCorpGr(currentPane);
                var ymd = getFilterYmd(currentPane, 'YYYY-MM-DD');
                var fundKey = (corpGr || '') + "_" + (ymd || '') + "_" + (data.fundCd || '');

                if (lastLoadedFundKey === fundKey) return;
                lastLoadedFundKey = fundKey;

                updateDetailTitle(data);
                loadDetailGrid(corpGr, ymd, data.fundCd);
            }

            function updateDetailTitle(data) {
                var titleEl = currentPane.querySelector('#titleDetailSection');
                if (!titleEl) return;
                if (data && data.fundCd) {
                    var fName = data.xxFundCd || data.fundNm || "";
                    titleEl.innerHTML = '<i class="fa-solid fa-calendar-days"></i> 펀드 기준정보 일별현황 <span class="text-primary fw-bold ms-2">[' + data.fundCd + (fName ? ' ' + fName : '') + ']</span>';
                } else {
                    titleEl.innerHTML = '<i class="fa-solid fa-calendar-days"></i> 펀드 기준정보 일별현황';
                }
            }

            // 7. 하단 디테일 그리드 데이터 로드
            function loadDetailGrid(corpGr, ymd, fundCd) {
                if (!gridDetail) return;
                var url = "/api/usportfoliomodel/ja032b_fund/detail?corpGr=" + encodeURIComponent(corpGr) + "&ymd=" + encodeURIComponent(ymd) + "&fundCd=" + encodeURIComponent(fundCd);
                fetch(url)
                    .then(function (res) { return res.json(); })
                    .then(function (data) {
                        var list = Array.isArray(data) ? data : [];
                        gridDetail.setData(list).then(function () {
                            var rows = gridDetail.getRows();
                            if (rows && rows.length > 0) {
                                rows[0].select();
                            }
                        });
                    })
                    .catch(function (err) {
                        console.error("[Ja032bFund] 디테일 목록 조회 실패:", err);
                        if (window.showToast) window.showToast("일별현황 상세 조회 중 오류가 발생했습니다.", "error");
                    });
            }

            // 8. 상단 공통 툴바 표준 계약 바인딩
            currentPane.onRetrieve = currentPane.onSearch = function () {
                loadMasterGrid();
            };

            currentPane.onExcel = function () {
                var ymdStr = getFilterYmd(currentPane, 'YYYYMMDD') || '';
                if (gridDetail && gridDetail.getData().length > 0) {
                    var fCd = (currentMasterRowData && currentMasterRowData.fundCd) ? ("_" + currentMasterRowData.fundCd) : "";
                    gridDetail.download("xlsx", "펀드일별현황" + fCd + "_" + ymdStr + ".xlsx", { sheetName: "일별현황" });
                } else if (gridMaster && gridMaster.getData().length > 0) {
                    gridMaster.download("xlsx", "펀드마스터목록_" + ymdStr + ".xlsx", { sheetName: "펀드목록" });
                } else {
                    if (window.showToast) window.showToast("다운로드할 데이터가 없습니다.", "warning");
                }
            };

            currentPane.onClear = currentPane.onRefresh = function () {
                if (gridMaster) gridMaster.clearData();
                if (gridDetail) gridDetail.clearData();
                lastLoadedFundKey = null;
                currentMasterRowData = null;
                updateDetailTitle(null);

                var ymdInput = currentPane.querySelector('#filterYmd');
                if (ymdInput && initialYmd) {
                    ymdInput.value = initialYmd;
                }

                if (window.showToast) {
                    window.showToast("화면이 초기화되었습니다.", "info");
                }
            };

            currentPane.onCorpGrChange = function (newCorpGr) {
                var cg = newCorpGr || resolveCorpGr(currentPane);
                if (!cg) return;

                if (typeof fetchCommonWorkDate === 'function') {
                    fetchCommonWorkDate(cg, function (workDate) {
                        if (workDate) {
                            var ymdInput = currentPane.querySelector('#filterYmd');
                            if (ymdInput) {
                                ymdInput.value = workDate;
                            }
                        }
                    });
                }
            };

            // 9. 단일 초기화 진입점
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                initCalendar();
                initMasterGrid();
                initDetailGrid();
                initSplitter();

                // 파워빌더 eb_direct_retrieve = true 규격 (화면 오픈 시 최초 1회 자동 조회)
                setTimeout(function () {
                    loadMasterGrid();
                }, 200);
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", startInit);
            } else {
                startInit();
            }
        })();
    </script>
</div>
</html>

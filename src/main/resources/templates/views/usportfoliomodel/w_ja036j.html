<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-single layout-mobile-stack-container" th:fragment="mainView"
     data-pgm-id="W_JA036J" th:attr="data-corp-gr=${corpGr},data-work-date=${workDate}">
    <div class="view-toolbar">
        <div class="toolbar-left"><div th:replace="~{fragments/tab_header :: toolbarButtons}"></div></div>
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <div class="filter-bar" role="radiogroup" aria-label="종가 단가 구분">
        <div class="filter-left">
            <th:block th:replace="~{fragments/filter/dc_ymd :: filter(label='영업일자')}"></th:block>
            <label><input type="radio" name="ja036jAssetType" value="1" checked> 주식종가</label>
            <label><input type="radio" name="ja036jAssetType" value="2"> 채권단가</label>
            <label><input type="radio" name="ja036jAssetType" value="A"> 파생종가</label>
        </div>
    </div>

    <section class="grid-section" aria-label="해외 유가증권 종가 단가 목록">
        <div class="grid-table-wrapper"><div id="ja036jGrid" class="tabulator-aams-grid"></div></div>
    </section>

    <script th:inline="javascript">
        (function () {
            const pane = document.currentScript ? (document.currentScript.closest('.tab-pane') || document.currentScript.closest('.view-container')) : null;
            if (!pane || pane.dataset.ja036jInitialized === 'true') return;
            pane.dataset.ja036jInitialized = 'true';

            const api = '/api/usportfoliomodel/ja036j';
            const serverCorpGr = /*[[${corpGr}]]*/ '';
            const field = id => pane.querySelector('#' + id);
            const toast = (text, type) => typeof showToast === 'function' ? showToast(text, type || 'info') : console.error(text);
            const corpGr = () => (typeof resolveCorpGr === 'function' ? resolveCorpGr(pane) : '') || pane.dataset.corpGr || serverCorpGr;
            const ymd = () => typeof getFilterYmd === 'function' ? getFilterYmd(pane, 'YYYY-MM-DD') : (field('filterYmd')?.value || '');
            const number = value => value == null || value === '' ? '' : Number(value).toLocaleString(undefined, {maximumFractionDigits: 4});
            const date = value => typeof formatDateVal === 'function' ? formatDateVal(value) : (value || '');
            let jasanGb = '1';
            let grid;
            let gridBuilt = false;
            let deletedRows = [];
            const dddwOptionsMap = {jasanGb: []};

            function editableCell(cell) {
                return !cell.getRow().getData().isSummaryRow;
            }

            function markUpdated(cell) {
                const row = cell.getRow();
                if (!row.getData().isNew) row.update({isUpdated: true, rowStatus: 'U'});
            }

            // PB dw_list::ue_dddw_retrieve: f_dddwctl(THIS, 'jasan_gb', gaa.corp_gr, '', 51, '')
            async function ue_dddw_retrieve(targetCorpGr) {
                if (typeof window.f_dddwctl !== 'function') return;
                dddwOptionsMap.jasanGb = await window.f_dddwctl('jasan_gb', targetCorpGr || corpGr(), '', 51, '');
                if (grid && gridBuilt) grid.redraw(true);
            }

            function getDddwLabel(key, value) {
                if (!window.f_dddwctl || typeof window.f_dddwctl.getLabel !== 'function') return value || '';
                return window.f_dddwctl.getLabel(dddwOptionsMap, key, value);
            }

            function codeSearchSeq() {
                return jasanGb === '2' ? 2 : jasanGb === 'A' ? 3 : 1;
            }

            function openSecuritySearch(target) {
                const row = target.getRow ? target.getRow() : target;
                if (!row || !window.DynamicCodeSearch || typeof window.DynamicCodeSearch.openModal !== 'function') return;
                const data = row.getData();
                window.DynamicCodeSearch.openModal({
                    columnNm: 'yj_cd', seq: codeSearchSeq(), corpGr: corpGr(), initialKeyword: data.yjCd || '',
                    onSelect: (code, name) => row.update({
                        yjCd: code,
                        xxYjCd: name || '',
                        isUpdated: !data.isNew,
                        rowStatus: data.isNew ? 'C' : 'U'
                    })
                });
            }

            function validateSecurityCode(cell) {
                const row = cell.getRow();
                const code = String(cell.getValue() || '').trim();
                const data = row.getData();
                if (!code) {
                    row.update({xxYjCd: ''});
                    markUpdated(cell);
                    return;
                }
                fetch('/api/common/code-search/get?' + new URLSearchParams({
                    columnNm: 'yj_cd', seq: codeSearchSeq(), corpGr: corpGr(), code
                })).then(response => response.json()).then(result => {
                    if (result && result.code) {
                        row.update({
                            yjCd: result.code,
                            xxYjCd: result.codeName || result.name || '',
                            isUpdated: !data.isNew,
                            rowStatus: data.isNew ? 'C' : 'U'
                        });
                    } else {
                        openSecuritySearch(row);
                    }
                }).catch(() => openSecuritySearch(row));
            }

            function createGrid() {
                gridBuilt = false;
                grid = new Tabulator(field('ja036jGrid'), {
                    height: '100%', layout: 'fitDataStretch', selectableRows: 1, editTriggerEvent: 'click',
                    placeholder: '조회된 종가/단가 자료가 없습니다.',
                    tableBuilt: () => { gridBuilt = true; },
                    columnDefaults: {vertAlign: 'middle', headerHozAlign: 'center', headerSortTristate: true},
                    columns: [
                        {title: 'No.', formatter: 'rownum', width: 48, hozAlign: 'center', headerSort: false},
                        {title: '자산분류', field: 'jasanGb', width: 100, hozAlign: 'center',
                            formatter: cell => getDddwLabel('jasanGb', cell.getValue())},
                        {title: '종목코드', field: 'yjCd', width: 125, hozAlign: 'center', editor: 'input', editable: editableCell,
                            cellClick: aamsCellEdit, cellDblClick: (_event, cell) => openSecuritySearch(cell), cellEdited: validateSecurityCode},
                        {title: '', field: 'pXxYjCd', width: 36, minWidth: 36, maxWidth: 36, hozAlign: 'center', headerSort: false, resizable: false,
                            formatter: () => '<button type="button" class="btn-grid-addon btn-search" title="종목 검색"><i class="fa-solid fa-magnifying-glass"></i></button>',
                            cellClick: (event, cell) => { event.stopPropagation(); openSecuritySearch(cell); }},
                        {title: '종목명', field: 'xxYjCd', minWidth: 180, cellDblClick: (_event, cell) => openSecuritySearch(cell)},
                        {title: 'Bloomberg 코드', field: 'blbgTckr', width: 155},
                        {title: 'ISIN 코드', field: 'isinCd', width: 145},
                        {title: '통화', field: 'currency', width: 72, hozAlign: 'center'},
                        {title: '종가', field: 'jonga', width: 120, hozAlign: 'right', formatter: cell => number(cell.getValue()), editor: 'number',
                            editable: editableCell, cellClick: aamsCellEdit, cellEdited: markUpdated},
                        {title: '전일대비', field: 'junJonga', width: 120, hozAlign: 'right', formatter: cell => number(cell.getValue())},
                        {title: '단가', field: 'danga', width: 120, hozAlign: 'right', formatter: cell => number(cell.getValue()), editor: 'number',
                            editable: editableCell, cellClick: aamsCellEdit, cellEdited: markUpdated},
                        {title: '전일대비', field: 'junDanga', width: 120, hozAlign: 'right', formatter: cell => number(cell.getValue())},
                        {title: '최종가격일자', field: 'pxCloseDt', width: 120, hozAlign: 'center', formatter: cell => date(cell.getValue())},
                        {title: '최종가격', field: 'pxLast', width: 120, hozAlign: 'right', formatter: cell => number(cell.getValue())},
                        {title: '전일종가일자', field: 'pxDt1d', width: 120, hozAlign: 'center', formatter: cell => date(cell.getValue())},
                        {title: '전일종가', field: 'pxClose1d', width: 120, hozAlign: 'right', formatter: cell => number(cell.getValue())},
                        {title: '수정종가', field: 'pxYestCloseExchUnadj', width: 120, hozAlign: 'right', formatter: cell => number(cell.getValue())},
                        {title: 'LOAD 일시', field: 'loadTime', width: 125, hozAlign: 'center'}
                    ]
                });
                if (typeof setupTabulatorRowSelection === 'function') setupTabulatorRowSelection(grid);
                if (window.AamsResponsive) window.AamsResponsive.bindGridResize(pane, [grid]);
            }

            async function request(path, options) {
                const response = await fetch(path, options);
                const body = await response.json().catch(() => ({}));
                if (!response.ok || body.success === false) throw new Error(body.message || '처리 중 오류가 발생했습니다.');
                return body;
            }

            async function retrieve() {
                if (!corpGr() || !ymd()) return toast('회사와 영업일자를 확인하십시오.', 'warning');
                const rows = await request(api + '/list?' + new URLSearchParams({corpGr: corpGr(), ymd: ymd(), jasanGb}));
                deletedRows = [];
                await grid.setData(rows);
            }

            async function save() {
                const changed = grid.getData().filter(row => row.isNew || row.isUpdated || row.isDeleted || row.rowStatus).concat(deletedRows);
                if (!changed.length) return toast('변경된 자료가 없습니다.', 'info');
                const result = await request(api + '/save?' + new URLSearchParams({corpGr: corpGr(), ymd: ymd(), jasanGb}), {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(changed)
                });
                toast(result.message, 'success');
                await retrieve();
            }

            function switchAssetType(nextJasanGb) {
                jasanGb = nextJasanGb;
                grid.clearData();
                deletedRows = [];
            }

            function bindToolbar() {
                pane.onSearch = pane.onRetrieve = () => retrieve().catch(error => toast(error.message, 'error'));
                pane.onInput = async () => {
                    const row = await grid.addRow({jasanGb, yjCd: '', jonga: null, danga: null, isNew: true, rowStatus: 'C'}, true);
                    grid.deselectRow();
                    row.select();
                    row.getCell('yjCd').edit();
                };
                pane.onDelete = async () => {
                    const row = grid.getSelectedRows()[0];
                    if (!row) return toast('삭제할 행을 선택하십시오.', 'warning');
                    const data = row.getData();
                    if (!data.isNew) deletedRows.push({...data, isDeleted: true, rowStatus: 'D'});
                    await row.delete();
                };
                pane.onSave = () => save().catch(error => toast(error.message, 'error'));
                pane.onRefresh = () => { deletedRows = []; grid.clearData(); };
                pane.onCorpGrChange = nextCorpGr => {
                    pane.dataset.corpGr = nextCorpGr || '';
                    deletedRows = [];
                    grid.clearData();
                    ue_dddw_retrieve(nextCorpGr).catch(error => console.warn('자산분류 DDDW 조회 실패', error));
                };
                pane.onExcel = () => {
                    if (!window.XLSX) return toast('엑셀 내보내기 기능을 불러오지 못했습니다.', 'warning');
                    grid.download('xlsx', `해외유가증권_${jasanGb}_${ymd().replaceAll('-', '')}.xlsx`, {sheetName: '종가단가'});
                };
            }

            function startInit() {
                createGrid();
                if (typeof initFilterCalendar === 'function') initFilterCalendar(pane);
                ue_dddw_retrieve(corpGr()).catch(error => console.warn('자산분류 DDDW 조회 실패', error));
                pane.querySelectorAll('input[name="ja036jAssetType"]').forEach(input => input.addEventListener('change', () => {
                    if (input.checked) switchAssetType(input.value);
                }));
                bindToolbar();
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', startInit, {once: true});
            else startInit();
        })();
    </script>
</div>
</html>

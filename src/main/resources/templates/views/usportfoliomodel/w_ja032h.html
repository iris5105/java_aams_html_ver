<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-single ja032h-container layout-mobile-stack-container" th:fragment="mainView"
     style="display: flex; flex-direction: column; height: 100%; width: 100%; overflow: hidden; background-color: #ffffff; position: relative;">

    <!-- 1. 상단 공통 툴바 (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- 2. 상단 필터바 (Row 2: 필터 + 액션버튼 인접 일체화) -->
    <div class="filter-bar">
        <div class="filter-left">
            <!-- 구분 (FRID) 선택 필터 -->
            <div class="filter-item">
                <label for="ja032hFilterFrid" class="filter-label">구분</label>
                <select id="ja032hFilterFrid" class="t-select" style="min-width: 110px;">
                    <option value="">전체</option>
                    <option value="U">U (업종)</option>
                    <option value="I">I (지수)</option>
                    <option value="X">X (환율)</option>
                </select>
            </div>

            <!-- 검색어 입력 필터 -->
            <div class="filter-item">
                <label for="ja032hFilterKeyword" class="filter-label">검색어</label>
                <div class="filter-input-wrapper">
                    <input type="text" id="ja032hFilterKeyword" class="t-input" placeholder="코드/영문명/한글명/SYMB" style="width: 220px;" autocomplete="off" />
                </div>
            </div>

            <!-- 종목LOAD 액션 버튼 (filter-left 내부에 인접 배치: UX 일체화 원칙) -->
            <button type="button" class="t-btn btn-action" id="btnJa032hUploadMst" title="해외업종/지수/환율 MST 파일 업로드">
                <i class="fa-solid fa-file-arrow-up"></i> 종목LOAD
            </button>
            <input type="file" id="ja032hFileInput" accept=".mst,.txt,*" style="display: none;" />
        </div>
    </div>

    <!-- 3. 메인 콘텐츠 섹션 (단일 그리드 패널) -->
    <div class="grid-section" style="flex: 1 1 auto; height: calc(100% - 95px); padding: 8px 12px; overflow: hidden; display: flex; flex-direction: column;">
        <div class="grid-panel" style="flex: 1 1 auto; height: 100%; display: flex; flex-direction: column; border: 1px solid #cbd5e1; border-radius: 4px; overflow: hidden; background-color: #ffffff;">
            <!-- 패널 헤더 (Zero-Count-Badge 준수: 순수 타이틀 및 서브 액션 버튼만 배치) -->
            <div class="sub-grid-header" style="display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; background: #f8fafc; border-bottom: 1px solid #e2e8f0;">
                <span class="sub-title" style="font-weight: 600; font-size: 13px; color: #1e293b;">
                    <i class="fa-solid fa-list-check" style="margin-right: 6px; color: #3b82f6;"></i>해외 업종/지수/환율 코드 목록
                </span>
                <div class="btn-group-sub">
                    <button type="button" class="btn-sub-grid" id="btnJa032hAddRow" title="행 추가">
                        <i class="fa-solid fa-plus"></i> 행 추가
                    </button>
                    <button type="button" class="btn-sub-grid btn-sub-danger" id="btnJa032hDeleteRow" title="선택 행 삭제">
                        <i class="fa-solid fa-minus"></i> 행 삭제
                    </button>
                </div>
            </div>

            <!-- 그리드 영역 -->
            <div class="grid-table-wrapper" style="flex: 1 1 auto; height: 100%; width: 100%; min-height: 290px; overflow: hidden;">
                <div id="gridJa032h" class="tabulator-aams-grid" style="height: 100%;"></div>
            </div>
        </div>
    </div>

    <!-- 4. 화면 전용 격리 스크립트 -->
    <script th:inline="javascript">
        (function () {
            // MDI 최상위 탭 컨테이너 획득 (Zero-Hardcoded-ID & Pane Scoping)
            const currentScript = document.currentScript;
            const pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;
            if (!pane) return;

            let gridJa032h = null;
            let isInitialized = false;

            // [초기화 1] Tabulator 그리드 빌드 (d_ja032h.srd 1:1 매핑)
            function initGrid() {
                const el = pane.querySelector('#gridJa032h');
                if (!el) return;

                gridJa032h = new Tabulator(el, {
                    height: "100%",
                    layout: "fitColumns",
                    selectableRows: 1,
                    editTriggerEvent: "click", // 원클릭 인라인 편집 필수
                    placeholder: "조회된 해외 코드 데이터가 없습니다.",
                    columns: [
                        {
                            title: "No.",
                            formatter: "rownum",
                            width: 55,
                            minWidth: 55,
                            hozAlign: "center",
                            headerHozAlign: "center",
                            headerSort: false,
                            resizable: false
                        },
                        {
                            title: "ID",
                            field: "frid",
                            width: 75,
                            hozAlign: "center",
                            headerHozAlign: "center",
                            headerSort: true,
                            editor: "input",
                            editable: function (cell) {
                                var rowData = cell.getRow().getData();
                                return !!rowData.isNew;
                            },
                            cellClick: typeof aamsCellEdit === 'function' ? aamsCellEdit : undefined,
                            cellEdited: function (cell) {
                                markRowUpdated(cell);
                            }
                        },
                        {
                            title: "코드",
                            field: "frgn",
                            width: 120,
                            hozAlign: "left",
                            headerHozAlign: "center",
                            headerSort: true,
                            editor: "input",
                            editable: function (cell) {
                                var rowData = cell.getRow().getData();
                                return !!rowData.isNew;
                            },
                            cellClick: typeof aamsCellEdit === 'function' ? aamsCellEdit : undefined,
                            cellEdited: function (cell) {
                                markRowUpdated(cell);
                            }
                        },
                        {
                            title: "업종/지수/환율 코드 영문명",
                            field: "enam",
                            minWidth: 260,
                            hozAlign: "left",
                            headerHozAlign: "center",
                            headerSort: true,
                            editor: "input",
                            cellClick: typeof aamsCellEdit === 'function' ? aamsCellEdit : undefined,
                            cellEdited: function (cell) {
                                markRowUpdated(cell);
                            }
                        },
                        {
                            title: "업종/지수/환율 코드 한글명",
                            field: "knam",
                            minWidth: 260,
                            hozAlign: "left",
                            headerHozAlign: "center",
                            headerSort: true,
                            editor: "input",
                            cellClick: typeof aamsCellEdit === 'function' ? aamsCellEdit : undefined,
                            cellEdited: function (cell) {
                                markRowUpdated(cell);
                            }
                        },
                        {
                            title: "SYMB",
                            field: "symb",
                            width: 85,
                            hozAlign: "center",
                            headerHozAlign: "center",
                            headerSort: true,
                            editor: "input",
                            cellClick: typeof aamsCellEdit === 'function' ? aamsCellEdit : undefined,
                            cellEdited: function (cell) {
                                markRowUpdated(cell);
                            }
                        },
                        {
                            title: "EXID",
                            field: "exid",
                            width: 80,
                            hozAlign: "center",
                            headerHozAlign: "center",
                            headerSort: true,
                            editor: "input",
                            cellClick: typeof aamsCellEdit === 'function' ? aamsCellEdit : undefined,
                            cellEdited: function (cell) {
                                markRowUpdated(cell);
                            }
                        },
                        {
                            title: "MKCD",
                            field: "mkcd",
                            width: 85,
                            hozAlign: "center",
                            headerHozAlign: "center",
                            headerSort: true,
                            editor: "input",
                            cellClick: typeof aamsCellEdit === 'function' ? aamsCellEdit : undefined,
                            cellEdited: function (cell) {
                                markRowUpdated(cell);
                            }
                        },
                        {
                            title: "MKID",
                            field: "mkid",
                            width: 80,
                            hozAlign: "center",
                            headerHozAlign: "center",
                            headerSort: true,
                            editor: "input",
                            cellClick: typeof aamsCellEdit === 'function' ? aamsCellEdit : undefined,
                            cellEdited: function (cell) {
                                markRowUpdated(cell);
                            }
                        }
                    ]
                });

                // 행 선택 활성화 (삼중 안전망)
                if (typeof setupTabulatorRowSelection === 'function') {
                    setupTabulatorRowSelection(gridJa032h);
                }
            }

            function markRowUpdated(cell) {
                var row = cell.getRow();
                var data = row.getData();
                if (!data.isNew) {
                    row.update({ isUpdated: true, rowStatus: 'U' });
                }
            }

            // [조회 1] 데이터 조회
            function loadData() {
                var fridSelect = pane.querySelector('#ja032hFilterFrid');
                var keywordInput = pane.querySelector('#ja032hFilterKeyword');

                var frid = fridSelect ? (fridSelect.value || '').trim() : '';
                var keyword = keywordInput ? (keywordInput.value || '').trim() : '';

                var url = '/api/usportfoliomodel/ja032h/list?frid=' + encodeURIComponent(frid) + '&keyword=' + encodeURIComponent(keyword);

                fetch(url)
                    .then(function (res) {
                        if (!res.ok) throw new Error("서버 응답 오류 (" + res.status + ")");
                        return res.json();
                    })
                    .then(function (data) {
                        if (gridJa032h) {
                            gridJa032h.setData(data || []);
                        }
                    })
                    .catch(function (err) {
                        console.error("해외 코드 목록 조회 실패:", err);
                        if (typeof showToast === 'function') showToast("조회 중 오류가 발생했습니다.", "error");
                    });
            }

            // [입력 1] 신규 행 추가
            function addNewRow() {
                if (!gridJa032h) return;
                var fridSelect = pane.querySelector('#ja032hFilterFrid');
                var defaultFrid = fridSelect && fridSelect.value ? fridSelect.value : 'U';

                var newRow = {
                    isNew: true,
                    rowStatus: 'C',
                    frid: defaultFrid,
                    frgn: '',
                    enam: '',
                    knam: '',
                    symb: '',
                    exid: '',
                    mkcd: '',
                    mkid: ''
                };

                gridJa032h.addRow(newRow, true).then(function (row) {
                    gridJa032h.deselectRow();
                    row.select();
                });
            }

            // [삭제 1] 선택 행 삭제
            function deleteSelectedRow() {
                if (!gridJa032h) return;
                var selectedRows = gridJa032h.getSelectedRows();
                if (!selectedRows || selectedRows.length === 0) {
                    if (typeof showToast === 'function') showToast("삭제할 행을 먼저 선택해주세요.", "warning");
                    return;
                }

                var row = selectedRows[0];
                var data = row.getData();

                if (data.isNew) {
                    row.delete();
                    return;
                }

                if (typeof showAlert === 'function') {
                    showAlert("선택한 코드(" + (data.frgn || '') + ")를 삭제하시겠습니까?", function () {
                        row.update({ isDeleted: true, rowStatus: 'D' });
                        saveData();
                    });
                } else {
                    if (confirm("선택한 코드를 삭제하시겠습니까?")) {
                        row.update({ isDeleted: true, rowStatus: 'D' });
                        saveData();
                    }
                }
            }

            // [저장 1] CUD 변경 데이터 일괄 저장
            function saveData() {
                if (!gridJa032h) return;
                var rows = gridJa032h.getData();
                var changedList = [];

                for (var i = 0; i < rows.length; i++) {
                    var r = rows[i];
                    if (r.isNew || r.isUpdated || r.isDeleted) {
                        if (!r.isDeleted) {
                            if (!r.frid || !r.frid.trim()) {
                                if (typeof showToast === 'function') showToast((i + 1) + "번째 행의 ID를 입력해주세요.", "warning");
                                return;
                            }
                            if (!r.frgn || !r.frgn.trim()) {
                                if (typeof showToast === 'function') showToast((i + 1) + "번째 행의 코드를 입력해주세요.", "warning");
                                return;
                            }
                        }
                        changedList.push(r);
                    }
                }

                if (changedList.length === 0) {
                    if (typeof showToast === 'function') showToast("저장할 변경 내용이 없습니다.", "info");
                    return;
                }

                fetch('/api/usportfoliomodel/ja032h/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(changedList)
                })
                    .then(function (res) { return res.json(); })
                    .then(function (res) {
                        if (res && res.success) {
                            if (typeof showToast === 'function') showToast(res.message || "정상적으로 저장되었습니다.", "success");
                            loadData();
                        } else {
                            if (typeof showToast === 'function') showToast((res && res.message) ? res.message : "저장에 실패하였습니다.", "error");
                        }
                    })
                    .catch(function (err) {
                        console.error("저장 실패:", err);
                        if (typeof showToast === 'function') showToast("저장 중 통신 오류가 발생했습니다.", "error");
                    });
            }

            // [파일 1] MST 파일 업로드 처리
            function initFileUpload() {
                var btnUpload = pane.querySelector('#btnJa032hUploadMst');
                var fileInput = pane.querySelector('#ja032hFileInput');

                if (btnUpload && fileInput) {
                    btnUpload.addEventListener('click', function () {
                        fileInput.value = '';
                        fileInput.click();
                    });

                    fileInput.addEventListener('change', function () {
                        var file = fileInput.files && fileInput.files[0];
                        if (!file) return;

                        var formData = new FormData();
                        formData.append('file', file);

                        if (typeof showToast === 'function') showToast("파일을 업로드하여 처리 중입니다...", "info");

                        fetch('/api/usportfoliomodel/ja032h/upload-mst', {
                            method: 'POST',
                            body: formData
                        })
                            .then(function (res) { return res.json(); })
                            .then(function (res) {
                                if (res && res.success) {
                                    if (typeof showToast === 'function') showToast(res.message || "MST 파일 업로드가 완료되었습니다.", "success");
                                    loadData();
                                } else {
                                    if (typeof showToast === 'function') showToast((res && res.message) ? res.message : "업로드 처리에 실패했습니다.", "error");
                                }
                            })
                            .catch(function (err) {
                                console.error("업로드 오류:", err);
                                if (typeof showToast === 'function') showToast("파일 업로드 중 오류가 발생했습니다.", "error");
                            });
                    });
                }
            }

            // [초기화 2] 상단 공통 툴바 표준 계약 바인딩
            function initToolbar() {
                pane.onSearch = function () {
                    loadData();
                };

                pane.onInput = function () {
                    addNewRow();
                };

                pane.onSave = function () {
                    saveData();
                };

                pane.onDelete = function () {
                    deleteSelectedRow();
                };

                pane.onRefresh = function () {
                    if (gridJa032h) gridJa032h.clearData();
                    var keywordInput = pane.querySelector('#ja032hFilterKeyword');
                    if (keywordInput) keywordInput.value = '';
                    var fridSelect = pane.querySelector('#ja032hFilterFrid');
                    if (fridSelect) fridSelect.value = '';

                    if (typeof showToast === 'function') {
                        showToast("화면이 초기화되었습니다.", "info");
                    }
                };

                pane.onCorpGrChange = function (newCorpGr) {
                    // 필터 변경 시 자동 조회 절대 금지 (규칙 08 준수)
                };

                pane.onExcel = function () {
                    if (gridJa032h) {
                        gridJa032h.download("xlsx", "해외업종지수환율코드목록.xlsx", { sheetName: "목록" });
                    }
                };

                // 서브 액션 버튼 바인딩
                var btnAdd = pane.querySelector('#btnJa032hAddRow');
                if (btnAdd) {
                    btnAdd.addEventListener('click', function () {
                        addNewRow();
                    });
                }

                var btnDel = pane.querySelector('#btnJa032hDeleteRow');
                if (btnDel) {
                    btnDel.addEventListener('click', function () {
                        deleteSelectedRow();
                    });
                }

                // 검색어 입력창 엔터키 조회
                var keywordInput = pane.querySelector('#ja032hFilterKeyword');
                if (keywordInput) {
                    keywordInput.addEventListener('keydown', function (e) {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            loadData();
                        }
                    });
                }
            }

            // [MDI 단일 진입점 실행]
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                initGrid();
                initFileUpload();
                initToolbar();

                // eb_direct_retrieve = true (화면 진입 시 1회 자동 조회)
                loadData();
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", startInit);
            } else {
                startInit();
            }
        })();
    </script>
</div>
</html>

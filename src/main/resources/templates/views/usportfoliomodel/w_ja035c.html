<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-single layout-mobile-stack-container" th:fragment="mainView" th:attr="data-pgm-id='W_JA035C',data-corp-gr=${corpGr}">
    <div class="view-toolbar"><div class="toolbar-left" th:replace="~{fragments/tab_header :: toolbarButtons}"></div><div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div></div>
    <div class="filter-bar"><div class="filter-left"><th:block th:replace="~{fragments/filter/dc_ymd_dddw :: filter(labelYmd='영업일자', labelDddw='거래코드')}"></th:block></div></div>
    <section class="grid-section" aria-label="해외 결제 내역"><div class="grid-table-wrapper"><div id="gridJa035c" class="tabulator-aams-grid"></div></div></section>
    <script th:inline="javascript">
    (function () {
        const pane = document.currentScript ? (document.currentScript.closest('.tab-pane') || document.currentScript.closest('.view-container')) : null;
        if (!pane || pane.dataset.ja035cInitialized === 'true') return;
        pane.dataset.ja035cInitialized = 'true';
        const api = '/api/usportfoliomodel/ja035c', field = id => pane.querySelector('#' + id);
        const toast = (m,t='info') => window.showToast ? showToast(m,t) : alert(m);
        const corpGr = () => (window.resolveCorpGr ? resolveCorpGr(pane) : '') || pane.dataset.corpGr;
        const ymd = () => window.getFilterYmd ? getFilterYmd(pane,'YYYY-MM-DD') : field('filterYmd').value;
        const trCd = () => field('filterDddw')?.value || '';
        const workDate = /*[[${workDate}]]*/ '';
        const canManage = () => !!ymd() && !!workDate && ymd() >= workDate;
        const money = v => v == null || v === '' ? '' : Number(v).toLocaleString(undefined,{maximumFractionDigits:4});
        let grid, gridBuilt = false, deletedRows = [], maxSeq = 0;
        function updated(cell) { const d=cell.getRow().getData(); if (!d.isNew) cell.getRow().update({isUpdated:true,rowStatus:'U'}); }
        async function fetchJson(url, options) { const r=await fetch(url,options); const b=await r.json().catch(()=>({})); if(!r.ok || b.success===false) throw new Error(b.message||'처리 중 오류가 발생했습니다.'); return b; }
        const dddwOptionsMap = {trustee:[],currency:[]};
        const editable = () => canManage();
        function searchColumn(fieldName, title, columnNm, seq) {
            async function openSearch(cell) {
                const row=cell.getRow(), data=row.getData();
                if(!canManage() || !window.DynamicCodeSearch) return;
                let currency=data.currency || '';
                if(fieldName==='yjCd' && !currency && data.trustee) {
                    const result=await fetchJson(api+'/trustee-bank-currency?'+new URLSearchParams({corpGr:corpGr(),trustee:data.trustee}));
                    currency=result.currency || '';
                }
                DynamicCodeSearch.openModal({title:title+' 검색',columnNm,seq,corpGr:corpGr(),
                    initialKeyword:data[fieldName]||'',
                    addWhere:fieldName==='yjCd' && currency ? "currency='"+currency.replaceAll("'","''")+"'" : '',
                    onSelect:(code,name)=>{
                        const values={isUpdated:!data.isNew,rowStatus:data.isNew?'C':'U'};
                        values[fieldName]=code;
                        if(fieldName==='fundCd') values.xxFundCd=name||'';
                        else values.xxYjCd=name||'';
                        row.update(values);
                    }});
            }
            return {title:'',field:fieldName==='fundCd'?'pXxFundCd':'pXxYjCd',
                width:36,minWidth:36,maxWidth:36,headerSort:false,resizable:false,hozAlign:'center',
                formatter:()=>'<button type="button" class="btn-grid-addon btn-search" title="'+title+' 검색"><i class="fa-solid fa-magnifying-glass"></i></button>',
                cellClick:(event,cell)=>{event.stopPropagation();openSearch(cell).catch(e=>toast(e.message,'error'));}};
        }
        function dddwColumn(fieldName,title,width) {
            return {title,field:fieldName,width,editor:'list',editable,cellClick:aamsCellEdit,
                editorParams:()=>({values:f_dddwctl.getOptions(dddwOptionsMap,fieldName)}),
                formatter:cell=>f_dddwctl.getLabel(dddwOptionsMap,fieldName,cell.getValue())||cell.getValue()||'',
                cellEdited:async cell=>{
                    updated(cell);
                    if(fieldName==='trustee') await applyTrustee(cell.getRow());
                    else await applyRate(cell.getRow());
                }};
        }
        async function loadGridOptions() {
            if(!corpGr() || !window.f_dddwctl) return;
            const result=await f_dddwctl.retrieveMultiple({
                trustee:['trustee',corpGr(),'',1,''],currency:['currency',corpGr(),'',1,'']});
            dddwOptionsMap.trustee=result.trustee||[];
            dddwOptionsMap.currency=result.currency||[];
            if(grid && gridBuilt) grid.reformat();
        }
        async function loadFilter() {
            if(!window.initFilterDddw) return;
            const date=ymd(), oldDate=date && workDate && date<workDate;
            const where="szx1pt.obj_id='W_JA035C'"+
                (oldDate?" and szx0gc.tr_cd in (select tr_cd from syt0yh where corp_gr=':corp_gr' and tr_ymd='"+date.replaceAll('-','.')+"')":'');
            await initFilterDddw(pane,{selectId:'filterDddw',dddwId:'dddw',corpGr:corpGr(),seq:1,
                addWhere:where,codeTitle:'코드',nameTitle:'거래코드'});
        }
        function buildGrid() {
            grid = new Tabulator(field('gridJa035c'), {height:'100%',layout:'fitDataFill',selectableRows:1,editTriggerEvent:'click',placeholder:'조회된 데이터가 없습니다.',
                columns:[
                    {title:'No.',formatter:'rownum',width:48,hozAlign:'center',headerSort:false},
                    {title:'관리번호',field:'fundCd',width:110,editor:'input',cellClick:aamsCellEdit,cellEdited:updated},
                    {title:'계좌명',field:'xxFundCd',minWidth:150},
                    {title:'해외보관처',field:'trustee',width:120,editor:'input',cellClick:aamsCellEdit,cellEdited:updated},
                    {title:'통화',field:'currency',width:75,editor:'input',cellClick:aamsCellEdit,cellEdited:async c=>{updated(c); await applyRate(c.getRow());}},
                    {title:'종목코드',field:'yjCd',width:115,editor:'input',cellClick:aamsCellEdit,cellEdited:updated},
                    {title:'종목명',field:'xxYjCd',minWidth:160},
                    {title:'결제수량(금액)',field:'gyuljeAek',width:135,hozAlign:'right',editor:'number',cellClick:aamsCellEdit,formatter:c=>money(c.getValue()),cellEdited:async c=>{updated(c); recalc(c.getRow());}},
                    {title:'환율',field:'transRt',width:100,hozAlign:'right',editor:'number',cellClick:aamsCellEdit,formatter:c=>money(c.getValue()),cellEdited:c=>{updated(c);recalc(c.getRow());}},
                    {title:'원화결제액',field:'wonGyuljeAek',width:130,hozAlign:'right',formatter:c=>money(c.getValue())},
                    {title:'결제일자',field:'gyuljeYmd',width:115,hozAlign:'center',editor:window.aamsDateEditor,cellClick:aamsCellEdit,formatter:window.formatDateVal,cellEdited:updated},
                    {title:'기준통화 결제금액',field:'fcurGyuljeAek',width:150,hozAlign:'right',formatter:c=>money(c.getValue())}
                ]});
            if (window.AamsResponsive) AamsResponsive.bindGridResize(pane,[grid]);
        }
        function recalc(row) { const d=row.getData(); row.update({wonGyuljeAek:(Number(d.gyuljeAek)||0)*(Number(d.transRt)||0)}); }
        async function applyRate(row) { const d=row.getData(); if(!d.currency) return; const rate=await fetchJson(api+'/currency-rate?'+new URLSearchParams({corpGr:corpGr(),ymd:ymd(),currency:d.currency})); if(Number(rate)!==-1) { await row.update({transRt:rate}); recalc(row); } }
        async function load() { if(!corpGr()||!ymd()||!trCd()) return toast('회사그룹, 기준일자, 거래코드를 선택해주세요.','warning'); const rows=await fetchJson(api+'/list?'+new URLSearchParams({corpGr:corpGr(),ymd:ymd(),trCd:trCd()})); maxSeq=Math.max(0,...rows.map(r=>Number(r.trSeq)||0)); deletedRows=[]; await grid.setData(rows); }
        async function save() { const rows=grid.getData().filter(r=>r.isNew||r.isUpdated).concat(deletedRows); if(!rows.length)return toast('변경된 데이터가 없습니다.'); const result=await fetchJson(api+'/save?'+new URLSearchParams({corpGr:corpGr(),ymd:ymd(),trCd:trCd()}),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rows)}); toast(result.message,'success'); await load(); }
        function bind(){ pane.onSearch=()=>load().catch(e=>toast(e.message,'error')); pane.onInput=async()=>{const r=await grid.addRow({corpGr:corpGr(),trYmd:ymd(),trCd:trCd(),trSeq:++maxSeq,fundCd:'',currency:'',gyuljeAek:0,transRt:0,wonGyuljeAek:0,gyuljeYmd:ymd(),isNew:true,rowStatus:'C'},true);r.select();r.getCell('fundCd').edit();}; pane.onDelete=async()=>{const r=grid.getSelectedRows()[0];if(!r)return toast('삭제할 행을 선택해주세요.','warning');const d=r.getData();if(!d.isNew)deletedRows.push({...d,isDeleted:true,rowStatus:'D'});await r.delete();}; pane.onSave=()=>save().catch(e=>toast(e.message,'error')); pane.onRefresh=()=>{deletedRows=[];grid.clearData();}; pane.onCorpGrChange=n=>{pane.dataset.corpGr=n||'';pane.onRefresh();}; pane.onExcel=()=>{if(!window.XLSX)return toast('Excel 모듈을 불러오지 못했습니다.','warning');grid.download('xlsx','해외결제내역_'+ymd().replaceAll('-','')+'.xlsx',{sheetName:'해외결제내역'});}; }
        async function start(){ buildGrid(); if(window.initFilterCalendar)initFilterCalendar(pane); if(window.initFilterDddw) await initFilterDddw(pane,{selectId:'filterDddw',dddwId:'dddw',corpGr:corpGr(),seq:1,addWhere:"szx1pt.obj_id='W_JA035C'",codeTitle:'코드',nameTitle:'거래코드'}); bind(); }
        start().catch(e=>toast(e.message,'error'));
    })();
    </script>
</div>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
    W_JA032G: 해외 파생종목정보 관리 (사무관리 > US Portfolio Model > 주식/지수/통화 정보관리 > 3612 해외파생종목정보)
    DataWindows:
      - dw_c: dc_ymd (만기일자, tag: "만기월 기준")
      - dw_list: d_ja032g1 (해외 파생종목 목록)
      - dw_detail: d_ja032g2 (해외옵션 일별 시세 내역)
-->
<div class="view-container layout-split ja032g-container layout-mobile-stack-container" th:fragment="mainView"
     style="display: flex; flex-direction: column; height: 100%; width: 100%; overflow: hidden; background-color: #ffffff; position: relative;">

    <!-- 1. 상단 공통 툴바 (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- 2. 상단 필터바 (Row 2: 만기일자 dc_ymd + '만기월 기준' 텍스트 라벨) -->
    <div class="filter-bar" style="border-bottom: 1px solid #cbd5e1; padding: 6px 12px; background: #ffffff;">
        <div class="filter-left" style="align-items: center; gap: 16px; display: flex;">
            <!-- dw_c: dc_ymd (만기일자) -->
            <div th:replace="~{fragments/filter/dc_ymd :: filter(label='만기일자')}"></div>
            <!-- tag="만기월 기준" -->
            <span style="font-size: 13px; font-weight: 600; color: #1e293b; user-select: none;">만기월 기준</span>
        </div>
    </div>

    <!-- 3. 메인 콘텐츠 섹션: 상하 수직 분할 레이아웃 (wt_listdetail) -->
    <div class="layout-split-v split-body layout-mobile-stack" data-split-key="JA032G_V" data-default-ratio="55:45"
         style="flex: 1 1 auto; height: calc(100% - 85px); padding: 8px 12px; gap: 4px; display: flex; flex-direction: column; overflow: hidden;">

        <!-- 상단 마스터 패널: 해외 파생종목 목록 (dw_list / d_ja032g1) -->
        <div class="pane-top master-section" style="flex: 1 1 55%; min-height: 200px; display: flex; flex-direction: column; border: 1px solid #86efac; border-radius: 2px; overflow: hidden; background: #ffffff;">
            <div class="pane-body" style="flex: 1 1 auto; height: 100%; width: 100%; overflow: hidden;">
                <div id="gridMaster" class="tabulator-aams-grid" style="height: 100%;"></div>
            </div>
        </div>

        <div class="split-gutter-v" title="드래그하여 상하 비율 조절 (더블클릭 시 기본 비율로 복원)" style="height: 6px; cursor: row-resize; background: #f1f5f9; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0;"></div>

        <!-- 하단 디테일 패널: 해외옵션 일별 시세 내역 (dw_detail / d_ja032g2) -->
        <div class="pane-bottom detail-section" style="flex: 1 1 45%; min-height: 160px; display: flex; flex-direction: column; border: 1px solid #86efac; border-radius: 2px; overflow: hidden; background: #ffffff;">
            <!-- 하단 그리드 상단 우측 파워빌더 DataWindow 네비게이터/컨트롤 바 (공통 detailNav 연동) -->
            <div style="display: flex; justify-content: flex-end; align-items: center; padding: 2px 6px; background: #ffffff; border-bottom: 1px solid #e2e8f0;">
                <div th:replace="~{fragments/tab_header :: detailNav(targetGrid='#gridDetail', fileName='해외옵션일별시세')}"></div>
            </div>
            <div class="pane-body" style="flex: 1 1 auto; height: 100%; width: 100%; overflow: hidden;">
                <div id="gridDetail" class="tabulator-aams-grid" style="height: 100%;"></div>
            </div>
        </div>
    </div>

    <!-- 4. 화면 전용 스크립트 격리 블록 -->
    <script th:inline="javascript">
        (function () {
            // MDI 최상위 탭 컨테이너 획득 (규정 08-1.3 Zero-Hardcoded-ID & Pane Scoping)
            const currentScript = document.currentScript;
            const pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;
            if (!pane) return;

            // DB 기준 영업일자 (SZX0AA.HYUN_YMD)
            const defaultWorkDate = /*[[${workDate}]]*/ '';

            let gridMaster = null;
            let gridDetail = null;
            let isInitialized = false;
            let lastLoadedMasterKey = null;
            let currentSelectedMasterRow = null;

            // [초기화 1] 달력 컴포넌트
            function initCalendar() {
                if (typeof window.initFilterCalendar === 'function') {
                    window.initFilterCalendar(pane, {
                        onSelect: function (selectedDate) {
                            // 규정 08-2 준수: 필터 변경 시 자동 조회를 절대 실행하지 않음
                        }
                    });
                }
            }

            // 코드명 변환 헬퍼
            function getBalhNationName(code) {
                if (!code) return '';
                var c = code.trim().toUpperCase();
                if (c === 'US') return '미국';
                if (c === 'KR') return '한국';
                if (c === 'JP') return '일본';
                if (c === 'CN') return '중국';
                if (c === 'HK') return '홍콩';
                if (c === 'GB' || c === 'UK') return '영국';
                if (c === 'EU') return '유럽';
                return code;
            }

            function getCurrencyName(code) {
                if (!code) return '';
                var c = code.trim().toUpperCase();
                if (c === 'USD') return '달러';
                if (c === 'KRW') return '원';
                if (c === 'JPY') return '엔';
                if (c === 'EUR') return '유로';
                if (c === 'CNY') return '위안';
                if (c === 'HKD') return '홍콩달러';
                return code;
            }

            function getSjGbName(code) {
                if (code == null) return '';
                var c = String(code).trim();
                if (c === '0') return '주식';
                if (c === '1') return '선물';
                if (c === '2') return '콜옵션';
                if (c === '3') return '풋옵션';
                return code;
            }

            // [초기화 2] 그리드 구성 (d_ja032g1 & d_ja032g2)
            function initGrids() {
                const elMaster = pane.querySelector('#gridMaster');
                if (elMaster) {
                    gridMaster = new Tabulator(elMaster, {
                        height: "100%",
                        layout: "fitDataFill",
                        selectableRows: 1,
                        editTriggerEvent: "click",
                        placeholder: "조회된 파생종목 데이터가 없습니다.",
                        columns: [
                            {
                                title: "No.",
                                formatter: "rownum",
                                width: 45,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                headerSort: false,
                                resizable: false
                            },
                            {
                                title: "발행",
                                field: "balhNation",
                                width: 75,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                headerSort: true,
                                editor: "input",
                                editable: function (cell) {
                                    return !!cell.getRow().getData().isNew;
                                },
                                cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                                formatter: function (cell) {
                                    var val = cell.getValue();
                                    return getBalhNationName(val);
                                },
                                cellEdited: function (cell) {
                                    var row = cell.getRow();
                                    var nation = (cell.getValue() || '').trim().toUpperCase();
                                    cell.setValue(nation);
                                    row.update({ isUpdated: true });

                                    // 국가코드 기반 통화 자동연동
                                    if (nation) {
                                        fetch(`/api/usportfoliomodel/ja032g/code-info?balhNation=${encodeURIComponent(nation)}`)
                                            .then(r => r.json())
                                            .then(info => {
                                                if (info && info.currency) {
                                                    row.update({ currency: info.currency });
                                                }
                                            })
                                            .catch(() => {});
                                    }
                                }
                            },
                            {
                                title: "종목코드",
                                field: "jmCd",
                                width: 155,
                                hozAlign: "left",
                                headerHozAlign: "center",
                                headerSort: true,
                                headerCssClass: "col-hdr-blue",
                                editor: "input",
                                editable: function (cell) {
                                    return !!cell.getRow().getData().isNew;
                                },
                                cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                                formatter: function (cell) {
                                    var v = cell.getValue() || '';
                                    return '<span class="cell-text-blue font-bold">' + v + '</span>';
                                },
                                cellEdited: function (cell) {
                                    var row = cell.getRow();
                                    var d = (cell.getValue() || '').trim().toUpperCase();
                                    cell.setValue(d);
                                    row.update({ isUpdated: true });

                                    // 파워빌더 itemchanged 'jm_cd' 연동 (콜론 분리)
                                    if (d.includes(':')) {
                                        var stockGb = d.split(':')[0].trim();
                                        var subCode = d.split(':')[1].trim();
                                        row.update({
                                            stockGb: stockGb,
                                            sedol: row.getData().sedol || subCode,
                                            blbgTckr: row.getData().blbgTckr || subCode
                                        });

                                        fetch(`/api/usportfoliomodel/ja032g/code-info?stockGb=${encodeURIComponent(stockGb)}`)
                                            .then(r => r.json())
                                            .then(info => {
                                                if (info) {
                                                    var upd = {};
                                                    if (info.balhNation) upd.balhNation = info.balhNation;
                                                    if (info.currency) upd.currency = info.currency;
                                                    row.update(upd);
                                                }
                                            })
                                            .catch(() => {});
                                    }
                                }
                            },
                            {
                                title: "종목명",
                                field: "jmNm",
                                width: 230,
                                hozAlign: "left",
                                headerHozAlign: "center",
                                headerSort: true,
                                editor: "input",
                                editable: function (cell) {
                                    return !!cell.getRow().getData().isNew;
                                },
                                cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                                cellEdited: function (cell) {
                                    cell.getRow().update({ isUpdated: true });
                                }
                            },
                            {
                                title: "통화",
                                field: "currency",
                                width: 75,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                headerSort: true,
                                editor: "input",
                                editable: function (cell) {
                                    return !!cell.getRow().getData().isNew;
                                },
                                cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                                formatter: function (cell) {
                                    return getCurrencyName(cell.getValue());
                                },
                                cellEdited: function (cell) {
                                    var row = cell.getRow();
                                    var curr = (cell.getValue() || '').trim().toUpperCase();
                                    cell.setValue(curr);
                                    row.update({ isUpdated: true });

                                    if (curr && !row.getData().balhNation) {
                                        fetch(`/api/usportfoliomodel/ja032g/code-info?currency=${encodeURIComponent(curr)}`)
                                            .then(r => r.json())
                                            .then(info => {
                                                if (info && info.balhNation) {
                                                    row.update({ balhNation: info.balhNation });
                                                }
                                            })
                                            .catch(() => {});
                                    }
                                }
                            },
                            {
                                title: "매도통화",
                                field: "changeCurrency",
                                width: 75,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                headerSort: true,
                                editor: "input",
                                cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                                formatter: function (cell) {
                                    return getCurrencyName(cell.getValue());
                                },
                                cellEdited: function (cell) {
                                    cell.getRow().update({ isUpdated: true });
                                }
                            },
                            {
                                title: "매도결제종목",
                                field: "changeJmCd",
                                width: 120,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                headerSort: true,
                                editor: "input",
                                cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                                cellEdited: function (cell) {
                                    cell.getRow().update({ isUpdated: true });
                                }
                            },
                            {
                                title: "매도결제종목명",
                                field: "xxChangeJmCd",
                                width: 240,
                                hozAlign: "left",
                                headerHozAlign: "center",
                                headerSort: true
                            },
                            {
                                title: "거래소",
                                field: "stockGb",
                                width: 80,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                headerSort: true
                            },
                            {
                                title: "종목구분",
                                field: "sjGb",
                                width: 85,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                headerSort: true,
                                headerCssClass: "col-hdr-green",
                                editor: "list",
                                editorParams: {
                                    values: [
                                        { label: "0: 주식", value: "0" },
                                        { label: "1: 선물", value: "1" },
                                        { label: "2: 콜옵션", value: "2" },
                                        { label: "3: 풋옵션", value: "3" }
                                    ]
                                },
                                cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                                formatter: function (cell) {
                                    var nm = getSjGbName(cell.getValue());
                                    return '<span class="cell-text-green font-bold">' + nm + '</span>';
                                },
                                cellEdited: function (cell) {
                                    var row = cell.getRow();
                                    var v = cell.getValue();
                                    if (v === '0') {
                                        row.update({ hangsaGa: null, unitAek: null, lsyYmd: null });
                                    } else if (v === '1') {
                                        row.update({ hangsaGa: null, unitAek: 100 });
                                    } else if (v === '2' || v === '3') {
                                        row.update({ unitAek: 100 });
                                    }
                                    row.update({ isUpdated: true });
                                }
                            },
                            {
                                title: "최종결제일",
                                field: "lsyYmd",
                                width: 100,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                headerSort: true,
                                headerCssClass: "col-hdr-green",
                                editor: window.aamsDateEditor || "input",
                                editorParams: { separator: "." },
                                cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                                formatter: function (cell) {
                                    var v = cell.getValue();
                                    return v ? v.replace(/-/g, '.') : '';
                                },
                                cellEdited: function (cell) {
                                    cell.getRow().update({ isUpdated: true });
                                }
                            },
                            {
                                title: "단위승수",
                                field: "unitAek",
                                width: 85,
                                hozAlign: "right",
                                headerHozAlign: "center",
                                headerSort: true,
                                headerCssClass: "col-hdr-green",
                                editor: "number",
                                cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                                formatter: function (cell) {
                                    var v = cell.getValue();
                                    return (v != null && v !== '') ? Number(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '';
                                },
                                cellEdited: function (cell) {
                                    cell.getRow().update({ isUpdated: true });
                                }
                            },
                            {
                                title: "행사가격",
                                field: "hangsaGa",
                                width: 85,
                                hozAlign: "right",
                                headerHozAlign: "center",
                                headerSort: true,
                                headerCssClass: "col-hdr-green",
                                editor: "number",
                                cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                                formatter: function (cell) {
                                    var v = cell.getValue();
                                    return (v != null && v !== '') ? Number(v).toLocaleString() : '';
                                },
                                cellEdited: function (cell) {
                                    cell.getRow().update({ isUpdated: true });
                                }
                            },
                            {
                                title: "자산종류",
                                field: "jasan",
                                width: 120,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                headerSort: true,
                                headerCssClass: "col-hdr-green",
                                editor: "input",
                                cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                                cellEdited: function (cell) {
                                    cell.getRow().update({ isUpdated: true });
                                }
                            },
                            {
                                title: "ISIN 코드",
                                field: "isinCd",
                                width: 150,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                headerSort: true,
                                editor: "input",
                                cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                                cellEdited: function (cell) {
                                    cell.getRow().update({ isUpdated: true });
                                }
                            },
                            {
                                title: "Sedol",
                                field: "sedol",
                                width: 95,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                headerSort: true,
                                editor: "input",
                                cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                                cellEdited: function (cell) {
                                    cell.getRow().update({ isUpdated: true });
                                }
                            },
                            {
                                title: "블룸버그코드",
                                field: "blbgTckr",
                                width: 110,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                headerSort: true,
                                editor: "input",
                                cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                                cellEdited: function (cell) {
                                    cell.getRow().update({ isUpdated: true });
                                }
                            },
                            {
                                title: "상장일자",
                                field: "sangjYmd",
                                width: 100,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                headerSort: true,
                                editor: window.aamsDateEditor || "input",
                                editorParams: { separator: "." },
                                cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                                formatter: function (cell) {
                                    var v = cell.getValue();
                                    return v ? v.replace(/-/g, '.') : '';
                                },
                                cellEdited: function (cell) {
                                    cell.getRow().update({ isUpdated: true });
                                }
                            }
                        ]
                    });

                    // 행 선택 삼중 안전망 (규정 05-3)
                    if (typeof setupTabulatorRowSelection === 'function') {
                        setupTabulatorRowSelection(gridMaster, function (row, data) {
                            currentSelectedMasterRow = row;
                            syncDetail(row, data);
                        });
                    }
                    gridMaster.on("rowClick", function (e, row) {
                        currentSelectedMasterRow = row;
                        syncDetail(row, row ? row.getData() : null);
                    });
                    gridMaster.on("rowSelectionChanged", function (data, rows) {
                        if (rows && rows.length > 0) {
                            currentSelectedMasterRow = rows[0];
                            syncDetail(rows[0], rows[0].getData());
                        }
                    });
                }

                const elDetail = pane.querySelector('#gridDetail');
                if (elDetail) {
                    gridDetail = new Tabulator(elDetail, {
                        height: "100%",
                        layout: "fitDataFill",
                        selectableRows: 1,
                        editTriggerEvent: "click",
                        placeholder: "선택된 파생종목의 일별 시세 내역이 없습니다.",
                        columns: [
                            {
                                title: "No.",
                                formatter: "rownum",
                                width: 45,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                headerSort: false,
                                resizable: false
                            },
                            {
                                title: "종가일자",
                                field: "ymd",
                                width: 100,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                headerSort: true,
                                editor: window.aamsDateEditor || "input",
                                editorParams: { separator: "." },
                                editable: function (cell) {
                                    return !!cell.getRow().getData().isNew;
                                },
                                cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                                formatter: function (cell) {
                                    var v = cell.getValue();
                                    return v ? v.replace(/-/g, '.') : '';
                                },
                                cellEdited: function (cell) {
                                    cell.getRow().update({ isUpdated: true });
                                }
                            },
                            {
                                title: "종가",
                                field: "jonga",
                                width: 90,
                                hozAlign: "right",
                                headerHozAlign: "center",
                                headerSort: true,
                                editor: "number",
                                cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                                formatter: function (cell) {
                                    var v = cell.getValue();
                                    return (v != null && v !== '') ? Number(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '';
                                },
                                cellEdited: function (cell) {
                                    cell.getRow().update({ isUpdated: true });
                                }
                            },
                            {
                                title: "통화",
                                field: "currency",
                                width: 75,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                headerSort: true,
                                editor: "input",
                                cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                                cellEdited: function (cell) {
                                    cell.getRow().update({ isUpdated: true });
                                }
                            },
                            {
                                title: "행사가격",
                                field: "hangsaGa",
                                width: 100,
                                hozAlign: "right",
                                headerHozAlign: "center",
                                headerSort: true,
                                editor: "number",
                                cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                                formatter: function (cell) {
                                    var v = cell.getValue();
                                    return (v != null && v !== '') ? Number(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '';
                                },
                                cellEdited: function (cell) {
                                    cell.getRow().update({ isUpdated: true });
                                }
                            },
                            {
                                title: "만기일",
                                field: "trdToDate",
                                width: 100,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                headerSort: true,
                                editor: "input",
                                cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                                formatter: function (cell) {
                                    var v = cell.getValue();
                                    if (!v) return '';

            // [동기화] 마스터 행 선택 -> 디테일(일별 시세) 조회
            function syncDetail(row, masterRowData) {
                if (!row) return;
                var data = masterRowData || (row.getData ? row.getData() : null);
                if (!data || data.isSummaryRow) return;

                var corpGr = (typeof resolveCorpGr === 'function') ? resolveCorpGr(pane) : '';
                var ymd = (typeof getFilterYmd === 'function') ? getFilterYmd(pane, 'YYYYMMDD') : '';
                var jmCd = (data.jmCd || '').trim();

                if (!jmCd) {
                    if (gridDetail) gridDetail.clearData();
                    return;
                }

                var currentKey = (data.corpGr || corpGr) + "_" + jmCd;
                if (lastLoadedMasterKey === currentKey) return; // 중복 호출 방지
                lastLoadedMasterKey = currentKey;

                loadDetailList(corpGr, ymd, jmCd);
            }

            // [조회 1] 마스터 목록 조회
            function loadMasterList() {
                var corpGr = (typeof resolveCorpGr === 'function') ? resolveCorpGr(pane) : '';
                var lsyYmd = (typeof getFilterYmd === 'function') ? getFilterYmd(pane, 'YYYYMMDD') : '';

                if (gridDetail) gridDetail.clearData();
                lastLoadedMasterKey = null;

                fetch(`/api/usportfoliomodel/ja032g/master?corpGr=${encodeURIComponent(corpGr)}&lsyYmd=${encodeURIComponent(lsyYmd)}`)
                    .then(res => {
                        if (!res.ok) throw new Error("서버 응답 오류 (" + res.status + ")");
                        return res.json();
                    })
                    .then(data => {
                        if (gridMaster) {
                            gridMaster.setData(data || []).then(() => {
                                var rows = gridMaster.getRows();
                                if (rows && rows.length > 0) {
                                    rows[0].select();
                                    syncDetail(rows[0], rows[0].getData());
                                }
                            });
                        }
                    })
                    .catch(err => {
                        console.error("해외 파생종목 목록 조회 오류:", err);
                        if (typeof showToast === 'function') showToast("조회 중 오류가 발생했습니다.", "error");
                    });
            }

            // [조회 2] 디테일 목록 조회
            function loadDetailList(corpGr, ymd, jmCd) {
                if (!gridDetail) return;

                fetch(`/api/usportfoliomodel/ja032g/detail?corpGr=${encodeURIComponent(corpGr)}&ymd=${encodeURIComponent(ymd)}&jmCd=${encodeURIComponent(jmCd)}`)
                    .then(res => {
                        if (!res.ok) throw new Error("서버 응답 오류 (" + res.status + ")");
                        return res.json();
                    })
                    .then(data => {
                        gridDetail.setData(data || []).then(() => {
                            var dRows = gridDetail.getRows();
                            if (dRows && dRows.length > 0) {
                                dRows[0].select();
                            }
                        });
                    })
                    .catch(err => {
                        console.error("일별 시세 목록 조회 오류:", err);
                    });
            }

            // [디테일 네비게이션 제어]
            function initDetailNavigation() {
                var btnFirst = pane.querySelector('#btnDetailFirst');
                var btnPrev = pane.querySelector('#btnDetailPrev');
                var btnNext = pane.querySelector('#btnDetailNext');
                var btnLast = pane.querySelector('#btnDetailLast');
                var btnAdd = pane.querySelector('#btnDetailAdd');
                var btnDel = pane.querySelector('#btnDetailDelete');
                var btnSave = pane.querySelector('#btnDetailSave');

                if (btnFirst) {
                    btnFirst.addEventListener('click', function () {
                        if (!gridDetail) return;
                        var rows = gridDetail.getRows();
                        if (rows && rows.length > 0) {
                            gridDetail.deselectRow();
                            rows[0].select();
                            gridDetail.scrollToRow(rows[0], "top", false);
                        }
                    });
                }

                if (btnLast) {
                    btnLast.addEventListener('click', function () {
                        if (!gridDetail) return;
                        var rows = gridDetail.getRows();
                        if (rows && rows.length > 0) {
                            gridDetail.deselectRow();
                            rows[rows.length - 1].select();
                            gridDetail.scrollToRow(rows[rows.length - 1], "bottom", false);
                        }
                    });
                }

                if (btnPrev) {
                    btnPrev.addEventListener('click', function () {
                        if (!gridDetail) return;
                        var selected = gridDetail.getSelectedRows();
                        var rows = gridDetail.getRows();
                        if (!rows || rows.length === 0) return;
                        var curIdx = selected && selected.length > 0 ? rows.indexOf(selected[0]) : 0;
                        var prevIdx = Math.max(0, curIdx - 1);
                        gridDetail.deselectRow();
                        rows[prevIdx].select();
                        gridDetail.scrollToRow(rows[prevIdx], "center", false);
                    });
                }

                if (btnNext) {
                    btnNext.addEventListener('click', function () {
                        if (!gridDetail) return;
                        var selected = gridDetail.getSelectedRows();
                        var rows = gridDetail.getRows();
                        if (!rows || rows.length === 0) return;
                        var curIdx = selected && selected.length > 0 ? rows.indexOf(selected[0]) : 0;
                        var nextIdx = Math.min(rows.length - 1, curIdx + 1);
                        gridDetail.deselectRow();
                        rows[nextIdx].select();
                        gridDetail.scrollToRow(rows[nextIdx], "center", false);
                    });
                }

                if (btnAdd) {
                    btnAdd.addEventListener('click', function () {
                        addDetailRow();
                    });
                }

                if (btnDel) {
                    btnDel.addEventListener('click', function () {
                        deleteDetailRow();
                    });
                }

                if (btnSave) {
                    btnSave.addEventListener('click', function () {
                        saveDetailList();
                    });
                }
            }

            // [마스터 행추가]
            function addMasterRow() {
                if (!gridMaster) return;
                var corpGr = (typeof resolveCorpGr === 'function') ? resolveCorpGr(pane) : '';
                var workYmd = (typeof getFilterYmd === 'function') ? getFilterYmd(pane, 'YYYY-MM-DD') : defaultWorkDate;

                var newRow = {
                    isNew: true,
                    rowStatus: 'C',
                    corpGr: corpGr,
                    jmCd: '',
                    jmNm: '',
                    stockGb: 'XNAS',
                    jasanGb: 'A',
                    seqNo: 1,
                    balhNation: 'US',
                    currency: 'USD',
                    changeCurrency: 'USD',
                    changeJmCd: '',
                    xxChangeJmCd: '',
                    sjGb: '3', // 풋옵션
                    lsyYmd: workYmd,
                    unitAek: 100,
                    hangsaGa: 0,
                    jasan: '',
                    isinCd: '',
                    sedol: '',
                    blbgTckr: '',
                    sigaAgent: 'B'
                };

                gridMaster.addRow(newRow, true).then(function (row) {
                    gridMaster.deselectRow();
                    row.select();
                    currentSelectedMasterRow = row;
                });
            }

            // [마스터 행삭제]
            function deleteMasterRow() {
                if (!gridMaster) return;
                var selected = gridMaster.getSelectedRows();
                if (!selected || selected.length === 0) {
                    if (typeof showToast === 'function') showToast("삭제할 파생종목 행을 먼저 선택해주세요.", "warning");
                    return;
                }

                var row = selected[0];
                var data = row.getData();

                if (data.isNew) {
                    row.delete();
                    currentSelectedMasterRow = null;
                    return;
                }

                if (typeof showAlert === 'function') {
                    showAlert("선택한 파생종목(" + (data.jmCd || '') + ")을 삭제하시겠습니까?", function () {
                        row.update({ isDeleted: true, rowStatus: 'D' });
                        saveMasterList();
                    });
                } else {
                    if (confirm("선택한 파생종목을 삭제하시겠습니까?")) {
                        row.update({ isDeleted: true, rowStatus: 'D' });
                        saveMasterList();
                    }
                }
            }

            // [디테일 행추가]
            function addDetailRow() {
                if (!gridDetail) return;
                if (!currentSelectedMasterRow) {
                    if (typeof showToast === 'function') showToast("상단에서 파생종목을 먼저 선택해주세요.", "warning");
                    return;
                }

                var masterData = currentSelectedMasterRow.getData();
                var corpGr = (typeof resolveCorpGr === 'function') ? resolveCorpGr(pane) : '';
                var todayYmd = (typeof getFilterYmd === 'function') ? getFilterYmd(pane, 'YYYY-MM-DD') : defaultWorkDate;

                var newDetail = {
                    isNew: true,
                    rowStatus: 'C',
                    corpGr: masterData.corpGr || corpGr,
                    jmCd: masterData.jmCd,
                    ymd: todayYmd,
                    jonga: 0,
                    currency: masterData.currency || 'USD',
                    hangsaGa: masterData.hangsaGa || 0,
                    trdToDate: masterData.lsyYmd || '',
                    bid: 0,
                    ask: 0,
                    tvol: 0,
                    tamt: 0,
                    tRate: 0,
                    blbgTckr: masterData.jasan || masterData.blbgTckr || '',
                    isinCd: masterData.changeJmCd || masterData.isinCd || ''
                };

                gridDetail.addRow(newDetail, true).then(function (row) {
                    gridDetail.deselectRow();
                    row.select();
                });
            }

            // [디테일 행삭제]
            function deleteDetailRow() {
                if (!gridDetail) return;
                var selected = gridDetail.getSelectedRows();
                if (!selected || selected.length === 0) {
                    if (typeof showToast === 'function') showToast("삭제할 시세 행을 먼저 선택해주세요.", "warning");
                    return;
                }

                var row = selected[0];
                var data = row.getData();

                if (data.isNew) {
                    row.delete();
                    return;
                }

                if (typeof showAlert === 'function') {
                    showAlert("선택한 일자(" + (data.ymd || '') + ")의 시세를 삭제하시겠습니까?", function () {
                        row.update({ isDeleted: true, rowStatus: 'D' });
                        saveDetailList();
                    });
                } else {
                    if (confirm("선택한 시세를 삭제하시겠습니까?")) {
                        row.update({ isDeleted: true, rowStatus: 'D' });
                        saveDetailList();
                    }
                }
            }

            // [저장 1] 마스터 일괄 저장
            function saveMasterList() {
                if (!gridMaster) return;
                var rows = gridMaster.getData();
                var changedList = [];

                for (var i = 0; i < rows.length; i++) {
                    var r = rows[i];
                    if (r.isNew || r.isUpdated || r.isDeleted) {
                        if (!r.isDeleted && (!r.jmCd || !r.jmCd.trim())) {
                            if (typeof showToast === 'function') showToast((i + 1) + "번째 행의 종목코드를 입력해주세요.", "warning");
                            return;
                        }
                        changedList.push(r);
                    }
                }

                if (changedList.length === 0) {
                    return false;
                }

                var corpGr = (typeof resolveCorpGr === 'function') ? resolveCorpGr(pane) : '';
                fetch(`/api/usportfoliomodel/ja032g/save-master?corpGr=${encodeURIComponent(corpGr)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(changedList)
                })
                    .then(res => res.json())
                    .then(res => {
                        if (res && res.success) {
                            if (typeof showToast === 'function') showToast(res.message || "파생종목이 정상 저장되었습니다.", "success");
                            loadMasterList();
                        } else {
                            if (typeof showToast === 'function') showToast((res && res.message) ? res.message : "파생종목 저장에 실패했습니다.", "error");
                        }
                    })
                    .catch(err => {
                        console.error("마스터 저장 오류:", err);
                        if (typeof showToast === 'function') showToast("파생종목 저장 중 통신 오류가 발생했습니다.", "error");
                    });

                return true;
            }

            // [저장 2] 디테일 일괄 저장
            function saveDetailList() {
                if (!gridDetail) return;
                var rows = gridDetail.getData();
                var changedList = [];

                for (var i = 0; i < rows.length; i++) {
                    var r = rows[i];
                    if (r.isNew || r.isUpdated || r.isDeleted) {
                        if (!r.isDeleted && (!r.ymd || !r.ymd.trim())) {
                            if (typeof showToast === 'function') showToast((i + 1) + "번째 시세 행의 일자를 입력해주세요.", "warning");
                            return;
                        }
                        changedList.push(r);
                    }
                }

                if (changedList.length === 0) {
                    if (typeof showToast === 'function') showToast("저장할 변경 시세 데이터가 없습니다.", "info");
                    return false;
                }

                var corpGr = (typeof resolveCorpGr === 'function') ? resolveCorpGr(pane) : '';
                var jmCd = currentSelectedMasterRow ? (currentSelectedMasterRow.getData().jmCd || '') : '';

                fetch(`/api/usportfoliomodel/ja032g/save-detail?corpGr=${encodeURIComponent(corpGr)}&jmCd=${encodeURIComponent(jmCd)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(changedList)
                })
                    .then(res => res.json())
                    .then(res => {
                        if (res && res.success) {
                            if (typeof showToast === 'function') showToast(res.message || "일별 시세가 정상 저장되었습니다.", "success");
                            var ymd = (typeof getFilterYmd === 'function') ? getFilterYmd(pane, 'YYYYMMDD') : '';
                            loadDetailList(corpGr, ymd, jmCd);
                        } else {
                            if (typeof showToast === 'function') showToast((res && res.message) ? res.message : "일별 시세 저장에 실패했습니다.", "error");
                        }
                    })
                    .catch(err => {
                        console.error("디테일 저장 오류:", err);
                        if (typeof showToast === 'function') showToast("시세 저장 중 통신 오류가 발생했습니다.", "error");
                    });

                return true;
            }

            // [초기화 3] 스플리터
            function initSplitter() {
                if (window.AamsSplitter && typeof window.AamsSplitter.init === 'function') {
                    window.AamsSplitter.init(pane);
                }
            }

            // [초기화 4] 상단 공통 툴바 표준 계약 바인딩
            function initToolbar() {
                pane.onSearch = function () {
                    loadMasterList();
                };

                pane.onInput = function () {
                    addMasterRow();
                };

                pane.onDelete = function () {
                    deleteMasterRow();
                };

                pane.onSave = function () {
                    var mSaved = saveMasterList();
                    var dSaved = saveDetailList();
                    if (!mSaved && !dSaved) {
                        if (typeof showToast === 'function') showToast("저장할 변경 데이터가 없습니다.", "info");
                    }
                };

                pane.onCopy = function () {
                    if (!gridMaster) return;
                    var selected = gridMaster.getSelectedRows();
                    if (!selected || selected.length === 0) {
                        if (typeof showToast === 'function') showToast("복사할 파생종목 행을 먼저 선택해주세요.", "warning");
                        return;
                    }
                    var src = Object.assign({}, selected[0].getData());
                    src.isNew = true;
                    src.rowStatus = 'C';
                    src.jmCd = (src.jmCd || '') + '_COPY';
                    delete src.isUpdated;
                    delete src.isDeleted;

                    gridMaster.addRow(src, true).then(function (row) {
                        gridMaster.deselectRow();
                        row.select();
                        currentSelectedMasterRow = row;
                    });
                };

                pane.onRefresh = function () {
                    if (gridMaster) gridMaster.clearData();
                    if (gridDetail) gridDetail.clearData();
                    lastLoadedMasterKey = null;
                    currentSelectedMasterRow = null;

                    if (typeof showToast === 'function') {
                        showToast("화면이 초기화되었습니다.", "info");
                    }
                };

                pane.onCorpGrChange = function (newCorpGr) {
                    // 규정 08 준수: 필터 변경 시 자동 조회를 실행하지 않음
                };

                pane.onExcel = function () {
                    if (gridMaster) {
                        gridMaster.download("xlsx", "해외파생종목정보_" + (typeof getFilterYmd === 'function' ? getFilterYmd(pane, 'YYYYMMDD') : '') + ".xlsx", { sheetName: "해외파생종목" });
                    }
                };
            }

            // [MDI 단일 진입점 실행]
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                initCalendar();
                initGrids();
                initDetailNavigation();
                initSplitter();
                initToolbar();

                // eb_direct_retrieve = true (화면 진입 시 1회 자동 조회)
                loadMasterList();
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", startInit);
            } else {
                startInit();
            }
        })();
    </script>

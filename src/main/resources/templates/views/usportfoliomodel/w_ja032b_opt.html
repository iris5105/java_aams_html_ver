                if (!corpGr) {
                    if (window.showToast) window.showToast("회사그룹을 선택해주세요.", "warning");
                    return;
                }
                if (!ymd) {
                    if (window.showToast) window.showToast("조회기준일을 입력해주세요.", "warning");
                    return;
                }

                // 1단계: 포트 시작일(fymd) 조회 후 2단계: 펀드 목록 조회
                fetch('/api/usportfoliomodel/ja032b-opt/fymd?corpGr=' + encodeURIComponent(corpGr) + '&ymd=' + encodeURIComponent(ymd))
                    .then(function (res) { return res.json(); })
                    .then(function (fymdData) {
                        currentFymd = fymdData.fymd || ymd;

                        var fundUrl = '/api/usportfoliomodel/ja032b-opt/fund-list?corpGr=' + encodeURIComponent(corpGr) + '&ymd=' + encodeURIComponent(ymd);
                        return fetch(fundUrl);
                    })
                    .then(function (res) { return res.json(); })
                    .then(function (fundList) {
                        lastFundKey = null;
                        lastStockKey = null;
                        if (gridFund) {
                            gridFund.setData(fundList || []);
                            // 1번째 행 자동 선택
                            setTimeout(function () {
                                var rows = gridFund.getRows();
                                if (rows && rows.length > 0) {
                                    rows[0].select();
                                } else {
                                    if (gridStock) gridStock.clearData();
                                    if (gridDetail) gridDetail.clearData();
                                }
                            }, 50);
                        }
                    })
                    .catch(function (err) {
                        console.error("펀드 목록 조회 오류:", err);
                        if (window.showToast) window.showToast("데이터 조회 중 오류가 발생했습니다.", "error");
                    });
            }

            // 6. 펀드 행 선택 시 종목 목록 연동 (syncFundDetail)
            function syncFundDetail(row, rowData) {
                if (!row) return;
                var data = rowData || (row.getData ? row.getData() : null);
                if (!data) return;

                var corpGr = resolveCorpGr(currentPane);
                var ymd = getFilterYmd(currentPane, 'YYYY-MM-DD');
                var fundCd = data.fundCd || "";

                var currentKey = corpGr + "_" + ymd + "_" + fundCd;
                if (lastFundKey === currentKey) return;
                lastFundKey = currentKey;

                currentFundRowData = data;
                lastStockKey = null;
                if (gridDetail) gridDetail.clearData();

                var fymd = currentFymd || ymd;
                var url = '/api/usportfoliomodel/ja032b-opt/stock-list?corpGr=' + encodeURIComponent(corpGr)
                    + '&fymd=' + encodeURIComponent(fymd)
                    + '&tymd=' + encodeURIComponent(ymd)
                    + '&fundCd=' + encodeURIComponent(fundCd);

                fetch(url)
                    .then(function (res) { return res.json(); })
                    .then(function (stockList) {
                        if (gridStock) {
                            gridStock.setData(stockList || []);
                            // 1번째 행 자동 선택
                            setTimeout(function () {
                                var rows = gridStock.getRows();
                                if (rows && rows.length > 0) {
                                    rows[0].select();
                                } else {
                                    if (gridDetail) gridDetail.clearData();
                                }
                            }, 50);
                        }
                    })
                    .catch(function (err) {
                        console.error("종목 목록 조회 오류:", err);
                    });
            }

            // 6-1. 파워빌더 group(by=ymd) trailer.1 규정 반영: 일자별(ymd별) 일계 Summary Row 생성 함수
            function buildDailySummaryData(rawList, isKrx) {
                if (!rawList || rawList.length === 0) return [];

                var result = [];
                var currentGroupYmd = null;
                var groupItems = [];

                function flushGroup() {
                    if (groupItems.length === 0) return;

                    // 1) 해당 일자의 데이터 행 추가
                    groupItems.forEach(function (item) {
                        result.push(item);
                    });

                    // 2) 해당 일자의 일계(Summary) 계산
                    var sumStockJusu = 0;
                    var sumStockChui = 0;
                    var sumOptQty = 0;
                    var sumOptNominalAmt = 0;
                    var sumOptPremium = 0;
                    var sumRiskValue = 0;

                    groupItems.forEach(function (item) {
                        sumStockJusu += parseFloat(item.stockJusu) || 0;
                        sumStockChui += parseFloat(item.stockChui) || 0;
                        sumOptQty += parseFloat(item.optQty) || 0;
                        sumOptNominalAmt += parseFloat(item.optNominalAmt) || 0;
                        sumOptPremium += parseFloat(item.optPremium) || 0;
                        sumRiskValue += parseFloat(item.riskValue) || 0;
                    });

                    var summaryRow = {
                        isSummaryRow: true,
                        ymd: currentGroupYmd,
                        port: "일계",
                        stockJusu: sumStockJusu,
                        stockChui: sumStockChui,
                        optQty: sumOptQty,
                        optNominalAmt: sumOptNominalAmt,
                        optPremium: sumOptPremium,
                        riskValue: isKrx ? null : sumRiskValue,
                        isKrx: isKrx
                    };

                    result.push(summaryRow);
                    groupItems = [];
                }

                rawList.forEach(function (item) {
                    var itemYmd = (item.ymd || "").trim();
                    if (currentGroupYmd !== null && currentGroupYmd !== itemYmd) {
                        flushGroup();
                    }
                    currentGroupYmd = itemYmd;
                    groupItems.push(item);
                });

                flushGroup(); // 마지막 일자 그룹 처리

                return result;
            }

            // 7. 종목 행 선택 시 옵션위험값 일별현황 연동 (syncStockDetail)
            function syncStockDetail(row, rowData) {
                if (!row) return;
                var data = rowData || (row.getData ? row.getData() : null);
                if (!data) return;

                var corpGr = resolveCorpGr(currentPane);
                var ymd = getFilterYmd(currentPane, 'YYYY-MM-DD');
                var fundCd = (currentFundRowData && currentFundRowData.fundCd) ? currentFundRowData.fundCd : (data.fundCd || "");
                var jmCd = data.yjCd || data.jmCd || "";

                var currentKey = corpGr + "_" + ymd + "_" + fundCd + "_" + jmCd;
                if (lastStockKey === currentKey) return;
                lastStockKey = currentKey;

                currentStockRowData = data;

                var isKrx = (jmCd.indexOf(':') === -1);
                var fymd = currentFymd || ymd;

                // 타이틀 갱신 (파워빌더 DataWindow 전환)
                var titleEl = currentPane.querySelector("#titleDetailSection");
                if (titleEl) {
                    var titlePrefix = isKrx ? "[국내KRX] " : "[해외옵션] ";
                    var jmNm = data.jmNm || data.xxYjCd || jmCd;
                    titleEl.innerHTML = '<i class="fa-solid fa-shield-halved"></i> ' + titlePrefix + jmNm + ' 옵션위험값 일별현황';
                }

                // 국내종목인 경우 옵션위험값 컬럼 가시성 조정 (d_ja032b_opt_krx에는 risk_value 컬럼 없음)
                if (gridDetail) {
                    var riskCol = gridDetail.getColumn("riskValue");
                    if (riskCol) {
                        if (isKrx) {
                            riskCol.hide();
                        } else {
                            riskCol.show();
                        }
                    }
                }

                var url = '/api/usportfoliomodel/ja032b-opt/detail-list?corpGr=' + encodeURIComponent(corpGr)
                    + '&fundCd=' + encodeURIComponent(fundCd)
                    + '&jmCd=' + encodeURIComponent(jmCd)
                    + '&fymd=' + encodeURIComponent(fymd)
                    + '&tymd=' + encodeURIComponent(ymd);

                fetch(url)
                    .then(function (res) { return res.json(); })
                    .then(function (detailList) {
                        if (gridDetail) {
                            var list = detailList || [];
                            // 파워빌더 group(by=ymd) trailer.1 규정 반영: 일자별(ymd별) 일계 Summary Row 생성
                            var processedList = buildDailySummaryData(list, isKrx);
                            gridDetail.setData(processedList);
                        }
                    })
                    .catch(function (err) {
                        console.error("옵션위험값 일별현황 상세 조회 오류:", err);
                    });
            }

            // 8. 상단 공통 툴바 표준 계약 바인딩 (규정 08)
            currentPane.onSearch = function () {
                loadFundGrid();
            };

            currentPane.onRefresh = function () {
                if (gridFund) gridFund.clearData();
                if (gridStock) gridStock.clearData();
                if (gridDetail) gridDetail.clearData();

                lastFundKey = null;
                lastStockKey = null;
                currentFundRowData = null;
                currentStockRowData = null;
                currentFymd = null;

                if (window.showToast) {
                    window.showToast("화면이 초기화되었습니다.", "info");
                }
            };

            currentPane.onCorpGrChange = function (newCorpGr) {
                // 규정 08: 회사그룹 변경 시 자동 조회하지 않음, 기준일자만 최신화
                if (newCorpGr && typeof fetchCommonWorkDate === 'function') {
                    fetchCommonWorkDate(newCorpGr, function (workDate) {
                        var ymdInput = currentPane.querySelector('#filterYmd') || currentPane.querySelector('input[name="ymd"]');
                        if (ymdInput && workDate) {
                            ymdInput.value = workDate;
                        }
                    });
                }
            };

            currentPane.onExcel = function () {
                var ymd = getFilterYmd(currentPane, 'YYYYMMDD');
                if (gridDetail && gridDetail.getData().length > 0) {
                    var jmNm = (currentStockRowData && (currentStockRowData.jmNm || currentStockRowData.yjCd)) ? ("_" + currentStockRowData.jmNm) : "";
                    gridDetail.download("xlsx", "옵션위험값일별현황" + jmNm + "_" + ymd + ".xlsx", { sheetName: "옵션위험값일별현황" });
                } else if (gridStock && gridStock.getData().length > 0) {
                    gridStock.download("xlsx", "종목목록_" + ymd + ".xlsx", { sheetName: "종목목록" });
                } else if (gridFund) {
                    gridFund.download("xlsx", "펀드목록_" + ymd + ".xlsx", { sheetName: "펀드목록" });
                }
            };

            // 9. 단일 진입점 초기화 (규정 10-1.1)
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                initFundGrid();
                initStockGrid();
                initDetailGrid();
                initSplitters();

                // 파워빌더 eb_direct_retrieve = true 규정 반영: 최신 작업일자 동기화 후 초기 1회 자동 조회
                var corpGr = (typeof resolveCorpGr === 'function') ? resolveCorpGr(currentPane) : '';
                var ymdInput = currentPane.querySelector('#filterYmd') || currentPane.querySelector('input[name="ymd"]');
                if (typeof fetchCommonWorkDate === 'function' && corpGr) {
                    fetchCommonWorkDate(corpGr, function (workDate) {
                        if (ymdInput && workDate) {
                            ymdInput.value = workDate;
                        }
                        loadFundGrid();
                    });
                } else {
                    setTimeout(function () {
                        loadFundGrid();
                    }, 100);
                }
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", startInit);
            } else {
                startInit();
            }
        })();
    </script>
</div>
</html>

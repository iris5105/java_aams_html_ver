<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-mobile-stack-container" th:fragment="mainView"
     style="display: flex; flex-direction: column; height: 100%; width: 100%; overflow: hidden; background-color: #ffffff; position: relative;">

    <!-- 1. 상단 공통 툴바 (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- 2. 상단 안내 및 도움말 바 (Row 2: PB 소스상 dw_c 비가시 화면) -->
    <div class="filter-bar">
        <div class="filter-left" style="align-items: center; gap: 12px;">
            <span class="filter-label" style="font-weight: 700; color: #1e293b; display: inline-flex; align-items: center; gap: 6px;">
                <i class="fa-solid fa-clock-rotate-left" style="color: #2563eb;"></i> CRON 작업 및 프로시저 관리
            </span>
            <span class="badge" style="background: #e0f2fe; color: #0369a1; font-size: 11.5px; font-weight: 600; padding: 4px 8px; border-radius: 4px;">
                <i class="fa-solid fa-circle-info"></i> 행 선택 시 해당 작업의 실행 이력과 IN_PARAM 파라미터가 실시간 연동됩니다.
            </span>
            <span class="text-muted" style="font-size: 11px; color: #64748b;">
                <i class="fa-solid fa-keyboard"></i> Ctrl+→ / Tab 2칸 들여쓰기
            </span>
        </div>
    </div>

    <!-- 3. 메인 콘텐츠 섹션: 상하 수직 분할 (st_move: 상단 그리드 영역 62% + 하단 IN_PARAM 에디터 38%) -->
    <div class="layout-split-v split-body layout-mobile-stack" data-split-key="CRON_V" data-default-ratio="62:38"
         style="flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column;">

        <!-- 3-1. 상단 영역: 좌우 수평 분할 (st_1: 좌측 CRON목록 60% + 우측 실행상태/이력 40%) -->
        <div class="pane-top split-top-section" style="display: flex; flex-direction: column; min-height: 180px; border: none; background: transparent; padding: 0; box-shadow: none; overflow: hidden;">
            <div class="layout-split-h layout-mobile-stack" data-split-key="CRON_H" data-default-ratio="60:40"
                 style="flex: 1; min-height: 0; width: 100%; height: 100%; padding: 0; background: transparent;">

                <!-- 좌측: CRON 목록 (dw_list -> d_cron_q) -->
                <div class="pane-left master-section" style="display: flex; flex-direction: column; min-width: 280px; overflow: hidden;">
                    <div class="panel-header" style="display: flex; align-items: center; justify-content: space-between; height: 34px; padding: 0 10px; background: #f8fafc; border-bottom: 1px solid #e2e8f0;">
                        <span class="panel-title" style="font-size: 12.5px; font-weight: 700; color: #1e293b; display: inline-flex; align-items: center; gap: 6px;">
                            <i class="fa-solid fa-list-check" style="color: #3b82f6;"></i> CRON 작업 목록
                        </span>
                    </div>
                    <div class="panel-body" style="flex: 1; min-height: 0; padding: 0;">
                        <div id="gridCronList" class="tabulator-aams-grid" style="height: 100%;"></div>
                    </div>
                </div>

                <!-- 좌우 스플리터 드래그 바 (st_1) -->
                <div class="split-gutter-h" title="드래그하여 좌우 비율 조절 (더블클릭 시 기본 비율로 복원)"></div>

                <!-- 우측: 실행 이력 및 상태 (dw_status -> d_cron_status) -->
                <div class="pane-right detail-section" style="display: flex; flex-direction: column; min-width: 260px; overflow: hidden;">
                    <div class="panel-header" style="display: flex; align-items: center; justify-content: space-between; height: 34px; padding: 0 10px; background: #f8fafc; border-bottom: 1px solid #e2e8f0;">
                        <span class="panel-title" style="font-size: 12.5px; font-weight: 700; color: #1e293b; display: inline-flex; align-items: center; gap: 6px;">
                            <i class="fa-solid fa-clock-rotate-left" style="color: #6366f1;"></i> 실행 이력 및 상태
                        </span>
                        <div class="panel-actions" style="display: flex; align-items: center; gap: 6px;">
                            <span id="selectedCronKeyBadge" class="badge" style="background: #f1f5f9; color: #475569; font-size: 11px; font-weight: 600;">
                                전체
                            </span>
                        </div>
                    </div>
                    <div class="panel-body" style="flex: 1; min-height: 0; padding: 0;">
                        <div id="gridCronStatus" class="tabulator-aams-grid" style="height: 100%;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 상하 스플리터 드래그 바 (st_move) -->
        <div class="split-gutter-v" title="드래그하여 상하 비율 조절 (더블클릭 시 기본 비율로 복원)"></div>

        <!-- 3-2. 하단 영역: 요청 파라미터 에디터 (mle_in_param) -->
        <div class="pane-bottom split-bottom-section" style="display: flex; flex-direction: column; min-height: 140px; overflow: hidden; background-color: #ffffff;">
            <div class="panel-header" style="display: flex; align-items: center; justify-content: space-between; height: 34px; padding: 0 10px; background: #f8fafc; border-bottom: 1px solid #cbd5e1;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span class="panel-title" style="font-size: 12.5px; font-weight: 700; color: #0f172a; display: inline-flex; align-items: center; gap: 6px;">
                        <i class="fa-solid fa-terminal" style="color: #0284c7;"></i> IN_PARAM (요청 파라미터 데이터)
                    </span>
                    <span class="badge" style="background: #ecfeff; color: #0e7490; font-size: 11px; font-weight: 600; padding: 2px 6px; border: 1px solid #a5f3fc; border-radius: 3px;">
                        <i class="fa-solid fa-code"></i> Ctrl+→ / Tab 들여쓰기 | Ctrl+← / Shift+Tab 내어쓰기
                    </span>
                </div>
                <div class="panel-actions" style="display: flex; align-items: center; gap: 6px;">
                    <button type="button" class="btn-grid-sub" id="btnFormatJsonInParam" title="JSON 형식 자동 정렬">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> JSON 정렬
                    </button>
                    <button type="button" class="btn-grid-sub" id="btnCopyInParam" title="파라미터 내용 클립보드 복사">
                        <i class="fa-regular fa-copy"></i> 복사
                    </button>
                </div>
            </div>
            <div class="panel-body" style="flex: 1; min-height: 0; padding: 4px; box-sizing: border-box; background-color: #f8fafc;">
                <!-- PB 소스: mle_IN_PARAM.BACKCOLOR = RGB (240, 255, 255) / D2Coding 고정폭 폰트 -->
                <textarea id="mleInParam" spellcheck="false"
                          placeholder="선택한 CRON 작업의 IN_PARAM (요청 파라미터) 내용이 여기에 표시됩니다. 직접 수정 시 커밋 시점에 작업 목록에 자동 반영됩니다."
                          style="width: 100%; height: 100%; box-sizing: border-box; resize: none; font-family: 'D2Coding', 'Consolas', 'Courier New', monospace; font-size: 13px; line-height: 1.5; padding: 8px 12px; background-color: #f0ffff; color: #0f172a; border: 1px solid #bae6fd; border-radius: 4px; outline: none; transition: border-color 0.15s;"></textarea>
            </div>
        </div>
    </div>

    <!-- 4. 화면 전용 스크립트 격리 블록 -->
    <script th:inline="javascript">
        (function () {
            // MDI 최상위 탭 컨테이너 획득 (규정 08-1.3 Zero-Hardcoded-ID & Pane Scoping)
            const currentScript = document.currentScript;
            const pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;
            if (!pane) return;

            let gridCronList = null;
            let gridCronStatus = null;
            let isInitialized = false;

            // 행 선택 캐시 및 상태 관리
            let currentActiveRow = null;
            let lastLoadedCronKey = null;

            const mleInParamEl = pane.querySelector('#mleInParam');
            const selectedCronKeyBadgeEl = pane.querySelector('#selectedCronKeyBadge');

            // [함수 1] 현재 textarea에 작성된 내용을 활성 행 객체에 동기화
            function saveCurrentMleToRow() {
                if (!currentActiveRow || !mleInParamEl) return;
                try {
                    const rowData = currentActiveRow.getData();
                    if (!rowData) return;

                    const curText = mleInParamEl.value || "";
                    if ((rowData.inParam || "") !== curText) {
                        currentActiveRow.update({
                            inParam: curText,
                            isUpdated: true,
                            rowStatus: rowData.isNew ? "C" : "U"
                        });
                    }
                } catch (e) {
                    console.error("IN_PARAM 저장 동기화 오류:", e);
                }
            }

            // [초기화 1] Tabulator 그리드 빌드
            function initGrids() {
                // 1) 좌측: CRON 작업 목록 (d_cron_q.srd)
                const elList = pane.querySelector('#gridCronList');
                if (elList) {
                    gridCronList = new Tabulator(elList, {
                        height: "100%",
                        layout: "fitColumns",
                        selectableRows: 1,
                        editTriggerEvent: "click", // 규정 04-1 원클릭 인라인 편집
                        placeholder: "등록된 CRON 작업 데이터가 없습니다.",
                        columns: [
                            {
                                title: "No.",
                                formatter: "rownum",
                                width: 50,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                headerSort: false
                            },
                            {
                                title: "KEY",
                                field: "cronKey",
                                width: 140,
                                hozAlign: "left",
                                headerHozAlign: "center",
                                editor: "input",
                                editable: function (cell) {
                                    // 신규 행만 KEY 입력 허용 (규정 04-1.4)
                                    const rowData = cell.getRow().getData();
                                    return !!(rowData.isNew || rowData._isNew);
                                },
                                cellClick: aamsCellEdit,
                                cellEdited: function (cell) {
                                    markRowUpdated(cell);
                                }
                            },
                            {
                                title: "PROC_NAME",
                                field: "procName",
                                width: 220,
                                hozAlign: "left",
                                headerHozAlign: "center",
                                editor: "input",
                                cellClick: aamsCellEdit,
                                cellEdited: function (cell) {
                                    markRowUpdated(cell);
                                }
                            },
                            {
                                title: "상세설명",
                                field: "procComments",
                                minWidth: 240,
                                hozAlign: "left",
                                headerHozAlign: "center",
                                editor: "input",
                                cellClick: aamsCellEdit,
                                cellEdited: function (cell) {
                                    markRowUpdated(cell);
                                }
                            },
                            {
                                title: "최종실행일시",
                                field: "runTime",
                                width: 155,
                                hozAlign: "center",
                                headerHozAlign: "center"
                            },
                            {
                                title: "실행결과",
                                field: "runStatus",
                                width: 95,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                formatter: function (cell) {
                                    const val = (cell.getValue() || "").toString().trim();
                                    if (!val) return "";
                                    const upper = val.toUpperCase();
                                    if (upper.includes("SUCCESS") || upper.includes("정상") || upper === "OK" || upper === "0") {
                                        return `<span class="badge-status-success" style="padding: 2px 6px; font-size: 11px;">${escapeHtml(val)}</span>`;
                                    } else if (upper.includes("FAIL") || upper.includes("ERROR") || upper.includes("오류") || upper.includes("실패")) {
                                        return `<span class="badge-status-error" style="padding: 2px 6px; font-size: 11px;">${escapeHtml(val)}</span>`;
                                    }
                                    return `<span class="cell-text-muted">${escapeHtml(val)}</span>`;
                                }
                            }
                        ]
                    });

                    // 행 선택 삼중 안전망 (규정 05-3 마스터-디테일 연동 표준)
                    if (typeof setupTabulatorRowSelection === 'function') {
                        setupTabulatorRowSelection(gridCronList, function (row, data) {
                            syncDetail(row, data);
                        });
                    }

                    gridCronList.on("rowClick", function (e, row) {
                        syncDetail(row, row ? row.getData() : null);
                    });

                    gridCronList.on("rowSelectionChanged", function (data, rows) {
                        if (rows && rows.length > 0) {
                            syncDetail(rows[0], rows[0].getData());
                        }
                    });
                }

                // 2) 우측: 실행 이력 및 상태 목록 (d_cron_status.srd)
                const elStatus = pane.querySelector('#gridCronStatus');
                if (elStatus) {
                    gridCronStatus = new Tabulator(elStatus, {
                        height: "100%",
                        layout: "fitColumns",
                        selectableRows: 1,
                        placeholder: "선택된 작업의 실행 이력이 없습니다.",
                        columns: [
                            {
                                title: "No.",
                                formatter: "rownum",
                                width: 50,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                headerSort: false
                            },
                            {
                                title: "실행일시",
                                field: "runTime",
                                width: 155,
                                hozAlign: "center",
                                headerHozAlign: "center"
                            },
                            {
                                title: "실행결과",
                                field: "runStatus",
                                width: 95,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                formatter: function (cell) {
                                    const val = (cell.getValue() || "").toString().trim();
                                    if (!val) return "";
                                    const upper = val.toUpperCase();
                                    if (upper.includes("SUCCESS") || upper.includes("정상") || upper === "OK" || upper === "0") {
                                        return `<span class="badge-status-success" style="padding: 2px 6px; font-size: 11px;">${escapeHtml(val)}</span>`;
                                    } else if (upper.includes("FAIL") || upper.includes("ERROR") || upper.includes("오류") || upper.includes("실패")) {
                                        return `<span class="badge-status-error" style="padding: 2px 6px; font-size: 11px;">${escapeHtml(val)}</span>`;
                                    }
                                    return `<span class="cell-text-muted">${escapeHtml(val)}</span>`;
                                }
                            },
                            {
                                title: "RETURN VALUE",
                                field: "outParam",
                                minWidth: 260,
                                hozAlign: "left",
                                headerHozAlign: "center",
                                formatter: function (cell) {
                                    const val = cell.getValue() || "";
                                    return `<span title="${escapeHtml(val)}" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;">${escapeHtml(val)}</span>`;
                                }
                            }
                        ]
                    });

                    if (typeof setupTabulatorRowSelection === 'function') {
                        setupTabulatorRowSelection(gridCronStatus);
                    }
                }
            }

            // 행 수정 마킹 헬퍼
            function markRowUpdated(cell) {
                const row = cell.getRow();
                const d = row.getData();
                if (!d.isNew && !d._isNew) {
                    row.update({ isUpdated: true, rowStatus: 'U' });
                }
            }

            // [연동] 마스터 행 선택 시 상태 목록 및 IN_PARAM 동기화
            function syncDetail(row, masterRowData) {
                if (!row) return;

                // 1) 직전 행의 IN_PARAM 수정사항 저장
                if (currentActiveRow && currentActiveRow !== row) {
                    saveCurrentMleToRow();
                }

                currentActiveRow = row;
                const data = masterRowData || row.getData();
                if (!data) return;

                const cronKey = (data.cronKey || "").trim();

                // 2) 하단 IN_PARAM 에디터에 값 주입
                if (mleInParamEl) {
                    mleInParamEl.value = data.inParam || "";
                }

                // 3) 상단 우측 배지 업데이트
                if (selectedCronKeyBadgeEl) {
                    selectedCronKeyBadgeEl.textContent = cronKey ? `KEY: ${cronKey}` : "전체";
                }

                // 4) 중복 조회 방지 가드 (동일 키인 경우 status 중복 호출 차단)
                if (lastLoadedCronKey === cronKey) return;
                lastLoadedCronKey = cronKey;

                // 5) 우측 실행 상태 이력 비동기 조회
                loadCronStatusList(cronKey);
            }

            // [조회 1] CRON 작업 목록 로드
            function loadCronQList() {
                saveCurrentMleToRow(); // 기존 작성 중 내용 플러시

                fetch('/api/usportfoliomodel/cron-q/list')
                    .then(res => res.json())
                    .then(list => {
                        lastLoadedCronKey = null;
                        currentActiveRow = null;

                        if (mleInParamEl) mleInParamEl.value = "";
                        if (gridCronStatus) gridCronStatus.clearData();
                        if (selectedCronKeyBadgeEl) selectedCronKeyBadgeEl.textContent = "전체";

                        if (gridCronList) {
                            gridCronList.setData(list || []).then(() => {
                                // 첫 번째 행 자동 선택 (규정 05-4 Row Focus 정책)
                                const rows = gridCronList.getRows();
                                if (rows && rows.length > 0) {
                                    rows[0].select();
                                    syncDetail(rows[0], rows[0].getData());
                                }
                            });
                        }
                    })
                    .catch(err => {
                        console.error("CRON 작업 목록 조회 실패:", err);
                        if (typeof showToast === 'function') {
                            showToast("CRON 작업 목록 조회 중 오류가 발생했습니다.", "error");
                        }
                    });
            }

            // [조회 2] CRON 실행 이력 로드
            function loadCronStatusList(cronKey) {
                if (!gridCronStatus) return;
                if (!cronKey) {
                    gridCronStatus.clearData();
                    return;
                }

                fetch('/api/usportfoliomodel/cron-q/status?cronKey=' + encodeURIComponent(cronKey))
                    .then(res => res.json())
                    .then(list => {
                        if (gridCronStatus) {
                            gridCronStatus.setData(list || []);
                        }
                    })
                    .catch(err => {
                        console.error("CRON 상태 이력 조회 실패:", err);
                    });
            }

            // [입력] 새 행 추가
            function addNewRow() {
                if (!gridCronList) return;
                saveCurrentMleToRow(); // 현재 작업 중 텍스트 저장

                const newRowData = {
                    cronKey: "",
                    procName: "",
                    procComments: "",
                    inParam: "",
                    outParam: "",
                    runTime: "",
                    runStatus: "",
                    isNew: true,
                    _isNew: true,
                    isUpdated: false,
                    isDeleted: false,
                    rowStatus: "C"
                };

                gridCronList.addRow(newRowData, false).then(row => {
                    gridCronList.deselectRow();
                    row.select();
                    syncDetail(row, newRowData);

                    // KEY 셀로 원클릭 편집 진입 (PB: POST SetColumn('cron_key'))
                    setTimeout(() => {
                        const cell = row.getCell("cronKey");
                        if (cell) cell.edit(true);
                    }, 50);
                });
            }

            // [삭제] 선택 행 삭제
            function deleteSelectedRow() {
                if (!gridCronList) return;
                const selectedRows = gridCronList.getSelectedRows();
                if (!selectedRows || selectedRows.length === 0) {
                    if (typeof showToast === 'function') showToast("삭제할 행을 선택해주세요.", "warning");
                    return;
                }

                const row = selectedRows[0];
                const data = row.getData();

                if (confirm(`CRON 작업 [${data.cronKey || "신규"}]을(를) 삭제하시겠습니까?`)) {
                    if (data.isNew || data._isNew) {
                        row.delete();
                        currentActiveRow = null;
                        if (mleInParamEl) mleInParamEl.value = "";
                        if (gridCronStatus) gridCronStatus.clearData();
                    } else {
                        row.update({
                            isDeleted: true,
                            rowStatus: "D"
                        });
                        row.getElement().style.display = "none"; // 화면상 숨김
                        currentActiveRow = null;
                        if (mleInParamEl) mleInParamEl.value = "";
                        if (gridCronStatus) gridCronStatus.clearData();
                    }
                    if (typeof showToast === 'function') showToast("삭제 대기 상태로 변경되었습니다. 상단 [저장]을 눌러 반영하세요.", "info");
                }
            }

            // [저장] CUD 일괄 저장
            function saveCronData() {
                if (!gridCronList) return;
                saveCurrentMleToRow(); // 현재 에디터 내용 저장 동기화

                const allData = gridCronList.getData();
                const changedList = [];

                for (let d of allData) {
                    if (d.isNew || d._isNew || d.isUpdated || d.isDeleted || d.rowStatus === "C" || d.rowStatus === "U" || d.rowStatus === "D") {
                        if ((d.isNew || d._isNew) && (!d.cronKey || !d.cronKey.trim())) {
                            if (typeof showToast === 'function') showToast("신규 행의 KEY를 입력해주세요.", "warning");
                            return;
                        }
                        changedList.push(d);
                    }
                }

                if (changedList.length === 0) {
                    if (typeof showToast === 'function') showToast("저장할 변경 내역이 없습니다.", "info");
                    return;
                }

                fetch('/api/usportfoliomodel/cron-q/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(changedList)
                })
                    .then(res => res.json())
                    .then(res => {
                        if (res.success) {
                            if (typeof showToast === 'function') showToast(res.message || "정상적으로 저장되었습니다.", "success");
                            loadCronQList(); // 저장 후 목록 재조회
                        } else {
                            if (typeof showToast === 'function') showToast(res.message || "저장 중 오류가 발생했습니다.", "error");
                        }
                    })
                    .catch(err => {
                        console.error("저장 오류:", err);
                        if (typeof showToast === 'function') showToast("저장 통신 중 오류가 발생했습니다.", "error");
                    });
            }

            // [에디터 보조] Tab 및 Ctrl+방향키 들여쓰기/내어쓰기 바인딩 (w_cron_q.srw key 이벤트 재현)
            function initEditorKeyEvents() {
                if (!mleInParamEl) return;

                mleInParamEl.addEventListener('keydown', function (e) {
                    const TAB_SIZE = 2;
                    const TAB_STR = "  ";

                    // 1) Tab 키 또는 Shift+Tab 키
                    if (e.key === "Tab") {
                        e.preventDefault();
                        const start = this.selectionStart;
                        const end = this.selectionEnd;
                        const val = this.value;

                        if (e.shiftKey) {
                            // 내어쓰기 (Unindent)
                            const lineStart = val.lastIndexOf("\n", start - 1) + 1;
                            if (val.substring(lineStart, lineStart + TAB_SIZE) === TAB_STR) {
                                this.value = val.substring(0, lineStart) + val.substring(lineStart + TAB_SIZE);
                                this.selectionStart = Math.max(lineStart, start - TAB_SIZE);
                                this.selectionEnd = Math.max(lineStart, end - TAB_SIZE);
                            }
                        } else {
                            // 들여쓰기 (Indent)
                            this.value = val.substring(0, start) + TAB_STR + val.substring(end);
                            this.selectionStart = this.selectionEnd = start + TAB_SIZE;
                        }
                        return;
                    }

                    // 2) Ctrl + 오른쪽 화살표: 들여쓰기 (PB: KeyRightArrow!)
                    if (e.ctrlKey && e.key === "ArrowRight") {
                        e.preventDefault();
                        const start = this.selectionStart;
                        const end = this.selectionEnd;
                        const val = this.value;
                        const lineStart = val.lastIndexOf("\n", start - 1) + 1;
                        this.value = val.substring(0, lineStart) + TAB_STR + val.substring(lineStart);
                        this.selectionStart = start + TAB_SIZE;
                        this.selectionEnd = end + TAB_SIZE;
                        return;
                    }

                    // 3) Ctrl + 왼쪽 화살표: 내어쓰기 (PB: KeyLeftArrow!)
                    if (e.ctrlKey && e.key === "ArrowLeft") {
                        e.preventDefault();
                        const start = this.selectionStart;
                        const end = this.selectionEnd;
                        const val = this.value;
                        const lineStart = val.lastIndexOf("\n", start - 1) + 1;
                        if (val.substring(lineStart, lineStart + TAB_SIZE) === TAB_STR) {
                            this.value = val.substring(0, lineStart) + val.substring(lineStart + TAB_SIZE);
                            this.selectionStart = Math.max(lineStart, start - TAB_SIZE);
                            this.selectionEnd = Math.max(lineStart, end - TAB_SIZE);
                        }
                    }
                });

                // 복사 버튼
                const btnCopy = pane.querySelector('#btnCopyInParam');
                if (btnCopy) {
                    btnCopy.onclick = function () {
                        if (!mleInParamEl.value) {
                            if (typeof showToast === 'function') showToast("복사할 내용이 없습니다.", "warning");
                            return;
                        }
                        navigator.clipboard.writeText(mleInParamEl.value)
                            .then(() => {
                                if (typeof showToast === 'function') showToast("IN_PARAM 내용이 클립보드에 복사되었습니다.", "success");
                            })
                            .catch(() => {
                                mleInParamEl.select();
                                document.execCommand('copy');
                                if (typeof showToast === 'function') showToast("IN_PARAM 내용이 복사되었습니다.", "success");
                            });
                    };
                }

                // JSON 자동 정렬 버튼
                const btnFormat = pane.querySelector('#btnFormatJsonInParam');
                if (btnFormat) {
                    btnFormat.onclick = function () {
                        const raw = (mleInParamEl.value || "").trim();
                        if (!raw) return;
                        try {
                            const parsed = JSON.parse(raw);
                            mleInParamEl.value = JSON.stringify(parsed, null, 2);
                            saveCurrentMleToRow();
                            if (typeof showToast === 'function') showToast("JSON 형식이 깔끔하게 정렬되었습니다.", "success");
                        } catch (e) {
                            if (typeof showToast === 'function') showToast("유효한 JSON 형식이 아닙니다.", "warning");
                        }
                    };
                }
            }

            // [초기화 2] 스플리터 초기화
            function initSplitters() {
                if (window.AamsSplitter && typeof window.AamsSplitter.init === 'function') {
                    window.AamsSplitter.init(pane);
                    setTimeout(() => {
                        if (window.AamsSplitter) window.AamsSplitter.init(pane);
                    }, 50);
                }
            }

            // [초기화 3] 상단 공통 툴바 표준 계약 바인딩 (규정 08-1)
            function initToolbar() {
                pane.onSearch = function () {
                    loadCronQList();
                };

                pane.onInput = function () {
                    addNewRow();
                };

                pane.onDelete = function () {
                    deleteSelectedRow();
                };

                pane.onSave = function () {
                    saveCronData();
                };

                pane.onRefresh = function () {
                    if (gridCronList) gridCronList.clearData();
                    if (gridCronStatus) gridCronStatus.clearData();
                    if (mleInParamEl) mleInParamEl.value = "";
                    if (selectedCronKeyBadgeEl) selectedCronKeyBadgeEl.textContent = "전체";

                    lastLoadedCronKey = null;
                    currentActiveRow = null;

                    if (typeof showToast === 'function') showToast("화면이 초기화되었습니다.", "info");
                };

                pane.onCorpGrChange = function (newCorpGr) {
                    // 수동 조회 단일 정책 (규정 08-2)
                };

                pane.onExcel = function () {
                    if (gridCronList) {
                        gridCronList.download("xlsx", "CRON작업목록.xlsx", { sheetName: "CRON_Q" });
                    }
                };
            }

            // [단일 진입점 실행] (규정 10-1 Single Entry-Point Pattern)
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                initGrids();
                initEditorKeyEvents();
                initSplitters();
                initToolbar();

                // 파워빌더 소스: boolean eb_direct_retrieve = true (화면 열림 시 즉시 자동 조회 1회 실행)
                loadCronQList();
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", startInit);
            } else {
                startInit();
            }
        })();
    </script>
</div>
</html>

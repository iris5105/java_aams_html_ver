<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
    W_JA035B: 해외주식 PORT 매매관리 (사무관리 > US Portfolio Model > USPM)
    DataWindow:
      - dw_c: dc_ymd_dddw_xx (영업일자, 거래코드, 펀드코드)
      - dw_list: d_ja035b (해외주식 매매내역)
-->
<div class="view-container layout-single ja035b-container layout-mobile-stack-container" th:fragment="ja035bView" style="display: flex; flex-direction: column; height: 100%; width: 100%; overflow: hidden; background: #fff; position: relative;">
    <style>
        .ja035b-container .tabulator .tabulator-footer,
        .ja035b-container .tabulator .tabulator-footer .tabulator-calcs-holder,
        .ja035b-container .tabulator .tabulator-footer .tabulator-calcs-holder .tabulator-row,
        .ja035b-container .tabulator .tabulator-footer .tabulator-calcs-holder .tabulator-cell {
            background-color: #fbf2c4 !important;
            color: #1e293b !important;
            font-weight: 600 !important;
        }
        .ja035b-container .tabulator .tabulator-footer {
            border-top: 1px solid #cbd5e1 !important;
            padding: 0 !important;
            overflow: hidden !important;
        }
        .ja035b-container .tabulator .tabulator-footer .tabulator-calcs-holder {
            border: none !important;
            overflow: hidden !important;
        }
        .ja035b-container .tabulator .tabulator-footer .tabulator-calcs-holder .tabulator-row,
        .ja035b-container .tabulator .tabulator-footer .tabulator-calcs-holder .tabulator-cell {
            height: 28px !important;
            min-height: 28px !important;
        }
        .ja035b-container .tabulator .tabulator-footer .tabulator-calcs-holder .tabulator-cell {
            line-height: 20px !important;
            border-right: 1px solid #e2e8f0 !important;
        }
        .ja035b-container .tabulator .tabulator-footer .cell-text-blue {
            color: #1d4ed8 !important;
            font-weight: 700 !important;
        }
        .ja035b-container .tabulator .tabulator-footer .tabulator-calcs-holder,
        .ja035b-container .tabulator .tabulator-footer .tabulator-calcs-holder .tabulator-row,
        .ja035b-container .tabulator .tabulator-footer .tabulator-calcs-holder .tabulator-cell {
            pointer-events: none !important;
            user-select: none !important;
            cursor: default !important;
        }
    </style>

    <!-- 1. Top Action Control Bar -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- 2. Sub Filter Bar: dc_ymd_dddw_xx fragment matching dw_c in w_ja035b.srw (영업일자, 거래코드, 펀드코드) -->
    <div class="filter-bar">
        <div class="filter-left">
            <div th:replace="~{fragments/filter/dc_ymd_dddw_xx :: filter(labelYmd='영업일자', labelDddw='거래코드', labelXx='펀드코드', columnNm='rcd', seq=4)}"></div>
            <input type="file" id="excelFileInput" accept=".xlsx, .xls" style="display: none;" />
            <button type="button" class="t-btn btn-action" id="btnLoadExcel" title="매매내역 엑셀파일 업로드">
                <i class="fa-solid fa-file-excel"></i> 엑셀LOAD
            </button>
        </div>
    </div>

    <!-- 3. 메인 그리드 섹션 (단일 그리드 wt_list 표준 구조) -->
    <section class="grid-section" aria-label="해외주식 매매내역 목록">
        <div class="grid-table-wrapper">
            <div id="gridJa035b" class="tabulator-aams-grid"></div>
        </div>
    </section>

    <script th:inline="javascript">
    (function () {
        var currentScript = document.currentScript;
        var currentPane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;
        if (!currentPane) currentPane = document.querySelector('.tab-pane.active') || document;

        var isInitialized = false;
        var gridList = null;
        var gridBuilt = false;
        function calcNormalSum(values, data, params) {
            return (data || []).reduce(function (sum, row) {
                return row.isDeleted ? sum : sum + (Number(row[params.field]) || 0);
            }, 0);
        }
        function formatFooterNumber(cell, decimals) {
            var value = Number(cell.getValue()) || 0;
            var formatted = value.toLocaleString('ko-KR', {
                minimumFractionDigits: decimals,
                maximumFractionDigits: decimals
            });
            return '<span class="cell-text-blue font-bold">' + formatted + '</span>';
        }
        function updateFooterVisibility() {
            if (!gridList) return;
            var footer = gridList.element.querySelector('.tabulator-footer');
            if (footer) {
                footer.style.display = gridList.getData().some(function (row) { return !row.isDeleted; })
                    ? 'block' : 'none';
            }
        }
        function recalcSummaryRow() {
            if (!gridList) return;
            gridList.recalc();
            updateFooterVisibility();
        }
        var curMaxTrSeq = 0;
        var codeSearchInstance = null;

        // 파워빌더 dw_list::ue_dddw_retrieve 연동 DDDW 옵션 캐시
        const dddwOptionsMap = {
            trustee: [],
            currency: [],
            gyulje_jm_cd: []
        };

        // 1. Initialize Dynamic Code Search (u_dynamiccodesearch: rcd seq 4, w_ja035b.srw ue_setcodesearch)
        function initCodeSearch(retryCount) {
            retryCount = retryCount || 0;
            if (window.DynamicCodeSearch && typeof window.DynamicCodeSearch.bind === "function") {
                codeSearchInstance = window.DynamicCodeSearch.bind({
                    inputEl: "#filterXx",
                    btnEl: "#btnCodeSearchXx",
                    textEl: "#textXxName",
                    columnNm: "rcd",
                    seq: 4,
                    pane: currentPane,
                    getCorpGr: function () {
                        return window.resolveCorpGr ? window.resolveCorpGr(currentPane) : "";
                    },
                    addWhere: function () {
                        // 파워빌더 w_ja035b.srw dw_c::ue_setcodesearch:
                        // rs_Where = "nvl(HAEJI_YMD, '" + string (dw_c.object.ymd [1],'yyyy.mm.dd') + "') >= '" + string (idt_workdate,'yyyy.mm.dd') + "'"
                        var ymd = window.getFilterYmd ? window.getFilterYmd(currentPane, 'YYYY.MM.DD') : "";
                        return "nvl(HAEJI_YMD, '" + ymd + "') >= '" + ymd + "'";
                    },
                    onSelect: function (code, name, rowData) {
                        // 펀드코드 선택 완료 시
                    }
                });
            } else if (retryCount < 20) {
                setTimeout(function () {
                    initCodeSearch(retryCount + 1);
                }, 50);
            }
        }

        // 2. 상단 거래코드 DDDW 초기화 (w_ja035b.srw dw_c::ue_dddw_retrieve)
        // F_DDDWCTL (THIS, 'dddw', gaa.corp_gr, '', 1, "szx1pt.obj_id='W_JA035B'")
        function initFilterTrCdDddw() {
            var corpGr = window.resolveCorpGr ? window.resolveCorpGr(currentPane) : "";
            if (typeof window.initFilterDddw === 'function') {
                return window.initFilterDddw(currentPane, {
                    selectId: 'filterDddw',
                    dddwId: 'dddw',
                    corpGr: corpGr,
                    seq: 1,
                    addWhere: "szx1pt.obj_id='W_JA035B'",
                    codeTitle: '코드',
                    nameTitle: '거래구분',
                    defaultVal: 'J20',
                    defaultOptions: [
                        { code: 'J20', name: 'J20 매수' },
                        { code: 'K20', name: 'K20 매도' }
                    ]
                });
            }
            return Promise.resolve([]);
        }

        /**
         * PowerBuilder dw_list::ue_dddw_retrieve Event Integration
         * Corresponds to dw_list::ue_dddw_retrieve in w_ja035b.srw:
         *   1. F_DDDWCTL (THIS, 'trustee' , gaa.corp_gr, '', 1, "")
         *   2. F_DDDWCTL (THIS, 'currency', gaa.corp_gr, '', 1, "")
         *   3. F_DDDWCTL (THIS, 'gyulje_jm_cd', gaa.corp_gr, '', 1, "")
         */
        function ue_dddw_retrieve(corpGr) {
            var targetCorpGr = corpGr || (window.resolveCorpGr ? window.resolveCorpGr(currentPane) : "");

            return f_dddwctl.retrieveMultiple({
                trustee:      ['trustee', targetCorpGr, '', 1, ''],
                currency:     ['currency', targetCorpGr, '', 1, ''],
                gyulje_jm_cd: ['gyulje_jm_cd', targetCorpGr, '', 1, '']
            }).then(function (results) {
                dddwOptionsMap.trustee = results.trustee || [];
                dddwOptionsMap.currency = results.currency || [];
                dddwOptionsMap.gyulje_jm_cd = results.gyulje_jm_cd || [];

                if (gridList && gridBuilt) {
                    gridList.getRows().forEach(function (row) { row.reformat(); });
                    gridList.redraw(true);
                }
            }).catch(function (err) {
                console.warn('[Ja035b] Grid DDDW retrieve warning:', err);
            });
        }

        function getDddwLabel(dddwKey, codeVal) {
            return f_dddwctl.getLabel(dddwOptionsMap, dddwKey, codeVal);
        }

        function getDddwOptions(dddwKey) {
            return f_dddwctl.getOptions(dddwOptionsMap, dddwKey);
        }

        function markRowUpdated(cell) {
            if (!cell) return;
            var row = cell.getRow();
            var data = row.getData();
            if (data && data.isSummaryRow) return;
            if (data) {
                if (!data.isNew) {
                    data.isUpdated = true;
                    data.rowStatus = "U";
                }
            }
            setTimeout(recalcSummaryRow, 0);
        }

        // ==========================================
        // 4. 그리드 초기화 (d_ja035b)
        // ==========================================
        function initGrid() {
            var gridEl = currentPane.querySelector('#gridJa035b');
            if (!gridEl) return;

            gridList = new Tabulator(gridEl, {
                height: "100%",
                layout: "fitDataFill",
                selectableRows: 1,
                editTriggerEvent: "click",
                headerSort: false,
                placeholder: "조회된 내역이 없습니다.",
                rowFormatter: function (row) {
                    if (row.getData().isSummaryRow) row.getElement().classList.add('aams-summary-row');
                },
                columns: [
                    {
                        title: "No.", headerSort: false,
                        field: "fseq",
                        width: 45,
                        hozAlign: "center",
                        resizable: false,
                        formatter: function (cell) {
                            if (cell.getRow().getData().isSummaryRow) return '';
                            var row = cell.getRow();
                            return row.getPosition(true) || (row.getIndex() + 1);
                        }
                    },
                    {
                        title: "펀드번호",
                        field: "fundCd",
                        width: 95,
                        hozAlign: "center",
                        headerCssClass: "col-hdr-green",
                        editor: "input",
                        editable: function (cell) { return !cell.getRow().getData().isSummaryRow; },
                        cellClick: window.aamsCellEdit,
                        cellEdited: function (cell) {
                            markRowUpdated(cell);
                            onFundCdEdited(cell);
                        },
                        formatter: function (cell) {
                            var val = cell.getValue();
                            if (val == null || val === '') return '';
                            return '<span class="cell-text-green font-bold">' + val + '</span>';
                        }
                    },
                    {
                        title: "",
                        field: "p_xx_fund_cd",
                        width: 36,
                        minWidth: 36,
                        maxWidth: 36,
                        hozAlign: "center",
                        headerSort: false,
                        resizable: false,
                        formatter: function (cell) {
                            var data = cell.getRow().getData();
                            if (data.isSummaryRow) return '';
                            var isEnabled = (data.pVisible !== 0 && !data.isDeleted);
                            var disClass = isEnabled ? "" : "disabled";
                            return '<button type="button" class="btn-grid-addon btn-search ' + disClass + '" title="펀드코드 검색"><i class="fa-solid fa-magnifying-glass"></i></button>';
                        },
                        cellClick: function (e, cell) {
                            e.stopPropagation();
                            var row = cell.getRow();
                            var data = row.getData();
                            if (data.isSummaryRow || (window.isAamsSummaryRow && window.isAamsSummaryRow(row))) return;
                            if (data.pVisible === 0 || data.isDeleted) {
                                if (gridList) { gridList.deselectRow(); row.select(); }
                                return;
                            }
                            var curVal = data.fundCd || "";
                            var corpGr = window.resolveCorpGr ? window.resolveCorpGr(currentPane) : "";
                            var ymd = window.getFilterYmd ? window.getFilterYmd(currentPane, 'YYYY.MM.DD') : "";
                            var addWhere = "nvl(HAEJI_YMD, '" + ymd + "') >= '" + ymd + "'";

                            if (window.DynamicCodeSearch && typeof window.DynamicCodeSearch.openModal === 'function') {
                                window.DynamicCodeSearch.openModal({
                                    title: "펀드코드 검색",
                                    columnNm: "rcd",
                                    seq: 4,
                                    corpGr: corpGr,
                                    initialKeyword: curVal,
                                    addWhere: addWhere,
                                    onSelect: function (code, name) {
                                        row.update({ fundCd: code, xxFundCd: name, fundNm: name });
                                        propagateFundCd(row, code, name);
                                        markRowUpdated(cell);
                                    }
                                });
                            }
                        }
                    },
                    {
                        title: "펀드명",
                        field: "xxFundCd",
                        width: 140,
                        hozAlign: "left",
                        bottomCalc: function (values, data) { return data.some(function (row) { return !row.isDeleted; }) ? '합계' : ''; },
                        bottomCalcFormatter: function (cell) {
                            return '<div style="text-align:center; font-weight:bold; width:100%;">' + (cell.getValue() || '') + '</div>';
                        }
                    },
                    {
                        title: "해외보관처",
                        field: "trustee",
                        width: 110,
                        hozAlign: "center",
                        editor: "list",
                        editable: function (cell) { return !cell.getRow().getData().isSummaryRow; },
                        editorParams: {
                            valuesLookup: function () {
                                return getDddwOptions('trustee');
                            },
                            autocomplete: false,
                            clearable: true,
                            itemFormatter: window.f_dddwctl && typeof window.f_dddwctl.get2ColItemFormatter === 'function'
                                ? window.f_dddwctl.get2ColItemFormatter('코드', '보관처명')
                                : null
                        },
                        cellClick: window.aamsCellEdit,
                        cellEdited: function (cell) {
                            markRowUpdated(cell);
                            onTrusteeEdited(cell);
                        },
                        formatter: function (cell) {
                            var val = (cell.getValue() || "").toString().trim();
                            if (!val) return "";
                            return '<span class="cell-text-blue font-bold">' + getDddwLabel('trustee', val) + '</span>';
                        }
                    },
                    {
                        title: "종목",
                        field: "yjCd",
                        width: 100,
                        hozAlign: "center",
                        headerCssClass: "col-hdr-blue",
                        editor: "input",
                        editable: function (cell) { return !cell.getRow().getData().isSummaryRow; },
                        cellClick: window.aamsCellEdit,
                        cellEdited: function (cell) {
                            markRowUpdated(cell);
                            onYjCdEdited(cell);
                        },
                        formatter: function (cell) {
                            var val = cell.getValue();
                            if (val == null || val === '') return '';
                            return '<span class="cell-text-blue font-bold">' + val + '</span>';
                        }
                    },
                    {
                        title: "",
                        field: "p_xx_yjCd",
                        width: 36,
                        minWidth: 36,
                        maxWidth: 36,
                        hozAlign: "center",
                        headerSort: false,
                        resizable: false,
                        formatter: function (cell) {
                            var data = cell.getRow().getData();
                            if (data.isSummaryRow) return '';
                            var isEnabled = (data.pVisible !== 0 && !data.isDeleted);
                            var disClass = isEnabled ? "" : "disabled";
                            return '<button type="button" class="btn-grid-addon btn-search ' + disClass + '" title="종목 검색"><i class="fa-solid fa-magnifying-glass"></i></button>';
                        },
                        cellClick: function (e, cell) {
                            e.stopPropagation();
                            var row = cell.getRow();
                            var data = row.getData();
                            if (data.isSummaryRow || (window.isAamsSummaryRow && window.isAamsSummaryRow(row))) return;
                            if (data.pVisible === 0 || data.isDeleted) {
                                if (gridList) { gridList.deselectRow(); row.select(); }
                                return;
                            }
                            var curVal = data.yjCd || "";
                            var corpGr = window.resolveCorpGr ? window.resolveCorpGr(currentPane) : "";
                            var ymd = window.getFilterYmd ? window.getFilterYmd(currentPane) : "";

                            if (window.DynamicCodeSearch && typeof window.DynamicCodeSearch.openModal === 'function') {
                                window.DynamicCodeSearch.openModal({
                                    title: "해외주식 종목 검색",
                                    columnNm: "yj_cd",
                                    seq: 1,
                                    corpGr: corpGr,
                                    initialKeyword: curVal,
                                    onSelect: function (code, name, rowData) {
                                        var cur = (rowData && rowData.currency) ? rowData.currency : (data.currency || 'USD');
                                        row.update({
                                            yjCd: code,
                                            xxYjCd: name,
                                            jmNm: name,
                                            currency: cur
                                        });
                                        loadCurrencyRate(row, cur, ymd, corpGr);
                                        markRowUpdated(cell);
                                        recalcRow(row);
                                    }
                                });
                            }
                        }
                    },
                    {
                        title: "종목명칭",
                        field: "xxYjCd",
                        width: 160,
                        hozAlign: "left",
                        headerSort: false
                    },
                    { title: "통화", field: "currency", width: 80, hozAlign: "center",
                        formatter: function (cell) { return getDddwLabel('currency', cell.getValue()) || cell.getValue() || ''; } },
                    {
                        title: "주수/액면가",
                        field: "trJusu",
                        width: 100,
                        hozAlign: "right",
                        headerSort: false,
                        editor: "input",
                        editable: function (cell) { return !cell.getRow().getData().isSummaryRow; },
                        cellClick: window.aamsCellEdit,
                        cellEdited: function (cell) {
                            markRowUpdated(cell);
                            recalcRow(cell.getRow());
                        },
                        formatter: function (cell) {
                            var val = cell.getValue();
                            if (val == null || val === '') return '';
                            return window.formatNumber ? window.formatNumber(val, 2) : Number(val).toFixed(2);
                        },
                        bottomCalc: calcNormalSum,
                        bottomCalcParams: { field: 'trJusu' },
                        bottomCalcFormatter: function (cell) { return formatFooterNumber(cell, 2); }
                    },
                    {
                        title: "매매단가",
                        field: "trDanga",
                        width: 100,
                        hozAlign: "right",
                        headerSort: false,
                        editor: "input",
                        editable: function (cell) { return !cell.getRow().getData().isSummaryRow; },
                        cellClick: window.aamsCellEdit,
                        cellEdited: function (cell) {
                            markRowUpdated(cell);
                            recalcRow(cell.getRow());
                        },
                        formatter: function (cell) {
                            var val = cell.getValue();
                            if (val == null || val === '') return '';
                            return window.formatNumber ? window.formatNumber(val, 2) : Number(val).toFixed(2);
                        }
                    },
                    {
                        title: "거래비용",
                        field: "trCost",
                        width: 90,
                        hozAlign: "right",
                        headerSort: false,
                        editor: "input",
                        editable: function (cell) { return !cell.getRow().getData().isSummaryRow; },
                        cellClick: window.aamsCellEdit,
                        cellEdited: function (cell) {
                            markRowUpdated(cell);
                            recalcRow(cell.getRow());
                        },
                        formatter: function (cell) {
                            var val = cell.getValue();
                            return (val == null || val === '') ? '0.00' : (window.formatNumber ? window.formatNumber(val, 2) : Number(val).toFixed(2));
                        },
                        bottomCalc: calcNormalSum,
                        bottomCalcParams: { field: 'trCost' },
                        bottomCalcFormatter: function (cell) { return formatFooterNumber(cell, 2); }
                    },
                    {
                        title: "세금",
                        field: "trTax",
                        width: 90,
                        hozAlign: "right",
                        headerSort: false,
                        editor: "input",
                        editable: function (cell) { return !cell.getRow().getData().isSummaryRow; },
                        cellClick: window.aamsCellEdit,
                        cellEdited: function (cell) {
                            markRowUpdated(cell);
                            recalcRow(cell.getRow());
                        },
                        formatter: function (cell) {
                            var val = cell.getValue();
                            return (val == null || val === '') ? '0.00' : (window.formatNumber ? window.formatNumber(val, 2) : Number(val).toFixed(2));
                        },
                        bottomCalc: calcNormalSum,
                        bottomCalcParams: { field: 'trTax' },
                        bottomCalcFormatter: function (cell) { return formatFooterNumber(cell, 2); }
                    },
                    {
                        title: "매매금액",
                        field: "trAek",
                        width: 110,
                        hozAlign: "right",
                        headerSort: false,
                        formatter: function (cell) {
                            var val = cell.getValue();
                            return (val == null || val === '') ? '0.00' : (window.formatNumber ? window.formatNumber(val, 2) : Number(val).toFixed(2));
                        },
                        bottomCalc: calcNormalSum,
                        bottomCalcParams: { field: 'trAek' },
                        bottomCalcFormatter: function (cell) { return formatFooterNumber(cell, 2); }
                    },
                    {
                        title: "결제일자",
                        field: "gyuljeYmd",
                        width: 100,
                        hozAlign: "center",
                        headerSort: false,
                        editor: window.aamsDateEditor || "input",
                        editable: function (cell) { return !cell.getRow().getData().isSummaryRow; },
                        editorParams: { separator: "-" },
                        cellClick: window.aamsCellEdit,
                        cellEdited: function (cell) {
                            if (typeof window.aamsValidateDateCell === 'function') {
                                window.aamsValidateDateCell(cell, function (c) {
                                    markRowUpdated(c);
                                });
                            } else {
                                markRowUpdated(cell);
                            }
                        }
                    },
                    {
                        title: "",
                        field: "p_dd_gyulje_ymd",
                        width: 36,
                        minWidth: 36,
                        maxWidth: 36,
                        hozAlign: "center",
                        headerSort: false,
                        resizable: false,
                        formatter: function (cell) {
                            if (cell.getRow().getData().isSummaryRow) return '';
                            return '<button type="button" class="btn-grid-addon btn-cal" title="결제일자 선택"><i class="fa-regular fa-calendar-days"></i></button>';
                        },
                        cellClick: function (e, cell) {
                            e.stopPropagation();
                            var row = cell.getRow();
                            if (row.getData().isSummaryRow || (window.isAamsSummaryRow && window.isAamsSummaryRow(row))) return;
                            var curVal = row.getData().gyuljeYmd || "";
                            if (window.AamsCalendar && typeof window.AamsCalendar.openDatePicker === 'function') {
                                window.AamsCalendar.openDatePicker({
                                    anchorEl: cell.getElement(),
                                    initialYmd: curVal,
                                    format: 'dash',
                                    onSelect: function (selectedYmd) {
                                        row.update({ gyuljeYmd: selectedYmd });
                                        markRowUpdated(cell);
                                    }
                                });
                            }
                        }
                    },
                    {
                        title: "결제금액",
                        field: "gyuljeAek",
                        width: 110,
                        hozAlign: "right",
                        headerSort: false,
                        formatter: function (cell) {
                            var val = cell.getValue();
                            return (val == null || val === '') ? '0.00' : (window.formatNumber ? window.formatNumber(val, 2) : Number(val).toFixed(2));
                        },
                        bottomCalc: calcNormalSum,
                        bottomCalcParams: { field: 'gyuljeAek' },
                        bottomCalcFormatter: function (cell) { return formatFooterNumber(cell, 2); }
                    },
                    {
                        title: "적용환율",
                        field: "transRt",
                        width: 90,
                        hozAlign: "right",
                        headerSort: false,
                        editor: "input",

        // ==========================================
        // 7. 셀 변경 핸들러
        // ==========================================
        function onFundCdEdited(cell) {
            var row = cell.getRow();
            var val = (cell.getValue() || "").trim();
            var corpGr = window.resolveCorpGr ? window.resolveCorpGr(currentPane) : "";
            if (!val) {
                row.update({ xxFundCd: "", fundNm: "" });
                return;
            }

            var ymd = window.getFilterYmd ? window.getFilterYmd(currentPane, 'YYYY.MM.DD') : "";
            var addWhere = "nvl(HAEJI_YMD, '" + ymd + "') >= '" + ymd + "'";

            fetch('/api/common/code-search/get?columnNm=rcd&seq=4&corpGr=' + encodeURIComponent(corpGr) + '&code=' + encodeURIComponent(val) + '&addWhere=' + encodeURIComponent(addWhere))
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    if (data && data.code) {
                        row.update({
                            fundCd: data.code,
                            xxFundCd: data.codeName || data.name || '',
                            fundNm: data.codeName || data.name || ''
                        });
                        propagateFundCd(row, data.code, data.codeName || data.name || '');
                    } else {
                        openFundSearchModal(row);
                    }
                })
                .catch(function () {
                    openFundSearchModal(row);
                });
        }

        function propagateFundCd(currentRow, newFundCd, newFundNm) {
            if (!gridList) return;
            var rows = gridList.getRows();
            var startIdx = currentRow.getIndex();
            for (var i = startIdx + 1; i < rows.length; i++) {
                var r = rows[i];
                var d = r.getData();
                if (d) {
                    if (!d.fundCd || d.fundCd === '') {
                        r.update({ fundCd: newFundCd, xxFundCd: newFundNm, fundNm: newFundNm });
                        markRowUpdated(r.getCell("fundCd"));
                    }
                }
            }
        }

        function onTrusteeEdited(cell) {
            var row = cell.getRow();
            var val = (cell.getValue() || "").trim();
            var corpGr = window.resolveCorpGr ? window.resolveCorpGr(currentPane) : "";
            var ymd = window.getFilterYmd ? window.getFilterYmd(currentPane) : "";

            if (!val) return;

            fetch('/api/usportfoliomodel/ja035b/trustee-currency?corpGr=' + encodeURIComponent(corpGr) + '&trustee=' + encodeURIComponent(val))
                .then(function (res) { return res.json(); })
                .then(function (resData) {
                    var cur = resData.currency || 'USD';
                    row.update({ currency: cur });
                    loadCurrencyRate(row, cur, ymd, corpGr);
                })

                    console.warn('[Ja035b] Trustee currency warning:', err);

        function onCurrencyEdited(cell) {
            var row = cell.getRow();
            var cur = (cell.getValue() || "").trim();
            var corpGr = window.resolveCorpGr ? window.resolveCorpGr(currentPane) : "";
            var ymd = window.getFilterYmd ? window.getFilterYmd(currentPane) : "";
            if (!cur) return;
            loadCurrencyRate(row, cur, ymd, corpGr);
        }

        function loadCurrencyRate(row, currency, ymd, corpGr) {
            if (!currency || !ymd) return;
            fetch('/api/usportfoliomodel/ja035b/currency-rate?corpGr=' + encodeURIComponent(corpGr) + '&ymd=' + encodeURIComponent(ymd) + '&currency=' + encodeURIComponent(currency))
                .then(function (res) { return res.json(); })
                .then(function (rate) {
                    if (rate != null && rate !== -1) {
                        row.update({ transRt: rate });
                        recalcRow(row);
                    }
                })
                .catch(function (err) {
                    console.warn('[Ja035b] Currency rate warning:', err);
                });
        }

        // ==========================================
        // 행 자동 계산
        // ==========================================
        function recalcRow(row) {
            if (!row) return;
            var d = row.getData();
            if (!d) return;

            var jusu = parseFloat(d.trJusu) || 0;
            var danga = parseFloat(d.trDanga) || 0;
            var tax = parseFloat(d.trTax) || 0;
            var cost = parseFloat(d.trCost) || 0;
            var transRt = parseFloat(d.transRt) || 0;
            var trCd = d.trCd || getSelectedTrCd();

            var trAek = Math.round((jusu * danga) * 100) / 100;
            var gyuljeAek = (trCd === 'K20') ? (trAek - (tax + cost)) : (trAek + (tax + cost));
            gyuljeAek = Math.round(gyuljeAek * 100) / 100;
            var wonGyuljeAek = Math.floor(gyuljeAek * transRt);

            row.update({
                trAek: trAek,
                gyuljeAek: gyuljeAek,
                wonGyuljeAek: wonGyuljeAek
            });
        }

        function onYjCdEdited(cell) {
            var row = cell.getRow();
            var val = (cell.getValue() || "").trim();
            var corpGr = window.resolveCorpGr ? window.resolveCorpGr(currentPane) : "";
            if (!val) {
                row.update({ xxYjCd: "", jmNm: "" });
                return;
            }

            fetch('/api/usportfoliomodel/ja035b/item-info?corpGr=' + encodeURIComponent(corpGr) + '&jmCd=' + encodeURIComponent(val))
                .then(function (res) { return res.json(); })
                .then(function (info) {
                    if (info && info.yj_cd) {
                        var cur = info.currency || row.getData().currency || 'USD';
                        row.update({
                            yjCd: info.yj_cd,
                            xxYjCd: info.xx_yj_cd || '',
                            jmNm: info.xx_yj_cd || '',
                            currency: cur
                        });
                        var ymd = window.getFilterYmd ? window.getFilterYmd(currentPane) : "";
                        loadCurrencyRate(row, cur, ymd, corpGr);
                        recalcRow(row);
                    } else {
                        openItemSearchModal(row, val);
                    }
                })
                .catch(function () {
                    openItemSearchModal(row, val);
                });
        }

        function openFundSearchModal(rowOrCell, keyword) {
            var row = (rowOrCell && rowOrCell.getRow) ? rowOrCell.getRow() : rowOrCell;
            if (!row) return;
            var curVal = (keyword !== undefined && keyword !== null) ? keyword : ((row.getData && row.getData().fundCd) || "");
            var corpGr = window.resolveCorpGr ? window.resolveCorpGr(currentPane) : "";
            var ymd = window.getFilterYmd ? window.getFilterYmd(currentPane, 'YYYY.MM.DD') : "";
            var addWhere = "nvl(HAEJI_YMD, '" + ymd + "') >= '" + ymd + "'";

            if (window.DynamicCodeSearch && typeof window.DynamicCodeSearch.openModal === 'function') {
                window.DynamicCodeSearch.openModal({
                    title: "펀드코드 검색",
                    columnNm: "rcd",
                    seq: 4,
                    corpGr: corpGr,
                    initialKeyword: curVal,
                    addWhere: addWhere,
                    onSelect: function (code, name, rowData) {
                        if (!row) return;
                        row.update({
                            fundCd: code,
                            xxFundCd: name,
                            fundNm: name,
                            isUpdated: true
                        });
                        propagateFundCd(row, code, name);
                        var cell = row.getCell ? row.getCell("fundCd") : null;

        function openItemSearchModal(rowOrCell, keyword) {
            var row = (rowOrCell && rowOrCell.getRow) ? rowOrCell.getRow() : rowOrCell;
            if (!row) return;
            var curVal = (keyword !== undefined && keyword !== null) ? keyword : ((row.getData && row.getData().yjCd) || "");
            var corpGr = window.resolveCorpGr ? window.resolveCorpGr(currentPane) : "";
            var ymd = window.getFilterYmd ? window.getFilterYmd(currentPane) : "";

            if (window.DynamicCodeSearch && typeof window.DynamicCodeSearch.openModal === 'function') {
                window.DynamicCodeSearch.openModal({

                    seq: 1,
                    corpGr: corpGr,
                    initialKeyword: curVal,
                    onSelect: function (code, name, rowData) {
                        if (!row) return;

                        row.update({
                            yjCd: code,
                            xxYjCd: name,
                            jmNm: name,
                            currency: cur,

                        });
                        loadCurrencyRate(row, cur, ymd, corpGr);

        // ==========================================
        // 8. 데이터 로드 (Master Load)
        // ==========================================
        function loadMasterData() {
            var corpGr = window.resolveCorpGr ? window.resolveCorpGr(currentPane) : "";
            var ymd = window.getFilterYmd ? window.getFilterYmd(currentPane) : "";
            var trCd = getSelectedTrCd();
            var fundCdInput = currentPane.querySelector('#filterXx');
            var fundCd = fundCdInput ? (fundCdInput.value || '').trim() : '';

            if (!ymd) {
                if (typeof window.showToast === 'function') window.showToast("조회 기준일자를 선택해주세요.", "warning");
                return;
            }

            var url = '/api/usportfoliomodel/ja035b/list?corpGr=' + encodeURIComponent(corpGr)
                    + '&ymd=' + encodeURIComponent(ymd)
                    + '&trCd=' + encodeURIComponent(trCd)
                    + '&fundCd=' + encodeURIComponent(fundCd);

            fetch(url)
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    var list = Array.isArray(data) ? data : [];

                    curMaxTrSeq = 0;
                    list.forEach(function (d) {
                        if (d.trSeq && Number(d.trSeq) > curMaxTrSeq) {
                            curMaxTrSeq = Number(d.trSeq);
                        }
                    });

                    // 파워빌더 dw_list::retrieveend: 매도(K20)이고 펀드코드가 지정되어 있는데 내역이 0건이면 잔고를 로드
                    if (list.length === 0 && trCd === 'K20' && fundCd) {
                        loadBalanceData(corpGr, ymd, fundCd);
                        return;
                    }

                    if (gridList) {
                        gridList.setData(list).then(function () {
                            updateFooterVisibility();
                            var rows = gridList.getRows();
                            if (rows.length > 0) {
                                rows[0].select();
                            }
                        });
                    }
                })
                .catch(function (err) {
                    console.error('[Ja035b] Load data error:', err);
                    if (typeof window.showToast === 'function') window.showToast("조회 중 오류가 발생했습니다.", "error");
                });
        }

        // 매도 시 잔고 조회 (SYM0YZ)
        function loadBalanceData(corpGr, ymd, fundCd) {
            var url = '/api/usportfoliomodel/ja035b/balance?corpGr=' + encodeURIComponent(corpGr)
                    + '&ymd=' + encodeURIComponent(ymd)
                    + '&fundCd=' + encodeURIComponent(fundCd);

            fetch(url)
                .then(function (res) { return res.json(); })
                .then(function (balanceList) {
                    if (Array.isArray(balanceList) && balanceList.length > 0) {
                        var newList = balanceList.map(function (b) {
                            curMaxTrSeq++;
                            return {
                                corpGr: corpGr,
                                trYmd: ymd,
                                trCd: 'K20',
                                fundCd: b.fundCd,
                                xxFundCd: b.xxFundCd,
                                fundNm: b.fundNm,
                                trCoCd: b.trCoCd,
                                trustee: b.trustee,
                                yjCd: b.yjCd,
                                xxYjCd: b.xxYjCd,
                                jmNm: b.jmNm,
                                currency: b.currency,
                                trSeq: curMaxTrSeq,
                                bsType: 0,
                                trJusu: b.trJusu || 0,
                                trDanga: 0,
                                trTax: 0,
                                trCost: 0,
                                trAek: 0,
                                gyuljeYmd: ymd,
                                gyuljeAek: 0,
                                transRt: 0,
                                isNew: true,
                                rowStatus: "C"
                            };
                        });

                        if (gridList) {
                            gridList.setData(newList).then(function () {
                                updateFooterVisibility();
                                var rows = gridList.getRows();
                                if (rows.length > 0) {
                                    rows[0].select();
                                }
                            });
                        }
                        if (typeof window.showToast === 'function') {
                            window.showToast("해당 펀드의 보유 잔고 " + newList.length + "건을 불러왔습니다.", "info");
                        }
                    } else {
                        if (gridList) {
                            gridList.setData([]).then(updateFooterVisibility);
                        }
                    }
                })
                .catch(function (err) {
                    console.error('[Ja035b] Load balance error:', err);
                });
        }

        // ==========================================
        // 9. 행 추가 및 행 삭제

            if (!gridList) return;
            var corpGr = window.resolveCorpGr ? window.resolveCorpGr(currentPane) : "";
            var ymd = window.getFilterYmd ? window.getFilterYmd(currentPane) : "";
            var trCd = getSelectedTrCd();

        function deleteCurrentRow() {
            if (!gridList) return;
            var selRows = gridList.getSelectedRows();
            if (!selRows || selRows.length === 0) {
                if (typeof window.showToast === 'function') window.showToast("삭제할 행을 선택해주세요.", "warning");
                return;
            }

            var row = selRows[0];
            var data = row.getData();
            if (data.isSummaryRow) return;

            if (confirm("선택한 내역을 삭제하시겠습니까?")) {
                if (data.isNew) {
                    row.delete().then(recalcSummaryRow);
                } else {
                    data.isDeleted = true;
                    data.rowStatus = "D";
                    row.getElement().style.display = "none";
                    recalcSummaryRow();
                }
            }
        }

        // ==========================================
        // 10. 데이터 저장 (Save Data)
        // ==========================================
        function saveData() {
            if (!gridList) return;

            if (typeof window.aamsValidateGridDates === 'function') {
                var isDateValid = window.aamsValidateGridDates(gridList, ['gyuljeYmd']);
                if (!isDateValid) return;
            }

            var allData = gridList.getData();
            var changedList = [];

            for (var i = 0; i < allData.length; i++) {
                var d = allData[i];

                if (!d.isSummaryRow && (d.isNew || d.isUpdated || d.isDeleted || d.rowStatus)) {
                    if (!d.isDeleted && "D" !== d.rowStatus) {
                        if (!d.fundCd || !d.fundCd.trim()) {
                            if (typeof window.showToast === 'function') window.showToast("펀드코드는 필수 입력 항목입니다.", "warning");
                            return;
                        }
                        if (!d.yjCd || !d.yjCd.trim()) {
                            if (typeof window.showToast === 'function') window.showToast("종목코드는 필수 입력 항목입니다.", "warning");
                            return;
                        }
                    }
                    changedList.push(d);
                }
            }

            if (changedList.length === 0) {
                if (typeof window.showToast === 'function') window.showToast("저장할 변경 내역이 없습니다.", "info");
                return;
            }

            var corpGr = window.resolveCorpGr ? window.resolveCorpGr(currentPane) : "";

            fetch('/api/usportfoliomodel/ja035b/save?corpGr=' + encodeURIComponent(corpGr), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(changedList)
            })
            .then(function (res) { return res.json(); })
            .then(function (result) {
                if (result.success) {
                    if (typeof window.showToast === 'function') window.showToast(result.message || "정상적으로 저장되었습니다.", "success");
                    loadMasterData();
                } else {
                    if (typeof window.showToast === 'function') window.showToast(result.message || "저장 중 오류가 발생했습니다.", "error");
                }
            })
            .catch(function (err) {
                console.error('[Ja035b] Save error:', err);
                if (typeof window.showToast === 'function') window.showToast("저장 통신 오류가 발생했습니다.", "error");
            });
        }

        // ==========================================
        // 11. 엑셀 업로드 지원 (ue_load)
        // ==========================================
        function initExcelUpload() {
            var btnLoad = currentPane.querySelector('#btnLoadExcel');
            var fileInput = currentPane.querySelector('#excelFileInput');
            if (btnLoad && fileInput) {
                btnLoad.addEventListener('click', function () {
                    fileInput.click();
                });

                fileInput.addEventListener('change', function (e) {
                    var file = e.target.files[0];
                    if (!file) return;

                    if (typeof XLSX === 'undefined') {
                        if (typeof window.showToast === 'function') window.showToast("엑셀 파싱 라이브러리(SheetJS)가 로드되지 않았습니다.", "warning");
                        return;
                    }

                    var reader = new FileReader();
                    reader.onload = function (evt) {
                        try {
                            var data = new Uint8Array(evt.target.result);
                            var workbook = XLSX.read(data, { type: 'array' });
                            var sheetName = workbook.SheetNames[0];
                            var sheet = workbook.Sheets[sheetName];
                            var rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

                            parseAndLoadExcelRows(rows);
                        } catch (err) {
                            console.error('[Ja035b] Excel parse error:', err);
                            if (typeof window.showToast === 'function') window.showToast("엑셀 파일 파싱에 실패했습니다.", "error");
                        } finally {
                            fileInput.value = "";
                        }
                    };
                    reader.readAsArrayBuffer(file);
                });
            }
        }

        function parseAndLoadExcelRows(rows) {
            if (!rows || rows.length <= 1) {
                if (typeof window.showToast === 'function') window.showToast("엑셀 파일에 유효한 데이터가 없습니다.", "warning");
                return;
            }

            var corpGr = window.resolveCorpGr ? window.resolveCorpGr(currentPane) : "";
            var ymd = window.getFilterYmd ? window.getFilterYmd(currentPane) : "";
            var newItems = [];

            for (var r = 1; r < rows.length; r++) {
                var row = rows[r];
                if (!row || row.length === 0) continue;

                var trCoCd = (row[0] || '').toString().trim();
                var fundCd = (row[1] || '').toString().trim();
                var trYmdRaw = (row[3] || '').toString().trim();
                var trCdRaw = (row[4] || '').toString().trim();
                var gyuljeYmdRaw = (row[5] || '').toString().trim();
                var jmCd = (row[6] || '').toString().trim();
                var jmNm = (row[7] || '').toString().trim();
                var jusu = parseFloat(row[8]) || 0;
                var danga = parseFloat(row[9]) || 0;
                var aek = parseFloat(row[10]) || 0;
                var cost = parseFloat(row[11]) || 0;
                var tax = parseFloat(row[12]) || 0;
                var gyuljeAek = parseFloat(row[13]) || 0;
                var cur = (row[14] || 'USD').toString().trim();
                var transRt = parseFloat(row[15]) || 0;
                var wonGyuljeAek = parseFloat(row[16]) || 0;

                var trCd = 'J20';
                if (trCdRaw === '매도' || trCdRaw === 'K20') trCd = 'K20';

                curMaxTrSeq++;

                newItems.push({
                    isNew: true,
                    rowStatus: "C",
                    corpGr: corpGr,
                    trYmd: ymd || trYmdRaw,
                    trCd: trCd,
                    fundCd: fundCd,
                    xxFundCd: "",
                    fundNm: "",
                    trCoCd: trCoCd,
                    trustee: cur + "01",
                    yjCd: jmCd,
                    xxYjCd: jmNm,
                    jmNm: jmNm,
                    currency: cur,
                    bsType: 0,
                    trSeq: curMaxTrSeq,
                    trJusu: jusu,
                    trDanga: danga,
                    trTax: tax,
                    trCost: cost,
                    trAek: aek || (jusu * danga),
                    gyuljeYmd: gyuljeYmdRaw || ymd,
                    gyuljeAek: gyuljeAek,
                    transRt: transRt,
                    wonGyuljeAek: wonGyuljeAek
                });
            }

            if (newItems.length > 0 && gridList) {
                var currentData = gridList.getData();
                var combined = currentData.concat(newItems);
                gridList.setData(combined).then(function () {
                    recalcSummaryRow();
                    if (typeof window.showToast === 'function') {
                        window.showToast("엑셀 파일에서 " + newItems.length + "건을 성공적으로 추가했습니다.", "success");
                    }
                });
            }
        }

        // ==========================================
        // 12. 상단 공통 툴바 표준 계약 바인딩
        // ==========================================
        function initToolbar() {
            currentPane.onSearch = function () {
                loadMasterData();
            };

            currentPane.onInput = function () {
                addNewRow();
            };

            currentPane.onSave = function () {
                saveData();
            };

            currentPane.onDelete = function () {
                deleteCurrentRow();
            };

            currentPane.onRefresh = function () {
                if (gridList) gridList.setData([]).then(updateFooterVisibility);
                curMaxTrSeq = 0;
                var inputXx = currentPane.querySelector('#filterXx');
                var textXx = currentPane.querySelector('#textXxName');
                if (inputXx) inputXx.value = "";
                if (textXx) textXx.textContent = "";

                if (typeof window.showToast === 'function') {
                    window.showToast("화면이 초기화되었습니다.", "info");
                }
            };

            currentPane.onExcel = function () {
                if (gridList) {
                    var ymd = window.getFilterYmd ? window.getFilterYmd(currentPane, 'YYYYMMDD') : "";
                    gridList.download("xlsx", "해외주식_PORT_매매내역_" + ymd + ".xlsx", { sheetName: "매매내역" });
                }
            };

            currentPane.onCorpGrChange = function () {
                initFilterTrCdDddw();
                ue_dddw_retrieve();
            };

            // 서브 액션 버튼 연동
            var btnAdd = currentPane.querySelector('#btnSubAddRow');
            if (btnAdd) btnAdd.addEventListener('click', addNewRow);

            var btnDel = currentPane.querySelector('#btnSubDeleteRow');
            if (btnDel) btnDel.addEventListener('click', deleteCurrentRow);
        }

        // ==========================================
        // 13. 진입점 초기화 (Single Entry-Point)
        // ==========================================
        function startInit() {
            if (isInitialized) return;
            isInitialized = true;

            // 1) 달력 초기화
            if (typeof window.initFilterCalendar === 'function') {
                window.initFilterCalendar(currentPane);
            }

            // 2) 그리드 초기화
            initGrid();

            // 3) 상단 필터: 거래코드 DDDW 및 DynamicCodeSearch 연동
            initFilterTrCdDddw();
            initCodeSearch();
            ue_dddw_retrieve();
            initExcelUpload();

            // 4) 툴바 바인딩
            initToolbar();
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", startInit);
        } else {
            startInit();
        }
    })();
    </script>
</div>
</html>

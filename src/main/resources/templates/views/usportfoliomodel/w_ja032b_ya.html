                var val = cell.getValue();

                var num = parseFloat(val);
                if (isNaN(num)) return val;
                var str = (num > 0 ? "+" : "") + num.toFixed(2) + "%";
                if (num > 0) {
                    return '<span class="cell-price-up">' + str + '</span>';
                } else if (num < 0) {
                    return '<span class="cell-price-down">' + str + '</span>';
                }
                return '<span class="cell-text-muted">' + str + '</span>';
            }

            // 2. 종목 일별현황 그리드 초기화 (기본 해외 컬럼셋으로 시작)
            function initDetailGrid() {
                currentDetailGridMode = 'OVERSEAS';
                gridDetail = new Tabulator(currentPane.querySelector("#gridDetailJa032bYa"), {
                    height: "100%",
                    layout: "fitDataFill",
                    selectableRows: 1,
                    placeholder: "상단에서 종목을 선택하면 일별현황이 표출됩니다.",
                    columns: getOverseasDetailColumns()
                });
            }

            // 3. 펀드 목록 로드 (f_dddwctl 2열 커스텀 DDDW 규격 적용)
            function loadFundList() {
                var corpGr = window.resolveCorpGr ? window.resolveCorpGr(currentPane) : (currentPane.getAttribute('data-corp-gr') || '');
                var ymd = getSelectedYmd();
                var fundSelect = currentPane.querySelector("#filterDddw1, #selectFundJa032bYa");
                if (!fundSelect) return;

                fetch('/api/usportfoliomodel/ja032b-ya/fund-list?corpGr=' + encodeURIComponent(corpGr) + '&ymd=' + encodeURIComponent(ymd))
                    .then(function (res) { return res.json(); })
                    .then(function (list) {
                        var options = [];
                        if (Array.isArray(list) && list.length > 0) {
                            options = list.map(function (f) {
                                return {
                                    code: f.fundCd,
                                    name: (f.fundNm || f.xxFundCd || f.fundCd || "").toString().trim()
                                };
                            });
                        }

                        if (window.f_dddwctl && typeof window.f_dddwctl.get2ColItemFormatter === 'function') {
                            window.f_dddwctl.get2ColItemFormatter(fundSelect, options, {
                                codeTitle: "코드",
                                nameTitle: "펀드명",
                                defaultVal: options.length > 0 ? options[0].code : "",
                                onSelect: function (val) {
                                    fundSelect.value = val;
                                    loadPortList(val);
                                }
                            });
                            loadPortList(options.length > 0 ? options[0].code : "");
                        } else {
                            fundSelect.innerHTML = '<option value="">-- 펀드 선택 --</option>';
                            if (options.length > 0) {
                                options.forEach(function (f) {
                                    var opt = document.createElement("option");
                                    opt.value = f.code;
                                    opt.textContent = f.code + " " + f.name;
                                    fundSelect.appendChild(opt);
                                });
                                fundSelect.selectedIndex = 1;
                                loadPortList(fundSelect.value);
                            } else {
                                loadPortList("");
                            }
                        }
                    })
                    .catch(function (err) {
                        console.error("펀드 목록 조회 실패:", err);
                    });
            }

            // 4. 포트 목록 로드 (f_dddwctl 2열 커스텀 DDDW 규격 적용)
            function loadPortList(fundCd) {
                var corpGr = window.resolveCorpGr ? window.resolveCorpGr(currentPane) : '';
                var ymd = getSelectedYmd();
                var portSelect = currentPane.querySelector("#filterDddw2, #selectPortJa032bYa");
                if (!portSelect) return;

                if (!fundCd) {
                    var defaultOpts = [{ code: "1", name: "1포트" }];
                    if (window.f_dddwctl && typeof window.f_dddwctl.get2ColItemFormatter === 'function') {
                        window.f_dddwctl.get2ColItemFormatter(portSelect, defaultOpts, {
                            codeTitle: "코드",
                            nameTitle: "포트명",
                            defaultVal: "1",
                            onSelect: function (val) { portSelect.value = val; }
                        });
                    } else {
                        portSelect.innerHTML = '<option value="1">1포트</option>';
                    }
                    return;
                }

                fetch('/api/usportfoliomodel/ja032b-ya/port-list?corpGr=' + encodeURIComponent(corpGr) + '&fundCd=' + encodeURIComponent(fundCd) + '&ymd=' + encodeURIComponent(ymd))
                    .then(function (res) { return res.json(); })
                    .then(function (list) {
                        var options = [];
                        if (Array.isArray(list) && list.length > 0) {
                            options = list.map(function (p) {
                                return {
                                    code: String(p),
                                    name: p + "포트"
                                };
                            });
                        } else {
                            options = [{ code: "1", name: "1포트" }];
                        }

                        if (window.f_dddwctl && typeof window.f_dddwctl.get2ColItemFormatter === 'function') {
                            window.f_dddwctl.get2ColItemFormatter(portSelect, options, {
                                codeTitle: "코드",
                                nameTitle: "포트명",
                                defaultVal: options.length > 0 ? options[0].code : "1",
                                onSelect: function (val) { portSelect.value = val; }
                            });
                        } else {
                            portSelect.innerHTML = '';
                            options.forEach(function (opt) {
                                var o = document.createElement("option");
                                o.value = opt.code;
                                o.textContent = opt.name;
                                portSelect.appendChild(o);
                            });
                        }
                    })
                    .catch(function () {
                        var fallbackOpts = [{ code: "1", name: "1포트" }];
                        if (window.f_dddwctl && typeof window.f_dddwctl.get2ColItemFormatter === 'function') {
                            window.f_dddwctl.get2ColItemFormatter(portSelect, fallbackOpts, {
                                codeTitle: "코드",
                                nameTitle: "포트명",
                                defaultVal: "1",
                                onSelect: function (val) { portSelect.value = val; }
                            });
                        } else {
                            portSelect.innerHTML = '<option value="1">1포트</option>';
                        }
                    });
            }

            // 5. 관심종목 목록 로드 (상단 [조회] 클릭 시 단독 실행)
            function loadStockList() {
                var corpGr = window.resolveCorpGr ? window.resolveCorpGr(currentPane) : '';
                var ymd = getSelectedYmd();
                var fundSelect = currentPane.querySelector("#filterDddw1, #selectFundJa032bYa");
                var portSelect = currentPane.querySelector("#filterDddw2, #selectPortJa032bYa");
                var fundCd = fundSelect ? fundSelect.value : "";
                var portNum = portSelect ? portSelect.value : "1";

                if (!corpGr) {
                    if (typeof showToast === 'function') showToast("회사그룹 정보가 누락되었습니다.", "warning");
                    return;
                }
                if (!ymd) {
                    if (typeof showToast === 'function') showToast("조회기준일을 입력해주세요.", "warning");
                    return;
                }

                // 상세 상태 초기화
                lastLoadedStockKey = null;
                currentSelectedStock = null;
                if (gridDetail) gridDetail.clearData();

                var url = '/api/usportfoliomodel/ja032b-ya/stock-list?corpGr=' + encodeURIComponent(corpGr) +
                    '&ymd=' + encodeURIComponent(ymd) +
                    '&fundCd=' + encodeURIComponent(fundCd) +
                    '&portNum=' + encodeURIComponent(portNum);

                // 포트 시작일(fymd) 선조회 (상세 연동용)
                fetch('/api/usportfoliomodel/ja032b-ya/port-info?corpGr=' + encodeURIComponent(corpGr) +
                    '&fundCd=' + encodeURIComponent(fundCd) +
                    '&portNum=' + encodeURIComponent(portNum) +
                    '&ymd=' + encodeURIComponent(ymd))
                    .then(function (res) { return res.json(); })
                    .then(function (info) {
                        currentPortFymd = (info && info.FYMD) ? info.FYMD : ymd;
                    })
                    .catch(function () {
                        currentPortFymd = ymd;
                    });

                fetch(url)
                    .then(function (res) { return res.json(); })
                    .then(function (data) {
                        var list = Array.isArray(data) ? data : [];
                        if (gridStock) {
                            gridStock.setData(list).then(function () {
                                // 헤더 체크박스 초기화
                                var chkAll = currentPane.querySelector("#chkAllStockJa032bYa");
                                if (chkAll) chkAll.checked = false;

                                // 기준정보등록종목 필터 적용 및 첫 번째 행 선택
                                applyTujaFilter();
                            });
                        }
                    })
                    .catch(function (err) {
                        console.error("관심종목 목록 조회 실패:", err);
                        if (typeof showToast === 'function') showToast("관심종목 목록 조회 중 오류가 발생했습니다.", "error");
                    });
            }

            // 5-1. 기준정보등록종목 필터 적용/해제 헬퍼 (chkTujaYnJa032bYa 연동)
            function applyTujaFilter() {
                if (!gridStock) return;
                var chkTuja = currentPane.querySelector("#chkTujaYnJa032bYa");
                var isChecked = chkTuja ? chkTuja.checked : false;

                if (isChecked) {
                    gridStock.setFilter(function (data) {
                        var val = (data.tujaYn != null ? data.tujaYn : (data.tuja_yn != null ? data.tuja_yn : "")).toString().trim().toUpperCase();
                        return val === "Y";
                    });
                } else {
                    gridStock.clearFilter();
                }

                // 필터 적용 후 표시된 행(active rows) 중 첫 번째 행 선택 및 하단 상세 동기화
                setTimeout(function () {
                    var rows = gridStock.getRows("active");
                    if (rows && rows.length > 0) {
                        rows[0].select();
                        syncStockDetail(rows[0], rows[0].getData());
                    } else {
                        if (gridDetail) gridDetail.clearData();
                        lastLoadedStockKey = null;
                        currentSelectedStock = null;
                    }
                }, 50);
            }

            // 6. 종목 일별현황 연동 상세 조회 (syncStockDetail)
            function syncStockDetail(row, rowData) {
                if (!row) return;
                var data = rowData || (row.getData ? row.getData() : null);
                if (!data) return;

                var jmCd = data.yjCd || data.jmCd;
                if (!jmCd) return;

                var corpGr = window.resolveCorpGr ? window.resolveCorpGr(currentPane) : '';
                var tymd = getSelectedYmd();
                var fymd = currentPortFymd || tymd;

                var currentKey = (corpGr || "") + "_" + jmCd + "_" + tymd;
                if (lastLoadedStockKey === currentKey) return;
                lastLoadedStockKey = currentKey;
                currentSelectedStock = data;

                var isKrx = (jmCd.indexOf(':') === -1);
                var targetMode = isKrx ? 'KRX' : 'OVERSEAS';

                // 파워빌더 w_ja032b_ya.srw DW 분기 규격 반영 (uf_dataobject d_ja032b_dd_krx vs d_ja032b_dd)
                if (gridDetail && currentDetailGridMode !== targetMode) {
                    currentDetailGridMode = targetMode;
                    gridDetail.setColumns(isKrx ? getKrxDetailColumns() : getOverseasDetailColumns());
                }

                var url = '/api/usportfoliomodel/ja032b-ya/detail-list?corpGr=' + encodeURIComponent(corpGr) +
                    '&jmCd=' + encodeURIComponent(jmCd) +
                    '&fymd=' + encodeURIComponent(fymd) +
                    '&tymd=' + encodeURIComponent(tymd);

                fetch(url)
                    .then(function (res) { return res.json(); })
                    .then(function (detailList) {
                        gridDetail.setData(Array.isArray(detailList) ? detailList : []);
                    })
                    .catch(function (err) {
                        console.error("종목 일별현황 상세 조회 실패:", err);
                    });
            }

            // 7. 선택종목 일괄등록 (cb_1 로직)
            function bulkRegister() {
                if (!gridStock) return;
                var allData = gridStock.getData();
                var selectedItems = [];

                allData.forEach(function (d) {
                    if (d.chk === '1' || d.chk === 1 || d.chk === true) {
                        selectedItems.push({
                            jmCd: d.yjCd,
                            ovrsExcgCd: d.ovrsExcgCd || ''
                        });
                    }
                });

                if (selectedItems.length === 0) {
                    if (typeof showToast === 'function') {
                        showToast("종목을 선택 후 일괄등록 처리 하십시오.", "warning");
                    }
                    return;
                }

                var corpGr = window.resolveCorpGr ? window.resolveCorpGr(currentPane) : '';
                var ymd = getSelectedYmd();
                var fundSelect = currentPane.querySelector("#filterDddw1, #selectFundJa032bYa");
                var portSelect = currentPane.querySelector("#filterDddw2, #selectPortJa032bYa");
                var fundCd = fundSelect ? fundSelect.value : "";
                var portNum = portSelect ? portSelect.value : "1";

                if (!fundCd) {
                    if (typeof showToast === 'function') showToast("상단 필터에서 일괄등록할 펀드를 선택해주세요.", "warning");
                    return;
                }

                var confirmMsg = fundCd + " 펀드 포트 " + portNum + " 에 선택한 " + selectedItems.length + "개 종목을 등록 하시겠습니까?";
                var doRegister = function () {
                    var payload = {
                        corpGr: corpGr,
                        ymd: ymd,
                        fundCd: fundCd,
                        portNum: portNum,
                        items: selectedItems
                    };

                    fetch('/api/usportfoliomodel/ja032b-ya/bulk-register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    })
                        .then(function (res) { return res.json(); })
                        .then(function (resData) {
                            if (resData.success) {
                                if (typeof showToast === 'function') {
                                    showToast(resData.message || "선택한 종목을 일괄등록 했습니다.", "success");
                                }
                                // 체크박스 해제 및 마스터 재조회
                                loadStockList();
                            } else {
                                if (typeof showToast === 'function') {
                                    showToast(resData.message || "일괄등록 처리에 실패했습니다.", "error");
                                }
                            }
                        })
                        .catch(function (err) {
                            console.error("일괄등록 에러:", err);
                            if (typeof showToast === 'function') showToast("일괄등록 중 서버 오류가 발생했습니다.", "error");
                        });
                };

                if (window.showAlert) {
                    showAlert(confirmMsg, doRegister);
                } else if (confirm(confirmMsg)) {
                    doRegister();
                }
            }

            // 날짜 추출 헬퍼 (common.js getFilterYmd 표준 사용)
            function getSelectedYmd() {
                if (typeof window.getFilterYmd === 'function') {
                    return window.getFilterYmd(currentPane) || "";
                }
                var input = currentPane.querySelector("#filterYmd, input[name='ymd'], .aams-calendar-input");
                return input ? (input.value || "").trim() : "";
            }

            // 스플리터 초기화 (규정 10: AamsSplitter 표준 연동)
            function initSplitter() {
                if (window.AamsSplitter && typeof window.AamsSplitter.init === 'function') {
                    window.AamsSplitter.init(currentPane);
                }
            }

            // 달력 초기화 (common.js initFilterCalendar 공통 연동, 규정 09)
            function initCalendar() {
                if (typeof window.initFilterCalendar === 'function') {
                    window.initFilterCalendar(currentPane, {
                        onSelect: function (dateStr) {
                            // 규정 08 준수: 날짜 변경 시 자동 데이터 조회를 실행하지 않고 펀드 목록만 갱신
                            loadFundList();
                        }
                    });
                }
                var ymdInput = currentPane.querySelector("#filterYmd, input[name='ymd'], .aams-calendar-input");
                if (ymdInput) {
                    ymdInput.addEventListener("change", function () {
                        loadFundList();
                    });
                }
            }

            // 상단 공통 툴바 표준 계약 (규정 08-1)
            function bindToolbar() {
                currentPane.onSearch = function () {
                    loadStockList();
                };

                currentPane.onRefresh = function () {
                    if (gridStock) {
                        gridStock.clearFilter();
                        gridStock.clearData();
                    }
                    if (gridDetail) gridDetail.clearData();
                    var chkTuja = currentPane.querySelector("#chkTujaYnJa032bYa");
                    if (chkTuja) chkTuja.checked = false;
                    lastLoadedStockKey = null;
                    currentSelectedStock = null;
                    currentDetailGridMode = null;
                    if (typeof showToast === 'function') {
                        showToast("화면이 초기화되었습니다.", "info");
                    }
                };

                currentPane.onExcel = function () {
                    if (gridStock) {
                        gridStock.download("xlsx", "관심종목변동성추이_" + getSelectedYmd() + ".xlsx", { sheetName: "관심종목" });
                    }
                };

                currentPane.onCorpGrChange = function (newCorpGr) {
                    loadFundList();
                };
            }

            // 필터 및 버튼 이벤트 바인딩
            function bindEvents() {
                // 펀드 변경 시 포트 목록 갱신 (규정 08: 필터 변경 시 자동 조회는 안 함)
                var fundSelect = currentPane.querySelector("#filterDddw1, #selectFundJa032bYa");
                if (fundSelect) {
                    fundSelect.addEventListener("change", function () {
                        loadPortList(this.value);
                    });
                }

                // 선택종목일괄등록 버튼
                var btnBulk = currentPane.querySelector("#btnBulkRegisterJa032bYa");
                if (btnBulk) {
                    btnBulk.addEventListener("click", function () {
                        bulkRegister();
                    });
                }

                // 기준정보등록종목 체크박스 필터링 (cbx_2 clicked)
                var chkTuja = currentPane.querySelector("#chkTujaYnJa032bYa");
                if (chkTuja) {
                    chkTuja.addEventListener("change", function () {
                        applyTujaFilter();
                    });
                }
            }

            // 단일 진입점 초기화 패턴 (규정 10-1)
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                initStockGrid();
                initDetailGrid();
                initSplitter();
                initCalendar();
                bindToolbar();
                bindEvents();

                // 펀드 목록 초기 로드
                loadFundList();

                // pb 소스의 eb_direct_retrieve = true에 따른 초기 1회 조회 (규정 08-2.4)
                setTimeout(function () {
                    loadStockList();
                }, 300);
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", startInit);
            } else {
                startInit();
            }
        })();
    </script>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-split ja032a-container" th:fragment="ja032aView">

    <!-- 1. Top Action Control Bar -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- 2. Sub Filter Bar: 기준일자 + 변동성재계산 버튼 -->
    <div class="filter-bar">
        <div class="filter-left">
            <div th:replace="~{fragments/filter/dc_ymd :: filter(label='기준일자')}"></div>
        </div>
        <div class="filter-actions">
            <button type="button" class="t-btn btn-action" id="btnJa032aRecalculate" title="변동성 재계산 실행">
                <i class="fa-solid fa-calculator"></i> 변동성재계산
            </button>
        </div>
    </div>

    <!-- 3. Split Master-Detail Layout -->
    <div class="layout-split-v split-body layout-mobile-stack" data-split-key="W_JA032A" data-default-ratio="40:60">

        <!-- 3-1. Upper Section: 펀드별 포트폴리오 마스터 목록 (d_ja032a1) -->
        <div class="pane-top master-section">
            <div class="sub-grid-header">
                <span class="sub-title"><i class="fa-solid fa-list-check"></i> 펀드별 포트폴리오 마스터 목록</span>
                <div class="sub-grid-actions">
                    <button type="button" class="btn-sub-grid btn-add" id="btnMasterAdd" title="펀드 행 추가">
                        <i class="fa-solid fa-plus"></i> 행 추가
                    </button>
                    <button type="button" class="btn-sub-grid btn-del" id="btnMasterDel" title="선택 펀드 삭제">
                        <i class="fa-solid fa-trash-can"></i> 행 삭제
                    </button>
                </div>
            </div>
            <div class="pane-body">
                <div id="gridJa032aMaster" class="tabulator-aams-grid"></div>
            </div>
        </div>

        <!-- 3-2. Lower Section: 좌우 2분할 (Left: 포트별 설정 목록 / Right: 포트 내 종목 상세 목록) -->
        <div class="pane-bottom detail-section split-lr-container">
            
            <!-- Lower Left: 포트별 설정 목록 (d_ja032a2) -->
            <div class="split-left-section split-panel panel-left">
                <div class="sub-grid-header">
                    <span class="sub-title"><i class="fa-solid fa-layer-group"></i> 포트별 설정 목록</span>
                    <div class="sub-grid-actions">
                        <button type="button" class="btn-sub-grid btn-add" id="btnPortAdd" title="신규 포트 추가">
                            <i class="fa-solid fa-plus"></i> 행 삽입
                        </button>
                        <button type="button" class="btn-sub-grid btn-copy" id="btnPortCopy" title="포트 복사">
                            <i class="fa-solid fa-copy"></i> 행 복사
                        </button>
                        <button type="button" class="btn-sub-grid btn-del" id="btnPortDel" title="선택 포트 삭제">
                            <i class="fa-solid fa-trash-can"></i> 행 삭제
                        </button>
                    </div>
                </div>
                <div class="grid-table-wrapper">
                    <div id="gridJa032aPort" class="tabulator-aams-grid"></div>
                </div>
            </div>

            <!-- Lower Right: 포트 내 종목 상세 목록 (d_ja032a3 / d_ja032a3a) -->
            <div class="split-right-section split-panel panel-right">
                <div class="sub-grid-header">
                    <span class="sub-title"><i class="fa-solid fa-chart-pie"></i> 포트 내 종목 상세 목록</span>
                    <div class="sub-grid-actions">
                        <button type="button" class="btn-sub-grid btn-add" id="btnDetailAdd" title="종목 행 삽입">
                            <i class="fa-solid fa-plus"></i> 행 삽입
                        </button>
                        <button type="button" class="btn-sub-grid btn-del" id="btnDetailDel" title="종목 행 삭제">
                            <i class="fa-solid fa-trash-can"></i> 행 삭제
                        </button>
                    </div>
                </div>
                <div class="grid-table-wrapper">
                    <div id="gridJa032aDetail" class="tabulator-aams-grid"></div>
                </div>
            </div>

        </div>

    </div>

    <script th:inline="javascript">
    (function () {
        'use strict';

        var currentScript = document.currentScript;
        var pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;
        if (!pane) {
            pane = document.querySelector('.tab-pane.active') || document.querySelector('.ja032a-container') || document;
        }
        var currentPane = pane;
        if (!currentPane) return;

        var isInitialized = false;

        var gridMaster = null;
        var gridPort = null;
        var gridDetail = null;

        var currentMasterRowData = null;
        var currentPortRowData = null;
        var lastLoadedMasterKey = null;
        var lastLoadedPortKey = null;

        var ttOptions = [];

        // 1. DDDW 변동성계산기준(tt) 옵션 선행 로드
        function loadTtDddw() {
            var corpGr = resolveCorpGr(currentPane);
            if (window.f_dddwctl) {
                return window.f_dddwctl('tt', corpGr, '', 1, '').then(function (list) {
                    ttOptions = list || [];
                    return ttOptions;
                }).catch(function (err) {
                    console.warn('[Ja032a] tt DDDW load warning:', err);
                    return [];
                });
            }
            return Promise.resolve([]);
        }

        // 2. 상단 마스터 그리드 초기화 (d_ja032a1)
        function initMasterGrid() {
            var gridEl = currentPane.querySelector('#gridJa032aMaster');
            if (!gridEl) return;

            gridMaster = new Tabulator(gridEl, {
                height: "100%",
                layout: "fitDataFill",
                selectableRows: 1,
                editTriggerEvent: "click",
                placeholder: "조회된 데이터가 없습니다.",
                columns: [
                    {
                        title: "No.",
                        formatter: "rownum",
                        hozAlign: "center",
                        headerHozAlign: "center",
                        width: 45,
                        headerSort: false
                    },
                    {
                        title: "펀드코드",
                        field: "fundCd",
                        width: 85,
                        hozAlign: "center",
                        headerHozAlign: "center",
                        headerCssClass: "col-hdr-green",
                        editor: function (cell) {
                            var rowData = cell.getRow().getData();
                            return rowData.isNew ? "input" : false;
                        },
                        cellClick: aamsCellEdit,
                        cellEdited: function (cell) {
                            onMasterFundCdChanged(cell);
                        }
                    },
                    // p_xx_fund_cd (Grid Internal Rule 1, 2: Empty column with dynamic search button)
                    {
                        title: "",
                        field: "p_xx_fund_cd",
                        width: 36,
                        minWidth: 36,
                        maxWidth: 36,
                        hozAlign: "center",
                        headerSort: false,
                        resizable: false,
                        formatter: function () {
                            return '<button type="button" class="btn-grid-addon btn-search" title="펀드 검색"><i class="fa-solid fa-magnifying-glass"></i></button>';
                        },
                        cellClick: function (e, cell) {
                            e.stopPropagation();
                            var row = cell.getRow();
                            openFundSearchModal(row);
                        }
                    },
                    {
                        title: "펀드명",
                        field: "xxFundCd",
                        width: 170,
                        hozAlign: "left",
                        headerHozAlign: "center"
                    },
                    {
                        title: "투자원본액<br>(KRW)",
                        field: "wonbonAek",
                        width: 130,
                        hozAlign: "right",
                        headerHozAlign: "center",
                        formatter: "money",
                        formatterParams: { precision: 0 }
                    },
                    {
                        title: "투자원본<br>(USD)",
                        field: "usdWonbonAek",
                        width: 110,
                        hozAlign: "right",
                        headerHozAlign: "center",
                        formatter: "money",
                        formatterParams: { precision: 0 }
                    },
                    {
                        title: "종목<br>비중(%)",
                        field: "jmPer",
                        width: 85,
                        hozAlign: "right",
                        headerHozAlign: "center",
                        editor: "input",
                        cellClick: aamsCellEdit,
                        cellEdited: function (cell) {
                            onMasterJmPerChanged(cell);
                        }
                    },
                    {
                        title: "투자목표액<br>(USD)",
                        field: "usdTuja",
                        width: 110,
                        hozAlign: "right",
                        headerHozAlign: "center",
                        headerCssClass: "col-hdr-blue",
                        formatter: function (cell) {
                            var val = cell.getValue();
                            var str = val != null ? (window.formatNumber ? window.formatNumber(val, 0) : Number(val).toLocaleString()) : '0';
                            return '<span class="cell-text-blue">' + str + '</span>';
                        }
                    },
                    {
                        title: "전략베타",
                        headerHozAlign: "center",
                        headerCssClass: "col-hdr-green",
                        columns: [
                            {
                                title: "1년",
                                field: "yearBeta",
                                width: 75,
                                hozAlign: "right",
                                headerHozAlign: "center",
                                headerCssClass: "col-hdr-green",
                                formatter: function (cell) {
                                    var val = cell.getValue();
                                    if (val == null || val === '') return '';
                                    var str = window.formatNumber ? window.formatNumber(val, 4) : Number(val).toFixed(4);
                                    return '<span class="cell-text-green">' + str + '</span>';
                                }
                            },
                            {
                                title: "1개월",
                                field: "monBeta",
                                width: 75,
                                hozAlign: "right",
                                headerHozAlign: "center",
                                headerCssClass: "col-hdr-green",
                                formatter: function (cell) {
                                    var val = cell.getValue();
                                    if (val == null || val === '') return '';
                                    var str = window.formatNumber ? window.formatNumber(val, 4) : Number(val).toFixed(4);
                                    return '<span class="cell-text-green">' + str + '</span>';
                                }
                            }
                        ]
                    },
                    {
                        title: "펀드<br>위험값",
                        field: "riskValue",
                        width: 95,
                        hozAlign: "right",
                        headerHozAlign: "center",
                        headerCssClass: "col-hdr-red",
                        formatter: function (cell) {
                            var val = cell.getValue();
                            if (val == null || val === '') return '';
                            var num = Number(val) || 0;
                            var str = window.formatNumber ? window.formatNumber(num, 0) : num.toLocaleString();
                            if (num < 0) {
                                return '<span class="cell-text-red">' + str + '</span>';
                            }
                            return str;
                        }
                    },
                    {
                        title: "환(FX)<br>헷지수량",
                        field: "fxSu",
                        width: 95,
                        hozAlign: "right",
                        headerHozAlign: "center",
                        formatter: "money",
                        formatterParams: { precision: 0 }
                    },
                    {
                        title: "환(FX)<br>헷지금액",
                        field: "fxAmt",
                        width: 95,
                        hozAlign: "right",
                        headerHozAlign: "center",
                        formatter: "money",
                        formatterParams: { precision: 0 }
                    },
                    {
                        title: "옵션<br>프리미엄",
                        field: "optPremium",
                        width: 95,
                        hozAlign: "right",
                        headerHozAlign: "center",
                        formatter: "money",
                        formatterParams: { precision: 0 }
                    },
                    {
                        title: "옵션<br>명목금액",
                        field: "nominalAmt",
                        width: 95,
                        hozAlign: "right",
                        headerHozAlign: "center",
                        formatter: "money",
                        formatterParams: { precision: 0 }
                    },
                    {
                        title: "주식<br>취득액",
                        field: "stockChui",
                        width: 100,
                        hozAlign: "right",
                        headerHozAlign: "center",
                        formatter: "money",
                        formatterParams: { precision: 0 }
                    }
                ]
            });

            // 마스터-디테일 삼중 안전망 연결
            setupTabulatorRowSelection(gridMaster, function (row, data) {
                syncPortGrid(row, data);
            });
            gridMaster.on("rowClick", function (e, row) {
                syncPortGrid(row, row ? row.getData() : null);
            });
            gridMaster.on("rowSelectionChanged", function (data, rows) {
                if (rows && rows.length > 0) {
                    syncPortGrid(rows[0], rows[0].getData());
                }
            });
        }

        // 3. 하단 좌측 포트 그리드 초기화 (d_ja032a2)
        function initPortGrid() {
            var gridEl = currentPane.querySelector('#gridJa032aPort');
            if (!gridEl) return;

            gridPort = new Tabulator(gridEl, {
                height: "100%",
                layout: "fitDataFill",
                selectableRows: 1,
                editTriggerEvent: "click",
                placeholder: "선택된 펀드의 포트 정보가 없습니다.",
                columns: [
                    {
                        title: "포트",
                        field: "portNum",
                        width: 60,
                        hozAlign: "center",
                        headerHozAlign: "center",
                        editor: "input",
                        cellClick: aamsCellEdit,
                        cellEdited: function (cell) {
                            markRowUpdated(cell);
                        }
                    },
                    {
                        title: "변동성<br>계산기준",
                        field: "tt",
                        width: 110,
                        hozAlign: "center",
                        headerHozAlign: "center",
                        editor: "list",
                        editorParams: function () {
                            return {
                                valuesLookup: function () {
                                    return ttOptions.map(function (it) {
                                        var c = it.code != null ? it.code : (it.cd != null ? it.cd : '');
                                        var n = it.name != null ? it.name : (it.dscr != null ? it.dscr : c);
                                        return { label: n, value: c, code: c, name: n };
                                    });
                                },
                                itemFormatter: window.f_dddwctl ? window.f_dddwctl.get2ColItemFormatter('코드', '명칭') : null
                            };
                        },
                        formatter: function (cell) {
                            var val = cell.getValue();
                            if (window.f_dddwctl && window.f_dddwctl.getLabel) {
                                return window.f_dddwctl.getLabel(ttOptions, val) || val || "";
                            }
                            return val || "";
                        },
                        cellClick: aamsCellEdit,
                        cellEdited: function (cell) {
                            onPortTtChanged(cell);
                        }
                    },
                    {
                        title: "분할<br>일수",
                        field: "instDays",
                        width: 60,
                        hozAlign: "center",
                        headerHozAlign: "center",
                        editor: "list",
                        editorParams: { values: ["1", "2", "3", "4", "5", "6", "7"] },
                        cellClick: aamsCellEdit,
                        cellEdited: function (cell) {
                            markRowUpdated(cell);
                        }
                    },
                    {
                        title: "만기일",
                        field: "mangiYmd",
                        width: 95,
                        hozAlign: "center",
                        headerHozAlign: "center",
                        editor: window.aamsDateEditor || "input",
                        editorParams: { separator: "-" },
                        cellClick: aamsCellEdit,
                        cellEdited: function (cell) {
                            if (window.aamsValidateDateCell) {
                                window.aamsValidateDateCell(cell, function (c, validDate) {
                                    onPortMangiChanged(c);
                                });
                            } else {
                                onPortMangiChanged(cell);
                            }
                        }
                    },
                    // p_dd_mangi_ymd (달력 선택 팝업 버튼)
                    {
                        title: "",
                        field: "p_dd_mangi_ymd",
                        width: 36,
                        minWidth: 36,
                        maxWidth: 36,
                        hozAlign: "center",
                        headerSort: false,
                        resizable: false,
                        formatter: function () {
                            return '<button type="button" class="btn-grid-addon btn-cal" title="만기일 선택"><i class="fa-regular fa-calendar-days"></i></button>';
                        },
                        cellClick: function (e, cell) {
                            e.stopPropagation();
                            var row = cell.getRow();
                            var curVal = row.getData().mangiYmd || "";
                            if (window.AamsCalendar && typeof window.AamsCalendar.openDatePicker === 'function') {
                                window.AamsCalendar.openDatePicker({
                                    anchorEl: cell.getElement(),
                                    initialYmd: curVal,
                                    format: 'dash',
                                    onSelect: function (selectedYmd) {
                                        row.update({ mangiYmd: selectedYmd, isUpdated: true });
                                        onPortMangiChanged(row.getCell('mangiYmd'));
                                    }
                                });
                            }
                        }
                    },
                    {
                        title: "잔존<br>일수",
                        field: "dt",
                        width: 65,
                        hozAlign: "right",
                        headerHozAlign: "center",
                        formatter: "money",
                        formatterParams: { precision: 0 }
                    },
                    {
                        title: "PUT(z)<br>변동성",
                        field: "z",
                        width: 80,
                        hozAlign: "right",
                        headerHozAlign: "center",
                        editor: "list",
                        editorParams: { values: ["1", "0.75", "0.5", "0.25", "0", "-0.25", "-0.5"] },
                        cellClick: aamsCellEdit,
                        bottomCalc: function () {
                            return "(USD계)";
                        },
                        bottomCalcFormatter: function (cell) {
                            return '<span class="cell-text-red font-bold">(USD계)</span>';
                        },
                        cellEdited: function (cell) {
                            markRowUpdated(cell);
                        }
                    },
                    {
                        title: "투자<br>비중(%)",
                        field: "jmPer",
                        width: 75,
                        hozAlign: "right",
                        headerHozAlign: "center",
                        editor: "input",
                        cellClick: aamsCellEdit,
                        bottomCalc: "sum",
                        bottomCalcFormatter: function (cell) {
                            var val = cell.getValue();
                            return '<span class="font-bold">' + (val != null ? Number(val).toFixed(0) : '0') + '</span>';
                        },
                        cellEdited: function (cell) {
                            onPortJmPerChanged(cell);
                        }
                    },
                    {
                        title: "투자목표액<br>(USD)",
                        field: "usdTuja",
                        width: 110,
                        hozAlign: "right",
                        headerHozAlign: "center",
                        headerCssClass: "col-hdr-blue",
                        editor: "input",
                        cellClick: aamsCellEdit,
                        formatter: function (cell) {
                            var val = cell.getValue();
                            var str = val != null ? (window.formatNumber ? window.formatNumber(val, 0) : Number(val).toLocaleString()) : '0';
                            return '<span class="cell-text-blue">' + str + '</span>';
                        },
                        bottomCalc: function (values, data) {
                            var sum = 0;
                            (data || []).forEach(function (r) {
                                if (r.tt >= '1' && r.tt <= '9') {
                                    sum += (parseFloat(r.usdTuja) || 0);
                                }
                            });
                            return sum;
                        },
                        bottomCalcFormatter: function (cell) {
                            var val = cell.getValue();
                            var str = val != null ? (window.formatNumber ? window.formatNumber(val, 0) : Number(val).toLocaleString()) : '0';
                            return '<span class="cell-text-blue font-bold">' + str + '</span>';
                        },
                        cellEdited: function (cell) {
                            onPortUsdTujaChanged(cell);
                        }
                    },
                    {
                        title: "전략베타",
                        headerHozAlign: "center",
                        headerCssClass: "col-hdr-green",
                        columns: [
                            {
                                title: "1년",
                                field: "yearBeta",
                                width: 65,
                                hozAlign: "right",
                                headerHozAlign: "center",
                                headerCssClass: "col-hdr-green",
                                formatter: function (cell) {
                                    var val = cell.getValue();
                                    if (val == null || val === '') return '';
                                    var str = window.formatNumber ? window.formatNumber(val, 4) : Number(val).toFixed(4);
                                    return '<span class="cell-text-green">' + str + '</span>';
                                }
                            },
                            {
                                title: "1개월",
                                field: "monBeta",
                                width: 65,
                                hozAlign: "right",
                                headerHozAlign: "center",
                                headerCssClass: "col-hdr-green",
                                formatter: function (cell) {
                                    var val = cell.getValue();
                                    if (val == null || val === '') return '';
                                    var str = window.formatNumber ? window.formatNumber(val, 4) : Number(val).toFixed(4);
                                    return '<span class="cell-text-green">' + str + '</span>';
                                }
                            }
                        ]
                    },
                    {
                        title: "행사<br>비율(%)",
                        field: "pricePer",
                        width: 75,
                        hozAlign: "right",
                        headerHozAlign: "center",
                        editor: "input",
                        cellClick: aamsCellEdit,
                        cellEdited: function (cell) {
                            markRowUpdated(cell);
                        }
                    }
                ]
            });

            // 포트 -> 종목 상세 삼중 안전망 연결
            setupTabulatorRowSelection(gridPort, function (row, data) {
                syncDetailGrid(row, data);
            });
            gridPort.on("rowClick", function (e, row) {
                syncDetailGrid(row, row ? row.getData() : null);
            });
            gridPort.on("rowSelectionChanged", function (data, rows) {
                if (rows && rows.length > 0) {
                    syncDetailGrid(rows[0], rows[0].getData());
                }
            });
        }

        // 4. 하단 우측 종목 상세 그리드 초기화 (d_ja032a3)
        function initDetailGrid() {
            var gridEl = currentPane.querySelector('#gridJa032aDetail');
            if (!gridEl) return;

            gridDetail = new Tabulator(gridEl, {
                height: "100%",
                layout: "fitDataFill",
                selectableRows: 1,
                editTriggerEvent: "click",
                placeholder: "선택된 포트의 종목 정보가 없습니다.",
                columns: [
                    {
                        title: "순서",
                        field: "col",
                        width: 50,
                        hozAlign: "center",
                        headerHozAlign: "center",
                        editor: "input",
                        cellClick: aamsCellEdit,
                        headerDblClick: function (e, column) {
                            // 헤더 더블클릭: 1..N 순서 자동 재부여
                            var rows = gridDetail.getRows();
                            rows.forEach(function (r, idx) {
                                r.update({ col: idx + 1, isUpdated: true });
                            });
                            if (window.showToast) window.showToast("순서가 1번부터 순차 재부여되었습니다.", "info");
                        },
                        cellEdited: function (cell) {
                            markRowUpdated(cell);
                        }
                    },
                    {
                        title: "종목코드",
                        field: "yjCd",
                        width: 90,
                        hozAlign: "center",
                        headerHozAlign: "center",
                        editor: "input",
                        cellClick: aamsCellEdit,
                        cellDblClick: function (e, cell) {
                            openCodeSearchModal(cell.getRow());
                        },
                        cellEdited: function (cell) {
                            onDetailYjCdChanged(cell);
                        }
                    },
                    // p_xx_yj_cd (Grid Internal Rule 1, 2: Empty column with dynamic search button)
                    {
                        title: "",
                        field: "p_xx_yj_cd",
                        width: 36,
                        minWidth: 36,
                        maxWidth: 36,
                        hozAlign: "center",
                        headerSort: false,
                        resizable: false,
                        formatter: function () {

        // 행 수정 상태 마킹
        function markRowUpdated(cell) {
            var row = cell.getRow();
            var d = row.getData();
            if (!d.isNew) {
                row.update({ isUpdated: true });
            }
        }

        // 세팅가능금액 계산: usdTuja - stockChui - optNominalAmt
        function recalculateSettableAmount(row) {
            var d = row.getData();
            var tuja = parseFloat(d.usdTuja) || 0;
            var stock = parseFloat(d.stockChui) || 0;
            var opt = parseFloat(d.optNominalAmt) || 0;
            var settable = tuja - stock - opt;
            row.update({ settableAmount: settable });
        }

        // 종목 상세 균등 분할
        function distributeDetailUsdTuja() {
            if (!currentPortRowData || !gridDetail) return;
            var rows = gridDetail.getRows();
            if (rows.length === 0) return;

            var portTuja = parseFloat(currentPortRowData.usdTuja) || 0;
            var perRowAmt = Math.round((portTuja / rows.length) * 100) / 100;

            rows.forEach(function (r) {
                r.update({ usdTuja: perRowAmt, isUpdated: true });
                recalculateSettableAmount(r);
            });

            if (window.showToast) window.showToast("포트 투자목표액이 종목별로 균등 배분되었습니다.", "info");
        }

        // 펀드코드 검색 팝업 열기
        function openFundSearchModal(target) {
            var row = target.getRow ? target.getRow() : target;
            var curVal = row.getData().fundCd || "";
            var corpGr = resolveCorpGr(currentPane);
            if (window.DynamicCodeSearch && typeof window.DynamicCodeSearch.openModal === 'function') {
                window.DynamicCodeSearch.openModal({
                    columnNm: "fund_cd",
                    seq: 1,
                    corpGr: corpGr,
                    initialKeyword: curVal,
                    onSelect: function (code, name) {
                        row.update({
                            fundCd: code,
                            xxFundCd: name,
                            fundNm: name,
                            isUpdated: true
                        });
                    }
                });
            }
        }

        // 펀드코드 수기 입력 시 코드명 자동 조회 및 검증
        function onMasterFundCdChanged(cell) {
            var row = cell.getRow();
            var val = (cell.getValue() || "").trim();
            var corpGr = resolveCorpGr(currentPane);
            markRowUpdated(cell);
            if (!val) {
                row.update({ xxFundCd: "", fundNm: "" });
                return;
            }

            fetch('/api/common/code-search/get?columnNm=fund_cd&seq=1&corpGr=' + encodeURIComponent(corpGr) + '&code=' + encodeURIComponent(val))
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    if (data && data.code) {
                        row.update({
                            fundCd: data.code,
                            xxFundCd: data.codeName || data.name || '',
                            fundNm: data.codeName || data.name || '',
                            isUpdated: true
                        });
                    } else {
                        openFundSearchModal(row);
                    }
                })
                .catch(function () {
                    openFundSearchModal(row);
                });
        }

        // 종목코드 검색 팝업 열기
        function openCodeSearchModal(target) {
            var row = target.getRow ? target.getRow() : target;
            var curVal = row.getData().yjCd || "";
            var corpGr = resolveCorpGr(currentPane);
            var tt = (currentPortRowData && currentPortRowData.tt) ? currentPortRowData.tt : '1';
            var seq = (tt >= '1' && tt <= '9') ? 1 : 81; // 1: 해외종목, 81: 국내주식

            if (window.DynamicCodeSearch && window.DynamicCodeSearch.openModal) {
                window.DynamicCodeSearch.openModal({
                    columnNm: 'yj_cd',
                    seq: seq,
                    corpGr: corpGr,
                    initialKeyword: curVal,
                    onSelect: function (code, name, rowData) {
                        row.update({
                            yjCd: code,
                            xxYjCd: name,
                            isUpdated: true
                        });
                        recalculateSettableAmount(row);
                    }
                });
            }
        }

        // 종목코드 수기 입력 시 중복 검증 및 코드명 자동 조회
        function onDetailYjCdChanged(cell) {
            var row = cell.getRow();
            var val = (cell.getValue() || "").trim();
            if (!val) {
                row.update({ xxYjCd: "" });
                markRowUpdated(cell);
                return;
            }

            var rows = gridDetail.getRows();
            for (var i = 0; i < rows.length; i++) {
                var otherRow = rows[i];
                if (otherRow !== row && (otherRow.getData().yjCd || "").trim() === val) {
                    if (window.showToast) window.showToast("동일한 종목이 등록되어 있습니다. 순번을 조정하십시오.", "warning");
                    cell.setValue("");
                    row.update({ xxYjCd: "" });
                    return;
                }
            }
            markRowUpdated(cell);

            var corpGr = resolveCorpGr(currentPane);
            var tt = (currentPortRowData && currentPortRowData.tt) ? currentPortRowData.tt : '1';
            var seq = (tt >= '1' && tt <= '9') ? 1 : 81;

            fetch('/api/common/code-search/get?columnNm=yj_cd&seq=' + seq + '&corpGr=' + encodeURIComponent(corpGr) + '&code=' + encodeURIComponent(val))
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    if (data && data.code) {
                        row.update({
                            yjCd: data.code,
                            xxYjCd: data.codeName || data.name || '',
                            isUpdated: true
                        });
                        recalculateSettableAmount(row);
                    } else {
                        openCodeSearchModal(row);
                    }
                })
                .catch(function () {
                    openCodeSearchModal(row);
                });
        }

        // 마스터 펀드 종목비중 변경 시 로직
        function onMasterJmPerChanged(cell) {
            var val = parseFloat(cell.getValue()) || 0;
            if (val > 50) {
                if (window.showToast) window.showToast("종목비중은 50%를 초과할 수 없습니다.", "warning");
                cell.setValue(0);
                return;
            }

            var row = cell.getRow();
            var d = row.getData();
            var corpGr = resolveCorpGr(currentPane);
            var ymd = getFilterYmd(currentPane);

            // 환율 조회 후 원본액 계산
            fetch("/api/usportfoliomodel/ja032a/exchange-rate?corpGr=" + encodeURIComponent(corpGr) + "&trYmd=" + encodeURIComponent(ymd))
                .then(function (res) { return res.json(); })
                .then(function (resData) {
                    var rate = parseFloat(resData.rate) || 0;
                    var wonbonAek = parseFloat(d.wonbonAek) || 0;
                    var usdWonbon = rate > 0 ? Math.floor((wonbonAek / rate / 100)) * 100 : 0;
                    var usdTuja = Math.round((usdWonbon * val / 100) * 100) / 100;

                    row.update({
                        usdWonbonAek: usdWonbon,
                        usdTuja: usdTuja,
                        isUpdated: true
                    });
                })
                .catch(function (err) {
                    console.error("환율 조회 실패:", err);
                    markRowUpdated(cell);
                });
        }

        // 포트 tt 변경 시 통화 헤더 및 제약 검증
        function onPortTtChanged(cell) {
            var val = cell.getValue();
            var isUsd = (val >= '1' && val <= '9');

            // 헤더 통화 표기 동적 업데이트
            if (gridPort) {
                var col = gridPort.getColumn("usdTuja");
                if (col) col.updateDefinition({ title: isUsd ? "투자목표액<br>(USD)" : "투자목표액<br>(KRW)" });
            }
            if (gridDetail) {
                var dTujaCol = gridDetail.getColumn("usdTuja");
                if (dTujaCol) dTujaCol.updateDefinition({ title: isUsd ? "투자목표액<br>(USD)" : "투자목표액<br>(KRW)" });
                var dStockCol = gridDetail.getColumn("stockChui");
                if (dStockCol) dStockCol.updateDefinition({ title: isUsd ? "주식취득액<br>(USD)" : "주식취득액<br>(KRW)" });
            }

            markRowUpdated(cell);
        }

        // 포트 만기일 변경 시 잔존일수(dt) 자동 계산
        function onPortMangiChanged(cell) {
            var row = cell.getRow();
            var mangiVal = cell.getValue();
            var trYmd = getFilterYmd(currentPane);

            if (mangiVal && trYmd) {
                var d1 = new Date(trYmd);
                var d2 = new Date(mangiVal);
                var diffTime = d2.getTime() - d1.getTime();
                var diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                row.update({ dt: diffDays > 0 ? diffDays : 0, isUpdated: true });
            } else {
                markRowUpdated(cell);
            }
        }

        // 포트 투자비중 변경 시 usdTuja 계산
        function onPortJmPerChanged(cell) {
            var row = cell.getRow();
            var d = row.getData();
            var jmPerVal = parseFloat(cell.getValue()) || 0;

            if (currentMasterRowData) {
                var isUsd = (d.tt >= '1' && d.tt <= '9');
                var baseAmt = isUsd ? (parseFloat(currentMasterRowData.usdWonbonAek) || 0) : (parseFloat(currentMasterRowData.wonbonAek) || 0);
                var tuja = Math.round((baseAmt * jmPerVal / 100) * 100) / 100;
                row.update({ usdTuja: tuja, isUpdated: true });

                // 하위 종목 상세에도 균등 배분 연동
                if (gridDetail) {
                    var detailRows = gridDetail.getRows();
                    if (detailRows.length > 0) {
                        var perRow = Math.round((tuja / detailRows.length) * 100) / 100;
                        detailRows.forEach(function (dr) {
                            dr.update({ usdTuja: perRow, isUpdated: true });
                            recalculateSettableAmount(dr);
                        });
                    }
                }
            } else {
                markRowUpdated(cell);
            }
        }

        // 포트 usdTuja 변경 시 하위 종목 상세 균등 배분 연동
        function onPortUsdTujaChanged(cell) {
            var tuja = parseFloat(cell.getValue()) || 0;
            if (gridDetail) {
                var detailRows = gridDetail.getRows();
                if (detailRows.length > 0) {
                    var perRow = Math.round((tuja / detailRows.length) * 100) / 100;
                    detailRows.forEach(function (dr) {
                        dr.update({ usdTuja: perRow, isUpdated: true });
                        recalculateSettableAmount(dr);
                    });
                }
            }
            markRowUpdated(cell);
        }

        // 5. 마스터 그리드 데이터 로드
        function loadMasterGrid() {
            var corpGr = resolveCorpGr(currentPane);
            var ymd = getFilterYmd(currentPane);

            if (!corpGr) {
                if (window.showToast) window.showToast("회사그룹을 선택해주세요.", "warning");
                return;
            }
            if (!ymd) {
                if (window.showToast) window.showToast("기준일자를 선택해주세요.", "warning");
                return;
            }

            var url = "/api/usportfoliomodel/ja032a/master?corpGr=" + encodeURIComponent(corpGr) + "&ymd=" + encodeURIComponent(ymd);

            fetch(url)
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    lastLoadedMasterKey = null;
                    lastLoadedPortKey = null;
                    currentMasterRowData = null;
                    currentPortRowData = null;

                    if (gridPort) gridPort.clearData();
                    if (gridDetail) gridDetail.clearData();

                    if (gridMaster) {
                        gridMaster.setData(data || []).then(function () {
                            if (data && data.length > 0) {
                                var rows = gridMaster.getRows();
                                if (rows.length > 0) {
                                    rows[0].select();
                                    syncPortGrid(rows[0], rows[0].getData());
                                }
                            }
                        });
                    }
                })
                .catch(function (err) {
                    console.error("[Ja032a] 마스터 목록 조회 실패:", err);
                    if (window.showToast) window.showToast("마스터 목록 조회 중 오류가 발생했습니다.", "error");
                });
        }

        // 6. 포트 그리드 데이터 동기화
        function syncPortGrid(row, masterRowData) {
            if (!row) return;
            var data = masterRowData || (row.getData ? row.getData() : null);
            if (!data) return;

            var currentKey = (data.corpGr || "") + "_" + (data.fundCd || "") + "_" + (data.trYmd || "");
            if (lastLoadedMasterKey === currentKey) return;
            lastLoadedMasterKey = currentKey;
            currentMasterRowData = data;

            loadPortGrid(data);
        }

        function loadPortGrid(masterData) {
            var corpGr = resolveCorpGr(currentPane);
            var fundCd = masterData.fundCd;
            var trYmd = masterData.trYmd || getFilterYmd(currentPane);
            var fundJmPer = masterData.jmPer || 0;

            if (!fundCd) return;

            var url = "/api/usportfoliomodel/ja032a/port?corpGr=" + encodeURIComponent(corpGr) +
                      "&fundCd=" + encodeURIComponent(fundCd) +
                      "&trYmd=" + encodeURIComponent(trYmd) +
                      "&fundJmPer=" + encodeURIComponent(fundJmPer);

            fetch(url)
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    lastLoadedPortKey = null;
                    currentPortRowData = null;
                    if (gridDetail) gridDetail.clearData();

                    if (gridPort) {
                        gridPort.setData(data || []).then(function () {
                            var ymd = getFilterYmd(currentPane);
                            var isMangiToday = false;
                            var mangiPorts = [];

                            (data || []).forEach(function (p) {
                                if (p.mangiYmd === ymd) {
                                    isMangiToday = true;
                                    mangiPorts.push(p.portNum);
                                }
                            });

                            if (isMangiToday && window.showToast) {
                                window.showToast(mangiPorts.join(", ") + " 포트가 당일 만기입니다.", "warning", 5000);
                            }

                            if (data && data.length > 0) {
                                var rows = gridPort.getRows();
                                if (rows.length > 0) {
                                    rows[0].select();
                                    syncDetailGrid(rows[0], rows[0].getData());
                                }
                            }
                        });
                    }
                })
                .catch(function (err) {
                    console.error("[Ja032a] 포트 목록 조회 실패:", err);
                });
        }

        // 7. 종목 상세 그리드 동기화
        function syncDetailGrid(row, portRowData) {
            if (!row) return;
            var data = portRowData || (row.getData ? row.getData() : null);
            if (!data) return;

            var currentKey = (data.corpGr || "") + "_" + (data.fundCd || "") + "_" + (data.portNum || "");
            if (lastLoadedPortKey === currentKey) return;
            lastLoadedPortKey = currentKey;
            currentPortRowData = data;

            loadDetailGrid(data);
        }

        function loadDetailGrid(portData) {
            var corpGr = resolveCorpGr(currentPane);
            var fundCd = portData.fundCd;
            var portNum = portData.portNum;
            var ymd = portData.tymd || getFilterYmd(currentPane);

            if (!fundCd || !portNum) return;

            var url = "/api/usportfoliomodel/ja032a/detail?corpGr=" + encodeURIComponent(corpGr) +
                      "&ymd=" + encodeURIComponent(ymd) +
                      "&fundCd=" + encodeURIComponent(fundCd) +
                      "&portNum=" + encodeURIComponent(portNum);

            fetch(url)
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    if (gridDetail) {
                        gridDetail.setData(data || []).then(function () {
                            if (data && data.length > 0) {
                                var rows = gridDetail.getRows();
                                if (rows.length > 0) rows[0].select();
                            }
                        });
                    }
                })
                .catch(function (err) {
                    console.error("[Ja032a] 종목 상세 목록 조회 실패:", err);
                });
        }

        // 8. 일괄 저장 처리
        function saveData() {
            var corpGr = resolveCorpGr(currentPane);
            var ymd = getFilterYmd(currentPane);

            // 날짜 유효성 전수 검사
            if (gridPort && window.aamsValidateGridDates) {
                if (!window.aamsValidateGridDates(gridPort, ['mangiYmd'])) return;
            }

            var masterChanged = [];
            if (gridMaster) {
                gridMaster.getData().forEach(function (d) {
                    if (d.isUpdated) masterChanged.push(d);
                });
            }

            var portChanged = [];
            if (gridPort) {
                gridPort.getData().forEach(function (d) {
                    if (d.isNew || d.isUpdated || d.isDeleted) portChanged.push(d);
                });
            }

            var detailChanged = [];
            if (gridDetail) {
                gridDetail.getData().forEach(function (d) {
                    if (d.isNew || d.isUpdated || d.isDeleted) detailChanged.push(d);
                });
            }

            if (masterChanged.length === 0 && portChanged.length === 0 && detailChanged.length === 0) {
                if (window.showToast) window.showToast("저장할 변경사항이 없습니다.", "info");
                return;
            }

            var payload = {
                corpGr: corpGr,
                trYmd: ymd,
                fundCd: currentMasterRowData ? currentMasterRowData.fundCd : '',
                portNum: currentPortRowData ? currentPortRowData.portNum : '',
                masterList: masterChanged,
                portList: portChanged,
                detailList: detailChanged
            };

            fetch("/api/usportfoliomodel/ja032a/save", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(function (res) { return res.json(); })
            .then(function (result) {
                if (result && result.success) {
                    if (window.showToast) window.showToast(result.message || "정상적으로 저장되었습니다.", "success");
                    loadMasterGrid();
                } else {
                    if (window.showToast) window.showToast((result ? result.message : "저장 실패"), "error");
                }
            })
            .catch(function (err) {
                console.error("[Ja032a] 저장 실패:", err);
                if (window.showToast) window.showToast("저장 중 통신 오류가 발생했습니다.", "error");
            });
        }

        // 9. 변동성 재계산 프로시저 호출
        function onRecalculateVolatility() {
            var corpGr = resolveCorpGr(currentPane);
            var ymd = getFilterYmd(currentPane);

            if (!corpGr || !ymd) {
                if (window.showToast) window.showToast("회사그룹과 기준일자를 확인해주세요.", "warning");
                return;
            }

            var btn = currentPane.querySelector('#btnJa032aRecalculate');
            if (btn) btn.disabled = true;

            var params = new URLSearchParams();
            params.append("corpGr", corpGr);
            params.append("ymd", ymd);

            fetch("/api/usportfoliomodel/ja032a/recalculate", {
                method: "POST",
                body: params
            })
            .then(function (res) { return res.json(); })
            .then(function (resData) {
                if (btn) btn.disabled = false;
                if (resData && resData.success) {
                    if (window.showToast) window.showToast(resData.message || "변동성 재계산 완료", "success", 4000);
                    loadMasterGrid();
                } else {
                    if (window.showToast) window.showToast(resData ? resData.message : "변동성 재계산 실패", "error", 5000);
                }
            })
            .catch(function (err) {
                if (btn) btn.disabled = false;
                console.error("[Ja032a] 변동성 재계산 실패:", err);
                if (window.showToast) window.showToast("변동성 재계산 실행 중 오류가 발생했습니다.", "error");
            });
        }

        // 10. 상단 공통 툴바 표준 계약 바인딩
        currentPane.onSearch = function () {
            loadMasterGrid();
        };

        currentPane.onSave = function () {
            saveData();
        };

        currentPane.onRefresh = function () {
            if (gridMaster) gridMaster.clearData();
            if (gridPort) gridPort.clearData();
            if (gridDetail) gridDetail.clearData();
            lastLoadedMasterKey = null;
            lastLoadedPortKey = null;
            currentMasterRowData = null;
            currentPortRowData = null;
        };

        currentPane.onCorpGrChange = function () {
            // 규칙 19: 필터 변경 시 자동 조회 절대 금지 및 기존 데이터 유지.
            // 작업일자만 갱신
            var corpGr = resolveCorpGr(currentPane);
            if (!corpGr) return;
            fetch("/api/usportfoliomodel/ja032a/workdate?corpGr=" + encodeURIComponent(corpGr))
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    if (data && data.workDate) {
                        var dateInput = currentPane.querySelector('#filterYmd');
                        if (dateInput) dateInput.value = data.workDate;
                    }
                    loadTtDddw();
                });
        };

        currentPane.onExcel = function () {
            if (gridMaster) {
                gridMaster.download("xlsx", "US_포트폴리오_모델_마스터_" + getFilterYmd(currentPane) + ".xlsx");
            }
        };

        // 11. 서브 액션 버튼 바인딩
        // 마스터 행 추가
        var btnMAdd = currentPane.querySelector('#btnMasterAdd');
        if (btnMAdd) {
            btnMAdd.addEventListener('click', function () {
                var corpGr = resolveCorpGr(currentPane);
                var ymd = getFilterYmd(currentPane);
                if (!gridMaster) return;
                var newRow = {
                    corpGr: corpGr,
                    fundCd: "",
                    xxFundCd: "",
                    fundNm: "",
                    trYmd: ymd,
                    wonbonAek: 0,
                    jmPer: 0,
                    usdWonbonAek: 0,
                    usdTuja: 0,
                    yearBeta: 0,
                    monBeta: 0,
                    riskValue: 0,
                    stockChui: 0,
                    optPremium: 0,
                    nominalAmt: 0,
                    del: "N",
                    isNew: true
                };
                gridMaster.addRow(newRow, true).then(function (row) {
                    row.select();
                });
            });
        }

        // 마스터 행 삭제
        var btnMDel = currentPane.querySelector('#btnMasterDel');
        if (btnMDel) {
            btnMDel.addEventListener('click', function () {
                if (!currentMasterRowData) {
                    if (window.showToast) window.showToast("삭제할 펀드를 선택해주세요.", "warning");
                    return;
                }
                if (!confirm("선택한 펀드 (" + currentMasterRowData.fundCd + ") 및 포트/종목 데이터를 모두 삭제하시겠습니까?")) return;

                var corpGr = resolveCorpGr(currentPane);
                var ymd = currentMasterRowData.trYmd || getFilterYmd(currentPane);
                var fundCd = currentMasterRowData.fundCd;

                var params = new URLSearchParams();
                params.append("corpGr", corpGr);
                params.append("ymd", ymd);
                params.append("fundCd", fundCd);

                fetch("/api/usportfoliomodel/ja032a/delete-master", {
                    method: "POST",
                    body: params
                })
                .then(function (res) { return res.json(); })
                .then(function (result) {
                    if (result && result.success) {
                        if (window.showToast) window.showToast(result.message || "삭제되었습니다.", "success");
                        loadMasterGrid();
                    } else {
                        if (window.showToast) window.showToast(result ? result.message : "삭제 실패", "error");
                    }
                });
            });
        }

        // 포트 행 추가
        var btnPAdd = currentPane.querySelector('#btnPortAdd');
        if (btnPAdd) {
            btnPAdd.addEventListener('click', function () {
                if (!currentMasterRowData) {
                    if (window.showToast) window.showToast("상단 마스터 펀드를 먼저 선택해주세요.", "warning");
                    return;
                }
                var maxPort = 0;
                var rows = gridPort ? gridPort.getRows() : [];
                rows.forEach(function (r) {
                    var p = parseInt(r.getData().portNum, 10);
                    if (!isNaN(p) && p > maxPort) maxPort = p;
                });
                var newPortNum = String(maxPort + 1);

                var newPort = {
                    corpGr: resolveCorpGr(currentPane),
                    fymd: currentMasterRowData.trYmd,
                    tymd: currentMasterRowData.trYmd,
                    fundCd: currentMasterRowData.fundCd,
                    portNum: newPortNum,
                    tt: "5",
                    instDays: 1,
                    mangiYmd: currentMasterRowData.trYmd,
                    dt: 0,
                    z: 0,
                    jmPer: 0,
                    usdTuja: 0,
                    yearBeta: 0,
                    monBeta: 0,
                    pricePer: 2,
                    isNew: true
                };

                gridPort.addRow(newPort, false).then(function (row) {
                    row.select();
                });
            });
        }

        // 포트 행 복사
        var btnPCopy = currentPane.querySelector('#btnPortCopy');
        if (btnPCopy) {
            btnPCopy.addEventListener('click', function () {
                if (!currentPortRowData || !gridPort) {
                    if (window.showToast) window.showToast("복사할 포트 행을 선택해주세요.", "warning");
                    return;
                }
                var maxPort = 0;
                gridPort.getRows().forEach(function (r) {
                    var p = parseInt(r.getData().portNum, 10);
                    if (!isNaN(p) && p > maxPort) maxPort = p;
                });
                var nextPortNum = String(maxPort + 1);

                var copyData = Object.assign({}, currentPortRowData);
                copyData.portNum = nextPortNum;
                copyData.isNew = true;
                delete copyData.isUpdated;
                delete copyData.isDeleted;

                gridPort.addRow(copyData, false).then(function (row) {
                    row.select();
                });
            });
        }

        // 포트 행 삭제
        var btnPDel = currentPane.querySelector('#btnPortDel');
        if (btnPDel) {
            btnPDel.addEventListener('click', function () {
                if (!gridPort) return;
                var selRows = gridPort.getSelectedRows();
                if (selRows.length === 0) {
                    if (window.showToast) window.showToast("삭제할 포트를 선택해주세요.", "warning");
                    return;
                }
                var targetRow = selRows[0];
                var d = targetRow.getData();
                if (d.isNew) {
                    targetRow.delete();
                } else {
                    targetRow.update({ isDeleted: true });
                    targetRow.getElement().style.display = 'none';
                }
                if (gridDetail) gridDetail.clearData();
            });
        }

        // 종목 행 삽입
        var btnDAdd = currentPane.querySelector('#btnDetailAdd');
        if (btnDAdd) {
            btnDAdd.addEventListener('click', function () {
                if (!currentPortRowData || !gridDetail) {
                    if (window.showToast) window.showToast("포트 행을 먼저 선택해주세요.", "warning");
                    return;
                }
                var nextCol = gridDetail.getRows().length + 1;
                var newDetail = {
                    corpGr: resolveCorpGr(currentPane),
                    ymd: currentPortRowData.tymd,
                    fundCd: currentPortRowData.fundCd,
                    portNum: currentPortRowData.portNum,
                    yjCd: "",
                    xxYjCd: "",
                    usdTuja: 0,
                    targetReturnPer: 1,
                    pricePer: 0,
                    col: nextCol,
                    ovrsExcgCd: "",
                    stockChui: 0,
                    optNominalAmt: 0,
                    settableAmount: 0,
                    isNew: true
                };

                gridDetail.addRow(newDetail, false).then(function (row) {
                    row.select();
                });
            });
        }

        // 종목 행 삭제
        var btnDDel = currentPane.querySelector('#btnDetailDel');
        if (btnDDel) {
            btnDDel.addEventListener('click', function () {
                if (!gridDetail) return;
                var selRows = gridDetail.getSelectedRows();
                if (selRows.length === 0) {
                    if (window.showToast) window.showToast("삭제할 종목을 선택해주세요.", "warning");
                    return;
                }
                var targetRow = selRows[0];
                var d = targetRow.getData();
                if (d.isNew) {
                    targetRow.delete();
                } else {
                    targetRow.update({ isDeleted: true });
                    targetRow.getElement().style.display = 'none';
                }
            });
        }

        // 변동성 재계산 버튼
        var btnRecalc = currentPane.querySelector('#btnJa032aRecalculate');
        if (btnRecalc) {
            btnRecalc.addEventListener('click', function () {
                onRecalculateVolatility();
            });
        }

        // 12. 상단 공통 툴바 표준 계약 이벤트 바인딩 (개발 표준 규칙 04)
        function initEvents() {
            var targets = [pane];
            var vc = pane.querySelector ? pane.querySelector('.view-container') : null;
            if (vc && vc !== pane) targets.push(vc);

            targets.forEach(function (t) {
                // [조회]
                t.onSearch = t.onRetrieve = function () {
                    loadMasterGrid();
                };

                // [저장]
                t.onSave = function () {
                    saveData();
                };

                // [새로고침]
                t.onClear = t.onRefresh = function () {
                    if (gridMaster) gridMaster.clearData();
                    if (gridPort) gridPort.clearData();
                    if (gridDetail) gridDetail.clearData();

                    currentMasterRowData = null;
                    currentPortRowData = null;
                    lastLoadedMasterKey = null;
                    lastLoadedPortKey = null;

                    if (window.showToast) {
                        window.showToast("화면이 초기화되었습니다.", "info");
                    }
                };

                // [입력] (마스터 행 추가)
                t.onInput = t.onInsert = function () {
                    var btnMAdd = currentPane.querySelector('#btnMasterAdd');
                    if (btnMAdd) btnMAdd.click();
                };

                // [회사그룹 변경]
                t.onCorpGrChange = function (newCorpGr) {
                    var cg = newCorpGr || resolveCorpGr(currentPane);
                    if (!cg) return;

                    fetch("/api/usportfoliomodel/ja032a/workdate?corpGr=" + encodeURIComponent(cg))
                        .then(function (res) { return res.json(); })
                        .then(function (data) {
                            if (data && data.workDate) {
                                var ymdInput = currentPane.querySelector('#filterYmd');
                                if (ymdInput) {
                                    ymdInput.value = data.workDate;
                                }
                            }
                            loadTtDddw();
                        })
                        .catch(function (err) {
                            console.warn("[Ja032a] workDate 동기화 실패:", err);
                            loadTtDddw();
                        });
                };

                // [엑셀]
                t.onExcel = function () {
                    if (gridMaster) {
                        var ymdStr = getFilterYmd(currentPane, 'YYYYMMDD') || '';
                        gridMaster.download("xlsx", "포트폴리오모델등록_" + ymdStr + ".xlsx", { sheetName: "펀드마스터" });
                    }
                };
            });
        }

        // 13. 전체 초기화 실행 (MDI 싱글 엔트리포인트 패턴)
        function startInit() {
            if (isInitialized || currentPane.dataset.initialized === "true") return;
            isInitialized = true;
            currentPane.dataset.initialized = "true";

            initEvents();

            loadTtDddw().then(function () {
                initMasterGrid();
                initPortGrid();
                initDetailGrid();

                // 스플리터 초기화
                if (window.AamsSplitter && window.AamsSplitter.init) {
                    window.AamsSplitter.init(currentPane);
                }

                // 파워빌더 소스 원본의 eb_direct_retrieve = true 규격 반영: 초기 로드 시 1회 자동 조회
                loadMasterGrid();
            });
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", startInit);
        } else {
            startInit();
        }

    })();
    </script>
</div>
</html>

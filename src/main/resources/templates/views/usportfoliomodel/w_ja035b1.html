<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-single layout-mobile-stack-container ja035b1-container" th:fragment="ja035b1View">
    <div class="view-toolbar">
        <div class="toolbar-left"><div th:replace="~{fragments/tab_header :: toolbarButtons}"></div></div>
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>
    <div class="filter-bar">
        <div class="filter-left">
            <div th:replace="~{fragments/filter/dc_ymd_dddw :: filter(labelYmd='영업일자', labelDddw='매매구분')}"></div>
        </div>
    </div>
    <section class="grid-section" aria-label="해외채권 매매내역">
        <div class="grid-table-wrapper">
            <div id="gridJa035b1" class="tabulator-aams-grid"></div>
        </div>
    </section>
    <script th:inline="javascript">
    (function () {
        const script = document.currentScript;
        const pane = script && (script.closest('.tab-pane') || script.closest('.view-container'));
        if (!pane) return;
        let initialized = false;
        let grid;
        let gridBuilt = false;
        let maxSeq = 0;
        let deleted = [];
        const options = { trustee: [], currency: [], gyulje_jm_cd: [] };
        const notify = (message, level) => { if (window.showToast) window.showToast(message, level); };
        const corpGr = () => window.resolveCorpGr ? window.resolveCorpGr(pane) : '';
        const ymd = () => window.getFilterYmd ? window.getFilterYmd(pane) : pane.querySelector('#filterYmd').value;
        const trCd = () => pane.querySelector('#filterDddw').value;
        const url = (path, params) => '/api/usportfoliomodel/ja035b1/' + path + '?' + new URLSearchParams(params);
        function changed(cell) {
            const data = cell.getRow().getData();
            if (!data.isNew) { data.isUpdated = true; data.rowStatus = 'U'; }
            calculate(cell.getRow());
        }
        function amount(value) { return Number(value) || 0; }
        function calculate(row) {
            const d = row.getData();
            const trade = Math.trunc(amount(d.trJusu) * amount(d.trDanga)) / 100;
            const settlement = trade + (trCd().startsWith('K') || trCd() === 'E42' ? -1 : 1)
                * (amount(d.trTax) + amount(d.trCost)) + amount(d.passIja);
            row.update({ trAek: trade, gyuljeAek: settlement,
                wonPassIja: Math.trunc(amount(d.passIja) * amount(d.transRt)),
                wonGyuljeAek: Math.trunc(settlement * amount(d.transRt)) });
        }
        function edit(field, title, width, extra) {
            return Object.assign({ field: field, title: title, width: width, editor: 'input',
                cellClick: window.aamsCellEdit, cellEdited: changed }, extra || {});
        }
        function dropdown(field, title, width, key) {
            return edit(field, title, width, {
                editor: 'list', editorParams: function () { return { values: f_dddwctl.getOptions(options, key) }; },
                formatter: function (cell) { return f_dddwctl.getLabel(options, key, cell.getValue()) || cell.getValue() || ''; }
            });
        }
        function search(field, title, width, columnNm, seq) {
            return { title: title, columns: [
                edit(field, title, width, { cellEdited: function (cell) { changed(cell); } }),
                { title: '검색', width: 36, headerSort: false, hozAlign: 'center',
                    formatter: () => '<i class="fa-solid fa-magnifying-glass"></i>',
                    cellClick: function (event, cell) {
                        const row = cell.getRow();
                        if (!window.DynamicCodeSearch) return;
                        window.DynamicCodeSearch.openModal({
                            title: title + ' 검색', columnNm: columnNm, corpGr: corpGr(), seq: seq,
                            initialKeyword: row.getData()[field] || '',
                            onSelect: function (code, name) {
                                const update = { isUpdated: !row.getData().isNew, rowStatus: row.getData().isNew ? 'C' : 'U' };
                                update[field] = code;
                                if (field === 'fundCd') update.xxFundCd = name;
                                if (field === 'yjCd') update.xxYjCd = name;
                                row.update(update);
                            }
                        });
                    } }
            ] };
        }
        function initGrid() {
            grid = new Tabulator(pane.querySelector('#gridJa035b1'), {
                height: '100%', layout: 'fitDataFill', selectableRows: 1, editTriggerEvent: 'click',
                placeholder: '조회된 내역이 없습니다.',
                columns: [
                    { title: 'No.', formatter: 'rownum', width: 55, headerSort: false, hozAlign: 'center' },
                    search('fundCd', '펀드번호', 105, 'rcd', 4),
                    { title: '계좌명', field: 'xxFundCd', width: 180 },
                    dropdown('trustee', '해외보관처', 125, 'trustee'),
                    search('yjCd', '종목', 120, 'yj_cd', 1),
                    { title: '종목명', field: 'xxYjCd', width: 190 },
                    edit('trJusu', '외화액면', 120),
                    edit('trDanga', '외화 매매단가', 125),
                    { title: '외화 매매금액', field: 'trAek', width: 130 },
                    edit('trTax', '세금', 100),
                    edit('trCost', '수수료', 100),
                    edit('passIja', '경과이자', 110, { editable: function (cell) {
                        return /^[JF]/.test(trCd()) && cell.getRow().getData().sjGb !== 'Z';
                    } }),
                    { title: '외화 결제금액', field: 'gyuljeAek', width: 135 },
                    edit('gyuljeYmd', '결제일자', 125, { editor: window.aamsDateEditor,
                        editable: () => !['J10', 'K10'].includes(trCd()) }),
                    dropdown('currency', '통화', 90, 'currency'),
                    edit('transRt', '환율', 105),
                    dropdown('gyuljeJmCd', '결제종목', 130, 'gyulje_jm_cd'),
                    { title: '원화 결제금액', field: 'wonGyuljeAek', width: 135 }
                ]
            });
            grid.on('tableBuilt', function () { gridBuilt = true; });
        }
        function loadOptions() {
            const group = corpGr();
            if (!group || !window.f_dddwctl) return Promise.resolve();
            return f_dddwctl.retrieveMultiple({
                trustee: ['trustee', group, '', 1, ''],
                currency: ['currency', group, '', 1, ''],
                gyulje_jm_cd: ['gyulje_jm_cd', group, '', 1, '']
            }).then(function (result) {
                Object.keys(options).forEach(key => { options[key] = result[key] || []; });
                if (grid && gridBuilt) grid.reformat();
            });
        }
        function loadFilter() {
            const date = ymd();
            const workDate = /*[[${initialYmd}]]*/ '';
            const oldDate = date && workDate && date < workDate;
            const where = "szx1pt.obj_id='W_JA035B1'" +
                (oldDate ? " and szx0gc.tr_cd in (select tr_cd from syt0mg where corp_gr=':corp_gr' and tr_ymd='" + date.replaceAll('-', '.') + "')" : '');
            return window.initFilterDddw(pane, {
                selectId: 'filterDddw', dddwId: 'dddw', corpGr: corpGr(), seq: 1,
                addWhere: where, defaultVal: 'J10'
            });
        }
        async function load() {
            if (!corpGr() || !ymd() || !trCd()) { notify('회사그룹, 영업일자, 매매구분을 확인하세요.', 'warning'); return; }
            try {
                const response = await fetch(url('list', { corpGr: corpGr(), ymd: ymd(), trCd: trCd() }));
                if (!response.ok) throw new Error('조회 실패');
                const rows = await response.json();
                deleted = [];
                maxSeq = Math.max(0, ...rows.map(row => Number(row.trSeq) || 0));
                await grid.setData(rows);
            } catch (error) { notify('조회 중 오류가 발생했습니다.', 'error'); }
        }
        function add() {
            if (!trCd() || !corpGr() || !ymd()) return;
            const row = { isNew: true, rowStatus: 'C', corpGr: corpGr(), trYmd: ymd(),
                trCd: trCd(), trSeq: ++maxSeq, bsType: 0, gyuljeYmd: ymd() };
            grid.addRow(row).then(r => { r.select(); r.getCell('fundCd').edit(); });
        }
        function remove() {
            const selected = grid.getSelectedRows()[0];
            if (!selected) return;
            const data = selected.getData();
            if (!data.isNew) deleted.push(Object.assign({}, data, { isDeleted: true, rowStatus: 'D' }));
            selected.delete();
        }
        async function save() {
            if (window.aamsValidateGridDates && !window.aamsValidateGridDates(grid, ['gyuljeYmd'])) return;
            const rows = grid.getData().filter(row => row.isNew || row.isUpdated).concat(deleted);
            if (!rows.length) { notify('저장할 변경 내역이 없습니다.', 'info'); return; }
            try {
                const response = await fetch(url('save', { corpGr: corpGr() }), {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(rows)
                });
                const result = await response.json();
                if (!response.ok || !result.success) throw new Error(result.message || '저장 실패');
                notify(result.message || '저장되었습니다.', 'success');
                load();
            } catch (error) { notify(error.message || '저장 중 오류가 발생했습니다.', 'error'); }
        }
        function start() {
            if (initialized) return;
            initialized = true;
            if (window.initFilterCalendar) window.initFilterCalendar(pane, { onSelect: loadFilter });
            initGrid();
            loadOptions();
            loadFilter();
            pane.onSearch = load;
            pane.onInput = add;
            pane.onDelete = remove;
            pane.onSave = save;
            pane.onRefresh = () => { deleted = []; grid.clearData(); };
            pane.onCorpGrChange = () => { grid.clearData(); loadOptions(); loadFilter(); };
            pane.onExcel = () => grid.download('xlsx', '해외채권_매매내역.xlsx', { sheetName: '매매내역' });
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
        else start();
    })();
    </script>
</div>
</html>

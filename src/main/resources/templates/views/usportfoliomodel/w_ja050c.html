<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-split w_ja050c-container layout-mobile-stack-container" th:fragment="mainView"
     style="display: flex; flex-direction: column; height: 100%; width: 100%; overflow: hidden; background-color: #ffffff; position: relative;">

    <!-- 1. 상단 공통 툴바 (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <!-- 공통 툴바 버튼 프래그먼트 (조회, 엑셀, 새로고침, 닫기 등) -->
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <!-- 공통 네비게이션 브레드크럼 프래그먼트 -->
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- 2. 상단 필터바 (Row 2: dc_ymd_dddw - 기준일자 + 구분) -->
    <div class="filter-bar">
        <div class="filter-left">
            <div th:replace="~{fragments/filter/dc_ymd_dddw :: filter}" th:with="labelYmd='기준일자', labelDddw='구분'"></div>
        </div>
        <div class="filter-actions d-flex align-items-center gap-1">
            <span class="small text-muted"><i class="fa-solid fa-circle-info text-primary me-1"></i> 고객을 선택하면 우측에 분개장 리포트가 표출됩니다.</span>
        </div>
    </div>

    <!-- 3. 메인 레이아웃 (좌: 고객(펀드) 목록, 우: 분개장 리포트 뷰어) -->
    <div class="layout-split-h split-body layout-mobile-stack" data-split-key="W_JA050C" data-default-ratio="32:68" style="flex: 1; min-height: 0;">
        <!-- 좌측 고객 목록 패널 -->
        <div class="pane-left left-pane split-pane" style="width: 32%;">
            <div class="pane-header">
                <span class="panel-title fw-bold small text-secondary"><i class="fa-solid fa-list me-1"></i> 고객 목록</span>
                <!-- 건수 배지 절대 작성 금지 (Zero-Count-Badge) -->
            </div>
            <div class="pane-body" style="height: calc(100% - 37px);">
                <div id="ja050c-grid" class="tabulator-aams-grid" style="height: 100%; width: 100%;"></div>
            </div>
        </div>

        <div class="split-gutter-h"></div>

        <!-- 우측 RD 미리보기 뷰어 (공통 프래그먼트) -->
        <div th:replace="~{fragments/report/report_viewer :: reportViewerPane(reportTitle='손익 상세현황(분개장)', defaultStatus='고객을 선택하십시오')}"></div>
    </div>

    <!-- 모바일 전용 리포트 모달 (공통 프래그먼트) -->
    <div th:replace="~{fragments/report/report_viewer :: reportMobileModal(modalId='ja050cMobileModal', modalTitle='손익 상세현황(분개장)')}"></div>

    <!-- 4. 화면 전용 스크립트 격리 블록 -->
    <script th:inline="javascript">
        (function () {
            // MDI 최상위 탭 컨테이너 획득 (Zero-Hardcoded-ID & Pane Scoping)
            var currentScript = document.currentScript;
            var currentPane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;
            if (!currentPane) currentPane = document.querySelector('.tab-pane.active') || document;

            var initialYmd = /*[[${ymd}]]*/ '';
            var serverCorpGr = /*[[${corpGr}]]*/ '';

            var grid = null;
            var isInitialized = false;
            var lastLoadedMasterKey = null;
            var currentSelectedRowData = null;
            var reportViewer = null;

            // 모바일 환경 감지
            function isMobileView() {
                if (window.AamsReport && typeof window.AamsReport.isMobileView === 'function') {
                    return window.AamsReport.isMobileView(currentPane);
                }
                var right = currentPane.querySelector('.split-right') || currentPane.querySelector('.report-card');
                if (right && window.getComputedStyle(right).display === 'none') {
                    return true;
                }
                return window.innerWidth <= 876 || (currentPane.clientWidth > 0 && currentPane.clientWidth <= 876);
            }

            // [초기화 1] 달력 컴포넌트
            function initCalendar() {
                if (typeof window.initFilterCalendar === 'function') {
                    window.initFilterCalendar(currentPane, {
                        onSelect: function (selectedDate) {
                            // 규칙 08 준수: 필터 변경 시 자동 조회 금지
                        }
                    });
                } else if (typeof window.initFilterCalendar === 'function') {
                    window.initFilterCalendar(currentPane, initialYmd);
                }
            }

            // [초기화 2] 상단 필터바 구분 DDDW 드롭다운 (일반 '1', 수기 '9')
            function initProcStepDddw() {
                var dddwSelect = currentPane.querySelector('#filterDddw, select[name="dddw"]');
                if (!dddwSelect) return;

                var options = [
                    { code: '1', name: '일반' },
                    { code: '9', name: '수기' }
                ];

                if (window.f_dddwctl && typeof window.f_dddwctl.get2ColItemFormatter === 'function') {
                    window.f_dddwctl.get2ColItemFormatter(dddwSelect, options, {
                        codeTitle: "코드",
                        nameTitle: "구분",
                        defaultVal: "1",
                        onSelect: function (code, name) {
                            dddwSelect.value = code;
                            // 규칙 08 준수: 필터 변경 시 자동 조회를 절대 실행하지 않음
                        }
                    });
                } else {
                    dddwSelect.innerHTML = '<option value="1" selected>일반</option><option value="9">수기</option>';
                }
            }

            // 구분 값 추출 함수
            function getFilterProcStep() {
                var dddwSelect = currentPane.querySelector('#filterDddw, select[name="dddw"]');
                return dddwSelect ? (dddwSelect.value || '1').trim() : '1';
            }

            // [초기화 3] Tabulator 그리드 빌드 (d_fund_select.srd 매핑)
            function initGrid() {
                var gridEl = currentPane.querySelector('#ja050c-grid');
                if (!gridEl) return;

                grid = new Tabulator(gridEl, {
                    layout: "fitColumns",
                    height: "100%",
                    placeholder: "조회된 데이터가 없습니다.",
                    selectableRows: 1,
                    selectableRowsRollingSelection: false,
                    columnDefaults: {
                        vertAlign: "middle"
                    },
                    rowFormatter: function (row) {
                        if (row.isSelected && row.isSelected()) {
                            var el = row.getElement();
                            if (el && !el.classList.contains('tabulator-selected')) {
                                el.classList.add('tabulator-selected');
                            }
                        }
                    },
                    columns: [
                        {
                            title: "No.",
                            formatter: "rownum",
                            hozAlign: "center",
                            headerHozAlign: "center",
                            width: 45,
                            resizable: false,
                            headerSort: false
                        },
                        {
                            title: "",
                            field: "fundSelect",
                            hozAlign: "center",
                            headerHozAlign: "center",
                            width: 38,
                            resizable: false,
                            headerSort: false,
                            formatter: function (cell) {
                                var val = cell.getValue();
                                var checked = (val === '1' || val === 1 || val === true) ? 'checked' : '';
                                return '<input type="checkbox" ' + checked + ' class="t-checkbox" style="cursor: pointer; pointer-events: none;" />';
                            }
                        },
                        {
                            title: "고객명",
                            field: "fundNm",
                            minWidth: 140,
                            hozAlign: "left",
                            headerHozAlign: "center",
                            headerSort: true,
                            formatter: function (cell) {
                                var rowData = cell.getRow().getData();
                                var v = cell.getValue() || "";
                                // 해지일자가 존재하는 경우 보라색/취소선 등 식별 처리 가능 (srd: IsNull(haeji_ymd), fund_color, 16711935)
                                if (rowData.haejiYmd) {
                                    return '<span class="fw-semibold" style="color: #c026d3;">' + v + '</span>';
                                }
                                return '<span class="fw-semibold text-dark">' + v + '</span>';
                            }
                        },
                        {
                            title: "통화",
                            field: "fundCurrency",
                            width: 70,
                            hozAlign: "center",
                            headerHozAlign: "center",
                            headerCssClass: "col-hdr-blue",
                            headerSort: true,
                            formatter: function (cell) {
                                var v = cell.getValue() || "";
                                return '<span class="cell-text-blue font-bold">' + v + '</span>';
                            }
                        }
                    ]
                });

                // 마스터-디테일 삼중 안전망 (Triple Fallback 표준 계약)
                if (typeof setupTabulatorRowSelection === 'function') {
                    setupTabulatorRowSelection(grid, function (row, data) {
                        syncDetail(row, data, false);
                    });
                }

                grid.on("rowClick", function (e, row) {
                    var isRealClick = e && (e.isTrusted !== false);
                    syncDetail(row, row ? row.getData() : null, isRealClick);
                });

                grid.on("rowSelectionChanged", function (data, rows) {
                    if (rows && rows.length > 0 && !isMobileView()) {
                        syncDetail(rows[0], rows[0].getData(), false);
                    }
                });
            }

            // [동기화 및 리포트 연동]
            function syncDetail(row, masterRowData, isUserClick) {
                if (!row) return;
                if (!row.isSelected || !row.isSelected()) {
                    if (grid && typeof grid.deselectRow === 'function') {
                        grid.deselectRow();
                    }
                    row.select();
                }
                var el = (typeof row.getElement === 'function') ? row.getElement() : null;
                if (el && !el.classList.contains('tabulator-selected')) {
                    el.classList.add('tabulator-selected');
                }
                var data = masterRowData || (row.getData ? row.getData() : null);
                if (!data) return;

                currentSelectedRowData = data;

                if (isMobileView()) {
                    // 모바일 환경: 사용자가 행을 직접 클릭했을 때만 모달 팝업으로 리포트 표출
                    if (isUserClick && reportViewer) {
                        var title = (data.fundNm || '') + ' (' + (data.fundCd || '') + ') 손익 상세현황(분개장)';
                        reportViewer.openModal(data, title);
                    }
                } else {
                    var corpGr = (typeof resolveCorpGr === 'function') ? resolveCorpGr(currentPane) : '';
                    var ymd = (typeof getFilterYmd === 'function') ? getFilterYmd(currentPane) : '';
                    var procStep = getFilterProcStep();
                    var fundCd = data.fundCd || '';
                    var currentKey = corpGr + "_" + ymd + "_" + procStep + "_" + fundCd;

                    if (lastLoadedMasterKey === currentKey) return;
                    lastLoadedMasterKey = currentKey;

                    if (reportViewer) {
                        var statusText = "기준일자: " + ymd + " (" + (procStep === '9' ? '수기' : '일반') + ")";
                        reportViewer.load(data, statusText);
                    }
                }
            }

            // [데이터 조회 API 호출]
            function loadData() {
                var corpGr = (typeof resolveCorpGr === 'function') ? resolveCorpGr(currentPane) : '';
                var ymd = (typeof getFilterYmd === 'function') ? getFilterYmd(currentPane) : '';
                var procStep = getFilterProcStep();

                if (!corpGr) {
                    if (typeof showToast === "function") showToast("회사그룹을 선택해주세요.", "warning");
                    return;
                }
                if (!ymd) {
                    if (typeof showToast === "function") showToast("기준일자를 선택해주세요.", "warning");
                    return;
                }

                var url = "/api/usportfoliomodel/ja050c/funds?corpGr=" + encodeURIComponent(corpGr) +
                          "&ymd=" + encodeURIComponent(ymd) +
                          "&procStep=" + encodeURIComponent(procStep);

                fetch(url)
                    .then(function (res) { return res.json(); })
                    .then(function (data) {
                        var list = data || [];
                        lastLoadedMasterKey = null; // 재조회 시 첫 행 선택 보장

                        if (grid) {
                            grid.setData(list).then(function () {
                                if (list.length > 0) {
                                    if (!isMobileView()) {
                                        setTimeout(function () {
                                            var rows = grid.getRows();
                                            if (rows && rows.length > 0) {
                                                grid.deselectRow();
                                                var targetRow = rows[0];
                                                if (typeof targetRow.select === 'function') {
                                                    targetRow.select();
                                                }
                                                var el = (typeof targetRow.getElement === 'function') ? targetRow.getElement() : null;
                                                if (el) {
                                                    el.classList.add('tabulator-selected');
                                                    if (!el.hasAttribute('tabindex')) {
                                                        el.setAttribute('tabindex', '-1');
                                                    }
                                                    try {
                                                        el.focus({ preventScroll: true });
                                                    } catch (e) {}
                                                }
                                            }
                                        }, 60);
                                    } else {
                                        grid.deselectRow();
                                        currentSelectedRowData = null;
                                        lastLoadedMasterKey = null;
                                    }
                                } else {
                                    if (reportViewer) reportViewer.clear();
                                    currentSelectedRowData = null;
                                    lastLoadedMasterKey = null;
                                }
                            });
                        }
                    })
                    .catch(function (err) {
                        console.error("ja050c data fetch error:", err);
                        if (grid) grid.setData([]);
                        if (reportViewer) reportViewer.clear();
                        if (typeof showToast === "function") showToast("조회 중 오류가 발생했습니다.", "error");
                    });
            }

            // [초기화 4] AamsSplitter 분할 레이아웃
            function initSplitter() {
                if (window.AamsSplitter && typeof window.AamsSplitter.init === 'function') {
                    window.AamsSplitter.init(currentPane);
                }
            }

            // [초기화 5] MRD 리포트 뷰어 일체형 바인딩 (규칙 12)
            function initReportViewer() {
                var reportEngine = window.AamsReport;
                if (!reportEngine || typeof reportEngine.bindViewer !== 'function') return;

                reportViewer = reportEngine.bindViewer(currentPane, {
                    reportFile: 'rd_ja050c.mrd',
                    modalId: 'ja050cMobileModal',
                    zoom: 120,
                    getCorpGr: function () {
                        return (typeof resolveCorpGr === 'function') ? resolveCorpGr(currentPane) : '';
                    },
                    buildParams: function (data) {
                        var ymdDot = (typeof getFilterYmd === 'function') ? getFilterYmd(currentPane, 'YYYY.MM.DD') : '';
                        var procStep = getFilterProcStep();
                        var fundCd = (data && data.fundCd) ? data.fundCd : '';

                        return {
                            ymd: ymdDot,
                            proc_step: procStep,
                            fund_cd: fundCd
                        };
                    },
                    getTitle: function (data) {
                        var fundNm = (data && data.fundNm) ? data.fundNm : '';
                        var fundCd = (data && data.fundCd) ? data.fundCd : '';
                        return (fundNm ? (fundNm + ' (' + fundCd + ') ') : '') + '손익 상세현황(분개장)';
                    },
                    getStatus: function (data) {
                        var ymd = (typeof getFilterYmd === 'function') ? getFilterYmd(currentPane) : '';
                        var procStep = getFilterProcStep();
                        return "기준일자: " + ymd + " (" + (procStep === '9' ? '수기' : '일반') + ")";
                    },
                    getDownloadName: function (data) {
                        var ymdRaw = (typeof getFilterYmd === 'function') ? getFilterYmd(currentPane, 'YYYYMMDD') : '';
                        var fundNm = (data && data.fundNm) ? data.fundNm.replace(/[\\/:*?"<>|]/g, "_") : '분개장';
                        var fundCd = (data && data.fundCd) ? data.fundCd : '';
                        return ymdRaw + "_" + fundNm + (fundCd ? ("(" + fundCd + ")") : "");
                    }
                });
            }

            // [초기화 6] 상단 공통 툴바 표준 계약 바인딩
            function initToolbar() {
                // 상단 [조회] 버튼
                currentPane.onRetrieve = currentPane.onSearch = function () {
                    loadData();
                };

                // 상단 [엑셀] 버튼: 리포트 Excel 내보내기 우선
                currentPane.onExcel = function () {
                    if (reportViewer && currentSelectedRowData) {
                        reportViewer.exportFormat('excel');
                    } else if (grid) {
                        grid.download("xlsx", "고객목록_" + ((typeof getFilterYmd === 'function') ? getFilterYmd(currentPane, "YYYYMMDD") : "") + ".xlsx", { sheetName: "고객목록" });
                    }
                };

                // 상단 [새로고침] 버튼 (Zero-Stale-Key 원칙)
                currentPane.onClear = currentPane.onRefresh = function () {
                    if (grid) grid.clearData();
                    if (reportViewer) reportViewer.clear();

                    lastLoadedMasterKey = null;
                    currentSelectedRowData = null;

                    // 자동 재조회 절대 금지 (규칙 08 준수)
                    if (typeof showToast === 'function') {
                        showToast("화면이 초기화되었습니다.", "info");
                    }
                };

                // 회사그룹 변경 콜백
                currentPane.onCorpGrChange = function (newCorpGr) {
                    // 규칙 08 준수: 필터 변경 시 자동 조회를 절대 실행하지 않음
                };
            }

            // [MDI 단일 진입점 실행]
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                initCalendar();
                initProcStepDddw();
                initGrid();
                initSplitter();
                initReportViewer();
                initToolbar();
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", startInit);
            } else {
                startInit();
            }
        })();
    </script>
</div>
</html>

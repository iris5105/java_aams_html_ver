                // 만기일자 누적용 변수 (만기계)
                var mangiJusu = 0;
                var mangiAek = 0;
                var mangiTrPyunga = 0;
                var mangiRiskValue = 0;
                var mangiOptNominalAmt = 0;

                var curPort = null;
                var curMangiYmd = null;

                function pushMangiSummary(mangiYmd) {
                    var label = "만기계";
                    if (mangiYmd) {
                        var parts = mangiYmd.split("-");
                        if (parts.length >= 3) {
                            label = "만기 " + parts[1] + "월 " + parts[2] + "일계";
                        }
                    }
                    result.push({
                        isSummaryRow: true,
                        summaryType: label,
                        jusu: mangiJusu,
                        aek: mangiAek,
                        trPyungaAek: mangiTrPyunga,
                        riskValue: mangiRiskValue,
                        optNominalAmt: mangiOptNominalAmt
                    });
                    mangiJusu = 0;
                    mangiAek = 0;
                    mangiTrPyunga = 0;
                    mangiRiskValue = 0;
                    mangiOptNominalAmt = 0;
                }

                function pushPortSummary() {
                    result.push({
                        isSummaryRow: true,
                        summaryType: "포트계",
                        jusu: portJusu,
                        aek: portAek,
                        trPyungaAek: portTrPyunga,
                        riskValue: portRiskValue,
                        optNominalAmt: portOptNominalAmt
                    });
                    portJusu = 0;
                    portAek = 0;
                    portTrPyunga = 0;
                    portRiskValue = 0;
                    portOptNominalAmt = 0;
                }

                for (var i = 0; i < rawList.length; i++) {
                    var item = rawList[i];
                    var port = item.trustee || "";
                    var mangiYmd = item.lsyYmd || "";

                    // 그룹 변경 체크: 포트 또는 만기일자 변경 시 이전 그룹 소계 출력
                    if (curPort !== null && (curPort !== port || curMangiYmd !== mangiYmd)) {
                        pushMangiSummary(curMangiYmd);
                    }
                    if (curPort !== null && curPort !== port) {
                        pushPortSummary();
                    }

                    curPort = port;
                    curMangiYmd = mangiYmd;

                    // 일반 데이터 행 추가
                    result.push(item);

                    // 누적 계산
                    var jusu = parseFloat(item.jusu) || 0;
                    var aek = parseFloat(item.aek) || 0;
                    var trPyunga = parseFloat(item.trPyungaAek) || 0;
                    var riskValue = parseFloat(item.riskValue) || 0;
                    var optNominalAmt = parseFloat(item.optNominalAmt) || 0;

                    mangiJusu += jusu;
                    mangiAek += aek;
                    mangiTrPyunga += trPyunga;
                    mangiRiskValue += riskValue;
                    mangiOptNominalAmt += optNominalAmt;

                    portJusu += jusu;
                    portAek += aek;
                    portTrPyunga += trPyunga;
                    portRiskValue += riskValue;
                    portOptNominalAmt += optNominalAmt;

                    totalJusu += jusu;
                    totalAek += aek;
                    totalTrPyunga += trPyunga;
                    totalRiskValue += riskValue;
                    totalOptNominalAmt += optNominalAmt;
                }

                // 마지막 남은 그룹 소계 출력
                if (curPort !== null) {
                    pushMangiSummary(curMangiYmd);
                    pushPortSummary();
                }

                // 전체 펀드합계 출력
                result.push({
                    isSummaryRow: true,
                    summaryType: "펀드합계",
                    jusu: totalJusu,
                    aek: totalAek,
                    trPyungaAek: totalTrPyunga,
                    riskValue: totalRiskValue,
                    optNominalAmt: totalOptNominalAmt
                });

                return result;
            }

            // 5. 펀드 목록 조회 (dw_list: d_ja032m1)
            function loadFundList() {
                var corpGr = (typeof resolveCorpGr === 'function') ? resolveCorpGr(currentPane) : (typeof getFilterCorpGr === 'function' ? getFilterCorpGr(currentPane) : '');
                var ymd = (typeof getFilterYmd === 'function') ? getFilterYmd(currentPane) : '';

                if (!corpGr) {
                    if (typeof showToast === 'function') showToast("회사그룹을 선택해주세요.", "warning");
                    return;
                }
                if (!ymd) {
                    if (typeof showToast === 'function') showToast("조회일자를 입력해주세요.", "warning");
                    return;
                }

                // 하위 상태 초기화
                lastFundKey = null;
                lastDetailKey = null;
                currentFundRowData = null;
                currentDetailRowData = null;
                if (gridDetail) gridDetail.clearData();
                if (gridDay) gridDay.clearData();

                var titleDetail = currentPane.querySelector("#titleDetailSection");
                if (titleDetail) titleDetail.innerHTML = '<i class="fa-solid fa-layer-group"></i> 옵션종목 보유현황';
                var titleDay = currentPane.querySelector("#titleDaySection");
                if (titleDay) titleDay.innerHTML = '<i class="fa-solid fa-chart-line"></i> 옵션종목 일별추이';

                var url = "/api/usportfoliomodel/ja032p/fund-list?corpGr=" + encodeURIComponent(corpGr) + "&ymd=" + encodeURIComponent(ymd);

                fetch(url)
                    .then(function (res) {
                        if (!res.ok) throw new Error("펀드 목록 조회 실패: " + res.status);
                        return res.json();
                    })
                    .then(function (data) {
                        gridFund.setData(data || []).then(function () {
                            if (data && data.length > 0) {
                                var rows = gridFund.getRows();
                                if (rows && rows.length > 0) {
                                    rows[0].select();
                                }
                            } else {
                                if (typeof showToast === 'function') showToast("조회된 펀드 내역이 없습니다.", "info");
                            }
                        });
                    })
                    .catch(function (err) {
                        console.error(err);
                        if (typeof showToast === 'function') showToast("펀드 목록 조회 중 오류가 발생했습니다.", "error");
                    });
            }

            // 6. 펀드 선택 시 옵션종목 보유현황 연동 (dw_detail: d_ja032p2)
            function syncFundDetail(row, rowData) {
                if (!row) return;
                var data = rowData || (row.getData ? row.getData() : null);
                if (!data || !data.fundCd) return;

                var corpGr = (typeof resolveCorpGr === 'function') ? resolveCorpGr(currentPane) : (typeof getFilterCorpGr === 'function' ? getFilterCorpGr(currentPane) : '');
                var ymd = (typeof getFilterYmd === 'function') ? getFilterYmd(currentPane) : '';
                var currentKey = corpGr + "_" + ymd + "_" + data.fundCd;

                if (lastFundKey === currentKey) return;
                lastFundKey = currentKey;
                currentFundRowData = data;

                // 하위 일별추이 상태 초기화
                lastDetailKey = null;
                currentDetailRowData = null;
                if (gridDay) gridDay.clearData();

                var titleDetail = currentPane.querySelector("#titleDetailSection");
                if (titleDetail) {
                    titleDetail.innerHTML = '<i class="fa-solid fa-layer-group"></i> 옵션종목 보유현황 <span style="font-size: 0.82rem; font-weight: normal; color: #64748b; margin-left: 8px;">[' + (data.fundCd || '') + ' ' + (data.xxFundCd || data.fundNm || '') + ']</span>';
                }
                var titleDay = currentPane.querySelector("#titleDaySection");
                if (titleDay) {
                    titleDay.innerHTML = '<i class="fa-solid fa-chart-line"></i> 옵션종목 일별추이';
                }

                var url = "/api/usportfoliomodel/ja032p/detail-list?corpGr=" + encodeURIComponent(corpGr) +
                    "&ymd=" + encodeURIComponent(ymd) +
                    "&fundCd=" + encodeURIComponent(data.fundCd);

                fetch(url)
                    .then(function (res) {
                        if (!res.ok) throw new Error("옵션종목 보유현황 조회 실패: " + res.status);
                        return res.json();
                    })
                    .then(function (rawList) {
                        var formattedData = buildDetailSummaryData(rawList || []);
                        gridDetail.setData(formattedData).then(function () {
                            if (formattedData && formattedData.length > 0) {
                                // 요약행이 아닌 첫 번째 실제 데이터 행 선택
                                var rows = gridDetail.getRows();
                                for (var i = 0; i < rows.length; i++) {
                                    var rData = rows[i].getData();
                                    if (rData && !rData.isSummaryRow) {
                                        rows[i].select();
                                        break;
                                    }
                                }
                            }
                        });
                    })
                    .catch(function (err) {
                        console.error(err);
                        if (typeof showToast === 'function') showToast("옵션종목 보유현황 조회 중 오류가 발생했습니다.", "error");
                    });
            }

            // 7. 옵션종목 선택 시 일별추이 현황 연동 (dw_day: d_ja032p3)
            function syncDetailDay(row, rowData) {
                if (!row) return;
                var data = rowData || (row.getData ? row.getData() : null);
                if (!data || data.isSummaryRow) return; // 요약행은 일별조회 제외 (Zero-Summary-Leakage)

                var corpGr = (typeof resolveCorpGr === 'function') ? resolveCorpGr(currentPane) : (typeof getFilterCorpGr === 'function' ? getFilterCorpGr(currentPane) : '');
                var ymd = (typeof getFilterYmd === 'function') ? getFilterYmd(currentPane) : '';
                var fundCd = (currentFundRowData && currentFundRowData.fundCd) ? currentFundRowData.fundCd : data.fundCd;
                var jmCd = data.sym0yzJmCd || data.jmCd;
                var trustee = data.trustee;

                if (!jmCd || !trustee) return;

                var currentKey = corpGr + "_" + ymd + "_" + fundCd + "_" + jmCd + "_" + trustee;
                if (lastDetailKey === currentKey) return;
                lastDetailKey = currentKey;
                currentDetailRowData = data;

                var titleDay = currentPane.querySelector("#titleDaySection");
                if (titleDay) {
                    titleDay.innerHTML = '<i class="fa-solid fa-chart-line"></i> 옵션종목 일별추이 <span style="font-size: 0.82rem; font-weight: normal; color: #64748b; margin-left: 8px;">[' + jmCd + ' ' + (data.sym0yaJmNm || data.jmNm || '') + ' / PORT: ' + trustee + ']</span>';
                }

                var url = "/api/usportfoliomodel/ja032p/day-list?corpGr=" + encodeURIComponent(corpGr) +
                    "&ymd=" + encodeURIComponent(ymd) +
                    "&fundCd=" + encodeURIComponent(fundCd) +
                    "&jmCd=" + encodeURIComponent(jmCd) +
                    "&trustee=" + encodeURIComponent(trustee);

                fetch(url)
                    .then(function (res) {
                        if (!res.ok) throw new Error("옵션종목 일별추이 조회 실패: " + res.status);
                        return res.json();
                    })
                    .then(function (dayList) {
                        gridDay.setData(dayList || []).then(function () {
                            if (dayList && dayList.length > 0) {
                                var rows = gridDay.getRows();
                                if (rows && rows.length > 0) {
                                    rows[0].select();
                                }
                            }
                        });
                    })
                    .catch(function (err) {
                        console.error(err);
                        if (typeof showToast === 'function') showToast("옵션종목 일별추이 조회 중 오류가 발생했습니다.", "error");
                    });
            }

            // 8. 스플리터 초기화 (규정 10: AamsSplitter 표준 연동)
            function initSplitters() {
                if (window.AamsSplitter && typeof window.AamsSplitter.init === 'function') {
                    window.AamsSplitter.init(currentPane);
                }
            }

            // 9. 상단 공통 툴바 표준 계약 바인딩 (규정 08)
            function initToolbarContract() {
                // 상단 [조회]
                currentPane.onSearch = function () {
                    loadFundList();
                };

                // 상단 [새로고침] / [초기화] (Zero-Stale-Key 준수, 자동조회 절대 호출 금지)
                currentPane.onClear = currentPane.onRefresh = function () {
                    if (gridFund) gridFund.clearData();
                    if (gridDetail) gridDetail.clearData();
                    if (gridDay) gridDay.clearData();

                    lastFundKey = null;
                    lastDetailKey = null;
                    currentFundRowData = null;
                    currentDetailRowData = null;

                    var titleDetail = currentPane.querySelector("#titleDetailSection");
                    if (titleDetail) titleDetail.innerHTML = '<i class="fa-solid fa-layer-group"></i> 옵션종목 보유현황';
                    var titleDay = currentPane.querySelector("#titleDaySection");
                    if (titleDay) titleDay.innerHTML = '<i class="fa-solid fa-chart-line"></i> 옵션종목 일별추이';

                    if (typeof showToast === 'function') {
                        showToast("화면이 초기화되었습니다.", "info");
                    }
                };

                // 상단 회사그룹 변경
                currentPane.onCorpGrChange = function (newCorpGr) {
                    // 필터 변경 시 자동 조회를 실행하지 않음 (규정 08-2)
                    if (newCorpGr && typeof fetchCommonWorkDate === 'function') {
                        fetchCommonWorkDate(newCorpGr, function (workDate) {
                            var ymdInput = currentPane.querySelector('#filterYmd') || currentPane.querySelector('input[name="ymd"]');
                            if (ymdInput && workDate) {
                                ymdInput.value = workDate;
                            }
                        });
                    }
                };

                // 상단 [엑셀] 다운로드
                currentPane.onExcel = function () {
                    var ymdStr = (typeof getFilterYmd === 'function') ? getFilterYmd(currentPane, 'YYYYMMDD') : '';
                    if (gridDetail && gridDetail.getData().length > 0) {
                        gridDetail.download("xlsx", "옵션종목보유현황_" + ymdStr + ".xlsx", { sheetName: "보유현황" });
                    } else if (gridFund && gridFund.getData().length > 0) {
                        gridFund.download("xlsx", "펀드목록_" + ymdStr + ".xlsx", { sheetName: "펀드목록" });
                    } else {
                        if (typeof showToast === 'function') showToast("다운로드할 데이터가 없습니다.", "warning");
                    }
                };
            }

            // 달력 컴포넌트 초기화
            function initCalendar() {
                if (window.AamsCalendar && typeof window.AamsCalendar.init === 'function') {
                    window.AamsCalendar.init({
                        inputSelector: currentPane.querySelector("#filterYmd") ? "#filterYmd" : 'input[name="ymd"]',
                        btnSelector: currentPane.querySelector("#btnCalendar") ? "#btnCalendar" : '.btn-calendar',
                        highlightMode: false,
                        getCorpGr: function () {
                            return (typeof resolveCorpGr === 'function') ? resolveCorpGr(currentPane) : (typeof getFilterCorpGr === 'function' ? getFilterCorpGr(currentPane) : '');
                        },
                        onSelect: function (selectedDate) {
                            var ymdInput = currentPane.querySelector('#filterYmd') || currentPane.querySelector('input[name="ymd"]');
                            if (ymdInput) ymdInput.value = selectedDate;
                        }
                    });
                }
            }

            // 단일 진입점 초기화 패턴 (Single Entry-Point, 규정 10-1)
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                initFundGrid();
                initDetailGrid();
                initDayGrid();
                initSplitters();
                initCalendar();
                initToolbarContract();

                // 파워빌더 eb_direct_retrieve = true 기반: 최신 작업일자 동기화 후 초기 진입 1회 자동 조회
                var corpGr = (typeof resolveCorpGr === 'function') ? resolveCorpGr(currentPane) : '';
                var ymdInput = currentPane.querySelector('#filterYmd') || currentPane.querySelector('input[name="ymd"]');
                if (typeof fetchCommonWorkDate === 'function' && corpGr) {
                    fetchCommonWorkDate(corpGr, function (workDate) {
                        if (ymdInput && workDate) {
                            ymdInput.value = workDate;
                        }
                        loadFundList();
                    });
                } else {
                    setTimeout(function () {
                        loadFundList();
                    }, 150);
                }
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", startInit);
            } else {
                startInit();
            }
        })();
    </script>
</div>
</html>

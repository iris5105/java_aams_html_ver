                            hozAlign: "right",
                            headerHozAlign: "center",
                            formatter: function (cell) {
                                var val = cell.getValue();
                                if (val == null || val === '') return '';
                                var num = parseFloat(val);
                                var str = num.toFixed(2);
                                if (num > 0) return '<span class="cell-price-up">' + str + '</span>';
                                if (num < 0) return '<span class="cell-price-down">' + str + '</span>';
                                return '<span class="cell-text-muted">' + str + '</span>';
                            }
                        }
                    ]
                });

                if (typeof window.setupTabulatorRowSelection === 'function') {
                    window.setupTabulatorRowSelection(gridDetail);
                }
            }

            // 4. 스플리터 초기화 (규정 10: AamsSplitter 표준 연동)
            function initSplitters() {
                if (window.AamsSplitter && typeof window.AamsSplitter.init === 'function') {
                    window.AamsSplitter.init(currentPane);
                }
            }

            // 5. 마스터(펀드) 데이터 로드
            function loadFundGrid() {
                var corpGr = resolveCorpGr(currentPane);
                var ymd = getFilterYmd(currentPane, 'YYYY-MM-DD');

                if (!corpGr) {
                    if (window.showToast) window.showToast("회사그룹을 선택해주세요.", "warning");
                    return;
                }
                if (!ymd) {
                    if (window.showToast) window.showToast("조회기준일을 입력해주세요.", "warning");
                    return;
                }

                // 1단계: 포트 시작일(fymd) 조회 후 2단계: 펀드 목록 조회
                fetch('/api/usportfoliomodel/ja032b-dd/fymd?corpGr=' + encodeURIComponent(corpGr) + '&ymd=' + encodeURIComponent(ymd))
                    .then(function (res) { return res.json(); })
                    .then(function (fymdData) {
                        currentFymd = (fymdData && fymdData.fymd) ? fymdData.fymd : ymd;

                        return fetch('/api/usportfoliomodel/ja032b-dd/fund-list?corpGr=' + encodeURIComponent(corpGr) + '&ymd=' + encodeURIComponent(ymd));
                    })
                    .then(function (res) { return res.json(); })
                    .then(function (fundList) {
                        lastFundKey = null;
                        lastStockKey = null;
                        if (gridStock) gridStock.clearData();
                        if (gridDetail) gridDetail.clearData();

                        if (gridFund) {
                            gridFund.setData(fundList || []);
                            // 규정 05-4: 데이터 조회 시 1번째 행 자동 선택
                            setTimeout(function () {
                                var rows = gridFund.getRows();
                                if (rows && rows.length > 0) {
                                    rows[0].select();
                                }
                            }, 50);
                        }
                    })
                    .catch(function (err) {
                        console.error("펀드 목록 조회 중 오류:", err);
                        if (window.showToast) window.showToast("펀드 목록 조회 중 오류가 발생했습니다.", "error");
                    });
            }

            // 6. 펀드 행 선택 시 종목 목록 연동 (syncFundDetail)
            function syncFundDetail(row, rowData) {
                if (!row) return;
                var data = rowData || (row.getData ? row.getData() : null);
                if (!data) return;

                var corpGr = resolveCorpGr(currentPane);
                var ymd = getFilterYmd(currentPane, 'YYYY-MM-DD');
                var fundCd = data.fundCd || "";

                var currentKey = corpGr + "_" + ymd + "_" + fundCd;
                if (lastFundKey === currentKey) return;
                lastFundKey = currentKey;

                currentFundRowData = data;
                lastStockKey = null;
                if (gridDetail) gridDetail.clearData();

                var fymd = currentFymd || ymd;
                var url = '/api/usportfoliomodel/ja032b-dd/stock-list?corpGr=' + encodeURIComponent(corpGr)
                    + '&fymd=' + encodeURIComponent(fymd)
                    + '&tymd=' + encodeURIComponent(ymd)
                    + '&fundCd=' + encodeURIComponent(fundCd);

                fetch(url)
                    .then(function (res) { return res.json(); })
                    .then(function (stockList) {
                        if (gridStock) {
                            gridStock.setData(stockList || []);
                            // 1번째 행 자동 선택
                            setTimeout(function () {
                                var rows = gridStock.getRows();
                                if (rows && rows.length > 0) {
                                    rows[0].select();
                                }
                            }, 50);
                        }
                    })
                    .catch(function (err) {
                        console.error("종목 목록 조회 오류:", err);
                    });
            }

            // 7. 종목 행 선택 시 일별현황 연동 (syncStockDetail)
            function syncStockDetail(row, rowData) {
                if (!row) return;
                var data = rowData || (row.getData ? row.getData() : null);
                if (!data) return;

                var corpGr = resolveCorpGr(currentPane);
                var ymd = getFilterYmd(currentPane, 'YYYY-MM-DD');
                var jmCd = data.yjCd || data.jmCd || "";

                var currentKey = corpGr + "_" + ymd + "_" + jmCd;
                if (lastStockKey === currentKey) return;
                lastStockKey = currentKey;

                currentStockRowData = data;

                var isKrx = (jmCd.indexOf(':') === -1);
                var fymd = currentFymd || ymd;

                // KRX 여부에 따라 컬럼 표시/숨김 및 타이틀 조정
                if (gridDetail) {
                    var tomvCol = gridDetail.getColumn("tomv");
                    if (tomvCol) {
                        tomvCol.updateDefinition({
                            title: isKrx ? "시가총액<br>(KRW,백만)" : "시가총액<br>(USD)"
                        });
                    }

                    var overseasCols = ["ma50", "ma200", "chgPct5d", "chgPct10d", "chgPct15d", "chgPct20d"];
                    overseasCols.forEach(function (colName) {
                        var col = gridDetail.getColumn(colName);
                        if (col) {
                            if (isKrx) {
                                col.hide();
                            } else {
                                col.show();
                            }
                        }
                    });
                }

                var url = '/api/usportfoliomodel/ja032b-dd/detail-list?corpGr=' + encodeURIComponent(corpGr)
                    + '&jmCd=' + encodeURIComponent(jmCd)
                    + '&fymd=' + encodeURIComponent(fymd)
                    + '&tymd=' + encodeURIComponent(ymd);

                fetch(url)
                    .then(function (res) { return res.json(); })
                    .then(function (detailList) {
                        if (gridDetail) {
                            gridDetail.setData(detailList || []);
                        }
                    })
                    .catch(function (err) {
                        console.error("일별현황 상세 조회 오류:", err);
                    });
            }

            // 8. 상단 공통 툴바 표준 계약 바인딩 (규정 08)
            currentPane.onSearch = function () {
                loadFundGrid();
            };

            currentPane.onRefresh = function () {
                if (gridFund) gridFund.clearData();
                if (gridStock) gridStock.clearData();
                if (gridDetail) gridDetail.clearData();

                lastFundKey = null;
                lastStockKey = null;
                currentFundRowData = null;
                currentStockRowData = null;
                currentFymd = null;

                if (window.showToast) {
                    window.showToast("화면이 초기화되었습니다.", "info");
                }
            };

            currentPane.onCorpGrChange = function () {
                // 규정 08: 회사그룹 변경 시 자동 조회하지 않음
            };

            currentPane.onExcel = function () {
                var ymd = getFilterYmd(currentPane, 'YYYYMMDD');
                if (gridDetail && gridDetail.getData().length > 0) {
                    var jmNm = (currentStockRowData && (currentStockRowData.jmNm || currentStockRowData.yjCd)) ? ("_" + currentStockRowData.jmNm) : "";
                    gridDetail.download("xlsx", "종목일별현황" + jmNm + "_" + ymd + ".xlsx", { sheetName: "종목일별현황" });
                } else if (gridStock && gridStock.getData().length > 0) {
                    gridStock.download("xlsx", "종목목록_" + ymd + ".xlsx", { sheetName: "종목목록" });
                } else if (gridFund) {
                    gridFund.download("xlsx", "펀드목록_" + ymd + ".xlsx", { sheetName: "펀드목록" });
                }
            };

            // 9. 단일 진입점 초기화 (규정 10-1.1)
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                initFundGrid();
                initStockGrid();
                initDetailGrid();
                initSplitters();

                // 파워빌더 eb_direct_retrieve = true 규정 반영: 화면 진입 시 초기 1회 자동 조회
                setTimeout(function () {
                    loadFundGrid();
                }, 100);
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", startInit);
            } else {
                startInit();
            }
        })();
    </script>
</div>
</html>

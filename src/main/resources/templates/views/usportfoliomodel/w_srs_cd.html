<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-split srs-cd-container layout-mobile-stack-container" th:fragment="mainView">

    <!-- 1. 상단 공통 툴바 (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- 2. 상단 필터바 (Row 2: dc_xx_ymd 연동) -->
    <div class="filter-bar">
        <div class="filter-left">
            <div th:replace="~{fragments/filter/dc_xx_ymd :: filter(labelYmd='종가기준일', labelXx='해외주식종목', columnNm='rcd', seq=51)}"></div>
        </div>
    </div>

    <!-- 3. 메인 분할 콘텐츠 섹션 (W_SRS_CD_H: 좌측 마스터 50% + 우측 디테일 50%) -->
    <div class="layout-split-h split-body layout-mobile-stack" data-split-key="W_SRS_CD_H" data-default-ratio="50:50">
        <!-- 좌측: 마스터 그리드 (SRS_CD) -->
        <div class="pane-left master-section">
            <div class="pane-header">
                <span class="panel-title"><i class="fa-solid fa-list-check" style="margin-right: 6px;"></i> 해외파생 생성종목 목록 (SRS_CD)</span>
            </div>
            <div class="pane-body">
                <div id="gridMaster" class="tabulator-aams-grid" style="height: 100%;"></div>
            </div>
        </div>

        <!-- 중앙 스플리터 드래그 바 -->
        <div class="split-gutter-h" title="드래그하여 좌우 비율 조절 (더블클릭 시 기본 비율로 복원)"></div>

        <!-- 우측: 디테일 그리드 (SYT0LP) -->
        <div class="pane-right detail-section">
            <div class="pane-header">
                <span class="panel-title"><i class="fa-solid fa-chart-line" style="margin-right: 6px;"></i> 해외옵션 일별 시세 내역 (SYT0LP)</span>
            </div>
            <div class="pane-body">
                <div id="gridDetail" class="tabulator-aams-grid" style="height: 100%;"></div>
            </div>
        </div>
    </div>

    <!-- 4. 화면 전용 격리 스크립트 블록 -->
    <script th:inline="javascript">
        (function () {
            const currentScript = document.currentScript;
            const pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;
            if (!pane) return;

            let gridMaster = null;
            let gridDetail = null;
            let isInitialized = false;
            let lastLoadedMasterKey = null;
            let codeSearchInstance = null;
            let currentSelectedMasterRow = null;

            // [날짜 포맷 헬퍼]
            function formatDateVal(val) {
                if (!val) return '';
                var s = String(val).replace(/[^0-9]/g, '');
                if (s.length === 8) {
                    return s.substring(0, 4) + '-' + s.substring(4, 6) + '-' + s.substring(6, 8);
                }
                return val;
            }

            // [초기화 1] 달력 컴포넌트
            function initCalendar() {
                if (typeof window.initFilterCalendar === 'function') {
                    window.initFilterCalendar(pane, {
                        onSelect: function (selectedDate) {
                            // 규칙 08 준수: 필터 변경 시 자동 조회 금지
                        }
                    });
                }
            }

            // [초기화 2] 다이나믹 코드검색 컴포넌트 (해외주식종목: seq 51)
            function initCodeSearch() {
                if (window.DynamicCodeSearch && typeof window.DynamicCodeSearch.bind === 'function') {
                    codeSearchInstance = window.DynamicCodeSearch.bind({
                        inputEl: "#filterXx",
                        btnEl: "#btnCodeSearchXx",
                        textEl: "#textXxName",
                        columnNm: "rcd",
                        seq: 51,
                        pane: pane,
                        getCorpGr: function () {
                            return (typeof resolveCorpGr === 'function') ? resolveCorpGr(pane) : '';
                        },
                        onSelect: function (code, name, rowData) {
                            // 규칙 08 준수: 필터 조건 변경 시 자동 조회 절대 금지
                        }
                    });
                }
            }

            // [초기화 3] 그리드 구성
            function initGrids() {
                const elMaster = pane.querySelector('#gridMaster');
                if (elMaster) {
                    gridMaster = new Tabulator(elMaster, {
                        height: "100%",
                        layout: "fitDataFill",
                        selectableRows: 1,
                        editTriggerEvent: "click",
                        placeholder: "조회된 데이터가 없습니다.",
                        rowFormatter: function (row) {
                            const data = row.getData();
                            if (data && data.gijunStkprcYn === 'Y') {
                                row.getElement().classList.add('row-point-blue');
                            }
                        },
                        columns: [
                            {
                                title: "No.",
                                formatter: "rownum",
                                width: 50,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                headerSort: false
                            },
                            {
                                title: "파생종목코드",
                                field: "srsCd",
                                width: 160,
                                hozAlign: "left",
                                headerHozAlign: "center",
                                headerSort: true,
                                editor: "input",
                                editable: function (cell) {
                                    var data = cell.getRow().getData();
                                    return !!data.isNew;
                                },
                                cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined
                            },
                            {
                                title: "행사가격",
                                field: "stkprc",
                                width: 95,
                                hozAlign: "right",
                                headerHozAlign: "center",
                                headerSort: true,
                                editor: "number",
                                cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                                formatter: function (cell) {
                                    var val = cell.getValue();
                                    if (val == null || val === '') return '';
                                    return Number(val).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
                                },
                                cellEdited: function (cell) {
                                    var row = cell.getRow();
                                    var data = row.getData();
                                    data.isUpdated = true;
                                    onMasterCodeParamsChanged(row);
                                }
                            },
                            {
                                title: "만기일자",
                                field: "exprDate",
                                width: 110,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                headerSort: true,
                                editor: window.aamsDateEditor || "input",
                                cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                                formatter: function (cell) {
                                    return formatDateVal(cell.getValue());
                                },
                                cellEdited: function (cell) {
                                    if (typeof aamsValidateDateCell === 'function') {
                                        aamsValidateDateCell(cell, function (c, validDate) {
                                            var row = c.getRow();
                                            row.update({ exprDate: validDate, isUpdated: true });
                                            onMasterCodeParamsChanged(row);
                                        });
                                    } else {
                                        var row = cell.getRow();
                                        row.update({ exprDate: formatDateVal(cell.getValue()), isUpdated: true });
                                        onMasterCodeParamsChanged(row);
                                    }
                                }
                            },
                            {
                                title: "",
                                field: "_btn_exprDate",
                                width: 36,
                                minWidth: 36,
                                maxWidth: 36,
                                hozAlign: "center",
                                headerSort: false,
                                resizable: false,
                                formatter: function () {
                                    return '<button type="button" class="btn-grid-addon btn-cal" title="만기일자 선택"><i class="fa-regular fa-calendar-days"></i></button>';
                                },
                                cellClick: function (e, cell) {
                                    e.stopPropagation();
                                    var row = cell.getRow();
                                    var curVal = row.getData().exprDate || "";
                                    if (window.AamsCalendar && typeof window.AamsCalendar.openDatePicker === 'function') {
                                        window.AamsCalendar.openDatePicker({
                                            anchorEl: cell.getElement(),
                                            initialYmd: curVal,
                                            format: 'dash',
                                            onSelect: function (selectedYmd) {
                                                row.update({ exprDate: selectedYmd, isUpdated: true });
                                                onMasterCodeParamsChanged(row);
                                            }
                                        });
                                    }
                                }
                            },
                            {
                                title: "주식종목",
                                field: "blbgTckr",
                                width: 90,
                                hozAlign: "left",
                                headerHozAlign: "center",
                                headerSort: true,
                                editor: "input",
                                editable: function (cell) {
                                    var data = cell.getRow().getData();
                                    return !!data.isNew;
                                },
                                cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                                cellEdited: function (cell) {
                                    var row = cell.getRow();
                                    row.update({ isUpdated: true });
                                    onMasterCodeParamsChanged(row);
                                }
                            },
                            {
                                title: "ISIN 코드",
                                field: "isinCd",
                                minWidth: 120,
                                hozAlign: "left",
                                headerHozAlign: "center",
                                headerSort: true,
                                editor: "input",
                                editable: function (cell) {
                                    var data = cell.getRow().getData();
                                    return !!data.isNew;
                                },
                                cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                                cellEdited: function (cell) {
                                    cell.getRow().update({ isUpdated: true });
                                }
                            },
                            {
                                title: "거래소",
                                field: "exchCd",
                                width: 70,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                headerSort: true,
                                editor: "input",
                                editable: function (cell) {
                                    var data = cell.getRow().getData();
                                    return !!data.isNew;
                                },
                                cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                                cellEdited: function (cell) {
                                    cell.getRow().update({ isUpdated: true });
                                }
                            },
                            {
                                title: "통화",
                                field: "crcCd",
                                width: 60,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                headerSort: true,
                                editor: "input",
                                editable: function (cell) {
                                    var data = cell.getRow().getData();
                                    return !!data.isNew;
                                },
                                cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                                cellEdited: function (cell) {
                                    cell.getRow().update({ isUpdated: true });
                                }
                            },
                            {
                                title: "주차",
                                field: "week",
                                width: 60,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                headerSort: true,
                                editable: false
                            }
                        ]
                    });

                    // 행 선택 삼중 안전망 (규칙 05-3)
                    if (typeof setupTabulatorRowSelection === 'function') {
                        setupTabulatorRowSelection(gridMaster, function (row, data) {
                            currentSelectedMasterRow = row;
                            syncDetail(row, data);
                        });
                    }
                    gridMaster.on("rowClick", function (e, row) {
                        currentSelectedMasterRow = row;
                        syncDetail(row, row ? row.getData() : null);
                    });
                    gridMaster.on("rowSelectionChanged", function (data, rows) {
                        if (rows && rows.length > 0) {
                            currentSelectedMasterRow = rows[0];
                            syncDetail(rows[0], rows[0].getData());
                        }
                    });
                }

                const elDetail = pane.querySelector('#gridDetail');
                if (elDetail) {
                    gridDetail = new Tabulator(elDetail, {
                        height: "100%",
                        layout: "fitDataFill",
                        selectableRows: 1,
                        placeholder: "조회된 시세 데이터가 없습니다.",
                        columns: [
                            {
                                title: "No.",
                                formatter: "rownum",
                                width: 50,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                headerSort: false
                            },
                            {
                                title: "일자",
                                field: "ymd",
                                width: 95,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                headerSort: true
                            },
                            {
                                title: "종가",
                                field: "jonga",
                                width: 90,
                                hozAlign: "right",
                                headerHozAlign: "center",
                                headerSort: true,
                                formatter: function (cell) {
                                    var val = cell.getValue();
                                    if (val == null || val === '') return '';
                                    return Number(val).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                                }
                            },
                            {
                                title: "매수가격<br>(BID)",
                                field: "bid",
                                width: 90,
                                hozAlign: "right",
                                headerHozAlign: "center",
                                headerSort: true,
                                headerCssClass: "col-hdr-red",
                                formatter: function (cell) {
                                    var val = cell.getValue();
                                    if (val == null || val === '') return '';
                                    return '<span class="cell-text-red">' + Number(val).toFixed(2) + '</span>';
                                }
                            },
                            {
                                title: "매도가격<br>(ASK)",
                                field: "ask",
                                width: 90,
                                hozAlign: "right",
                                headerHozAlign: "center",
                                headerSort: true,
                                headerCssClass: "col-hdr-blue",
                                formatter: function (cell) {
                                    var val = cell.getValue();
                                    if (val == null || val === '') return '';
                                    return '<span class="cell-text-blue">' + Number(val).toFixed(2) + '</span>';
                                }
                            },
                            {
                                title: "시간가치",
                                field: "timeGa",
                                width: 90,
                                hozAlign: "right",
                                headerHozAlign: "center",
                                headerSort: true,
                                formatter: function (cell) {
                                    var val = cell.getValue();
                                    if (val == null || val === '') return '';
                                    return Number(val).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                                }
                            },
                            {
                                title: "거래량",
                                field: "tvol",
                                width: 90,
                                hozAlign: "right",
                                headerHozAlign: "center",
                                headerSort: true,
                                formatter: function (cell) {
                                    var val = cell.getValue();
                                    if (val == null || val === '') return '';
                                    return Number(val).toLocaleString();
                                }
                            },
                            {
                                title: "주차",
                                field: "week",
                                width: 60,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                headerSort: true
                            },
                            {
                                title: "수신일시",
                                field: "loadTime",
                                minWidth: 140,
                                hozAlign: "center",
                                headerHozAlign: "center",
                                headerSort: true
                            }
                        ]
                    });
                }
            }

            // [파생종목코드 자동 계산 로직 (itemchanged_next)]
            function onMasterCodeParamsChanged(row) {
                var data = row.getData();
                if (!data) return;

                var exprDate = (data.exprDate || "").replace(/[^0-9]/g, '');
                var stkprc = parseFloat(data.stkprc);
                var blbgTckr = (data.blbgTckr || "").trim();

                if (exprDate.length === 8 && !isNaN(stkprc) && stkprc > 0 && blbgTckr) {
                    var curCd = data.srsCd || "";
                    var pos = curCd.indexOf(' ');
                    var isCallPut = (pos >= 0 && curCd.length >= pos + 3) ? curCd.substring(pos + 1, pos + 3) : '';

                    var url = `/api/usportfoliomodel/srs-cd/calc-code?exprDate=${encodeURIComponent(exprDate)}&blbgTckr=${encodeURIComponent(blbgTckr)}&stkprc=${encodeURIComponent(stkprc)}&isCallPut=${encodeURIComponent(isCallPut)}`;
                    fetch(url)
                        .then(res => res.json())
                        .then(resData => {
                            if (resData && resData.derivedCode) {
                                row.update({ srsCd: resData.derivedCode, isUpdated: true });
                            }
                        })
                        .catch(err => console.error("파생코드 자동 계산 실패:", err));
                }
            }

            // [마스터-디테일 동기화 (syncDetail)]
            function syncDetail(row, masterRowData) {
                if (!row) return;
                var data = masterRowData || (row.getData ? row.getData() : null);
                if (!data) return;

                var currentKey = (data.srsCd || "");
                if (lastLoadedMasterKey === currentKey) return;
                lastLoadedMasterKey = currentKey;

                loadDetailData(data);
            }

            // [조회 1] 마스터 데이터 조회
            function loadMasterData() {
                var codeInput = pane.querySelector("#filterXx");
                var isinCd = codeInput ? (codeInput.value || "").trim() : "";

                fetch(`/api/usportfoliomodel/srs-cd/master?isinCd=${encodeURIComponent(isinCd)}`)
                    .then(res => res.json())
                    .then(data => {
                        lastLoadedMasterKey = null;
                        currentSelectedMasterRow = null;
                        if (gridDetail) gridDetail.clearData();

                        if (gridMaster) {
                            gridMaster.setData(data || []).then(() => {
                                var rows = gridMaster.getRows();
                                if (rows && rows.length > 0) {
                                    rows[0].select();
                                }
                            });
                        }
                    })
                    .catch(err => {
                        console.error("마스터 조회 실패:", err);
                        if (typeof showToast === 'function') showToast("데이터 조회 중 오류가 발생했습니다.", "error");
                    });
            }

            // [조회 2] 디테일 데이터 조회
            function loadDetailData(masterData) {
                if (!masterData || !masterData.srsCd) {
                    if (gridDetail) gridDetail.clearData();
                    return;
                }

                var corpGr = (typeof resolveCorpGr === 'function') ? resolveCorpGr(pane) : '';
                var ymd = (typeof getFilterYmd === 'function') ? getFilterYmd(pane, 'YYYY-MM-DD') : '';

                if (!corpGr) {
                    if (typeof showToast === 'function') showToast("회사그룹 정보가 필요합니다.", "warning");
                    return;
                }
                if (!ymd) {
                    if (typeof showToast === 'function') showToast("종가기준일을 선택해주세요.", "warning");
                    return;
                }

                fetch(`/api/usportfoliomodel/srs-cd/detail?corpGr=${encodeURIComponent(corpGr)}&jmCd=${encodeURIComponent(masterData.srsCd)}&ymd=${encodeURIComponent(ymd)}`)
                    .then(res => res.json())
                    .then(data => {
                        if (gridDetail) {
                            gridDetail.setData(data || []);
                        }
                    })
                    .catch(err => {
                        console.error("디테일 조회 실패:", err);
                        if (typeof showToast === 'function') showToast("상세 시세 조회 중 오류가 발생했습니다.", "error");
                    });
            }

            // [행 추가] 마스터 신규 행 추가
            function addNewMasterRow() {
                if (!gridMaster) return;
                var currentYmd = (typeof getFilterYmd === 'function') ? getFilterYmd(pane, 'YYYY-MM-DD') : '';
                var newRow = {
                    srsCd: "",
                    stkprc: null,
                    exprDate: currentYmd,
                    blbgTckr: "",
                    isinCd: "",
                    exchCd: "",
                    crcCd: "USD",
                    gijunStkprcYn: "N",
                    week: "",
                    isNew: true
                };

                gridMaster.addRow(newRow, true).then(row => {
                    gridMaster.deselectRow();
                    row.select();
                    currentSelectedMasterRow = row;
                });
            }

            // [행 삭제] 마스터 선택 행 삭제
            function deleteMasterRow() {
                if (!gridMaster) return;
                var selectedRows = gridMaster.getSelectedRows();
                if (!selectedRows || selectedRows.length === 0) {
                    if (typeof showToast === 'function') showToast("삭제할 행을 선택하세요.", "warning");
                    return;
                }

                var row = selectedRows[0];
                var data = row.getData();

                if (data.isNew) {
                    row.delete();
                    currentSelectedMasterRow = null;
                    if (gridDetail) gridDetail.clearData();
                } else {
                    data.isDeleted = true;
                    row.getElement().style.display = "none";
                }
            }

            // [데이터 저장] 마스터 수정/신규/삭제 일괄 저장
            function saveMasterData() {
                if (!gridMaster) return;
                var allData = gridMaster.getData();
                var saveList = [];

                for (var i = 0; i < allData.length; i++) {
                    var d = allData[i];
                    if (d.isNew || d.isUpdated || d.isDeleted) {
                        if (d.isNew && (!d.srsCd || !d.srsCd.trim())) {
                            if (typeof showToast === 'function') showToast("신규 행의 파생종목코드를 입력해주세요.", "warning");
                            return;
                        }
                        saveList.push(d);
                    }
                }

                if (saveList.length === 0) {
                    if (typeof showToast === 'function') showToast("저장할 변경 내역이 없습니다.", "info");
                    return;
                }

                fetch('/api/usportfoliomodel/srs-cd/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(saveList)
                })
                .then(res => res.json())
                .then(result => {
                    if (result.success) {
                        if (typeof showToast === 'function') showToast(result.message || "저장되었습니다.", "success");
                        loadMasterData();
                    } else {
                        if (typeof showToast === 'function') showToast(result.message || "저장 실패", "error");
                    }
                })
                .catch(err => {
                    console.error("저장 오류:", err);
                    if (typeof showToast === 'function') showToast("저장 처리 중 오류가 발생했습니다.", "error");
                });
            }

            // [초기화 4] 스플리터
            function initSplitter() {
                if (window.AamsSplitter && typeof window.AamsSplitter.init === 'function') {
                    window.AamsSplitter.init(pane);
                }
            }

            // [초기화 5] 상단 공통 툴바 표준 계약 바인딩
            function initToolbar() {
                pane.onSearch = function () {
                    loadMasterData();
                };

                pane.onInput = function () {
                    addNewMasterRow();
                };

                pane.onSave = function () {
                    saveMasterData();
                };

                pane.onDelete = function () {
                    deleteMasterRow();
                };

                pane.onRefresh = function () {
                    if (codeSearchInstance && typeof codeSearchInstance.clear === 'function') {
                        codeSearchInstance.clear();
                    }
                    if (gridMaster) gridMaster.clearData();
                    if (gridDetail) gridDetail.clearData();
                    lastLoadedMasterKey = null;
                    currentSelectedMasterRow = null;

                    if (typeof showToast === 'function') showToast("화면이 초기화되었습니다.", "info");
                };

                pane.onCorpGrChange = function (newCorpGr) {
                    // 규칙 08 준수: 필터 조건 변경 시 자동 조회 금지
                };

                pane.onExcel = function () {
                    if (gridMaster) {
                        var ymd = (typeof getFilterYmd === 'function') ? getFilterYmd(pane, 'YYYYMMDD') : '';
                        gridMaster.download("xlsx", "해외파생_생성종목목록_" + ymd + ".xlsx", { sheetName: "생성종목" });
                    }
                };
            }

            // [MDI 단일 진입점 실행]
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                initCalendar();
                initCodeSearch();
                initGrids();
                initSplitter();
                initToolbar();
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", startInit);
            } else {
                startInit();
            }
        })();
    </script>
</div>
</html>

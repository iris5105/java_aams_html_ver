<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-split ja020r-container" th:fragment="ja020rView"
     th:data-corp-gr="${corpGr}"
     style="display: flex; flex-direction: column; height: 100%; width: 100%; overflow: hidden;">

    <style>
        /* w_ja020r 화면 전용 툴바 버튼 제어: [입력], [삭제], [엑셀] 숨김, [저장] 표시 */
        .ja020r-container .btn-input,
        .ja020r-container .btn-delete,
        .ja020r-container .btn-excel {
            display: none !important;
        }
        .ja020r-container .btn-save {
            display: inline-flex !important;
        }
    </style>

    <!-- 1. 상단 공통 툴바 (Row 1: [닫기] [새로고침] [조회] [저장] + 브레드크럼) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- 2. 상단 필터바 (Row 2: dc_ymd_dddw 공통 프래그먼트 연동: 수정기준일, 유가증권구분) -->
    <div class="filter-bar">
        <div class="filter-left">
            <div th:replace="~{fragments/filter/dc_ymd_dddw :: filter(labelYmd='수정기준일', labelDddw='유가증권구분')}"></div>
        </div>
        <div class="filter-actions">
            <span id="detail-guide-text" class="info-guide-text" style="font-size: 12px; color: #64748b; font-weight: 500;">
                <i class="fa-solid fa-circle-info" style="color: #3b82f6; margin-right: 4px;"></i>수정취득액 입력 후 상단 [저장] 버튼을 클릭하세요.
            </span>
        </div>
    </div>

    <!-- 3. 본문 스플리터 영역 (Row 3: 좌우 분할 AamsSplitter 표준 규격: 좌 마스터 38%, 우 디테일 62%) -->
    <div class="layout-split-h split-body" data-split-key="W_JA020R" data-default-ratio="38:62">
        
        <!-- 좌측 마스터 패널 (계좌 목록) -->
        <div class="pane-left master-section">
            <div class="pane-header">
                <span class="fw-bold small text-secondary">
                    <i class="fa-solid fa-list" style="color: #000000; margin-right: 6px;"></i> 계좌 목록
                </span>
                <span id="master-count-badge" class="badge-count" style="font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #e2e8f0; color: #475569; font-weight: 600;">0건</span>
            </div>
            <div class="pane-body">
                <div id="ja020r-master-grid" class="tabulator-aams-grid" style="height: 100%; width: 100%;"></div>
            </div>
        </div>

        <!-- 스플리터 구분선 핸들 -->
        <div class="split-gutter-h" title="드래그하여 좌우 비율 조절 (더블클릭 시 기본 비율로 복원)"></div>

        <!-- 우측 디테일 패널 (유가증권 취득액 목록) -->
        <div class="pane-right detail-section">
            <div class="pane-header">
                <span class="fw-bold small text-secondary">
                    <i class="fa-solid fa-coins" style="color: #000000; margin-right: 6px;"></i> 
                    <span id="detail-title">취득액 상세내역</span>
                    <span id="selected-fund-info" style="color: #2563eb; font-weight: normal; margin-left: 6px;"></span>
                </span>
                <div style="display: flex; align-items: center; gap: 6px;">
                    <span id="detail-count-badge" class="badge-count" style="font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #e2e8f0; color: #475569; font-weight: 600;">0건</span>
                </div>
            </div>
            <div class="pane-body">
                <div id="ja020r-detail-grid" class="tabulator-aams-grid" style="height: 100%; width: 100%;"></div>
            </div>
        </div>

    </div>
</div>

<script th:inline="javascript">
(function () {
    var currentScript = document.currentScript;
    var currentPane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : document;
    if (!currentPane) currentPane = document;

    var gridMaster = null;
    var gridDetail = null;
    var isInitialized = false;
    var lastLoadedMasterKey = null;
    var currentSelectedMasterRow = null;
    var secCodeMap = {}; // 증권사 코드->명칭 캐시

    // 개발지침 규칙 19번: 조회 시점 상태 보존 (필터 변경 시 자동조회 금지 및 기존 조회 상태 스냅샷 유지)
    var currentRetrievedDw = 'd_ja020r2c';
    var currentRetrievedYmd = null;
    var currentRetrievedCorpGr = null;

    // 1. 공통 필터값 추출 함수
    function getFilterYmd() {
        var el = currentPane.querySelector('#filterYmd') || currentPane.querySelector('input[name="ymd"]');
        if (el && el.value) return el.value.replace(/[-.]/g, '').trim();
        return (new Date()).toISOString().slice(0, 10).replace(/[-.]/g, '');
    }

    function getFilterDwType() {
        var el = currentPane.querySelector('#filterDddw') || currentPane.querySelector('select[name="dddw"]');
        return (el && el.value) ? el.value.trim() : 'd_ja020r2c';
    }

    function formatDateDot(val) {
        if (!val) return "";
        var s = String(val).replace(/[-.]/g, '').trim();
        if (s.length === 8) {
            return s.substring(0, 4) + "." + s.substring(4, 6) + "." + s.substring(6, 8);
        }
        return val;
    }

    // 2. DDDW 초기화 (개발지침 규칙 7번: 2칸 분할 드롭다운 적용)
    function initFilterDddw() {
        var selectEl = currentPane.querySelector('#filterDddw');
        if (!selectEl) return Promise.resolve();

        var initialDddw = /*[[${dddw}]]*/ 'd_ja020r2c';
        currentRetrievedDw = initialDddw || 'd_ja020r2c';

        if (typeof window.f_dddwctl === 'function') {
            return window.f_dddwctl('dddw | dual', '', 'd_ja020r2c,채권취득액,,d_ja020r2h,현금(전단채)취득액,,d_ja020r2j,주식취득액,', 1, '')
                .then(function (list) {
                    if (typeof window.f_dddwctl.get2ColItemFormatter === 'function') {
                        window.f_dddwctl.get2ColItemFormatter(selectEl, list, {
                            codeTitle: "코드",
                            nameTitle: "유가증권구분",
                            defaultVal: initialDddw || "d_ja020r2c",
                            onSelect: function (code, name) {
                                selectEl.value = code;
                                // 개발지침 규칙 19번: 필터 변경 시 자동조회 및 기존 데이터 변경 절대 금지
                                // 상단 [조회] 버튼을 클릭하기 전까지 master-grid 및 detailgrid의 기존 조회 상태를 온전히 유지함
                            }
                        });
                    } else {
                        selectEl.innerHTML = (list || []).map(function (item) {
                            return '<option value="' + item.code + '">' + item.code + ' : ' + item.name + '</option>';
                        }).join("");
                        selectEl.value = initialDddw || "d_ja020r2c";
                    }
                    updateDetailTitle(currentRetrievedDw);
                    return list;
                })
                .catch(function (err) {
                    console.error("DDDW 초기화 오류:", err);
                });
        }
        return Promise.resolve();
    }

    // 증권사 코드 목록 조회 (f_dddwctl: sec_cd | tr_co_cd)
    function loadSecCodes() {
        var corpGr = resolveCorpGr(currentPane);
        if (typeof window.f_dddwctl === 'function') {
            window.f_dddwctl('sec_cd | tr_co_cd', corpGr, '', 1, '')
                .then(function (list) {
                    secCodeMap = {};
                    if (Array.isArray(list)) {
                        list.forEach(function (item) {
                            if (item.code) {
                                secCodeMap[item.code.trim()] = item.name ? item.name.trim() : item.code;
                            }
                        });
                    }
                    if (gridMaster) gridMaster.redraw(true);
                })
                .catch(function (err) {
                    console.warn("증권사 코드 로드 실패:", err);
                });
        }
    }

    function updateDetailTitle(targetDw) {
        var dw = targetDw || currentRetrievedDw || 'd_ja020r2c';
        var titleEl = currentPane.querySelector('#detail-title');
        if (!titleEl) return;
        if (dw === 'd_ja020r2h') {
            titleEl.textContent = '현금(전단채)취득액 상세내역';
        } else if (dw === 'd_ja020r2j') {
            titleEl.textContent = '주식취득액 상세내역';
        } else {
            titleEl.textContent = '채권취득액 상세내역';
        }
    }

    // 3. 마스터 그리드 초기화 (d_ja020r1.srd 컬럼 100% 매핑)
    function initMasterGrid() {
        var gridEl = currentPane.querySelector('#ja020r-master-grid');
        if (!gridEl) return;

        gridMaster = new Tabulator(gridEl, {
            height: "100%",
            layout: "fitColumns",
            selectable: 1,
            data: [],
            placeholder: "조회된 계좌 목록이 없습니다.",
            columnDefaults: {
                vertAlign: "middle"
            },
            columns: [
                {
                    title: "No.",
                    formatter: "rownum",
                    width: 45,
                    hozAlign: "center",
                    headerHozAlign: "center"
                },
                {
                    title: "증권사",
                    field: "secCd",
                    width: 90,
                    hozAlign: "center",
                    headerHozAlign: "center",
                    formatter: function (cell) {
                        var code = (cell.getValue() || "").trim();
                        return secCodeMap[code] || code;
                    }
                },
                {
                    title: "고객명",
                    field: "fundNm",
                    minWidth: 120,
                    hozAlign: "left",
                    headerHozAlign: "center"
                },
                {
                    title: "관리번호",
                    field: "fundCd",
                    width: 75,
                    hozAlign: "center",
                    headerHozAlign: "center",
                    headerCssClass: "col-hdr-green",
                    formatter: function (cell) {
                        var v = cell.getValue();
                        return v ? '<span class="cell-text-green">' + v + '</span>' : '';
                    }
                },
                {
                    title: "만기일자",
                    field: "afGyulYmd",
                    width: 90,
                    hozAlign: "center",
                    headerHozAlign: "center",
                    formatter: function (cell) {
                        return formatDateDot(cell.getValue());
                    }
                }
            ]
        });

        // 개발지침 규칙 8번: 삼중 안전망 (setupTabulatorRowSelection + rowClick + rowSelectionChanged)
        if (typeof setupTabulatorRowSelection === "function") {
            setupTabulatorRowSelection(gridMaster, function (row, data) {
                syncDetail(row, data);
            });
        }
        gridMaster.on("rowClick", function (e, row) {
            syncDetail(row, row ? row.getData() : null);
        });
        gridMaster.on("rowSelectionChanged", function (data, rows) {
            if (rows && rows.length > 0) {
                syncDetail(rows[0], rows[0].getData());
            }
        });
    }

    // 4. 디테일 그리드 초기화 (d_ja020r2c, d_ja020r2h, d_ja020r2j 동적 컬럼)
    function getDetailColumns(dwType) {
        var cols = [
            {
                title: "No.",
                formatter: "rownum",
                width: 45,
                hozAlign: "center",
                headerHozAlign: "center"
            },
            {
                title: "종목코드",
                field: "jmCd",
                width: 100,
                hozAlign: "center",
                headerHozAlign: "center"
            },
            {
                title: "종목명",
                field: "jmNm",
                minWidth: 160,
                hozAlign: "left",
                headerHozAlign: "center"
            }
        ];

        // 채권 (d_ja020r2c)
        if (dwType === 'd_ja020r2c') {
            cols.push({
                title: "매입일자",
                field: "buyDate",
                width: 90,
                hozAlign: "center",
                headerHozAlign: "center",
                formatter: function (cell) {
                    return formatDateDot(cell.getValue());
                }
            });
            cols.push({
                title: "보유액면",
                field: "bfilAekm",
                width: 110,
                hozAlign: "right",
                headerHozAlign: "center",
                formatter: "money",
                formatterParams: { precision: 0 }
            });
        }
        // 현금(전단채) (d_ja020r2h)
        else if (dwType === 'd_ja020r2h') {
            cols.push({
                title: "보유액면",
                field: "bfilAekm",
                width: 120,
                hozAlign: "right",
                headerHozAlign: "center",
                formatter: "money",
                formatterParams: { precision: 0 }
            });
        }
        // 주식 (d_ja020r2j)
        else if (dwType === 'd_ja020r2j') {
            cols.push({
                title: "보유주수",
                field: "bfilBoyuJusu",
                width: 100,
                hozAlign: "right",
                headerHozAlign: "center",
                formatter: "money",
                formatterParams: { precision: 0 }
            });
        }

        // 공통 취득액
        cols.push({
            title: "취득액",
            field: "bfilChuiAek",
            width: 120,
            hozAlign: "right",
            headerHozAlign: "center",
            formatter: "money",
            formatterParams: { precision: 0 }
        });

        // 수정취득액 (인라인 편집 가능 컬럼: tabsequence=10, color=16711680 즉 파랑)
        cols.push({
            title: "수정취득액",
            field: "alterAek",
            width: 125,
            hozAlign: "right",
            headerHozAlign: "center",
            headerCssClass: "col-hdr-blue",
            editor: "number",
            cellClick: (typeof aamsCellEdit === "function") ? aamsCellEdit : undefined,
            formatter: "money",
            formatterParams: { precision: 0 },
            cellEdited: function (cell) {
                var row = cell.getRow();
                var data = row.getData();
                var val = parseFloat(cell.getValue()) || 0;
                var chui = parseFloat(data.bfilChuiAek) || 0;
                var dw = getFilterDwType();
                var cha = 0;

                // 파워빌더 수식:
                // d_ja020r2h: if (alter_aek=0, 0, alter_aek - bfil_chui_aek)
                // d_ja020r2c / d_ja020r2j: if (alter_aek=0, 0, bfil_chui_aek - alter_aek)
                if (val !== 0) {
                    cha = (dw === 'd_ja020r2h') ? (val - chui) : (chui - val);
                }

                row.update({
                    alterAek: val,
                    chaAek: cha,
                    isUpdated: true
                });
            }
        });

        // 수정차액 (계산 컬럼)
        cols.push({
            title: "수정차액",
            field: "chaAek",
            width: 110,
            hozAlign: "right",
            headerHozAlign: "center",
            formatter: "money",
            formatterParams: { precision: 0 }
        });

        return cols;
    }

    function initDetailGrid(dwType) {
        var gridEl = currentPane.querySelector('#ja020r-detail-grid');
        if (!gridEl) return;

        if (gridDetail) {
            gridDetail.setColumns(getDetailColumns(dwType));
            return;
        }

        gridDetail = new Tabulator(gridEl, {
            height: "100%",
            layout: "fitColumns",
            selectable: 1,
            data: [],
            placeholder: "선택된 계좌의 취득액 내역이 없습니다.",
            columnDefaults: {
                vertAlign: "middle"
            },
            columns: getDetailColumns(dwType)
        });

        if (typeof setupTabulatorRowSelection === "function") {
            setupTabulatorRowSelection(gridDetail);
        }
    }

    function clearDetail() {
        if (gridDetail) gridDetail.clearData();
        lastLoadedMasterKey = null;
        currentSelectedMasterRow = null;
        var dBadge = currentPane.querySelector('#detail-count-badge');
        if (dBadge) dBadge.innerText = "0건";
        var fundInfoEl = currentPane.querySelector('#selected-fund-info');
        if (fundInfoEl) fundInfoEl.textContent = "";
    }

    // 5. 마스터 행 선택에 따른 상세 그리드 연동 (syncDetail: 규칙 8번 표준 규격)
    function syncDetail(row, masterRowData) {
        if (!row) return;
        if (!row.isSelected || !row.isSelected()) {
            row.select();
        }
        var data = masterRowData || (row.getData ? row.getData() : null);
        if (!data) return;

        currentSelectedMasterRow = data;

        // 규칙 19번: 필터바의 현재 변경 중인 값이 아닌, 마스터 데이터가 조회되었던 시점의 조건을 사용하여 정합성 유지
        var corpGr = currentRetrievedCorpGr || resolveCorpGr(currentPane);
        var ymd = currentRetrievedYmd || getFilterYmd();
        var dw = currentRetrievedDw || getFilterDwType();
        var fundCd = data.fundCd || '';
        var currentKey = (corpGr || '') + "_" + (ymd || '') + "_" + (dw || '') + "_" + fundCd;

        if (lastLoadedMasterKey === currentKey) return;
        lastLoadedMasterKey = currentKey;

        var fundInfoEl = currentPane.querySelector('#selected-fund-info');
        if (fundInfoEl) {
            fundInfoEl.textContent = '- ' + (data.fundNm || '') + ' (' + fundCd + ')';
        }

        loadDetailData(corpGr, ymd, fundCd, dw);
    }

    // 6. 상세 데이터 조회 (fetch)
    function loadDetailData(corpGr, ymd, fundCd, dw) {
        if (!fundCd) {
            clearDetail();
            return;
        }

        initDetailGrid(dw);

        var url = "/api/subscriptionrights/ja020r/detail?corpGr=" + encodeURIComponent(corpGr)
            + "&ymd=" + encodeURIComponent(ymd)
            + "&fundCd=" + encodeURIComponent(fundCd)
            + "&dw=" + encodeURIComponent(dw);

        fetch(url)
            .then(function (res) { return res.json(); })
            .then(function (data) {
                var list = data || [];
                var badge = currentPane.querySelector('#detail-count-badge');
                if (badge) badge.innerText = list.length + "건";

                if (gridDetail) {
                    gridDetail.setData(list);
                }
            })
            .catch(function (err) {
                console.error("디테일 취득액 조회 실패:", err);
                if (typeof showToast === "function") showToast("상세내역 조회 중 오류가 발생했습니다.", "error");
            });
    }

    // 7. 마스터 계좌 목록 조회 (loadMaster)
    function loadMaster() {
        var corpGr = resolveCorpGr(currentPane);
        var ymd = getFilterYmd();
        var dw = getFilterDwType();

        if (!corpGr) {
            if (typeof showToast === "function") showToast("회사그룹을 선택해주세요.", "warning");
            return;
        }

        // 사용자가 상단 [조회] 버튼을 클릭했을 때에만 조회 시점 스냅샷 갱신
        currentRetrievedCorpGr = corpGr;
        currentRetrievedYmd = ymd;
        currentRetrievedDw = dw;

        // 마스터 및 디테일의 헤더 타이틀 및 컬럼 구조를 신규 조회 조건에 맞춰 동기화
        updateDetailTitle(currentRetrievedDw);
        initDetailGrid(currentRetrievedDw);

        var url = "/api/subscriptionrights/ja020r/funds?corpGr=" + encodeURIComponent(corpGr)
            + "&ymd=" + encodeURIComponent(ymd)
            + "&dw=" + encodeURIComponent(dw);

        fetch(url)
            .then(function (res) { return res.json(); })
            .then(function (data) {
                var list = data || [];
                var badge = currentPane.querySelector('#master-count-badge');
                if (badge) badge.innerText = list.length + "건";

                lastLoadedMasterKey = null;
                currentSelectedMasterRow = null;

                if (gridMaster) {
                    gridMaster.setData(list).then(function () {
                        if (!list || list.length === 0) {
                            clearDetail();
                        }
                    });
                }
            })
            .catch(function (err) {
                console.error("마스터 계좌 목록 조회 실패:", err);
                if (typeof showToast === "function") showToast("계좌 목록 조회 중 오류가 발생했습니다.", "error");
            });
    }

    // 8. 수정취득액 저장 처리 (onSave)
    function saveAlterAmounts() {
        if (!gridDetail) return;
        var allData = gridDetail.getData() || [];
        var updatedList = allData.filter(function (item) {
            return item && item.isUpdated === true;
        });

        if (updatedList.length === 0) {
            if (typeof showToast === "function") showToast("수정된 내역이 없습니다.", "info");
            return;
        }

        var corpGr = currentRetrievedCorpGr || resolveCorpGr(currentPane);
        var ymd = currentRetrievedYmd || getFilterYmd();
        var dw = currentRetrievedDw || getFilterDwType();

        var payload = {
            corpGr: corpGr,
            ymd: ymd,
            dwType: dw,
            updatedList: updatedList
        };

        fetch("/api/subscriptionrights/ja020r/save", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        })
            .then(function (res) { return res.json(); })
            .then(function (resData) {
                if (resData && resData.success) {
                    if (typeof showToast === "function") showToast(resData.message || "정상적으로 저장되었습니다.", "success");
                    // 저장 성공 후 현재 선택된 계좌의 상세 그리드 재조회
                    if (currentSelectedMasterRow) {
                        lastLoadedMasterKey = null; // 재조회 허용
                        loadDetailData(corpGr, ymd, currentSelectedMasterRow.fundCd, dw);
                    }
                } else {
                    var msg = (resData && resData.message) ? resData.message : "저장에 실패했습니다.";
                    if (typeof showToast === "function") showToast(msg, "error");
                }
            })
            .catch(function (err) {
                console.error("수정취득액 저장 오류:", err);
                if (typeof showToast === "function") showToast("저장 중 통신 오류가 발생했습니다.", "error");
            });
    }

    // 9. 초기화 및 표준 진입점 (startInit)
    function startInit() {
        if (isInitialized) return;
        isInitialized = true;

        initFilterDddw();
        initMasterGrid();
        initDetailGrid(currentRetrievedDw);
        loadSecCodes();

        // 스플리터 초기화 (개발지침 화면 패널 분할 규격)
        if (window.AamsSplitter && typeof window.AamsSplitter.init === 'function') {
            AamsSplitter.init(currentPane);
        }

        // 상단 공통 툴바 표준 계약 함수 연결 (개발지침 규칙 9)
        currentPane.onRetrieve = currentPane.onSearch = function () {
            loadMaster();
        };

        currentPane.onSave = function () {
            saveAlterAmounts();
        };

        currentPane.onClear = function () {
            if (gridMaster) gridMaster.clearData();
            clearDetail();
            var mBadge = currentPane.querySelector('#master-count-badge');
            if (mBadge) mBadge.innerText = "0건";
            currentRetrievedDw = getFilterDwType();
            currentRetrievedYmd = getFilterYmd();
            currentRetrievedCorpGr = resolveCorpGr(currentPane);
            updateDetailTitle(currentRetrievedDw);
            initDetailGrid(currentRetrievedDw);
        };

        // 회사그룹 변경 이벤트 (규칙 19: 필터 변경 시 자동조회 금지, 작업일자 동기화만 수행)
        currentPane.onCorpGrChange = function () {
            var newCorpGr = resolveCorpGr(currentPane);
            if (!newCorpGr) return;
            if (typeof fetchCommonWorkDate === 'function') {
                fetchCommonWorkDate(newCorpGr, function (workDate) {
                    if (workDate) {
                        var ymdInput = currentPane.querySelector('#filterYmd');
                        if (ymdInput) {
                            ymdInput.value = formatDateDot(workDate);
                        }
                    }
                    loadSecCodes();
                });
            } else {
                loadSecCodes();
            }
        };
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startInit);
    } else {
        startInit();
    }
})();
</script>
</html>

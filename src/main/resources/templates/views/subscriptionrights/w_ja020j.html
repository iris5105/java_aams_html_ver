<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-single ja020j-container layout-mobile-stack-container" th:fragment="mainView"
     style="display: flex; flex-direction: column; height: 100%; width: 100%; overflow: hidden; background-color: #ffffff; position: relative;">

    <!-- 1. 상단 공통 툴바 (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- 2. 상단 필터바 (Row 2: dw_c dataobject dc_ymd 연동) -->
    <div class="filter-bar">
        <div class="filter-left">
            <!-- 단일 평가일자 필터 (dc_ymd, 파워빌더 dw_c title="평가일자") -->
            <div th:replace="~{fragments/filter/dc_ymd :: filter(label='평가일자')}"></div>
        </div>
    </div>

    <!-- 3. 메인 콘텐츠 섹션 (단일 그리드 패널) -->
    <div class="grid-section" style="flex: 1 1 auto; height: calc(100% - 95px); padding: 8px 12px; overflow: hidden; display: flex; flex-direction: column;">
        <div class="grid-panel" style="flex: 1 1 auto; height: 100%; display: flex; flex-direction: column; border: 1px solid #cbd5e1; border-radius: 4px; overflow: hidden; background-color: #ffffff; position: relative;">
            <!-- 패널 헤더 (Zero-Count-Badge 준수: 순수 타이틀만 유지) -->
            <div class="sub-grid-header" style="display: flex; align-items: center; justify-content: space-between; padding: 6px 12px; background: #f8fafc; border-bottom: 1px solid #e2e8f0;">
                <span class="sub-title" style="font-weight: 600; font-size: 13px; color: #1e293b;">
                    <i class="fa-solid fa-list-check" style="margin-right: 6px; color: #3b82f6;"></i>현금 펀드/종목별 시가 목록
                </span>
            </div>

            <!-- 그리드 영역 -->
            <div class="grid-table-wrapper" style="flex: 1 1 auto; height: 100%; width: 100%; min-height: 290px; overflow: hidden; position: relative;">
                <div id="gridJa020j" class="tabulator-aams-grid" style="height: 100%;"></div>

                <!-- 로딩 인디케이터 오버레이 -->
                <div id="ja020jLoadingOverlay" style="display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255, 255, 255, 0.75); z-index: 50; align-items: center; justify-content: center; flex-direction: column; gap: 8px;">
                    <i class="fa-solid fa-spinner fa-spin fa-2x" style="color: #3b82f6;"></i>
                    <span style="font-size: 13px; color: #475569; font-weight: 500;">데이터를 불러오는 중입니다...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 4. 화면 전용 격리 스크립트 -->
    <script th:inline="javascript">
        (function () {
            // MDI 최상위 탭 컨테이너 획득 (Zero-Hardcoded-ID & Pane Scoping)
            const currentScript = document.currentScript;
            const pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;
            if (!pane) return;

            let gridJa020j = null;
            let isInitialized = false;
            let pgCdOptions = [];
            const pgCdMap = {};

            // [초기화 1] 달력 컴포넌트 연동 (dc_ymd)
            function initCalendar() {
                if (typeof window.initFilterCalendar === 'function') {
                    window.initFilterCalendar(pane, {
                        onSelect: function (selectedDate) {
                            // 규칙 08 준수: 필터 조건 변경 시 자동 조회는 절대 실행하지 않음 (Always Enabled 수동 조회 정책)
                        }
                    });
                }
            }

            // [초기화 2] 신용등급 DDDW 옵션 로드 (f_dddwctl 연동: w_ja020j.srw seq=2)
            function loadDddwOptions() {
                const corpGr = (typeof resolveCorpGr === 'function') ? resolveCorpGr(pane) : '';
                if (window.f_dddwctl && typeof window.f_dddwctl === 'function') {
                    window.f_dddwctl('pg_cd', 2, corpGr, '', '').then(function (list) {
                        pgCdOptions = list || [];
                        pgCdOptions.forEach(function (opt) {
                            if (opt && opt.cd) {
                                pgCdMap[opt.cd.trim()] = opt.dscr || opt.cd;
                            }
                        });
                        if (gridJa020j) {
                            gridJa020j.redraw(true);
                        }
                    }).catch(function (err) {
                        console.warn("Failed to load pg_cd DDDW options:", err);
                    });
                }
            }

            function getPgCdLabel(val) {
                if (!val) return '';
                const code = String(val).trim();
                return pgCdMap[code] || code;
            }

            // [포맷터 헬퍼]
            function formatNumber(val, decimals) {
                if (val == null || val === '') return '';
                const num = Number(val);
                if (isNaN(num)) return val;
                if (decimals != null && decimals > 0) {
                    return num.toLocaleString('ko-KR', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
                }
                return Math.round(num).toLocaleString('ko-KR');
            }

            // [수정 플래그 표시]
            function markRowUpdated(cell) {
                const row = cell.getRow();
                const data = row.getData();
                data.isUpdated = true;
                data.rowStatus = 'U';
                row.getElement().classList.add('row-modified');
            }

            // [초기화 3] Tabulator 그리드 빌드 (d_ja020j.srd 메타데이터 반영)
            function initGrid() {
                const el = pane.querySelector('#gridJa020j');
                if (!el) return;

                gridJa020j = new Tabulator(el, {
                    height: "100%",
                    layout: "fitColumns",
                    selectableRows: 1,
                    editTriggerEvent: "click", // 원클릭 인라인 편집 진입 (규칙 04 준수)
                    placeholder: "조회된 데이터가 없습니다.",
                    columns: [
                        {
                            title: "No.",
                            formatter: "rownum",
                            width: 50,
                            minWidth: 45,
                            hozAlign: "center",
                            headerHozAlign: "center",
                            headerSort: false,
                            resizable: false
                        },
                        {
                            title: "관리번호",
                            field: "fundCd",
                            width: 100,
                            hozAlign: "center",
                            headerHozAlign: "center",
                            headerSort: true
                        },
                        {
                            title: "계좌명",
                            field: "fundNm",
                            width: 190,
                            hozAlign: "left",
                            headerHozAlign: "center",
                            headerSort: true,
                            formatter: function (cell) {
                                return cell.getValue() || "";
                            }
                        },
                        {
                            title: "종목코드",
                            field: "jmCd",
                            width: 110,
                            hozAlign: "center",
                            headerHozAlign: "center",
                            headerSort: true
                        },
                        {
                            title: "종목명",
                            field: "hjNm",
                            minWidth: 200,
                            hozAlign: "left",
                            headerHozAlign: "center",
                            headerSort: true
                        },
                        {
                            title: "신용등급",
                            field: "pgCd",
                            width: 95,
                            hozAlign: "center",
                            headerHozAlign: "center",
                            headerSort: true,
                            formatter: function (cell) {
                                return getPgCdLabel(cell.getValue());
                            }
                        },
                        {
                            title: "보유액면",
                            field: "aekm",
                            width: 130,
                            hozAlign: "right",
                            headerHozAlign: "center",
                            headerSort: true,
                            formatter: function (cell) {
                                return formatNumber(cell.getValue(), 0);
                            }
                        },
                        {
                            title: "보유취득액",
                            field: "aek",
                            width: 130,
                            hozAlign: "right",
                            headerHozAlign: "center",
                            headerSort: true,
                            formatter: function (cell) {
                                return formatNumber(cell.getValue(), 0);
                            }
                        },
                        {
                            title: "시가평가액",
                            field: "sigaAek",
                            width: 140,
                            hozAlign: "right",
                            headerHozAlign: "center",
                            headerSort: true,
                            cssClass: "cell-editable-blue", // 편집 가능 셀 시각화 (규칙 07 준수)
                            editor: "number",
                            editorParams: {
                                min: 0,
                                step: 1
                            },
                            cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                            formatter: function (cell) {
                                return formatNumber(cell.getValue(), 0);
                            },
                            cellEdited: function (cell) {
                                markRowUpdated(cell);
                            }
                        }
                    ]
                });

                // 단일 그리드 행 선택 시각화 안전망 (규칙 05 준수)
                if (typeof setupTabulatorRowSelection === 'function') {
                    setupTabulatorRowSelection(gridJa020j);
                }
            }

            // [로딩 오버레이 제어]
            function showLoading(show) {
                const overlay = pane.querySelector('#ja020jLoadingOverlay');
                if (overlay) {
                    overlay.style.display = show ? 'flex' : 'none';
                }
            }

            // [조회 실행]
            function loadData() {
                const corpGr = (typeof resolveCorpGr === 'function') ? resolveCorpGr(pane) : '';
                const ymd = (typeof getFilterYmd === 'function') ? getFilterYmd(pane, 'YYYY-MM-DD') : '';

                if (!corpGr) {
                    if (typeof showToast === 'function') showToast("회사그룹 정보가 누락되었습니다.", "warning");
                    return;
                }
                if (!ymd) {
                    if (typeof showToast === 'function') showToast("평가일자를 선택해주세요.", "warning");
                    return;
                }

                showLoading(true);
                const url = `/api/subscriptionrights/ja020j/list?corpGr=${encodeURIComponent(corpGr)}&ymd=${encodeURIComponent(ymd)}`;

                fetch(url)
                    .then(res => {
                        if (!res.ok) throw new Error("서버 응답 오류 (" + res.status + ")");
                        return res.json();
                    })
                    .then(data => {
                        showLoading(false);
                        const list = Array.isArray(data) ? data : [];
                        if (gridJa020j) {
                            gridJa020j.setData(list);
                        }
                    })
                    .catch(err => {
                        showLoading(false);
                        console.error("W_JA020J 조회 오류:", err);
                        if (typeof showToast === 'function') {
                            showToast("데이터 조회 중 오류가 발생했습니다: " + err.message, "error");
                        }
                    });
            }

            // [저장 실행]
            function saveData() {
                if (!gridJa020j) return;

                const corpGr = (typeof resolveCorpGr === 'function') ? resolveCorpGr(pane) : '';
                const ymd = (typeof getFilterYmd === 'function') ? getFilterYmd(pane, 'YYYY-MM-DD') : '';

                if (!corpGr || !ymd) {
                    if (typeof showToast === 'function') showToast("필수 조회 조건이 누락되었습니다.", "warning");
                    return;
                }

                // 수정된 행만 추출
                const allData = gridJa020j.getData();
                const updatedList = allData.filter(item => !!item.isUpdated);

                if (updatedList.length === 0) {
                    if (typeof showToast === 'function') showToast("수정된 항목이 없습니다.", "info");
                    return;
                }

                showLoading(true);

                const payload = {
                    corpGr: corpGr,
                    ymd: ymd,
                    updatedList: updatedList
                };

                fetch('/api/subscriptionrights/ja020j/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                    .then(res => {
                        if (!res.ok) throw new Error("서버 응답 오류 (" + res.status + ")");
                        return res.json();
                    })
                    .then(res => {
                        showLoading(false);
                        if (res.success) {
                            if (typeof showToast === 'function') {
                                showToast(res.message || "정상적으로 저장되었습니다.", "success");
                            }
                            loadData(); // 저장 후 목록 재조회
                        } else {
                            if (typeof showToast === 'function') {
                                showToast(res.message || "저장에 실패했습니다.", "error");
                            }
                        }
                    })
                    .catch(err => {
                        showLoading(false);
                        console.error("W_JA020J 저장 오류:", err);
                        if (typeof showToast === 'function') {
                            showToast("저장 중 오류가 발생했습니다: " + err.message, "error");
                        }
                    });
            }

            // [초기화 4] 상단 공통 툴바 표준 계약 바인딩 (규칙 08 준수)
            function initToolbar() {
                pane.onSearch = function () {
                    loadData();
                };

                pane.onSave = function () {
                    saveData();
                };

                pane.onRefresh = function () {
                    if (gridJa020j) gridJa020j.clearData();
                    if (typeof showToast === 'function') {
                        showToast("화면이 초기화되었습니다.", "info");
                    }
                };

                pane.onCorpGrChange = function (newCorpGr) {
                    // 규칙 08 준수: 필터/회사 변경 시 자동 조회를 절대 실행하지 않음
                    loadDddwOptions();
                };

                pane.onExcel = function () {
                    if (gridJa020j) {
                        const ymdRaw = (typeof getFilterYmd === 'function') ? getFilterYmd(pane, 'YYYYMMDD') : '';
                        gridJa020j.download("xlsx", `현금_펀드_종목별_시가등록_${ymdRaw}.xlsx`, { sheetName: "시가목록" });
                    }
                };
            }

            // [MDI 단일 진입점 실행]
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                initCalendar();
                initGrid();
                loadDddwOptions();
                initToolbar();
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", startInit);
            } else {
                startInit();
            }
        })();
    </script>
</div>
</html>

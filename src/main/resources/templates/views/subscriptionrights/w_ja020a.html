<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container ja020a-container layout-mobile-stack-container" th:fragment="mainView"
     th:attr="data-work-date=${workDate}"
     style="display: flex; flex-direction: column; height: 100%; width: 100%; overflow: hidden; background-color: #ffffff; position: relative;">

    <style>
        /* W_JA990D와 동일한 서브 탭 표시 규격 */
        .ja020a-container > .sub-tab-bar {
            display: flex;
            flex: 0 0 auto;
            gap: 4px;
            padding: 6px 12px 0;
            background: #f8fafc;
            border-bottom: 1px solid #cbd5e1;
            overflow-x: auto;
        }

        .ja020a-container > .sub-tab-bar > .sub-tab-btn {
            display: inline-flex;
            flex-shrink: 0;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            border: 1px solid transparent;
            border-bottom: none;
            border-radius: 4px 4px 0 0;
            background: #e2e8f0;
            font-weight: 600;
            font-size: 13px;
            color: #64748b;
            white-space: nowrap;
            cursor: pointer;
        }

        .ja020a-container > .sub-tab-bar > .sub-tab-btn.active {
            background: #ffffff;
            border-color: #cbd5e1;
            color: #2563eb;
        }

        .ja020a-container > .sub-tab-bar > .sub-tab-btn:focus-visible {
            outline: 2px solid #2563eb;
            outline-offset: -3px;
        }

        /* 모바일에서만 탭1 상세 폼을 중앙 모달로 표시한다. */
        .ja020a-mobile-detail-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(2px);
            z-index: 10400 !important;
        }

        .ja020a-mobile-detail-actions {
            display: none;
            align-items: center;
            gap: 4px;
            margin-left: auto;
        }

        .ja020a-mobile-detail-actions button {
            height: 26px;
            padding: 0 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            background: #ffffff;
            color: #334155;
            cursor: pointer;
            font-size: 11px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .ja020a-mobile-detail-actions button:hover {
            background: #eff6ff;
            color: #2563eb;
        }

        /* 청약구분/관리번호는 상세 패널 폭이 줄어들면 관리번호 묶음이 다음 줄로 이동한다. */
        .ja020a-t1-basic-meta-row {
            flex-wrap: wrap !important;
            row-gap: 8px !important;
        }

        .ja020a-t1-cygb-field {
            flex: 1 1 280px !important;
            min-width: 240px !important;
        }

        .ja020a-t1-jcjoin-field {
            flex: 1 1 220px !important;
            min-width: 220px !important;
        }

        .ja020a-t1-jcjoin-field #t1JcJoin {
            max-width: 100%;
        }

        @media (min-width: 877px) {
            .ja020a-container #paneTab1 > .layout-split-h > .pane-right {
                container: ja020a-detail / inline-size;
                border: 1px solid #cbd5e1;
                border-radius: 6px;
                box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
            }

            .ja020a-container #paneTab1 .pane-right > .panel-header {
                flex-shrink: 0;
                min-height: 36px;
                padding: 8px 14px;
                background: #f1f5f9;
                border-bottom: 1px solid #dbe3ec;
            }

            .ja020a-container #paneTab1 .pane-right > .panel-body {
                min-width: 0;
                padding: 16px !important;
                scrollbar-gutter: stable;
                box-sizing: border-box;
            }

            .ja020a-container #formT1 {
                gap: 10px !important;
                min-width: 0;
            }

            .ja020a-container #formT1 > div:not(.ja020a-t1-basic-meta-row) {
                display: grid !important;
                grid-template-columns: 100px minmax(0, 1fr);
                align-items: start !important;
                gap: 8px !important;
            }

            .ja020a-container #formT1 .form-label {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100px !important;
                min-width: 100px !important;
                min-height: 30px;
                font-weight: 600 !important;
                border-radius: 4px !important;
                white-space: nowrap;
                box-sizing: border-box;
            }

            .ja020a-container #formT1 input:not([type="radio"]):not([type="hidden"]),
            .ja020a-container #formT1 textarea {
                min-width: 0;
                max-width: 100%;
                border-radius: 4px !important;
                box-sizing: border-box;
            }

            .ja020a-container #formT1 input:not([type="radio"]):not([type="hidden"]) {
                height: 30px !important;
            }

            .ja020a-container #formT1 input[readonly] {
                background: #eef2f6 !important;
                color: #475569;
                border-color: #dbe3ec !important;
            }

            .ja020a-container #formT1 input:focus-visible,
            .ja020a-container #formT1 textarea:focus-visible {
                outline: 2px solid #93c5fd;
                outline-offset: 1px;
            }

            .ja020a-container #formT1 .btn-grid-addon {
                flex-shrink: 0;
                width: 28px !important;
                height: 30px !important;
                border-radius: 4px !important;
                color: #2563eb;
            }

            .ja020a-container #formT1 > div > div {
                min-width: 0;
                max-width: 100%;
            }

            .ja020a-container #formT1 > div:has(> .btn-search) {
                grid-template-columns: 100px 90px 28px minmax(0, 240px);
            }

            .ja020a-container #formT1 > div:has(> #t1CyJmCd, > #t1SjJmCd) {
                grid-template-columns: 100px 140px 28px minmax(0, 220px);
            }

            .ja020a-container #formT1 > div:has(> #t1JmNm) {
                grid-template-columns: 100px minmax(0, 260px) 28px 75px;
            }

            .ja020a-container #formT1 > div:has(> .btn-search) > input {
                width: 100% !important;
            }

            .ja020a-container #formT1 .ja020a-t1-basic-meta-row > div {
                min-width: 0 !important;
            }

            .ja020a-container #formT1 .ja020a-t1-cygb-field > div {
                border: 0 !important;
                gap: 10px !important;
                padding: 4px 0 !important;
                flex-wrap: wrap;
            }

            .ja020a-container #formT1 .ja020a-t1-cygb-field label {
                white-space: nowrap;
            }

            .ja020a-container #formT1 .ja020a-t1-date-range {
                flex-wrap: wrap;
                max-width: 320px;
            }

            .ja020a-container #formT1 .ja020a-t1-date-range input {
                flex: 0 1 130px !important;
                width: 130px !important;
            }

            /* 태블릿 또는 Split 조절로 상세 패널이 좁아지면 결과 이름만 다음 행에 표시한다. */
            @container ja020a-detail (max-width: 480px) {
                .ja020a-container #formT1 > div:has(> .btn-search, > #t1JmNm, > #t1CyJmCd, > #t1SjJmCd) {
                    grid-template-columns: 100px minmax(0, 1fr) 28px;
                }

                .ja020a-container #formT1 > div:has(> .btn-search) > input:last-child {
                    grid-column: 2 / -1;
                    max-width: 240px;
                }
            }
        }

        @media (max-width: 876px) {
            /* 탭1은 DETAIL을 모달로 전환하므로 마스터 그리드가 화면 전체 높이를 사용한다. */
            #paneTab1 {
                flex: 1 1 auto !important;
                height: 100% !important;
                min-height: 0 !important;
                overflow: hidden !important;
            }

            #paneTab1 > .layout-split-h {
                flex: 1 1 auto !important;
                height: 100% !important;
                min-height: 0 !important;
                max-height: none !important;
                padding: 4px !important;
                gap: 0 !important;
                overflow: hidden !important;
            }

            #paneTab1 > .layout-split-h > .pane-left.master-section {
                flex: 1 1 auto !important;
                width: 100% !important;
                max-width: 100% !important;
                height: 100% !important;
                min-height: 0 !important;
                max-height: none !important;
                overflow: hidden !important;
            }

            #paneTab1 > .layout-split-h > .pane-left.master-section > .panel-body,
            #paneTab1 > .layout-split-h > .pane-left.master-section > .panel-body > #gridT1 {
                flex: 1 1 auto !important;
                height: 100% !important;
                min-height: 0 !important;
            }

            #paneTab1 > .layout-split-h > .split-gutter-h {
                display: none !important;
            }

            #paneTab1 > .layout-split-h > .pane-right {
                display: none !important;
            }

            #paneTab1 > .layout-split-h > .pane-right.ja020a-mobile-detail-open {
                display: flex !important;
                position: fixed !important;
                top: 50% !important;
                left: 50% !important;
                transform: translate(-50%, -50%) !important;
                width: min(94vw, 560px) !important;
                height: 90vh !important;
                max-height: 90vh !important;
                z-index: 10500 !important;
                background: #ffffff !important;
                border: 1px solid #cbd5e1 !important;
                border-radius: 8px !important;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.2) !important;
                overflow: hidden !important;
                flex-direction: column !important;
            }

            #paneTab1 > .layout-split-h > .pane-right.ja020a-mobile-detail-open .panel-header {
                flex-shrink: 0 !important;
                padding: 8px 12px !important;
                background: #f1f5f9 !important;
                border-bottom: 1px solid #cbd5e1 !important;
            }

            #paneTab1 > .layout-split-h > .pane-right.ja020a-mobile-detail-open .panel-body {
                flex: 1 1 auto !important;
                width: 100% !important;
                min-width: 0 !important;
                min-height: 0 !important;
                max-height: calc(90vh - 46px) !important;
                overflow-y: auto !important;
                overflow-x: hidden !important;
                scrollbar-gutter: stable;
                box-sizing: border-box;
                padding: 12px 14px !important;
            }

            /* 스크롤바를 제외한 실제 폼 폭 안에서 입력란과 검색 버튼을 배치한다. */
            .ja020a-mobile-detail-open #formT1 {
                --ja020a-label-width: clamp(84px, 22vw, 100px);
                width: 100%;
                min-width: 0;
                gap: 12px !important;
                box-sizing: border-box;
            }

            .ja020a-mobile-detail-open #formT1 > div:not(.ja020a-t1-basic-meta-row) {
                display: grid !important;
                grid-template-columns: var(--ja020a-label-width) minmax(0, 1fr);
                gap: 8px !important;
                min-width: 0;
            }

            .ja020a-mobile-detail-open #formT1 > div:has(> .btn-search) {
                grid-template-columns: var(--ja020a-label-width) minmax(0, 1fr) 28px;
            }

            .ja020a-mobile-detail-open #formT1 > div:has(> .btn-search) > input:last-child {
                grid-column: 2 / -1;
                width: 100% !important;
            }

            .ja020a-mobile-detail-open #formT1 > div:has(> #t1JmNm) {
                grid-template-columns: var(--ja020a-label-width) minmax(0, 1fr) 28px 64px;
                column-gap: 6px !important;
            }

            .ja020a-mobile-detail-open #formT1 > div:has(> #t1JmNm) > #t1BalhCo {
                grid-column: 4;
                grid-row: 1;
            }

            .ja020a-mobile-detail-open #formT1 > div:has(> #t1JgTrCoCd, > #t1CyJmCd, > #t1SjJmCd) {
                grid-template-columns: var(--ja020a-label-width) minmax(0, 1fr) 28px minmax(0, 1fr);
                column-gap: 6px !important;
            }

            .ja020a-mobile-detail-open #formT1 > div:has(> #t1JgTrCoCd, > #t1CyJmCd, > #t1SjJmCd) > input:last-child {
                grid-column: 4;
                grid-row: 1;
            }

            /* 코드 입력란과 검색 버튼의 열 너비는 유지하고 결과 이름만 다음 줄로 옮긴다. */
            .ja020a-mobile-detail-open #formT1 > div:has(> #t1CyJmCd, > #t1SjJmCd) > input:last-child {
                grid-column: 2 / -1;
                grid-row: 2;
            }

            .ja020a-mobile-detail-open #formT1 > div:has(> #t1TotGAek) > .form-label {
                white-space: nowrap;
            }

            .ja020a-mobile-detail-open #formT1 > div > div,
            .ja020a-mobile-detail-open #formT1 .form-label,
            .ja020a-mobile-detail-open #formT1 input:not([type="radio"]):not([type="hidden"]),
            .ja020a-mobile-detail-open #formT1 textarea {
                min-width: 0 !important;
                max-width: 100%;
                box-sizing: border-box;
            }

            .ja020a-mobile-detail-open #formT1 .btn-grid-addon {
                flex-shrink: 0;
                height: 30px !important;
                border-radius: 5px !important;
            }

            .ja020a-mobile-detail-open #formT1 .ja020a-t1-basic-meta-row {
                flex-direction: column;
                align-items: stretch !important;
                gap: 12px !important;
            }

            .ja020a-mobile-detail-open #formT1 .ja020a-t1-basic-meta-row > div {
                display: grid !important;
                grid-template-columns: var(--ja020a-label-width) minmax(0, 1fr);
                flex: none !important;
                gap: 8px !important;
                min-width: 0 !important;
                max-width: 100%;
            }

            .ja020a-mobile-detail-open #formT1 .form-label {
                display: flex;
                align-items: center;
                justify-content: center;
                width: var(--ja020a-label-width) !important;
                min-height: 30px;
                font-weight: 600 !important;
                border-radius: 5px !important;
            }

            .ja020a-mobile-detail-open #formT1 input:not([type="radio"]):not([type="hidden"]),
            .ja020a-mobile-detail-open #formT1 textarea {
                width: 100% !important;
                border-radius: 5px !important;
            }

            .ja020a-mobile-detail-open #formT1 input:not([type="radio"]):not([type="hidden"]) {
                height: 30px !important;
            }

            .ja020a-mobile-detail-open #formT1 input[readonly] {
                background: #eef2f6 !important;
                color: #475569;
                border-color: #dbe3ec !important;
            }

            .ja020a-mobile-detail-open #formT1 > div > div:not(.ja020a-t1-cygb-field):not(.ja020a-t1-jcjoin-field) {
                width: 100% !important;
            }

            .ja020a-mobile-detail-open #formT1 .ja020a-t1-cygb-field > div {
                flex-wrap: wrap;
                min-width: 0;
                gap: 6px 10px !important;
                border: 0 !important;
                padding: 4px 0 !important;
            }

            .ja020a-mobile-detail-open #formT1 input:focus-visible,
            .ja020a-mobile-detail-open #formT1 textarea:focus-visible {
                outline: 2px solid #93c5fd;
                outline-offset: 1px;
            }

            .ja020a-mobile-detail-open #formT1 .ja020a-t1-cygb-field label {
                white-space: nowrap;
            }

            .ja020a-mobile-detail-open #formT1 .ja020a-t1-date-range {
                flex-wrap: wrap;
            }

            .ja020a-mobile-detail-open #formT1 .ja020a-t1-date-range input {
                flex: 1 1 110px !important;
            }

            .ja020a-mobile-detail-open #formT1 .ja020a-t1-rates {
                display: grid !important;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px;
                min-width: 0;
            }

            .ja020a-mobile-detail-open #formT1 .ja020a-t1-rates > div {
                min-width: 0;
                gap: 4px !important;
            }

            .ja020a-mobile-detail-open #formT1 .ja020a-t1-rates .form-label {
                flex: 0 0 64px;
                width: 64px !important;
                padding: 4px !important;
                white-space: nowrap;
            }

            .ja020a-mobile-detail-open #formT1 .ja020a-t1-rates > div > div {
                flex: 1;
                min-width: 0;
            }

            .ja020a-mobile-detail-open #formT1 .ja020a-t1-rates span {
                flex-shrink: 0;
            }

            #paneTab1 > .layout-split-h > .pane-right.ja020a-mobile-detail-open .ja020a-mobile-detail-actions {
                display: inline-flex !important;
            }

            /* 탭3도 리포트 DETAIL은 모바일 모달로 사용하고 마스터 그리드만 화면 전체에 표시한다. */
            #paneTab3 {
                flex: 1 1 auto !important;
                height: 100% !important;
                min-height: 0 !important;
                overflow: hidden !important;
            }

            #paneTab3 > .layout-split-v {
                flex: 1 1 auto !important;
                height: 100% !important;
                min-height: 0 !important;
                max-height: none !important;
                gap: 0 !important;
                padding: 4px !important;
                overflow: hidden !important;
            }

            #paneTab3 > .layout-split-v > .pane-top.master-section {
                flex: 1 1 auto !important;
                width: 100% !important;
                height: 100% !important;
                min-height: 0 !important;
                max-height: none !important;
                overflow: hidden !important;
            }

            #paneTab3 > .layout-split-v > .pane-top.master-section > .panel-body,
            #paneTab3 > .layout-split-v > .pane-top.master-section > .panel-body > #gridT5 {
                flex: 1 1 auto !important;
                height: 100% !important;
                min-height: 0 !important;
            }

            #paneTab3 > .layout-split-v > .split-gutter-v,
            #paneTab3 > .layout-split-v > .pane-bottom.report-card {
                display: none !important;
            }
        }
    </style>

    <!-- 1. 상단 공통 툴바 (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- 2. 서브 탭 네비게이션 바 -->
    <div class="sub-tab-bar" aria-label="공모청약 업무 탭">
        <button type="button" class="sub-tab-btn active" id="tabBtn1" data-tab="t1" aria-pressed="true" aria-controls="paneTab1">
            <i class="fa-solid fa-list-check"></i> 기본정보
        </button>
        <button type="button" class="sub-tab-btn" id="tabBtn2" data-tab="t4" aria-pressed="false" aria-controls="paneTab2">
            <i class="fa-solid fa-user-check"></i> 배정등록(청약주수)
        </button>
        <button type="button" class="sub-tab-btn" id="tabBtn3" data-tab="t5" aria-pressed="false" aria-controls="paneTab3">
            <i class="fa-solid fa-file-invoice"></i> 수요예측참여총괄표
        </button>
    </div>

    <div id="ja020aMobileDetailBackdrop" class="ja020a-mobile-detail-backdrop" aria-hidden="true"></div>

    <!-- 3. 메인 콘텐츠 영역 (탭별 컨테이너) -->
    <div class="tab-content-wrapper" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; position: relative;">

        <!-- [TAB 1] 기본정보 (좌: 그리드 + 우: 상세 폼) -->
        <div class="tab-pane-view active" id="paneTab1" style="display: flex; height: 100%; width: 100%; min-height: 0;">
            <div class="layout-split-h split-body layout-mobile-stack" data-split-key="JA020A_T1_H" data-default-ratio="55:45" style="width: 100%; height: 100%; min-height: 0;">
                <!-- 좌측: 공모종목 목록 그리드 (마스터) -->
                <div class="pane-left master-section" style="display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden;">
                    <div class="panel-header">
                        <span class="panel-title"><i class="fa-solid fa-table-list"></i> 공모종목 목록</span>
                    </div>
                    <div class="panel-body" style="flex: 1; min-height: 0; position: relative;">
                        <div id="gridT1" class="tabulator-aams-grid" style="height: 100%;"></div>
                    </div>
                </div>

                <div class="split-gutter-h" title="드래그하여 좌우 비율 조절 (더블클릭 시 기본 비율로 복원)"></div>

                <!-- 우측: 공모종목 상세 입력 폼 (디테일) -->
                <div class="pane-right detail-section" style="display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #ffffff; overflow: hidden;">
                    <div class="panel-header">
                        <span class="panel-title"><i class="fa-solid fa-pen-to-square"></i> 공모종목 상세정보</span>
                        <div class="ja020a-mobile-detail-actions" aria-label="모바일 상세 기능">
                            <button type="button" id="btnT1MobileRefresh" title="상세 새로고침"><i class="fa-solid fa-rotate-right"></i> 새로고침</button>
                            <button type="button" id="btnT1MobileSave" title="상세 저장"><i class="fa-solid fa-floppy-disk"></i> 저장</button>
                            <button type="button" id="btnT1MobileClose" title="상세 닫기"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>
                    <div class="panel-body" style="flex: 1; overflow-y: auto; padding: 14px 18px;">
                        <form id="formT1" onsubmit="return false;" style="display: flex; flex-direction: column; gap: 10px;">
                            <input type="hidden" id="t1CorpGr" name="corpGr" th:value="${corpGr}" />
                            
                            <!-- 청약구분 / 관리번호 -->
                            <div class="ja020a-t1-basic-meta-row" style="display: flex; gap: 12px; align-items: center;">

            // 리포트 뷰어 객체

            // [날짜 포맷 헬퍼]
            function formatDate(str, sep) {
                if (!str) return "";
                var delimiter = sep || "-";
                var s = String(str).replace(/[^0-9]/g, "");
                if (s.length === 8) {
                    return s.substring(0, 4) + delimiter + s.substring(4, 6) + delimiter + s.substring(6, 8);
                }
                return str;
            }

            function formatDotDate(str) {
                return formatDate(str, ".");
            }

            // [금액/수량 포맷 헬퍼]
            function formatNum(val, dec) {
                if (val == null || val === "") return "";
                var num = parseFloat(val);
                if (isNaN(num)) return val;
                if (dec != null && dec > 0) {
                    return num.toLocaleString(undefined, { minimumFractionDigits: dec, maximumFractionDigits: dec });
                }
                return Math.round(num).toLocaleString();
            }

            function unformatNum(val) {
                if (!val) return 0;
                var n = parseFloat(String(val).replace(/,/g, ""));
                return isNaN(n) ? 0 : n;
            }

            // DB 기준 작업일자(SZX0AA.HYUN_YMD) 획득 헬퍼 (Zero-LocalDate-Now 원칙 준수)
            function getEffectiveWorkDate() {
                var paneWorkDate = pane ? pane.getAttribute("data-work-date") : "";
                if (paneWorkDate) return paneWorkDate.replace(/[^0-9]/g, "");
                var sessionDate = (typeof sessionStorage !== "undefined") ? (sessionStorage.getItem("workDate") || sessionStorage.getItem("workYmd")) : "";
                if (sessionDate) return sessionDate.replace(/[^0-9]/g, "");
                if (window.currentWorkDate) return String(window.currentWorkDate).replace(/[^0-9]/g, "");
                var filterYmd = (typeof getFilterYmd === "function") ? getFilterYmd(pane, "YYYYMMDD") : "";
                if (filterYmd) return filterYmd.replace(/[^0-9]/g, "");
                return "";
            }

            function isMobileView() {
                var width = (pane && pane.clientWidth > 0) ? pane.clientWidth : window.innerWidth;
                return width <= 876 || (window.matchMedia && window.matchMedia("(max-width: 876px)").matches);
            }

            function getT1DetailPane() {
                return pane.querySelector("#paneTab1 > .layout-split-h > .pane-right");
            }

            function openT1MobileDetail() {
                if (!isMobileView()) return;
                var detailPane = getT1DetailPane();
                var backdrop = pane.querySelector("#ja020aMobileDetailBackdrop");
                if (detailPane) detailPane.classList.add("ja020a-mobile-detail-open");
                if (backdrop) {
                    backdrop.style.display = "block";
                    backdrop.setAttribute("aria-hidden", "false");
                }
            }

            function closeT1MobileDetail() {
                var detailPane = getT1DetailPane();
                var backdrop = pane.querySelector("#ja020aMobileDetailBackdrop");
                if (detailPane) detailPane.classList.remove("ja020a-mobile-detail-open");
                if (backdrop) {
                    backdrop.style.display = "none";
                    backdrop.setAttribute("aria-hidden", "true");
                }
            }

            function refreshT1MobileDetail() {
                if (!selectedT1RowData && !currentJcJoin) {
                    if (typeof showToast === "function") showToast("먼저 마스터 행을 선택해주세요.", "warning");
                    return;
                }
                var refreshResult = loadT1Data();
                if (refreshResult && typeof refreshResult.then === "function") {
                    refreshResult.then(function (list) {
                        if (list && typeof showToast === "function") {
                            showToast("상세 정보가 새로고침되었습니다.", "info");
                        }
                    });
                }
            }

            function initT1MobileDetailActions() {
                var btnRefresh = pane.querySelector("#btnT1MobileRefresh");
                var btnSave = pane.querySelector("#btnT1MobileSave");
                var btnClose = pane.querySelector("#btnT1MobileClose");
                var backdrop = pane.querySelector("#ja020aMobileDetailBackdrop");
                if (btnRefresh) btnRefresh.addEventListener("click", refreshT1MobileDetail);
                if (btnSave) btnSave.addEventListener("click", saveT1Data);
                if (btnClose) btnClose.addEventListener("click", closeT1MobileDetail);
                if (backdrop) backdrop.addEventListener("click", closeT1MobileDetail);
                window.addEventListener("resize", function () {
                    if (!isMobileView()) closeT1MobileDetail();
                });
                document.addEventListener("keydown", function (event) {
                    if (event.key === "Escape" && isMobileView()) closeT1MobileDetail();
                });
            }

            // [탭2] 청약금 납입일이 현재 일자(작업일자)보다 큰 경우 수정 가능 여부 판별 (d_ja020a_t4a.srd & u_ja020a_t4 ue_protect)
            function isT4aEditable(data) {
                if (!data) return false;
                var workDateStr = getEffectiveWorkDate();
                var rawNabib = data.nabibYmd || data.jcNabibYmd || "";
                var nabibStr = rawNabib ? String(rawNabib).replace(/[^0-9]/g, "") : "";
                if (nabibStr && workDateStr) {
                    return parseInt(nabibStr, 10) > parseInt(workDateStr, 10);
                }
                return data.pVisible === 1;
            }

            // [1. 탭 전환 처리]
            function switchTab(tabId) {
                if (activeTabId === tabId) return;
                activeTabId = tabId;

                if (tabId !== "t1") closeT1MobileDetail();

                // 버튼 스타일 변경
                var tabBtns = pane.querySelectorAll(".sub-tab-btn");
                tabBtns.forEach(function (btn) {
                    var isCurrent = btn.getAttribute("data-tab") === tabId;
                    btn.classList.toggle("active", isCurrent);
                    btn.setAttribute("aria-pressed", String(isCurrent));
                });

                // 패널 표시 전환
                var p1 = pane.querySelector("#paneTab1");
                var p2 = pane.querySelector("#paneTab2");
                var p3 = pane.querySelector("#paneTab3");
                if (p1) p1.style.display = (tabId === "t1") ? "flex" : "none";
                if (p2) p2.style.display = (tabId === "t4") ? "flex" : "none";
                if (p3) p3.style.display = (tabId === "t5") ? "flex" : "none";

                // 리드로우 및 조회 동기화
                setTimeout(function () {
                    // 스플리터 가상 뷰포트 및 그리드 리드로우
                    if (window.AamsSplitter && typeof window.AamsSplitter.redrawGrids === "function") {
                        var activePanel = (tabId === "t1") ? p1 : ((tabId === "t4") ? p2 : p3);
                        if (activePanel) {
                            window.AamsSplitter.redrawGrids(activePanel);
                        }
                    }

                    if (tabId === "t1" && gridT1) {
                        gridT1.redraw(true);
                        if (currentJcJoin) selectRowByJcJoin(gridT1, currentJcJoin);
                    } else if (tabId === "t4" && gridT4a) {
                        gridT4a.redraw(true);
                        if (gridT4b) gridT4b.redraw(true);
                        loadT4aData();
                    } else if (tabId === "t5" && gridT5) {
                        gridT5.redraw(true);
                        loadT5Data();
                    }
                }, 50);
            }

            function selectRowByJcJoin(grid, jcJoin) {
                if (!grid || !jcJoin) return null;
                var rows = grid.getRows();
                for (var i = 0; i < rows.length; i++) {
                    var d = rows[i].getData();
                    if (d && d.jcJoin === jcJoin) {
                        grid.deselectRow();
                        rows[i].select();
                        rows[i].scrollTo();
                        return rows[i];
                    }
                }
                return null;
            }

            function loadT1Data() {
                var corpGr = (typeof resolveCorpGr === "function") ? resolveCorpGr(pane) : "";
                return fetch("/api/subscriptionrights/ja020a/t1/list?corpGr=" + encodeURIComponent(corpGr))
                    .then(function (res) { return res.json(); })
                    .then(function (list) {
                        if (gridT1) {
                            var setDataResult = gridT1.setData(list || []);
                            return Promise.resolve(setDataResult).then(function () {
                                if (currentJcJoin) {
                                    var selectedRow = selectRowByJcJoin(gridT1, currentJcJoin);
                                    // 외부에서 row.select()한 경우에도 폼을 서버 원본으로 명시적으로 복원한다.
                                    if (selectedRow) bindT1Form(selectedRow.getData());
                                }
                                return list || [];
                            });
                        }
                        return list || [];
                    })
                    .catch(function (err) {
                        console.error("T1 Load error:", err);
                        if (typeof showToast === "function") showToast("기본정보 목록 조회 중 오류가 발생했습니다.", "error");
                        return null;
                    });
            }

            function saveT1Data() {
                var corpGr = (typeof resolveCorpGr === "function") ? resolveCorpGr(pane) : "";
                var jmNm = (pane.querySelector("#t1JmNm").value || "").trim();
                if (!jmNm) {
                    if (typeof showToast === "function") showToast("공모종목명을 입력해주세요.", "warning");
                    pane.querySelector("#t1JmNm").focus();
                    return;
                }

                var ymd = (pane.querySelector("#t1Ymd").value || "").trim();
                var cyGbChecked = pane.querySelector("input[name='cyGb']:checked");
                var cyGb = cyGbChecked ? cyGbChecked.value : "1";

                var payload = {
                    corpGr: corpGr,
                    isNew: isT1NewMode,
                    jcJoin: pane.querySelector("#t1JcJoin").value || "",
                    cyGb: cyGb,
                    jmNm: jmNm,
                    balhCo: (pane.querySelector("#t1BalhCo").value || "").trim(),
                    ymd: ymd ? ymd.replace(/[^0-9]/g, "-") : null,
                    jgTrCoCd: (pane.querySelector("#t1JgTrCoCd").value || "").trim(),
                    jgTrCoNm: (pane.querySelector("#t1JgTrCoNm").value || "").trim(),
                    startYmd: pane.querySelector("#t1StartYmd").value ? pane.querySelector("#t1StartYmd").value.replace(/[^0-9]/g, "-") : null,
                    endYmd: pane.querySelector("#t1EndYmd").value ? pane.querySelector("#t1EndYmd").value.replace(/[^0-9]/g, "-") : null,
                    nabibYmd: pane.querySelector("#t1NabibYmd").value ? pane.querySelector("#t1NabibYmd").value.replace(/[^0-9]/g, "-") : null,
                    sjYmd: pane.querySelector("#t1SjYmd").value ? pane.querySelector("#t1SjYmd").value.replace(/[^0-9]/g, "-") : null,
                    totBJusu: unformatNum(pane.querySelector("#t1TotBJusu").value),
                    totGJusu: unformatNum(pane.querySelector("#t1TotGJusu").value),
                    totGDanga: unformatNum(pane.querySelector("#t1TotGDanga").value),
                    totGAek: unformatNum(pane.querySelector("#t1TotGAek").value),
                    cyJmCd: (pane.querySelector("#t1CyJmCd").value || "").trim(),
                    sjJmCd: (pane.querySelector("#t1SjJmCd").value || "").trim(),
                    susuPer: parseFloat(pane.querySelector("#t1SusuPer").value) || null,
                    jkmPer: parseFloat(pane.querySelector("#t1JkmPer").value) || null,
                    competitionRate: parseFloat(pane.querySelector("#t1CompetitionRate").value) || null,
                    bigo: (pane.querySelector("#t1Bigo").value || "").trim()
                };

                fetch("/api/subscriptionrights/ja020a/t1/save", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                })
                    .then(function (res) { return res.json(); })
                    .then(function (res) {
                        if (res.success) {

                    }
                    if (workDateStr && (parseInt(nabibStr, 10) < parseInt(workDateStr, 10))) {
                        var formattedNabib = (typeof formatDate === "function") ? formatDate(rawNabib) : rawNabib;
                        var formattedWork = (typeof formatDate === "function") ? formatDate(workDateStr) : workDateStr;
                        if (typeof showToast === "function") {
                            showToast("청약금 납입일(" + formattedNabib + ")이 현재 일자(" + formattedWork + ")보다 이전이므로 신규 행을 추가할 수 없습니다.", "warning");
                        }
                        return;
                    }

                    if (window.DynamicCodeSearch && typeof window.DynamicCodeSearch.openModal === "function") {
                        window.DynamicCodeSearch.openModal({
                            columnNm: "fund_cd",
                            seq: 1,
                            onSelect: function (code, name) {
                                addFundToT4b(code, name);
                            }
                        });
                    } else {
                        addFundToT4b("", "");
                    }
                };

                pane.onDetailDelete = function () {
                    if (!gridT4b) return;
                    var selectedRows = gridT4b.getSelectedRows();
                    if (!selectedRows || selectedRows.length === 0) {
                        if (typeof showToast === "function") showToast("삭제할 펀드 행을 먼저 선택해주세요.", "warning");
                        return;
                    }
                    var targetRow = selectedRows[0];
                    var data = targetRow.getData();
                    if (!data || data.isSummaryRow) return;

                    if (data.isNew || data._isNew) {
                        targetRow.delete();
                        if (typeof showToast === "function") showToast("추가된 행이 삭제되었습니다.", "info");
                    } else {
                        targetRow.update({ isDeleted: true, _isDeleted: true });
                        targetRow.getElement().classList.add("row-deleted");
                        if (typeof showToast === "function") showToast("삭제 플래그가 설정되었습니다. 저장 시 반영됩니다.", "info");
                    }
                    recalcT4bSummary();
                };

                // 초기 디테일 추가 버튼 비활성화 상태 세팅
                updateT4bAddButtonState(null);
            }

            // [파워빌더 u_ja020a_t4 wf_setenabled: 납입일 경과 시 디테일 row 추가 버튼 비활성화]
            function updateT4bAddButtonState(masterRowData) {
                var btnAdd = pane.querySelector("#paneTab2 .nav-add");
                if (!btnAdd) return;

                if (!masterRowData || !masterRowData.jcJoin) {
                    btnAdd.disabled = true;
                    btnAdd.classList.add("disabled");
                    btnAdd.setAttribute("title", "청약종목을 먼저 선택해주세요.");
                    return;
                }

                var workDateStr = getEffectiveWorkDate();
                var rawNabib = masterRowData.nabibYmd || masterRowData.jcNabibYmd || "";
                var nabibStr = rawNabib ? String(rawNabib).replace(/[^0-9]/g, "") : "";

                var isExpired = false;
                var reason = "";
                if (!nabibStr) {
                    isExpired = true;
                    reason = "청약금 납입일이 지정되지 않아 행을 추가할 수 없습니다.";
                } else if (workDateStr && (parseInt(nabibStr, 10) < parseInt(workDateStr, 10))) {
                    isExpired = true;
                    var formattedNabib = (typeof formatDate === "function") ? formatDate(rawNabib) : rawNabib;
                    var formattedWork = (typeof formatDate === "function") ? formatDate(workDateStr) : workDateStr;
                    reason = "청약금 납입일(" + formattedNabib + ")이 현재 일자(" + formattedWork + ")보다 이전이므로 행을 추가할 수 없습니다.";
                }

                if (isExpired) {
                    btnAdd.disabled = true;
                    btnAdd.classList.add("disabled");
                    btnAdd.setAttribute("title", reason);
                } else {
                    btnAdd.disabled = false;
                    btnAdd.classList.remove("disabled");
                    btnAdd.setAttribute("title", "새로운 행 추가");
                }
            }

            function addFundToT4b(code, name) {
                if (!gridT4b || !selectedT4aRowData) return;

                if (code) {
                    var existingRows = gridT4b.getRows();
                    var isDup = existingRows.some(function (r) {
                        var d = r.getData();
                        return d && !d.isSummaryRow && !d.isDeleted && d.fundCd === code;
                    });
                    if (isDup) {
                        if (typeof showToast === "function") showToast("이미 등록된 펀드입니다.", "warning");
                        return;
                    }
                }

                var corpGr = (typeof resolveCorpGr === "function") ? resolveCorpGr(pane) : "";
                var danga = (selectedT4aRowData && selectedT4aRowData.cyDanga) ? selectedT4aRowData.cyDanga : 0;
                var newRowData = {
                    isNew: true,
                    _isNew: true,
                    isUpdated: true,
                    corpGr: corpGr,
                    jcJoin: selectedT4aRowData.jcJoin || "",
                    jgTrCoCd: selectedT4aRowData.jgTrCoCd || "",
                    fundCd: code || "",
                    xxFundCd: name || "",
                    sunJasanAek: 0,
                    lockEnd: selectedT4aRowData.lockEnd || "",
                    cyJusu: 0,
                    cyDanga: danga,
                    cyAek: 0,
                    cyJkm: 0,
                    cySusu: 0,
                    cyGyulAek: 0
                };

                var rows = gridT4b.getRows();
                var summaryRow = rows.find(function (r) {
                    var d = r.getData();
                    return d && d.isSummaryRow;
                });

                if (summaryRow) {
                    gridT4b.addRow(newRowData, true, summaryRow).then(function (newRow) {
                        if (newRow) {
                            gridT4b.deselectRow();
                            newRow.select();
                            newRow.scrollTo();
                        }
                        recalcT4bSummary();
                    });
                } else {
                    gridT4b.addRow(newRowData, false).then(function (newRow) {
                        if (newRow) {
                            gridT4b.deselectRow();
                            newRow.select();
                            newRow.scrollTo();
                        }
                        recalcT4bSummary();
                    });
                }
            }

            function syncT4Detail(data) {
                if (!data) {
                    selectedT4aRowData = null;
                    updateT4bAddButtonState(null);
                    return;
                }
                selectedT4aRowData = data;
                currentJcJoin = data.jcJoin || "";
                updateT4bAddButtonState(data);

                var key = (data.corpGr || "") + "_" + (data.jcJoin || "") + "_" + (data.jgTrCoCd || "");
                if (lastLoadedT4Key === key) return;
                lastLoadedT4Key = key;

                var corpGr = (typeof resolveCorpGr === "function") ? resolveCorpGr(pane) : "";
                var url = "/api/subscriptionrights/ja020a/t4/detail-list?corpGr=" + encodeURIComponent(corpGr)
                    + "&jcJoin=" + encodeURIComponent(data.jcJoin || "")
                    + "&jgTrCoCd=" + encodeURIComponent(data.jgTrCoCd || "")
                    + "&ymd=" + encodeURIComponent(formatDate(data.ymd) || "");

                fetch(url)
                    .then(function (res) { return res.json(); })
                    .then(function (list) {
                        if (gridT4b) {
                            var processed = (list || []).map(function (item) {
                                var aek = item.cyAek || 0;
                                var susu = item.cySusu || 0;
                                item.cyGyulAek = aek + susu;
                                return item;
                            });
                            gridT4b.setData(processed);
                            recalcT4bSummary();
                        }
                    })
                    .catch(function (err) {
                        console.error("T4 detail load error:", err);
                        if (typeof showToast === "function") showToast("펀드별 배정 목록 조회 중 오류가 발생했습니다.", "error");
                    });
            }

            function recalcT4bSummary() {
                if (!gridT4b) return;
                var rows = gridT4b.getRows();
                var normalRows = rows.filter(function (r) {
                    var d = r.getData();
                    return d && !d.isSummaryRow;
                });
                var summaryRow = rows.find(function (r) {
                    var d = r.getData();
                    return d && d.isSummaryRow;
                });

                if (normalRows.length === 0) {
                    if (summaryRow) summaryRow.delete();
                    return;
                }

                var totJusu = 0;
                var totAek = 0;
                var totJkm = 0;
                var totSusu = 0;
                var totGyulAek = 0;

                normalRows.forEach(function (r) {
                    var d = r.getData();
                    totJusu += (parseFloat(d.cyJusu) || 0);
                    totAek += (parseFloat(d.cyAek) || 0);
                    totJkm += (parseFloat(d.cyJkm) || 0);
                    totSusu += (parseFloat(d.cySusu) || 0);
                    totGyulAek += (parseFloat(d.cyGyulAek) || 0);
                });

                var sumData = {
                    isSummaryRow: true,
                    fundCd: "합계",
                    xxFundCd: "",
                    cyJusu: totJusu,
                    cyAek: totAek,
                    cyJkm: totJkm,
                    cySusu: totSusu,
                    cyGyulAek: totGyulAek
                };

                if (summaryRow) {
                    summaryRow.update(sumData);
                } else {
                    gridT4b.addRow(sumData, false);
                }
            }

            function loadT4aData() {
                var corpGr = (typeof resolveCorpGr === "function") ? resolveCorpGr(pane) : "";
                lastLoadedT4Key = null;
                fetch("/api/subscriptionrights/ja020a/t4/header-list?corpGr=" + encodeURIComponent(corpGr))
                    .then(function (res) { return res.json(); })
                    .then(function (list) {
                        if (gridT4a) {
                            gridT4a.setData(list || []);
                            if (list && list.length > 0) {
                                if (currentJcJoin) {
                                    selectRowByJcJoin(gridT4a, currentJcJoin);
                                }
                            } else {
                                selectedT4aRowData = null;
                                updateT4bAddButtonState(null);
                                if (gridT4b) gridT4b.clearData();
                            }
                        }
                    })
                    .catch(function (err) {
                        console.error("T4 header load error:", err);
                        if (typeof showToast === "function") showToast("청약종목 목록 조회 중 오류가 발생했습니다.", "error");
                    });
            }

            function saveT4Data() {
                var t4aData = selectedT4aRowData;
                var changedList = [];
                if (gridT4b) {
                    var rows = gridT4b.getData();
                    rows.forEach(function (d) {
                        if (d.isSummaryRow) return;
                        if (d.isUpdated || d.isNew || d.isDeleted) {
                            changedList.push(d);
                        }
                    });
                }

                var isT4aChanged = !!(t4aData && (t4aData.isUpdated || t4aData._isUpdated));

                if (!isT4aChanged && changedList.length === 0) {
                    if (typeof showToast === "function") showToast("변경된 배정 데이터가 없습니다.", "info");
                    return;
                }

                var corpGr = (typeof resolveCorpGr === "function") ? resolveCorpGr(pane) : "";
                var payload = {
                    corpGr: corpGr,
                    activeTab: "t4",
                    t4aData: t4aData,
                    t4bList: changedList
                };

                fetch("/api/subscriptionrights/ja020a/t4/save", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                })
                    .then(function (res) { return res.json(); })
                    .then(function (res) {
                        if (res.success) {
                            if (typeof showToast === "function") showToast(res.message || "배정내역이 저장되었습니다.", "success");
                            lastLoadedT4Key = null;
                            syncT4Detail(selectedT4aRowData);
                        } else {
                            if (typeof showToast === "function") showToast(res.message || "저장 실패", "error");
                        }
                    })
                    .catch(function (err) {
                        console.error("T4 save error:", err);
                        if (typeof showToast === "function") showToast("배정 저장 처리 중 오류가 발생했습니다.", "error");
                    });
            }

            // [4. 탭3: 수요예측참여총괄표 (gridT5 & MRD 리포트)]
            function initTab3() {
                var el = pane.querySelector("#gridT5");
                if (!el) return;

                gridT5 = new Tabulator(el, {
                    height: "100%",
                    layout: "fitDataFill",
                    selectableRows: 1,
                    columns: [
                        { title: "No.", formatter: "rownum", width: 45, hozAlign: "center", headerHozAlign: "center" },
                        { title: "종목명", field: "jmNm", width: 160, hozAlign: "left" },
                        { title: "신청일자", field: "scYmd", width: 95, hozAlign: "center" },
                        {
                            title: "신청수량", field: "scJusu", width: 95, hozAlign: "right",
                            formatter: function (c) { return formatNum(c.getValue()); }
                        },
                        {
                            title: "청약수량", field: "cyJusu", width: 95, hozAlign: "right", headerCssClass: "col-hdr-blue",
                            formatter: function (c) {
                                var val = c.getValue();
                                return val ? '<span class="cell-text-blue">' + formatNum(val) + '</span>' : '';
                            }
                        },
                        {
                            title: "청약일자", field: "cyYmd", width: 95, hozAlign: "center", headerCssClass: "col-hdr-blue",
                            formatter: function (c) {
                                var val = c.getValue();
                                return val ? '<span class="cell-text-blue">' + val + '</span>' : '';
                            }
                        },
                        {
                            title: "납입일자", field: "nabibYmd", width: 95, hozAlign: "center", headerCssClass: "col-hdr-blue",
                            formatter: function (c) {
                                var val = c.getValue();
                                return val ? '<span class="cell-text-blue">' + val + '</span>' : '';
                            }
                        },
                        {
                            title: "매도제한일", field: "cyBoyuYmd", width: 95, hozAlign: "center", headerCssClass: "col-hdr-red",
                            formatter: function (c) {
                                var val = c.getValue() || c.getRow().getData().lockEnd;
                                return val ? '<span class="cell-text-red">' + val + '</span>' : '';
                            }
                        }
                    ]
                });

                if (window.AamsReport && typeof window.AamsReport.bindViewer === "function") {
                    reportViewer = window.AamsReport.bindViewer(pane, {
                        reportFile: "rd_ja020a.mrd",
                        modalId: "ja020aReportMobileModal",
                        zoom: "120",
                        getCorpGr: function () {
                            return (typeof resolveCorpGr === "function") ? resolveCorpGr(pane) : "";
                        },
                        buildParams: function (data) {
                            return {
                                title: "수요예측 참여 총괄표",
                                jc_join: (data && data.jcJoin) ? data.jcJoin : (currentJcJoin || "")
                            };
                        },
                        getTitle: function (data) {
                            return "수요예측 참여 총괄표 - " + ((data && (data.xxJmCd || data.jmNm)) || "");
                        },
                        getStatus: function (data) {
                            return "관리번호: " + ((data && data.jcJoin) || "");
                        },
                        getDownloadName: function (data) {
                            var safeNm = (data && (data.xxJmCd || data.jmNm) || "수요예측총괄표").replace(/[\\/:*?"<>|]/g, "_");
                            return "수요예측총괄표_" + safeNm;
                        }
                    });
                }

                if (typeof setupTabulatorRowSelection === "function") {
                    setupTabulatorRowSelection(gridT5, function (row, data) {
                        syncT5Report(data, false);
                    });
                }
                gridT5.on("rowClick", function (e, row) {
                    var isRealClick = e && (e.isTrusted !== false);
                    syncT5Report(row ? row.getData() : null, isRealClick);
                });
            }

            function syncT5Report(data, isUserClick) {
                if (!data) return;
                currentJcJoin = data.jcJoin || "";
                var isMobile = (window.AamsReport && typeof window.AamsReport.isMobileView === "function")
                    ? window.AamsReport.isMobileView(pane)
                    : (window.innerWidth <= 876);

                if (isMobile) {
                    if (isUserClick && reportViewer) {
                        reportViewer.openModal(data);
                    }
                } else {
                    if (reportViewer) {
                        reportViewer.loadPreview(data);
                    }
                }
            }

            function loadT5Data() {
                var corpGr = (typeof resolveCorpGr === "function") ? resolveCorpGr(pane) : "";
                fetch("/api/subscriptionrights/ja020a/t5/list?corpGr=" + encodeURIComponent(corpGr))
                    .then(function (res) { return res.json(); })
                    .then(function (list) {
                        if (gridT5) {
                            gridT5.setData(list || []);
                            if (list && list.length > 0) {
                                if (currentJcJoin) {
                                    selectRowByJcJoin(gridT5, currentJcJoin);
                                }
                            }
                        }
                    })
                    .catch(function (err) {
                        console.error("T5 load error:", err);
                        if (typeof showToast === "function") showToast("수요예측 종목 목록 조회 중 오류가 발생했습니다.", "error");
                    });
            }

            // [5. 상단 공통 툴바 표준 계약 바인딩]
            function initToolbar() {
                pane.onSearch = function () {
                    if (activeTabId === "t1") {
                        loadT1Data();
                    } else if (activeTabId === "t4") {
                        loadT4aData();
                    } else if (activeTabId === "t5") {
                        loadT5Data();
                    }
                };

                pane.onInput = function () {
                    if (activeTabId === "t1") {
                        setT1NewMode();
                    } else if (activeTabId === "t4") {
                        if (typeof pane.onDetailInput === "function") {
                            pane.onDetailInput();
                        }
                    }
                };

                pane.onSave = function () {
                    if (activeTabId === "t1") {
                        saveT1Data();
                    } else if (activeTabId === "t4") {
                        saveT4Data();
                    }
                };

                pane.onDelete = function () {
                    if (activeTabId === "t1") {
                        deleteT1Data();
                    } else if (activeTabId === "t4") {
                        if (typeof pane.onDetailDelete === "function") {
                            pane.onDetailDelete();
                        }
                    }
                };

                pane.onRefresh = function () {
                    if (gridT1) gridT1.clearData();
                    if (gridT4a) gridT4a.clearData();
                    if (gridT4b) gridT4b.clearData();
                    if (gridT5) gridT5.clearData();
                    currentJcJoin = "";
                    selectedT1RowData = null;
                    selectedT4aRowData = null;
                    lastLoadedT4Key = null;
                    updateT4bAddButtonState(null);
                    setT1NewMode();
                    if (typeof showToast === "function") showToast("화면이 초기화되었습니다.", "info");
                };

                pane.onCorpGrChange = function (newCorpGr) {
                    // 규칙 08 준수: 필터 변경 시 자동 조회는 실행하지 않음
                };

                pane.onExcel = function () {
                    if (activeTabId === "t1" && gridT1) {
                        gridT1.download("xlsx", "공모종목목록.xlsx", { sheetName: "공모종목" });
                    } else if (activeTabId === "t4" && gridT4b) {
                        gridT4b.download("xlsx", "펀드별배정등록.xlsx", { sheetName: "펀드별배정" });
                    } else if (activeTabId === "t5") {
                        if (reportViewer && typeof reportViewer.exportFormat === "function") {
                            reportViewer.exportFormat("excel");
                        } else if (gridT5) {
                            gridT5.download("xlsx", "수요예측참여종목.xlsx", { sheetName: "수요예측종목" });
                        }
                    }
                };
            }

            // [6. 스플리터 초기화]
            function initSplitters() {
                if (window.AamsSplitter && typeof window.AamsSplitter.init === "function") {
                    window.AamsSplitter.init(pane);
                }
            }

            // [7. 탭 버튼 클릭 이벤트 바인딩]
            function initTabButtons() {
                var btn1 = pane.querySelector("#tabBtn1");
                var btn2 = pane.querySelector("#tabBtn2");
                var btn3 = pane.querySelector("#tabBtn3");
                if (btn1) btn1.addEventListener("click", function () { switchTab("t1"); });
                if (btn2) btn2.addEventListener("click", function () { switchTab("t4"); });
                if (btn3) btn3.addEventListener("click", function () { switchTab("t5"); });
            }

            // [MDI 단일 진입점 실행]
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                initTabButtons();
                initTab1();
                initTab2();
                initTab3();
                initSplitters();
                initToolbar();

                // w_ja020a.srw의 eb_direct_retrieve = true 규격 반영: 최초 진입 시 탭1 조회
                setTimeout(function () {
                    loadT1Data();
                }, 100);
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", startInit);
            } else {
                startInit();
            }
        })();
    </script>
</div>
</html>

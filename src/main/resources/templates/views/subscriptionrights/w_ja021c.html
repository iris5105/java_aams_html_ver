<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-mobile-stack-container" th:fragment="mainView"
     th:attr="data-work-date=${workDate}, data-initial-ymd=${initialYmd}"
     style="display: flex; flex-direction: column; height: 100%; width: 100%; overflow: hidden; background-color: #ffffff; position: relative;">

    <!-- 1. 상단 공통 툴바 (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- 2. 서브 탭 네비게이션 헤더 -->
    <div class="tab-nav-wrapper" style="padding: 4px 14px 0 14px; background: #f1f5f9; border-bottom: 1px solid #cbd5e1; flex-shrink: 0;">
        <div class="nav nav-tabs" style="display: flex; gap: 2px; border-bottom: none; margin: 0;">
            <button type="button" class="tab-btn active" id="tabBtn1" data-tab="t1"
                    style="padding: 7px 16px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid #cbd5e1; border-bottom: none; background: #ffffff; border-radius: 6px 6px 0 0; color: #1e293b; display: inline-flex; align-items: center; gap: 6px;">
                <i class="fa-solid fa-calendar-check"></i> 중간배당(G15,회사별)
            </button>
            <button type="button" class="tab-btn" id="tabBtn2" data-tab="t2"
                    style="padding: 7px 16px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid transparent; border-bottom: none; background: #e2e8f0; border-radius: 6px 6px 0 0; color: #64748b; display: inline-flex; align-items: center; gap: 6px;">
                <i class="fa-solid fa-coins"></i> 현금중간배당확정(G23)
            </button>
            <button type="button" class="tab-btn" id="tabBtn3" data-tab="t3"
                    style="padding: 7px 16px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid transparent; border-bottom: none; background: #e2e8f0; border-radius: 6px 6px 0 0; color: #64748b; display: inline-flex; align-items: center; gap: 6px;">
                <i class="fa-solid fa-chart-line"></i> 주식중간배당확정(G23)
            </button>
        </div>
    </div>

    <!-- 3. 메인 콘텐츠 섹션 (탭별 상하 분할 스플리터) -->
    <div id="tabContentArea" style="flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; overflow: hidden; background: #ffffff;">

        <!-- [TAB 1] 중간배당(G15,회사별) (상: 마스터 + 하: 펀드별상세) -->
        <div class="tab-pane-view active" id="paneTab1" style="display: flex; height: 100%; width: 100%; min-height: 0;">
            <div class="layout-split-v split-body layout-mobile-stack" data-split-key="JA021C_T1_V" data-default-ratio="55:45" style="width: 100%; height: 100%; min-height: 0; display: flex; flex-direction: column;">
                <!-- 상단: 중간배당 등록 (d_ja021c_t1) -->
                <div class="pane-top" style="height: 55%; display: flex; flex-direction: column; min-height: 0; overflow: hidden;">
                    <div class="panel-header" style="padding: 6px 10px; background: #f1f5f9; border-bottom: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: space-between;">
                        <span class="panel-title" style="font-weight: 600; font-size: 13px; color: #1e293b;">
                            <i class="fa-solid fa-table-list"></i> 중간배당(G15,회사별) 등록
                        </span>
                    </div>
                    <div class="panel-body" style="flex: 1; min-height: 0; position: relative;">
                        <div id="gridT1Master" class="tabulator-aams-grid" style="height: 100%;"></div>
                    </div>
                </div>
                <div class="split-gutter-v" title="드래그하여 상하 비율 조절"></div>
                <!-- 하단: 펀드별 배당권리 상세 (d_ja021c_t22) -->
                <div class="pane-bottom" style="height: 45%; display: flex; flex-direction: column; min-height: 0; overflow: hidden;">
                    <div class="panel-header" style="padding: 6px 10px; background: #f8fafc; border-bottom: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: space-between;">
                        <span class="panel-title" style="font-weight: 600; font-size: 13px; color: #1e293b;">
                            <i class="fa-solid fa-folder-tree"></i> 펀드별 배당권리 상세
                        </span>
                        <div class="panel-actions">
                            <div th:replace="~{fragments/tab_header :: detailNav(targetGrid='#gridT1Detail', fileName='펀드별배당권리상세_중간배당', buttons='0010001001')}"
                                 style="opacity: 0.4; pointer-events: none;"></div>
                        </div>
                    </div>
                    <div class="panel-body" style="flex: 1; min-height: 0; position: relative;">
                        <div id="gridT1Detail" class="tabulator-aams-grid" style="height: 100%;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- [TAB 2] 현금중간배당확정(G23) (상: 마스터 + 하: 펀드별상세) -->
        <div class="tab-pane-view" id="paneTab2" style="display: none; height: 100%; width: 100%; min-height: 0;">
            <div class="layout-split-v split-body layout-mobile-stack" data-split-key="JA021C_T2_V" data-default-ratio="55:45" style="width: 100%; height: 100%; min-height: 0; display: flex; flex-direction: column;">
                <!-- 상단: 현금중간배당확정 등록 (d_ja021c_t31) -->
                <div class="pane-top" style="height: 55%; display: flex; flex-direction: column; min-height: 0; overflow: hidden;">
                    <div class="panel-header" style="padding: 6px 10px; background: #f1f5f9; border-bottom: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: space-between;">
                        <span class="panel-title" style="font-weight: 600; font-size: 13px; color: #1e293b;">
                            <i class="fa-solid fa-coins"></i> 현금중간배당확정(G23) 등록
                        </span>
                    </div>
                    <div class="panel-body" style="flex: 1; min-height: 0; position: relative;">
                        <div id="gridT2Master" class="tabulator-aams-grid" style="height: 100%;"></div>
                    </div>
                </div>
                <div class="split-gutter-v" title="드래그하여 상하 비율 조절"></div>
                <!-- 하단: 펀드별 배당권리 상세 (d_ja021c_t32) -->
                <div class="pane-bottom" style="height: 45%; display: flex; flex-direction: column; min-height: 0; overflow: hidden;">
                    <div class="panel-header" style="padding: 6px 10px; background: #f8fafc; border-bottom: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: space-between;">
                        <span class="panel-title" style="font-weight: 600; font-size: 13px; color: #1e293b;">
                            <i class="fa-solid fa-folder-tree"></i> 펀드별 배당권리 상세
                        </span>
                        <div class="panel-actions">
                            <div th:replace="~{fragments/tab_header :: detailNav(targetGrid='#gridT2Detail', fileName='펀드별배당권리상세_현금확정', buttons='0010001001')}"
                                 style="opacity: 0.4; pointer-events: none;"></div>
                        </div>
                    </div>
                    <div class="panel-body" style="flex: 1; min-height: 0; position: relative;">
                        <div id="gridT2Detail" class="tabulator-aams-grid" style="height: 100%;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- [TAB 3] 주식중간배당확정(G23) (상: 마스터 + 하: 펀드별상세) -->
        <div class="tab-pane-view" id="paneTab3" style="display: none; height: 100%; width: 100%; min-height: 0;">
            <div class="layout-split-v split-body layout-mobile-stack" data-split-key="JA021C_T3_V" data-default-ratio="55:45" style="width: 100%; height: 100%; min-height: 0; display: flex; flex-direction: column;">
                <!-- 상단: 주식중간배당확정 등록 (d_ja021c_t41) -->
                <div class="pane-top" style="height: 55%; display: flex; flex-direction: column; min-height: 0; overflow: hidden;">
                    <div class="panel-header" style="padding: 6px 10px; background: #f1f5f9; border-bottom: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: space-between;">
                        <span class="panel-title" style="font-weight: 600; font-size: 13px; color: #1e293b;">
                            <i class="fa-solid fa-chart-line"></i> 주식중간배당확정(G23) 등록
                        </span>
                    </div>
                    <div class="panel-body" style="flex: 1; min-height: 0; position: relative;">
                        <div id="gridT3Master" class="tabulator-aams-grid" style="height: 100%;"></div>
                    </div>
                </div>
                <div class="split-gutter-v" title="드래그하여 상하 비율 조절"></div>
                <!-- 하단: 펀드별 배당권리 상세 (d_ja021c_t42) -->
                <div class="pane-bottom" style="height: 45%; display: flex; flex-direction: column; min-height: 0; overflow: hidden;">
                    <div class="panel-header" style="padding: 6px 10px; background: #f8fafc; border-bottom: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: space-between;">
                        <span class="panel-title" style="font-weight: 600; font-size: 13px; color: #1e293b;">
                            <i class="fa-solid fa-folder-tree"></i> 펀드별 배당권리 상세
                        </span>
                        <div class="panel-actions">
                            <div th:replace="~{fragments/tab_header :: detailNav(targetGrid='#gridT3Detail', fileName='펀드별배당권리상세_주식확정', buttons='0010001001')}"
                                 style="opacity: 0.4; pointer-events: none;"></div>
                        </div>
                    </div>
                    <div class="panel-body" style="flex: 1; min-height: 0; position: relative;">
                        <div id="gridT3Detail" class="tabulator-aams-grid" style="height: 100%;"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- 5. 화면 전용 스크립트 격리 블록 -->
    <script th:inline="javascript">
        (function () {
            const currentScript = document.currentScript;
            const pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;
            if (!pane) return;

            let isInitialized = false;
            let isSearched = false;
            let currentTab = "t1";

            // 그리드 인스턴스
            let gridT1Master = null;
            let gridT1Detail = null;
            let gridT2Master = null;
            let gridT2Detail = null;
            let gridT3Master = null;
            let gridT3Detail = null;

            // 선택 상태 관리 (Zero-Stale-Key)
            let selectedT1MasterRow = null;
            let selectedT2MasterRow = null;
            let selectedT3MasterRow = null;
            let lastLoadedT1Key = null;
            let lastLoadedT2Key = null;
            let lastLoadedT3Key = null;

            // DDDW 캐시 맵
            let dddwOptionsMap = {
                baed_mth: [],
                baej_mth: []
            };

            function getDddwLabel(dddwKey, codeVal) {
                return (window.f_dddwctl && typeof window.f_dddwctl.getLabel === 'function')
                    ? window.f_dddwctl.getLabel(dddwOptionsMap, dddwKey, codeVal)
                    : (codeVal || '');
            }

            function getDddwOptions(dddwKey) {
                return (window.f_dddwctl && typeof window.f_dddwctl.getOptions === 'function')
                    ? window.f_dddwctl.getOptions(dddwOptionsMap, dddwKey)
                    : (dddwOptionsMap[dddwKey] || []).map(o => ({ value: o.code, label: o.name }));
            }

            function ue_dddw_retrieve() {
                const targetCorpGr = (typeof resolveCorpGr === 'function') ? resolveCorpGr(pane) : '';
                if (window.f_dddwctl && typeof window.f_dddwctl.retrieveMultiple === 'function') {
                    window.f_dddwctl.retrieveMultiple({
                        baed_mth: ['baed_mth', targetCorpGr, '', 1, ''],
                        baej_mth: ['baej_mth', targetCorpGr, '', 1, '']
                    }).then(results => {
                        Object.keys(results).forEach(k => {
                            dddwOptionsMap[k] = results[k] || [];
                        });
                        if (gridT1Master) gridT1Master.redraw(true);
                        if (gridT2Master) gridT2Master.redraw(true);
                        if (gridT3Master) gridT3Master.redraw(true);
                    }).catch(err => {
                        console.warn("[ue_dddw_retrieve] DDDW 로드 실패:", err);
                    });
                }
            }

            // 상단 공통 버튼 활성화/비활성화 제어 (wt_tab / utt_listdetail 표준)
            // - 두번째 탭(t2), 세번째 탭(t3)은 조회 전이나 조회 후나 [입력], [복사], [삭제] 항시 비활성화 (eb_*_false=true)
            // - 첫번째 탭(t1)만 [입력], [삭제] 가능 (복사는 전 탭 비활성화)
            function updateToolbarButtons(tabId) {
                const targetTab = tabId || currentTab;
                const canInput = (targetTab === "t1");
                const canDelete = (targetTab === "t1");
                const canSave = true; // 마스터 확정 등록 저장 가능
                const canCopy = false; // 복사는 전 탭 비활성화

                const btnInput = pane.querySelector('.t-btn.btn-input, button[data-action="input"]');
                if (btnInput) {
                    btnInput.disabled = !canInput;
                    btnInput.classList.toggle('disabled', !canInput);
                    if (!canInput) {
                        btnInput.setAttribute('disabled', 'disabled');
                    } else {
                        btnInput.removeAttribute('disabled');
                    }
                }

                const btnDelete = pane.querySelector('.t-btn.btn-delete, button[data-action="delete"]');
                if (btnDelete) {
                    btnDelete.disabled = !canDelete;
                    btnDelete.classList.toggle('disabled', !canDelete);
                    if (!canDelete) {
                        btnDelete.setAttribute('disabled', 'disabled');
                    } else {
                        btnDelete.removeAttribute('disabled');
                    }
                }

                const btnCopy = pane.querySelector('.t-btn.btn-copy, button[data-action="copy"]');
                if (btnCopy) {
                    btnCopy.disabled = !canCopy;
                    btnCopy.classList.toggle('disabled', !canCopy);
                    btnCopy.setAttribute('disabled', 'disabled');
                }

                const btnSave = pane.querySelector('.t-btn.btn-save, button[data-action="save"]');
                if (btnSave) {
                    btnSave.disabled = !canSave;
                    btnSave.classList.toggle('disabled', !canSave);
                }
            }

            // 툴바 버튼 강제 잠금 옵저버 (ButtonRole 등 외부 스크립트가 조회 후 활성화하는 것을 원천 차단)
            function initToolbarLockObserver() {
                const toolbarWrap = pane.querySelector('.toolbar-buttons') || pane.querySelector('.view-toolbar');
                if (toolbarWrap && window.MutationObserver) {
                    const observer = new MutationObserver(function () {
                        if (currentTab === "t2" || currentTab === "t3") {
                            const btnInp = toolbarWrap.querySelector('.btn-input');
                            if (btnInp && !btnInp.disabled) {
                                btnInp.disabled = true;
                                btnInp.classList.add('disabled');
                                btnInp.setAttribute('disabled', 'disabled');
                            }
                            const btnDel = toolbarWrap.querySelector('.btn-delete');
                            if (btnDel && !btnDel.disabled) {
                                btnDel.disabled = true;
                                btnDel.classList.add('disabled');
                                btnDel.setAttribute('disabled', 'disabled');
                            }
                            const btnCpy = toolbarWrap.querySelector('.btn-copy');
                            if (btnCpy && !btnCpy.disabled) {
                                btnCpy.disabled = true;
                                btnCpy.classList.add('disabled');
                                btnCpy.setAttribute('disabled', 'disabled');
                            }
                        }
                    });
                    observer.observe(toolbarWrap, {
                        attributes: true,
                        subtree: true,
                        attributeFilter: ['disabled', 'class']
                    });
                }
            }

            // 디테일 서브 네비게이터 버튼 활성화/비활성화 제어 (파워빌더 utt_listdetail :: wf_setenabled 표준)
            // - 탭 1: 마스터 그리드에 데이터가 1건 이상 존재하고 유효한 행이 선택되었을 때만 디테일 공통 버튼 활성화
            // - 탭 2, 탭 3: 세번째 탭과 동일하게 디테일 공통 버튼 항시 비활성화 (disabled, opacity: 0.4, 클릭 차단)
            function updateDetailNavButtons(tabId) {
                const targetTab = tabId || currentTab;
                let hasSelectedMaster = false;
                let targetPaneEl = null;

                if (targetTab === "t1") {
                    targetPaneEl = pane.querySelector('#paneTab1');
                    const masterRows = gridT1Master ? gridT1Master.getData() : [];
                    hasSelectedMaster = masterRows.length > 0 && !!selectedT1MasterRow;
                } else if (targetTab === "t2") {
                    targetPaneEl = pane.querySelector('#paneTab2');
                    // 두 번째 탭도 세 번째 탭처럼 디테일 공통 버튼 항시 비활성화 유지
                    hasSelectedMaster = false;
                } else if (targetTab === "t3") {
                    targetPaneEl = pane.querySelector('#paneTab3');
                    // 세 번째 탭: 디테일 공통 버튼 항시 비활성화 유지
                    hasSelectedMaster = false;
                }

                if (targetPaneEl) {
                    const navGroup = targetPaneEl.querySelector('.grid-nav-group');
                    if (navGroup) {
                        navGroup.style.opacity = hasSelectedMaster ? "1" : "0.4";
                        navGroup.style.pointerEvents = hasSelectedMaster ? "auto" : "none";
                        navGroup.querySelectorAll('.btn-grid-nav').forEach(btn => {
                            btn.disabled = !hasSelectedMaster;
                            btn.classList.toggle('disabled', !hasSelectedMaster);
                        });
                    }
                }
            }

            function updateAllDetailNavButtons() {
                ['t1', 't2', 't3'].forEach(t => updateDetailNavButtons(t));
            }

            // 숫자 포맷터 헬퍼
            function moneyFormatter(cell) {
                var val = cell.getValue();
                if (val == null || val === '') return '';
                return (typeof formatNumber === 'function') ? formatNumber(val, 0) : Number(val).toLocaleString();
            }

            function moneyDecimalFormatter(cell) {
                var val = cell.getValue();
                if (val == null || val === '') return '';
                return (typeof formatNumber === 'function') ? formatNumber(val, 2) : Number(val).toFixed(2);
            }

            // 마크 행 수정 플래그
            function markRowUpdated(cell) {
                const row = cell.getRow();
                const d = row.getData();
                if (!d.isNew) {
                    d.isUpdated = true;
                    d.rowStatus = "U";
                    row.update(d);
                }
            }

            // 신규 행 편집 가능 여부 판별 헬퍼 (규칙 04 1.4항)
            function isRowEditable(cell) {
                if (!cell) return false;
                const row = cell.getRow ? cell.getRow() : cell;
                const d = row.getData ? row.getData() : row;
                return !!(d && (d.isNew || d._isNew));
            }

            // 마스터 그리드 셀 클릭 핸들러 (신규 행인 경우에만 편집 진입, 기존 행은 단순 행 선택만 유지)
            function aamsMasterCellEdit(e, cell) {
                if (!isRowEditable(cell)) {
                    const row = cell.getRow();
                    if (row && typeof row.select === 'function' && !row.isSelected()) {
                        const table = cell.getTable();
                        if (table && typeof table.deselectRow === 'function') table.deselectRow();
                        row.select();
                    }
                    return;
                }
                if (typeof aamsCellEdit === 'function') {
                    aamsCellEdit(e, cell);
                }
            }

            // 탭 1 배당율 계산 로직 (파워빌더 u_ja021c_t1::itemchanged_next)
            function recalcT1Dividends(row) {
                const d = row.getData();
                if (!d.balhCo) return;

                fetch(`/api/subscriptionrights/ja021c/balh-info?balhCo=${encodeURIComponent(d.balhCo)}`)
                    .then(res => res.json())
                    .then(info => {
                        const aekm = Number(info.aekm || 0);
                        let cashIlbanPer = d.cashIlbanPer;
                        let cashWoosPer = d.cashWoosPer;

                        if (aekm > 0 && d.baedMth !== '2') {
                            const baej1 = (d.baejMth || '').charAt(0);
                            if (baej1 === '1' || baej1 === '3') {
                                if (d.ilbanAek != null && d.ilbanAek !== '') {
                                    cashIlbanPer = (Number(d.ilbanAek) / aekm) * 100;
                                }
                            }
                            if (baej1 === '2' || baej1 === '3') {
                                if (d.woosAek != null && d.woosAek !== '') {
                                    cashWoosPer = (Number(d.woosAek) / aekm) * 100;
                                }
                            }
                        }

                        row.update({
                            cashIlbanPer: cashIlbanPer,
                            cashWoosPer: cashWoosPer,
                            isUpdated: !d.isNew,
                            rowStatus: d.isNew ? "C" : "U"
                        });
                    }).catch(err => console.error("액면가 조회 실패:", err));
            }

            // 탭 2 배당율 계산 로직
            function recalcT2Dividends(row) {
                const d = row.getData();
                if (!d.balhCo) return;

                fetch(`/api/subscriptionrights/ja021c/balh-info?balhCo=${encodeURIComponent(d.balhCo)}`)
                    .then(res => res.json())
                    .then(info => {
                        const aekm = Number(info.aekm || 0);
                        let cashIlbanPer = d.cashIlbanPer;
                        let cashWoosPer = d.cashWoosPer;

                        if (aekm > 0) {
                            if (d.ilbanAek != null && d.ilbanAek !== '') {
                                cashIlbanPer = (Number(d.ilbanAek) / aekm) * 100;
                            }
                            if (d.woosAek != null && d.woosAek !== '') {
                                cashWoosPer = (Number(d.woosAek) / aekm) * 100;
                            }

                    selectedT1MasterRow = null;
                    if (gridT1Detail) gridT1Detail.clearData();
                    updateDetailNavButtons("t1");
                    return;

                const key = `${data.corpGr}_${data.trYmd}_${data.balhCo}`;
                selectedT1MasterRow = data;
                updateDetailNavButtons("t1");
                if (lastLoadedT1Key === key) return;
                lastLoadedT1Key = key;

                fetch(`/api/subscriptionrights/ja021c/t1/detail?ymd=${encodeURIComponent(data.trYmd)}&balhCo=${encodeURIComponent(data.balhCo)}`)

            function loadCurrentTab() {
                if (currentTab === "t1") loadT1Master();
                else if (currentTab === "t2") loadT2Master();
                else if (currentTab === "t3") loadT3Master();
            }

            // 탭 전환 처리
            function switchTab(tabId) {
                if (currentTab === tabId) return;
                currentTab = tabId;

                pane.querySelectorAll('.tab-btn').forEach(btn => {
                    const isTarget = btn.getAttribute('data-tab') === tabId;
                    btn.classList.toggle('active', isTarget);
                    btn.style.background = isTarget ? "#ffffff" : "#e2e8f0";
                    btn.style.color = isTarget ? "#1e293b" : "#64748b";
                    btn.style.borderColor = isTarget ? "#cbd5e1" : "transparent";
                });

                pane.querySelectorAll('.tab-pane-view').forEach(p => {
                    p.style.display = 'none';
                    p.classList.remove('active');
                });

                const targetPane = pane.querySelector(`#paneTab${tabId.charAt(1)}`);
                if (targetPane) {
                    targetPane.style.display = 'flex';
                    targetPane.classList.add('active');
                }

                updateToolbarButtons(tabId);
                updateDetailNavButtons(tabId);
                setTimeout(() => updateToolbarButtons(tabId), 50);

                // 스플리터 리드로우
                if (window.AamsSplitter && typeof window.AamsSplitter.redrawGrids === 'function') {
                    window.AamsSplitter.redrawGrids(targetPane);
                }

                // 기조회 상태이면 새 탭 데이터 로드
                if (isSearched) {
                    loadCurrentTab();
                }
            }

            // [초기화 3] 탭 및 툴바 이벤트 바인딩
            function initToolbarAndEvents() {
                // 탭 버튼 클릭
                pane.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.addEventListener('click', function () {
                        const tab = this.getAttribute('data-tab');
                        switchTab(tab);
                    });
                });

                // 상단 공통 툴바 표준 계약 (08-toolbar-and-query-policy.md)
                pane.onSearch = function () {
                    isSearched = true;
                    pane.isSearched = true;
                    loadCurrentTab();
                    setTimeout(() => updateToolbarButtons(currentTab), 50);
                    setTimeout(() => updateToolbarButtons(currentTab), 200);
                };

                pane.onInput = function () {
                    if (currentTab !== "t1") {
                        if (typeof showToast === 'function') showToast("해당 탭은 신규 입력을 지원하지 않습니다.", "info");
                        return;
                    }
                    if (!gridT1Master) return;

                    const corpGr = (typeof resolveCorpGr === 'function') ? resolveCorpGr(pane) : '';
                    const workDate = getTargetWorkDate();

                    gridT1Master.addRow({
                        isNew: true,
                        rowStatus: "C",
                        corpGr: corpGr,
                        trYmd: workDate,
                        trCd: "G15",
                        brokYmd: workDate,
                        balhCo: "",
                        xxBalhCo: "",
                        baedMth: "1",
                        baejMth: "11",
                        ilbanAek: 0,
                        woosAek: 0,
                        cashIlbanPer: 0,
                        cashWoosPer: 0,
                        stockIlbanPer: 0,
                        stockWoosPer: 0
                    }, true).then(row => {
                        row.select();
                        updateDetailNavButtons("t1");
                    });
                };

                pane.onDelete = function () {
                    if (currentTab !== "t1") {
                        if (typeof showToast === 'function') showToast("해당 탭은 행 삭제를 지원하지 않습니다.", "info");
                        return;
                    }
                    if (!gridT1Master) return;

                    const selectedRows = gridT1Master.getSelectedRows();
                    if (!selectedRows || selectedRows.length === 0) {
                        if (typeof showToast === 'function') showToast("삭제할 행을 선택해주세요.", "warning");
                        return;
                    }

                    const workDate = getTargetWorkDate();
                    selectedRows.forEach(r => {
                        const d = r.getData();
                        if (d.trYmd && d.trYmd < workDate) {
                            if (typeof showToast === 'function') showToast("중간배당일이 지난 자료는 삭제할 수 없습니다.", "warning");
                            return;
                        }
                        if (d.isNew) {
                            r.delete();
                        } else {
                            d.isDeleted = true;
                            d.rowStatus = "D";
                            r.update(d);
                            r.getElement().style.display = "none";
                        }
                    });

                    const remainingRows = gridT1Master.getRows().filter(r => {
                        const d = r.getData();
                        return d && !d.isDeleted;
                    });
                    if (remainingRows.length === 0) {
                        selectedT1MasterRow = null;
                        if (gridT1Detail) gridT1Detail.clearData();
                        updateDetailNavButtons("t1");
                    }
                };

                pane.onSave = function () {
                    let activeGrid = null;
                    if (currentTab === "t1") activeGrid = gridT1Master;
                    else if (currentTab === "t2") activeGrid = gridT2Master;
                    else if (currentTab === "t3") activeGrid = gridT3Master;

                    if (!activeGrid) return;

                    const rows = activeGrid.getData();
                    const changedMasters = rows.filter(d => d.isNew || d.isUpdated || d.isDeleted);
                    if (changedMasters.length === 0) {
                        if (typeof showToast === 'function') showToast("변경된 데이터가 없습니다.", "info");
                        return;
                    }

                    // 필수값 검증
                    for (let m of changedMasters) {
                        if (!m.isDeleted && (!m.balhCo || !m.balhCo.trim())) {
                            if (typeof showToast === 'function') showToast("발행기관을 입력해주세요.", "warning");
                            return;
                        }
                        if (!m.isDeleted && (!m.trYmd || !m.trYmd.trim())) {
                            if (typeof showToast === 'function') showToast("처리일자(확정일자)를 입력해주세요.", "warning");
                            return;
                        }
                    }

                    fetch('/api/subscriptionrights/ja021c/save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ tabId: currentTab, masterList: changedMasters })
                    })
                    .then(res => res.json())
                    .then(result => {
                        if (result.success) {
                            if (typeof showToast === 'function') showToast(result.message || "저장되었습니다.", "success");
                            loadCurrentTab();
                        } else {
                            if (typeof showToast === 'function') showToast(result.message || "저장 실패", "error");
                        }
                    }).catch(err => {
                        console.error("마스터 저장 실패:", err);
                        if (typeof showToast === 'function') showToast("저장 중 오류가 발생했습니다.", "error");
                    });
                };

                pane.onCopy = function () {
                    if (typeof showToast === 'function') showToast("복사가 지원되지 않는 화면입니다.", "info");
                };

                pane.onRefresh = function () {
                    isSearched = false;
                    pane.isSearched = false;

                    [gridT1Master, gridT1Detail, gridT2Master, gridT2Detail, gridT3Master, gridT3Detail].forEach(g => {
                        if (g) g.clearData();
                    });
                    selectedT1MasterRow = null;
                    selectedT2MasterRow = null;
                    selectedT3MasterRow = null;
                    lastLoadedT1Key = null;
                    lastLoadedT2Key = null;
                    lastLoadedT3Key = null;

                    updateToolbarButtons(currentTab);
                    updateAllDetailNavButtons();

                    if (typeof showToast === 'function') {
                        showToast("화면이 초기화되었습니다.", "info");
                    }
                };

                pane.onExcel = function () {
                    let g = gridT1Master;
                    if (currentTab === "t2") g = gridT2Master;
                    else if (currentTab === "t3") g = gridT3Master;

                    if (g) {
                        g.download("xlsx", `중간배당및확정등록_${currentTab.toUpperCase()}.xlsx`, { sheetName: "목록" });
                    }
                };

                // detailNav 공통 서브 네비게이터 버튼 표준 계약 연동 (파워빌더: eb_new_false=true, eb_copy_false=true, eb_delete_false=true)
                pane.onDetailInput = pane.onDetailAdd = function (btn) {
                    if (typeof showToast === 'function') showToast("펀드별 배당권리 상세 내역은 조회가 전용입니다.", "info");
                };

                pane.onDetailDelete = function (btn) {
                    if (typeof showToast === 'function') showToast("펀드별 배당권리 상세 내역은 삭제할 수 없습니다.", "info");
                };

                pane.onDetailCopy = function (btn) {
                    if (typeof showToast === 'function') showToast("펀드별 배당권리 상세 내역은 복사를 지원하지 않습니다.", "info");
                };

                pane.onDetailExcel = function (btn) {
                    if (currentTab === "t2" || currentTab === "t3") {
                        if (typeof showToast === 'function') showToast("해당 탭의 펀드별 배당권리 상세 공통버튼은 비활성화되어 있습니다.", "info");
                        return;
                    }
                    let activeDetailGrid = gridT1Detail;
                    let activeMasterRow = selectedT1MasterRow;
                    let fileName = "펀드별배당권리상세_중간배당";
                    if (!activeMasterRow) {
                        if (typeof showToast === 'function') showToast("마스터 행을 먼저 선택해주세요.", "warning");
                        return;
                    }
                    if (activeDetailGrid) {
                        activeDetailGrid.download("xlsx", `${fileName}.xlsx`, { sheetName: "상세내역" });
                    }
                };

                pane.onCorpGrChange = function (newCorpGr) {
                    ue_dddw_retrieve();
                    // 규칙 08 준수: 필터 변경 시 자동 조회를 절대 실행하지 않음
                };

                pane.addEventListener('buttonAuthApplied', function () {
                    updateToolbarButtons(currentTab);
                    updateDetailNavButtons(currentTab);
                });

                pane.addEventListener('buttonSearchStateChanged', function () {
                    // 조회 전/후 상태 변경 시에도 탭 2와 탭 3의 입력, 복사, 삭제 비활성화 유지
                    updateToolbarButtons(currentTab);
                    updateDetailNavButtons(currentTab);
                });
            }

            // [초기화 4] 스플리터
            function initSplitters() {
                if (window.AamsSplitter && typeof window.AamsSplitter.init === 'function') {
                    window.AamsSplitter.init(pane);
                }
            }

            // [MDI 단일 진입점 실행]
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                initGrids();
                initToolbarAndEvents();
                initSplitters();
                initToolbarLockObserver();
                ue_dddw_retrieve();

                updateToolbarButtons(currentTab);
                updateAllDetailNavButtons();
                setTimeout(() => {
                    updateToolbarButtons(currentTab);
                    updateAllDetailNavButtons();
                }, 100);

                // 규칙 08 준수: 화면 진입 시 자동 조회를 실행하지 않고 수동 조회 대기
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", startInit);
            } else {
                startInit();
            }
        })();
    </script>
</div>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-mobile-stack-container" th:fragment="mainView"
     th:attr="data-work-date=${workDate}, data-initial-ym=${initialYm}"
     style="display: flex; flex-direction: column; height: 100%; width: 100%; overflow: hidden; background-color: #ffffff; position: relative;">

    <!-- 1. 상단 공통 툴바 (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- 2. 상단 필터바 (Row 2: 필터 + 액션버튼 일체화) -->
    <div class="filter-bar" style="display: flex; align-items: center; justify-content: space-between; padding: 6px 14px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; flex-shrink: 0;">
        <div class="filter-left" style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap;">
            <!-- 배당공시월 -->
            <div style="display: flex; align-items: center; gap: 6px;">
                <label class="filter-label" style="font-weight: 600; font-size: 12px; color: #334155;">배당공시월</label>
                <div style="display: flex; align-items: center; gap: 4px; width: 130px;">
                    <input type="month" id="filterYm" name="ym" class="form-input" th:value="${initialYm}"
                           style="height: 28px; border: 1px solid #cbd5e1; border-radius: 4px; padding: 0 8px; font-size: 12px; flex: 1;" />
                </div>
            </div>

            <!-- 회사구분 -->
            <div style="display: flex; align-items: center; gap: 6px;">
                <label class="filter-label" style="font-weight: 600; font-size: 12px; color: #334155;">회사구분</label>
                <select id="filterCustomerGr" name="customerGr" class="form-select" style="height: 28px; width: 130px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 12px; padding: 0 8px;">
                    <option value="자산운용" selected>자산운용</option>
                    <option value="자문회사">자문회사</option>
                </select>
            </div>

            <!-- 안내 태그 -->
            <span class="badge" style="background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; font-size: 12px; padding: 4px 10px; border-radius: 4px; display: inline-flex; align-items: center; gap: 6px;">
                <i class="fa-solid fa-circle-info"></i> 확정배당 종목별등록은 확정일자 더블클릭
            </span>

            <!-- 액션 버튼: 종목별 확정배당 팝업 단축 버튼 -->
            <button type="button" class="t-btn btn-action" id="btnOpenPopupModal" style="height: 28px; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; padding: 0 10px; background: #3b82f6; color: #fff; border: 1px solid #2563eb; border-radius: 4px; cursor: pointer;">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> 종목별 확정배당 등록
            </button>
        </div>
    </div>

    <!-- 3. 메인 콘텐츠 섹션 (좌우 분할 스플리터) -->
    <div class="layout-split-h split-body layout-mobile-stack" data-split-key="JA021B_H" data-default-ratio="22:78" style="flex: 1; min-height: 0; display: flex; width: 100%; overflow: hidden;">
        
        <!-- [좌측 패널] 회사 목록 (dl_corp_gr) -->
        <div class="split-pane split-left" style="width: 22%; display: flex; flex-direction: column; min-width: 200px; min-height: 0; background: #ffffff; border-right: 1px solid #cbd5e1;">
            <div class="panel-header" style="padding: 6px 10px; background: #f1f5f9; border-bottom: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: space-between;">
                <span class="panel-title" style="font-weight: 600; font-size: 13px; color: #1e293b;">
                    <i class="fa-solid fa-building"></i> 회사 목록
                </span>
            </div>
            <div class="panel-body" style="flex: 1; min-height: 0; position: relative;">
                <div id="gridCorp" class="tabulator-aams-grid" style="height: 100%;"></div>
            </div>
        </div>

        <div class="split-gutter-h" title="드래그하여 좌우 비율 조절 (더블클릭 시 기본 비율로 복원)"></div>

        <!-- [우측 패널] 5개 탭 서브페이지 영역 -->
        <div class="split-pane split-right" style="width: 78%; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #ffffff; overflow: hidden;">
            
            <!-- 서브 탭 네비게이션 바 -->
            <div class="sub-tab-bar" style="display: flex; gap: 4px; padding: 6px 10px 0 10px; background: #f8fafc; border-bottom: 1px solid #cbd5e1; flex-shrink: 0;">
                <button type="button" class="sub-tab-btn active" id="tabBtn1" data-tab="t1"
                        style="padding: 6px 14px; border: 1px solid #cbd5e1; border-bottom: none; border-radius: 4px 4px 0 0; background: #fff; font-weight: 600; font-size: 12px; color: #2563eb; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
                    <i class="fa-solid fa-bullhorn"></i> 예상배당공시
                </button>
                <button type="button" class="sub-tab-btn" id="tabBtn2" data-tab="t2"
                        style="padding: 6px 14px; border: 1px solid #cbd5e1; border-bottom: none; border-radius: 4px 4px 0 0; background: #f1f5f9; font-weight: 500; font-size: 12px; color: #475569; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
                    <i class="fa-solid fa-building-columns"></i> 운용사별예상배당
                </button>
                <button type="button" class="sub-tab-btn" id="tabBtn3" data-tab="t3"
                        style="padding: 6px 14px; border: 1px solid #cbd5e1; border-bottom: none; border-radius: 4px 4px 0 0; background: #f1f5f9; font-weight: 500; font-size: 12px; color: #475569; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
                    <i class="fa-solid fa-coins"></i> 현금확정배당(G20)
                </button>
                <button type="button" class="sub-tab-btn" id="tabBtn4" data-tab="t4"
                        style="padding: 6px 14px; border: 1px solid #cbd5e1; border-bottom: none; border-radius: 4px 4px 0 0; background: #f1f5f9; font-weight: 500; font-size: 12px; color: #475569; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
                    <i class="fa-solid fa-chart-line"></i> 주식확정배당(G20)
                </button>
                <button type="button" class="sub-tab-btn" id="tabBtn5" data-tab="t5"
                        style="padding: 6px 14px; border: 1px solid #cbd5e1; border-bottom: none; border-radius: 4px 4px 0 0; background: #f1f5f9; font-weight: 500; font-size: 12px; color: #475569; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
                    <i class="fa-solid fa-gavel"></i> 2차(주총)확정(G25)
                </button>
            </div>

            <!-- 탭 컨텐츠 래퍼 -->
            <div class="tab-content-wrapper" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; position: relative;">
                
                <!-- [TAB 1] 예상배당공시 (상: 마스터 + 하: 종목별상세) -->
                <div class="tab-pane-view active" id="paneTab1" style="display: flex; height: 100%; width: 100%; min-height: 0;">
                    <div class="layout-split-v split-body layout-mobile-stack" data-split-key="JA021B_T1_V" data-default-ratio="55:45" style="width: 100%; height: 100%; min-height: 0; display: flex; flex-direction: column;">
                        <!-- 상단: 발행기관별 예상배당 공시 (d_ja021b_t11) -->
                        <div class="pane-top" style="height: 55%; display: flex; flex-direction: column; min-height: 0; overflow: hidden;">
                            <div class="panel-header" style="padding: 6px 10px; background: #f1f5f9; border-bottom: 1px solid #cbd5e1;">
                                <span class="panel-title" style="font-weight: 600; font-size: 13px; color: #1e293b;"><i class="fa-solid fa-table-list"></i> 발행기관별 예상배당 공시</span>
                            </div>
                            <div class="panel-body" style="flex: 1; min-height: 0; position: relative;">
                                <div id="gridT1Master" class="tabulator-aams-grid" style="height: 100%;"></div>
                            </div>
                        </div>
                        <div class="split-gutter-v" title="드래그하여 상하 비율 조절"></div>
                        <!-- 하단: 종목별 배당 상세 (d_ja021b_t12) -->
                        <div class="pane-bottom" style="height: 45%; display: flex; flex-direction: column; min-height: 0; overflow: hidden;">
                            <div class="panel-header" style="padding: 6px 10px; background: #f1f5f9; border-bottom: 1px solid #cbd5e1;">
                                <span class="panel-title" style="font-weight: 600; font-size: 13px; color: #1e293b;"><i class="fa-solid fa-list-check"></i> 종목별 배당 상세 내역</span>
                            </div>
                            <div class="panel-body" style="flex: 1; min-height: 0; position: relative;">
                                <div id="gridT1Detail" class="tabulator-aams-grid" style="height: 100%;"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- [TAB 2] 운용사별예상배당 (상: 마스터 + 하: 펀드별상세) -->
                <div class="tab-pane-view" id="paneTab2" style="display: none; height: 100%; width: 100%; min-height: 0;">
                    <div class="layout-split-v split-body layout-mobile-stack" data-split-key="JA021B_T2_V" data-default-ratio="55:45" style="width: 100%; height: 100%; min-height: 0; display: flex; flex-direction: column;">
                        <!-- 상단: 운용사별 예상배당 등록 (d_ja021b_t21) -->
                        <div class="pane-top" style="height: 55%; display: flex; flex-direction: column; min-height: 0; overflow: hidden;">
                            <div class="panel-header" style="padding: 6px 10px; background: #f1f5f9; border-bottom: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: space-between;">
                                <span class="panel-title" style="font-weight: 600; font-size: 13px; color: #1e293b;"><i class="fa-solid fa-pen-to-square"></i> 운용사별 예상배당 등록 및 공통 비교</span>
                            </div>
                            <div class="panel-body" style="flex: 1; min-height: 0; position: relative;">
                                <div id="gridT2Master" class="tabulator-aams-grid" style="height: 100%;"></div>
                            </div>
                        </div>
                        <div class="split-gutter-v" title="드래그하여 상하 비율 조절"></div>
                        <!-- 하단: 펀드별 배당권리 상세 (d_ja021b_t22) -->
                        <div class="pane-bottom" style="height: 45%; display: flex; flex-direction: column; min-height: 0; overflow: hidden;">
                            <div class="panel-header" style="padding: 6px 10px; background: #f1f5f9; border-bottom: 1px solid #cbd5e1;">
                                <span class="panel-title" style="font-weight: 600; font-size: 13px; color: #1e293b;"><i class="fa-solid fa-folder-tree"></i> 펀드별 배당권리 상세</span>
                            </div>
                            <div class="panel-body" style="flex: 1; min-height: 0; position: relative;">
                                <div id="gridT2Detail" class="tabulator-aams-grid" style="height: 100%;"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- [TAB 3] 현금확정배당(G20) (상: 마스터 + 하: 펀드별상세) -->
                <div class="tab-pane-view" id="paneTab3" style="display: none; height: 100%; width: 100%; min-height: 0;">
                    <div class="layout-split-v split-body layout-mobile-stack" data-split-key="JA021B_T3_V" data-default-ratio="55:45" style="width: 100%; height: 100%; min-height: 0; display: flex; flex-direction: column;">
                        <!-- 상단: 현금확정배당 등록 (d_ja021b_t31) -->
                        <div class="pane-top" style="height: 55%; display: flex; flex-direction: column; min-height: 0; overflow: hidden;">
                            <div class="panel-header" style="padding: 6px 10px; background: #f1f5f9; border-bottom: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: space-between;">
                                <span class="panel-title" style="font-weight: 600; font-size: 13px; color: #1e293b;"><i class="fa-solid fa-coins"></i> 현금확정배당(G20) 등록</span>
                            </div>
                            <div class="panel-body" style="flex: 1; min-height: 0; position: relative;">
                                <div id="gridT3Master" class="tabulator-aams-grid" style="height: 100%;"></div>
                            </div>
                        </div>
                        <div class="split-gutter-v" title="드래그하여 상하 비율 조절"></div>
                        <!-- 하단: 펀드별 배당권리 상세 (d_ja021b_t32) -->
                        <div class="pane-bottom" style="height: 45%; display: flex; flex-direction: column; min-height: 0; overflow: hidden;">
                            <div class="panel-header" style="padding: 6px 10px; background: #f1f5f9; border-bottom: 1px solid #cbd5e1;">
                                <span class="panel-title" style="font-weight: 600; font-size: 13px; color: #1e293b;"><i class="fa-solid fa-folder-tree"></i> 펀드별 배당권리 상세</span>
                            </div>
                            <div class="panel-body" style="flex: 1; min-height: 0; position: relative;">
                                <div id="gridT3Detail" class="tabulator-aams-grid" style="height: 100%;"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- [TAB 4] 주식확정배당(G20) (상: 마스터 + 하: 펀드별상세) -->
                <div class="tab-pane-view" id="paneTab4" style="display: none; height: 100%; width: 100%; min-height: 0;">
                    <div class="layout-split-v split-body layout-mobile-stack" data-split-key="JA021B_T4_V" data-default-ratio="55:45" style="width: 100%; height: 100%; min-height: 0; display: flex; flex-direction: column;">
                        <!-- 상단: 주식확정배당 등록 (d_ja021b_t41) -->
                        <div class="pane-top" style="height: 55%; display: flex; flex-direction: column; min-height: 0; overflow: hidden;">
                            <div class="panel-header" style="padding: 6px 10px; background: #f1f5f9; border-bottom: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: space-between;">
                                <span class="panel-title" style="font-weight: 600; font-size: 13px; color: #1e293b;"><i class="fa-solid fa-chart-line"></i> 주식확정배당(G20) 등록</span>
                            </div>
                            <div class="panel-body" style="flex: 1; min-height: 0; position: relative;">
                                <div id="gridT4Master" class="tabulator-aams-grid" style="height: 100%;"></div>
                            </div>
                        </div>
                        <div class="split-gutter-v" title="드래그하여 상하 비율 조절"></div>
                        <!-- 하단: 펀드별 배당권리 상세 (d_ja021b_t42) -->
                        <div class="pane-bottom" style="height: 45%; display: flex; flex-direction: column; min-height: 0; overflow: hidden;">
                            <div class="panel-header" style="padding: 6px 10px; background: #f1f5f9; border-bottom: 1px solid #cbd5e1;">
                                <span class="panel-title" style="font-weight: 600; font-size: 13px; color: #1e293b;"><i class="fa-solid fa-folder-tree"></i> 펀드별 배당권리 상세</span>
                            </div>
                            <div class="panel-body" style="flex: 1; min-height: 0; position: relative;">
                                <div id="gridT4Detail" class="tabulator-aams-grid" style="height: 100%;"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- [TAB 5] 2차(주총)확정(G25) (상: 마스터 + 하: 펀드별상세) -->
                <div class="tab-pane-view" id="paneTab5" style="display: none; height: 100%; width: 100%; min-height: 0;">
                    <div class="layout-split-v split-body layout-mobile-stack" data-split-key="JA021B_T5_V" data-default-ratio="55:45" style="width: 100%; height: 100%; min-height: 0; display: flex; flex-direction: column;">
                        <!-- 상단: 2차(주총)확정 등록 (d_ja021b_t51) -->
                        <div class="pane-top" style="height: 55%; display: flex; flex-direction: column; min-height: 0; overflow: hidden;">
                            <div class="panel-header" style="padding: 6px 10px; background: #f1f5f9; border-bottom: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: space-between;">
                                <span class="panel-title" style="font-weight: 600; font-size: 13px; color: #1e293b;"><i class="fa-solid fa-gavel"></i> 2차(주총)확정(G25) 등록</span>
                            </div>
                            <div class="panel-body" style="flex: 1; min-height: 0; position: relative;">
                                <div id="gridT5Master" class="tabulator-aams-grid" style="height: 100%;"></div>
                            </div>
                        </div>
                        <div class="split-gutter-v" title="드래그하여 상하 비율 조절"></div>
                        <!-- 하단: 펀드별 배당권리 상세 (d_ja021b_t52) -->
                        <div class="pane-bottom" style="height: 45%; display: flex; flex-direction: column; min-height: 0; overflow: hidden;">
                            <div class="panel-header" style="padding: 6px 10px; background: #f1f5f9; border-bottom: 1px solid #cbd5e1;">
                                <span class="panel-title" style="font-weight: 600; font-size: 13px; color: #1e293b;"><i class="fa-solid fa-folder-tree"></i> 펀드별 배당권리 상세</span>
                            </div>
                            <div class="panel-body" style="flex: 1; min-height: 0; position: relative;">
                                <div id="gridT5Detail" class="tabulator-aams-grid" style="height: 100%;"></div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- 4. 종목별 확정배당 등록 모달 다이얼로그 (w_ja021b_popup / d_ja021b_p1) -->
    <div id="modalJa021bPopup" class="modal-backdrop" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center;">
        <div class="modal-content" style="background: #ffffff; border-radius: 8px; width: 850px; max-width: 95vw; height: 580px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.2); overflow: hidden;">
            <div class="modal-header" style="padding: 12px 18px; background: #1e293b; color: #ffffff; display: flex; align-items: center; justify-content: space-between;">
                <h4 style="margin: 0; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px;">
                    <i class="fa-solid fa-list-check"></i> <span id="popupModalTitle">종목별 확정배당 등록</span>
                </h4>
                <button type="button" class="btn-close-modal" id="btnClosePopupModalX" style="background: transparent; border: none; color: #ffffff; font-size: 18px; cursor: pointer;">&times;</button>
            </div>
            <div class="modal-body" style="flex: 1; min-height: 0; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: #f8fafc;">
                <div style="display: flex; gap: 14px; align-items: center; font-size: 12px; color: #334155; padding: 6px 10px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 4px;">
                    <div>발행기관: <strong id="popupBalhNm">-</strong> (<span id="popupBalhCo">-</span>)</div>
                    <div>거래일자: <strong id="popupTrYmd">-</strong></div>
                    <div>거래구분: <strong id="popupTrCd">G20</strong></div>
                    <div>액면가: <strong id="popupAekm">-</strong></div>
                </div>
                <div style="flex: 1; min-height: 0; position: relative; border: 1px solid #cbd5e1; border-radius: 4px; background: #ffffff;">
                    <div id="gridPopup" class="tabulator-aams-grid" style="height: 100%;"></div>
                </div>
            </div>
            <div class="modal-footer" style="padding: 10px 18px; background: #f1f5f9; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; gap: 6px;">
                    <button type="button" class="t-btn btn-action" id="btnPopupAddRow" style="height: 28px; font-size: 12px; padding: 0 10px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 4px; cursor: pointer;">
                        <i class="fa-solid fa-plus"></i> 행추가
                    </button>
                    <button type="button" class="t-btn btn-action" id="btnPopupDeleteRow" style="height: 28px; font-size: 12px; padding: 0 10px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 4px; cursor: pointer; color: #dc2626;">
                        <i class="fa-solid fa-trash-can"></i> 행삭제
                    </button>
                </div>
                <div style="display: flex; gap: 6px;">
                    <button type="button" class="t-btn btn-action" id="btnPopupSave" style="height: 28px; font-size: 12px; padding: 0 14px; background: #2563eb; color: #fff; border: 1px solid #1d4ed8; border-radius: 4px; cursor: pointer;">
                        <i class="fa-solid fa-floppy-disk"></i> 저장
                    </button>
                    <button type="button" class="t-btn btn-action" id="btnClosePopupModal" style="height: 28px; font-size: 12px; padding: 0 12px; background: #64748b; color: #fff; border: 1px solid #475569; border-radius: 4px; cursor: pointer;">
                        닫기
                    </button>
                </div>
            </div>
        </div>

            // [포맷터 헬퍼]
            function formatNumCell(val, decimals) {
                if (val == null || val === '') return '';
                const num = Number(val);
                if (isNaN(num)) return val;
                return num.toLocaleString('ko-KR', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
            }

            function formatRedPercent(val, decimals) {
                if (val == null || val === '') return '';
                const num = Number(val);
                if (isNaN(num)) return val;
                const str = num.toLocaleString('ko-KR', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
                return `<span class="cell-text-red">${str}</span>`;
            }

            function formatCompareCell(compareField, decimals) {
                return function (cell) {
                    const rowData = cell.getRow().getData();
                    const val = cell.getValue();
                    if (val == null || val === '') return '';
                    const num = Number(val);
                    if (isNaN(num)) return val;
                    const str = num.toLocaleString('ko-KR', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });

                    const bkVal = rowData ? rowData[compareField] : null;
                    const isDiff = (bkVal != null && Math.abs(Number(bkVal) - num) > 0.0001);
                    const colorClass = isDiff ? "cell-text-red font-bold" : "cell-text-blue";

                    return `<span class="${colorClass}">${str}</span>`;
                };
            }

            function markRowUpdated(cell) {
                const row = cell.getRow();
                const d = row.getData();
                if (!d.isNew) {
                    d.isUpdated = true;
                    d.rowStatus = "U";
                    row.update(d);
                }
            }

            // 마스터 주당배당금 수정 시 % 계산 (PB itemchanged_next)
            function onMasterAekEdited(cell) {
                markRowUpdated(cell);
                const row = cell.getRow();
                const d = row.getData();
                const balhCo = d.balhCo;
                if (!balhCo) return;

                fetch(`/api/subscriptionrights/ja021b/aekm?balhCo=${encodeURIComponent(balhCo)}`)
                    .then(res => res.json())
                    .then(resData => {
                        const aekm = Number(resData.aekm) || 5000;
                        if (aekm > 0) {
                            const field = cell.getField();
                            if (field === 'ilbanAek') {
                                const aek = Number(cell.getValue()) || 0;
                                const per = (aek / aekm) * 100;
                                const rt = aek / aekm;
                                row.update({ cashIlbanPer: per, cashIlbanRt: rt, isUpdated: true });
                            } else if (field === 'woosAek') {
                                const aek = Number(cell.getValue()) || 0;
                                const per = (aek / aekm) * 100;
                                const rt = aek / aekm;
                                row.update({ cashWoosPer: per, cashWoosRt: rt, isUpdated: true });
                            }
                        }
                    }).catch(err => console.warn("액면가 조회 오류:", err));
            }

            function onMasterPerEdited(cell) {
                markRowUpdated(cell);
                const row = cell.getRow();
                const field = cell.getField();
                const val = Number(cell.getValue()) || 0;
                const rt = val / 100;
                if (field === 'cashIlbanPer') row.update({ cashIlbanRt: rt, isUpdated: true });
                else if (field === 'cashWoosPer') row.update({ cashWoosRt: rt, isUpdated: true });
                else if (field === 'stockIlbanPer') row.update({ stockIlbanRt: rt, isUpdated: true });
                else if (field === 'stockWoosPer') row.update({ stockWoosRt: rt, isUpdated: true });
            }

            // 팝업 종목별 배당금 수정 시 현금배당% 계산

                    p.style.display = 'none';
                });

                const targetPane = pane.querySelector('#paneTab' + tabId.substring(1).toUpperCase());
                if (targetPane) {
                    targetPane.style.display = 'flex';
                }

                // 그리드 가상 렌더링 갱신
                setTimeout(() => {
                    if (window.AamsSplitter && typeof window.AamsSplitter.redrawGrids === 'function') {
                        window.AamsSplitter.redrawGrids(pane);
                    } else {
                        redrawAllGrids();
                    }
                }, 50);

                loadCurrentTab();
            }

            // [종목별 확정배당 팝업 모달 열기]
            function openPopupModal(trCd, masterRowData) {
                let m = masterRowData;
                if (!m) {
                    // 현재 활성 탭에서 선택된 마스터 행 찾기
                    if (currentTab === "t3") m = selectedT3MasterRow;
                    else if (currentTab === "t4") m = selectedT4MasterRow;
                    else if (currentTab === "t5") m = selectedT5MasterRow;
                    else if (currentTab === "t1") m = selectedT1MasterRow;
                    else if (currentTab === "t2") m = selectedT2MasterRow;
                }

                if (!m || !m.balhCo) {
                    if (typeof showToast === 'function') {
                        showToast("상단 마스터 그리드에서 행을 먼저 선택해주세요.", "warning");
                    }
                    return;
                }

                popupContext.corpGr = "%";
                popupContext.trYmd = m.trYmd || (pane.getAttribute('data-work-date') || '');
                popupContext.trCd = trCd || m.trCd || 'G20';
                popupContext.balhCo = m.balhCo;
                popupContext.balhNm = m.balhNm || m.xxBalhCo || m.balhCo;

                pane.querySelector('#popupBalhNm').textContent = popupContext.balhNm;
                pane.querySelector('#popupBalhCo').textContent = popupContext.balhCo;
                pane.querySelector('#popupTrYmd').textContent = popupContext.trYmd;
                pane.querySelector('#popupTrCd').textContent = popupContext.trCd;

                // 액면가 조회
                fetch(`/api/subscriptionrights/ja021b/aekm?balhCo=${encodeURIComponent(popupContext.balhCo)}`)
                    .then(res => res.json())
                    .then(resData => {
                        popupContext.aekm = Number(resData.aekm) || 5000;
                        pane.querySelector('#popupAekm').textContent = popupContext.aekm.toLocaleString();
                    });

                // 종목 목록 조회
                fetch(`/api/subscriptionrights/ja021b/items?corpGr=%&ymd=${encodeURIComponent(popupContext.trYmd)}&trCd=${encodeURIComponent(popupContext.trCd)}&balhCo=${encodeURIComponent(popupContext.balhCo)}`)
                    .then(res => res.json())
                    .then(data => {
                        const modal = pane.querySelector('#modalJa021bPopup');
                        if (modal) modal.style.display = 'flex';
                        if (gridPopup) {
                            gridPopup.setData(data || []);
                        }
                    });
            }

            function closePopupModal() {
                const modal = pane.querySelector('#modalJa021bPopup');
                if (modal) modal.style.display = 'none';
            }

            // [초기화 2] 툴바 및 이벤트 바인딩
            function initToolbarAndEvents() {
                // 서브 탭 클릭 바인딩
                pane.querySelectorAll('.sub-tab-btn').forEach(btn => {
                    btn.addEventListener('click', function () {
                        const tabId = this.getAttribute('data-tab');
                        switchTab(tabId);
                    });
                });

                // 단축 팝업 오픈 버튼
                const btnOpenPopup = pane.querySelector('#btnOpenPopupModal');
                if (btnOpenPopup) {
                    btnOpenPopup.addEventListener('click', function () {
                        openPopupModal('G20', null);
                    });
                }

                // 팝업 모달 닫기 버튼들
                const btnCloseX = pane.querySelector('#btnClosePopupModalX');
                if (btnCloseX) btnCloseX.addEventListener('click', closePopupModal);
                const btnClose = pane.querySelector('#btnClosePopupModal');
                if (btnClose) btnClose.addEventListener('click', closePopupModal);

                // 팝업 행 추가
                const btnPopupAdd = pane.querySelector('#btnPopupAddRow');
                if (btnPopupAdd) {
                    btnPopupAdd.addEventListener('click', function () {
                        if (gridPopup) {
                            gridPopup.addRow({
                                isNew: true,
                                rowStatus: "C",
                                corpGr: popupContext.corpGr,
                                trYmd: popupContext.trYmd,
                                trCd: popupContext.trCd,
                                balhCo: popupContext.balhCo,
                                jmCd: "",
                                jmNm: "",
                                baedAek: 0,
                                cashPer: 0,
                                stockPer: 0
                            }, false);
                        }
                    });
                }

                // 팝업 행 삭제
                const btnPopupDelete = pane.querySelector('#btnPopupDeleteRow');
                if (btnPopupDelete) {
                    btnPopupDelete.addEventListener('click', function () {
                        if (!gridPopup) return;
                        const selectedRows = gridPopup.getSelectedRows();
                        if (!selectedRows || selectedRows.length === 0) {
                            if (typeof showToast === 'function') showToast("삭제할 행을 선택해주세요.", "warning");
                            return;
                        }
                        selectedRows.forEach(r => {
                            const d = r.getData();
                            if (d.isNew) {
                                r.delete();
                            } else {
                                d.isDeleted = true;
                                d.rowStatus = "D";
                                r.update(d);
                                r.getElement().style.display = "none";
                            }
                        });
                    });
                }

                // 팝업 저장
                const btnPopupSave = pane.querySelector('#btnPopupSave');
                if (btnPopupSave) {
                    btnPopupSave.addEventListener('click', function () {
                        if (!gridPopup) return;
                        const rows = gridPopup.getData();
                        const changedItems = rows.filter(d => d.isNew || d.isUpdated || d.isDeleted);
                        if (changedItems.length === 0) {
                            if (typeof showToast === 'function') showToast("변경된 데이터가 없습니다.", "info");
                            return;
                        }

                        fetch('/api/subscriptionrights/ja021b/save', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ tabId: 'popup', itemList: changedItems })
                        })
                        .then(res => res.json())
                        .then(result => {
                            if (result.success) {
                                if (typeof showToast === 'function') showToast(result.message || "저장되었습니다.", "success");
                                closePopupModal();
                                loadCurrentTab();
                            } else {
                                if (typeof showToast === 'function') showToast(result.message || "저장 실패", "error");
                            }
                        }).catch(err => {
                            console.error("팝업 저장 실패:", err);
                            if (typeof showToast === 'function') showToast("저장 중 오류가 발생했습니다.", "error");
                        });
                    });
                }

                // 상단 공통 툴바 표준 계약 (08-toolbar-and-query-policy.md)
                pane.onSearch = function () {
                    loadCorpList();
                    loadCurrentTab();
                };

                pane.onSave = function () {
                    let activeGrid = null;
                    if (currentTab === "t2") activeGrid = gridT2Master;
                    else if (currentTab === "t3") activeGrid = gridT3Master;
                    else if (currentTab === "t4") activeGrid = gridT4Master;
                    else if (currentTab === "t5") activeGrid = gridT5Master;

                    if (!activeGrid) {
                        if (typeof showToast === 'function') showToast("저장 가능한 탭이 아닙니다.", "info");
                        return;
                    }

                    const rows = activeGrid.getData();
                    const changedMasters = rows.filter(d => d.isNew || d.isUpdated || d.isDeleted);
                    if (changedMasters.length === 0) {
                        if (typeof showToast === 'function') showToast("변경된 데이터가 없습니다.", "info");
                        return;
                    }

                    fetch('/api/subscriptionrights/ja021b/save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ tabId: currentTab, masterList: changedMasters })
                    })
                    .then(res => res.json())
                    .then(result => {
                        if (result.success) {
                            if (typeof showToast === 'function') showToast(result.message || "저장되었습니다.", "success");
                            loadCurrentTab();
                        } else {
                            if (typeof showToast === 'function') showToast(result.message || "저장 실패", "error");
                        }
                    }).catch(err => {
                        console.error("마스터 저장 실패:", err);
                        if (typeof showToast === 'function') showToast("저장 중 오류가 발생했습니다.", "error");
                    });
                };

                pane.onRefresh = function () {
                    [gridCorp, gridT1Master, gridT1Detail, gridT2Master, gridT2Detail,
                     gridT3Master, gridT3Detail, gridT4Master, gridT4Detail, gridT5Master, gridT5Detail, gridPopup].forEach(g => {
                        if (g) g.clearData();
                    });
                    selectedCorpGr = "";
                    selectedT1MasterRow = null;
                    selectedT2MasterRow = null;
                    selectedT3MasterRow = null;
                    selectedT4MasterRow = null;
                    selectedT5MasterRow = null;

                    if (typeof showToast === 'function') {
                        showToast("화면이 초기화되었습니다.", "info");
                    }
                };

                pane.onExcel = function () {
                    let g = gridT1Master;
                    if (currentTab === "t2") g = gridT2Master;
                    else if (currentTab === "t3") g = gridT3Master;
                    else if (currentTab === "t4") g = gridT4Master;
                    else if (currentTab === "t5") g = gridT5Master;

                    if (g) {
                        g.download("xlsx", `예상배당확정등록_${currentTab.toUpperCase()}.xlsx`, { sheetName: "목록" });
                    }
                };

                // 필터 조건 변경 시: 규칙 08 준수 (자동 조회를 절대 실행하지 않음)
            }

            // [초기화 3] 스플리터
            function initSplitters() {
                if (window.AamsSplitter && typeof window.AamsSplitter.init === 'function') {
                    window.AamsSplitter.init(pane);
                }
            }

            // [MDI 단일 진입점 실행]
            function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                initGrids();
                initToolbarAndEvents();
                initSplitters();
                ue_dddw_retrieve();

                // 초기 데이터 1회 로드
                loadCorpList();
                loadCurrentTab();
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", startInit);
            } else {
                startInit();
            }
        })();
    </script>
</div>
</html>

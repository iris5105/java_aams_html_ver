<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-single ja020e-container layout-mobile-stack-container" th:fragment="mainView" data-pgm-id="W_JA020E"
     th:attr="data-work-date=${workDate},data-corp-gr=${corpGr}"
     style="display: flex; flex-direction: column; height: 100%; width: 100%; overflow: hidden; background-color: #ffffff; position: relative;">

    <!-- 1. 상단 공통 툴바 -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- 2. 상단 필터바 (d_ja020e.srd) -->
    <div class="filter-bar">
        <div class="filter-left">
            <div class="filter-item">
                <label for="filterTrArg">구분</label>
                <select id="filterTrArg" name="trArg" class="filter-select">
                    <option value="1">발행처별</option>
                    <option value="2">권리락일별</option>
                    <option value="3">청약일별</option>
                </select>
            </div>

            <!-- tr_arg = '1': 발행처 검색 -->
            <div id="filterGroupBalhCo" class="filter-item filter-code-search-item" style="display: inline-flex; align-items: center; gap: 6px;">
                <label for="filterBalhCo">발행처</label>
                <div class="code-search-input-wrapper">
                    <input type="text" id="filterBalhCo" name="balhCo" class="filter-input code-search-input" value="%" maxlength="5" autocomplete="off" aria-label="발행처 코드" />
                    <button type="button" id="btnBalhSearch" class="btn-code-search" title="발행처 검색">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
                <span id="textBalhName" class="code-search-name">전발행기관</span>
            </div>

            <!-- tr_arg = '2': 권리락일 선택 -->
            <div id="filterGroupKrakYmd" class="filter-item" style="position: relative; display: none; align-items: center; gap: 6px;">
                <label for="filterKrakYmd">권리락일</label>
                <div class="aams-calendar-wrapper" style="position: relative; display: inline-flex; align-items: center;">
                    <input type="text" id="filterKrakYmd" name="krakYmd" class="t-input aams-calendar-input"
                           style="width: 110px; padding: 4px 8px; font-size: 13px; text-align: center; border: 1px solid #cbd5e1; border-radius: 4px 0 0 4px; cursor: pointer; background: #ffffff;"
                           th:value="${ymd != null ? ymd : ''}" readonly autocomplete="off" />
                    <button type="button" class="t-btn btn-calendar" title="달력 열기"
                            style="padding: 5px 10px; border-radius: 0 4px 4px 0; border-left: none; background-color: #3b82f6; color: #ffffff; border: 1px solid #3b82f6; cursor: pointer;"
                            onclick="AamsCalendar.toggle('filterKrakYmd', event)">
                        <i class="fa-regular fa-calendar-days"></i>
                    </button>
                </div>
            </div>

            <!-- tr_arg = '3': 청약일 선택 -->
            <div id="filterGroupChyungYmd" class="filter-item" style="position: relative; display: none; align-items: center; gap: 6px;">
                <label for="filterChyungYmd">청약일</label>
                <div class="aams-calendar-wrapper" style="position: relative; display: inline-flex; align-items: center;">
                    <input type="text" id="filterChyungYmd" name="chyungYmd" class="t-input aams-calendar-input"
                           style="width: 110px; padding: 4px 8px; font-size: 13px; text-align: center; border: 1px solid #cbd5e1; border-radius: 4px 0 0 4px; cursor: pointer; background: #ffffff;"
                           th:value="${ymd != null ? ymd : ''}" readonly autocomplete="off" />
                    <button type="button" class="t-btn btn-calendar" title="달력 열기"
                            style="padding: 5px 10px; border-radius: 0 4px 4px 0; border-left: none; background-color: #3b82f6; color: #ffffff; border: 1px solid #3b82f6; cursor: pointer;"
                            onclick="AamsCalendar.toggle('filterChyungYmd', event)">
                        <i class="fa-regular fa-calendar-days"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. 메인 그리드 영역 (d_ja020e1.srd) -->
    <div class="grid-section" style="flex: 1 1 auto; padding: 0 12px 10px; min-height: 0; display: flex; flex-direction: column;">
        <div class="sub-grid-header" style="display: flex; align-items: center; justify-content: space-between; min-height: 28px; padding: 4px 10px; background: #f8fafc; border: 1px solid #cbd5e1; border-bottom: 0; flex-shrink: 0;">
            <span class="sub-title" style="font-weight: 600; font-size: 13px; color: #1e293b;">
                <i class="fa-solid fa-clipboard-list" style="margin-right: 6px; color: #3b82f6;"></i>미수령 권리내역 목록
            </span>
        </div>
        <div class="grid-table-wrapper" style="flex: 1 1 auto; min-height: 290px; border: 1px solid #cbd5e1; position: relative; overflow: hidden;">
            <div id="gridList" class="tabulator-aams-grid" style="height: 100%; width: 100%;"></div>
        </div>
    </div>

    <!-- 4. 화면 전용 스크립트 -->
    <script th:inline="javascript">
        (function () {
            const currentScript = document.currentScript;
            const pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;
            if (!pane) return;

            const api = '/api/subscriptionrights/ja020e';
            const field = id => pane.querySelector('#' + id);

            let initialYmd = /*[[${initialYmd}]]*/ '';
            let isInitialized = false;
            let dataRequest = 0;
            let gridList = null;
            let balhSearch = null;

            const trArgOptions = [
                { code: '1', name: '발행처별' },
                { code: '2', name: '권리락일별' },
                { code: '3', name: '청약일별' }
            ];

            function formatDateStr(val) {
                if (!val) return '';
                if (typeof window.formatDateDot === 'function') {
                    return window.formatDateDot(val);
                }
                const s = String(val).replace(/[^0-9]/g, '');
                return s.length === 8 ? `${s.slice(0, 4)}.${s.slice(4, 6)}.${s.slice(6, 8)}` : String(val);
            }

            function syncTrArgVisibility(trArg) {
                const arg = String(trArg || '1').trim();
                const gBalh = field('filterGroupBalhCo');
                const gKrak = field('filterGroupKrakYmd');
                const gChyung = field('filterGroupChyungYmd');
                if (gBalh) gBalh.style.display = arg === '1' ? 'inline-flex' : 'none';
                if (gKrak) gKrak.style.display = arg === '2' ? 'inline-flex' : 'none';
                if (gChyung) gChyung.style.display = arg === '3' ? 'inline-flex' : 'none';
            }

            function initCalendars(ymdVal) {
                if (window.AamsCalendar && typeof window.AamsCalendar.initSimple === 'function') {
                    window.AamsCalendar.initSimple('filterKrakYmd', {
                        pane: pane,
                        initialYmd: ymdVal || initialYmd
                    });
                    window.AamsCalendar.initSimple('filterChyungYmd', {
                        pane: pane,
                        initialYmd: ymdVal || initialYmd
                    });
                }
            }

            async function initTrArgSelect() {
                if (typeof window.initFilterDddw === 'function') {
                    await window.initFilterDddw(pane, {
                        selectId: 'filterTrArg',
                        defaultOptions: trArgOptions,
                        defaultVal: '1',
                        codeTitle: '코드',
                        nameTitle: '조회구분',
                        onSelect: function (code) {
                            syncTrArgVisibility(code);
                        }
                    });
                }
                const trSelect = field('filterTrArg');
                if (trSelect) {
                    trSelect.addEventListener('change', function () {
                        syncTrArgVisibility(trSelect.value);
                    });
                    syncTrArgVisibility(trSelect.value || '1');
                }
            }

            function bindBalhCodeSearch() {
                if (!window.DynamicCodeSearch || typeof window.DynamicCodeSearch.bind !== 'function') return;
                balhSearch = window.DynamicCodeSearch.bind({
                    pane: pane,
                    inputEl: field('filterBalhCo'),
                    btnEl: field('btnBalhSearch'),
                    textEl: field('textBalhName'),
                    columnNm: 'balh_co',
                    seq: 1,
                    getCorpGr: () => (typeof resolveCorpGr === 'function') ? resolveCorpGr(pane) : '',
                    allCode: '%',
                    allName: '전발행기관'
                });
            }

            function initGrid() {
                const el = field('gridList');
                if (!el) return;

                gridList = new Tabulator(el, {
                    height: '100%',
                    layout: 'fitDataFill',
                    selectableRows: 1,
                    placeholder: '조회된 데이터가 없습니다.',
                    columns: [
                        {
                            title: 'No.',
                            formatter: 'rownum',
                            width: 52,
                            hozAlign: 'center',
                            headerHozAlign: 'center',
                            headerSort: false,
                            resizable: false
                        },
                        {
                            title: '발행처명',
                            field: 'balhNm',
                            width: 220,
                            hozAlign: 'left',
                            headerHozAlign: 'center',
                            suppressRepeating: true
                        },
                        {
                            title: '거래코드명',
                            field: 'trNm',
                            width: 210,
                            hozAlign: 'center',
                            headerHozAlign: 'center',
                            suppressRepeating: true
                        },
                        {
                            title: '발생일',
                            field: 'trYmd',
                            width: 115,
                            hozAlign: 'center',
                            headerHozAlign: 'center',
                            formatter: cell => formatDateStr(cell.getValue())
                        },
                        {
                            title: '권리락일',
                            field: 'krakYmd',
                            width: 115,
                            hozAlign: 'center',
                            headerHozAlign: 'center',
                            formatter: cell => formatDateStr(cell.getValue())
                        },
                        {
                            title: '배정기준일',
                            field: 'baejGijunYmd',
                            width: 115,
                            hozAlign: 'center',
                            headerHozAlign: 'center',
                            formatter: cell => formatDateStr(cell.getValue())
                        },
                        {
                            title: '청약일',
                            field: 'chengYmd',
                            width: 115,
                            hozAlign: 'center',
                            headerHozAlign: 'center',
                            formatter: cell => formatDateStr(cell.getValue())
                        },
                        {
                            title: '수령일',
                            field: 'suryYmd',
                            width: 115,
                            hozAlign: 'center',
                            headerHozAlign: 'center',
                            formatter: cell => formatDateStr(cell.getValue())
                        }
                    ]
                });

                if (typeof setupTabulatorRowSelection === 'function') {
                    setupTabulatorRowSelection(gridList);
                }
                if (window.AamsResponsive && typeof window.AamsResponsive.bindGridResize === 'function') {
                    window.AamsResponsive.bindGridResize(pane, [gridList]);
                }
            }

            async function loadData() {
                const corpGr = (typeof resolveCorpGr === 'function') ? resolveCorpGr(pane) : '';
                if (!corpGr) {
                    if (typeof showToast === 'function') showToast('회사그룹 정보가 누락되었습니다.', 'warning');
                    return;
                }

                const trArg = field('filterTrArg') ? (field('filterTrArg').value || '1') : '1';
                const params = new URLSearchParams({ corpGr: corpGr, trArg: trArg });

                if (trArg === '1') {
                    const balhCo = field('filterBalhCo') ? (field('filterBalhCo').value || '').trim() : '%';
                    params.set('balhCo', balhCo || '%');
                } else if (trArg === '2') {
                    const krakYmd = field('filterKrakYmd') ? (field('filterKrakYmd').value || '').trim() : '';
                    if (!krakYmd) {
                        if (typeof showToast === 'function') showToast('권리락일을 선택하십시오.', 'warning');
                        return;
                    }
                    params.set('krakYmd', krakYmd);
                } else if (trArg === '3') {
                    const chengYmd = field('filterChyungYmd') ? (field('filterChyungYmd').value || '').trim() : '';
                    if (!chengYmd) {
                        if (typeof showToast === 'function') showToast('청약일을 선택하십시오.', 'warning');
                        return;
                    }
                    params.set('chengYmd', chengYmd);
                }

                const reqId = ++dataRequest;
                try {
                    const res = await fetch(`${api}/list?` + params.toString());
                    if (!res.ok) throw new Error('데이터 조회 중 오류가 발생했습니다.');
                    const list = await res.json();
                    if (reqId !== dataRequest) return;

                    const rows = Array.isArray(list) ? list : [];
                    await gridList.setData(rows);
                    if (rows.length > 0) {
                        const first = gridList.getRows()[0];
                        if (first) first.select();
                    } else if (typeof showToast === 'function') {
                        showToast('조회된 데이터가 없습니다.', 'info');
                    }
                } catch (err) {
                    if (reqId === dataRequest && typeof showToast === 'function') {
                        showToast(err.message, 'error');
                    }
                }
            }

            async function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                initGrid();
                initCalendars(initialYmd);
                await initTrArgSelect();
                bindBalhCodeSearch();

                // ib_managedata = false: 입력/복사/삭제/저장 버튼 숨김
                const applyToolbarPolicy = () => ['.btn-input', '.btn-copy', '.btn-delete', '.btn-save', '.btn-print'].forEach(sel => {
                    const btn = pane.querySelector(sel);
                    if (btn) btn.style.setProperty('display', 'none', 'important');
                });
                applyToolbarPolicy();
                pane.addEventListener('buttonAuthApplied', applyToolbarPolicy);

                pane.onSearch = loadData;
                pane.onExcel = pane.onDetailExcel = function () {
                    if (gridList) {
                        gridList.download('xlsx', `미수령_권리내역_${initialYmd.replace(/-/g, '')}.xlsx`, { sheetName: '미수령권리내역' });
                    }
                };

                pane.onClear = pane.onRefresh = async function () {
                    ++dataRequest;
                    if (gridList) await gridList.clearData();
                    await initTrArgSelect();
                    if (balhSearch) balhSearch.setValue('%');
                    initCalendars(initialYmd);
                    if (typeof showToast === 'function') showToast('화면이 초기화되었습니다.', 'info');
                };

                pane.onCorpGrChange = async function (newCorpGr) {
                    ++dataRequest;
                    try {
                        const res = await fetch('/api/common/workdate?' + new URLSearchParams({ corpGr: newCorpGr }));
                        if (res.ok) {
                            const d = await res.json();
                            if (d && d.workDate) {
                                initialYmd = d.workDate;
                                initCalendars(initialYmd);
                            }
                        }
                    } catch (e) {
                        console.warn('[w_ja020e] 작업일자 조회 실패:', e);
                    }
                };
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', startInit, { once: true });
            } else {
                startInit();
            }
        })();
    </script>
</div>
</html>

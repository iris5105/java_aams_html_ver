    DataWindow:
      - dw_c: dc_ymd_dddw (기준일자, 조회구분: 1=원화계좌 / 2=외화계좌)
      - dw_list: d_ja036f1 (외화계좌) / d_ja036f1_krw (원화계좌)
      - dw_master: d_ja036f2 (외화계좌) / d_ja036f2_krw (원화계좌) -> 마스터 그리드 더블클릭 시 모달 표시
      - eb_direct_retrieve = true, ib_managedata = false
-->

    <script>
    (function () {
        const script = document.currentScript;
        const pane = script && (script.closest('.tab-pane') || script.closest('.view-container'));
        if (!pane) return;

        const viewEl = pane.classList.contains('ja036f-container')
            ? pane
            : pane.querySelector('.ja036f-container');
        if (!viewEl) return;

        const api = '/api/foreignassetmanagement/ja036f';
        const initialYmd = viewEl.dataset.initialYmd || '';
        const workDate = viewEl.dataset.workDate || '';
        const initialAccountType = viewEl.dataset.initialAccountType === '2' ? '2' : '1';

        let initialized = false;
        let grid = null;
        let gridBuilt = false;
        let hasSucceededSearch = false;
        let jasanMap = {};
        let trusteeMap = {};

        pane.ibManageData = false;

        function getCorpGr() {
            if (typeof resolveCorpGr === 'function') {
                return resolveCorpGr(pane);
            }
            return '';
        }

        function getYmdInput() {
            return pane.querySelector('#filterYmd');
        }

        function getAccountSelect() {
            return pane.querySelector('#filterDddw');
        }

        function getAccountType() {
            const sel = getAccountSelect();
            return (sel && sel.value === '2') ? '2' : '1';
        }

        function getCurrentYmd() {
            if (typeof getFilterYmd === 'function') {
                const v = getFilterYmd(pane, 'YYYY-MM-DD');
                if (v) return v;
            }
            const inp = getYmdInput();
            return inp ? (inp.value || '').trim() : initialYmd;
        }

        function updateToolbarState() {
            if (window.ButtonRole && typeof window.ButtonRole.setSearchState === 'function') {
                window.ButtonRole.setSearchState(pane, hasSucceededSearch);
            }
        }

        function formatNum(val, decimals) {
            if (val === null || val === undefined || val === '') return '';
            const num = Number(val);
            if (!Number.isFinite(num)) return '';
            if (typeof window.formatNumber === 'function') {
                return window.formatNumber(num, decimals);
            }
            return num.toLocaleString('ko-KR', {
                minimumFractionDigits: decimals,
                maximumFractionDigits: decimals
            });
        }

        function numVal(v) {
            const n = Number(v);
            return Number.isFinite(n) ? n : 0;
        }

        function isNonDataRow(data) {
            return Boolean(data && (data.isSummaryRow || data.isGroupSummaryRow));
        }

        function escapeHtml(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function createEmptyAcc() {
            return {
                calcJangoJusu: 0,
                calcTrChuiAek: 0,
                wonCalcChuiAek: 0,
                fcurCalcChuiAek: 0,
                trPyungaAek: 0,
                wonPyungaAek: 0,
                fcurPyungaAek: 0,
                wonPyungaSonik: 0,
                fcurPyungaSonik: 0,
                wonHwanCha: 0,
                fcurHwanCha: 0
            };
        }

        function addRowToAcc(acc, row) {
            const jangoJusu = numVal(row.trBfilJusu) + numVal(row.trUpJusu) - numVal(row.trDwJusu);
            const trChuiAek = numVal(row.trBfilChuiAek) + numVal(row.trUpChuiAek) - numVal(row.trDwChuiAek);
            const wonChuiAek = numVal(row.wonBfilChuiAek) + numVal(row.wonUpChuiAek) - numVal(row.wonDwChuiAek);
            const fcurChuiAek = numVal(row.fcurBfilChuiAek) + numVal(row.fcurUpChuiAek) - numVal(row.fcurDwChuiAek);

            acc.calcJangoJusu += jangoJusu;
            acc.calcTrChuiAek += trChuiAek;
            acc.wonCalcChuiAek += wonChuiAek;
            acc.fcurCalcChuiAek += fcurChuiAek;
            acc.trPyungaAek += numVal(row.trPyungaAek);
            acc.wonPyungaAek += numVal(row.wonPyungaAek);
            acc.fcurPyungaAek += numVal(row.fcurPyungaAek);
            acc.wonPyungaSonik += numVal(row.wonPyungaSonik);
            acc.fcurPyungaSonik += numVal(row.fcurPyungaSonik);
            acc.wonHwanCha += numVal(row.wonHwanCha);
            acc.fcurHwanCha += numVal(row.fcurHwanCha);
        }

        function makeSummaryRow(acc, label, flags) {
            return Object.assign({
                jasanGb: '',
                jasanNm: '',
                fundCd: '',
                fundNm: '',
                currency: '',
                jmCd: '',
                jmNm: label
            }, acc, flags);
        }

        function buildRowsWithSummaries(rawList) {
            if (!Array.isArray(rawList) || rawList.length === 0) {
                return { rows: [], totalAcc: createEmptyAcc(), count: 0 };
            }

            const result = [];
            const totalAcc = createEmptyAcc();
            let currentGb = null;
            let currentGbLabel = '';
            let groupAcc = createEmptyAcc();
            let seq = 1;

            rawList.forEach(function (item) {
                const gb = item.jasanGb != null ? String(item.jasanGb).trim() : '';
                const gbLabel = jasanMap[gb] || item.jasanNm || gb || '기타';

                if (currentGb !== null && gb !== currentGb) {
                    result.push(makeSummaryRow(groupAcc, currentGbLabel + ' 합계', { isGroupSummaryRow: true }));
                    groupAcc = createEmptyAcc();
                }

                currentGb = gb;
                currentGbLabel = gbLabel;

                const rowCopy = Object.assign({}, item, { _seq: seq++ });
                result.push(rowCopy);

                addRowToAcc(groupAcc, rowCopy);
                addRowToAcc(totalAcc, rowCopy);
            });

            if (currentGb !== null) {
                result.push(makeSummaryRow(groupAcc, currentGbLabel + ' 합계', { isGroupSummaryRow: true }));
            }

            return { rows: result, totalAcc: totalAcc, count: rawList.length };
        }

        function calcNormalSum(_values, data, calcParams) {
            let sum = 0;
            if (!data || !Array.isArray(data)) return sum;
            const fieldName = calcParams && calcParams.field;
            if (!fieldName) return sum;
            data.forEach(function (d) {
                if (d && !d.isGroupSummaryRow && !d.isSummaryRow) {
                    const v = Number(d[fieldName]);
                    if (!Number.isNaN(v)) sum += v;
                }
            });
            return sum;
        }

        function updateFooterVisibility(data) {
            const el = pane.querySelector('#gridJa036f');
            if (!el) return;
            const footer = el.querySelector('.tabulator-footer');
            if (footer) {
                footer.style.display = (data && data.length > 0) ? 'block' : 'none';
            }
        }

                        }
                        return numVal(data.wonBfilChuiAek) + numVal(data.wonUpChuiAek) - numVal(data.wonDwChuiAek);
                    },

                    }

                {

                    width: 140,

                    headerHozAlign: 'center',

                        return formatNum(cell.getValue(), 2);
                    },
                    bottomCalc: calcNormalSum,
                    bottomCalcParams: { field: 'trPyungaAek' },
                    bottomCalcFormatter: function (cell) {
                        return formatNum(cell.getValue(), 2);
                    }
                },
                {

                    field: prefix + 'PyungaAek',
                    width: 145,

                    },

                    }
                },

                    field: prefix + 'PyungaSonik',

                    bottomCalc: calcNormalSum,
                    bottomCalcParams: { field: prefix + 'PyungaSonik' },
                    bottomCalcFormatter: function (cell) {

        function updateDetailLabels(accountType) {
            const isForeign = accountType === '2';
            const suffix = isForeign ? '(기준통화)' : '(원화)';

            const badge = pane.querySelector('#ja036fAccountBadge');
            if (badge) {
                badge.textContent = isForeign ? '외화계좌 기준' : '원화계좌 기준';
            }

            const panelTitle = pane.querySelector('#ja036fBasePanelTitle');
            if (panelTitle) {
                panelTitle.textContent = isForeign ? '기준통화 환산 금액 및 평가손익' : '원화 환산 금액 및 평가손익';
            }

            pane.querySelectorAll('[data-base-label]').forEach(function (el) {
                el.textContent = el.dataset.baseLabel + suffix;
            });
        }

        function renderDetail(data) {
            const accountType = getAccountType();
            const isForeign = accountType === '2';
            const detailCard = pane.querySelector('#ja036fDetailCard');
            if (!detailCard) return;

            if (!data) {
                detailCard.querySelectorAll('input.ja036f-val').forEach(function (inp) {
                    inp.value = '';
                });
                return;
            }

            const enriched = Object.assign({}, data, {
                jasanNm: data.jasanNm || jasanMap[data.jasanGb] || data.jasanGb || '',
                trusteeNm: trusteeMap[data.trustee] || data.trustee || '',
                calcJangoJusu: numVal(data.trBfilJusu) + numVal(data.trUpJusu) - numVal(data.trDwJusu),
                calcTrChuiAek: numVal(data.trBfilChuiAek) + numVal(data.trUpChuiAek) - numVal(data.trDwChuiAek)
            });

            detailCard.querySelectorAll('[data-field]').forEach(function (inp) {
                const key = inp.dataset.field;
                const fmt = inp.dataset.format;
                const raw = enriched[key];
                if (fmt === 'dec4') inp.value = formatNum(raw, 4);
                else if (fmt === 'dec2') inp.value = formatNum(raw, 2);
                else if (fmt === 'dec0') inp.value = formatNum(raw, 0);
                else inp.value = raw != null ? String(raw) : '';
            });

            const baseValues = {
                bfilChuiAek: isForeign ? data.fcurBfilChuiAek : data.wonBfilChuiAek,
                upChuiAek: isForeign ? data.fcurUpChuiAek : data.wonUpChuiAek,
                dwChuiAek: isForeign ? data.fcurDwChuiAek : data.wonDwChuiAek,
                calcChuiAek: isForeign
                    ? (numVal(data.fcurBfilChuiAek) + numVal(data.fcurUpChuiAek) - numVal(data.fcurDwChuiAek))
                    : (numVal(data.wonBfilChuiAek) + numVal(data.wonUpChuiAek) - numVal(data.wonDwChuiAek)),
                bfilSungCost: isForeign ? data.fcurBfilSungCost : data.wonBfilSungCost,
                sungCost: isForeign ? data.fcurSungCost : data.wonSungCost,
                pyungaAek: isForeign ? data.fcurPyungaAek : data.wonPyungaAek,
                pyungaSonik: isForeign ? data.fcurPyungaSonik : data.wonPyungaSonik,
                hwanCha: isForeign ? data.fcurHwanCha : data.wonHwanCha
            };

            detailCard.querySelectorAll('[data-base-field]').forEach(function (inp) {
                const key = inp.dataset.baseField;
                inp.value = formatNum(baseValues[key], 0);
            });
        }

        function openDetailModal(rowData) {
            if (!rowData) return;
            updateDetailLabels(getAccountType());
            renderDetail(rowData);
            const modal = pane.querySelector('#ja036fDetailModal');
            if (modal) {
                modal.classList.add('open');
            }
        }

        function closeDetailModal() {
            const modal = pane.querySelector('#ja036fDetailModal');
            if (modal) {
                modal.classList.remove('open');
            }
        }

        function initModalEvents() {
            const modal = pane.querySelector('#ja036fDetailModal');
            const btnClose = pane.querySelector('#btnJa036fModalClose');
            const btnCloseX = pane.querySelector('#btnJa036fModalCloseX');

            if (btnClose) btnClose.addEventListener('click', closeDetailModal);
            if (btnCloseX) btnCloseX.addEventListener('click', closeDetailModal);
            if (modal) {
                modal.addEventListener('click', function (e) {
                    if (e.target === modal) {
                        closeDetailModal();
                    }
                });
            }
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && modal && modal.classList.contains('open')) {
                    closeDetailModal();
                }
            });
        }

        function ensureGrid() {
            if (gridBuilt && grid) return grid;
            const el = pane.querySelector('#gridJa036f');
            if (!el || typeof Tabulator === 'undefined') return null;

            grid = new Tabulator(el, {
                layout: 'fitDataFill',
                height: '100%',
                placeholder: '조회된 데이터가 없습니다.',
                selectableRows: 1,
                columns: buildColumns(getAccountType()),
                rowFormatter: function (row) {
                    const data = row.getData();
                    if (!data) return;
                    if (data.isSummaryRow) {
                        row.getElement().classList.add('aams-summary-row');
                    } else if (data.isGroupSummaryRow) {
                        row.getElement().classList.add('ja036f-group-summary-row');
                    }
                }
            });

            grid.on('rowClick', function (_e, row) {
                if (!row) return;
                const data = row.getData();
                if (isNonDataRow(data)) return;
                row.select();
            });

            grid.on('rowDblClick', function (_e, row) {
                if (!row) return;
                const data = row.getData();
                if (isNonDataRow(data)) return;
                row.select();
                openDetailModal(data);
            });

            updateFooterVisibility([]);
            gridBuilt = true;
            return grid;
        }

        async function loadDddwMap(dddwId, seq) {
            try {
                const corpGr = getCorpGr();
                let list = [];
                if (typeof window.f_dddwctl === 'function') {
                    list = await window.f_dddwctl(dddwId, corpGr, '', seq, '');
                } else {
                    const params = new URLSearchParams({
                        dddwId: dddwId,
                        seq: String(seq)
                    });
                    if (corpGr) params.set('corpGr', corpGr);
                    const res = await fetch('/api/common/dddw?' + params.toString(), {
                        credentials: 'same-origin'
                    });
                    if (!res.ok) return {};
                    list = await res.json();
                }
                const map = {};
                if (Array.isArray(list)) {
                    list.forEach(function (item) {
                        const code = item.cd != null ? String(item.cd).trim() : '';
                        const name = item.dscr != null ? String(item.dscr).trim() : code;
                        if (code) map[code] = name;
                    });
                }
                return map;
            } catch (_e) {
                return {};
            }
        }

        async function loadList() {
            const g = ensureGrid();
            if (!g) return;

            const ymd = getCurrentYmd();
            if (!ymd) {
                if (typeof showToast === 'function') {
                    showToast('기준일자를 선택해 주세요.', 'warning');
                }
                return;
            }

            closeDetailModal();
            const accountType = getAccountType();
            updateDetailLabels(accountType);
            g.setColumns(buildColumns(accountType));

            const params = new URLSearchParams({
                ymd: ymd,
                accountType: accountType
            });
            const corpGr = getCorpGr();
            if (corpGr) params.set('corpGr', corpGr);

            try {
                const res = await fetch(api + '/list?' + params.toString(), {
                    credentials: 'same-origin'
                });
                if (!res.ok) {
                    throw new Error('HTTP ' + res.status);
                }
                const rows = await res.json();
                const list = Array.isArray(rows) ? rows : [];
                const summaryResult = buildRowsWithSummaries(list);
                await g.setData(summaryResult.rows);
                updateFooterVisibility(summaryResult.rows);

                const firstDataRow = g.getRows().find(function (r) {
                    return !isNonDataRow(r.getData());
                });
                if (firstDataRow) {
                    firstDataRow.select();
                }

                hasSucceededSearch = true;
                updateToolbarState();
            } catch (err) {
                console.error('w_ja036f loadList error:', err);
                if (typeof showToast === 'function') {
                    showToast('외화 자산 조회 중 오류가 발생했습니다.', 'error');
                }
            }
        }

        function initAccountSelect() {
            const sel = getAccountSelect();
            if (!sel) return;
            sel.innerHTML = '';
            [
                { value: '1', label: '원화계좌' },
                { value: '2', label: '외화계좌' }
            ].forEach(function (optData) {
                const opt = document.createElement('option');
                opt.value = optData.value;
                opt.textContent = optData.label;
                sel.appendChild(opt);
            });
            sel.value = initialAccountType;
            updateDetailLabels(initialAccountType);

            sel.addEventListener('change', function () {
                const nextType = getAccountType();
                updateDetailLabels(nextType);
                if (grid) {
                    grid.setColumns(buildColumns(nextType));
                }
                loadList();
            });
        }

        function initCalendar() {
            const ymdInput = getYmdInput();
            if (ymdInput && !ymdInput.value && (initialYmd || workDate)) {
                ymdInput.value = initialYmd || workDate;
            }
            if (window.AamsCalendar && typeof window.AamsCalendar.init === 'function' && ymdInput) {
                window.AamsCalendar.init(ymdInput.id || 'filterYmd', { pane: pane });
            }
        }

        pane.onSearch = function () {
            loadList();
        };

        pane.onRefresh = pane.onClear = function () {
            closeDetailModal();
            if (grid) grid.clearData();
            updateFooterVisibility([]);
            renderDetail(null);
            hasSucceededSearch = false;
            updateToolbarState();
            if (typeof showToast === 'function') {
                showToast('화면이 초기화되었습니다.', 'info');
            }
        };

        pane.onExcel = function () {
            if (!grid) return;
            const ymdStr = (getCurrentYmd() || '').replace(/-/g, '');
            const typeLabel = getAccountType() === '2' ? '외화계좌' : '원화계좌';
            grid.download('xlsx', '외화자산조회_' + typeLabel + '_' + ymdStr + '.xlsx', {
                sheetName: '외화자산조회'
            });
        };

        pane.onCorpGrChange = function () {
            closeDetailModal();
            hasSucceededSearch = false;
            updateToolbarState();
            Promise.all([loadDddwMap('jasan_gb', 51), loadDddwMap('trustee', 1)]).then(function (maps) {
                jasanMap = maps[0] || {};
                trusteeMap = maps[1] || {};
                loadList();
            });
        };

        async function init() {
            if (initialized) return;
            initialized = true;

            initCalendar();
            initAccountSelect();
            initModalEvents();
            ensureGrid();
            updateToolbarState();

            const maps = await Promise.all([loadDddwMap('jasan_gb', 51), loadDddwMap('trustee', 1)]);
            jasanMap = maps[0] || {};
            trusteeMap = maps[1] || {};

            await loadList();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>

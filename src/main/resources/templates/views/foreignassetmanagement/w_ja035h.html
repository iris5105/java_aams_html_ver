<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
    W_JA035H: 외화 NOTE이자수령 (사무관리 > 외화자산운용 > 외화자산운용)
    DataWindow:
      - dw_c: dc_ymd (영업일자)
      - dw_list: d_ja035h (SYT0YS, TR_CD = 'E2P')
-->
<div class="view-container layout-single ja035h-container layout-mobile-stack-container" th:fragment="ja035hView">

    <div class="view-toolbar">
        <div class="toolbar-left">
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <div class="filter-bar">
        <div class="filter-left">
            <div class="filter-item" style="position: relative; display: flex; align-items: center; gap: 6px;">
                <label for="filterJa035hYmd">영업일자</label>
                <div class="aams-calendar-wrapper" style="position: relative; display: inline-flex; align-items: center;">
                    <input type="text" id="filterJa035hYmd" name="ymd" class="t-input aams-calendar-input"
                           style="width: 110px; padding: 4px 8px; font-size: 13px; text-align: center; border: 1px solid #cbd5e1; border-radius: 4px 0 0 4px; cursor: pointer; background: #ffffff;"
                           th:value="${ymd != null ? ymd : ''}" readonly autocomplete="off" />
                    <button type="button" class="t-btn btn-calendar" title="달력 열기"
                            style="padding: 5px 10px; border-radius: 0 4px 4px 0; border-left: none; background-color: #3b82f6; color: #ffffff; border: 1px solid #3b82f6; cursor: pointer;"
                            onclick="AamsCalendar.toggle('filterJa035hYmd', event)">
                        <i class="fa-regular fa-calendar-days"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <section class="grid-section" aria-label="외화 NOTE이자수령">
        <div class="grid-table-wrapper">
            <div id="gridJa035h" class="tabulator-aams-grid"></div>
        </div>
    </section>

    <script th:inline="javascript">
    (function () {
        const script = document.currentScript;
        const pane = script && (script.closest('.tab-pane') || script.closest('.view-container'));
        if (!pane) return;

        const api = '/api/foreignassetmanagement/ja035h';
        const calendarId = 'filterJa035hYmd';
        const initialYmd = /*[[${initialYmd}]]*/ '';
        const workDate = /*[[${workDate}]]*/ '';
        const initialTrDates = /*[[${trDates}]]*/ [];

        let initialized = false;
        let grid = null;
        let gridBuilt = false;
        let cudManager = null;
        let maxSeq = 0;
        let hasSucceededSearch = false;

        const dddwOptionsMap = {
            gyulje_jm_cd: [],
            tr_cd: [],
            trustee: []
        };

        const notify = (msg, level) => { if (window.showToast) window.showToast(msg, level); };
        const corpGr = () => window.resolveCorpGr ? window.resolveCorpGr(pane) : '';
        const ymd = () => window.getFilterYmd ? window.getFilterYmd(pane) : (pane.querySelector('#' + calendarId)?.value || '');
        const num = val => Number(val) || 0;

        function canManage() {
            const curYmd = ymd();
            if (workDate && curYmd && curYmd < workDate) return false;
            if (window.ButtonRole && typeof window.ButtonRole.isDisabled === 'function') {
                const saveBtn = pane.querySelector('.toolbar-left [data-btn-id="save"]');
                if (saveBtn && window.ButtonRole.isDisabled(saveBtn)) return false;
            }
            return true;
        }

        function restoreToolbarState() {
            if (window.ButtonRole && typeof window.ButtonRole.setSearchState === 'function') {
                window.ButtonRole.setSearchState(pane, hasSucceededSearch);
            }
        }

        async function fetchJson(url, options) {
            const response = await fetch(url, options);
            const body = await response.json().catch(() => null);
            if (!response.ok || (body && body.success === false)) {
                throw new Error((body && body.message) || '처리 중 오류가 발생했습니다.');
            }
            return body;
        }

        function markRowUpdated(row, patch) {
            if (!row) return;
            const d = row.getData();
            row.update(Object.assign({
                isUpdated: !d.isNew,
                rowStatus: d.isNew ? 'C' : 'U'
            }, patch || {}));
        }

        async function applyItemInfo(row, yjCd, curCurrency) {
            if (!row || !corpGr()) return;
            try {
                const res = await fetchJson(api + '/item-info?' + new URLSearchParams({
                    corpGr: corpGr(),
                    yjCd: yjCd || '',
                    currency: curCurrency || ''
                }));
                if (!res) return;
                const patch = {};
                if (res.currency) patch.currency = res.currency;
                if (res.trustee) patch.trustee = res.trustee;
                if (res.gyuljeJmCd) patch.gyuljeJmCd = res.gyuljeJmCd;
                markRowUpdated(row, patch);
            } catch (e) {
                console.warn('[Ja035h] item-info 조회 오류:', e);
            }
        }

        async function applyTrusteeInfo(row, trustee) {
            if (!row || !trustee || !corpGr()) return;
            try {
                const res = await fetchJson(api + '/trustee-info?' + new URLSearchParams({
                    corpGr: corpGr(),
                    trustee: trustee
                }));
                if (!res) return;
                const patch = {};
                if (res.currency) patch.currency = res.currency;
                if (res.gyuljeJmCd) patch.gyuljeJmCd = res.gyuljeJmCd;
                markRowUpdated(row, patch);
            } catch (e) {
                console.warn('[Ja035h] trustee-info 조회 오류:', e);
            }
        }

        async function applyGyuljeAekCalc(row, gyuljeAek) {
            const d = row.getData();
            const val = num(gyuljeAek);
            const patch = { suryAek: val };
            if (d.currency && corpGr()) {
                try {
                    const res = await fetchJson(api + '/currency-rt?' + new URLSearchParams({
                        corpGr: corpGr(),
                        ymd: workDate || ymd(),
                        currency: d.currency
                    }));
                    const rt = num(res && res.currencyRt);
                    patch.wonGyuljeAek = Math.trunc(val * rt);
                } catch (e) {
                    console.warn('[Ja035h] currency-rt 조회 오류:', e);
                }
            }
            markRowUpdated(row, patch);
        }

        async function onCellEdited(cell) {
            if (!cell) return;
            const row = cell.getRow();
            if (!row) return;
            const field = cell.getField();
            const d = row.getData();

            if (!d.isNew) {
                d.isUpdated = true;
                d.rowStatus = 'U';
            }

            if (field === 'gyuljeAek') {
                await applyGyuljeAekCalc(row, d.gyuljeAek);
            } else if (field === 'yjCd') {
                await applyItemInfo(row, d.yjCd, d.currency);
            } else if (field === 'trustee') {
                await applyTrusteeInfo(row, d.trustee);
            }
        }

        function editCol(field, title, width, extra) {
            return Object.assign({
                field: field,
                title: title,
                width: width,
                editor: 'input',
                editable: () => canManage(),
                cellClick: window.aamsCellEdit,
                cellEdited: onCellEdited
            }, extra || {});
        }

        function numCol(field, title, width, decimals, writable = false) {
            const col = {
                field: field,
                title: title,
                width: width,
                hozAlign: 'right',
                formatter: function (cell) {
                    const val = cell.getValue();
                    if (val === null || val === undefined || val === '') return '';
                    const n = Number(val);
                    if (Number.isNaN(n)) return '';
                    return n.toLocaleString('ko-KR', {
                        minimumFractionDigits: decimals,
                        maximumFractionDigits: decimals
                    });
                }
            };
            return writable
                ? Object.assign(editCol(field, title, width), col, { editor: 'number' })
                : col;
        }

        function openFundSearch(target) {
            const row = target && target.getRow ? target.getRow() : target;
            if (!row || !canManage()) return;
            if (!window.DynamicCodeSearch || typeof window.DynamicCodeSearch.openModal !== 'function') return;

            window.DynamicCodeSearch.openModal({
                title: '펀드 검색',
                columnNm: 'fund_cd',
                corpGr: corpGr(),
                seq: 1,
                row: row,
                initialKeyword: row.getData().fundCd || '',
                onSelect: function (code, name) {
                    markRowUpdated(row, { fundCd: code || '', xxFundCd: name || '' });
                }
            });
        }

        function openItemSearch(target) {
            const row = target && target.getRow ? target.getRow() : target;
            if (!row || !canManage()) return;
            if (!window.DynamicCodeSearch || typeof window.DynamicCodeSearch.openModal !== 'function') return;

            const d = row.getData();
            const safeCorpGr = corpGr().replaceAll("'", "''");
            const ymdDot = (ymd() || '').replaceAll('-', '.');
            const safeFundCd = (d.fundCd || '').replaceAll("'", "''");
            const addWhere = "jm_cd in (select jm_cd from sym0yz where corp_gr='" + safeCorpGr +
                "' and ymd='" + ymdDot + "' and fund_cd='" + safeFundCd + "')";

            window.DynamicCodeSearch.openModal({
                title: '종목 검색',
                columnNm: 'yj_cd',
                corpGr: corpGr(),
                seq: 2,
                addWhere: addWhere,
                row: row,
                initialKeyword: d.yjCd || '',
                onSelect: function (code, name) {
                    markRowUpdated(row, { yjCd: code || '', xxYjCd: name || '' });
                    applyItemInfo(row, code, row.getData().currency);
                }
            });
        }

        function initGrid() {
            grid = new Tabulator(pane.querySelector('#gridJa035h'), {
                height: '100%',
                layout: 'fitDataFill',
                selectableRows: 1,
                editTriggerEvent: 'click',
                placeholder: '조회된 내역이 없습니다.',
                columnDefaults: {
                    vertAlign: 'middle',
                    headerHozAlign: 'center',
                    headerSort: false
                },
                columns: [
                    {
                        title: 'No.',
                        width: 55,
                        hozAlign: 'center',
                        formatter: cell => cell.getRow().getPosition(true)
                    },
                    {
                        title: '수령일자',
                        field: 'trYmd',
                        width: 105,
                        hozAlign: 'center',
                        formatter: cell => window.formatDateVal ? window.formatDateVal(cell.getValue()) : (cell.getValue() || '')
                    },
                    editCol('fundCd', '펀드번호', 105, {
                        hozAlign: 'center',
                        headerCssClass: 'col-hdr-green',
                        cellDblClick: (_e, cell) => openFundSearch(cell)
                    }),
                    {
                        title: '',
                        field: 'pXxFundCd',
                        width: 36,
                        minWidth: 36,
                        maxWidth: 36,
                        resizable: false,
                        hozAlign: 'center',
                        formatter: () => '<button type="button" class="btn-grid-addon btn-search" title="펀드 검색"><i class="fa-solid fa-magnifying-glass"></i></button>',
                        cellClick: function (event, cell) {
                            event.stopPropagation();
                            openFundSearch(cell);
                        }
                    },
                    { title: '계좌명', field: 'xxFundCd', width: 190, hozAlign: 'left' },
                    editCol('yjCd', '종목', 120, {
                        hozAlign: 'center',
                        cellDblClick: (_e, cell) => openItemSearch(cell)
                    }),
                    {
                        title: '',
                        field: 'pXxYjCd',
                        width: 36,
                        minWidth: 36,
                        maxWidth: 36,
                        resizable: false,
                        hozAlign: 'center',
                        formatter: () => '<button type="button" class="btn-grid-addon btn-search" title="종목 검색"><i class="fa-solid fa-magnifying-glass"></i></button>',
                        cellClick: function (event, cell) {
                            event.stopPropagation();
                            openItemSearch(cell);
                        }
                    },
                    { title: '종목명', field: 'xxYjCd', width: 200, hozAlign: 'left' },
                    numCol('gyuljeAek', 'NOTE이자', 130, 2, true),
                    { title: '통화', field: 'currency', width: 80, hozAlign: 'center' },
                    editCol('trustee', '해외보관처', 145, {
                        hozAlign: 'left',
                        editor: 'list',
                        editorParams: () => ({ values: f_dddwctl ? f_dddwctl.getOptions(dddwOptionsMap, 'trustee') : [] }),
                        formatter: cell => (f_dddwctl && f_dddwctl.getLabel(dddwOptionsMap, 'trustee', cell.getValue())) || cell.getValue() || ''
                    }),
                    {
                        title: '결제종목',
                        field: 'gyuljeJmCd',
                        width: 145,
                        hozAlign: 'center',
                        headerCssClass: 'col-hdr-green',
                        formatter: cell => (f_dddwctl && f_dddwctl.getLabel(dddwOptionsMap, 'gyulje_jm_cd', cell.getValue())) || cell.getValue() || ''
                    },
                    numCol('wonGyuljeAek', '원화결제금액', 135, 0, false),
                    numCol('wonHwanCha', '환차손익', 130, 0, false),
                    { title: '기준통화', field: 'fundCurrency', width: 80, hozAlign: 'center', cssClass: 'cell-text-muted' },
                    numCol('fcurGyuljeAek', '기준통화 결제금액', 135, 2, false),
                    numCol('syt0ysFcurHwanCha', '기준통화 환차손익', 125, 2, false)
                ]
            });

            grid.on('tableBuilt', function () {
                gridBuilt = true;
            });

            if (typeof setupTabulatorRowSelection === 'function') {
                setupTabulatorRowSelection(grid);
            }
            if (window.AamsResponsive) {
                AamsResponsive.bindGridResize(pane, [grid]);
            }
            if (window.AamsCudManager) {
                cudManager = AamsCudManager.create(grid, {
                    allowedFields: [
                        'ymd', 'trYmd', 'trCd', 'trCoCd', 'trSeq', 'gyuljeYmd', 'gyuljeGb',
                        'suryAek', 'bsType', 'wonGyuljeAek', 'wonHwanCha',
                        'fcurGyuljeAek', 'syt0ysFcurHwanCha', 'bunhalAek',
                        'origFundCd', 'origYjCd', 'origTrustee', 'origTrCoCd', 'isDeleted'
                    ]
                });
            }
        }

        async function loadGridOptions() {
            if (!corpGr() || !window.f_dddwctl) return;
            const results = await f_dddwctl.retrieveMultiple({
                gyulje_jm_cd: ['gyulje_jm_cd', corpGr(), '', 1, ''],
                tr_cd:        ['tr_cd', corpGr(), '', 1, ''],
                trustee:      ['trustee', corpGr(), '', 1, '']
            });
            dddwOptionsMap.gyulje_jm_cd = results.gyulje_jm_cd || [];
            dddwOptionsMap.tr_cd = results.tr_cd || [];
            dddwOptionsMap.trustee = results.trustee || [];
            if (grid && gridBuilt) {
                grid.getRows().forEach(r => r.reformat());
            }
        }

        function initCalendar() {
            if (!window.AamsCalendar) return;
            AamsCalendar.init(calendarId, {
                pane: pane,
                initialYmd: initialYmd || ymd(),
                highlightDates: Array.isArray(initialTrDates) ? initialTrDates : [],
                datesApiUrl: api + '/dates',
                corpGr: corpGr(),
                historyTitle: '외화 NOTE이자수령 내역 존재'
            });
        }

        async function load() {
            if (!corpGr()) {
                restoreToolbarState();
                return notify('회사그룹을 확인해주세요.', 'warning');
            }
            if (!ymd()) {
                restoreToolbarState();
                return notify('영업일자를 선택해주세요.', 'warning');
            }

            try {
                const rows = await fetchJson(api + '/list?' + new URLSearchParams({
                    corpGr: corpGr(),
                    ymd: ymd()
                }));
                hasSucceededSearch = true;
                maxSeq = Math.max(0, ...rows.map(r => Number(r.trSeq) || 0));
                const formatted = cudManager ? cudManager.formatData(rows) : rows;
                await grid.setData(formatted);
                const firstRow = grid.getRows()[0];
                if (firstRow) firstRow.select();
            } catch (err) {
                restoreToolbarState();
                notify(err.message || '조회 중 오류가 발생했습니다.', 'error');
            }
        }

        function addRow() {
            if (!canManage()) {
                return notify('작업일자 이전 날짜에는 입력할 수 없습니다.', 'warning');
            }
            const baseYmd = workDate || ymd();
            const newRow = {
                isNew: true,
                rowStatus: 'C',
                corpGr: corpGr(),
                ymd: baseYmd,
                trYmd: baseYmd,
                trCd: 'E2P',
                trSeq: ++maxSeq,
                gyuljeYmd: baseYmd,
                gyuljeGb: 'Y',
                bsType: 0,
                gyuljeAek: 0,
                suryAek: 0,
                wonGyuljeAek: 0
            };
            grid.addRow(newRow).then(r => {
                r.select();
                const cell = r.getCell('fundCd');
                if (cell) cell.edit();
            });
        }

        function deleteRow() {
            if (!grid || !canManage()) return;
            const selectedRows = grid.getSelectedRows();
            if (!selectedRows.length) {
                return notify('삭제할 행을 먼저 선택해주세요.', 'warning');
            }
            if (!confirm('선택한 행을 삭제하시겠습니까? (저장 시 DB에 반영됩니다)')) return;

            const targetRow = selectedRows[0];
            const dataRowsBefore = grid.getRows();
            const deletedIndex = dataRowsBefore.indexOf(targetRow);

            const finalizeDelete = () => {
                const remaining = grid.getRows();
                remaining.forEach(r => r.reformat());
                if (remaining.length > 0 && deletedIndex >= 0) {
                    const nextIdx = deletedIndex < remaining.length ? deletedIndex : remaining.length - 1;
                    const nextRow = remaining[nextIdx];
                    if (nextRow) {
                        grid.deselectRow();
                        nextRow.select();
                        try { nextRow.scrollTo(); } catch (e) {}
                    }
                }
                notify('행이 삭제되었습니다. [저장] 시 최종 반영됩니다.', 'info');
            };

            if (cudManager && typeof cudManager.deleteRow === 'function') {
                cudManager.deleteRow(targetRow).then(finalizeDelete);
            } else {
                targetRow.delete().then(finalizeDelete);
            }
        }

        async function save() {
            if (!canManage()) {
                return notify('작업일자 이전 데이터는 수정할 수 없습니다.', 'warning');
            }
            const changes = cudManager
                ? cudManager.getChanges()
                : grid.getData().filter(r => r.isNew || r.isUpdated || r.isDeleted);

            if (!changes || !changes.length) {
                return notify('저장할 변경 내역이 없습니다.', 'info');
            }

            try {
                const res = await fetchJson(api + '/save?' + new URLSearchParams({
                    corpGr: corpGr(),
                    ymd: ymd()
                }), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(changes)
                });
                notify(res.message || '저장되었습니다.', 'success');
                if (window.AamsCalendar) {
                    AamsCalendar.loadHighlightDates(calendarId, api + '/dates', corpGr());
                }
                await load();
            } catch (err) {
                notify(err.message || '저장 중 오류가 발생했습니다.', 'error');
            }
        }

        function refresh() {
            hasSucceededSearch = false;
            maxSeq = 0;
            if (cudManager && typeof cudManager.reset === 'function') {
                cudManager.reset();
            }
            if (window.safeClearGrid) {
                window.safeClearGrid(grid);
            } else if (grid) {
                grid.setData([]);
            }
            restoreToolbarState();
        }

        function start() {
            if (initialized) return;
            initialized = true;

            initCalendar();
            initGrid();
            loadGridOptions().catch(err => notify(err.message || '선택 목록을 불러오지 못했습니다.', 'error'));

            pane.onSearch = load;
            pane.onInput = addRow;
            pane.onDelete = deleteRow;
            pane.onSave = save;
            pane.onRefresh = refresh;
            pane.onCorpGrChange = function (nextCorpGr) {
                refresh();
                loadGridOptions().catch(err => notify(err.message, 'error'));
                if (window.AamsCalendar) {
                    AamsCalendar.loadHighlightDates(calendarId, api + '/dates', nextCorpGr || corpGr());
                }
            };
            pane.onExcel = function () {
                if (grid) {
                    grid.download('xlsx', '외화_NOTE이자수령_' + (ymd() || '') + '.xlsx', { sheetName: 'NOTE이자수령' });
                }
            };
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', start);
        } else {
            start();
        }
    })();
    </script>
</div>
</html>

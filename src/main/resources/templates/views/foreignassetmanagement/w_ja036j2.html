<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-split layout-mobile-stack-container" th:fragment="mainView"
     th:attr="data-pgm-id='W_JA036J2',data-corp-gr=${corpGr}">
    <div class="view-toolbar">
        <div class="toolbar-left" th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <div class="filter-bar">
        <div class="filter-left">
            <th:block th:replace="~{fragments/filter/dc_ymd :: filter(label='기준일자')}"></th:block>
            <input id="ja036j2UploadFile" type="file" accept=".xls,.xlsx" hidden>
            <button type="button" class="t-btn btn-action" id="ja036j2Upload" title="환율 엑셀 파일을 업로드합니다.">
                <i class="fa-solid fa-file-excel"></i> UPLOAD
            </button>
        </div>
    </div>

    <div class="layout-split-h split-body layout-mobile-stack" data-split-key="W_JA036J2" data-default-ratio="58:42">
        <div class="split-pane pane-left">
            <div class="pane-body" aria-label="환율 목록">
                <div id="ja036j2MasterGrid" class="tabulator-aams-grid"></div>
            </div>
        </div>
        <div class="split-gutter-h" aria-hidden="true"></div>
        <div class="split-pane pane-right">
            <div class="pane-header">최근 3개월 환율 이력</div>
            <div class="pane-body" aria-label="최근 3개월 환율 이력">
                <div id="ja036j2HistoryGrid" class="tabulator-aams-grid"></div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        (function () {
            const pane = document.currentScript?.closest('.tab-pane') || document.currentScript?.closest('.view-container');
            if (!pane || pane.dataset.ja036j2Initialized === 'true') return;
            pane.dataset.ja036j2Initialized = 'true';

            const api = '/api/usportfoliomodel/ja036j2';
            const field = id => pane.querySelector('#' + id);
            const notify = (text, type = 'info') => typeof showToast === 'function' ? showToast(text, type) : alert(text);
            const ymd = () => typeof getFilterYmd === 'function'
                ? getFilterYmd(pane, 'YYYY-MM-DD') : field('filterYmd')?.value;
            const formatNumber = value => value == null || value === '' ? ''
                : Number(value).toLocaleString(undefined, {minimumFractionDigits: 4, maximumFractionDigits: 4});
            const formatDateTime = value => value ? String(value).replace('T', ' ').slice(0, 19) : '';
            let masterGrid;
            let historyGrid;
            let deletedRows = [];

            async function request(path, options) {
                const response = await fetch(path, options);
                const body = await response.json().catch(() => ({}));
                if (!response.ok || body.success === false) {
                    throw new Error(body.message || '처리 중 오류가 발생했습니다.');
                }
                return body;
            }

            function markUpdated(cell) {
                const data = cell.getRow().getData();
                if (!data.isNew) cell.getRow().update({isUpdated: true, rowStatus: 'U'});
            }

            function buildGrids() {
                masterGrid = new Tabulator(field('ja036j2MasterGrid'), {
                    height: '100%', layout: 'fitDataFill', selectableRows: 1, editTriggerEvent: 'click',
                    placeholder: '조회된 환율 데이터가 없습니다.',
                    columnDefaults: {vertAlign: 'middle', headerHozAlign: 'center'},
                    columns: [
                        {title: 'No.', formatter: 'rownum', width: 48, hozAlign: 'center', headerSort: false},
                        {title: '통화', field: 'currency', width: 75, hozAlign: 'center', editor: 'input',
                            editorParams: {maxLength: 3}, cellClick: aamsCellEdit,
                            editable: cell => Boolean(cell.getRow().getData().isNew),
                            cellEdited: cell => {
                                cell.setValue(String(cell.getValue() || '').trim().toUpperCase());
                                markUpdated(cell);
                            }},
                        {title: '재정환율', field: 'gijunRt', width: 125, hozAlign: 'right', editor: 'number', cellClick: aamsCellEdit,
                            formatter: cell => formatNumber(cell.getValue()),
                            cellEdited: cell => {
                                const row = cell.getRow();
                                row.update({transRt: cell.getValue()});
                                markUpdated(cell);
                            }},
                        {title: '거래환율', field: 'transRt', width: 125, hozAlign: 'right', editor: 'number', cellClick: aamsCellEdit,
                            formatter: cell => formatNumber(cell.getValue()), cellEdited: markUpdated},
                        {title: '입력일시', field: 'ipYmd', minWidth: 145, hozAlign: 'center', formatter: cell => formatDateTime(cell.getValue())},
                        {title: 'CROSS RATE', field: 'crossRate', width: 120, hozAlign: 'right', formatter: cell => formatNumber(cell.getValue())}
                    ]
                });
                historyGrid = new Tabulator(field('ja036j2HistoryGrid'), {
                    height: '100%', layout: 'fitDataFill', placeholder: '통화를 선택하면 환율 이력을 조회합니다.',
                    columnDefaults: {vertAlign: 'middle', headerHozAlign: 'center'},
                    columns: [
                        {title: '기준일자', field: 'gijunYmd', width: 105, hozAlign: 'center'},
                        {title: '재정환율', field: 'gijunRt', width: 110, hozAlign: 'right', formatter: cell => formatNumber(cell.getValue())},
                        {title: '전일대비', field: 'gijun', width: 105, hozAlign: 'right', formatter: cell => formatNumber(cell.getValue())},
                        {title: '매매환율', field: 'transRt', width: 110, hozAlign: 'right', formatter: cell => formatNumber(cell.getValue())},
                        {title: '전일대비', field: 'trans', width: 105, hozAlign: 'right', formatter: cell => formatNumber(cell.getValue())}
                    ]
                });
                if (typeof setupTabulatorRowSelection === 'function') setupTabulatorRowSelection(masterGrid);
                masterGrid.on('rowSelected', row => loadHistory(row.getData().currency));
                if (window.AamsResponsive) window.AamsResponsive.bindGridResize(pane, [masterGrid, historyGrid]);
            }

            async function retrieve() {
                const selectedYmd = ymd();
                if (!selectedYmd) return notify('기준일자를 선택해주세요.', 'warning');
                const rows = await request(api + '/list?' + new URLSearchParams({ymd: selectedYmd}));
                deletedRows = [];
                await masterGrid.setData(rows);
                await historyGrid.clearData();
            }

            async function loadHistory(currency) {
                if (!currency || !ymd()) return historyGrid.clearData();
                const rows = await request(api + '/history?' + new URLSearchParams({ymd: ymd(), currency}));
                await historyGrid.setData(rows);
            }

            async function save() {
                const rows = masterGrid.getData().filter(row => row.isNew || row.isUpdated).concat(deletedRows);
                if (!rows.length) return notify('변경된 데이터가 없습니다.', 'info');
                const invalid = rows.some(row => !row.isDeleted && (!row.currency || row.gijunRt == null || row.transRt == null));
                if (invalid) return notify('통화, 재정환율, 거래환율을 입력해주세요.', 'warning');
                const result = await request(api + '/save', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ymd: ymd(), rows})
                });
                notify(result.message, 'success');
                await retrieve();
            }

            function asNumber(value, rowNumber, columnName, required) {
                if (value == null || String(value).trim() === '') {
                    if (required) throw new Error(rowNumber + '행의 ' + columnName + ' 값을 확인해주세요.');
                    return null;
                }
                const numericValue = Number(String(value).replaceAll(',', '').trim());
                if (!Number.isFinite(numericValue)) {
                    throw new Error(rowNumber + '행의 ' + columnName + ' 값이 숫자가 아닙니다.');
                }
                return numericValue;
            }

            async function parseUploadFile(file) {
                if (!window.XLSX) throw new Error('엑셀 읽기 모듈을 불러오지 못했습니다.');
                const workbook = window.XLSX.read(await file.arrayBuffer(), {type: 'array'});
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const values = window.XLSX.utils.sheet_to_json(sheet, {header: 1, defval: '', raw: true});
                const rates = [];

                // PowerBuilder cb_2: first sheet, row 4 onward, B~E columns.
                values.slice(3).forEach((row, index) => {
                    const rowNumber = index + 4;
                    const currency = String(row[1] || '').trim().toUpperCase();
                    if (!currency) return;
                    if (currency.length !== 3) throw new Error(rowNumber + '행의 통화 코드를 확인해주세요.');
                    rates.push({
                        currency,
                        crossRate: asNumber(row[2], rowNumber, 'CROSS RATE', false),
                        crossCurrency: String(row[3] || '').trim().toUpperCase() || null,
                        gijunRt: asNumber(row[4], rowNumber, '재정환율', true),
                        transRt: asNumber(row[4], rowNumber, '재정환율', true),
                        isNew: true,
                        rowStatus: 'C'
                    });
                });
                if (!rates.length) throw new Error('4행부터 업로드할 환율 데이터가 없습니다.');
                return rates;
            }

            async function uploadRates(file) {
                const selectedYmd = ymd();
                if (!selectedYmd) throw new Error('기준일자를 선택해주세요.');
                const rows = await parseUploadFile(file);
                const result = await request(api + '/save', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ymd: selectedYmd, rows})
                });
                notify(rows.length + '건의 해외 환율을 업로드했습니다.', 'success');
                await retrieve();
                return result;
            }

            function bindToolbar() {
                pane.onSearch = pane.onRetrieve = () => retrieve().catch(error => notify(error.message, 'error'));
                pane.onInput = async () => {
                    const row = await masterGrid.addRow({currency: '', gijunRt: null, transRt: null, isNew: true, rowStatus: 'C'}, true);
                    masterGrid.deselectRow();
                    row.select();
                    row.getCell('currency').edit();
                };
                pane.onDelete = async () => {
                    const row = masterGrid.getSelectedRows()[0];
                    if (!row) return notify('삭제할 행을 선택해주세요.', 'warning');
                    const data = row.getData();
                    if (!data.isNew) deletedRows.push({...data, isDeleted: true, rowStatus: 'D'});
                    await row.delete();
                    await historyGrid.clearData();
                };
                pane.onSave = () => save().catch(error => notify(error.message, 'error'));
                pane.onRefresh = () => { deletedRows = []; masterGrid.clearData(); historyGrid.clearData(); };
                pane.onCorpGrChange = nextCorpGr => { pane.dataset.corpGr = nextCorpGr || ''; pane.onRefresh(); };
                pane.onExcel = () => {
                    if (!window.XLSX) return notify('Excel 내보내기 모듈을 불러오지 못했습니다.', 'warning');
                    masterGrid.download('xlsx', '환율관리_' + String(ymd() || '').replaceAll('-', '') + '.xlsx', {sheetName: '환율관리'});
                };
                field('ja036j2Upload').addEventListener('click', () => field('ja036j2UploadFile').click());
                field('ja036j2UploadFile').addEventListener('change', async event => {
                    const file = event.target.files[0];
                    event.target.value = '';
                    if (!file) return;
                    try {
                        await uploadRates(file);
                    } catch (error) {
                        notify(error.message || '환율 업로드 중 오류가 발생했습니다.', 'error');
                    }
                });
            }

            function initialize() {
                buildGrids();
                if (typeof initFilterCalendar === 'function') initFilterCalendar(pane);
                bindToolbar();
                if (window.AamsSplitter) window.AamsSplitter.init(pane);
                retrieve().catch(error => notify(error.message, 'error'));
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initialize, {once: true});
            else initialize();
        })();
    </script>
</div>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
    W_JA035P: 상환유예 관리 (wt_listdetail)
    DataWindow:
      - dw_c: dc_ymd (영업일자)
      - dw_list: d_ja035p1 (SYT9MG)
      - dw_detail: d_ja035p2 (SYT9MG_TR)
-->
<div class="view-container layout-split ja035p-container layout-mobile-stack-container" th:fragment="ja035pView">

    <div class="view-toolbar">
        <div class="toolbar-left">
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <div class="filter-bar">
        <div class="filter-left">
            <div class="filter-item" style="position: relative; display: flex; align-items: center; gap: 6px;">
                <label for="filterJa035pYmd">영업일자</label>
                <div class="aams-calendar-wrapper" style="position: relative; display: inline-flex; align-items: center;">
                    <input type="text" id="filterJa035pYmd" name="ymd" class="t-input aams-calendar-input"
                           style="width: 110px; padding: 4px 8px; font-size: 13px; text-align: center; border: 1px solid #cbd5e1; border-radius: 4px 0 0 4px; cursor: pointer; background: #ffffff;"
                           th:value="${ymd != null ? ymd : ''}" readonly autocomplete="off" />
                    <button type="button" class="t-btn btn-calendar" title="달력 열기"
                            style="padding: 5px 10px; border-radius: 0 4px 4px 0; border-left: none; background-color: #3b82f6; color: #ffffff; border: 1px solid #3b82f6; cursor: pointer;"
                            onclick="AamsCalendar.toggle('filterJa035pYmd', event)">
                        <i class="fa-regular fa-calendar-days"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="layout-split-v split-body" data-split-key="W_JA035P" data-default-ratio="55:45">
        <div class="pane-top master-section">
            <div class="pane-header">
                <span><i class="fa-solid fa-list-check"></i> 상환유예 목록</span>
            </div>
            <div class="pane-body">
                <div id="gridJa035pMaster" class="tabulator-aams-grid" style="height: 100%;"></div>
            </div>
        </div>

        <div class="pane-bottom detail-section">
            <div class="pane-header" style="display: flex; justify-content: space-between; align-items: center;">
                <span><i class="fa-solid fa-file-invoice-dollar"></i> 상환 내역</span>
                <div th:replace="~{fragments/grid/detail_nav :: detailNav(targetGrid='#gridJa035pDetail', fileName='상환유예_상환내역', buttons='0011111001')}"></div>
            </div>
            <div class="pane-body">
                <div id="gridJa035pDetail" class="tabulator-aams-grid" style="height: 100%;"></div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
    (function () {
        const script = document.currentScript;
        const pane = script && (script.closest('.tab-pane') || script.closest('.view-container'));
        if (!pane) return;

        const api = '/api/foreignassetmanagement/ja035p';
        const calendarId = 'filterJa035pYmd';
        const initialYmd = /*[[${initialYmd}]]*/ '';
        const workDate = /*[[${workDate}]]*/ '';
        const initialTrDates = /*[[${trDates}]]*/ [];

        let initialized = false;
        let gridMaster = null;
        let gridDetail = null;
        let masterBuilt = false;
        let detailBuilt = false;
        let cudMaster = null;
        let cudDetail = null;
        let lastLoadedMasterKey = null;
        let currentMasterRow = null;
        let hasSucceededSearch = false;

        const dddwOptionsMap = {
            tr_cd: [],
            gwamok: []
        };

        const aekGbValues = { '1': '배당' };

        const notify = (msg, level) => { if (window.showToast) window.showToast(msg, level); };
        const corpGr = () => window.resolveCorpGr ? window.resolveCorpGr(pane) : '';
        const ymd = () => window.getFilterYmd ? window.getFilterYmd(pane) : (pane.querySelector('#' + calendarId)?.value || '');
        const num = val => Number(val) || 0;

        function canManage() {
            const curYmd = ymd();
            if (workDate && curYmd && curYmd < workDate) return false;
            if (window.ButtonRole && typeof window.ButtonRole.isDisabled === 'function') {
                const saveBtn = pane.querySelector('.toolbar-left [data-btn-id="save"]');
                if (saveBtn && window.ButtonRole.isDisabled(saveBtn)) return false;
            }
            return true;
        }

        function restoreToolbarState() {
            if (window.ButtonRole && typeof window.ButtonRole.setSearchState === 'function') {
                window.ButtonRole.setSearchState(pane, hasSucceededSearch);
            }
        }

        async function fetchJson(url, options) {
            const response = await fetch(url, options);
            const body = await response.json().catch(() => null);
            if (!response.ok || (body && body.success === false)) {
                throw new Error((body && body.message) || '처리 중 오류가 발생했습니다.');
            }
            return body;
        }

        function markRowUpdated(row, patch, manager) {
            if (!row) return;
            const d = row.getData();
            row.update(Object.assign({
                isUpdated: !d.isNew,
                rowStatus: d.isNew ? 'C' : 'U'
            }, patch || {}));
            if (manager && typeof manager.trackChange === 'function') {
                manager.trackChange(row);
            }
        }

        function openGridCalendar(cell, targetField, manager, onAfterPick) {
            if (!cell || !canManage() || !window.AamsCalendar) return;
            const row = cell.getRow();
            const curVal = row.getData()[targetField] || ymd() || '';
            if (typeof window.AamsCalendar.openDatePicker === 'function') {
                window.AamsCalendar.openDatePicker({
                    anchorEl: cell.getElement(),
                    initialYmd: curVal,
                    format: 'dash',
                    onSelect: function (pickedYmd) {
                        markRowUpdated(row, { [targetField]: pickedYmd }, manager);
                        if (typeof onAfterPick === 'function') onAfterPick(row, pickedYmd);
                    }
                });
            }
        }

        function editCol(field, title, width, manager, onEdited, extra) {
            return Object.assign({
                field: field,
                title: title,
                width: width,
                editor: 'input',
                editable: () => canManage(),
                cellClick: window.aamsCellEdit,
                cellEdited: onEdited
            }, extra || {});
        }

        function numCol(field, title, width, decimals, writable, manager, onEdited) {
            const col = {
                field: field,
                title: title,
                width: width,
                hozAlign: 'right',
                formatter: function (cell) {
                    const val = cell.getValue();
                    if (val === null || val === undefined || val === '') return '';
                    const n = Number(val);
                    if (Number.isNaN(n)) return '';
                    return n.toLocaleString('ko-KR', {
                        minimumFractionDigits: decimals,
                        maximumFractionDigits: decimals
                    });
                }
            };
            return writable
                ? Object.assign(editCol(field, title, width, manager, onEdited), col, { editor: 'number' })
                : col;
        }

        function openFundSearch(cell) {
            const row = cell && cell.getRow ? cell.getRow() : cell;
            if (!row || !canManage()) return;
            if (!window.DynamicCodeSearch || typeof window.DynamicCodeSearch.openModal !== 'function') return;

            window.DynamicCodeSearch.openModal({
                title: '펀드 검색',
                columnNm: 'fund_cd',
                corpGr: corpGr(),
                seq: 1,
                row: row,
                initialKeyword: row.getData().fundCd || '',
                onSelect: function (code, name) {
                    markRowUpdated(row, { fundCd: code || '', xxFundCd: name || '' }, cudMaster);
                    syncMasterKeyToDetail('fundCd', code || '');
                }
            });
        }

        function openItemSearch(cell) {
            const row = cell && cell.getRow ? cell.getRow() : cell;
            if (!row || !canManage()) return;
            if (!window.DynamicCodeSearch || typeof window.DynamicCodeSearch.openModal !== 'function') return;

            const d = row.getData();
            const ymdDot = (ymd() || '').replaceAll('-', '.');
            const safeFundCd = (d.fundCd || '').replaceAll("'", "''");
            const addWhere = "t1.ymd='" + ymdDot + "' and t1.fund_cd='" + safeFundCd + "' and hj.CASH_CD <> '90'";

            window.DynamicCodeSearch.openModal({
                title: '종목 검색',
                columnNm: 'hj_cd',
                corpGr: corpGr(),
                seq: 2,
                addWhere: addWhere,
                row: row,
                initialKeyword: d.hjCd || '',
                onSelect: function (code, name) {
                    markRowUpdated(row, { hjCd: code || '', xxHjCd: name || '' }, cudMaster);
                    syncMasterKeyToDetail('hjCd', code || '');
                }
            });
        }

        function syncMasterKeyToDetail(field, val) {
            if (!gridDetail) return;
            const syncFields = ['trYmd', 'trCd', 'fundCd', 'trustee', 'hjCd', 'trSeq', 'aekGb'];
            if (!syncFields.includes(field)) return;
            gridDetail.getRows().forEach(r => {
                markRowUpdated(r, { [field]: val }, cudDetail);
            });
        }

        function onMasterCellEdited(cell) {
            if (!cell) return;
            const row = cell.getRow();
            const field = cell.getField();
            const d = row.getData();
            if (!d.isNew) {
                d.isUpdated = true;
                d.rowStatus = 'U';
            }
            if (cudMaster && typeof cudMaster.trackChange === 'function') {
                cudMaster.trackChange(row);
            }
            syncMasterKeyToDetail(field, d[field]);
        }

        function onDetailCellEdited(cell) {
            if (!cell) return;
            const row = cell.getRow();
            const field = cell.getField();
            const d = row.getData();
            if (!d.isNew) {
                d.isUpdated = true;
                d.rowStatus = 'U';
            }
            if (cudDetail && typeof cudDetail.trackChange === 'function') {
                cudDetail.trackChange(row);
            }

            if (field === 'sanghwAek' && currentMasterRow) {
                const masterData = currentMasterRow.getData();
                const detailSum = gridDetail.getRows().reduce((acc, r) => {
                    const rd = r.getData();
                    return rd.isDeleted ? acc : acc + num(rd.sanghwAek);
                }, 0);
                const newJanAek = num(masterData.aek) - detailSum;
                if (newJanAek < 0) {
                    notify('상환유예액을 초과했습니다.', 'warning');
                }
                const nextSanghwYmd = newJanAek === 0 ? (d.sanghwYmd || '') : '';
                markRowUpdated(currentMasterRow, {
                    janAek: newJanAek,
                    sanghwYmd: nextSanghwYmd
                }, cudMaster);
            }
        }

        function initMasterGrid() {
            gridMaster = new Tabulator(pane.querySelector('#gridJa035pMaster'), {
                height: '100%',
                layout: 'fitDataFill',
                selectableRows: 1,
                editTriggerEvent: 'click',
                placeholder: '조회된 내역이 없습니다.',
                columnDefaults: {
                    vertAlign: 'middle',
                    headerHozAlign: 'center',
                    headerSort: false
                },
                columns: [
                    {
                        title: 'No.',
                        width: 55,
                        hozAlign: 'center',
                        formatter: cell => cell.getRow().getPosition(true)
                    },
                    editCol('fundCd', '펀드번호', 110, cudMaster, onMasterCellEdited, {
                        hozAlign: 'center',
                        headerCssClass: 'col-hdr-green',
                        cellDblClick: (_e, cell) => openFundSearch(cell)
                    }),
                    {
                        title: '',
                        field: 'pXxFundCd',
                        width: 36,
                        minWidth: 36,
                        maxWidth: 36,
                        resizable: false,
                        hozAlign: 'center',
                        formatter: () => '<button type="button" class="btn-grid-addon btn-search" title="펀드 검색"><i class="fa-solid fa-magnifying-glass"></i></button>',
                        cellClick: (e, cell) => { e.stopPropagation(); openFundSearch(cell); }
                    },
                    { title: '계좌명', field: 'xxFundCd', width: 190, hozAlign: 'left' },
                    editCol('trYmd', '매매일자', 105, cudMaster, onMasterCellEdited, {
                        hozAlign: 'center',
                        editor: window.aamsDateEditor || 'input',
                        formatter: cell => window.formatDateVal ? window.formatDateVal(cell.getValue()) : (cell.getValue() || '')
                    }),
                    {
                        title: '',
                        field: 'pDdTrYmd',
                        width: 36,
                        minWidth: 36,
                        maxWidth: 36,
                        resizable: false,
                        hozAlign: 'center',
                        formatter: () => '<button type="button" class="btn-grid-addon btn-cal" title="매매일자 선택"><i class="fa-regular fa-calendar-days"></i></button>',
                        cellClick: (e, cell) => {
                            e.stopPropagation();
                            openGridCalendar(cell, 'trYmd', cudMaster, (row, picked) => syncMasterKeyToDetail('trYmd', picked));
                        }
                    },
                    editCol('trSeq', '거래순번', 75, cudMaster, onMasterCellEdited, { hozAlign: 'center', editor: 'number' }),
                    editCol('trCd', '거래코드', 145, cudMaster, onMasterCellEdited, {
                        hozAlign: 'left',
                        editor: 'list',
                        editorParams: () => ({ values: f_dddwctl ? f_dddwctl.getOptions(dddwOptionsMap, 'tr_cd') : [] }),
                        formatter: cell => (f_dddwctl && f_dddwctl.getLabel(dddwOptionsMap, 'tr_cd', cell.getValue())) || cell.getValue() || ''
                    }),
                    editCol('trustee', '거래소(해외보관처)', 135, cudMaster, onMasterCellEdited, { hozAlign: 'center' }),
                    editCol('hjCd', '종목코드', 120, cudMaster, onMasterCellEdited, {
                        hozAlign: 'center',
                        cellDblClick: (_e, cell) => openItemSearch(cell)
                    }),
                    {
                        title: '',
                        field: 'pXxHjCd',
                        width: 36,
                        minWidth: 36,
                        maxWidth: 36,
                        resizable: false,
                        hozAlign: 'center',
                        formatter: () => '<button type="button" class="btn-grid-addon btn-search" title="종목 검색"><i class="fa-solid fa-magnifying-glass"></i></button>',
                        cellClick: (e, cell) => { e.stopPropagation(); openItemSearch(cell); }
                    },
                    { title: '종목명', field: 'xxHjCd', width: 200, hozAlign: 'left' },
                    editCol('aekGb', '자산구분', 85, cudMaster, onMasterCellEdited, {
                        hozAlign: 'center',
                        editor: 'list',
                        editorParams: { values: aekGbValues },
                        formatter: cell => aekGbValues[cell.getValue()] || cell.getValue() || ''
                    }),
                    editCol('gwamok', '계정과목', 165, cudMaster, onMasterCellEdited, {
                        hozAlign: 'left',
                        editor: 'list',
                        editorParams: () => ({ values: f_dddwctl ? f_dddwctl.getOptions(dddwOptionsMap, 'gwamok') : [] }),
                        formatter: cell => (f_dddwctl && f_dddwctl.getLabel(dddwOptionsMap, 'gwamok', cell.getValue())) || cell.getValue() || ''
                    }),
                    numCol('gijunRt', '환율', 95, 2, false, cudMaster, onMasterCellEdited),
                    editCol('trCoCd', '매매처코드', 95, cudMaster, onMasterCellEdited, { hozAlign: 'center' }),
                    editCol('currency', '통화', 75, cudMaster, onMasterCellEdited, { hozAlign: 'center' }),
                    numCol('aek', '외화보유금액', 130, 0, true, cudMaster, onMasterCellEdited),
                    numCol('janAek', '외화보유잔액', 130, 0, true, cudMaster, onMasterCellEdited),
                    numCol('wonAek', '원화유보금액', 140, 0, true, cudMaster, onMasterCellEdited),
                    numCol('wonJanAek', '원화유보잔액', 140, 0, true, cudMaster, onMasterCellEdited),
                    numCol('wonSanghwAek', '원화상환잔액', 130, 0, false, cudMaster, onMasterCellEdited),
                    editCol('sanghwYmd', '상환완료일', 105, cudMaster, onMasterCellEdited, {
                        hozAlign: 'center',
                        editor: window.aamsDateEditor || 'input',
                        formatter: cell => window.formatDateVal ? window.formatDateVal(cell.getValue()) : (cell.getValue() || '')
                    }),
                    {
                        title: '',
                        field: 'pDdSanghwYmd',
                        width: 36,
                        minWidth: 36,
                        maxWidth: 36,
                        resizable: false,
                        hozAlign: 'center',
                        formatter: () => '<button type="button" class="btn-grid-addon btn-cal" title="상환완료일 선택"><i class="fa-regular fa-calendar-days"></i></button>',
                        cellClick: (e, cell) => { e.stopPropagation(); openGridCalendar(cell, 'sanghwYmd', cudMaster); }
                    },
                    editCol('bfYmd', '미상환대상구간 후시작일', 130, cudMaster, onMasterCellEdited, {
                        hozAlign: 'center',
                        editor: window.aamsDateEditor || 'input',
                        formatter: cell => window.formatDateVal ? window.formatDateVal(cell.getValue()) : (cell.getValue() || '')
                    }),
                    {
                        title: '',
                        field: 'pDdBfYmd',
                        width: 36,
                        minWidth: 36,
                        maxWidth: 36,
                        resizable: false,
                        hozAlign: 'center',
                        formatter: () => '<button type="button" class="btn-grid-addon btn-cal" title="후시작일 선택"><i class="fa-regular fa-calendar-days"></i></button>',
                        cellClick: (e, cell) => { e.stopPropagation(); openGridCalendar(cell, 'bfYmd', cudMaster); }
                    },
                    editCol('afYmd', '미상환대상구간 전시작일', 130, cudMaster, onMasterCellEdited, {
                        hozAlign: 'center',
                        editor: window.aamsDateEditor || 'input',
                        formatter: cell => window.formatDateVal ? window.formatDateVal(cell.getValue()) : (cell.getValue() || '')
                    }),
                    {
                        title: '',
                        field: 'pDdAfYmd',
                        width: 36,
                        minWidth: 36,
                        maxWidth: 36,
                        resizable: false,
                        hozAlign: 'center',
                        formatter: () => '<button type="button" class="btn-grid-addon btn-cal" title="전시작일 선택"><i class="fa-regular fa-calendar-days"></i></button>',
                        cellClick: (e, cell) => { e.stopPropagation(); openGridCalendar(cell, 'afYmd', cudMaster); }
                    },
                    editCol('bigo', '발생사유내역', 200, cudMaster, onMasterCellEdited, { hozAlign: 'left' })
                ]
            });

            gridMaster.on('tableBuilt', () => { masterBuilt = true; });
            gridMaster.on('rowSelected', row => syncDetail(row));
            gridMaster.on('rowClick', (_e, row) => syncDetail(row));

            if (typeof setupTabulatorRowSelection === 'function') {
                setupTabulatorRowSelection(gridMaster);
            }
            if (window.AamsCudManager) {
                cudMaster = AamsCudManager.create(gridMaster, {
                    allowedFields: [
                        'corpGr', 'origTrYmd', 'origTrCd', 'origFundCd', 'origHjCd', 'origTrSeq', 'origAekGb', 'isDeleted'
                    ]
                });
            }
        }

        function initDetailGrid() {
            gridDetail = new Tabulator(pane.querySelector('#gridJa035pDetail'), {
                height: '100%',
                layout: 'fitDataFill',
                selectableRows: 1,
                editTriggerEvent: 'click',
                placeholder: '상환 내역이 없습니다.',
                columnDefaults: {
                    vertAlign: 'middle',
                    headerHozAlign: 'center',
                    headerSort: false
                },
                columns: [
                    {
                        title: 'No.',
                        width: 55,
                        hozAlign: 'center',
                        formatter: cell => cell.getRow().getPosition(true)
                    },
                    editCol('sanghwYmd', '상환일자', 110, cudDetail, onDetailCellEdited, {
                        hozAlign: 'center',
                        editor: window.aamsDateEditor || 'input',
                        formatter: cell => window.formatDateVal ? window.formatDateVal(cell.getValue()) : (cell.getValue() || '')
                    }),
                    {
                        title: '',
                        field: 'pDdDetailSanghwYmd',
                        width: 36,
                        minWidth: 36,
                        maxWidth: 36,
                        resizable: false,
                        hozAlign: 'center',
                        formatter: () => '<button type="button" class="btn-grid-addon btn-cal" title="상환일자 선택"><i class="fa-regular fa-calendar-days"></i></button>',
                        cellClick: (e, cell) => { e.stopPropagation(); openGridCalendar(cell, 'sanghwYmd', cudDetail); }
                    },
                    numCol('sanghwAek', '외화상환금액', 135, 0, true, cudDetail, onDetailCellEdited),
                    numCol('wonSanghwAek', '원화상환금액', 145, 0, true, cudDetail, onDetailCellEdited),
                    numCol('wonHwanCha', '환차손익(원화)', 135, 0, true, cudDetail, onDetailCellEdited),
                    numCol('gijunRt', '당일평가 기준환율', 140, 0, true, cudDetail, onDetailCellEdited),
                    numCol('janAek', '잔액', 130, 0, true, cudDetail, onDetailCellEdited),
                    numCol('wonJanAek', '금액(원화, 거래일환율)', 160, 0, true, cudDetail, onDetailCellEdited),
                    numCol('fcurJanAek', '(기준통화)잔액', 145, 0, true, cudDetail, onDetailCellEdited),
                    numCol('fcurHwanCha', '(기준통화)환차손익', 145, 0, true, cudDetail, onDetailCellEdited)
                ]
            });

            gridDetail.on('tableBuilt', () => { detailBuilt = true; });

            if (typeof setupTabulatorRowSelection === 'function') {
                setupTabulatorRowSelection(gridDetail);
            }
            if (window.AamsResponsive) {
                AamsResponsive.bindGridResize(pane, [gridMaster, gridDetail]);
            }
            if (window.AamsCudManager) {
                cudDetail = AamsCudManager.create(gridDetail, {
                    allowedFields: [
                        'corpGr', 'trYmd', 'trCd', 'fundCd', 'trustee', 'hjCd', 'trSeq', 'aekGb',
                        'currency', 'trCoCd', 'origSanghwYmd', 'isDeleted'
                    ]
                });
            }
        }

        async function syncDetail(row) {
            if (!row) return;
            const d = row.getData();
            currentMasterRow = row;

            if (d.isNew) {
                lastLoadedMasterKey = null;
                if (gridDetail) await gridDetail.setData([]);
                return;
            }

            const key = [d.corpGr, d.trYmd, d.trCd, d.fundCd, d.hjCd, d.trSeq, d.aekGb].join('|');
            if (lastLoadedMasterKey === key) return;
            lastLoadedMasterKey = key;

            try {
                const detailRows = await fetchJson(api + '/detail?' + new URLSearchParams({
                    corpGr: corpGr(),
                    trYmd: d.trYmd || '',
                    trCd: d.trCd || '',
                    fundCd: d.fundCd || '',
                    hjCd: d.hjCd || '',
                    trSeq: d.trSeq || 1,
                    aekGb: d.aekGb || '1'
                }));
                const formatted = cudDetail ? cudDetail.formatData(detailRows) : detailRows;
                await gridDetail.setData(formatted);
            } catch (err) {
                notify(err.message || '상세 내역 조회 중 오류가 발생했습니다.', 'error');
            }
        }

        async function loadGridOptions() {
            if (!corpGr() || !window.f_dddwctl) return;
            const results = await f_dddwctl.retrieveMultiple({
                tr_cd:  ['tr_cd', corpGr(), '', 1, "tr_cd in ('E83','E84')"],
                gwamok: ['gwamok', corpGr(), '', 1, "gwamok in ('12352','12357')"]
            });
            dddwOptionsMap.tr_cd = results.tr_cd || [];
            dddwOptionsMap.gwamok = results.gwamok || [];
            if (gridMaster && masterBuilt) {
                gridMaster.getRows().forEach(r => r.reformat());
            }
        }

        function initCalendar() {
            if (!window.AamsCalendar) return;
            AamsCalendar.init(calendarId, {
                pane: pane,
                initialYmd: initialYmd || ymd(),
                highlightDates: Array.isArray(initialTrDates) ? initialTrDates : [],
                datesApiUrl: api + '/dates',
                corpGr: corpGr(),
                historyTitle: '상환유예 내역 존재'
            });
        }

        async function load() {
            if (!corpGr()) {
                restoreToolbarState();
                return notify('회사그룹을 확인해주세요.', 'warning');
            }
            if (!ymd()) {
                restoreToolbarState();
                return notify('영업일자를 선택해주세요.', 'warning');
            }

            try {
                lastLoadedMasterKey = null;
                currentMasterRow = null;
                const rows = await fetchJson(api + '/master?' + new URLSearchParams({
                    corpGr: corpGr(),
                    ymd: ymd()
                }));
                hasSucceededSearch = true;
                const formatted = cudMaster ? cudMaster.formatData(rows) : rows;
                await gridMaster.setData(formatted);
                const firstRow = gridMaster.getRows()[0];
                if (firstRow) {
                    firstRow.select();
                    await syncDetail(firstRow);
                } else if (gridDetail) {
                    await gridDetail.setData([]);
                }
            } catch (err) {
                restoreToolbarState();
                notify(err.message || '조회 중 오류가 발생했습니다.', 'error');
            }
        }

        function addMasterRow() {
            if (!canManage()) {
                return notify('작업일자 이전 날짜에는 입력할 수 없습니다.', 'warning');
            }
            const baseYmd = ymd() || workDate;
            const newRow = {
                isNew: true,
                rowStatus: 'C',
                corpGr: corpGr(),
                trYmd: baseYmd,
                trCd: 'E83',
                trSeq: 1,
                aekGb: '1',
                gwamok: '12352',
                aek: 0,
                janAek: 0,
                wonAek: 0,
                wonJanAek: 0
            };
            gridMaster.addRow(newRow).then(r => {
                r.select();
                currentMasterRow = r;
                lastLoadedMasterKey = null;
                if (gridDetail) gridDetail.setData([]);
                const cell = r.getCell('fundCd');
                if (cell) cell.edit();
            });
        }

        function addDetailRow() {
            if (!canManage()) {
                return notify('작업일자 이전 날짜에는 입력할 수 없습니다.', 'warning');
            }
            if (!currentMasterRow) {
                return notify('상단 마스터 행을 먼저 선택해주세요.', 'warning');
            }
            const m = currentMasterRow.getData();
            const newRow = {
                isNew: true,
                rowStatus: 'C',
                corpGr: corpGr(),
                trYmd: m.trYmd || ymd(),
                trCd: m.trCd || 'E83',
                fundCd: m.fundCd || '',
                trustee: m.trustee || '',
                hjCd: m.hjCd || '',
                trSeq: m.trSeq || 1,
                aekGb: m.aekGb || '1',
                currency: m.currency || '',
                trCoCd: m.trCoCd || '',
                sanghwYmd: workDate || ymd(),
                sanghwAek: 0,
                wonSanghwAek: 0,
                gijunRt: 0,
                janAek: 0,
                wonJanAek: 0,
                wonHwanCha: 0,
                fcurJanAek: 0,
                fcurHwanCha: 0
            };
            gridDetail.addRow(newRow).then(r => {
                r.select();
                const cell = r.getCell('sanghwYmd');
                if (cell) cell.edit();
            });
        }

        function deleteMasterRow() {
            if (!gridMaster || !canManage()) return;
            const selectedRows = gridMaster.getSelectedRows();
            if (!selectedRows.length) {
                return notify('삭제할 마스터 행을 먼저 선택해주세요.', 'warning');
            }
            if (!confirm('선택한 행을 삭제하시겠습니까? (저장 시 DB에 반영됩니다)')) return;

            const targetRow = selectedRows[0];
            if (cudMaster && typeof cudMaster.deleteRow === 'function') {
                cudMaster.deleteRow(targetRow).then(() => {
                    notify('행이 삭제되었습니다. [저장] 시 최종 반영됩니다.', 'info');
                });
            } else {
                targetRow.delete();
            }
        }

        function deleteDetailRow() {
            if (!gridDetail || !canManage()) return;
            const selectedRows = gridDetail.getSelectedRows();
            if (!selectedRows.length) {
                return notify('삭제할 상세 행을 먼저 선택해주세요.', 'warning');
            }
            const targetRow = selectedRows[0];
            if (cudDetail && typeof cudDetail.deleteRow === 'function') {
                cudDetail.deleteRow(targetRow);
            } else {
                targetRow.delete();
            }
        }

        async function save() {
            if (!canManage()) {
                return notify('작업일자 이전 데이터는 수정할 수 없습니다.', 'warning');
            }
            const masterChanges = cudMaster
                ? cudMaster.getChanges()
                : gridMaster.getData().filter(r => r.isNew || r.isUpdated || r.isDeleted);
            const detailChanges = cudDetail
                ? cudDetail.getChanges()
                : gridDetail.getData().filter(r => r.isNew || r.isUpdated || r.isDeleted);

            if ((!masterChanges || !masterChanges.length) && (!detailChanges || !detailChanges.length)) {
                return notify('저장할 변경 내역이 없습니다.', 'info');
            }

            try {
                const res = await fetchJson(api + '/save?' + new URLSearchParams({ corpGr: corpGr() }), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        masterChanges: masterChanges || [],
                        detailChanges: detailChanges || []
                    })
                });
                notify(res.message || '저장되었습니다.', 'success');
                if (window.AamsCalendar) {
                    AamsCalendar.loadHighlightDates(calendarId, api + '/dates', corpGr());
                }
                await load();
            } catch (err) {
                notify(err.message || '저장 중 오류가 발생했습니다.', 'error');
            }
        }

        function refresh() {
            hasSucceededSearch = false;
            lastLoadedMasterKey = null;
            currentMasterRow = null;
            if (cudMaster && typeof cudMaster.reset === 'function') cudMaster.reset();
            if (cudDetail && typeof cudDetail.reset === 'function') cudDetail.reset();
            if (window.safeClearGrid) {
                window.safeClearGrid(gridMaster);
                window.safeClearGrid(gridDetail);
            } else {
                if (gridMaster) gridMaster.setData([]);
                if (gridDetail) gridDetail.setData([]);
            }
            restoreToolbarState();
        }

        function bindDetailNav() {
            const nav = pane.querySelector('.pane-bottom');
            if (!nav) return;
            const btnAdd = nav.querySelector('[data-action="add"], .btn-detail-add');
            const btnDel = nav.querySelector('[data-action="delete"], .btn-detail-delete');
            if (btnAdd) btnAdd.addEventListener('click', addDetailRow);
            if (btnDel) btnDel.addEventListener('click', deleteDetailRow);
        }

        function start() {
            if (initialized) return;
            initialized = true;

            if (window.AamsSplitter && typeof window.AamsSplitter.init === 'function') {
                window.AamsSplitter.init(pane);
            }
            initCalendar();
            initMasterGrid();
            initDetailGrid();
            bindDetailNav();
            loadGridOptions().catch(err => notify(err.message || '선택 목록을 불러오지 못했습니다.', 'error'));

            pane.onSearch = load;
            pane.onInput = addMasterRow;
            pane.onDelete = deleteMasterRow;
            pane.onSave = save;
            pane.onRefresh = refresh;
            pane.onCorpGrChange = function (nextCorpGr) {
                refresh();
                loadGridOptions().catch(err => notify(err.message, 'error'));
                if (window.AamsCalendar) {
                    AamsCalendar.loadHighlightDates(calendarId, api + '/dates', nextCorpGr || corpGr());
                }
            };
            pane.onExcel = function () {
                if (gridMaster) {
                    gridMaster.download('xlsx', '상환유예관리_' + (ymd() || '') + '.xlsx', { sheetName: '상환유예목록' });
                }
            };
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', start);
        } else {
            start();
        }
    })();
    </script>
</div>
</html>

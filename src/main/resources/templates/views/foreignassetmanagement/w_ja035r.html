<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
    W_JA035R: 외화주식 종목등록 (wt_listshare)
    DataWindow:
      - dw_c: visible=false, enabled=false
      - dw_list: d_ja035r1 (SYM0YA, JASAN_GB='1')
      - dw_master: d_ja035r2 (단건 상세 폼)
      - eb_direct_retrieve = true, is_date_nation = "US"
-->
<div class="view-container layout-split ja035r-container layout-mobile-stack-container"
     th:fragment="ja035rView"
     th:data-work-date="${workDate}"
     data-nation-cd="US"
     style="display: flex; flex-direction: column; height: 100%; width: 100%; overflow: hidden;">

    <style>
        .ja035r-container .ja035r-form-wrap {
            padding: 10px 14px;
            overflow-y: auto;
            height: 100%;
            box-sizing: border-box;
        }
        .ja035r-container .ja035r-form-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(180px, 1fr));
            gap: 8px 14px;
            align-items: center;
        }
        .ja035r-container .ja035r-field {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }
        .ja035r-container .ja035r-field.span-2 {
            grid-column: span 2;
        }
        .ja035r-container .ja035r-field label {
            flex: 0 0 96px;
            font-size: 12px;
            font-weight: 600;
            color: #334155;
            text-align: right;
            white-space: nowrap;
        }
        .ja035r-container .ja035r-field input,
        .ja035r-container .ja035r-field select,
        .ja035r-container .ja035r-field .dddw-select-custom {
            flex: 1 1 auto;
            min-width: 0;
        }
        .ja035r-container .ja035r-field input,
        .ja035r-container .ja035r-field select {
            height: 28px;
            padding: 2px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 12px;
            background: #ffffff;
            color: #1e293b;
            box-sizing: border-box;
        }
        .ja035r-container .ja035r-field .dddw-select-custom .dddw-select-btn {
            width: 100%;
            height: 28px;
            font-size: 12px;
        }
        .ja035r-container .ja035r-field .dddw-select-custom.disabled .dddw-select-btn {
            background: #f1f5f9;
            color: #64748b;
            cursor: not-allowed;
        }
        .ja035r-container .ja035r-field input[readonly],
        .ja035r-container .ja035r-field input:disabled,
        .ja035r-container .ja035r-field select:disabled {
            background: #f1f5f9;
            color: #64748b;
            cursor: not-allowed;
        }
        .ja035r-container .ja035r-field input.text-right {
            text-align: right;
        }
        .ja035r-container .ja035r-date-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1 1 auto;
            min-width: 0;
        }
        .ja035r-container .ja035r-check-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1 1 auto;
        }
        .ja035r-container .ja035r-check-wrap input[type="checkbox"] {
            flex: 0 0 auto;
            width: 15px;
            height: 15px;
            cursor: pointer;
        }
        @media (max-width: 1200px) {
            .ja035r-container .ja035r-form-grid {
                grid-template-columns: repeat(2, minmax(180px, 1fr));
            }
        }
        @media (max-width: 876px) {
            .ja035r-container .pane-bottom,
            .ja035r-container .split-gutter-v {
                display: none !important;
            }
            .ja035r-container .pane-top {
                flex: 1 1 auto !important;
                height: calc(100vh - 180px) !important;
                min-height: 360px !important;
            }
            .ja035r-container .ja035r-form-grid {
                grid-template-columns: 1fr;
            }
            .ja035r-container .ja035r-field.span-2 {
                grid-column: span 1;
            }
            .ja035r-container .ja035r-field label {
                flex: 0 0 92px;
                text-align: left;
            }
        }
        .ja035r-mobile-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(15, 23, 42, 0.5);
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .ja035r-mobile-modal.open {
            display: flex;
        }
        .ja035r-mobile-modal-dialog {
            width: 100%;
            max-width: 540px;
            max-height: 90vh;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .ja035r-mobile-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
        }
        .ja035r-mobile-modal-body {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 12px;
        }
        .ja035r-mobile-modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 10px 14px;
            border-top: 1px solid #e2e8f0;
            background: #f8fafc;
        }
    </style>

    <div class="view-toolbar">
        <div class="toolbar-left">
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <div class="layout-split-v split-body layout-mobile-stack" data-split-key="W_JA035R" data-default-ratio="55:45">
        <div class="split-pane pane-top">
        <div class="pane-header">
            <span class="pane-title">외화주식 종목 목록</span>
        </div>
        <div class="pane-body">
            <div class="grid-table-wrapper">
                <div id="gridJa035r" class="tabulator-aams-grid"></div>
            </div>
        </div>
    </div>

    <div class="split-gutter-v" title="크기 조절"></div>

    <div class="split-pane pane-bottom">
        <div class="pane-header">
            <span class="pane-title">종목 상세 정보</span>
        </div>
        <div class="pane-body" id="ja035rDesktopFormHost">
            <div class="ja035r-form-wrap" id="ja035rFormWrap">
                <form class="ja035r-form-grid" id="ja035rForm" onsubmit="return false;">
                    <div class="ja035r-field">
                        <label for="ja035r_jmCd">종목코드</label>
                        <input type="text" id="ja035r_jmCd" data-field="jmCd" maxlength="30" autocomplete="off">
                    </div>
                    <div class="ja035r-field span-2">
                        <label for="ja035r_jmNm">종목명</label>
                        <input type="text" id="ja035r_jmNm" data-field="jmNm" maxlength="100" autocomplete="off">
                    </div>
                    <div class="ja035r-field">
                        <label for="ja035r_stockGb">거래소</label>
                        <select id="ja035r_stockGb" data-field="stockGb"></select>
                    </div>

                    <div class="ja035r-field">
                        <label for="ja035r_balhNation">발행국가</label>
                        <select id="ja035r_balhNation" data-field="balhNation"></select>
                    </div>
                    <div class="ja035r-field">
                        <label for="ja035r_currency">통화</label>
                        <select id="ja035r_currency" data-field="currency"></select>
                    </div>
                    <div class="ja035r-field">
                        <label for="ja035r_isinCd">ISIN 코드</label>
                        <input type="text" id="ja035r_isinCd" data-field="isinCd" maxlength="20" autocomplete="off">
                    </div>
                    <div class="ja035r-field">
                        <label for="ja035r_sedol">SEDOL</label>
                        <input type="text" id="ja035r_sedol" data-field="sedol" maxlength="20" autocomplete="off">
                    </div>

                    <div class="ja035r-field">
                        <label for="ja035r_sangjYmd">상장일자</label>
                        <div class="ja035r-date-wrap">
                            <input type="text" id="ja035r_sangjYmd" data-field="sangjYmd" placeholder="YYYY-MM-DD" maxlength="10" autocomplete="off">
                            <button type="button" class="btn-grid-addon btn-calendar" id="ja035r_sangjYmdBtn" title="상장일자 선택">
                                <i class="fa-regular fa-calendar"></i>
                            </button>
                        </div>
                    </div>
                    <div class="ja035r-field">
                        <label for="ja035r_blbgTckr">블룸버그티커</label>
                        <input type="text" id="ja035r_blbgTckr" data-field="blbgTckr" maxlength="30" autocomplete="off">
                    </div>
                    <div class="ja035r-field">
                        <label for="ja035r_blbgTckrText">블룸버그 TEXT</label>
                        <input type="text" id="ja035r_blbgTckrText" data-field="blbgTckrText" maxlength="40" autocomplete="off">
                    </div>
                    <div class="ja035r-field" id="ja035r_gbxWrap" style="display: none;">
                        <label for="ja035r_gbx">GBX 여부</label>
                        <div class="ja035r-check-wrap">
                            <input type="checkbox" id="ja035r_gbx" data-field="gbx">
                            <span style="font-size: 12px; color: #475569;">펜스(GBX) 단위</span>
                        </div>
                    </div>

                    <div class="ja035r-field">
                        <label for="ja035r_jasanAttr">자산분류</label>
                        <select id="ja035r_jasanAttr" data-field="jasanAttr"></select>
                    </div>
                    <div class="ja035r-field">
                        <label for="ja035r_aekm">액면</label>
                        <input type="number" step="any" id="ja035r_aekm" data-field="aekm" class="text-right" autocomplete="off">
                    </div>
                    <div class="ja035r-field">
                        <label for="ja035r_srsCd">파생코드</label>
                        <input type="text" id="ja035r_srsCd" data-field="srsCd" maxlength="30" autocomplete="off">
                    </div>
                    <div class="ja035r-field">
                        <label for="ja035r_jasan">자산(Note)</label>
                        <select id="ja035r_jasan" data-field="jasan"></select>
                    </div>

                    <div class="ja035r-field">
                        <label for="ja035r_sigaAgent">시가평가주체</label>
                        <select id="ja035r_sigaAgent" data-field="sigaAgent"></select>
                    </div>
                    <div class="ja035r-field">
                        <label for="ja035r_sjGb">소속구분</label>
                        <select id="ja035r_sjGb" data-field="sjGb"></select>
                    </div>
                    <div class="ja035r-field">
                        <label for="ja035r_fen0055">FX보고코드</label>
                        <select id="ja035r_fen0055" data-field="fen0055"></select>
                    </div>
                    <div class="ja035r-field">
                        <label for="ja035r_balhNm">FX발행처</label>
                        <input type="text" id="ja035r_balhNm" data-field="balhNm" maxlength="100" autocomplete="off">
                    </div>
                </form>
            </div>
        </div>
    </div>
    </div>

    <!-- 모바일 상세 편집 모달 -->
    <div class="ja035r-mobile-modal" id="ja035rMobileModal" role="dialog" aria-modal="true" aria-label="종목 상세 정보">
        <div class="ja035r-mobile-modal-dialog">
            <div class="ja035r-mobile-modal-header">
                <span>외화주식 종목 상세</span>
                <button type="button" class="t-btn" id="ja035rMobileCloseBtn" title="닫기">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="ja035r-mobile-modal-body" id="ja035rMobileModalBody"></div>
            <div class="ja035r-mobile-modal-footer">
                <button type="button" class="t-btn" id="ja035rMobileRefreshBtn">
                    <i class="fa-solid fa-rotate-right"></i> 새로고침
                </button>
                <button type="button" class="t-btn btn-primary" id="ja035rMobileSaveBtn">
                    <i class="fa-solid fa-floppy-disk"></i> 저장
                </button>
                <button type="button" class="t-btn" id="ja035rMobileOkBtn">닫기</button>
            </div>
        </div>
    </div>

    <script>
    (function () {
        const script = document.currentScript;
        const pane = script && (script.closest('.tab-pane') || script.closest('.view-container'));
        if (!pane) return;

        const viewEl = pane.classList.contains('ja035r-container')
            ? pane
            : pane.querySelector('.ja035r-container');
        if (!viewEl) return;

        const api = '/api/foreignassetmanagement/ja035r';
        const desktopHost = viewEl.querySelector('#ja035rDesktopFormHost');
        const formWrap = viewEl.querySelector('#ja035rFormWrap');
        const formEl = viewEl.querySelector('#ja035rForm');
        const mobileModal = viewEl.querySelector('#ja035rMobileModal');
        const mobileModalBody = viewEl.querySelector('#ja035rMobileModalBody');

        let initialized = false;
        let grid = null;
        let gridBuilt = false;
        let hasSucceededSearch = false;
        let selectedRow = null;
        let deletedRows = [];
        let syncingForm = false;

        // DDDW 옵션 저장소
        let nationList = [];
        let currencyList = [];
        let stockGbList = [];
        let jasanAttrList = [];
        let sigaAgentList = [];
        let sjGbList = [];
        let fen0055List = [];
        let jasanList = [];

        let nationMap = {};
        let currencyMap = {};
        let stockGbMap = {};
        let jasanAttrMap = {};
        let sigaAgentMap = {};
        let sjGbMap = {};
        let fen0055Map = {};

        function getCorpGr() {
            if (typeof resolveCorpGr === 'function') {
                return resolveCorpGr(pane);
            }
            return '';
        }

        function updateToolbarState() {
            if (window.ButtonRole && typeof window.ButtonRole.setSearchState === 'function') {
                window.ButtonRole.setSearchState(pane, hasSucceededSearch);
            }
        }

        function isMobileView() {
            return window.innerWidth <= 876;
        }

        function formatNum(val, decimals) {
            if (val === null || val === undefined || val === '') return '';
            const num = Number(val);
            if (!Number.isFinite(num)) return '';
            if (typeof window.formatNumber === 'function') {
                return window.formatNumber(num, decimals);
            }
            return num.toLocaleString('ko-KR', {
                minimumFractionDigits: decimals,
                maximumFractionDigits: decimals
            });
        }

        async function fetchDddwList(dddwId, seq, addWhere, preserveFkey) {
            try {
                const corpGr = getCorpGr();
                let list = [];
                if (!preserveFkey && typeof window.f_dddwctl === 'function') {
                    list = await window.f_dddwctl(dddwId, corpGr, '', seq, addWhere || '');
                } else {
                    const params = new URLSearchParams({ dddwId: dddwId, seq: String(seq) });
                    if (corpGr) params.set('corpGr', corpGr);
                    if (addWhere) params.set('addWhere', addWhere);
                    const res = await fetch('/api/common/dddw?' + params.toString(), { credentials: 'same-origin' });
                    if (!res.ok) return [];
                    list = await res.json();
                }
                if (!Array.isArray(list)) return [];
                return list.map(function (item) {
                    const rawCode = item.code != null ? item.code : (item.cd != null ? item.cd : (item.SEBU_CD != null ? item.SEBU_CD : ''));
                    const code = String(rawCode).trim();
                    const rawName = item.name != null ? item.name : (item.dscr != null ? item.dscr : (item.SEBU_CD_NM != null ? item.SEBU_CD_NM : (item.nm != null ? item.nm : code)));
                    const name = String(rawName).trim() || code;
                    const fkey = item.fkey != null ? String(item.fkey).trim() : '';
                    return { code: code, name: name, fkey: fkey };
                });
            } catch (e) {
                return [];
            }
        }

        function toOptionMap(list) {
            const map = {};
            list.forEach(function (item) {
                const code = item.code != null ? String(item.code).trim() : '';
                const name = item.name != null ? String(item.name).trim() : code;
                if (code !== '') map[code] = name;
            });
            return map;
        }

        function syncDddwSelectDisplay(selectEl, value) {
            if (!selectEl) return;
            const strVal = value != null ? String(value).trim() : '';
            selectEl.value = strVal;
            const wrapper = selectEl.nextElementSibling;
            if (!wrapper || !wrapper.classList.contains('dddw-select-custom')) return;

            const labelEl = wrapper.querySelector('.dddw-select-label');
            const items = wrapper.querySelectorAll('.tabulator-edit-list-item');
            let matchedName = strVal;
            items.forEach(function (it) {
                const itVal = it.dataset.value != null ? String(it.dataset.value).trim() : '';
                if (itVal === strVal) {
                    it.classList.add('active');
                    matchedName = it.dataset.name != null ? it.dataset.name : strVal;
                } else {
                    it.classList.remove('active');
                }
            });
            if (labelEl) {
                labelEl.textContent = matchedName;
            }
        }

        function setFieldSelectValue(selector, value) {
            const sel = formEl.querySelector(selector);
            if (sel) syncDddwSelectDisplay(sel, value);
        }

        function populateSelect(selectEl, list, includeEmpty) {
            if (!selectEl) return;
            const prev = selectEl.value != null ? String(selectEl.value).trim() : '';
            const fullList = includeEmpty
                ? [{ code: '', name: '' }].concat(list || [])
                : (list || []).slice();

            if (window.f_dddwctl && typeof window.f_dddwctl.get2ColItemFormatter === 'function') {
                window.f_dddwctl.get2ColItemFormatter(selectEl, fullList, {
                    defaultVal: prev,
                    codeTitle: '코드',
                    nameTitle: '명칭'
                });
                syncDddwSelectDisplay(selectEl, prev);
                return;
            }

            selectEl.innerHTML = '';
            fullList.forEach(function (item) {
                const code = item.code != null ? String(item.code).trim() : '';
                const name = item.name != null ? String(item.name).trim() : code;
                const opt = document.createElement('option');
                opt.value = code;
                opt.textContent = name;
                selectEl.appendChild(opt);
            });
            selectEl.value = prev;
        }

        function resolveFenFkey(sjGb) {
            if (sjGb === '1' || sjGb === '5' || sjGb === '3') return '1';
            if (sjGb === '2') return '5';
            if (sjGb === '4') return '2';
            if (sjGb === '9') return '6';
            return '5';
        }

        function filterFen0055Options(sjGb) {
            const sel = formEl.querySelector('#ja035r_fen0055');
            if (!sel) return;
            const targetFkey = resolveFenFkey(sjGb);
            const hasFkey = fen0055List.some(function (x) { return x.fkey != null && String(x.fkey).trim() !== ''; });
            const filtered = hasFkey
                ? fen0055List.filter(function (x) { return String(x.fkey || '').trim() === targetFkey; })
                : fen0055List;
            populateSelect(sel, filtered, true);
        }

        async function loadAllDddws() {
            const corpGr = getCorpGr();
            const stockSeq = corpGr === '2502' ? 2 : 1;

            const results = await Promise.all([
                fetchDddwList('nation_cd', 1, '', false),
                fetchDddwList('currency', 1, '', false),
                fetchDddwList('stock_gb', stockSeq, '', false),
                fetchDddwList('jasan_attr', 1, '', false),
                fetchDddwList('siga_agent', 1, '', false),
                fetchDddwList('sj_gubun', 1, '', false),
                fetchDddwList('fen0055', 1, '', true),
                fetchDddwList('jasan', 1, "sebu_cd='ZZ0'", false)
            ]);

            nationList = results[0];
            currencyList = results[1];
            stockGbList = results[2];
            jasanAttrList = results[3].filter(function (item) {
                return String(item.code || '').startsWith('3');
            });
            sigaAgentList = results[4];
            sjGbList = results[5];
            fen0055List = results[6];
            jasanList = [{ code: '', name: '입력없음', fkey: '' }].concat(results[7]);

            nationMap = toOptionMap(nationList);
            currencyMap = toOptionMap(currencyList);
            stockGbMap = toOptionMap(stockGbList);
            jasanAttrMap = toOptionMap(jasanAttrList);
            sigaAgentMap = toOptionMap(sigaAgentList);
            sjGbMap = toOptionMap(sjGbList);
            fen0055Map = toOptionMap(fen0055List);

            populateSelect(formEl.querySelector('#ja035r_balhNation'), nationList, true);
            populateSelect(formEl.querySelector('#ja035r_currency'), currencyList, true);
            populateSelect(formEl.querySelector('#ja035r_stockGb'), stockGbList, true);
            populateSelect(formEl.querySelector('#ja035r_jasanAttr'), jasanAttrList, true);
            populateSelect(formEl.querySelector('#ja035r_sigaAgent'), sigaAgentList, true);
            populateSelect(formEl.querySelector('#ja035r_sjGb'), sjGbList, true);
            populateSelect(formEl.querySelector('#ja035r_jasan'), jasanList, false);
            filterFen0055Options('1');
            if (grid) {
                grid.redraw(true);
            }
        }

        function mapFormatter(getMapFn) {
            return function (cell) {
                const v = cell.getValue();
                if (v === null || v === undefined || v === '') return '';
                const key = String(v).trim();
                const mapObj = getMapFn();
                return (mapObj && mapObj[key]) || key;
            };
        }

        function applyFormProtect(rowData) {
            const isNew = Boolean(rowData && rowData.isNew);
            const hasRow = Boolean(rowData);
            const protectedFields = ['jmCd', 'jmNm', 'balhNation', 'currency'];

            formEl.querySelectorAll('input, select').forEach(function (el) {
                const field = el.dataset.field;
                if (!hasRow) {
                    el.disabled = true;
                } else if (protectedFields.indexOf(field) >= 0) {
                    el.disabled = !isNew;
                } else {
                    el.disabled = false;
                }
                if (el.tagName === 'SELECT') {
                    const wrapper = el.nextElementSibling;
                    if (wrapper && wrapper.classList.contains('dddw-select-custom')) {
                        wrapper.classList.toggle('disabled', el.disabled);
                        const btn = wrapper.querySelector('.dddw-select-btn');
                        if (btn) btn.disabled = el.disabled;
                    }
                }
            });

            const sangjBtn = formEl.querySelector('#ja035r_sangjYmdBtn');
            if (sangjBtn) sangjBtn.disabled = !hasRow;
        }

        function toggleGbxVisibility(currency) {
            const wrap = formEl.querySelector('#ja035r_gbxWrap');
            if (!wrap) return;
            wrap.style.display = (String(currency || '').trim().toUpperCase() === 'GBP') ? 'flex' : 'none';
        }

        function bindFormFromRow(row) {
            syncingForm = true;
            try {
                selectedRow = row || null;
                const data = row ? row.getData() : null;
                if (!data) {
                    formEl.reset();
                    toggleGbxVisibility('');
                    applyFormProtect(null);
                    return;
                }

                filterFen0055Options(data.sjGb || '1');

                formEl.querySelectorAll('[data-field]').forEach(function (el) {
                    const field = el.dataset.field;
                    if (el.type === 'checkbox') {
                        el.checked = String(data[field] || 'N').toUpperCase() === 'Y';
                    } else if (el.tagName === 'SELECT') {
                        syncDddwSelectDisplay(el, data[field] != null ? String(data[field]) : '');
                    } else {
                        el.value = data[field] != null ? String(data[field]) : '';
                    }
                });

                toggleGbxVisibility(data.currency);
                applyFormProtect(data);
            } finally {
                syncingForm = false;
            }
        }

        function pushFieldToSelectedRow(field, value) {
            if (!selectedRow) return;
            const data = selectedRow.getData();
            const patch = {};
            patch[field] = value;
            if (!data.isNew) {
                patch.isUpdated = true;
                patch.rowStatus = 'U';
            }
            selectedRow.update(patch);
        }

        async function handleFieldChange(field, value) {
            if (!selectedRow || syncingForm) return;
            const data = selectedRow.getData();

            if (field === 'jmCd') {
                const trimmed = String(value || '').trim();
                pushFieldToSelectedRow('jmCd', trimmed);

                const colonIdx = trimmed.indexOf(':');
                const dotIdx = trimmed.indexOf('.');

                if (colonIdx > 0) {
                    const prefix = trimmed.substring(0, colonIdx).trim();
                    const suffix = trimmed.substring(colonIdx + 1).trim();
                    pushFieldToSelectedRow('stockGb', prefix);
                    setFieldSelectValue('#ja035r_stockGb', prefix);

                    try {
                        const res = await fetch(api + '/exchange-info?stockGb=' + encodeURIComponent(prefix), {
                            credentials: 'same-origin'
                        });
                        if (res.ok) {
                            const info = await res.json();
                            if (info.balhNation) {
                                pushFieldToSelectedRow('balhNation', info.balhNation);
                                setFieldSelectValue('#ja035r_balhNation', info.balhNation);
                            }
                            if (info.currency) {
                                pushFieldToSelectedRow('currency', info.currency);
                                setFieldSelectValue('#ja035r_currency', info.currency);
                                toggleGbxVisibility(info.currency);
                                const gbxVal = info.currency === 'GBP' ? 'Y' : 'N';
                                pushFieldToSelectedRow('gbx', gbxVal);
                                formEl.querySelector('#ja035r_gbx').checked = (gbxVal === 'Y');
                            }
                        }
                    } catch (e) { /* ignore */ }

                    const curData = selectedRow.getData();
                    if (!curData.sedol) {
                        pushFieldToSelectedRow('sedol', suffix);
                        formEl.querySelector('#ja035r_sedol').value = suffix;
                    }
                    if (!curData.blbgTckr) {
                        pushFieldToSelectedRow('blbgTckr', suffix);
                        formEl.querySelector('#ja035r_blbgTckr').value = suffix;
                    }
                    const nation = curData.balhNation || '';
                    const txt = (suffix + ' ' + nation).trim();
                    pushFieldToSelectedRow('blbgTckrText', txt);
                    formEl.querySelector('#ja035r_blbgTckrText').value = txt;
                } else if (dotIdx > 0) {
                    const before = trimmed.substring(0, dotIdx).trim();
                    const after = trimmed.substring(dotIdx + 1).trim();
                    pushFieldToSelectedRow('stockGb', after);
                    setFieldSelectValue('#ja035r_stockGb', after);
                    if (!data.sedol) {
                        pushFieldToSelectedRow('sedol', before);
                        formEl.querySelector('#ja035r_sedol').value = before;
                    }
                    if (!data.blbgTckr) {
                        pushFieldToSelectedRow('blbgTckr', before);
                        formEl.querySelector('#ja035r_blbgTckr').value = before;
                    }
                }
                return;
            }

            if (field === 'blbgTckr') {
                pushFieldToSelectedRow('blbgTckr', value);
                const txt = (String(value || '').trim() + ' ' + (data.balhNation || '')).trim();
                pushFieldToSelectedRow('blbgTckrText', txt);
                formEl.querySelector('#ja035r_blbgTckrText').value = txt;
                return;
            }

            if (field === 'balhNation') {
                pushFieldToSelectedRow('balhNation', value);
                let curCurrency = data.currency || '';
                if (!curCurrency && value) {
                    try {
                        const res = await fetch(api + '/nation-currency?nationCd=' + encodeURIComponent(value), {
                            credentials: 'same-origin'
                        });
                        if (res.ok) {
                            const info = await res.json();
                            if (info.currency) {
                                curCurrency = info.currency;
                                pushFieldToSelectedRow('currency', curCurrency);
                                setFieldSelectValue('#ja035r_currency', curCurrency);
                            }
                        }
                    } catch (e) { /* ignore */ }
                }
                const tckr = data.blbgTckr || '';
                const txt = (tckr + ' ' + (value || '')).trim();
                pushFieldToSelectedRow('blbgTckrText', txt);
                formEl.querySelector('#ja035r_blbgTckrText').value = txt;
                toggleGbxVisibility(curCurrency);
                const gbxVal = curCurrency === 'GBP' ? 'Y' : 'N';
                pushFieldToSelectedRow('gbx', gbxVal);
                formEl.querySelector('#ja035r_gbx').checked = (gbxVal === 'Y');
                return;
            }

            if (field === 'currency') {
                pushFieldToSelectedRow('currency', value);
                if (!data.balhNation && value) {
                    try {
                        const res = await fetch(api + '/currency-nation?currency=' + encodeURIComponent(value), {
                            credentials: 'same-origin'
                        });
                        if (res.ok) {
                            const info = await res.json();
                            if (info.nationCd) {
                                pushFieldToSelectedRow('balhNation', info.nationCd);
                                setFieldSelectValue('#ja035r_balhNation', info.nationCd);
                            }
                        }
                    } catch (e) { /* ignore */ }
                }
                toggleGbxVisibility(value);
                const gbxVal = String(value || '').toUpperCase() === 'GBP' ? 'Y' : 'N';
                pushFieldToSelectedRow('gbx', gbxVal);
                formEl.querySelector('#ja035r_gbx').checked = (gbxVal === 'Y');
                return;
            }

            if (field === 'sjGb') {
                pushFieldToSelectedRow('sjGb', value);
                filterFen0055Options(value);
                const fenEl = formEl.querySelector('#ja035r_fen0055');
                if (fenEl) {
                    pushFieldToSelectedRow('fen0055', fenEl.value || '');
                }
                return;
            }

            pushFieldToSelectedRow(field, value);
        }

        function bindFormEvents() {
            formEl.querySelectorAll('[data-field]').forEach(function (el) {
                const field = el.dataset.field;
                const evtName = (el.tagName === 'SELECT' || el.type === 'checkbox') ? 'change' : 'change';
                el.addEventListener(evtName, function () {
                    const val = el.type === 'checkbox' ? (el.checked ? 'Y' : 'N') : el.value;
                    handleFieldChange(field, val);
                });
                if (el.tagName === 'INPUT' && el.type !== 'checkbox') {
                    el.addEventListener('input', function () {
                        if (!selectedRow || syncingForm) return;
                        pushFieldToSelectedRow(field, el.value);
                    });
                }
            });

            const sangjBtn = formEl.querySelector('#ja035r_sangjYmdBtn');
            const sangjInput = formEl.querySelector('#ja035r_sangjYmd');
            if (sangjBtn && sangjInput) {
                sangjBtn.addEventListener('click', function () {
                    if (!selectedRow) return;
                    if (window.AamsCalendar && typeof window.AamsCalendar.open === 'function') {
                        window.AamsCalendar.open(sangjInput, {
                            nationCd: 'US',
                            initialDate: sangjInput.value || '',
                            onSelect: function (formatted) {
                                sangjInput.value = formatted;
                                handleFieldChange('sangjYmd', formatted);
                            }
                        });
                    }
                });
            }
        }

        function openMobileModal(row) {
            if (!mobileModal || !mobileModalBody || !formWrap) return;
            bindFormFromRow(row);
            if (formWrap.parentNode !== mobileModalBody) {
                mobileModalBody.appendChild(formWrap);
            }
            mobileModal.classList.add('open');
        }

        function closeMobileModal() {
            if (!mobileModal || !desktopHost || !formWrap) return;
            mobileModal.classList.remove('open');
            if (formWrap.parentNode !== desktopHost) {
                desktopHost.appendChild(formWrap);
            }
        }

        function buildGrid() {
            const targetEl = viewEl.querySelector('#gridJa035r');
            if (!targetEl || typeof Tabulator === 'undefined') return;

            grid = new Tabulator(targetEl, {
                layout: 'fitDataFill',
                height: '100%',
                selectableRows: 1,
                placeholder: '조회된 외화주식 종목이 없습니다.',
                columns: [
                    { title: 'No.', formatter: 'rownum', width: 55, hozAlign: 'center', headerSort: false, frozen: true },
                    { title: '발행국가', field: 'balhNation', width: 95, hozAlign: 'center', formatter: mapFormatter(function () { return nationMap; }) },
                    { title: '종목코드', field: 'jmCd', width: 130, hozAlign: 'left', frozen: true },
                    { title: '종목명', field: 'jmNm', width: 220, hozAlign: 'left' },
                    { title: '거래소', field: 'stockGb', width: 130, hozAlign: 'left', formatter: mapFormatter(function () { return stockGbMap; }) },
                    { title: '통화', field: 'currency', width: 70, hozAlign: 'center' },
                    {
                        title: 'GBX',
                        field: 'gbx',
                        width: 60,
                        hozAlign: 'center',
                        formatter: function (cell) {
                            return String(cell.getValue() || '').toUpperCase() === 'Y' ? 'Y' : 'N';
                        }
                    },
                    { title: 'ISIN 코드', field: 'isinCd', width: 120, hozAlign: 'left' },
                    { title: 'SEDOL', field: 'sedol', width: 100, hozAlign: 'left' },
                    { title: '블룸버그티커', field: 'blbgTckr', width: 120, hozAlign: 'left' },
                    { title: '블룸버그티커 TEXT', field: 'blbgTckrText', width: 140, hozAlign: 'left' },
                    {
                        title: '액면',
                        field: 'aekm',
                        width: 100,
                        hozAlign: 'right',
                        formatter: function (cell) { return formatNum(cell.getValue(), 2); }
                    },
                    { title: '상장일자', field: 'sangjYmd', width: 100, hozAlign: 'center' },
                    { title: '소속구분', field: 'sjGb', width: 110, hozAlign: 'center', formatter: mapFormatter(function () { return sjGbMap; }) },
                    { title: '시가평가주체', field: 'sigaAgent', width: 110, hozAlign: 'center', formatter: mapFormatter(function () { return sigaAgentMap; }) },
                    { title: '자산분류', field: 'jasanAttr', width: 120, hozAlign: 'left', formatter: mapFormatter(function () { return jasanAttrMap; }) },
                    { title: 'FX보고코드', field: 'fen0055', width: 120, hozAlign: 'left', formatter: mapFormatter(function () { return fen0055Map; }) },
                    { title: 'FX용 발행처', field: 'balhNm', width: 150, hozAlign: 'left' },
                    { title: '파생코드', field: 'srsCd', width: 110, hozAlign: 'left' }
                ]
            });

            grid.on('rowClick', function (e, row) {
                row.select();
                bindFormFromRow(row);
            });

            grid.on('rowDblClick', function (e, row) {
                row.select();
                if (isMobileView()) {
                    openMobileModal(row);
                } else {
                    bindFormFromRow(row);
                }
            });

            grid.on('rowSelected', function (row) {
                bindFormFromRow(row);
            });

            gridBuilt = true;
        }

        async function loadData() {
            const corpGr = getCorpGr();
            if (!corpGr) {
                if (typeof showToast === 'function') showToast('회사그룹을 확인할 수 없습니다.', 'warning');
                return;
            }
            try {
                const res = await fetch(api + '/list?corpGr=' + encodeURIComponent(corpGr), {
                    credentials: 'same-origin'
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const list = await res.json();
                deletedRows = [];
                if (grid) {
                    await grid.replaceData(Array.isArray(list) ? list : []);
                    const rows = grid.getRows();
                    if (rows.length > 0 && !isMobileView()) {
                        rows[0].select();
                        bindFormFromRow(rows[0]);
                    } else {
                        bindFormFromRow(null);
                    }
                }
                hasSucceededSearch = true;
                updateToolbarState();
            } catch (err) {
                hasSucceededSearch = false;
                updateToolbarState();
                if (typeof showToast === 'function') showToast('조회 중 오류가 발생했습니다.', 'error');
            }
        }

        async function addNewRow() {
            if (!grid) return;
            const newItem = {
                corpGr: getCorpGr(),
                jmCd: '',
                jmNm: '',
                jasanGb: '1',
                jsJongryu: '1',
                balhNation: '',
                currency: '',
                aekm: null,
                sangjYmd: '',
                blbgTckr: '',
                blbgTckrText: '',
                isinCd: '',
                sigaAgent: 'S',
                jasanAttr: '',
                sjGb: '1',
                sedol: '',
                fen0055: '',
                balhNm: '',
                jasan: '',
                gbx: 'N',
                stockGb: '',
                srsCd: '',
                isNew: true,
                rowStatus: 'C'
            };
            const row = await grid.addRow(newItem, true);
            grid.deselectRow();
            row.select();
            if (isMobileView()) {
                openMobileModal(row);
            } else {
                bindFormFromRow(row);
                const jmCdInput = formEl.querySelector('#ja035r_jmCd');
                if (jmCdInput) jmCdInput.focus();
            }
        }

        async function copySelectedRow() {
            if (!grid || !selectedRow) {
                if (typeof showToast === 'function') showToast('복사할 행을 선택해 주세요.', 'warning');
                return;
            }
            const src = Object.assign({}, selectedRow.getData());
            src.jmCd = '';
            src.jmNm = '';
            src.sedol = '';
            src.blbgTckr = '';
            src.blbgTckrText = '';
            src.isNew = true;
            src.isUpdated = false;
            src.isDeleted = false;
            src.rowStatus = 'C';

            const row = await grid.addRow(src, true);
            grid.deselectRow();
            row.select();
            if (isMobileView()) {
                openMobileModal(row);
            } else {
                bindFormFromRow(row);
                const jmCdInput = formEl.querySelector('#ja035r_jmCd');
                if (jmCdInput) jmCdInput.focus();
            }
        }

        function deleteSelectedRow() {
            if (!grid || !selectedRow) {
                if (typeof showToast === 'function') showToast('삭제할 행을 선택해 주세요.', 'warning');
                return;
            }
            const data = selectedRow.getData();
            if (!data.isNew && data.jmCd) {
                deletedRows.push(Object.assign({}, data, { isDeleted: true, rowStatus: 'D' }));
            }
            selectedRow.delete();
            selectedRow = null;
            const rows = grid.getRows();
            if (rows.length > 0 && !isMobileView()) {
                rows[0].select();
                bindFormFromRow(rows[0]);
            } else {
                bindFormFromRow(null);
                if (isMobileView()) closeMobileModal();
            }
        }

        async function saveData() {
            if (!grid) return;
            const payload = [];
            const allData = grid.getData();

            for (let i = 0; i < allData.length; i++) {
                const d = allData[i];
                if (d.isNew || d.isUpdated) {
                    if (!d.jmCd || !String(d.jmCd).trim()) {
                        if (typeof showToast === 'function') showToast('종목코드를 입력해 주세요.', 'warning');
                        return;
                    }
                    payload.push(Object.assign({}, d, {
                        jasanGb: d.jasanGb || '1',
                        jsJongryu: d.jsJongryu || '1',
                        rowStatus: d.isNew ? 'C' : 'U'
                    }));
                }
            }
            deletedRows.forEach(function (d) {
                payload.push(d);
            });

            if (payload.length === 0) {
                if (typeof showToast === 'function') showToast('변경된 데이터가 없습니다.', 'info');
                return;
            }

            try {
                const headers = { 'Content-Type': 'application/json' };
                const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
                const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');
                if (csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;

                const res = await fetch(api + '/save?corpGr=' + encodeURIComponent(getCorpGr()), {
                    method: 'POST',
                    headers: headers,
                    credentials: 'same-origin',
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const result = await res.json();
                if (typeof showToast === 'function') {
                    showToast((result.savedCount || 0) + '건이 저장되었습니다.', 'success');
                }
                closeMobileModal();
                await loadData();
            } catch (err) {
                if (typeof showToast === 'function') showToast('저장 중 오류가 발생했습니다.', 'error');
            }
        }

        // 상단 공통 툴바 계약 바인딩
        pane.onSearch = function () { loadData(); };
        pane.onInput = function () { addNewRow(); };
        pane.onCopy = function () { copySelectedRow(); };
        pane.onDelete = function () { deleteSelectedRow(); };
        pane.onSave = function () { saveData(); };
        pane.onExcel = function () {
            if (grid) {
                grid.download('xlsx', '외화주식_종목등록.xlsx', { sheetName: '외화주식종목' });
            }
        };
        pane.onRefresh = pane.onClear = function () {
            deletedRows = [];
            selectedRow = null;
            if (grid) grid.clearData();
            bindFormFromRow(null);
            hasSucceededSearch = false;
            updateToolbarState();
            if (typeof showToast === 'function') showToast('화면이 초기화되었습니다.', 'info');
        };
        pane.onCorpGrChange = function () {
            loadAllDddws().then(function () {
                loadData();
            });
        };

        // 모바일 모달 버튼 바인딩
        const mCloseBtn = viewEl.querySelector('#ja035rMobileCloseBtn');
        const mOkBtn = viewEl.querySelector('#ja035rMobileOkBtn');
        const mSaveBtn = viewEl.querySelector('#ja035rMobileSaveBtn');
        const mRefreshBtn = viewEl.querySelector('#ja035rMobileRefreshBtn');
        if (mCloseBtn) mCloseBtn.addEventListener('click', closeMobileModal);
        if (mOkBtn) mOkBtn.addEventListener('click', closeMobileModal);
        if (mSaveBtn) mSaveBtn.addEventListener('click', saveData);
        if (mRefreshBtn) mRefreshBtn.addEventListener('click', function () {
            if (selectedRow) bindFormFromRow(selectedRow);
        });

        async function init() {
            if (initialized) return;
            initialized = true;
            bindFormEvents();
            await loadAllDddws();
            if (!gridBuilt) buildGrid();
            if (window.AamsSplitter && typeof window.AamsSplitter.init === 'function') {
                window.AamsSplitter.init(viewEl);
            }
            updateToolbarState();
            await loadData();
        }

        init();
    })();
    </script>
</div>
</html>

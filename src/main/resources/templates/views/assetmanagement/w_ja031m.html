<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container layout-single ja031m-container layout-mobile-stack-container" th:fragment="mainView" data-pgm-id="W_JA031M"
     th:attr="data-work-date=${workDate},data-corp-gr=${corpGr}"
     style="display: flex; flex-direction: column; height: 100%; width: 100%; overflow: hidden; background-color: #ffffff; position: relative;">

    <!-- 1. 상단 공통 툴바 -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
        </div>
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- 2. 상단 필터바 (dc_ymd_dddw 규격, 규칙 08 준수) -->
    <div class="filter-bar">
        <div class="filter-left">
            <div th:replace="~{fragments/filter/dc_ymd_dddw :: filter(labelYmd='영업일자', labelDddw='출금거래구분')}"></div>
            <span class="filter-guide-text" id="ja031mPeriodBadge"
                  style="color: #1e40af; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 4px; padding: 2px 10px; font-size: 12px; margin-left: 12px; display: inline-flex; align-items: center; gap: 5px; font-weight: 500;">
                <i class="fa-regular fa-calendar-days" style="color: #3b82f6;"></i>
                <span id="ja031mPeriodText">발생기간 : -</span>
            </span>
        </div>
    </div>

    <!-- 3. 메인 그리드 영역 (d_ja031m.srd 1:1 반영, Summary 없음, Zero-Count-Badge 준수) -->
    <div class="grid-section" style="flex: 1 1 auto; padding: 0 12px 10px; min-height: 0; display: flex; flex-direction: column;">
        <div class="sub-grid-header" style="display: flex; align-items: center; justify-content: space-between; min-height: 28px; padding: 4px 10px; background: #f8fafc; border: 1px solid #cbd5e1; border-bottom: 0; flex-shrink: 0;">
            <span class="sub-title" style="font-weight: 600; font-size: 13px; color: #1e293b;">
                <i class="fa-solid fa-money-bill-transfer" style="margin-right: 6px; color: #3b82f6;"></i>기타비용 출금등록 목록
            </span>
        </div>
        <div class="grid-table-wrapper" style="flex: 1 1 auto; min-height: 290px; border: 1px solid #cbd5e1; position: relative; overflow: hidden;">
            <div id="gridList" class="tabulator-aams-grid" style="height: 100%; width: 100%;"></div>
        </div>
    </div>

    <!-- 4. 화면 전용 스크립트 -->
    <script th:inline="javascript">
        (function () {
            const currentScript = document.currentScript;
            const pane = currentScript ? (currentScript.closest('.tab-pane') || currentScript.closest('.view-container')) : null;
            if (!pane) return;

            const api = '/api/assetmanagement/ja031m';
            const field = id => pane.querySelector('#' + id);

            let initialYmd = /*[[${ymd}]]*/ '';
            let workDate = /*[[${workDate}]]*/ '';
            const initialCorpGr = /*[[${corpGr}]]*/ '';

            let isInitialized = false;
            let dataRequest = 0;
            let codeRequest = 0;
            let gridList = null;
            let saving = false;
            let loading = false;
            const deletedList = [];

            // 날짜 포맷 헬퍼 (YYYYMMDD or YYYY.MM.DD -> YYYY-MM-DD)
            function toDashYmd(v) {
                if (!v) return '';
                const clean = String(v).replace(/[^0-9]/g, '');
                if (clean.length === 8) {
                    return `${clean.substring(0, 4)}-${clean.substring(4, 6)}-${clean.substring(6, 8)}`;
                }
                return v;
            }

            // 발생기간 안내 문구 계산 (w_ja031m.srw wue_lastopen 및 dw_c::itemchanged)
            // 기준일자가 속한 달의 직전월 1일 ~ 말일
            function updatePeriodText(targetYmd) {
                if (!targetYmd) return;
                const cleanYmd = toDashYmd(targetYmd);
                const parts = cleanYmd.split('-');
                if (parts.length < 3) return;
                const y = parseInt(parts[0], 10);
                const m = parseInt(parts[1], 10);

                let prevYear = y;
                let prevMonth = m - 1;
                if (prevMonth === 0) {
                    prevMonth = 12;
                    prevYear -= 1;
                }
                const fromStr = `${prevYear}.${String(prevMonth).padStart(2, '0')}.01`;
                const lastDay = new Date(prevYear, prevMonth, 0).getDate();
                const toStr = `${prevYear}.${String(prevMonth).padStart(2, '0')}.${String(lastDay).padStart(2, '0')}`;

                const span = pane.querySelector('#ja031mPeriodText');
                if (span) {
                    span.textContent = `발생기간 : ${fromStr} - ${toStr}`;
                }
            }

            // 과거 영업일자 관리 가능 여부 (w_ja031m.srw dw_c::ue_valid: object.ymd[1] >= idt_workdate)
            function isManageableDate() {
                const curYmd = toDashYmd(field('filterYmd') ? field('filterYmd').value : initialYmd);
                const wDate = toDashYmd(workDate);
                if (!curYmd || !wDate) return true;
                return curYmd >= wDate;
            }

            // 변경 상태 마킹
            function markRowUpdated(row) {
                if (!row) return;
                const d = row.getData();
                if (!d.isNew) {
                    d.isUpdated = true;
                    d.rowStatus = 'U';
                }
                const el = row.getElement();
                if (el) el.classList.add('row-modified');
            }

            // 관리번호(펀드) 검색 모달 (dw_list::ue_setcodesearch 'fund_cd')
            function openFundCdModal(row) {
                const data = row.getData();
                if (!data) return;
                const corpGr = (typeof resolveCorpGr === 'function') ? resolveCorpGr(pane) : initialCorpGr;

                if (window.DynamicCodeSearch && typeof window.DynamicCodeSearch.openModal === 'function') {
                    window.DynamicCodeSearch.openModal({
                        columnNm: 'fund_cd',
                        seq: 1,
                        corpGr: corpGr,
                        initialKeyword: data.fundCd || '',
                        onSelect: function (code, name, rowData) {
                            row.update({
                                fundCd: code,
                                xxFundCd: name,
                                fundNm: name
                            });
                            markRowUpdated(row);
                            lookupFundDetails(row, code);
                        }
                    });
                }
            }

            // 펀드 정보 및 수탁사 조회
            async function lookupFundDetails(row, fundCd) {
                if (!fundCd) return;
                const corpGr = (typeof resolveCorpGr === 'function') ? resolveCorpGr(pane) : initialCorpGr;
                try {
                    const res = await fetch(`${api}/fund-info?` + new URLSearchParams({ corpGr: corpGr, fundCd: fundCd }));
                    if (res.ok) {
                        const info = await res.json();
                        if (info) {
                            row.update({
                                xxFundCd: info.fundNm || (row.getData().xxFundCd || ''),
                                fundNm: info.fundNm || (row.getData().fundNm || ''),
                                trCoCd: info.mgCd || (row.getData().trCoCd || ''),
                                xxTrCoCd: info.xxMgCd || (row.getData().xxTrCoCd || '')
                            });
                        }
                    }
                } catch (err) {
                    console.warn('[w_ja031m] fund-info 조회 오류:', err);
                }
            }

            // Tabulator 그리드 초기화 (d_ja031m.srd 1:1, 규칙 04 준수)
            function initGrid() {
                const el = field('gridList');
                if (!el) return;

                const columns = [
                    {
                        title: "No.",
                        formatter: "rownum",
                        width: 55,
                        hozAlign: "center",
                        headerHozAlign: "center",
                        headerSort: false
                    },
                    {
                        title: "펀드번호",
                        field: "fundCd",
                        width: 140,
                        hozAlign: "center",
                        headerHozAlign: "center",
                        editor: "input",
                        editable: function (cell) {
                            const rowData = cell.getRow().getData();
                            return isManageableDate() && (rowData.isNew || !rowData.fundCd);
                        },
                        cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                        cellEdited: function (cell) {
                            const val = (cell.getValue() || '').trim().toUpperCase();
                            cell.setValue(val, true);
                            markRowUpdated(cell.getRow());
                            if (val) {
                                lookupFundDetails(cell.getRow(), val);
                            }
                        }
                    },
                    {
                        title: "",
                        field: "btnFundSearch",
                        width: 42,
                        hozAlign: "center",
                        headerHozAlign: "center",
                        headerSort: false,
                        formatter: function (cell) {
                            const rowData = cell.getRow().getData();
                            if (!isManageableDate() || (!rowData.isNew && rowData.fundCd)) {
                                return '<button type="button" class="btn-grid-addon" disabled style="opacity: 0.4; cursor: not-allowed;"><i class="fa-solid fa-magnifying-glass"></i></button>';
                            }
                            return '<button type="button" class="btn-grid-addon btn-search" title="펀드 검색"><i class="fa-solid fa-magnifying-glass"></i></button>';
                        },
                        cellClick: function (e, cell) {
                            e.stopPropagation();
                            const rowData = cell.getRow().getData();
                            if (!isManageableDate() || (!rowData.isNew && rowData.fundCd)) return;
                            openFundCdModal(cell.getRow());
                        }
                    },
                    {
                        title: "계좌명",
                        field: "fundNm",
                        minWidth: 220,
                        width: 280,
                        hozAlign: "left",
                        headerHozAlign: "center",
                        formatter: function (cell) {
                            return cell.getValue() || "";
                        }
                    },
                    {
                        title: "출금액",
                        field: "hwanibAek",
                        width: 160,
                        hozAlign: "right",
                        headerHozAlign: "center",
                        editor: "input",
                        editable: function () {
                            return isManageableDate();
                        },
                        cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                        formatter: function (cell) {
                            const val = cell.getValue();
                            if (val == null || val === '') return '<span style="color: #dc2626; font-weight: 500;">0.00</span>';
                            const num = Number(val);
                            const formatted = isNaN(num) ? '0.00' : num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                            return '<span style="color: #dc2626; font-weight: 500;">' + formatted + '</span>';
                        },
                        cellEdited: function (cell) {
                            const raw = cell.getValue();
                            const num = (raw != null && raw !== '') ? Number(String(raw).replace(/,/g, '')) : 0;
                            cell.setValue(isNaN(num) ? 0 : num, true);
                            markRowUpdated(cell.getRow());
                        }
                    },
                    {
                        title: "적요",
                        field: "bigo",
                        minWidth: 260,
                        hozAlign: "left",
                        headerHozAlign: "center",
                        editor: "input",
                        editable: function () {
                            return isManageableDate();
                        },
                        cellClick: (typeof aamsCellEdit === 'function') ? aamsCellEdit : undefined,
                        cellEdited: function (cell) {
                            markRowUpdated(cell.getRow());
                        }
                    }
                ];

                gridList = new Tabulator(el, {
                    layout: "fitDataFill",
                    height: "100%",
                    reactiveData: false,
                    placeholder: "조회된 데이터가 없습니다.",
                    selectableRows: 1,
                    editTriggerEvent: "click", // 원클릭 인라인 편집 진입 (규칙 04 준수)
                    columns: columns
                });
            }

            // 데이터 목록 조회 (w_ja031m.srw wue_retrieve)
            async function loadData() {
                if (!gridList || loading) return;
                const corpGr = (typeof resolveCorpGr === 'function') ? resolveCorpGr(pane) : initialCorpGr;
                const ymd = toDashYmd(field('filterYmd') ? field('filterYmd').value : initialYmd);
                const trCd = (field('filterDddw') && field('filterDddw').value) ? field('filterDddw').value : 'H11';

                if (!ymd || !trCd) {
                    if (typeof showToast === 'function') showToast('영업일자와 출금거래구분을 확인하십시오.', 'warning');
                    return;
                }

                loading = true;
                const reqId = ++dataRequest;
                deletedList.length = 0;

                try {
                    const params = new URLSearchParams({
                        corpGr: corpGr,
                        ymd: ymd,
                        trCd: trCd
                    });
                    const res = await fetch(`${api}/list?` + params.toString());
                    if (!res.ok) throw new Error('데이터 조회 중 오류가 발생했습니다.');
                    const data = await res.json();
                    if (reqId !== dataRequest) return;

                    const mapped = (data || []).map(d => {
                        d.isNew = false;
                        d.isUpdated = false;
                        d.isDeleted = false;
                        d.rowStatus = '';
                        d.originalFundCd = d.fundCd;
                        return d;
                    });

                    await gridList.setData(mapped);
                    if (mapped.length > 0) {
                        gridList.selectRow(gridList.getRows()[0]);
                    }
                } catch (err) {
                    if (reqId === dataRequest && typeof showToast === 'function') {
                        showToast(err.message, 'error');
                    }
                } finally {
                    if (reqId === dataRequest) loading = false;
                }
            }

            // 신규 행 추가 (w_ja031m.srw dw_list::ue_insertstart)
            async function addNewRow() {
                if (!gridList || loading || saving) return;
                if (!isManageableDate()) {
                    if (typeof showToast === 'function') showToast('과거 영업일자는 입력할 수 없습니다.', 'warning');
                    return;
                }

                const corpGr = (typeof resolveCorpGr === 'function') ? resolveCorpGr(pane) : initialCorpGr;
                const curYmd = toDashYmd(field('filterYmd') ? field('filterYmd').value : initialYmd);
                const trCd = (field('filterDddw') && field('filterDddw').value) ? field('filterDddw').value : 'H11';

                const newRowData = {
                    corpGr: corpGr,
                    trYmd: curYmd,
                    trCd: trCd,
                    fundCd: '',
                    xxFundCd: '',
                    fundNm: '',
                    hwanibAek: 0,
                    balAek: 0,
                    bigo: '',
                    trCoCd: '',
                    xxTrCoCd: '',
                    pVisible: 1,
                    isNew: true,
                    isUpdated: false,
                    isDeleted: false,
                    rowStatus: 'C'
                };

                const addedRow = await gridList.addRow(newRowData, false);
                if (addedRow) {
                    gridList.deselectRow();
                    addedRow.select();
                    setTimeout(() => {
                        if (typeof gridList.scrollToRow === 'function') {
                            gridList.scrollToRow(addedRow, 'center', false);
                        }
                        const targetCell = addedRow.getCell('fundCd');
                        if (targetCell) {
                            if (typeof targetCell.edit === 'function') {
                                targetCell.edit(true);
                            } else {
                                const cellEl = targetCell.getElement();
                                if (cellEl) cellEl.focus();
                            }
                        }
                    }, 50);
                }
            }

            // 행 삭제
            async function deleteSelectedRow() {
                if (!gridList) return;
                if (!isManageableDate()) {
                    if (typeof showToast === 'function') showToast('과거 영업일자는 삭제할 수 없습니다.', 'warning');
                    return;
                }
                const selectedRows = gridList.getSelectedRows();
                const row = selectedRows && selectedRows[0];
                if (!row) {
                    if (typeof showToast === 'function') showToast('삭제할 행을 선택하십시오.', 'warning');
                    return;
                }
                const d = row.getData();
                if (!d.isNew) {
                    d.isDeleted = true;
                    d.rowStatus = 'D';
                    deletedList.push(Object.assign({}, d));
                }
                await row.delete();
            }

            // 저장 실행 (w_ja031m.srw cb_save)
            async function saveData() {
                if (!gridList || saving || loading) return;
                if (!isManageableDate()) {
                    if (typeof showToast === 'function') showToast('과거 영업일자의 거래내역은 저장할 수 없습니다.', 'warning');
                    return;
                }

                const corpGr = (typeof resolveCorpGr === 'function') ? resolveCorpGr(pane) : initialCorpGr;
                const ymd = toDashYmd(field('filterYmd') ? field('filterYmd').value : initialYmd);
                const trCd = (field('filterDddw') && field('filterDddw').value) ? field('filterDddw').value : 'H11';

                const changedRows = [];
                gridList.getData().forEach(d => {
                    if (!d) return;
                    if (d.isNew || d.isUpdated || d.isDeleted) {
                        changedRows.push(d);
                    }
                });

                if (changedRows.length === 0 && deletedList.length === 0) {
                    if (typeof showToast === 'function') showToast('저장할 변경 내역이 없습니다.', 'info');
                    return;
                }

                saving = true;
                try {
                    const payload = {
                        corpGr: corpGr,
                        ymd: ymd,
                        trCd: trCd,
                        rows: changedRows,
                        deletedRows: deletedList
                    };

                    const res = await fetch(`${api}/save`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!res.ok) {
                        const errData = await res.json().catch(() => ({}));
                        throw new Error(errData.message || '저장 중 오류가 발생했습니다.');
                    }

                    const resJson = await res.json();
                    if (typeof showToast === 'function') {
                        showToast(resJson.message || '저장되었습니다.', 'success');
                    }
                    deletedList.length = 0;
                    await loadData();
                    await updateHighlightDates();
                } catch (err) {
                    if (typeof showToast === 'function') showToast(err.message, 'error');
                } finally {
                    saving = false;
                }
            }

            // 달력 하이라이트 일자 갱신 (w_ja031m.srw dw_c::ue_getdate)
            async function updateHighlightDates() {
                const corpGr = (typeof resolveCorpGr === 'function') ? resolveCorpGr(pane) : initialCorpGr;
                try {
                    const res = await fetch(`${api}/dates?` + new URLSearchParams({ corpGr: corpGr }));
                    if (res.ok) {
                        const dates = await res.json();
                        if (Array.isArray(dates) && window.AamsCalendar && typeof window.AamsCalendar.setHighlightDates === 'function') {
                            window.AamsCalendar.setHighlightDates('filterYmd', dates);
                        }
                    }
                } catch (err) {
                    console.warn('[w_ja031m] dates 조회 오류:', err);
                }
            }

            // 출금거래구분(dddw) 드롭다운 갱신 (w_ja031m.srw dw_c::ue_dddw_retrieve 및 itemchanged)
            async function refreshDddwSelect() {
                const reqId = ++codeRequest;
                const corpGr = (typeof resolveCorpGr === 'function') ? resolveCorpGr(pane) : initialCorpGr;
                const curYmd = toDashYmd(field('filterYmd') ? field('filterYmd').value : initialYmd);
                const isTodayWorkDate = (curYmd === toDashYmd(workDate));

                let dddwWhere = "szx1pt.obj_id='W_JA031M'";
                if (!isTodayWorkDate && curYmd) {
                    dddwWhere += ` and szx0gc.tr_cd in (select tr_cd from skt0hs where corp_gr='${corpGr}' and tr_ymd='${curYmd}')`;
                }

                try {
                    const prevVal = (field('filterDddw') && field('filterDddw').value) ? field('filterDddw').value : 'H11';
                    const targetSelect = field('filterDddw');
                    const dddwConfig = {
                        codeTitle: '코드',
                        nameTitle: '거래구분',
                        defaultVal: prevVal || 'H11'
                    };

                    if (window.f_dddwctl && typeof window.f_dddwctl === 'function') {
                        await window.f_dddwctl(targetSelect, 'dddw', corpGr, '', 1, dddwWhere, dddwConfig);
                    } else if (typeof initFilterDddw === 'function') {
                        await initFilterDddw(pane, Object.assign({
                            selectId: 'filterDddw',
                            dddwId: 'dddw',
                            corpGr: corpGr,
                            seq: 1,
                            addWhere: dddwWhere
                        }, dddwConfig));
                    }
                } catch (err) {
                    console.warn('[w_ja031m] dddw 옵션 갱신 오류:', err);
                }
            }

            function startInit() {
                if (isInitialized) return;
                isInitialized = true;

                initGrid();

                // 발생기간 안내 문구 초기화
                updatePeriodText(initialYmd);

                // 달력 컴포넌트 초기화 (AamsCalendar 표준 시그니처: init(inputId, options))
                if (window.AamsCalendar && typeof window.AamsCalendar.init === 'function') {
                    window.AamsCalendar.init('filterYmd', {
                        pane: pane,
                        initialYmd: initialYmd,
                        datesApiUrl: api + '/dates',
                        corpGr: (typeof resolveCorpGr === 'function') ? resolveCorpGr(pane) : initialCorpGr,
                        historyTitle: '거래 존재일',
                        onSelect: function (dateStr) {
                            // 날짜 변경 시 발생기간 및 거래구분 갱신 (규칙 08: 필터 변경 시 자동 조회 금지, 수동 조회 대기)
                            updatePeriodText(dateStr);
                            refreshDddwSelect();
                        }
                    });
                }

                // 날짜 인풋 직접 입력 변경 감지
                const inpYmd = field('filterYmd');
                if (inpYmd) {
                    inpYmd.addEventListener('change', () => {
                        updatePeriodText(inpYmd.value);
                        refreshDddwSelect();
                    });
                }

                updateHighlightDates();
                refreshDddwSelect();

                // 상단 공통 툴바 표준 계약 (규칙 08 준수)
                pane.onSearch = loadData;
                pane.onInput = addNewRow;
                pane.onDelete = deleteSelectedRow;
                pane.onSave = saveData;
                pane.onExcel = pane.onDetailExcel = function () {
                    if (gridList) {
                        const ymdRaw = toDashYmd(field('filterYmd') ? field('filterYmd').value : initialYmd).replace(/-/g, '');
                        gridList.download('xlsx', `기타비용출금등록_${ymdRaw}.xlsx`, { sheetName: '기타비용출금등록' });
                    }
                };

                pane.onRefresh = pane.onClear = async function () {
                    dataRequest++;
                    if (gridList) await gridList.clearData();
                    deletedList.length = 0;
                    if (field('filterYmd')) field('filterYmd').value = initialYmd;
                    updatePeriodText(initialYmd);
                    await refreshDddwSelect();
                    await updateHighlightDates();
                    if (typeof showToast === 'function') {
                        showToast('화면이 초기화되었습니다.', 'info');
                    }
                };

                pane.onCorpGrChange = async function (newCorpGr) {
                    pane.dataset.corpGr = newCorpGr || '';
                    deletedList.length = 0;
                    if (gridList) await gridList.clearData();
                    await refreshDddwSelect();
                    await updateHighlightDates();
                };

                // 규칙 08: 파워빌더 wt_list eb_direct_retrieve = FALSE이므로 초기 자동 조회 없음 (수동 조회 대기)
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', startInit, { once: true });
            } else {
                startInit();
            }
        })();
    </script>
</div>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="mainView" class="view-container layout-single layout-mobile-stack-container" th:attr="data-corp-gr=${corpGr},data-work-date=${ymd}">
    <div class="view-toolbar"><div class="toolbar-left"><div th:replace="~{fragments/tab_header :: toolbarButtons}"></div></div><div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div></div>
    <!-- dc_ymd_dddw: W_JA030D 매도일자·매매구분 -->
    <div class="filter-bar"><div class="filter-left"><div th:replace="~{fragments/filter/dc_ymd_dddw :: filter(labelYmd='매도일자',labelDddw='매매구분')}"></div></div></div>
    <section class="grid-section" aria-label="주식 매도 거래 목록"><div class="grid-table-wrapper"><div id="detail-grid" class="tabulator-aams-grid"></div></div></section>
    <script th:inline="javascript">
        (function(){
            const s=document.currentScript,pane=s?(s.closest('.tab-pane')||s.closest('.view-container')):null;if(!pane||pane.dataset.ja030dInitialized==='true')return;pane.dataset.ja030dInitialized='true';
            const api='/api/assetmanagement/ja030d',initialYmd=/*[[${ymd}]]*/'',field=id=>pane.querySelector('#'+id),num=v=>Number(v||0),txt=v=>String(v==null?'':v).trim(),ymd=v=>{const r=txt(v).replace(/\./g,'-');return /^\d{8}$/.test(r)?r.slice(0,4)+'-'+r.slice(4,6)+'-'+r.slice(6,8):r.slice(0,10);},corp=()=>resolveCorpGr(pane),editable=()=>ymd(field('filterYmd').value)>=ymd(pane.dataset.workDate),fmt=v=>typeof formatNumber==='function'?formatNumber(v,0):num(v).toLocaleString('ko-KR'),msg=(v,t)=>typeof showToast==='function'?showToast(v,t||'info'):alert(v);
            let grid,deleted=[],saving=false;
            const json=async(u,o)=>{const r=await fetch(u,o),b=await r.json().catch(()=>({}));if(!r.ok||b.success===false)throw new Error(b.message||'처리 중 오류가 발생했습니다.');return b;};
            function calc(row,key){const d=row.getData(),a=num(d.aekm),tr=num(d.trAek),up={isUpdated:!d.isNew};if(key==='aekm')up.trAek=a*num(d.danga);if(key==='trAek'){up.chuiAek=tr;up.comDanga=a?Math.trunc(tr/a*10000*100)/100:0;up.danga=a?tr/a:0;}if(key==='comDanga'){up.danga=num(d.comDanga)/10000;up.trAek=up.danga*a;}if(key==='sodukTax'){up.juminTax=Math.trunc(num(d.sodukTax)*.1/10)*10;up.ijaTax=num(d.sodukTax)+num(up.juminTax);}if(key==='juminTax')up.ijaTax=num(d.sodukTax)+num(d.juminTax);if(key==='ijaTax')up.sodukTax=num(d.ijaTax);row.update(up);}
            function gridInit(){grid=new Tabulator(field('detail-grid'),{height:'100%',layout:'fitDataFill',selectableRows:1,editTriggerEvent:'click',placeholder:'<span>조회된 주식 매도 거래가 없습니다.</span>',columnDefaults:{vertAlign:'middle',headerHozAlign:'center',headerSortTristate:true},columns:[
                {title:'No.',formatter:'rownum',width:48,hozAlign:'center',headerSort:false},{title:'매도일자',field:'trYmd',width:105,formatter:c=>ymd(c.getValue()),editor:window.aamsDateEditor||'input',editable,cellClick:aamsCellEdit},{title:'관리번호',field:'fundCd',width:105,hozAlign:'center',headerCssClass:'col-hdr-green',editor:'input',editable,cellClick:aamsCellEdit},{title:'계좌명',field:'xxFundCd',minWidth:140},{title:'종목',field:'jmCd',width:110,hozAlign:'center',editor:'input',editable,cellClick:aamsCellEdit},{title:'종목명',field:'xxJmCd',minWidth:160},{title:'매입일자',field:'buyDate',width:105},{title:'전일보유액면',field:'boyuAekm',width:115,hozAlign:'right',formatter:c=>fmt(c.getValue())},{title:'매도액면',field:'aekm',width:110,hozAlign:'right',formatter:c=>fmt(c.getValue()),editor:'number',editable,cellClick:aamsCellEdit,bottomCalc:'sum',bottomCalcFormatter:c=>fmt(c.getValue())},{title:'매도단가',field:'comDanga',width:110,hozAlign:'right',formatter:c=>fmt(c.getValue()),editor:'number',editable,cellClick:aamsCellEdit},{title:'매도금액',field:'trAek',width:120,hozAlign:'right',formatter:c=>fmt(c.getValue()),editor:'number',editable,cellClick:aamsCellEdit,bottomCalc:'sum',bottomCalcFormatter:c=>fmt(c.getValue())},{title:'수수료',field:'susu',width:100,hozAlign:'right',formatter:c=>fmt(c.getValue()),editor:'number',editable,cellClick:aamsCellEdit},{title:'제세금',field:'ijaTax',width:100,hozAlign:'right',formatter:c=>fmt(c.getValue()),editor:'number',editable,cellClick:aamsCellEdit},{title:'수도일자',field:'sudoYmd',width:105,formatter:c=>ymd(c.getValue()),editor:window.aamsDateEditor||'input',editable,cellClick:aamsCellEdit}
            ]});grid.on('cellEdited',c=>calc(c.getRow(),c.getField()));if(typeof setupTabulatorRowSelection==='function')setupTabulatorRowSelection(grid);if(window.AamsResponsive)window.AamsResponsive.bindGridResize(pane,[grid]);}
            async function retrieve(){const date=ymd(field('filterYmd').value),cd=txt(field('filterDddw').value);if(!date||!cd)return msg('매도일자와 매매구분을 선택하세요.','warning');const rows=await json(api+'/list?'+new URLSearchParams({corpGr:corp(),ymd:date,trCd:cd}));await grid.setData((rows||[]).map(r=>Object.assign({},r,{originalFundCd:r.fundCd,originalJmCd:r.jmCd,isNew:false,isUpdated:false})));deleted=[];}
            async function insert(){if(!editable())return msg('기준일 이전 거래는 수정할 수 없습니다.','warning');const d=ymd(field('filterYmd').value);const row=await grid.addRow({corpGr:corp(),trYmd:d,trCd:field('filterDddw').value,sudoYmd:d,aekm:0,danga:0,trAek:0,susu:0,isNew:true,isUpdated:false},true);grid.deselectRow();row.select();row.getCell('fundCd').edit();}
            async function remove(){const r=grid.getSelectedRows()[0];if(!r)return msg('삭제할 행을 선택하세요.','warning');if(!editable())return msg('기준일 이전 거래는 수정할 수 없습니다.','warning');const d=r.getData();if(!d.isNew)deleted.push(Object.assign({},d));await r.delete();}
            async function save(){if(saving)return;if(!editable())return msg('기준일 이전 거래는 수정할 수 없습니다.','warning');const items=grid.getData().filter(r=>r.isNew||r.isUpdated);if(!items.length&&!deleted.length)return msg('변경된 자료가 없습니다.','info');saving=true;try{const b={ymd:ymd(field('filterYmd').value),trCd:field('filterDddw').value,items:items,deletedList:deleted};const r=await json(api+'/save?'+new URLSearchParams({corpGr:corp()}),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});msg(r.message||'저장되었습니다.','success');await retrieve();}catch(e){msg(e.message||'저장하지 못했습니다.','error');}finally{saving=false;}}
            async function init(){gridInit();await initFilterDddw(pane,{selectId:'filterDddw',dddwId:'dddw',corpGr:corp(),seq:1,addWhere:"szx1pt.obj_id='W_JA030D'",defaultVal:'K13',codeTitle:'코드',nameTitle:'매매구분'});if(window.initFilterCalendar)window.initFilterCalendar(pane,{initialYmd:initialYmd});pane.onSearch=()=>retrieve().catch(e=>msg(e.message,'error'));pane.onInput=insert;pane.onDelete=remove;pane.onSave=save;pane.onExcel=()=>grid.download('xlsx','주식_매도거래_등록.xlsx',{sheetName:'주식매도거래'});pane.onRefresh=async()=>{deleted=[];field('filterYmd').value=initialYmd;await grid.clearData();};pane.onCorpGrChange=async v=>{pane.dataset.corpGr=v||'';deleted=[];await grid.clearData();};}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
        })();
    </script>
</div>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div class="view-container ja010b-container" th:fragment="ja010bView">

    <!-- Top Action Control Bar (Row 1) -->
    <div class="view-toolbar">
        <div class="toolbar-left">
            <!-- Reusable Common Toolbar Buttons Fragment (닫기 ~ 엑셀) -->
            <div th:replace="~{fragments/tab_header :: toolbarButtons}"></div>
            <!-- Page-specific Action Button for w_ja010b -->
            <button class="t-btn btn-action btn-pyungjan" onclick="onJa010bPyungjanCalc()"><i class="fa-solid fa-calculator"></i> 평잔재계산</button>
        </div>
        <!-- Reusable Common Breadcrumb Fragment -->
        <div th:replace="~{fragments/tab_header :: toolbarBreadcrumb}"></div>
    </div>

    <!-- Sub Filter Bar (Row 2: Common 운용사 Select Box: dddwId='CORP_GR', seq=1) -->
    <div th:replace="~{fragments/tab_header :: corpFilter(dddwId='CORP_GR', seq=1)}"></div>

    <!-- Upper Master Grid Section (dw_list / d_ja010b1.srd) -->
    <div class="grid-section master-grid-section">
        <div class="grid-table-wrapper" style="flex: 1; min-height: 260px;">
            <div id="grid-ja010b-master" class="tabulator-aams-grid"></div>
        </div>
    </div>

    <!-- Split Bar Separator -->
    <div class="split-divider"></div>

    <!-- Lower Split Panels (dw_detail + mle_special_note + dw_1) -->
    <div class="grid-section lower-split-section">
        <!-- Lower Left Detail Panel (dw_detail / d_ja010b2.srd / SZM0GI) -->
        <div class="split-panel panel-left" style="flex: 1;">
            <div class="sub-grid-header">
                <span class="sub-title"><i class="fa-solid fa-list-ol"></i> 결산기별 이력</span>
            </div>
            <div class="grid-table-wrapper" style="flex: 1; min-height: 220px;">
                <div id="grid-ja010b-detail" class="tabulator-aams-grid"></div>
            </div>
        </div>

        <!-- Lower Right Sub Panel (mle_special_note + dw_1 / d_szt0io.srd / SZT0IO) -->
        <div class="split-panel panel-right" style="flex: 1; display: flex; flex-direction: column;">
            
            <!-- Special Note Panel (mle_special_note in w_ja010b.srw) -->
            <div class="special-note-box">
                <div class="sub-grid-header">
                    <span class="sub-title"><i class="fa-solid fa-pen-to-square"></i> 특이사항 메모</span>
                </div>
                <textarea id="mleSpecialNote" class="aams-textarea" style="width: 100%; height: 50px; border: none; border-bottom: 1px solid #cbd5e1; padding: 6px; font-size: 12px; resize: none;" placeholder="특이사항 메모를 입력하세요..."></textarea>
            </div>

            <!-- IO Sub Grid Panel (dw_1 / d_szt0io.srd / SZT0IO) -->
            <div class="io-grid-box" style="flex: 1;">
                <div class="sub-grid-header">
                    <span class="sub-title"><i class="fa-solid fa-money-bill-transfer"></i> 입출금 내역</span>
                </div>
                <div class="grid-table-wrapper" style="flex: 1; min-height: 170px;">
                    <div id="grid-ja010b-io" class="tabulator-aams-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Inline Script for Ja010b View with Tabulator Grids -->
    <script th:inline="javascript">
        (function() {
            let gridMaster = null;
            let gridDetail = null;
            let gridIo = null;

            const initialMasterData = /*[[${masterList}]]*/ [];

            function numFmt(val) {
                if (val == null || val === "") return "0";
                return Number(val).toLocaleString('ko-KR');
            }

            function formatDateVal(val) {
                if (!val) return "";
                if (val.length === 8) {
                    return val.substring(0, 4) + '-' + val.substring(4, 6) + '-' + val.substring(6, 8);
                }
                return val;
            }

            // 1. Initialize Master Tabulator Grid
            function initMasterGrid() {
                const container = document.getElementById("grid-ja010b-master");
                if (!container) return;

                gridMaster = new Tabulator(container, {
                    data: initialMasterData || [],
                    layout: "fitDataFill",
                    height: "100%",
                    selectableRows: 1,
                    placeholder: "<span>조회된 계좌 계약정보가 없습니다.</span>",
                    columns: [
                        { title: "No.", formatter: "rownum", hozAlign: "center", width: 40 },
                        { title: "증권회사", field: "mgNm", minWidth: 90, formatter: cell => cell.getValue() || cell.getRow().getData().mgCd || '' },
                        { title: "고객명", field: "fundNm", minWidth: 120 },
                        { title: "관리번호", field: "fundCd", hozAlign: "center", width: 75 },
                        { title: "계좌번호", field: "acctNo", minWidth: 105, formatter: cell => cell.getValue() || cell.getRow().getData().encAcctNo || '' },
                        { title: "계좌관리그룹", field: "seriesGb", hozAlign: "center", minWidth: 85 },
                        { title: "고객<br/>유형", field: "typeGbNm", hozAlign: "center", minWidth: 75 },
                        {
                            title: "수수료(%)",
                            headerHozAlign: "center",
                            
                            columns: [
                                { title: "선취", field: "preBasic", hozAlign: "right", minWidth: 55 },
                                { title: "후취", field: "basicPer", hozAlign: "right", minWidth: 55 }
                            ]
                        },
                        { title: "목표<br/>수익(%)", field: "bmPer", hozAlign: "right", minWidth: 75 },
                        { title: "성과<br/>보수(%)", field: "successPer", hozAlign: "right", minWidth: 75 },
                        { title: "성과보수<br/>대상자산", field: "targetJasan", hozAlign: "center", minWidth: 95 },
                        { title: "최 초<br/>계약일", field: "fstSeoljYmd", hozAlign: "center", minWidth: 85, formatter: cell => formatDateVal(cell.getValue()) },
                        { title: "(재)<br/>계약일", field: "reSeoljYmd", hozAlign: "center", minWidth: 85, formatter: cell => formatDateVal(cell.getValue()) },
                        { title: "계약잔액", field: "reSeoljAek", hozAlign: "right", minWidth: 100, formatter: cell => numFmt(cell.getValue()) },
                        { title: "수수료<br/>비용처리", field: "expenseYn", hozAlign: "center", minWidth: 85, formatter: cell => `<input type="checkbox" ${cell.getValue() === 'Y' ? 'checked' : ''} disabled />` },
                        { title: "계약<br/>횟수", field: "gyulGi", hozAlign: "center", minWidth: 60 },
                        { title: "계약<br/>기간", field: "sintakGigan", hozAlign: "center", minWidth: 60 },
                        { title: "만기예정일", field: "afGyulYmd", hozAlign: "center", minWidth: 85, formatter: cell => formatDateVal(cell.getValue()) },
                        { title: "계약종료일", field: "haejiYmd", hozAlign: "center", minWidth: 85, formatter: cell => formatDateVal(cell.getValue()) },
                        { title: "운용역", field: "unyongSabun", hozAlign: "center", minWidth: 70 },
                        { title: "계좌별<br/>주식매매수수료율", field: "susuRt", hozAlign: "right", minWidth: 110 },
                        { title: "특이사항", field: "noteText", hozAlign: "center", minWidth: 65 },
                        { title: "이메일주소", field: "email1", minWidth: 120 }
                    ]
                });

                gridMaster.on("rowClick", function(e, row) {
                    gridMaster.deselectRow();
                    row.select();
                    const data = row.getData();
                    const specialNote = data.specialNote || "";
                    const mle = document.getElementById("mleSpecialNote");
                    if (mle) mle.value = specialNote;
                    if (data.fundCd) {
                        fetchJa010bSubGrids(data.fundCd);
                    }
                });

                // Auto select first row if exists
                gridMaster.on("tableBuilt", function() {
                    const rows = gridMaster.getRows();
                    if (rows && rows.length > 0) {
                        rows[0].select();
                        const data = rows[0].getData();
                        const mle = document.getElementById("mleSpecialNote");
                        if (mle) mle.value = data.specialNote || "";
                        if (data.fundCd) {
                            fetchJa010bSubGrids(data.fundCd);
                        }
                    }
                });
            }

            // 2. Initialize Detail Grid (d_ja010b2.srd)
            function initDetailGrid() {
                const container = document.getElementById("grid-ja010b-detail");
                if (!container) return;

                gridDetail = new Tabulator(container, {
                    layout: "fitColumns",
                    height: "100%",
                    placeholder: "<span>상단 목록에서 항목을 선택하세요.</span>",
                    columns: [
                        { title: "No.", formatter: "rownum", hozAlign: "center", width: 60 },
                        { title: "회<br/>기", field: "gyulGi", hozAlign: "center", width: 55 },
                        { title: "(전)<br/>결산일자", field: "bfGyulYmd", hozAlign: "center", width: 95, formatter: cell => formatDateVal(cell.getValue()) },
                        { title: "(당)<br/>결산일자", field: "afGyulYmd", hozAlign: "center", width: 95, formatter: cell => formatDateVal(cell.getValue()) },
                        { title: "구간<br/>일수", field: "ilsu", hozAlign: "center", width: 70 },
                        { title: "결산기<br/>손익액", field: "giSonikAek", hozAlign: "right", minWidth: 100, formatter: cell => numFmt(cell.getValue()) },
                        { title: "워터마크<br/>대상원본", field: "wmSeoljAek", hozAlign: "right", minWidth: 110, formatter: cell => numFmt(cell.getValue()) },
                        { title: "계약<br/>종료일", field: "haejiYmd", hozAlign: "center", width: 95, formatter: cell => formatDateVal(cell.getValue()) }
                    ]
                });
            }

            // 3. Initialize IO Grid (d_szt0io.srd)
            function initIoGrid() {
                const container = document.getElementById("grid-ja010b-io");
                if (!container) return;

                gridIo = new Tabulator(container, {
                    layout: "fitColumns",
                    height: "100%",
                    placeholder: "<span>상단 목록에서 항목을 선택하세요.</span>",
                    columns: [
                        { title: "No.", formatter: "rownum", hozAlign: "center", width: 45 },
                        { title: "입출일자", field: "trYmd", hozAlign: "center", width: 95, formatter: cell => formatDateVal(cell.getValue()) },
                        { title: "입금액", field: "inAek", hozAlign: "right", minWidth: 95, formatter: cell => numFmt(cell.getValue()) },
                        { title: "출금액", field: "outAek", hozAlign: "right", minWidth: 95, formatter: cell => numFmt(cell.getValue()) },
                        { title: "입출금조정액", field: "ioJo", hozAlign: "right", minWidth: 100, formatter: cell => numFmt(cell.getValue()) },
                        { title: "계약잔액", field: "wonbonAek", hozAlign: "right", minWidth: 100, formatter: cell => numFmt(cell.getValue()) },
                        { title: "운용잔여일", field: "giganIlsu", hozAlign: "center", width: 80 },
                        { title: "경과일수", field: "passIlsu", hozAlign: "center", width: 70 }
                    ]
                });
            }

            // Global functions for controller integration
            window.loadJa010bMaster = function(corpGr) {
                const filterSelect = document.getElementById("filterCorpGr");
                const corp = corpGr || (filterSelect ? filterSelect.value : "2200");
                fetch('/api/account/ja010b/master?corpGr=' + encodeURIComponent(corp))
                    .then(res => res.json())
                    .then(data => {
                        if (gridMaster) {
                            gridMaster.setData(Array.isArray(data) ? data : []);
                            if (Array.isArray(data) && data.length > 0) {
                                setTimeout(() => {
                                    const rows = gridMaster.getRows();
                                    if (rows && rows.length > 0) {
                                        rows[0].select();
                                        const d = rows[0].getData();
                                        const mle = document.getElementById("mleSpecialNote");
                                        if (mle) mle.value = d.specialNote || "";
                                        if (d.fundCd) fetchJa010bSubGrids(d.fundCd);
                                    }
                                }, 100);
                            } else {
                                if (gridDetail) gridDetail.setData([]);
                                if (gridIo) gridIo.setData([]);
                                const mle = document.getElementById("mleSpecialNote");
                                if (mle) mle.value = "";
                            }
                        }
                    })
                    .catch(err => console.error("Error loading master ja010b:", err));
            };

            function fetchJa010bSubGrids(fundCd) {
                const filterSelect = document.getElementById("filterCorpGr");
                const corpGr = filterSelect ? filterSelect.value : "2200";

                fetch(`/api/account/ja010b/detail?corpGr=${encodeURIComponent(corpGr)}&fundCd=${encodeURIComponent(fundCd)}`)
                    .then(res => res.json())
                    .then(data => {
                        if (gridDetail) gridDetail.setData(Array.isArray(data) ? data : []);
                    })
                    .catch(err => console.error("Error fetching detail:", err));

                fetch(`/api/account/ja010b/io?corpGr=${encodeURIComponent(corpGr)}&fundCd=${encodeURIComponent(fundCd)}`)
                    .then(res => res.json())
                    .then(data => {
                        if (gridIo) gridIo.setData(Array.isArray(data) ? data : []);
                    })
                    .catch(err => console.error("Error fetching IO:", err));
            }

            // Initialize all 3 grids on view load
            initMasterGrid();
            initDetailGrid();
            initIoGrid();

            // Retrieve active corpGr from cookie (savedCorpGr / corpGr)
            const activeCorpGr = (typeof getCookie === 'function' ? (getCookie('savedCorpGr') || getCookie('corpGr')) : null);
            if (!activeCorpGr || !activeCorpGr.trim()) {
                alert('비정상적인 접근입니다.');
                if (typeof handleLogout === 'function') {
                    handleLogout();
                } else {
                    window.location.href = '/login';
                }
                return;
            }

            const adminYn = /*[[${adminYn}]]*/ "N";

            // Show full list if adminYn == 'Y'. Otherwise, append 'corp_gr = :activeCorpGr'!
            let addWhere = null;
            if (adminYn !== 'Y') {
                addWhere = `corp_gr = '${activeCorpGr}'`;
            }

            // Load DDDW filter options dynamically (dddwId='CORP_GR', seq=1)
            if (typeof loadDddwOptions === 'function') {
                loadDddwOptions("filterCorpGr", "CORP_GR", 1, addWhere, null, activeCorpGr);
            }
        })();

        function onJa010bPyungjanCalc() {
            const mle = document.getElementById("mleSpecialNote");
            if (confirm("선택한 계좌의 평잔 재계산 작업을 진행하시겠습니까?")) {
                alert("평잔 재계산 작업이 완료되었습니다.");
            }
        }

        function onJa010bInput() { alert("신규 입력을 진행합니다."); }
        function onJa010bSave() { alert("변경사항이 저장되었습니다."); }
        function onJa010bExcel() { alert("엑셀 다운로드를 진행합니다."); }
    </script>
</div>
</html>

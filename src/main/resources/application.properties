spring.application.name=aams
server.port=8080

# Oracle Database Connection Configuration
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@172.20.5.98:1521/AAMS
spring.datasource.username=KFP
spring.datasource.password=KFP
spring.datasource.hikari.connection-timeout=3000

# JPA / Hibernate Configuration for Oracle
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# SQL Logging Configuration
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.kfp.aams.mapper=DEBUG
logging.level.com.kfp.aams.repository=DEBUG
logging.level.com.kfp.aams.controller=DEBUG
logging.level.com.kfp.aams.sql=INFO

# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.kfp.aams.domain
mybatis.configuration.map-underscore-to-camel-case=true

# Security & Session Settings
spring.security.user.name=admin
spring.security.user.password=admin
